name: Materialize verified INEP catalog batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/materialize-inep-20260818.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified INEP source products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          root=pathlib.Path('.')
          rpath=root/'data/data_resources.csv'
          ppath=root/'data/data_products.csv'
          dpath=root/'data/product_distributions.csv'
          def ids(path,key):
              with path.open(encoding='utf-8',newline='') as f: return {r[key] for r in csv.DictReader(f)}
          rids,pids,dids=ids(rpath,'resource_id'),ids(ppath,'product_id'),ids(dpath,'distribution_id')
          assert 'DR0125' not in rids and all(f'DP{i:06d}' not in pids for i in range(735,745)) and all(f'DD{i:06d}' not in dids for i in range(766,776))
          source={
          'resource_id':'DR0125','resource_name':'Dados Abertos, Avaliações e Indicadores Educacionais — INEP','acronym':'INEP Dados Abertos','official_identity':'Instituto Nacional de Estudos e Pesquisas Educacionais Anísio Teixeira — dados abertos, censos, avaliações e indicadores','description':'Fonte institucional do INEP para microdados, resultados, indicadores e documentação de censos educacionais, avaliações e exames nacionais. Reúne operações distintas que devem preservar população-alvo, desenho, edição, privacidade e unidade analítica próprias.','homepage_url':'https://www.gov.br/inep/pt-br','data_access_url':'https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos','research_areas':'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados','keywords':'educação | censo escolar | ensino superior | Saeb | Ideb | Enem | avaliações | microdados','data_product_types':'microdados | indicadores | resultados agregados | sinopses | painéis | documentação metodológica','data_formats':'ZIP | CSV | planilhas | PDF | visualização web; varia por produto','visualization_types':'painéis | tabelas | relatórios | downloads','geographic_coverage':'Brasil; recortes nacional, regional, UF, município, escola/instituição ou participante conforme operação e regras de divulgação','covers_brazil':'sim','spatial_resolution':'varia por operação e regra de divulgação; não pressupor geolocalização individual','temporal_coverage':'varia por censo, avaliação, exame e indicador; séries históricas extensas em vários produtos','temporal_resolution':'anual | bienal | por edição conforme produto','data_sources':'censos educacionais | questionários | avaliações padronizadas | exames | registros declarados por instituições e redes','free_download':'sim','access_conditions':'aberto nos produtos públicos; microdados são tratados para proteção de dados pessoais e podem ter estrutura de divulgação alterada por LGPD','programmatic_access':'desconhecido','access_protocols':'HTTP download | páginas de resultados | painéis web','authentication_required':'não','access_documentation_url':'https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados','license':'licença específica deve ser verificada por arquivo; conteúdo do portal gov.br possui termos próprios','institutional_status':'público','owner_or_manager':'INEP / Ministério da Educação','academic_uses':'Pesquisa em educação, desigualdades educacionais, avaliação de políticas públicas, desempenho, fluxo escolar, acesso e características institucionais.','limitations':'Operações possuem universos, amostras, instrumentos e regras de privacidade diferentes. Microdados públicos podem ser simplificados, anonimizados ou reestruturados; resultados agregados e indicadores não devem ser confundidos com registros individuais ou causalidade educacional.','academic_evidence_type':'documentação oficial','academic_evidence_url':'https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados','academic_evidence_note':'O portal oficial documenta microdados e resultados das operações educacionais; cada produto requer leitura de dicionário, notas técnicas e metodologia da edição usada.','verification_url':'https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos','last_verified':'2026-08-18'}
          products=[
          ('DP000735','Microdados do Censo Escolar da Educação Básica 2025','Censo Escolar 2025','Censo Escolar da Educação Básica','dataset_series','Microdados públicos da edição 2025 do Censo Escolar, com informações detalhadas sobre estabelecimentos, turmas, matrículas, profissionais e oferta educacional conforme estrutura pública definida pelo INEP.','censo escolar | educação básica | escolas | matrículas | docentes | turmas','Brasil — educação básica; recortes dependem das variáveis públicas','registro educacional censitário público; unidade varia por tabela/arquivo','ano letivo 2025','anual','2025','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/censo-escolar','https://www.gov.br/inep/pt-br/areas-de-atuacao/pesquisas-estatisticas-e-indicadores/censo-escolar','primário','Censo administrativo/estatístico da educação básica, não pesquisa domiciliar. Estrutura pública é tratada para privacidade; variáveis e identificadores disponíveis podem mudar entre edições. Matrícula não equivale a pessoa única quando a regra analítica admite múltiplos vínculos.'),
          ('DP000736','Microdados do Censo da Educação Superior 2024','Censo Superior 2024','Censo da Educação Superior','dataset_series','Microdados públicos da edição 2024 do Censo da Educação Superior sobre instituições, cursos, docentes e vínculos discentes, conforme estrutura de divulgação do INEP.','ensino superior | instituições | cursos | docentes | estudantes | censo','Brasil — instituições e cursos de educação superior','registro censitário público; unidade varia por arquivo','ano de referência 2024','anual','2024','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/censo-da-educacao-superior','https://www.gov.br/inep/pt-br/areas-de-atuacao/pesquisas-estatisticas-e-indicadores/censo-da-educacao-superior','primário','Dados censitários declarados por instituições e tratados para divulgação pública. Vínculo discente não deve ser automaticamente interpretado como pessoa única; comparar anos exige verificar mudanças de layout, conceito e política de privacidade.'),
          ('DP000737','Saeb 2023 — microdados e resultados','Saeb 2023','Sistema de Avaliação da Educação Básica — Saeb','dataset_series','Edição 2023 do Saeb, com microdados, planilhas de resultados, notas técnicas e relatórios de proficiência e eixos de qualidade para populações e amostras definidas pela avaliação.','Saeb | proficiência | avaliação educacional | aprendizagem | questionários','Brasil; resultados agregados para Brasil, regiões, UFs, municípios e escolas quando critérios de divulgação são atendidos','participante/escola/amostra ou agregado conforme arquivo','edição 2023','por edição','2023; página atualizada em 2026','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/saeb/resultados/2023','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/saeb','primário','Avaliação padronizada com populações-alvo, amostragem e critérios de divulgação próprios. Proficiência e questionários não medem isoladamente qualidade escolar causal; comparações exigem escalas, pesos e desenho da edição.'),
          ('DP000738','Índice de Desenvolvimento da Educação Básica — Ideb 2023','Ideb 2023','Ideb','indicator_family','Resultados do Ideb 2023, indicador que combina desempenho do Saeb com rendimento/fluxo escolar do Censo Escolar, divulgado para níveis territoriais e escolas quando aplicável.','Ideb | indicador educacional | Saeb | rendimento escolar | fluxo','Brasil; Brasil, regiões, UFs, municípios e escolas conforme critérios de divulgação','agregação educacional/territorial','2005–2023; edição corrente auditada 2023','bienal','2023','https://www.gov.br/inep/pt-br/areas-de-atuacao/pesquisas-estatisticas-e-indicadores/ideb/resultados','https://www.gov.br/inep/pt-br/areas-de-atuacao/pesquisas-estatisticas-e-indicadores/ideb','derivado','Ideb é indicador composto derivado de Saeb e rendimento escolar, não medida direta e completa de qualidade educacional. Resultados ausentes podem decorrer de critérios de cálculo/divulgação; comparar unidades exige contexto de etapa e rede.'),
          ('DP000739','Microdados do Enem 2025','Enem 2025','Exame Nacional do Ensino Médio — Enem','dataset_series','Microdados públicos do Enem 2025 com informações divulgáveis sobre inscritos/participantes, provas, itens, notas, gabaritos e questionário, conforme pacote oficial do INEP.','Enem | exame | desempenho | redação | questionário | ensino médio','Brasil; participantes do Enem 2025','participante/inscrição e itens de prova conforme arquivo público','edição 2025','anual','2025; página atualizada em 2026-07-27','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/enem','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enem','primário','Participantes do Enem não formam amostra probabilística de todos os jovens ou concluintes do ensino médio. Notas dependem de participação e regras do exame; microdados públicos são tratados para privacidade e não devem ser usados para reidentificação.'),
          ('DP000740','Microdados do Encceja 2025','Encceja 2025','Encceja','dataset_series','Microdados públicos da edição 2025 do Exame Nacional para Certificação de Competências de Jovens e Adultos.','Encceja | EJA | certificação | exame | desempenho','Brasil; participantes da edição 2025','participante/inscrição conforme arquivo público','edição 2025','anual/por edição','2025; página atualizada em 2026-07-14','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/encceja','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/encceja','primário','Participantes são população autoselecionada elegível ao exame, não amostra da população geral de jovens e adultos. Certificação e desempenho devem ser interpretados conforme regras, áreas e edição.'),
          ('DP000741','Microdados do Enamed 2025','Enamed 2025','Exame Nacional de Avaliação da Formação Médica — Enamed','dataset_series','Microdados públicos da edição 2025 do Enamed, exame nacional de avaliação da formação médica disponibilizado pelo INEP.','Enamed | medicina | avaliação | ensino superior | formação médica','Brasil; participantes/cursos abrangidos pela edição 2025','participante/curso conforme arquivo público','edição 2025','por edição','2025','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/enamed','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais','primário','Resultados de exame não equivalem isoladamente à qualidade global do curso, competência clínica completa ou desempenho profissional futuro. Interpretar conforme população-alvo, regras e instrumentos da edição.'),
          ('DP000742','Microdados da Prova Nacional Docente 2025','PND 2025','Prova Nacional Docente — PND','dataset_series','Microdados públicos da edição 2025 da Prova Nacional Docente disponibilizados pelo INEP.','PND | docentes | licenciaturas | avaliação | seleção docente','Brasil; participantes da PND 2025','participante conforme arquivo público','edição 2025','por edição','2025; microdados publicados em 2026','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/pnd','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais','primário','Desempenho na PND não equivale à qualidade completa da prática docente nem representa todos os professores brasileiros. Usos em seleção dependem de adesão e regras dos entes/edição.'),
          ('DP000743','Microdados do Enade 2023','Enade 2023','Exame Nacional de Desempenho dos Estudantes — Enade','dataset_series','Microdados públicos da edição 2023 do Enade para áreas/cursos avaliados, com informações de desempenho e questionários conforme estrutura divulgada pelo INEP.','Enade | ensino superior | cursos | desempenho | estudantes','Brasil; concluintes/cursos abrangidos pela edição 2023','participante/curso conforme arquivo público','edição 2023','por ciclo/edição','2023; microdados atualizados em 2025-04-24','https://www.gov.br/inep/pt-br/acesso-a-informacao/dados-abertos/microdados/enade','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/enade','primário','Cobertura depende das áreas avaliadas no ciclo e das regras de participação. Resultados de estudantes/cursos não devem ser tratados como medida causal ou completa de qualidade institucional.'),
          ('DP000744','Avaliação da Alfabetização 2025 — resultados e microdados','Alfabetização 2025','Avaliação da Alfabetização','dataset_series','Resultados, metas e microdados da Avaliação da Alfabetização divulgados pelo INEP para 2025, com resultados para Brasil/UF e municípios conforme rede e critérios da avaliação.','alfabetização | avaliação | proficiência | anos iniciais | educação básica','Brasil; Brasil, UFs e municípios conforme rede/critérios de divulgação','participante/agregado conforme arquivo','edição 2025','por edição','2025; resultados atualizados em 2026-04-01','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/avaliacao-da-alfabetizacao/resultados','https://www.gov.br/inep/pt-br/areas-de-atuacao/avaliacao-e-exames-educacionais/avaliacao-da-alfabetizacao','primário','Resultados dependem do desenho, população-alvo, escala e critérios de divulgação. Proficiência não equivale a diagnóstico individual completo nem permite atribuição causal direta a políticas ou escolas.')]
          p_rows=[]
          for x in products:
              pid,name,acr,fam,kind,desc,kw,geo,support,temp,tres,ver,url,method,pd,lim=x
              p_rows.append({'product_id':pid,'resource_id':'DR0125','product_name':name,'product_acronym':acr,'product_family':fam,'product_kind':kind,'product_description':desc,'research_areas':'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados','keywords':kw,'geographic_coverage':geo,'covers_brazil':'sim','spatial_support':support,'spatial_resolution':'não se aplica como resolução cartográfica única; nível territorial/institucional conforme arquivo','temporal_coverage':temp,'temporal_resolution':tres,'update_frequency':'por edição conforme calendário do INEP','product_status':'ativo','version_or_collection':ver,'enumeration_scope':'complete','product_page_url':url,'methodology_url':method,'primary_or_derived':pd,'limitations':lim,'last_verified':'2026-08-18'})
          drows=[]
          for i,p in enumerate(p_rows,766):
              drows.append({'distribution_id':f'DD{i:06d}','product_id':p['product_id'],'distribution_name':p['product_acronym']+' — acesso oficial INEP','access_url':p['product_page_url'],'format':'ZIP | CSV | planilhas | PDF | arquivos auxiliares; verificar pacote da edição','access_protocol':'HTTP download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; respeitar documentação, regras de privacidade, dicionários e notas técnicas da edição','license':'licença específica do arquivo deve ser verificada; não inferida além dos termos do portal','provider_attribution_required':'sim','subset_support':'por arquivo/tabela/edição; filtros adicionais quando houver painel','notes':'Distribuição oficial do INEP. Estrutura, variáveis e granularidade devem ser confirmadas no pacote e documentação da edição antes de combinar séries.','last_verified':'2026-08-18'})
          def append(path,row_or_rows):
              rows=row_or_rows if isinstance(row_or_rows,list) else [row_or_rows]
              with path.open(encoding='utf-8',newline='') as f: fields=next(csv.reader(f))
              with path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n');
                  for row in rows:
                      extra=set(row)-set(fields); missing=set(fields)-set(row)
                      assert not extra and not missing,(extra,missing)
                      w.writerow(row)
          append(rpath,source); append(ppath,p_rows); append(dpath,drows)
          pri=root/'data/brazil_scope_priorities.json'
          obj=json.loads(pri.read_text(encoding='utf-8'))
          p0=next(t for t in obj['tiers'] if t['priority_tier']=='P0')
          assert 'DR0125' not in p0['resource_ids']; p0['resource_ids'].append('DR0125'); obj['reviewed_at']='2026-08-18'
          pri.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('appended',len(p_rows),'products',len(drows),'distributions')
          PY
      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          from pathlib import Path
          def read(p):
            with open(p,encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          rs=read('data/data_resources.csv'); ps=read('data/data_products.csv'); ds=read('data/product_distributions.csv')
          assert any(x['resource_id']=='DR0125' for x in rs)
          assert all(any(x['product_id']==f'DP{i:06d}' and x['resource_id']=='DR0125' for x in ps) for i in range(735,745))
          assert all(any(x['distribution_id']==f'DD{i:06d}' for x in ds) for i in range(766,776))
          rid={x['resource_id'] for x in rs}; pid={x['product_id'] for x in ps}
          assert all(x['resource_id'] in rid for x in ps)
          assert all(x['product_id'] in pid for x in ds)
          assert len({x['resource_id'] for x in rs})==len(rs)
          assert len({x['product_id'] for x in ps})==len(ps)
          assert len({x['distribution_id'] for x in ds})==len(ds)
          print('COUNTS',len(rs),len(ps),len(ds))
          PY
      - name: Commit materialized batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'vitrine-catalog-bot'
          git config user.email 'vitrine-catalog-bot@users.noreply.github.com'
          git rm .github/workflows/materialize-inep-20260818.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/link_role_audit.json data/data_quality_report.json 2>/dev/null || true
          git status --short
          git commit -m 'Expand verified INEP education catalog'
          git push origin HEAD:main
