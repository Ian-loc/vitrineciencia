name: Materialize verified IBGE atlas batch v2

on:
  push:
    branches: ["audit/ibge-atlas-20260816"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-atlas-20260816
          fetch-depth: 0

      - name: Reuse audited append payload from validated attempt
        run: |
          git show 0c24693856a903e4526c4e25db712f7542648b7e:.github/workflows/materialize-atlas-batch.yml > /tmp/atlas-old.yml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/atlas-old.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          payload = "\n".join(line[10:] if line.startswith('          ') else line for line in lines) + "\n"
          Path('/tmp/append_atlas.py').write_text(payload, encoding='utf-8')
          PY
          python3 /tmp/append_atlas.py

      - name: Rebuild and validate consolidated batch
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=list(csv.DictReader(Path('data/data_products.csv').open(encoding='utf-8-sig')))
          d=list(csv.DictReader(Path('data/product_distributions.csv').open(encoding='utf-8-sig')))
          assert len(p)==192, len(p)
          assert len(d)==213, len(d)
          assert len({r['product_id'] for r in p}) == len(p)
          assert len({r['distribution_id'] for r in d}) == len(d)
          pids={r['product_id'] for r in p}
          assert all(r['product_id'] in pids for r in d)
          for pid in ['DP000192','DP000193','DP000194','DP000195']:
              assert sum(r['product_id']==pid for r in p)==1
              assert sum(r['product_id']==pid for r in d)>=1
          print('OK read-back: 85 sources; 192 products; 213 distributions')
          PY

      - name: Commit validated batch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-atlas-batch-v2.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json assets/build-meta.js
          git add -u
          git commit -m "Expand verified IBGE atlas catalog"
          git push origin HEAD:audit/ibge-atlas-20260816
