name: Vitrine audit 120
on:
  push:
    branches: [agent/vitrine-audit-120]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-120]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-audit-120
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified IBGE geodetic batch
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          today='2026-08-15'
          def append_dict(path, row):
              p=Path(path)
              with p.open(encoding='utf-8-sig', newline='') as f:
                  r=csv.DictReader(f); fields=r.fieldnames; rows=list(r)
              key=fields[0]
              if any(x[key]==row[key] for x in rows):
                  raise SystemExit(f'duplicate {key}: {row[key]}')
              missing=set(fields)-set(row)
              extra=set(row)-set(fields)
              if missing or extra:
                  raise SystemExit(f'columns mismatch {path}: missing={missing} extra={extra}')
              with p.open('a', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  w.writerow(row)
          append_dict('data/data_resources.csv', {
            'resource_id':'DR0075','resource_name':'Redes Geodésicas — IBGE','acronym':'Redes Geodésicas IBGE','official_identity':'Tema institucional de Redes Geodésicas do Sistema Geodésico Brasileiro — IBGE','description':'Conjunto institucional de redes e serviços geodésicos mantidos pelo IBGE para posicionamento, referência altimétrica e monitoramento contínuo, incluindo RBMC e RMPG.','homepage_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','data_access_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','research_areas':'Geodesy | Earth observation | Sea-level science | Geospatial information science','keywords':'geodésia | GNSS | RBMC | RMPG | nível do mar | SIRGAS2000 | IBGE','data_product_types':'séries de observações GNSS | séries maregráficas | serviços de correção em tempo real | metadados de estações','data_formats':'RINEX 2 | RINEX 3 | RTCM | arquivos de nível do mar e meteorologia | formatos variáveis por produto','visualization_types':'mapa de estações | séries temporais | situação operacional | downloads','geographic_coverage':'Brasil; estações e séries conforme rede','covers_brazil':'sim','spatial_resolution':'estações geodésicas pontuais; densidade e cobertura variam por rede','temporal_coverage':'RBMC desde 1995 nos arquivos públicos; RMPG com séries conforme estação; operação corrente','temporal_resolution':'1 s ou 15 s em produtos RBMC; intervalos próprios por variável/estação na RMPG','data_sources':'receptores GNSS de alta precisão | sensores maregráficos | sensores meteorológicos associados','free_download':'parcial','access_conditions':'downloads e consulta pública conforme produto; RBMC-IP exige cadastro e configuração NTRIP','programmatic_access':'parcial','access_protocols':'HTTPS download | NTRIP/RTCM | serviços web conforme produto','authentication_required':'parcial','access_documentation_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','license':'licença e condições devem ser verificadas por produto; RMPG solicita citação do IBGE e orienta download direto pelo portal','institutional_status':'público','owner_or_manager':'IBGE — Diretoria de Geociências / Coordenação de Geodésia','academic_uses':'Posicionamento geodésico, deformação e referência espacial, monitoramento do nível do mar, geodinâmica, calibração e validação de dados geoespaciais.','limitations':'Redes têm estações, sensores, disponibilidade operacional, intervalos e convenções próprias; lacunas por falha de transmissão ou energia e mudanças instrumentais precisam ser consideradas por série.','academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','academic_evidence_note':'A página oficial distingue RBMC, RMPG e demais redes geodésicas como produtos próprios do Sistema Geodésico Brasileiro.','verification_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','last_verified':today})
          products=[
          {'product_id':'DP000130','resource_id':'DR0075','product_name':'RBMC — Rede Brasileira de Monitoramento Contínuo dos Sistemas GNSS','product_acronym':'RBMC','product_family':'Redes Geodésicas — observações GNSS','product_kind':'dataset_series','product_description':'Rede contínua de estações GNSS de alto desempenho do IBGE que disponibiliza observações para determinação de coordenadas, com arquivos diários e dados em diferentes intervalos e versões RINEX.','research_areas':'Geodesy | GNSS | Geodynamics | Geospatial information science','keywords':'RBMC | GNSS | RINEX | SIRGAS2000 | posicionamento | geodésia | IBGE','geographic_coverage':'Brasil — estações distribuídas no território nacional','covers_brazil':'sim','spatial_support':'estações geodésicas pontuais | séries de observações GNSS','spatial_resolution':'pontual por estação; densidade espacial varia conforme a rede ativa','temporal_coverage':'arquivos públicos desde 1995; operação corrente','temporal_resolution':'1 s em estações elegíveis RINEX 3; 15 s em produtos RINEX 2/3','update_frequency':'diária e contínua conforme produto/estação','product_status':'ativo','version_or_collection':'RINEX 2 e RINEX 3; dados de 1 s disponibilizados gradualmente desde 2020','enumeration_scope':'family_level','product_page_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16258-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-rbmc.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16258-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-rbmc.html?lang=pt-BR','primary_or_derived':'primário','limitations':'Disponibilidade, constelações rastreadas, receptor, intervalo e formato variam por estação e época. Falhas operacionais geram lacunas; registrar estação, data, intervalo e versão RINEX usados.','last_verified':today},
          {'product_id':'DP000131','resource_id':'DR0075','product_name':'RBMC-IP — posicionamento GNSS em tempo real','product_acronym':'RBMC-IP','product_family':'Redes Geodésicas — serviços GNSS em tempo real','product_kind':'data_service','product_description':'Serviço do IBGE para posicionamento RTK/DGPS em tempo real a partir de estações da RBMC, transmitindo correções GNSS pela Internet via NTRIP em formato RTCM.','research_areas':'Geodesy | GNSS | Surveying | Geospatial information science','keywords':'RBMC-IP | NTRIP | RTCM | RTK | DGPS | GNSS | tempo real | IBGE','geographic_coverage':'Brasil — cobertura efetiva depende das estações e conectividade','covers_brazil':'sim','spatial_support':'serviço de correções GNSS baseado em rede de estações','spatial_resolution':'não se aplica como resolução raster; desempenho depende da geometria/rede e técnica de posicionamento','temporal_coverage':'serviço operacional corrente','temporal_resolution':'tempo real','update_frequency':'contínua enquanto o serviço e as estações estão operacionais','product_status':'ativo','version_or_collection':'serviço NTRIP/RTCM corrente','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/servicos-para-posicionamento-geodesico/16332-rbmc-ip-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-em-tempo-real.html','methodology_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/servicos-para-posicionamento-geodesico/16332-rbmc-ip-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-em-tempo-real.html','primary_or_derived':'serviço','limitations':'É serviço de posicionamento/correção, não dataset histórico equivalente aos arquivos RINEX. A qualidade depende de estação, conectividade, equipamento, técnica, distância e condições GNSS; não inferir precisão fixa.','last_verified':today},
          {'product_id':'DP000132','resource_id':'DR0075','product_name':'RMPG — Rede Maregráfica Permanente para Geodésia','product_acronym':'RMPG','product_family':'Redes Geodésicas — nível do mar e meteorologia','product_kind':'dataset_series','product_description':'Rede de estações maregráficas do IBGE para monitorar a relação entre o Datum Vertical Brasileiro e níveis maregráficos e apoiar estudos de modernização altimétrica e variação do nível do mar; algumas estações também fornecem dados meteorológicos.','research_areas':'Sea-level science | Geodesy | Oceanography | Climate science','keywords':'RMPG | nível do mar | marégrafo | datum vertical | meteorologia | séries temporais | IBGE','geographic_coverage':'costa brasileira — estações RMPG conforme situação operacional','covers_brazil':'parcial','spatial_support':'estações maregráficas pontuais | séries temporais','spatial_resolution':'pontual por estação; não representa campo contínuo de nível do mar','temporal_coverage':'séries históricas conforme estação; monitoramento corrente; meteorologia incorporada desde 2022 em estações equipadas','temporal_resolution':'varia por arquivo/variável; meteorologia documentada em intervalos de 5 minutos nas estações equipadas','update_frequency':'contínua/diária conforme estação e canal de disseminação','product_status':'ativo','version_or_collection':'rede operacional corrente; dados meteorológicos adicionados a partir de 2022','enumeration_scope':'family_level','product_page_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/10842-rmpcg-rede-maregrafica-permanente-para-geodesia.html','methodology_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/10842-rmpcg-rede-maregrafica-permanente-para-geodesia.html','primary_or_derived':'primário','limitations':'As séries são pontuais e podem conter lacunas por transmissão ou energia, mudanças de sensor e diferenças entre estações. Variação local do nível do mar não deve ser extrapolada diretamente para toda a costa sem análise apropriada.','last_verified':today}]
          for row in products: append_dict('data/data_products.csv', row)
          distributions=[
          {'distribution_id':'DD000146','product_id':'DP000130','distribution_name':'RBMC — arquivos de observação GNSS','access_url':'https://geoftp.ibge.gov.br/informacoes_sobre_posicionamento_geodesico/rbmc/','format':'RINEX 2 | RINEX 3 | Hatanaka/compactação conforme coleção','access_protocol':'HTTPS download','access_tool':'navegador web | cliente HTTP | software GNSS','free_download':'sim','authentication_required':'não','access_conditions':'arquivos públicos organizados por ano, dia e coleção; selecionar estação, intervalo e formato','license':'licença específica não inferida; observar termos e documentação do IBGE','provider_attribution_required':'sim','subset_support':'por ano, dia, estação e coleção conforme diretório','notes':'O acervo público inclui dados desde 1995 e coleções RINEX 3/1 s específicas. Formato e disponibilidade variam por estação e período.','last_verified':today},
          {'distribution_id':'DD000147','product_id':'DP000131','distribution_name':'RBMC-IP — serviço NTRIP/RTCM','access_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/servicos-para-posicionamento-geodesico/16332-rbmc-ip-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-em-tempo-real.html','format':'RTCM','access_protocol':'NTRIP sobre Internet','access_tool':'receptor/controladora GNSS | cliente NTRIP','free_download':'não se aplica','authentication_required':'sim','access_conditions':'uso do serviço requer cadastro/configuração e conectividade; consultar instruções oficiais','license':'condições de uso do serviço conforme documentação do IBGE','provider_attribution_required':'desconhecido','subset_support':'por mountpoint/estação e correção disponibilizada pelo caster','notes':'Distribuição operacional em tempo real; não confundir com download dos arquivos históricos RINEX da RBMC.','last_verified':today},
          {'distribution_id':'DD000148','product_id':'DP000132','distribution_name':'RMPG — dados maregráficos e meteorológicos','access_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/10842-rmpcg-rede-maregrafica-permanente-para-geodesia.html','format':'arquivos de nível do mar | meteorologia | séries temporais | ZIP conforme estação/ano','access_protocol':'HTTPS web | download','access_tool':'navegador web | software de análise de séries temporais','free_download':'sim','authentication_required':'não','access_conditions':'seleção pública por estação e ano; disponibilidade depende da série e situação operacional','license':'IBGE solicita citação da fonte e orienta que terceiros façam o download diretamente pelo portal; verificar condições específicas no produto','provider_attribution_required':'sim','subset_support':'por estação, ano e variável conforme interface','notes':'A página informa que dados meteorológicos passaram a ser incluídos desde 01/04/2022 nas estações com sensores, em arquivo adicional com intervalo de 5 minutos.','last_verified':today}]
          for row in distributions: append_dict('data/product_distributions.csv', row)
          p=Path('data/brazil_scope_priorities.json')
          obj=json.loads(p.read_text(encoding='utf-8'))
          p0=next(x for x in obj['tiers'] if x['priority_tier']=='P0')['resource_ids']
          if 'DR0075' not in p0: p0.append('DR0075')
          obj['reviewed_at']=today
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
      - name: Validate catalog and Vitrine
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Remove one-shot workflow and commit materialized state
        run: |
          rm .github/workflows/vitrine-audit-120.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expandir IBGE: RBMC, RBMC-IP e RMPG [materialized-120]'
          git push origin HEAD:agent/vitrine-audit-120
