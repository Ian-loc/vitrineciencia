name: One-shot geodesy main bootstrap

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and run verified batch payload
        run: |
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/materialize-geodesy-batch-2026-08-15.yml | sed '1d;$d;s/^          //' > /tmp/materialize.py
          python /tmp/materialize.py
      - name: Validate and rebuild
        run: |
          python scripts/validate_product_catalog.py
          python scripts/validate_brazil_scope.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Consolidated read-back
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          src=list(csv.DictReader(Path('data/data_resources.csv').open(encoding='utf-8-sig')))
          ps=list(csv.DictReader(Path('data/data_products.csv').open(encoding='utf-8-sig')))
          ds=list(csv.DictReader(Path('data/product_distributions.csv').open(encoding='utf-8-sig')))
          sids={r['resource_id'] for r in src}; pids={r['product_id'] for r in ps}; dids={r['distribution_id'] for r in ds}
          assert len(sids)==len(src) and len(pids)==len(ps) and len(dids)==len(ds)
          assert all(r['resource_id'] in sids for r in ps)
          assert all(r['product_id'] in pids for r in ds)
          for n in range(133,138):
              pid=f'DP{n:06d}'
              assert pid in pids and sum(d['product_id']==pid for d in ds)>=1
          print(f'sources={len(src)} products={len(ps)} distributions={len(ds)}')
          PY
      - name: Commit materialized data to validation branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git diff --cached --check
          git commit -m 'Expand IBGE geodetic networks catalog'
          git push --force-with-lease origin HEAD:agent/vitrine-geodesy-materialized-2026-08-15
