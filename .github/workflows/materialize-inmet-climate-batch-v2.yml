name: Materialize INMET climate batch v2

on:
  push:
    branches: ["main"]
    paths:
      - ".github/materializers/**"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified batch
        run: python3 .github/materializers/inmet_climate_batch.py
      - name: Validate and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
      - name: Commit materialized data
        run: |
          git config user.name "vitrine-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/data_products.json data/product_distributions.csv data/link_role_audit.json data/quality_report.md data/quality_report.json 2>/dev/null || true
          git status --short
          git commit -m "Expand verified INMET climate catalog"
          git push
