name: Materialize reviewed link roles

on:
  push:
    paths:
      - .link-role-reviewed-exceptions-trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/link-role-reviewed-exceptions-20260819
          fetch-depth: 0

      - name: Refine BDMEP source link roles without reserializing baseline
        run: |
          python - <<'PY'
          import csv
          import io
          from pathlib import Path

          path = Path('data/data_resources.csv')
          raw = path.read_text(encoding='utf-8-sig')
          lines = raw.splitlines(keepends=True)
          header = next(csv.reader([lines[0]]))
          idx = {name: i for i, name in enumerate(header)}
          found = 0
          for i, line in enumerate(lines[1:], start=1):
              if not line.startswith('DR0018,'):
                  continue
              row = next(csv.reader([line]))
              assert row[idx['resource_id']] == 'DR0018'
              assert row[idx['homepage_url']] == 'https://bdmep.inmet.gov.br/'
              assert row[idx['data_access_url']] == 'https://bdmep.inmet.gov.br/'
              row[idx['homepage_url']] = 'https://portal.inmet.gov.br/servicos/bdmep-dados-historicos'
              row[idx['verification_url']] = 'https://portal.inmet.gov.br/servicos/bdmep-dados-historicos'
              row[idx['last_verified']] = '2026-08-19'
              out = io.StringIO()
              csv.writer(out, lineterminator='\n').writerow(row)
              lines[i] = out.getvalue()
              found += 1
          assert found == 1, found
          path.write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Regenerate link-role audit
        run: python scripts/audit_link_roles.py --write

      - name: Validate Brazil scope
        run: python scripts/validate_brazil_scope.py

      - name: Validate product catalog
        run: python scripts/validate_product_catalog.py

      - name: Rebuild catalog
        run: python scripts/build_catalog.py

      - name: Validate link-role read-back
        run: python scripts/audit_link_roles.py

      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py

      - name: Build public artifact
        run: python scripts/build_site_artifact.py

      - name: Diff check
        run: git diff --check

      - name: Assert expected link-role state
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = list(csv.DictReader(Path('data/data_resources.csv').open(encoding='utf-8-sig', newline='')))
          row = next(r for r in rows if r['resource_id'] == 'DR0018')
          assert row['homepage_url'] == 'https://portal.inmet.gov.br/servicos/bdmep-dados-historicos'
          assert row['data_access_url'] == 'https://bdmep.inmet.gov.br/'
          report = json.loads(Path('data/link_role_audit.json').read_text(encoding='utf-8'))
          c = report['counts']
          assert c['same_destination_reviewed_exception'] == 9, c
          assert c['same_destination_pending_review'] == 32, c
          assert c['separate_destinations'] == 93, c
          assert c['data_access_not_applicable'] == 1, c
          print('OK expected state', c)
          PY

      - name: Commit materialized audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_resources.csv data/link_role_audit.json
          if git diff --cached --quiet; then
            echo 'No materialized changes to commit.'
          else
            git commit -m 'Materialize reviewed link-role audit'
            git push origin HEAD:audit/link-role-reviewed-exceptions-20260819
          fi
