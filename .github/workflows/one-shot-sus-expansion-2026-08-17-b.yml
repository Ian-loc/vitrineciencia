name: One-shot verified SUS expansion batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-sus-expansion-2026-08-17-b.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified SUS products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, pathlib
          root=pathlib.Path('.')
          ppath=root/'data/data_products.csv'; dpath=root/'data/product_distributions.csv'
          def rows(path):
              with path.open(encoding='utf-8',newline='') as f: return list(csv.DictReader(f))
          oldp=rows(ppath); oldd=rows(dpath)
          if oldp[-1]['product_id']!='DP000476': raise SystemExit(f"unexpected product tail {oldp[-1]['product_id']}")
          if oldd[-1]['distribution_id']!='DD000501': raise SystemExit(f"unexpected distribution tail {oldd[-1]['distribution_id']}")
          pids=[f'DP{i:06d}' for i in range(477,488)]
          dids=[f'DD{i:06d}' for i in range(502,513)]
          if set(pids)&{r['product_id'] for r in oldp}: raise SystemExit('product ID collision')
          if set(dids)&{r['distribution_id'] for r in oldd}: raise SystemExit('distribution ID collision')
          existing_urls={r['product_page_url'] for r in oldp}
          urls=[
            'https://dadosabertos.saude.gov.br/dataset/srag-2019-a-2026',
            'https://dadosabertos.saude.gov.br/dataset/doses-aplicadas-pelo-programa-de-nacional-de-imunizacoes-pni-2026',
            'https://dadosabertos.saude.gov.br/dataset/covid-19-vacinacao',
            'https://dadosabertos.saude.gov.br/dataset/ripsa-mortalidade',
            'https://dadosabertos.saude.gov.br/dataset/ripsa-recursos',
            'https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-demais-parametros',
            'https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-infraestrutura-operacional',
            'https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-amostras-fora-do-padrao',
            'https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-plano-amostragem',
            'https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-cianobacterias-e-cianotoxinas',
            'https://dadosabertos.saude.gov.br/dataset/febre-amarela-em-humanos-e-primatas-nao-humanos']
          dup=[u for u in urls if u in existing_urls]
          if dup: raise SystemExit(f'already cataloged URLs: {dup}')
          def append_dicts(path, newrows):
              with path.open(encoding='utf-8',newline='') as f: fields=next(csv.reader(f))
              with path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='raise',lineterminator='\n')
                  for row in newrows: w.writerow({k:row.get(k,'') for k in fields})
          A='Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados'
          E='Ciências Ambientais e Ecologia | Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados'
          R='DR0113'
          products=[
          {'product_id':'DP000477','resource_id':R,'product_name':'SIVEP-Gripe — Síndrome Respiratória Aguda Grave (SRAG) 2019–2026','product_acronym':'SIVEP-Gripe SRAG','product_family':'Vigilância de vírus respiratórios e SRAG','product_kind':'dataset_series','product_description':'Banco nacional anonimizado do SIVEP-Gripe para casos e óbitos por Síndrome Respiratória Aguda Grave, organizado por ano epidemiológico, com bancos históricos e banco corrente atualizado semanalmente.','research_areas':A,'keywords':'SRAG | SIVEP-Gripe | influenza | covid-19 | vírus respiratórios | vigilância epidemiológica','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'notificação epidemiológica anonimizada','spatial_resolution':'município nos campos de disseminação; observar dicionário','temporal_coverage':'2019–2026; 2019–2024 congelados e ano corrente em atualização','temporal_resolution':'dia | semana epidemiológica conforme variável','update_frequency':'semanal para banco corrente','product_status':'ativo','version_or_collection':'portal atualizado em 03/08/2026','enumeration_scope':'complete','product_page_url':urls[0],'methodology_url':urls[0],'primary_or_derived':'primário','limitations':'Notificações estão sujeitas a erros de preenchimento, revisões, classificação e atraso. Banco corrente é mutável; dados são anonimizados. Notificação de SRAG não equivale à incidência populacional total de infecções respiratórias.','last_verified':'2026-08-17'},
          {'product_id':'DP000478','resource_id':R,'product_name':'Doses aplicadas pelo Programa Nacional de Imunizações — PNI 2026','product_acronym':'PNI 2026','product_family':'Vacinação e imunizações','product_kind':'dataset_series','product_description':'Registros abertos de doses aplicadas pelo Programa Nacional de Imunizações em 2026, disponibilizados por ano e mês de vacinação com dicionário e variáveis de disseminação.','research_areas':A,'keywords':'PNI | vacinação | imunização | doses aplicadas | vacinas','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'registro de vacinação de disseminação','spatial_resolution':'registro e agregações territoriais conforme recurso','temporal_coverage':'2026; recursos mensais disponíveis até julho na verificação','temporal_resolution':'registro | mês','update_frequency':'semanal','product_status':'ativo','version_or_collection':'atualizado em 03/08/2026','enumeration_scope':'complete','product_page_url':urls[1],'methodology_url':'https://www.gov.br/saude/pt-br/vacinacao','primary_or_derived':'primário','limitations':'Registros de doses aplicadas dependem da alimentação e integração dos sistemas de informação. Não inferir cobertura vacinal sem denominador e regras metodológicas adequadas; revisões e atrasos podem alterar totais.','last_verified':'2026-08-17'},
          {'product_id':'DP000479','resource_id':R,'product_name':'Campanha Nacional de Vacinação contra Covid-19 — registros anonimizados','product_acronym':'Vacinação COVID-19','product_family':'Vacinação contra Covid-19','product_kind':'dataset_series','product_description':'Registros anonimizados de vacinação contra Covid-19 integrados à RNDS a partir do SI-PNI, e-SUS APS e sistemas próprios integrados de estados e municípios.','research_areas':A,'keywords':'covid-19 | vacinação | SI-PNI | RNDS | doses aplicadas','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'registro de vacinação anonimizado','spatial_resolution':'município e UF nos campos de disseminação','temporal_coverage':'desde 18/01/2021','temporal_resolution':'dia','update_frequency':'diária','product_status':'ativo','version_or_collection':'dados completos atualizados em 22/07/2026','enumeration_scope':'complete','product_page_url':urls[2],'methodology_url':urls[2],'primary_or_derived':'primário','limitations':'Registros dependem da integração e oportunidade dos sistemas locais/RNDS. Doses registradas não equivalem automaticamente a pessoas únicas ou cobertura vacinal; preservar dose, fabricante, data, município e denominadores.','last_verified':'2026-08-17'},
          {'product_id':'DP000480','resource_id':R,'product_name':'RIPSA — Indicadores de Mortalidade','product_acronym':'RIPSA Mortalidade','product_family':'RIPSA — indicadores de saúde','product_kind':'indicator_family','product_description':'Família nacional de indicadores RIPSA sobre magnitude e distribuição dos óbitos segundo pessoa, lugar e tempo, com fichas de qualificação e recursos estruturados por indicador.','research_areas':A,'keywords':'RIPSA | mortalidade | indicadores de saúde | óbitos | desigualdades','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'indicador agregado','spatial_resolution':'varia por indicador e fonte','temporal_coverage':'varia por indicador e fonte de origem','temporal_resolution':'varia por indicador','update_frequency':'conforme atualização da RIPSA','product_status':'ativo','version_or_collection':'conjunto atualizado em maio/2026','enumeration_scope':'external_index','product_page_url':urls[3],'methodology_url':'https://www.ripsa.org.br/fichasidb/c-mortalidade','primary_or_derived':'derivado','limitations':'Indicadores possuem numeradores, denominadores, fontes, períodos e regras de cálculo próprios. Não tratar a família como série homogênea nem somar indicadores. Consultar a Ficha de Qualificação de cada indicador.','last_verified':'2026-08-17'},
          {'product_id':'DP000481','resource_id':R,'product_name':'RIPSA — Indicadores de Recursos em Saúde','product_acronym':'RIPSA Recursos','product_family':'RIPSA — indicadores de saúde','product_kind':'indicator_family','product_description':'Família nacional de indicadores RIPSA sobre pessoal, infraestrutura e financiamento em saúde, com recursos estruturados e fichas de qualificação por indicador.','research_areas':A,'keywords':'RIPSA | recursos em saúde | infraestrutura | financiamento | trabalhadores da saúde','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'indicador agregado','spatial_resolution':'varia por indicador e fonte','temporal_coverage':'varia por indicador e fonte de origem','temporal_resolution':'varia por indicador','update_frequency':'conforme atualização da RIPSA','product_status':'ativo','version_or_collection':'conjunto atualizado em maio/2026','enumeration_scope':'external_index','product_page_url':urls[4],'methodology_url':'https://www.ripsa.org.br/fichasidb/e-recursos','primary_or_derived':'derivado','limitations':'Indicadores combinam fontes e conceitos diferentes de pessoal, leitos, gasto e infraestrutura. Comparações exigem a ficha específica, denominadores e referência temporal; não interpretar disponibilidade cadastrada como capacidade efetiva instantânea.','last_verified':'2026-08-17'},
          {'product_id':'DP000482','resource_id':R,'product_name':'SISAGUA — Vigilância — Demais parâmetros','product_acronym':'SISAGUA Vigilância Demais','product_family':'SISAGUA — vigilância da qualidade da água','product_kind':'dataset_series','product_description':'Análises de qualidade da água de alta complexidade realizadas pelo setor saúde e registradas no Sisagua.','research_areas':E,'keywords':'SISAGUA | qualidade da água | vigilância | parâmetros químicos | potabilidade','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'análise/amostra de vigilância','spatial_resolution':'registro/ponto ou agregação conforme variável e recurso','temporal_coverage':'série histórica conforme recursos; atualização corrente em 2026','temporal_resolution':'conforme rotina de vigilância','update_frequency':'mensal no portal','product_status':'ativo','version_or_collection':'atualizado em 04/06/2026','enumeration_scope':'complete','product_page_url':urls[5],'methodology_url':urls[5],'primary_or_derived':'primário','limitations':'Amostragem de vigilância não é censo de todos os pontos nem garante cobertura espacial uniforme. Frequência, parâmetros e locais variam; ausência de análise não significa conformidade ou ausência de risco.','last_verified':'2026-08-17'},
          {'product_id':'DP000483','resource_id':R,'product_name':'SISAGUA — Controle mensal — Infraestrutura Operacional','product_acronym':'SISAGUA Infraestrutura','product_family':'SISAGUA — controle do abastecimento','product_kind':'dataset_series','product_description':'Condições operacionais e de infraestrutura de sistemas e soluções de abastecimento informadas mensalmente pelos prestadores de serviço ao Sisagua.','research_areas':E,'keywords':'SISAGUA | abastecimento | infraestrutura operacional | controle | água potável','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'sistema ou solução de abastecimento cadastrada','spatial_resolution':'registro/ponto ou agregação conforme variável e recurso','temporal_coverage':'série histórica conforme recursos; atualização corrente em 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'atualizado em 03/06/2026','enumeration_scope':'complete','product_page_url':urls[6],'methodology_url':urls[6],'primary_or_derived':'primário','limitations':'Informação operacional declarada pelo prestador. Não comprova desempenho contínuo, conformidade com potabilidade ou funcionamento ininterrupto; cobertura depende do cadastro e envio ao Sisagua.','last_verified':'2026-08-17'},
          {'product_id':'DP000484','resource_id':R,'product_name':'SISAGUA — Controle mensal — Amostras fora do padrão','product_acronym':'SISAGUA Fora do Padrão','product_family':'SISAGUA — controle da qualidade da água','product_kind':'dataset_series','product_description':'Registros detalhados de análises sob responsabilidade dos prestadores que não atenderam ao padrão de potabilidade e foram informadas ao Sisagua.','research_areas':E,'keywords':'SISAGUA | água potável | não conformidade | amostras fora do padrão | controle','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'análise/amostra informada pelo prestador','spatial_resolution':'registro/ponto ou agregação conforme variável e recurso','temporal_coverage':'série histórica conforme recursos; atualização corrente em 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'atualizado em 03/06/2026','enumeration_scope':'complete','product_page_url':urls[7],'methodology_url':urls[7],'primary_or_derived':'primário','limitations':'Conjunto contém resultados reportados como fora do padrão, não a totalidade das análises. Frequência de não conformidade exige denominador, plano de amostragem e contexto do parâmetro; não extrapolar para toda a rede.','last_verified':'2026-08-17'},
          {'product_id':'DP000485','resource_id':R,'product_name':'SISAGUA — Controle mensal — Plano de Amostragem','product_acronym':'SISAGUA Plano Amostragem','product_family':'SISAGUA — planejamento do controle','product_kind':'dataset_series','product_description':'Quantitativos mínimos de análises definidos para prestadores por forma de abastecimento, parâmetro de qualidade e ponto de monitoramento, com frequências de amostragem.','research_areas':E,'keywords':'SISAGUA | plano de amostragem | controle | potabilidade | monitoramento','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'plano por forma de abastecimento/parâmetro/ponto','spatial_resolution':'registro de planejamento do controle','temporal_coverage':'2014–2025 nos recursos atualmente publicados','temporal_resolution':'mensal conforme plano','update_frequency':'mensal no portal','product_status':'ativo','version_or_collection':'portal atualizado em 02/02/2026','enumeration_scope':'complete','product_page_url':urls[8],'methodology_url':urls[8],'primary_or_derived':'primário','limitations':'Plano estabelece quantitativos/frequências previstos; não comprova que todas as análises foram executadas nem que resultados atenderam ao padrão. Comparar planejamento, execução e resultados separadamente.','last_verified':'2026-08-17'},
          {'product_id':'DP000486','resource_id':R,'product_name':'SISAGUA — Vigilância — Cianobactérias e cianotoxinas','product_acronym':'SISAGUA Cianobactérias','product_family':'SISAGUA — vigilância da qualidade da água','product_kind':'dataset_series','product_description':'Análises de cianobactérias e cianotoxinas realizadas pelo setor saúde e disseminadas no Portal de Dados Abertos do SUS.','research_areas':E,'keywords':'SISAGUA | cianobactérias | cianotoxinas | qualidade da água | vigilância','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'análise/amostra de vigilância','spatial_resolution':'registro/ponto ou agregação conforme variável e recurso','temporal_coverage':'série histórica conforme recursos do conjunto','temporal_resolution':'conforme rotina e parâmetro','update_frequency':'conforme atualização do portal','product_status':'ativo','version_or_collection':'conjunto ativo em 2026','enumeration_scope':'complete','product_page_url':urls[9],'methodology_url':urls[9],'primary_or_derived':'primário','limitations':'Análises de vigilância são amostrais e dependem de locais, frequência e parâmetros monitorados. Não inferir ausência de florações/toxinas em locais ou períodos sem amostragem.','last_verified':'2026-08-17'},
          {'product_id':'DP000487','resource_id':R,'product_name':'Febre Amarela em humanos e primatas não-humanos — 1994–2026','product_acronym':'Febre Amarela 1994–2026','product_family':'Vigilância epidemiológica de febre amarela','product_kind':'dataset_series','product_description':'Bases individualizadas e anonimizadas de casos humanos confirmados e epizootias em primatas não-humanos, harmonizadas pela vigilância nacional de febre amarela.','research_areas':'Ciências Ambientais e Ecologia | Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados','keywords':'febre amarela | epizootias | primatas não-humanos | vigilância | arboviroses | zoonoses','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'caso humano confirmado | epizootia confirmada','spatial_resolution':'município do local provável de infecção/ocorrência','temporal_coverage':'casos humanos 1994–2026; epizootias em PNH 1999–2026','temporal_resolution':'dia','update_frequency':'anual com revisões durante monitoramento','product_status':'ativo','version_or_collection':'dados atualizados até 16/06/2026; portal atualizado em 09/07/2026','enumeration_scope':'complete','product_page_url':urls[10],'methodology_url':urls[10],'primary_or_derived':'primário','limitations':'Inclui casos/epizootias confirmados e não todas as suspeitas; registros são revisados e podem conter faltantes. Vigilância de PNH inicia mais tarde e fontes mudam historicamente. Local provável de infecção não é residência.','last_verified':'2026-08-17'}]
          append_dicts(ppath,products)
          fmt_common='CSV | JSON | XML | API'
          dist=[]
          names=['SIVEP-Gripe SRAG — portal oficial e recursos','PNI 2026 — portal oficial e recursos','Vacinação COVID-19 — portal oficial e recursos','RIPSA Mortalidade — indicadores e recursos','RIPSA Recursos — indicadores e recursos','SISAGUA Vigilância Demais — recursos','SISAGUA Infraestrutura — recursos','SISAGUA Fora do Padrão — recursos','SISAGUA Plano de Amostragem — recursos','SISAGUA Cianobactérias — recursos','Febre Amarela — bases e recursos']
          formats=['CSV | JSON | XML | Parquet | API','CSV | API','CSV | API','CSV | JSON | XML','CSV | JSON | XML','ODT | CSV | JSON | XML | API','ODT | CSV | JSON | XML | API','ODT | CSV | JSON | XML | API','ODT | CSV | JSON | XML | API','ODT | CSV | JSON | XML | API','CSV | JSON | XML | API']
          notes=[
          'Bancos por ano epidemiológico; históricos e banco corrente possuem estados de atualização distintos. Preservar dicionário e data de extração.',
          'Recursos de 2026 são publicados por ano/mês; preservar competência, dicionário e data de atualização.',
          'Inclui registros completos e arquivos particionados; preservar dose, data, local e regras de anonimização.',
          'Família de indicadores; cada recurso possui definição e ficha de qualificação própria.',
          'Família de indicadores; pessoal, infraestrutura e financiamento não compartilham necessariamente fonte ou denominador.',
          'Resultados de vigilância do setor saúde; preservar parâmetro, unidade, ponto, data e plano de amostragem.',
          'Condições operacionais declaradas pelos prestadores; não confundir com resultados analíticos de qualidade.',
          'Somente análises reportadas como fora do padrão; requer denominador e plano para interpretação de frequência.',
          'Planejamento de quantitativos/frequências; não equivale à execução efetiva das análises.',
          'Resultados amostrais de cianobactérias/cianotoxinas; cobertura varia espacial e temporalmente.',
          'Casos humanos e epizootias confirmados em arquivos separados; registros permanecem sujeitos a revisão.']
          for i,(pid,url,name,fmt,note) in enumerate(zip(pids,urls,names,formats,notes),start=502):
              dist.append({'distribution_id':f'DD{i:06d}','product_id':pid,'distribution_name':name,'access_url':url,'format':fmt,'access_protocol':'HTTPS | API/download conforme recurso','access_tool':'Portal de Dados Abertos do SUS','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; preservar dicionário, versão, competência e regras de anonimização/sigilo do conjunto','license':'conteúdo do portal CC BY-ND 3.0; verificar termos específicos do arquivo/recurso','provider_attribution_required':'sim','subset_support':'API quando documentada; arquivos por período/competência conforme conjunto','notes':note,'last_verified':'2026-08-17'})
          append_dicts(dpath,dist)
          newp=rows(ppath); newd=rows(dpath)
          if len(newp)!=len(oldp)+11 or len(newd)!=len(oldd)+11: raise SystemExit('unexpected row counts')
          if newp[-1]['product_id']!='DP000487' or newd[-1]['distribution_id']!='DD000512': raise SystemExit('tail mismatch')
          if any(r['resource_id']!='DR0113' for r in newp[-11:]): raise SystemExit('FK batch mismatch')
          print('APPENDED',len(oldp),'->',len(newp),'products;',len(oldd),'->',len(newd),'distributions')
          PY
      - name: Validate consolidated catalog
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity
        run: |
          python - <<'PY'
          import csv
          P=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')))
          D=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')))
          R=list(csv.DictReader(open('data/data_resources.csv',encoding='utf-8')))
          pids={r['product_id'] for r in P}; rids={r['resource_id'] for r in R}; dids=[r['distribution_id'] for r in D]
          assert len(pids)==len(P); assert len(dids)==len(set(dids))
          assert all(r['resource_id'] in rids for r in P)
          assert all(r['product_id'] in pids for r in D)
          assert all(any(d['product_id']==p['product_id'] for d in D) for p in P[-11:])
          assert [r['product_id'] for r in P[-11:]]==[f'DP{i:06d}' for i in range(477,488)]
          assert dids[-11:]==[f'DD{i:06d}' for i in range(502,513)]
          print('READBACK',len(R),len(P),len(D))
          PY
      - name: Commit materialized batch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-sus-expansion-2026-08-17-b.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json
          git status --short
          git commit -m 'Expand verified SUS surveillance and water-quality catalog'
          git push
