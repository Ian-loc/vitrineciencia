name: Materialize IBGE geodesy batch

on:
  push:
    branches:
      - agent/vitrine-geodesy-batch-2026-08-15

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-geodesy-batch-2026-08-15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified IBGE geodesy products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          product_path = Path('data/data_products.csv')
          dist_path = Path('data/product_distributions.csv')

          products = [
            ['DP000133','DR0075','Rede Altimétrica de Alta Precisão — RAAP','RAAP','Redes Geodésicas — componente altimétrica','dataset_series','Rede de Referências de Nível do Sistema Geodésico Brasileiro, estabelecida por nivelamento geométrico de alta precisão para materializar a componente altimétrica oficial e fornecer altitudes físicas de referência.','Geodesy | Geospatial information science | Earth sciences','RAAP | referência de nível | RRNN | altitude normal | nivelamento geométrico | SGB | IBGE','Brasil — referências de nível distribuídas ao longo da rede altimétrica nacional','sim','estações geodésicas pontuais | linhas de nivelamento','pontual por referência de nível; densidade espacial varia conforme a rede','estabelecimento desde 1945; valores recalculados periodicamente conforme novos levantamentos e ajustamentos','por campanha/ajustamento; observação pontual por estação','atualização conforme expansão e reajustamento da rede','ativo','RAAP / altitudes vigentes no SGB; REALT-2018 como referência para altitudes normais atuais','family_level','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16283-rede-altimetrica.html?lang=pt-BR','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16283-rede-altimetrica.html?lang=pt-BR','primário','As RRNN são pontos discretos e podem sofrer manutenção, destruição ou atualização de altitude após novos ajustamentos. Consultar o BDG antes do uso e registrar estação, datum vertical, época e valor vigente; não interpolar uma superfície altimétrica sem método apropriado.','2026-08-15'],
            ['DP000134','DR0075','Rede Gravimétrica — IBGE','Rede Gravimétrica','Redes Geodésicas — componente gravimétrica','dataset_series','Conjunto de estações gravimétricas do Sistema Geodésico Brasileiro com informações sobre aceleração da gravidade e características das estações, usado em geodésia, geofísica, geologia e determinação de altitudes físicas.','Geodesy | Geophysics | Earth sciences | Geospatial information science','gravimetria | aceleração da gravidade | estação gravimétrica | geoide | SGB | IBGE','Brasil — cobertura por estações gravimétricas, com densidade espacial heterogênea','sim','estações geodésicas pontuais','pontual por estação; densidade espacial heterogênea','levantamentos desde a década de 1950; cobertura sistemática ampliada a partir de 1990','por levantamento/estação','atualização conforme campanhas gravimétricas e processamento','ativo','Rede Gravimétrica do SGB — consulta corrente no BDG','family_level','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16286-rede-gravimetrica.html','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16286-rede-gravimetrica.html','primário','A distribuição de estações não é espacialmente homogênea e observações podem pertencer a campanhas, instrumentos e épocas distintas. Não tratar pontos gravimétricos como raster contínuo sem modelagem e documentação adequadas.','2026-08-15'],
            ['DP000135','DR0075','Rede Planialtimétrica — IBGE','Rede Planialtimétrica','Redes Geodésicas — componentes planimétrica e planialtimétrica','dataset_series','Conjunto de estações SAT, Doppler, poligonais e vértices de triangulação que materializam componentes planimétricas e planialtimétricas do Sistema Geodésico Brasileiro e preservam a infraestrutura histórica de referência espacial.','Geodesy | GNSS | Geospatial information science','rede planialtimétrica | SAT | Doppler | triangulação | poligonação | SIRGAS2000 | SGB | IBGE','Brasil — estações geodésicas conforme o Banco de Dados Geodésicos','sim','estações geodésicas pontuais | redes clássicas e espaciais','pontual por estação; densidade e técnica variam historicamente','levantamentos geodésicos desde 1939; estabelecimento sistemático da rede planimétrica a partir de 1944','por estação/campanha; sem passo temporal uniforme','atualização conforme levantamentos, ajustamentos e manutenção cadastral','ativo','Rede Planialtimétrica do SGB — consulta corrente no BDG','family_level','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16284-rede-planialtimetrica.html?lang=pt-BR','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16284-rede-planialtimetrica.html?lang=pt-BR','primário','A rede agrega técnicas e épocas distintas. Coordenadas históricas podem ter sido ajustadas ou transformadas para referenciais posteriores; consultar metadados e situação da estação no BDG antes de reutilizar valores.','2026-08-15'],
            ['DP000136','DR0075','BDG — Banco de Dados Geodésicos do IBGE','BDG','Redes Geodésicas — catálogo de estações do SGB','catalog','Aplicativo e catálogo oficial para consulta das estações geodésicas do Sistema Geodésico Brasileiro, integrando informações das redes altimétrica, planialtimétrica e gravimétrica e respectivos metadados de estação.','Geodesy | Geospatial information science | Data infrastructure','BDG | banco de dados geodésicos | RRNN | SAT | estação gravimétrica | SGB | IBGE','Brasil — estações registradas no Sistema Geodésico Brasileiro','sim','catálogo de estações geodésicas pontuais e metadados','herdada das redes e estações consultadas','conteúdo histórico e corrente conforme rede e estação','por registro/estação','atualização contínua ou periódica conforme manutenção das redes','ativo','Banco de Dados Geodésicos — consulta corrente','external_index','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16327-banco-de-dados-geodesicos.html?lang=pt-BR','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16327-banco-de-dados-geodesicos.html?lang=pt-BR','agregador','O BDG agrega redes com técnicas, datas, referenciais e estados operacionais diferentes. O próprio IBGE recomenda nova consulta antes de cada trabalho; resultados extraídos devem preservar identificador, tipo de estação, referencial, data e metadados vigentes.','2026-08-15'],
            ['DP000137','DR0075','Mapa das Redes do Sistema Geodésico Brasileiro — 2021','Mapa das Redes SGB 2021','Redes Geodésicas — síntese cartográfica','map_layer_collection','Representação cartográfica mural da distribuição das redes planialtimétrica, altimétrica e gravimétrica e das redes ativas RMPG e RBMC, elaborada a partir do BDG de setembro de 2021 e da BCIM 2016.','Geodesy | Cartography | Geospatial information science','mapa geodésico | rede altimétrica | rede gravimétrica | rede planialtimétrica | RBMC | RMPG | SGB | IBGE','Brasil','sim','mapa mural | representação de estações e redes','1:22.000.000 nos três mapas nacionais; destaques locais em escalas próprias','instantâneo de setembro de 2021 para o BDG; base cartográfica BCIM 2016','instantâneo cartográfico','por edição; periodicidade não inferida','ativo','edição 2021','complete','https://www.ibge.gov.br/geociencias/cartas-e-mapas/brasil-redes-geodesicas/29614-mapa-das-redes-do-sistema-geodesico-brasileiro.html','https://www.ibge.gov.br/geociencias/cartas-e-mapas/brasil-redes-geodesicas/29614-mapa-das-redes-do-sistema-geodesico-brasileiro.html','derivado','É uma síntese cartográfica de 2021, não inventário operacional corrente das estações. Para situação, coordenadas ou disponibilidade atuais, consultar as redes e o BDG. A escala nacional não suporta uso cadastral ou inspeção local.','2026-08-15']
          ]

          distributions = [
            ['DD000149','DP000133','Rede Altimétrica — consulta e acesso via BDG','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16283-rede-altimetrica.html?lang=pt-BR','consulta web | arquivos e relatórios conforme estação','HTTPS web','página oficial + Banco de Dados Geodésicos','parcial','não','consulta pública; selecionar e verificar a referência de nível/estação usada','licença específica dos registros deve ser verificada no produto/extração; não inferida da página temática','sim','por estação/referência de nível','A página oficial encaminha o acesso ao Banco de Dados Geodésicos. Preservar identificador e metadados da RRNN e realizar nova consulta antes do uso.','2026-08-15'],
            ['DD000150','DP000134','Rede Gravimétrica — consulta e acesso via BDG','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16286-rede-gravimetrica.html','consulta web | arquivos e relatórios conforme estação','HTTPS web','página oficial + Banco de Dados Geodésicos','parcial','não','consulta pública; dados e metadados dependem da estação e levantamento','licença específica dos registros deve ser verificada no produto/extração; não inferida da página temática','sim','por estação gravimétrica','O acesso oficial é mediado pelo BDG e por downloads associados. Não inferir cobertura espacial contínua a partir do catálogo de pontos.','2026-08-15'],
            ['DD000151','DP000135','Rede Planialtimétrica — consulta e acesso via BDG','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16284-rede-planialtimetrica.html?lang=pt-BR','consulta web | relatórios e cartogramas | metadados de estação','HTTPS web','página oficial + Banco de Dados Geodésicos','parcial','não','consulta pública; selecionar estação e conferir técnica/referencial','licença específica dos registros deve ser verificada no produto/extração; não inferida da página temática','sim','por estação/tipo de marco','A página oficial oferece acesso ao BDG, INDE e cartogramas. Valores históricos precisam ser interpretados com o referencial e o ajustamento correspondentes.','2026-08-15'],
            ['DD000152','DP000136','BDG — aplicativo de consulta','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16327-banco-de-dados-geodesicos.html?lang=pt-BR','aplicativo web | registros e relatórios de estações','HTTPS web','Banco de Dados Geodésicos','parcial','não','consulta pública; conteúdo varia por rede, estação e estado cadastral','licença específica deve ser verificada no registro/saída utilizada; não inferida da página do aplicativo','sim','por rede, tipo e estação conforme aplicativo','Catálogo agregador. O IBGE recomenda consulta rotineira ao BDG antes da realização de trabalhos para obter informações atualizadas.','2026-08-15'],
            ['DD000153','DP000137','Mapa das Redes do SGB — edição 2021 e downloads','https://www.ibge.gov.br/geociencias/cartas-e-mapas/brasil-redes-geodesicas/29614-mapa-das-redes-do-sistema-geodesico-brasileiro.html','mapa cartográfico | PDF e arquivos conforme seção de downloads','HTTPS download','navegador web','sim','não','download público na página oficial','licença específica do arquivo deve ser verificada no download; não inferida da página temática','sim','por edição/download','Mapa baseado no BDG de setembro de 2021 e BCIM 2016; não substitui consulta ao cadastro corrente das redes.','2026-08-15']
          ]

          def existing_ids(path, key):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return {r[key] for r in csv.DictReader(f)}

          pids = existing_ids(product_path, 'product_id')
          dids = existing_ids(dist_path, 'distribution_id')
          if any(r[0] in pids for r in products):
              raise SystemExit('One or more target product IDs already exist; refusing duplicate append')
          if any(r[0] in dids for r in distributions):
              raise SystemExit('One or more target distribution IDs already exist; refusing duplicate append')

          with product_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerows(products)
          with dist_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerows(distributions)
          PY
      - name: Validate and rebuild derived catalog
        run: |
          python scripts/validate_product_catalog.py
          python scripts/validate_brazil_scope.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          ps=list(csv.DictReader(Path('data/data_products.csv').open(encoding='utf-8-sig')))
          ds=list(csv.DictReader(Path('data/product_distributions.csv').open(encoding='utf-8-sig')))
          src=set(r['resource_id'] for r in csv.DictReader(Path('data/data_resources.csv').open(encoding='utf-8-sig')))
          pids={r['product_id'] for r in ps}
          assert len(pids)==len(ps)
          assert len({r['distribution_id'] for r in ds})==len(ds)
          assert all(r['resource_id'] in src for r in ps)
          assert all(r['product_id'] in pids for r in ds)
          for pid in [f'DP{i:06d}' for i in range(133,138)]:
              assert pid in pids
              assert sum(d['product_id']==pid for d in ds)>=1
          print(f'sources={len(src)} products={len(ps)} distributions={len(ds)}')
          PY
      - name: Remove one-shot workflow and commit materialized batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/materialize-geodesy-batch-2026-08-15.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/materialize-geodesy-batch-2026-08-15.yml
          git diff --cached --check
          git commit -m 'Expand IBGE geodetic networks catalog'
          git push origin HEAD:agent/vitrine-geodesy-batch-2026-08-15
