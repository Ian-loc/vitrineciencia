name: Diagnose CEMADEN catalog batch
on:
  push:
    paths:
      - '.github/workflows/diagnose-cemaden.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose candidate collisions
        shell: bash
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path
          with open('data/data_products.csv',encoding='utf-8-sig',newline='') as f:
              rows=list(csv.DictReader(f)); header=list(rows[0].keys())
          urls=[
          'https://www2.cemaden.gov.br/pluviometros-automatico/',
          'https://mapainterativo.cemaden.gov.br/',
          'https://www.gov.br/cemaden/pt-br/assuntos/noticias-cemaden/redegeo-e-informacoes-sobre-umidade-de-solo-das-encostas-para-prevencao-de-deslizamentos-sao-apresentadas-pelo-cemaden',
          'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/monitoramento-de-seca-para-o-brasil',
          'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar']
          print('URL COLLISIONS')
          for u in urls:
              hits=[(r['product_id'],r['resource_id'],r['product_name'],r['product_page_url']) for r in rows if r['product_page_url'].strip()==u]
              print(u, hits)
          text=Path('.github/workflows/materialize-cemaden-catalog.yml').read_text(encoding='utf-8')
          # derive product dict keys textually to locate missing/extra fields
          for pid in range(377,382):
              m=re.search(r"\{'product_id':'DP%06d'.*?\}\s*[,\]]"%pid,text,re.S)
              if m:
                  keys=set(re.findall(r"'([^']+)':",m.group(0)))
                  print('KEYS',pid,'missing',sorted(set(header)-keys),'extra',sorted(keys-set(header)), 'count',len(keys))
          PY
