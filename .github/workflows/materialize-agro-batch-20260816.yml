          def append_rows(path, rows, key):
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader=csv.DictReader(f); fields=reader.fieldnames; existing=list(reader)
              ids={r[key] for r in existing}
              names={r.get('product_name','') for r in existing}
              for r in rows:
                  if r[key] in ids: raise SystemExit(f'duplicate id {r[key]}')
                  if key=='product_id' and r.get('product_name') in names: raise SystemExit(f'duplicate product name {r["product_name"]}')
                  missing=set(fields)-set(r)
                  extra=set(r)-set(fields)
                  if missing or extra: raise SystemExit(f'schema mismatch {path}: missing={missing} extra={extra}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  for r in rows: w.writerow(r)
