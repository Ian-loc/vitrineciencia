name: Retry 2 verified Ibama catalog materialization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/retry2-ibama-20260817.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reuse reviewed Ibama append block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          text=Path('.github/workflows/materialize-ibama-20260817.yml').read_text(encoding='utf-8')
          marker="          python - <<'PY'\n"
          start=text.index(marker)+len(marker)
          end=text.index("\n          PY",start)
          Path('/tmp/append_ibama.py').write_text(textwrap.dedent(text[start:end])+'\n',encoding='utf-8')
          PY
          python /tmp/append_ibama.py
      - name: Validate and read back
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv,json
          def R(p):
              with open(p,encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          s,p,d=R('data/data_resources.csv'),R('data/data_products.csv'),R('data/product_distributions.csv')
          assert len({x['resource_id'] for x in s})==len(s)
          assert len({x['product_id'] for x in p})==len(p)
          assert len({x['distribution_id'] for x in d})==len(d)
          rs={x['resource_id'] for x in s}; ps={x['product_id'] for x in p}
          assert all(x['resource_id'] in rs for x in p) and all(x['product_id'] in ps for x in d)
          ib=[x for x in s if x['resource_name']=='Dados Abertos e Sistemas Ambientais — Ibama']; assert len(ib)==1
          rid=ib[0]['resource_id']
          expected={'Fiscalização — Autos de Infração Ambiental — Ibama','Fiscalização — Termos de Embargo — Ibama','Sisfogo — Registros de Ocorrências de Incêndio (ROI) — Ibama/Prevfogo','Sinaflor — POA Outros Biomas — Ibama','Siscites — Licenças de Fauna e Flora Emitidas — Ibama'}
          got={x['product_name'] for x in p if x['resource_id']==rid}; assert expected.issubset(got)
          for x in p:
              if x['product_name'] in expected: assert any(y['product_id']==x['product_id'] for y in d)
          pr=json.load(open('data/brazil_scope_priorities.json',encoding='utf-8')); assert rid in next(t for t in pr['tiers'] if t['priority_tier']=='P0')['resource_ids']
          print(f'COUNTS resources={len(s)} products={len(p)} distributions={len(d)} IBAMA={rid}')
          PY
      - name: Commit tracked changes and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-ibama-20260817.yml .github/workflows/retry-ibama-20260817.yml .github/workflows/retry2-ibama-20260817.yml
          git add -u
          git status --short
          git commit -m "Expand verified Ibama environmental catalog"
          git push origin HEAD:main
