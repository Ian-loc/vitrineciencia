name: One-shot SGB hydrogeology materializer

on:
  push:
    branches:
      - audit/sgb-2026-08-17

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified SGB hydrogeology batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io
          from pathlib import Path
          today="2026-08-17"
          prod=Path("data/data_products.csv"); dist=Path("data/product_distributions.csv")
          def read(path):
              with path.open(encoding="utf-8-sig",newline="") as f:
                  r=csv.DictReader(f); return list(r.fieldnames or []),list(r)
          def append(path,row):
              h,_=read(path)
              assert set(h)==set(row), (set(h)-set(row),set(row)-set(h))
              b=io.StringIO(newline=""); csv.DictWriter(b,fieldnames=h,lineterminator="\n").writerow(row)
              with path.open("a",encoding="utf-8",newline="") as f: f.write(b.getvalue())
          _,ps=read(prod); _,ds=read(dist)
          assert len(ps)==335 and len(ds)==356
          assert max(x['product_id'] for x in ps)=='DP000339'
          assert max(x['distribution_id'] for x in ds)=='DD000360'
          urls={x['product_page_url'].strip() for x in ps}; names={x['product_name'].strip().casefold() for x in ps}
          rows=[
          {"product_id":"DP000340","resource_id":"DR0104","product_name":"Sistema de Informações de Águas Subterrâneas — SIAGAS","product_acronym":"SIAGAS","product_family":"Informações hidrogeológicas e cadastro de poços","product_kind":"dataset_series","product_description":"Base nacional permanentemente atualizada de pontos de água subterrânea mantida pelo SGB, com dados cadastrais, construtivos, geológicos, hidrogeológicos, testes de bombeamento e análises químicas de poços e fontes naturais.","research_areas":"Hydrogeology | Groundwater | Water resources | Environmental monitoring","keywords":"SIAGAS | groundwater | wells | hydrogeology | pumping tests | water chemistry | SGB","geographic_coverage":"Brasil; pontos cadastrados em todo o território nacional","covers_brazil":"sim","spatial_support":"poços e fontes naturais georreferenciados","spatial_resolution":"ponto de captação/fonte; densidade e precisão variam por registro","temporal_coverage":"cadastro histórico e corrente; portal informava 393.855 poços e fontes em 28/07/2026","temporal_resolution":"por registro e atualização cadastral; séries/ensaios conforme ponto","update_frequency":"permanentemente atualizado segundo documentação oficial","product_status":"ativo","version_or_collection":"SIAGAS corrente; 393.855 poços e fontes cadastrados em 28/07/2026","enumeration_scope":"complete","product_page_url":"https://siagasweb.sgb.gov.br/layout/","methodology_url":"https://sgb.gov.br/saiba-mais-sistema-de-informacoes-de-aguas-subterraneas-siagas","primary_or_derived":"misto","limitations":"SIAGAS é cadastro/base compartilhada alimentada por múltiplos atores e não censo perfeito de todos os poços existentes. Completude, atualização, precisão posicional, métodos de ensaio e disponibilidade de variáveis variam entre registros; ausência no sistema não implica ausência de captação.","last_verified":today},
          {"product_id":"DP000341","resource_id":"DR0104","product_name":"Atlas Hidrogeológico do Brasil ao Milionésimo","product_acronym":"Atlas Hidrogeológico 1M","product_family":"Cartografia hidrogeológica nacional","product_kind":"map_layer_collection","product_description":"Atlas nacional composto pelas 46 folhas da Carta Internacional ao Milionésimo que cobrem o Brasil, sintetizando conhecimento geológico, hidrogeológico e hidrológico acumulado para representação das águas subterrâneas e apoio a estudos preliminares.","research_areas":"Hydrogeology | Groundwater | Geology | Water resources","keywords":"hydrogeological atlas | groundwater | 1:1000000 | CIM | shapefile | SGB","geographic_coverage":"Brasil — 46 folhas da Carta Internacional ao Milionésimo","covers_brazil":"sim","spatial_support":"folhas cartográficas | vetores SIG | encartes temáticos","spatial_resolution":"escala 1:1.000.000","temporal_coverage":"síntese de levantamentos e estudos acumulados ao longo de mais de 50 anos; referências variam por folha e insumo","temporal_resolution":"não se aplica; síntese cartográfica","update_frequency":"eventual","product_status":"ativo","version_or_collection":"46 folhas CIM em escala 1:1.000.000; edição corrente disponibilizada pelo SGB","enumeration_scope":"complete","product_page_url":"https://sgb.gov.br/atlas-hidrogeologico-do-brasil-ao-milionesimo","methodology_url":"https://sgb.gov.br/atlas-hidrogeologico-do-brasil-ao-milionesimo","primary_or_derived":"derivado","limitations":"Atlas de síntese em escala 1:1.000.000; não substitui estudo hidrogeológico local, ensaio de aquífero ou cadastro de poços. Idade, densidade e método dos insumos variam e devem ser verificados por folha/encarte.","last_verified":today},
          {"product_id":"DP000342","resource_id":"DR0104","product_name":"Mapa de Domínios/Subdomínios Hidrogeológicos do Brasil — 2007","product_acronym":"Domínios Hidrogeológicos 2007","product_family":"Cartografia hidrogeológica nacional","product_kind":"map_layer_collection","product_description":"Mapa nacional do projeto SIG de Disponibilidade Hídrica do Brasil que agrupa unidades geológicas por afinidades hidrogeológicas em domínios e subdomínios, acompanhado de arquivos vetoriais SIG.","research_areas":"Hydrogeology | Groundwater | Geology | Water resources","keywords":"hydrogeological domains | groundwater | geology | 1:2500000 | SIG | SGB","geographic_coverage":"Brasil","covers_brazil":"sim","spatial_support":"polígonos de domínios e subdomínios hidrogeológicos | mapa nacional","spatial_resolution":"escala cartográfica 1:2.500.000","temporal_coverage":"produto publicado em 2007","temporal_resolution":"não se aplica; produto cartográfico histórico","update_frequency":"não se aplica à edição 2007","product_status":"arquivado","version_or_collection":"edição 2007; escala 1:2.500.000","enumeration_scope":"complete","product_page_url":"https://rigeo.sgb.gov.br/items/5e23cd23-086e-4b78-b630-0135e18c03db","methodology_url":"https://rigeo.sgb.gov.br/items/08e1cce5-115d-46ac-9aa5-3a82171aac26","primary_or_derived":"derivado","limitations":"Regionalização hidrogeológica histórica e de pequena escala, derivada principalmente de agrupamentos litológicos; não representa transmissividade, armazenamento, profundidade, qualidade ou disponibilidade explotável medida em cada local e não deve substituir cartografia/estudos mais recentes e detalhados.","last_verified":today}
          ]
          for r in rows:
              if r['product_page_url'] in urls or r['product_name'].casefold() in names: raise SystemExit('duplicate '+r['product_name'])
              append(prod,r)
          drows=[
          {"distribution_id":"DD000361","product_id":"DP000340","distribution_name":"SIAGAS Web — consulta e extração de informações de poços e fontes","access_url":"https://siagasweb.sgb.gov.br/layout/","format":"consulta web | relatórios e extrações conforme módulo","access_protocol":"HTTPS web","access_tool":"navegador web","free_download":"sim","authentication_required":"não","access_conditions":"sistema interativo aberto ao público; filtros, variáveis e formatos dependem do módulo","license":"licença específica dos registros não determinada nesta auditoria; atribuir SGB e verificar condições do sistema","provider_attribution_required":"sim","subset_support":"por localização e atributos hidrogeológicos disponíveis no sistema","notes":"O SGB descreve o SIAGAS como base nacional permanentemente atualizada; em 28/07/2026 o portal informava 393.855 poços e fontes naturais cadastrados.","last_verified":today},
          {"distribution_id":"DD000362","product_id":"DP000341","distribution_name":"Atlas Hidrogeológico do Brasil ao Milionésimo — folhas PDF e SIG","access_url":"https://sgb.gov.br/atlas-hidrogeologico-do-brasil-ao-milionesimo","format":"PDF | Shapefile","access_protocol":"HTTPS web/download","access_tool":"navegador web | SIG","free_download":"sim","authentication_required":"não","access_conditions":"arquivos públicos por folhas/recursos disponibilizados pelo SGB","license":"verificar licença e atribuição no arquivo; fonte institucional SGB","provider_attribution_required":"sim","subset_support":"por folha CIM e arquivo temático","notes":"A página oficial informa 46 folhas e disponibilização em PDF e shapefile; preservar a folha e os metadados efetivamente usados.","last_verified":today},
          {"distribution_id":"DD000363","product_id":"DP000342","distribution_name":"Domínios/Subdomínios Hidrogeológicos 2007 — mapa e vetores SIG","access_url":"https://rigeo.sgb.gov.br/items/5e23cd23-086e-4b78-b630-0135e18c03db","format":"PDF | ZIP de vetores SIG","access_protocol":"HTTPS download","access_tool":"navegador web | SIG","free_download":"sim","authentication_required":"não","access_conditions":"download público pelo repositório institucional RIgeo","license":"licença específica do item não determinada nesta auditoria; citar a referência bibliográfica oficial do RIgeo","provider_attribution_required":"sim","subset_support":"arquivos do mapa nacional e vetores; recorte posterior em SIG","notes":"RIgeo documenta edição 2007, escala 1:2.500.000, mapas PDF e pacote vetorial SIG; não confundir com o Atlas Hidrogeológico 1:1.000.000.","last_verified":today}
          ]
          for r in drows: append(dist,r)
          _,p2=read(prod); _,d2=read(dist)
          assert len(p2)==338 and len(d2)==359
          assert [x['product_id'] for x in p2[-3:]]==['DP000340','DP000341','DP000342']
          assert [x['distribution_id'] for x in d2[-3:]]==['DD000361','DD000362','DD000363']
          print('MATERIALIZED hydrogeology: 338 products, 359 distributions')
          PY
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          rm -f .github/workflows/one-shot-sgb-hydro.yml
          git config user.name "Vitrine Science Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/one-shot-sgb-hydro.yml || true
          git commit -m "Expand verified SGB hydrogeology catalog"
          git push origin HEAD
