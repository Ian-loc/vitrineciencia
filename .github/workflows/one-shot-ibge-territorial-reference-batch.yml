name: One-shot IBGE territorial reference batch

on:
  push:
    branches:
      - agent/ibge-territorial-reference-batch-20260815
    paths:
      - scripts/materialize_ibge_territorial_reference_batch_20260815.py
      - .github/workflows/one-shot-ibge-territorial-reference-batch.yml

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ibge-territorial-reference-batch-20260815
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize batch
        run: python scripts/materialize_ibge_territorial_reference_batch_20260815.py
      - name: Normalize controlled vocabulary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/data_resources.csv')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Planejamento Territorial e Políticas Públicas | Geografia | Sensoriamento Remoto e Geoinformação', 'Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate Brazil scope
        run: python scripts/validate_brazil_scope.py
      - name: Validate product catalog
        run: python scripts/validate_product_catalog.py
      - name: Build catalog
        run: python scripts/build_catalog.py
      - name: Regenerate link-role audit
        run: python scripts/audit_link_roles.py --write
      - name: Read-back link-role audit
        run: python scripts/audit_link_roles.py
      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py
      - name: Diff check
        run: git diff --check
      - name: Commit materialized canonical state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json data/data_resources.json data/data_products.json data/build-meta.json data/data_quality_report.json
          if git diff --cached --quiet; then
            echo "No canonical changes to commit"
            exit 0
          fi
          git commit -m "Materialize IBGE territorial reference batch"
          git push origin HEAD:agent/ibge-territorial-reference-batch-20260815

# one-shot trigger: fixed canonical staging
