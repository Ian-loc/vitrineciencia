name: Materializar lote IBGE cartografia de referência

on:
  push:
    branches:
      - agent/vitrine-ibge-cartography-2026-08-15

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-ibge-cartography-2026-08-15
          fetch-depth: 0

      - name: Materializar lote canônico
