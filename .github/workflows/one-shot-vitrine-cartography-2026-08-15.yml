          from pathlib import Path

          TODAY = "2026-08-15"

          def read_csv(path):
              with open(path, encoding="utf-8-sig", newline="") as f:
                  r = csv.DictReader(f)
                  return r.fieldnames, list(r)

          def write_csv(path, fieldnames, rows):
              with open(path, "w", encoding="utf-8", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames, lineterminator="\n")
                  w.writeheader(); w.writerows(rows)

          rpath = Path("data/data_resources.csv")
          ppath = Path("data/data_products.csv")
          dpath = Path("data/product_distributions.csv")
          rf, resources = read_csv(rpath)
          pf, products = read_csv(ppath)
          df, dists = read_csv(dpath)

          assert len(resources) == 77, len(resources)
          assert len(products) == 144, len(products)
          assert len(dists) == 160, len(dists)
          assert len(rf) == 34 and len(pf) == 24 and len(df) == 15

