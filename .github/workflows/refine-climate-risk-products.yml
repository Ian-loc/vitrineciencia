name: Refinar produtos de clima e risco

on:
  push:
    branches:
      - audit/refine-climate-risk-products
    paths:
      - "scripts/refine_climate_risk_products.py"
      - ".github/workflows/refine-climate-risk-products.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/refine-climate-risk-products
          fetch-depth: 0
      - name: Aplicar refinamento e validar
        run: |
          python3 scripts/refine_climate_risk_products.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Refinar SIRENE CEMADEN AdaptaBrasil e PClima"
          git push origin HEAD:audit/refine-climate-risk-products
