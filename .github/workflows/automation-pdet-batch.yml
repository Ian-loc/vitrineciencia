name: Materializar lote PDET verificado

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/automation-pdet-batch.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar fonte, produtos e distribuições PDET
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          ROOT = Path('.')
          source_path = ROOT/'data/data_resources.csv'
          product_path = ROOT/'data/data_products.csv'
          dist_path = ROOT/'data/product_distributions.csv'
          priority_path = ROOT/'data/brazil_scope_priorities.json'

          def append_dicts(path, rows):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  existing = list(reader)
              with path.open('a', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
                  for row in rows:
                      missing = [k for k in fieldnames if k not in row]
                      extra = [k for k in row if k not in fieldnames]
                      if missing or extra:
                          raise SystemExit(f'{path}: schema mismatch missing={missing} extra={extra}')
                      writer.writerow(row)

          with source_path.open(encoding='utf-8-sig', newline='') as f:
              sources = list(csv.DictReader(f))
          with product_path.open(encoding='utf-8-sig', newline='') as f:
              products = list(csv.DictReader(f))
          with dist_path.open(encoding='utf-8-sig', newline='') as f:
              dists = list(csv.DictReader(f))

          if any(r['resource_id']=='DR0127' for r in sources):
              raise SystemExit('DR0127 already exists')
          if any('Programa de Disseminação das Estatísticas do Trabalho' in r['resource_name'] for r in sources):
              raise SystemExit('PDET source already exists under another ID')
          expected_product_ids = [f'DP{i:06d}' for i in range(801,809)]
          expected_dist_ids = [f'DD{i:06d}' for i in range(832,842)]
          if any(r['product_id'] in expected_product_ids for r in products):
              raise SystemExit('one proposed product ID already exists')
          if any(r['distribution_id'] in expected_dist_ids for r in dists):
              raise SystemExit('one proposed distribution ID already exists')

          new_source = [{
              'resource_id':'DR0127',
              'resource_name':'Programa de Disseminação das Estatísticas do Trabalho — PDET / MTE',
