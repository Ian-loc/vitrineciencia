      - name: Validar catálogo e artefato público
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert any(x['resource_id']=='DR0127' for x in s)
          assert all(any(x['product_id']==f'DP{i:06d}' for x in p) for i in range(801,809))
          assert all(any(x['distribution_id']==f'DD{i:06d}' for x in d) for i in range(832,842))
          assert len(s)==127, len(s)
          assert len(p)==790, len(p)
          assert len(d)==823, len(d)
          assert len({x['resource_id'] for x in s})==len(s)
          assert len({x['product_id'] for x in p})==len(p)
          assert len({x['distribution_id'] for x in d})==len(d)
          print('READBACK_OK', len(s), len(p), len(d))
          PY

      - name: Commitar lote e remover workflow one-shot
        shell: bash
        run: |
          git config user.name "Vitrine Science Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/automation-pdet-batch.yml
          git add data/data_resources.csv data/data_resources.json data/data_products.csv data/data_products.json data/product_distributions.csv data/brazil_scope_priorities.json data/data_quality_report.json data/link_role_audit.json
          git commit -m "Expand verified MTE labor-statistics catalog"
          git push origin HEAD:main
