name: Temporary PR147 SGB hydro batch

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.number == 147
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Execute prepared branch materializer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/one-shot-sgb-hydro.yml')
          t=p.read_text(encoding='utf-8')
          start=t.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=t.index("\n          PY", start)
          exec(compile(textwrap.dedent(t[start:end]), 'sgb_hydro_materializer.py', 'exec'), {})
          PY
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          rm -f .github/workflows/one-shot-sgb-hydro.yml .github/workflows/trigger-sgb-hydro.yml
          git config user.name "Vitrine Science Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/one-shot-sgb-hydro.yml .github/workflows/trigger-sgb-hydro.yml || true
          git commit -m "Expand verified SGB hydrogeology catalog"
          git push origin HEAD
