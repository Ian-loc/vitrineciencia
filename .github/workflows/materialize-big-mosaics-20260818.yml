              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          existing_p = read(products_path)
          existing_d = read(dists_path)
          pids = {r['product_id'] for r in existing_p}
          dids = {r['distribution_id'] for r in existing_d}
          urls = {r['product_page_url'] for r in existing_p if r.get('product_page_url')}

          wanted = {r['product_id'] for r in products}
          if wanted <= pids:
              print('Products already materialized; no-op')
              raise SystemExit(0)
          assert not (wanted & pids), wanted & pids
          assert not ({r['distribution_id'] for r in dists} & dids)
          dup_urls = {r['product_page_url'] for r in products if r['product_page_url'] in urls}
          assert not dup_urls, dup_urls
          assert all(r['resource_id'] == 'DR0123' for r in products)
          assert all(r['product_id'] in wanted for r in dists)

          pfields = list(existing_p[0].keys())
          dfields = list(existing_d[0].keys())
          assert all(set(r) == set(pfields) for r in products)
          assert all(set(r) == set(dfields) for r in dists)

          with products_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=pfields, lineterminator='\n')
              w.writerows(products)
          with dists_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=dfields, lineterminator='\n')
              w.writerows(dists)

          print('OK append', len(products), len(dists))
          PY

      - name: Validate and rebuild
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def n(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f:
                  return sum(1 for _ in csv.DictReader(f))
          print('COUNTS', n('data/data_resources.csv'), n('data/data_products.csv'), n('data/product_distributions.csv'))
          PY

      - name: Commit materialized batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json
          git commit -m 'Expand verified BIG mosaic catalog'
          git push origin HEAD:audit-big-mosaics-20260818
