name: One-shot IBGE territorial recortes 2

on:
  push:
    branches: ["automation/ibge-territorial-recortes-20260815"]

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/ibge-territorial-recortes-20260815
          fetch-depth: 0

      - name: Append second verified IBGE territorial batch
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/data_products.csv'); d=Path('data/product_distributions.csv')
          with p.open(encoding='utf-8-sig',newline='') as f: products=list(csv.DictReader(f))
          with d.open(encoding='utf-8-sig',newline='') as f: distributions=list(csv.DictReader(f))
          assert len(products)==163, len(products)
          assert len(distributions)==181, len(distributions)
          pids={r['product_id'] for r in products}; dids={r['distribution_id'] for r in distributions}; names={r['product_name'].strip().casefold() for r in products}
          new=[
          {'product_id':'DP000167','resource_id':'DR0070','product_name':'Municípios Limítrofes — versão 2024','product_acronym':'Municípios Limítrofes 2024','product_family':'Estrutura Territorial — relações de contiguidade municipal','product_kind':'dataset','product_description':'Planilha nacional que enumera, para cada município, seus municípios vizinhos e extensões de limites, além de abas específicas para limites internacionais e contato com o Oceano Atlântico, calculada integralmente a partir da Malha Municipal Digital 2024.','research_areas':'Regional science | Territorial planning | Spatial analysis','keywords':'municípios limítrofes | contiguidade | fronteiras municipais | limite internacional | linha de costa | IBGE','geographic_coverage':'Brasil — municípios da Malha Municipal Digital 2024','covers_brazil':'sim','spatial_support':'municípios | pares de municípios | segmentos de limite','spatial_resolution':'municipal e relações de contiguidade; herda parâmetros técnicos e legais da Malha Municipal Digital 2024','temporal_coverage':'versão 2024; divulgada em 29/04/2025','temporal_resolution':'edição territorial','update_frequency':'por versão da estrutura territorial','product_status':'ativo','version_or_collection':'2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/42224-municipios-limitrofes.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/42224-municipios-limitrofes.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'O IBGE declara finalidade estatística e geocientífica e veda o uso como atestado legal ou administrativo. Relações e extensões herdam a geometria e parâmetros da Malha Municipal Digital 2024; contiguidade não mede interação socioeconômica efetiva.','last_verified':'2026-08-15'},
          {'product_id':'DP000168','resource_id':'DR0070','product_name':'Municípios do Hemisfério Norte — versão 2024','product_acronym':'Hemisfério Norte 2024','product_family':'Estrutura Territorial — recortes geométricos nacionais','product_kind':'dataset','product_description':'Recorte do território brasileiro localizado ao norte da Linha do Equador, com polígono nacional, estados, 44 municípios, sedes municipais e tabela de áreas e proporções, derivado por geoprocessamento da estrutura territorial de 2024.','research_areas':'Regional science | Territorial planning | Spatial analysis','keywords':'Hemisfério Norte | Linha do Equador | municípios | sedes | recorte territorial | IBGE','geographic_coverage':'Amazonas, Roraima, Pará e Amapá; 44 municípios com território ao norte da Linha do Equador','covers_brazil':'sim','spatial_support':'polígono nacional | estados | municípios | sedes municipais','spatial_resolution':'municipal e recortes derivados; compatibilidade herdada da Malha Municipal Digital 2024','temporal_coverage':'versão 2024; divulgada em 29/04/2025','temporal_resolution':'edição territorial','update_frequency':'por versão da estrutura territorial','product_status':'ativo','version_or_collection':'2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/43205-municipios-do-hemisferio-norte.html','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/43205-municipios-do-hemisferio-norte.html','primary_or_derived':'derivado','limitations':'O produto representa posição geométrica relativa à Linha do Equador e não uma região funcional, climática ou administrativa. Dos 44 municípios, apenas parte está integralmente no Hemisfério Norte; distinguir área municipal, parcela ao norte e posição da sede.','last_verified':'2026-08-15'},
          {'product_id':'DP000169','resource_id':'DR0070','product_name':'Área de Atuação da SUDENE — edição 2025','product_acronym':'Área SUDENE 2025','product_family':'Estrutura Territorial — recortes legais e institucionais','product_kind':'dataset','product_description':'Recorte geográfico legal da área de atuação da Superintendência do Desenvolvimento do Nordeste, composto por todos os estados da Região Nordeste mais municípios de Minas Gerais e Espírito Santo definidos em legislação federal, disponibilizado pelo IBGE para estatísticas e planejamento.','research_areas':'Regional science | Territorial planning | Spatial analysis','keywords':'SUDENE | desenvolvimento regional | recorte legal | Nordeste | Minas Gerais | Espírito Santo | IBGE','geographic_coverage':'todos os estados da Região Nordeste, 249 municípios de Minas Gerais e 31 municípios do Espírito Santo conforme legislação vigente indicada pelo IBGE','covers_brazil':'sim','spatial_support':'municípios | agregado territorial legal','spatial_resolution':'municipal/agregado; recorte legal','temporal_coverage':'edição 2025; base legal vigente indicada na página oficial','temporal_resolution':'edição territorial','update_frequency':'quando houver alteração legal; limites e nomenclaturas municipais atualizados pelo IBGE','product_status':'ativo','version_or_collection':'2025','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34331-area-de-atuacao-da-sudene.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34331-area-de-atuacao-da-sudene.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'A delimitação é legal, definida por Lei Complementar Federal, não pelo IBGE. O recorte não equivale ao Semiárido brasileiro e não deve ser interpretado como zona climática, ecológica ou socioeconômica homogênea.','last_verified':'2026-08-15'}]
          for r in new:
              assert r['product_id'] not in pids
              assert r['product_name'].casefold() not in names
          fields=list(products[0])
          with p.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writerows(new)
          nd=[
          ['DD000185','DP000167','Municípios Limítrofes 2024 — tabelas','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/42224-municipios-limitrofes.html?lang=pt-BR','XLS | ODS','HTTP download','navegador web | planilha','sim','não','downloads públicos na página oficial','licença específica não inferida no nível do arquivo','sim','por aba/tabela','As três abas distinguem vizinhança municipal, limite internacional e contato com o Atlântico; não tratar essas relações como equivalentes.','2026-08-15'],
          ['DD000186','DP000168','Municípios do Hemisfério Norte 2024 — vetores, tabela e mapa','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/43205-municipios-do-hemisferio-norte.html','SHP | XLSX | ODS | PDF','HTTP download','navegador web | SIG | planilha','sim','não','downloads públicos na página oficial','licença específica não inferida no nível do arquivo','sim','por componente/arquivo','Há produtos distintos para recorte nacional, UFs, municípios e sedes; preservar o componente efetivamente usado.','2026-08-15'],
          ['DD000187','DP000169','Área de Atuação da SUDENE 2025 — tabelas e geosserviços','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34331-area-de-atuacao-da-sudene.html?lang=pt-BR','ODS | XLS | geosserviços','HTTP download | geosserviço','navegador web | Plataforma Geográfica Interativa','sim','não','consulta e downloads públicos','licença específica não inferida no nível do arquivo','sim','por lista/agregado/edição','O IBGE disponibiliza o recorte; sua delimitação é legal e externa ao IBGE.','2026-08-15']]
          dfields=list(distributions[0])
          with d.open('a',encoding='utf-8',newline='') as f:
              w=csv.writer(f,lineterminator='\n')
              for r in nd:
                  assert r[0] not in dids and len(r)==len(dfields); w.writerow(r)
          with p.open(encoding='utf-8-sig',newline='') as f: p2=list(csv.DictReader(f))
          with d.open(encoding='utf-8-sig',newline='') as f: d2=list(csv.DictReader(f))
          assert len(p2)==166 and len(d2)==184
          assert len({r['product_id'] for r in p2})==len(p2)
          assert len({r['distribution_id'] for r in d2})==len(d2)
          ids={r['product_id'] for r in p2}; assert all(r['product_id'] in ids for r in d2)
          print('append2 ok',len(p2),len(d2))
          PY

      - name: Rebuild and validate catalog
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read back second batch
        run: |
          python3 - <<'PY'
          import csv
          checks=[('data/data_products.csv','product_id',{'DP000167','DP000168','DP000169'},166),('data/product_distributions.csv','distribution_id',{'DD000185','DD000186','DD000187'},184)]
          for path,key,want,n in checks:
              with open(path,encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
              assert len(rows)==n; got={r[key] for r in rows}; assert want<=got
              print(path,n,sorted(want))
          PY

      - name: Commit materialized batch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-ibge-territorial-recortes-2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets .github/workflows/one-shot-ibge-territorial-recortes-2.yml
          git commit -m "Expand IBGE territorial structure batch"
          git push origin HEAD:automation/ibge-territorial-recortes-20260815
