name: Automation Siconfi indicators batch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [".siconfi-indicators-trigger"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append verified Siconfi indicators
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          V='2026-08-19'; RID='DR0130'
          pp=Path('data/data_products.csv'); dd=Path('data/product_distributions.csv')
          with pp.open(encoding='utf-8-sig',newline='') as f: products=list(csv.DictReader(f))
          with dd.open(encoding='utf-8-sig',newline='') as f: dists=list(csv.DictReader(f))
          if len(products)!=810 or len(dists)!=843: raise SystemExit(f'unexpected baseline {len(products)}/{len(dists)}')
          names={r['product_name'] for r in products}; urls={r['product_page_url'] for r in products}
          specs=[
          ('Capacidade de Pagamento dos Municípios — CAPAG 2026','CAPAG Municípios','capacidade de pagamento subnacional','indicator_family','Notas de capacidade de pagamento dos municípios e notas dos três indicadores avaliados, calculadas pelo Tesouro Nacional com base em dados do Siconfi; posição oficial de 01/06/2026 usa ano-base 2025 para todos os municípios.','Brasil — municípios','município','municipal; não espacial','posição 01/06/2026; ano-base 2025','por posição/arquivo','periódica','Capag Municípios 2026 — 01/06/2026','https://www.tesourotransparente.gov.br/temas/estados-e-municipios/capacidade-de-pagamento-capag','https://www.gov.br/tesouronacional/pt-br/estados-e-municipios/operacoes-de-credito/Manual_para_Instrucao_de_Pleitos_MIP','derivado','A nota disponibilizada não vincula a posição definitiva do Tesouro para operação de crédito; o cálculo definitivo ocorre na verificação de limites e condições. Preservar data de referência do Siconfi e do Ranking da Qualidade.'),
          ('Ranking da Qualidade da Informação Contábil e Fiscal no Siconfi','Ranking Siconfi','qualidade da informação contábil e fiscal','indicator_family','Ranking do Tesouro Nacional que avalia a consistência das informações contábeis e fiscais recebidas no Siconfi por meio de verificações agrupadas em dimensões de gestão, contábil, fiscal e contábil versus fiscal.','Brasil — estados, DF e municípios conforme edição','ente federativo × verificação/dimensão','administrativo; não espacial','edições anuais; regras e bases variam por edição','anual','anual','edição corrente consultada em 2026','https://www.tesourotransparente.gov.br/historias/ranking-da-qualidade-da-informacao-contabil-e-fiscal-no-siconfi','https://www.tesourotransparente.gov.br/historias/ranking-da-qualidade-da-informacao-contabil-e-fiscal-no-siconfi','derivado','Mede consistência/qualidade das informações prestadas segundo regras do ranking, não qualidade da gestão fiscal, desempenho econômico ou ausência de erro substantivo. Comparações entre edições exigem verificar mudanças nas verificações e pesos.'),
          ('Siconfi — Indicadores Fiscais no Mapa','Indicadores Fiscais — Mapa','indicadores da Lei de Responsabilidade Fiscal','data_service','Consulta cartográfica do Siconfi para acompanhar alguns indicadores fiscais estabelecidos pela Lei de Responsabilidade Fiscal e visualizar seus resultados no mapa do Brasil.','Brasil — estados, DF e municípios conforme indicador','ente federativo × indicador fiscal','município/UF conforme indicador; mapa temático','dados correntes e históricos conforme consulta','conforme indicador','conforme atualização dos demonstrativos de origem','consulta corrente em 2026','https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-indicadores-fiscais-mapa','https://www.tesourotransparente.gov.br/temas/execucao-orcamentaria-e-financeira/lei-de-responsabilidade-fiscal-lrf/','derivado','O mapa é camada de visualização de indicadores derivados de demonstrativos fiscais; não substitui RGF/RREO/DCA, nem transforma limite legal em medida geral de qualidade fiscal. Preservar indicador, período e ente.'),
          ('Siconfi — Quantidade de Declarações Enviadas pelos Entes','Declarações Siconfi','cobertura de entregas ao Siconfi','dataset_series','Consulta que informa a quantidade de declarações enviadas pelos entes da Federação ao Siconfi, apresentando lista de entes e resumo por Unidade da Federação.','Brasil — entes da Federação','ente federativo × tipo/período de declaração','administrativo; não espacial','histórico de envios conforme consulta','evento administrativo/agregado','conforme entregas','consulta corrente em 2026','https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-quantidade-de-declaracoes-enviadas-pelos-entes','https://www.tesourotransparente.gov.br/consultas/consultas-siconfi','primário','Quantidade de declarações mede atividade/cobertura de envio, não qualidade, completude substantiva ou cumprimento fiscal. Ausência de envio não equivale a valor fiscal zero.'),
          ('Siconfi — Coberturas da Declaração de Contas Anuais','Coberturas DCA','cobertura institucional das contas anuais','dataset_series','Consulta do Siconfi destinada a identificar quais entidades e órgãos foram consolidados por cada ente da Federação no envio das contas anuais da DCA.','Brasil — entes da Federação','ente federativo × exercício × entidade/órgão consolidado','administrativo; não espacial','exercícios conforme DCA e consulta','anual','anual','consulta corrente em 2026','https://www.tesourotransparente.gov.br/temas/execucao-orcamentaria-e-financeira/lei-de-responsabilidade-fiscal-lrf/','https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-finbra-demonstrativos-de-contas-anuais','primário','Cobertura informa quais entidades/órgãos foram consolidados na DCA; não certifica completude ou qualidade dos valores contábeis e deve ser interpretada por ente e exercício.'),
          ]
          pstart=829; dstart=862
          outp=[]; outd=[]
          for i,s in enumerate(specs):
              name,acr,fam,kind,desc,geo,support,res,tcov,tres,upd,ver,page,method,pod,lim=s
              if name in names: raise SystemExit('duplicate name '+name)
              if page in urls and 'Coberturas' not in name: raise SystemExit('duplicate URL '+page)
              pid=f'DP{pstart+i:06d}'; did=f'DD{dstart+i:06d}'
              outp.append([pid,RID,name,acr,fam,kind,desc,'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados','Siconfi | finanças públicas | federalismo fiscal | indicadores fiscais | estados | municípios',geo,'sim',support,res,tcov,tres,upd,'ativo',ver,'complete' if kind!='data_service' else 'external_index',page,method,pod,lim,V])
              lic='Open Data Commons Open Database License (ODbL)' if 'CAPAG' in name else 'verificar termos do recurso/consulta oficial; dados Siconfi são disponibilizados para acesso público'
              outd.append([did,pid,name+' — acesso oficial',page,'consulta web | XLSX/API quando disponibilizado','HTTPS | consulta web','navegador web','sim','não','acesso público',lic,'sim','por ente, período e indicador/declaração conforme consulta','Preservar data de referência, ente, exercício/período e definição do indicador ou da cobertura; não inferir valores ausentes.',V])
          with pp.open('a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(outp)
          with dd.open('a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(outd)
          print('APPENDED',outp[0][0],outp[-1][0],outd[0][0],outd[-1][0])
          PY
      - name: Validate, rebuild and commit
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          def rr(p):
            with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          s=rr('data/data_resources.csv'); p=rr('data/data_products.csv'); d=rr('data/product_distributions.csv')
          assert (len(s),len(p),len(d))==(130,815,848),(len(s),len(p),len(d))
          assert all(any(x['product_id']==f'DP{i:06d}' for x in p) for i in range(829,834))
          assert all(any(x['distribution_id']==f'DD{i:06d}' for x in d) for i in range(862,867))
          print('READBACK',len(s),len(p),len(d))
          PY
          git config user.name "vitrine-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv
          git add -u data
          git commit -m "Expand verified Siconfi fiscal-indicators catalog"
          git push origin HEAD:main
