name: Materialize BIG CBERS-4 batch 2026-08-18

on:
  push:
    branches: ["audit/big-cbers4-20260818"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/big-cbers4-20260818
          fetch-depth: 0

      - name: Materializar lote canônico
        run: python3 scripts/materialize_big_cbers4_20260818.py

      - name: Validar escopo e catálogo
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read-back relacional consolidado
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=list(csv.DictReader(Path('data/data_products.csv').open(encoding='utf-8-sig', newline='')))
          d=list(csv.DictReader(Path('data/product_distributions.csv').open(encoding='utf-8-sig', newline='')))
          r=list(csv.DictReader(Path('data/data_resources.csv').open(encoding='utf-8-sig', newline='')))
          pids=[x['product_id'] for x in p]; dids=[x['distribution_id'] for x in d]; rids={x['resource_id'] for x in r}
          assert len(pids)==len(set(pids))
          assert len(dids)==len(set(dids))
          assert all(x['resource_id'] in rids for x in p)
          pset=set(pids)
          assert all(x['product_id'] in pset for x in d)
          expected_p={f'DP{i:06d}' for i in range(687,701)}
          expected_d={f'DD{i:06d}' for i in range(717,731)}
          assert expected_p <= pset, expected_p-pset
          assert expected_d <= set(dids), expected_d-set(dids)
          assert len(r)==123, len(r)
          assert len(p)==696, len(p)
          assert len(d)==726, len(d)
          urls=[x['product_page_url'] for x in p if x['product_id'] in expected_p]
          assert len(urls)==len(set(urls))
          print('OK relational read-back', len(r), len(p), len(d))
          PY

      - name: Remover helpers temporários e commit do lote validado
        run: |
          rm -f scripts/materialize_big_cbers4_20260818.py .github/workflows/materialize-big-cbers4-20260818.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/data_products.json data/product_distributions.csv data/link_role_audit.json
          git add -u scripts/materialize_big_cbers4_20260818.py .github/workflows/materialize-big-cbers4-20260818.yml
          git diff --cached --check
          git commit -m "Expand verified BIG CBERS-4 catalog"
          git push origin HEAD:audit/big-cbers4-20260818
