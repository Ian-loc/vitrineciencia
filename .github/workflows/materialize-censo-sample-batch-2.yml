name: Extend Censo sample batch

on:
  push:
    branches: [audit/censo-sample-batch-20260816-b]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append two verified Censo products
        shell: python
        run: |
          import csv
          from pathlib import Path
          verified='2026-08-16'
          p=Path('data/data_products.csv'); d=Path('data/product_distributions.csv')
          with p.open(encoding='utf-8', newline='') as f:
              rows=list(csv.DictReader(f)); pf=list(rows[0])
          ids={r['product_id'] for r in rows}; names={r['product_name'].casefold() for r in rows}
          add=[
            {'product_id':'DP000240','resource_id':'DR0086','product_name':'Características dos domicílios — Censo Demográfico 2022 — resultados do universo','product_acronym':'Domicílios Universo Censo 2022','product_family':'Censo 2022 — características dos domicílios','product_kind':'dataset','product_description':'Resultados do universo do Censo 2022 sobre condições e serviços essenciais dos domicílios particulares permanentes ocupados, incluindo abastecimento de água, esgotamento sanitário, destino do lixo, banheiro/sanitário e canalização de água.','research_areas':'Population geography | Social statistics | Territorial analysis | Public policy','keywords':'domicílios | abastecimento de água | esgotamento sanitário | lixo | banheiro | saneamento | universo | Censo 2022 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; Regiões Geográficas Intermediárias e Imediatas; Concentrações Urbanas; Municípios','covers_brazil':'sim','spatial_support':'domicílios particulares permanentes ocupados e moradores agregados por recortes territoriais | SIDRA | Panorama | PGI','spatial_resolution':'Município na divulgação territorial; outros recortes agregados disponíveis','temporal_coverage':'Censo Demográfico 2022','temporal_resolution':'snapshot censitário; resultados do universo','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'resultados do universo; publicação corrigida/substituída em 05/06/2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/2098-np-censo-demografico/22827-censo-demografico-2022.html?edicao=39224','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/2098-np-censo-demografico/22827-censo-demografico-2022.html?edicao=39224','primary_or_derived':'derivado','limitations':'Resultados do universo para domicílios particulares permanentes ocupados e variáveis específicas do Questionário Básico; não devem ser confundidos com as características adicionais investigadas apenas na amostra. A publicação foi corrigida e substituída em 05/06/2024. Indicadores de infraestrutura domiciliar não equivalem automaticamente à qualidade técnica do serviço.','last_verified':verified},
            {'product_id':'DP000241','resource_id':'DR0086','product_name':'Deslocamentos para trabalho e para estudos — Censo Demográfico 2022 — resultados preliminares da amostra','product_acronym':'Deslocamentos Censo 2022','product_family':'Censo 2022 — mobilidade cotidiana','product_kind':'dataset','product_description':'Resultados preliminares da amostra do Censo 2022 sobre deslocamentos para trabalho e estudo, incluindo local de trabalho/estudo, frequência de retorno ao domicílio, tempo de deslocamento e principal meio de transporte utilizado.','research_areas':'Population geography | Social statistics | Territorial analysis | Demography','keywords':'deslocamento | trabalho | estudo | mobilidade | tempo de viagem | meio de transporte | município | Censo 2022 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; Municípios e demais domínios de divulgação da amostra','covers_brazil':'sim','spatial_support':'pessoas agregadas por condição de deslocamento, trabalho/estudo e recortes territoriais | SIDRA | Panorama','spatial_resolution':'Município e demais domínios de divulgação publicados','temporal_coverage':'Censo Demográfico 2022; semana/períodos de referência próprios das variáveis de trabalho e estudo','temporal_resolution':'snapshot censitário com referências de trabalho/estudo; resultados preliminares da amostra','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'publicação 2025 — resultados preliminares da amostra','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=44665','methodology_url':'https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=44665','primary_or_derived':'derivado','limitations':'Resultados preliminares da amostra; deslocamento declarado no contexto censitário não é rastreamento de mobilidade em tempo real nem fluxo observado continuamente. Tempo e meio principal de transporte seguem definições específicas do questionário e exigem desenho amostral, pesos e domínios de estimação.','last_verified':verified}
          ]
          for r in add:
              if r['product_id'] in ids or r['product_name'].casefold() in names: raise SystemExit('product collision/duplicate')
              if set(r)!=set(pf): raise SystemExit(f"field mismatch {r['product_id']} {set(r)^set(pf)}")
          with p.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pf,lineterminator='\n'); w.writerows(add)
          with d.open(encoding='utf-8',newline='') as f:
              dr=list(csv.DictReader(f)); df=list(dr[0])
          dids={r['distribution_id'] for r in dr}
          da=[
            {'distribution_id':'DD000261','product_id':'DP000240','distribution_name':'Características dos domicílios Censo 2022 — universo — SIDRA, Panorama e PGI','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/2098-np-censo-demografico/22827-censo-demografico-2022.html?edicao=39224','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022 | PGI','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; usar a publicação corrigida e observar revisões do produto','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, variável domiciliar, grupo sociodemográfico e recorte territorial disponível','notes':'Resultados do universo para domicílios particulares permanentes ocupados; publicação substituída em 05/06/2024 após correção factual.','last_verified':verified},
            {'distribution_id':'DD000262','product_id':'DP000241','distribution_name':'Deslocamentos Censo 2022 — SIDRA, Panorama e publicação','access_url':'https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=44665','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; análises devem respeitar desenho amostral, pesos e definições de deslocamento','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, finalidade do deslocamento, tempo, meio de transporte e domínio geográfico disponível','notes':'Resultados preliminares da amostra; não representa rastreamento de mobilidade em tempo real ou matriz contínua de fluxos.','last_verified':verified}
          ]
          for r in da:
              if r['distribution_id'] in dids: raise SystemExit('distribution collision')
              if set(r)!=set(df): raise SystemExit(f"distribution field mismatch {r['distribution_id']} {set(r)^set(df)}")
          with d.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=df,lineterminator='\n'); w.writerows(da)
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          for p, exp in [('data/data_resources.csv',92),('data/data_products.csv',237),('data/product_distributions.csv',258)]:
              with open(p,encoding='utf-8',newline='') as f: n=sum(1 for _ in csv.DictReader(f))
              print(p,n)
              if n!=exp: raise SystemExit(f'{p}: expected {exp}, got {n}')
          PY
      - name: Commit extension and remove workflow
        run: |
          rm .github/workflows/materialize-censo-sample-batch-2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extend verified Censo 2022 thematic batch"
          git push origin HEAD:audit/censo-sample-batch-20260816-b
