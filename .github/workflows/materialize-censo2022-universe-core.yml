name: Materialize Censo 2022 universe core batch

on:
  push:
    branches:
      - agent/vitrine-censo2022-universe-core-20260816
    paths:
      - '.github/workflows/materialize-censo2022-universe-core.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-censo2022-universe-core-20260816

      - name: Append verified products and distributions
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          products_path = Path('data/data_products.csv')
          dists_path = Path('data/product_distributions.csv')

          product_rows = [
            {
              'product_id':'DP000242','resource_id':'DR0086','product_name':'População por idade e sexo — Censo Demográfico 2022 — resultados do universo','product_acronym':'Idade e sexo Censo 2022','product_family':'Censo 2022 — estrutura etária e sexo','product_kind':'dataset','product_description':'Resultados do universo do Censo Demográfico 2022 sobre distribuição da população residente por idade e sexo, incluindo indicadores como idade mediana, índice de envelhecimento e razão de sexo nos recortes divulgados pelo IBGE.','research_areas':'Population geography | Demography | Social statistics | Territorial analysis','keywords':'idade | sexo | estrutura etária | envelhecimento | população residente | Censo 2022 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação e demais recortes disponibilizados no SIDRA/PGI','covers_brazil':'sim','spatial_support':'pessoas agregadas por idade, sexo e recortes territoriais | SIDRA | PGI | publicação','spatial_resolution':'conforme tabela e recorte de divulgação; não inferir granularidade única','temporal_coverage':'Censo Demográfico 2022; dados da segunda apuração com revisões incorporadas em 2023','temporal_resolution':'snapshot censitário; resultados do universo','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'resultados do universo — segunda apuração; SIDRA atualizado em 22/12/2023','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=38166&t=resultados','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=38166&t=resultados','primary_or_derived':'derivado','limitations':'Resultados agregados do universo e sujeitos à política de revisão do Censo. Idade e sexo são atributos censitários na data de referência; não representam dinâmica demográfica contínua. Comparações temporais exigem harmonização de recortes territoriais e versões.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000243','resource_id':'DR0086','product_name':'População por cor ou raça — Censo Demográfico 2022 — resultados do universo','product_acronym':'Cor ou raça Censo 2022','product_family':'Censo 2022 — pertencimento étnico-racial','product_kind':'dataset','product_description':'Resultados do universo do Censo Demográfico 2022 sobre população residente segundo as categorias censitárias de cor ou raça, com desagregações por sexo, idade e recortes territoriais e indicadores demográficos associados.','research_areas':'Population geography | Social statistics | Demography | Territorial analysis','keywords':'cor ou raça | branca | preta | amarela | parda | indígena | sexo | idade | Censo 2022 | IBGE','geographic_coverage':'Brasil; recortes territoriais disponibilizados no SIDRA, Panorama e PGI','covers_brazil':'sim','spatial_support':'pessoas agregadas por cor ou raça e características demográficas | SIDRA | Panorama | PGI','spatial_resolution':'conforme tabela e recorte de divulgação; não inferir granularidade única','temporal_coverage':'Censo Demográfico 2022','temporal_resolution':'snapshot censitário; resultados do universo','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'divulgação temática de 22/12/2023; resultados do universo','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=38698','methodology_url':'https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=38698','primary_or_derived':'derivado','limitations':'Cor ou raça segue categorias e procedimentos censitários de autodeclaração/declaração do informante e não equivale a território étnico, ancestralidade genética ou identidade individual fora do contexto da operação. Comparações entre censos devem preservar mudanças de cobertura, metodologia e recortes.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000244','resource_id':'DR0086','product_name':'Indígenas — principais características das pessoas e dos domicílios por situação urbana ou rural — Censo 2022 — resultados do universo','product_acronym':'Indígenas urbano-rural Censo 2022','product_family':'Censo 2022 — população indígena e domicílios','product_kind':'dataset','product_description':'Resultados do universo do Censo 2022 sobre características demográficas e sociais das pessoas indígenas e dos domicílios com moradores indígenas, organizados por situação urbana ou rural e recortes territoriais específicos, incluindo alfabetização, registro de nascimento, saneamento e composição familiar.','research_areas':'Indigenous studies | Population geography | Social statistics | Environmental justice','keywords':'indígenas | domicílios | urbano | rural | alfabetização | registro de nascimento | saneamento | composição familiar | Terras Indígenas | Censo 2022','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; Municípios; Amazônia Legal; Terras Indígenas e recortes específicos divulgados','covers_brazil':'sim','spatial_support':'pessoas indígenas | domicílios com moradores indígenas | municípios | Terras Indígenas | tabelas e visualizações','spatial_resolution':'múltiplos recortes censitários e territoriais específicos; não inferir equivalência jurídica entre recortes','temporal_coverage':'Censo Demográfico 2022','temporal_resolution':'snapshot censitário; resultados do universo','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'divulgação de 19/12/2024; resultados do universo','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=42267','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=42267','primary_or_derived':'derivado','limitations':'Produto estatístico censitário; pessoa indígena, Terra Indígena, situação urbana/rural e domicílio com morador indígena são dimensões distintas. Os resultados não substituem cadastros fundiários, registros administrativos ou medições ambientais e devem preservar definições pactuadas e recortes específicos.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000245','resource_id':'DR0086','product_name':'Quilombolas — principais características das pessoas e dos domicílios por situação urbana ou rural — Censo 2022 — resultados do universo','product_acronym':'Quilombolas urbano-rural Censo 2022','product_family':'Censo 2022 — população quilombola e domicílios','product_kind':'dataset','product_description':'Resultados do universo do Censo 2022 sobre características demográficas e sociais das pessoas quilombolas e dos domicílios com pelo menos um morador quilombola, organizados por situação urbana ou rural e por recortes territoriais específicos.','research_areas':'Population geography | Social statistics | Environmental justice | Territorial analysis','keywords':'quilombolas | domicílios | urbano | rural | Territórios Quilombolas | Amazônia Legal | Censo 2022 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; Municípios; Amazônia Legal; Territórios Quilombolas oficialmente delimitados e recortes associados','covers_brazil':'sim','spatial_support':'pessoas quilombolas | domicílios com moradores quilombolas | municípios | Territórios Quilombolas | tabelas e visualizações','spatial_resolution':'múltiplos recortes censitários e territoriais específicos; não inferir equivalência jurídica entre recortes','temporal_coverage':'Censo Demográfico 2022','temporal_resolution':'snapshot censitário; resultados do universo','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'divulgação de 09/05/2025; resultados do universo','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=43246','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=43246','primary_or_derived':'derivado','limitations':'Produto estatístico censitário. Pessoa quilombola, comunidade declarada, Território Quilombola oficialmente delimitado e situação urbana/rural são conceitos distintos; resultados não substituem cadastros fundiários ou reconhecimento jurídico e devem ser analisados segundo os recortes e definições da divulgação.','last_verified':'2026-08-16'
            }
          ]

          dist_rows = [
            {'distribution_id':'DD000263','product_id':'DP000242','distribution_name':'Idade e sexo Censo 2022 — SIDRA, PGI e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=38166&t=resultados','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | PGI','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; observar revisões e composição dos recortes territoriais','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, idade, sexo, indicador demográfico e recorte territorial disponível','notes':'A divulgação corresponde à segunda apuração e incorpora revisões de 2023; o SIDRA foi atualizado em 22/12/2023.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000264','product_id':'DP000243','distribution_name':'Cor ou raça Censo 2022 — SIDRA, Panorama, PGI e publicação','access_url':'https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=38698','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022 | PGI','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; observar categorias censitárias, notas metodológicas e política de revisão','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, cor ou raça, sexo, idade, indicador e recorte territorial disponível','notes':'Não converter categorias censitárias em ancestralidade genética, território étnico ou classificação individual fora do contexto da operação.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000265','product_id':'DP000244','distribution_name':'Indígenas urbano-rural Censo 2022 — SIDRA, Panorama, PGI e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=42267','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022 | PGI','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; preservar definições censitárias, recortes indígenas e situação urbana/rural','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, característica, situação urbana/rural, Município, Terra Indígena e demais recortes disponíveis','notes':'Resultados do universo; não confundir recortes estatísticos com cadastro fundiário ou condição jurídica das Terras Indígenas.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000266','product_id':'DP000245','distribution_name':'Quilombolas urbano-rural Censo 2022 — SIDRA, Panorama e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=43246','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; preservar definições censitárias, recortes quilombolas e situação urbana/rural','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, característica, situação urbana/rural, Município, Território Quilombola e demais recortes disponíveis','notes':'Resultados do universo; não confundir identificação estatística de pessoas/comunidades com reconhecimento jurídico ou delimitação fundiária.','last_verified':'2026-08-16'}
          ]

          with products_path.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              p_fields = reader.fieldnames
              existing = list(reader)
          existing_ids = {r['product_id'] for r in existing}
          existing_names = {r['product_name'].strip().casefold() for r in existing}
          for row in product_rows:
              assert row['product_id'] not in existing_ids, row['product_id']
              assert row['product_name'].strip().casefold() not in existing_names, row['product_name']
              assert set(row) == set(p_fields), (row['product_id'], set(p_fields)-set(row), set(row)-set(p_fields))
          with products_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=p_fields, lineterminator='\n')
              for row in product_rows:
                  w.writerow(row)

          with dists_path.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              d_fields = reader.fieldnames
              existing_d = list(reader)
          existing_dids = {r['distribution_id'] for r in existing_d}
          for row in dist_rows:
              assert row['distribution_id'] not in existing_dids, row['distribution_id']
              assert set(row) == set(d_fields), (row['distribution_id'], set(d_fields)-set(row), set(row)-set(d_fields))
          with dists_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=d_fields, lineterminator='\n')
              for row in dist_rows:
                  w.writerow(row)

          # read-back relational checks
          with products_path.open(encoding='utf-8', newline='') as f:
              products = list(csv.DictReader(f))
          with dists_path.open(encoding='utf-8', newline='') as f:
              dists = list(csv.DictReader(f))
          pids = [r['product_id'] for r in products]
          dids = [r['distribution_id'] for r in dists]
          assert len(pids) == len(set(pids))
          assert len(dids) == len(set(dids))
          assert all(x in set(pids) for x in ['DP000242','DP000243','DP000244','DP000245'])
          assert all(x in set(dids) for x in ['DD000263','DD000264','DD000265','DD000266'])
          assert all(r['resource_id']=='DR0086' for r in products if r['product_id'] in {'DP000242','DP000243','DP000244','DP000245'})
          assert all(r['product_id'] in set(pids) for r in dists)
          print(f'read-back: products={len(products)} distributions={len(dists)}')
          PY

      - name: Validate catalog and Vitrine
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Commit materialized batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/data_products.json
          git diff --cached --check
          git commit -m "Materialize verified Censo 2022 universe core batch"
          git push origin HEAD:agent/vitrine-censo2022-universe-core-20260816
