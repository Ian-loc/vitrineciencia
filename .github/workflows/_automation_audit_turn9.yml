name: Automation audit turn 9 materializer

on:
  push:
    branches: ["main"]
    paths:
      - ".automation-audit-turn9-trigger"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified batch
        run: python3 scripts/_automation_audit_turn9.py
      - name: Stage canonical and derived files
        run: |
          git config user.name "Vitrine Science Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv
          git add data/brazil_scope_priorities.json data/data_resources.json data/data_products.json
          git add data/data_quality_report.json data/link_role_audit.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No material data changes to commit"
          else
            git commit -m "Expand verified Ipea civil-society and violence catalog"
            git push origin HEAD:main
          fi
