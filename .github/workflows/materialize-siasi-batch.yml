name: Materialize verified SIASI catalog batch

on:
  push:
    paths:
      - '.github/workflows/materialize-siasi-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified SIASI source, products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          reviewed='2026-08-17'
          source_id='DR0114'
          source={
            'resource_id':source_id,
            'resource_name':'Sistema de Informação da Atenção à Saúde Indígena — SIASI/Sesai',
            'acronym':'SIASI',
            'official_identity':'Sistema de informação do Subsistema de Atenção à Saúde Indígena (SasiSUS), sob gestão da Secretaria de Saúde Indígena — Sesai/MS',
            'description':'Sistema e família de bases administrativas e assistenciais da saúde indígena, com dados demográficos, morbidades, imunização, saúde materno-infantil, saúde bucal e vigilância alimentar e nutricional da população indígena assistida pelo SasiSUS.',
            'homepage_url':'https://www.gov.br/saude/pt-br/composicao/sesai',
            'data_access_url':'https://dadosabertos.saude.gov.br/dataset',
            'research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados',
            'keywords':'SIASI | Sesai | SasiSUS | saúde indígena | DSEI | vigilância | morbidades | atenção primária',
            'data_product_types':'microdados | registros assistenciais | morbidades | indicadores | dicionários | notas técnicas',
            'data_formats':'CSV | JSON | XML | PDF; varia por produto',
            'visualization_types':'tabelas | análises derivadas; depende do produto',
            'geographic_coverage':'Brasil — população indígena assistida no âmbito do SasiSUS; muitos produtos cobrem os 34 DSEI',
            'covers_brazil':'sim',
            'spatial_resolution':'registro individual anonimizado e/ou DSEI/território assistencial conforme produto',
            'temporal_coverage':'varia por módulo; produtos auditados incluem 2019–2024 e recortes de 2022',
            'temporal_resolution':'evento, atendimento ou ano conforme módulo',
            'data_sources':'registros do SIASI | equipes e serviços do SasiSUS | DSEI | Sesai/MS',
            'free_download':'sim',
            'access_conditions':'recursos públicos disseminados de forma anonimizada; observar dicionários, notas técnicas, LGPD e população efetivamente coberta pelo SasiSUS',
            'programmatic_access':'parcial',
            'access_protocols':'HTTPS download | API em recursos selecionados',
            'authentication_required':'não',
            'access_documentation_url':'https://dadosabertos.saude.gov.br/dataset',
            'license':'conteúdo do Portal de Dados Abertos do SUS sob Creative Commons Atribuição-SemDerivações 3.0; verificar termos no nível do recurso',
            'institutional_status':'público',
            'owner_or_manager':'Secretaria de Saúde Indígena — Sesai / Ministério da Saúde — Brasil',
            'academic_uses':'Saúde indígena, epidemiologia, saúde materno-infantil, nutrição, imunização, zoonoses, equidade territorial e avaliação de políticas de saúde.',
            'limitations':'A população coberta é a população indígena assistida pelo SasiSUS e não deve ser tratada automaticamente como censo de toda a população indígena do Brasil. Completude, fluxo de registro e acesso a serviços variam entre DSEI, períodos e módulos; registros administrativos não equivalem a incidência ou prevalência populacional sem denominadores e desenho analítico adequados.',
            'academic_evidence_type':'documentação oficial',
            'academic_evidence_url':'https://dadosabertos.saude.gov.br/dataset/siasi_dados_demograficos',
            'academic_evidence_note':'O Portal de Dados Abertos do SUS documenta conjuntos SIASI/Sesai, população coberta, recursos, datas de atualização, frequência e responsáveis.',
            'verification_url':'https://dadosabertos.saude.gov.br/dataset/siasi_dados_demograficos',
            'last_verified':reviewed,
          }

          products=[
          ('DP000488','SIASI/Sesai — Dados demográficos 2022','SIASI Demografia','demografia da saúde indígena','Registros do quantitativo populacional de indígenas atendidos pelo SasiSUS no ano de 2022.','população indígena | SIASI | demografia | SasiSUS | DSEI','Brasil — população indígena atendida pelo SasiSUS','pessoa/registro e agregações disponibilizadas','2022','anual','anual','atualizado em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_dados_demograficos','Quantitativo do universo assistido/cadastrado no SasiSUS; não equivale ao total censitário de indígenas do Brasil e pode diferir do Censo Demográfico por conceito, cobertura e referência temporal.'),
          ('DP000489','SIASI/Sesai — Monitorização das Doenças Diarreicas Agudas (MDDA) 2022','SIASI MDDA','vigilância de doenças diarreicas agudas','Dados de Doenças Diarreicas Agudas monitoradas no âmbito do SasiSUS, com cobertura dos 34 DSEI.','diarreia | MDDA | saúde indígena | vigilância | DSEI','34 Distritos Sanitários Especiais Indígenas','registro de monitoramento/atendimento','2022','evento/registro','semestral','portal atualizado em 13/08/2026; recursos em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_doencas_diarreicas_diarreia_agudas_mdda','Dados de vigilância/assistência da população coberta; não representam incidência verdadeira sem denominador, completude e regras de monitoramento. Subnotificação e diferenças entre DSEI devem ser consideradas.'),
          ('DP000490','SIASI/Sesai — Doenças zoonóticas 2022','SIASI Zoonoses','morbidades e zoonoses','Registros de leishmaniose visceral, leishmaniose tegumentar e acidentes por animais potencialmente transmissores de raiva na população indígena assistida pelo SasiSUS em 2022.','zoonoses | leishmaniose | raiva | saúde indígena | DSEI','34 Distritos Sanitários Especiais Indígenas','registro de morbidade','2022','evento/registro','anual','portal atualizado em 13/08/2026; recursos em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_doencas_zoonoticas_leishmaniose_visceral','Registros administrativos/assistenciais não equivalem a incidência populacional nem a ocorrência ambiental dos vetores/reservatórios; comparação exige denominadores e regras diagnósticas.'),
          ('DP000491','SIASI/Sesai — Cobertura vacinal 2022','SIASI Imunização','imunização na saúde indígena','Coberturas vacinais da população indígena assistida pelo SasiSUS nos 34 DSEI, referentes a 2022 e a múltiplos imunobiológicos.','vacinação | cobertura vacinal | saúde indígena | DSEI | SasiSUS','34 Distritos Sanitários Especiais Indígenas','DSEI/população-alvo conforme imunobiológico','2022','anual','anual','recursos atualizados em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_imunizacao_vacinacao','Cobertura depende de numeradores, populações-alvo e regras de dose; não confundir dose registrada, pessoa imunizada e efetividade vacinal. A população é a assistida pelo SasiSUS.'),
          ('DP000492','SIASI/Sesai — Hepatites virais 2022','SIASI Hepatites','morbidades — hepatites virais','Dados de hepatites virais ocorridos na população indígena assistida pelo SasiSUS em 2022.','hepatites virais | morbidade | saúde indígena | vigilância | DSEI','34 Distritos Sanitários Especiais Indígenas','registro de morbidade','2022','evento/registro','semestral','recursos atualizados em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_modulo_morbidades_hepatites_virais','Registros dependem de diagnóstico, acesso e completude do SIASI; não equivalem automaticamente a prevalência de hepatites na população indígena total.'),
          ('DP000493','SIASI/Sesai — Doenças imunopreveníveis 2022','SIASI Imunopreveníveis','morbidades — doenças imunopreveníveis','Registros SIASI de doenças imunopreveníveis na população indígena assistida pelo SasiSUS, incluindo sarampo, coqueluche, difteria, meningites, tétano, varicela e outros agravos definidos no conjunto.','imunopreveníveis | morbidade | sarampo | coqueluche | meningite | saúde indígena','34 Distritos Sanitários Especiais Indígenas','registro de morbidade','2022','evento/registro','semestral','recursos atualizados em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_morbidades_imunopreveniveis','Conjunto reúne agravos distintos com definições e frequências diferentes; não somar categorias como carga única nem interpretar registros como incidência sem denominadores e avaliação de completude.'),
          ('DP000494','SIASI/Sesai — Arboviroses 2022','SIASI Arboviroses','morbidades — arboviroses','Dados de dengue, zika, chikungunya, febre amarela e outras arboviroses ocorridos na população indígena assistida pelo SasiSUS em 2022.','arboviroses | dengue | zika | chikungunya | febre amarela | saúde indígena','34 Distritos Sanitários Especiais Indígenas','registro de morbidade','2022','evento/registro','semestral','recursos atualizados em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_modulo_morbidades_dados_arboviroses','Morbidades notificadas/registradas no SIASI não equivalem a incidência total nem a presença vetorial. Agravos têm critérios próprios; análises exigem denominadores e contexto de vigilância.'),
          ('DP000495','SIASI/Sesai — Acidentes ofídicos 2022','SIASI Ofidismo','morbidades — acidentes ofídicos','Dados de acidentes ofídicos ocorridos na população indígena assistida pelo SasiSUS em 2022.','ofidismo | acidentes ofídicos | saúde indígena | animais peçonhentos | DSEI','34 Distritos Sanitários Especiais Indígenas','registro de acidente/atendimento','2022','evento/registro','conforme publicação','recursos atualizados em 12/08/2026','https://dadosabertos.saude.gov.br/dataset/siasi_web_acidentes_ofidicos','Registros de acidentes atendidos/notificados não constituem mapa de distribuição de serpentes nem incidência populacional sem denominadores, acesso a cuidado e completude.'),
          ('DP000496','SIASI/Sesai — Acompanhamento gestacional 2019–2024','SIASI Gestação','saúde materna e pré-natal','Microdados de gestações de mulheres indígenas residentes em aldeias ou acampamentos, finalizadas no ano de referência, incluindo acompanhamentos por EMSI/DSEI e unidades de referência.','gestação | pré-natal | saúde indígena | saúde materna | SIASI','Brasil — população indígena assistida pelo SasiSUS','gestação/acompanhamento','2019–2024','consulta/gestação','anual','microdados 2024 atualizados em 08/07/2026','https://dadosabertos.saude.gov.br/dataset/acompanhamento-gestacional-siasi','Representa gestações registradas e finalizadas no SIASI, não todos os eventos gestacionais da população indígena. Consultas registradas não medem por si só qualidade ou adequação do cuidado.'),
          ('DP000497','SIASI/Sesai — Saúde Bucal 2019–2024','SIASI Saúde Bucal','saúde bucal indígena','Três bancos de microdados do módulo de Saúde Bucal: atividades coletivas, ficha odontológica individual e procedimentos individuais, com séries anuais disponibilizadas.','saúde bucal | odontologia | saúde indígena | procedimentos | SIASI','Brasil — população indígena assistida pelo SasiSUS','atividade coletiva | pessoa/ficha odontológica | procedimento','2019–2024','atividade/atendimento','anual','recursos 2024 atualizados em 08/07/2026','https://dadosabertos.saude.gov.br/dataset/saude-bucal-siasi','Os três bancos possuem unidades de análise diferentes e não devem ser concatenados como se fossem observações equivalentes. Atendimentos/procedimentos registrados dependem do acesso e registro assistencial.'),
          ('DP000498','SIASI/Sesai — Vigilância Alimentar e Nutricional 2019–2024','SIASI VAN','vigilância alimentar e nutricional indígena','Microdados de vigilância alimentar e nutricional de crianças indígenas menores de cinco anos, com indicadores antropométricos recomendados pela OMS e situação de aleitamento materno.','nutrição | antropometria | aleitamento | crianças indígenas | VAN | SIASI','Brasil — crianças indígenas menores de 5 anos assistidas pelo SasiSUS','criança/avaliação antropométrica','2019–2024','avaliação/ano','anual','microdados 2019–2024 atualizados em 07/07/2026','https://dadosabertos.saude.gov.br/dataset/alimentar-nutricional-van-siasi','Registros de crianças avaliadas no serviço não formam amostra probabilística de toda a população indígena menor de cinco anos. Estado nutricional depende de idade, sexo, medidas, referência OMS e qualidade antropométrica.'),
          ('DP000499','SIASI/Sesai — Acompanhamento de crianças menores de um ano 2019–2024','SIASI Criança <1','saúde da criança indígena','Microdados do módulo de morbidades para exame de rotina de saúde da criança (CID Z001), referentes ao acompanhamento de crianças indígenas menores de um ano pelas equipes de saúde.','saúde da criança | crescimento | desenvolvimento | menores de um ano | SIASI','Brasil — crianças indígenas menores de um ano assistidas pelo SasiSUS','criança/acompanhamento','2019–2024','consulta/acompanhamento','anual','microdados 2024 atualizados em 08/07/2026','https://dadosabertos.saude.gov.br/dataset/rotina-saude-da-crianca-siasi','Dados descrevem acompanhamentos registrados, não uma coorte populacional completa nem medida direta de desenvolvimento infantil. Ausência de registro não significa ausência de acompanhamento fora do SIASI.'),
          ]

          pfields=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')).fieldnames)
          existing_products=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')))
          existing_pids={r['product_id'] for r in existing_products}
          existing_urls={r['product_page_url'] for r in existing_products}
          if any(p[0] in existing_pids or p[13] in existing_urls for p in products):
              raise SystemExit('Product ID or canonical URL already catalogued')

          with open('data/data_resources.csv',encoding='utf-8',newline='') as f:
              rreader=csv.DictReader(f); rfields=rreader.fieldnames; resources=list(rreader)
          if source_id in {r['resource_id'] for r in resources}:
              raise SystemExit(f'{source_id} already exists')
          with open('data/data_resources.csv','a',encoding='utf-8',newline='') as f:
              csv.DictWriter(f,fieldnames=rfields,lineterminator='\n').writerow(source)

          with open('data/data_products.csv','a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pfields,lineterminator='\n')
              for pid,name,acr,family,desc,kw,geo,support,tcover,tres,ufreq,version,url,lim in products:
                  w.writerow({
                    'product_id':pid,'resource_id':source_id,'product_name':name,'product_acronym':acr,
                    'product_family':family,'product_kind':'dataset_series','product_description':desc,
                    'research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados',
                    'keywords':kw,'geographic_coverage':geo,'covers_brazil':'sim','spatial_support':support,
                    'spatial_resolution':'registro individual anonimizado e/ou DSEI/agregação conforme recurso','temporal_coverage':tcover,
                    'temporal_resolution':tres,'update_frequency':ufreq,'product_status':'ativo','version_or_collection':version,
                    'enumeration_scope':'complete','product_page_url':url,'methodology_url':url,'primary_or_derived':'primário',
                    'limitations':lim,'last_verified':reviewed})

          dist_urls=[p[13] for p in products]
          dfields=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')).fieldnames)
          existing_dids={r['distribution_id'] for r in csv.DictReader(open('data/product_distributions.csv',encoding='utf-8'))}
          dids=[f'DD{i:06d}' for i in range(513,525)]
          if any(d in existing_dids for d in dids): raise SystemExit('Distribution ID collision')
          with open('data/product_distributions.csv','a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=dfields,lineterminator='\n')
              for did,p,url in zip(dids,products,dist_urls):
                  w.writerow({'distribution_id':did,'product_id':p[0],'distribution_name':p[2]+' — dados e documentação oficiais','access_url':url,
                    'format':'CSV | JSON | XML | PDF/documentação; disponibilidade varia por conjunto','access_protocol':'HTTPS download | API quando oferecida pelo recurso','access_tool':'Portal de Dados Abertos do SUS','free_download':'sim','authentication_required':'não',
                    'access_conditions':'acesso público; observar anonimização, dicionário, nota técnica, população coberta e eventuais revisões','license':'conteúdo do portal sob Creative Commons Atribuição-SemDerivações 3.0; verificar termos do recurso','provider_attribution_required':'sim','subset_support':'por ano/recurso e, quando disponível, DSEI ou variáveis do arquivo','notes':'O portal disponibiliza arquivos estruturados e documentação. Formatos e APIs não devem ser generalizados além do que estiver listado no conjunto específico.','last_verified':reviewed})

          path=Path('data/brazil_scope_priorities.json')
          pri=json.loads(path.read_text(encoding='utf-8'))
          p0=next(t for t in pri['tiers'] if t['priority_tier']=='P0')
          if source_id not in p0['resource_ids']: p0['resource_ids'].append(source_id)
          pri['reviewed_at']=reviewed
          path.write_text(json.dumps(pri,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('appended',source_id,len(products),len(dids))
          PY
      - name: Validate Brazil scope and catalog
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
      - name: Rebuild derived catalog and link audit
        run: |
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
      - name: Validate Vitrine and public artifact
        run: |
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity
        run: |
          python - <<'PY'
          import csv
          rs=list(csv.DictReader(open('data/data_resources.csv',encoding='utf-8')))
          ps=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')))
          ds=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')))
          rids={r['resource_id'] for r in rs}; pids={p['product_id'] for p in ps}; dids={d['distribution_id'] for d in ds}
          assert len(rids)==len(rs) and len(pids)==len(ps) and len(dids)==len(ds)
          assert all(p['resource_id'] in rids for p in ps)
          assert all(d['product_id'] in pids for d in ds)
          assert all(f'DP{i:06d}' in pids for i in range(488,500))
          assert all(f'DD{i:06d}' in dids for i in range(513,525))
          assert 'DR0114' in rids
          print(f'canonical counts: {len(rs)} sources | {len(ps)} products | {len(ds)} distributions')
          PY
      - name: Commit materialized batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-siasi-batch.yml
          git add data/data_resources.csv data/data_products.csv data/data_products.json data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json 2>/dev/null || true
          git add -u
          git commit -m 'Expand verified SIASI indigenous-health catalog'
          git push origin HEAD:main
