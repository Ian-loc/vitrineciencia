name: One-shot Vitrine agro audit v3
on:
  push:
    branches: [agent/vitrine-agro-dedupe-20260816]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-agro-dedupe-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Curate and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, re, unicodedata
          from pathlib import Path
          TODAY='2026-08-16'
          S=Path('data/data_resources.csv'); P=Path('data/data_products.csv'); D=Path('data/product_distributions.csv'); B=Path('data/brazil_scope_priorities.json')
          def norm(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower(); return re.sub(r'[^a-z0-9]+',' ',s).strip()
          def rows(path):
              with path.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def rowtext(fields,row):
              b=io.StringIO(); csv.DictWriter(b,fieldnames=fields,lineterminator='\n').writerow(row); return b.getvalue()
          def rewrite(path,idfield,remove,replacements=None):
              replacements=replacements or {}; text=path.read_text(encoding='utf-8-sig'); lines=text.splitlines(keepends=True); header=next(csv.reader([lines[0]])); out=[lines[0]]
              for line in lines[1:]:
                  vals=next(csv.reader([line])); r=dict(zip(header,vals)); ident=r[idfield]
                  if ident in remove: continue
                  if ident in replacements: r.update(replacements[ident]); line=rowtext(header,r)
                  out.append(line)
              path.write_text(''.join(out),encoding='utf-8')

          sources,products,dists=rows(S),rows(P),rows(D)
          print('START',len(sources),len(products),len(dists))
          bypid={r['product_id']:r for r in products}; a,b=bypid['DP000025'],bypid['DP000050']
          assert a['resource_id']==b['resource_id']=='DR0010'
          assert a['version_or_collection']==b['version_or_collection']=='Coleção 10.1'
          assert a['product_page_url']==b['product_page_url']=='https://brasil.mapbiomas.org/colecoes-mapbiomas/'
          assert a['methodology_url']==b['methodology_url']=='https://brasil.mapbiomas.org/metodo_cobertura_e_uso/'
          rewrite(P,'product_id',{'DP000050'})
          rewrite(D,'distribution_id',{'DD000033'},{'DD000061':{'product_id':'DP000025'},'DD000062':{'product_id':'DP000025'}})
          products,dists=rows(P),rows(D)
          assert 'DP000050' not in {r['product_id'] for r in products}; assert 'DD000033' not in {r['distribution_id'] for r in dists}
          assert {r['distribution_id'] for r in dists if r['product_id']=='DP000025'} >= {'DD000061','DD000062'}

          found=[r for r in sources if norm(r['resource_name']) in {'estatisticas agropecuarias ibge','agricultura pecuaria e outros ibge'}]
          if found: RID=found[0]['resource_id']
          else:
              RID=f"DR{max(int(r['resource_id'][2:]) for r in sources)+1:04d}"; assert RID=='DR0087'
              sf=list(sources[0]); sr={
                'resource_id':RID,'resource_name':'Estatísticas Agropecuárias — IBGE','acronym':'Estatísticas Agropecuárias IBGE','official_identity':'Tema institucional Agricultura, pecuária e outros do IBGE',
                'description':'Família institucional de operações estatísticas do IBGE sobre agricultura, pecuária, produção florestal, pesca e aquicultura, reunindo levantamentos estruturais e conjunturais com periodicidades e unidades de análise próprias.',
                'homepage_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html','data_access_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html',
                'research_areas':'Agricultura, Florestas e Uso da Terra | Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados','keywords':'agricultura | pecuária | produção florestal | pesca | aquicultura | estatísticas oficiais | IBGE',
                'data_product_types':'pesquisas anuais | pesquisas trimestrais | levantamentos mensais | censos | séries estatísticas','data_formats':'SIDRA | XLS | XLSX | ODS | publicações digitais; varia conforme produto','visualization_types':'tabelas | séries históricas | gráficos | publicações',
                'geographic_coverage':'Brasil; desagregação varia de nacional a municipal conforme operação','covers_brazil':'sim','spatial_resolution':'município, Unidade da Federação, região ou Brasil conforme pesquisa','temporal_coverage':'séries históricas e edições correntes conforme operação','temporal_resolution':'mensal | trimestral | semestral | anual | censitária conforme produto',
                'data_sources':'levantamentos e censos do IBGE | estabelecimentos e informantes | registros administrativos complementares conforme pesquisa','free_download':'sim','access_conditions':'consulta pública e downloads conforme produto; resultados também podem ser disseminados no SIDRA','programmatic_access':'parcial','access_protocols':'HTTP/HTTPS download | SIDRA | Serviço de Dados do IBGE conforme produto','authentication_required':'não',
                'access_documentation_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html','license':'licença específica deve ser verificada no produto ou arquivo; não inferida da página temática','institutional_status':'público','owner_or_manager':'IBGE',
                'academic_uses':'Analisar produção agrícola, pecuária e florestal, estrutura produtiva, conjuntura agropecuária e relações territoriais com ambiente, uso da terra e economia.','limitations':'O tema agrega operações com populações-alvo, cortes de inclusão, periodicidades, revisões e níveis geográficos diferentes; não tratar pesquisas municipais, trimestrais e censitárias como uma única série homogênea.',
                'academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html','academic_evidence_note':'A página temática oficial enumera como produtos distintos LSPA, Leite, POG, Couro, Abate, Estoques, PEVS, PPM, PAM e Censo Agropecuário.','verification_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html','last_verified':TODAY}
              with S.open('a',encoding='utf-8',newline='') as f:f.write(rowtext(sf,sr))
              pr=json.loads(B.read_text(encoding='utf-8')); p0=next(t for t in pr['tiers'] if t['priority_tier']=='P0'); p0['resource_ids'].append(RID); pr['reviewed_at']=TODAY; B.write_text(json.dumps(pr,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('ADDED_SOURCE',RID)

          products,dists=rows(P),rows(D); pf=list(products[0]); df=list(dists[0]); np=max(int(r['product_id'][2:]) for r in products)+1; nd=max(int(r['distribution_id'][2:]) for r in dists)+1
          candidates=[
          {'key':'pevs','name':'Produção da Extração Vegetal e da Silvicultura — edição 2024','acro':'PEVS 2024','family':'Estatísticas agropecuárias — produção florestal','desc':'Pesquisa anual do IBGE sobre quantidade e valor da produção obtida pela extração de recursos vegetais nativos e pela silvicultura, incluindo área total existente e área colhida de cultivos florestais.','areas':'Agriculture | Forestry | Environmental statistics | Territorial analysis','keywords':'PEVS | extrativismo vegetal | silvicultura | produção florestal | florestas plantadas | municípios | IBGE','cov':'Brasil — Grandes Regiões, Unidades da Federação e municípios produtores','support':'município | Unidade da Federação | Grande Região | Brasil','spatial':'municipal nos resultados detalhados; agregações regionais e nacionais disponíveis','temp':'série histórica; edição corrente verificada 2024','tres':'anual','freq':'anual','version':'2024','url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9105-producao-da-extracao-vegetal-e-da-silvicultura.html','limits':'A pesquisa mede produção de produtos florestais, não cobertura florestal, biomassa ou estoque de carbono. Extrativismo nativo e silvicultura plantada são componentes distintos; revisões e notas técnicas da edição usada precisam ser preservadas.','subset':'produto | município | Unidade da Federação | Grande Região','notes':'Edição 2024; disseminação oficial por publicação digital, tabelas e SIDRA.'},
          {'key':'abate','name':'Pesquisa Trimestral do Abate de Animais — resultados completos','acro':'Abate Trimestral','family':'Estatísticas trimestrais da produção pecuária','desc':'Pesquisa conjuntural do IBGE sobre número de animais abatidos e peso total das carcaças por espécie em estabelecimentos sob fiscalização sanitária federal, estadual ou municipal.','areas':'Agriculture | Livestock | Economic statistics | Territorial analysis','keywords':'abate | bovinos | suínos | frangos | carcaças | produção pecuária | IBGE','cov':'Brasil e Unidades da Federação nos resultados completos','support':'estabelecimento informante | Unidade da Federação | Brasil','spatial':'Unidade da Federação na divulgação completa','temp':'série trimestral; edição corrente verificada 1º trimestre de 2026','tres':'trimestral; tabelas discriminam meses dentro do trimestre','freq':'trimestral','version':'1º trimestre de 2026','url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9203-pesquisas-trimestrais-do-abate-de-animais.html','limits':'Investiga abate sob fiscalização sanitária e não representa automaticamente todo abate informal ou não inspecionado. Distinguir Primeiros Resultados nacionais dos Resultados Completos por Unidade da Federação e considerar revisões programadas.','subset':'espécie | mês | Unidade da Federação | Brasil','notes':'Resultados completos do 1º trimestre de 2026 divulgados em 16/06/2026; dados sujeitos à política de revisão do IBGE.'},
          {'key':'ovos','name':'Produção de Ovos de Galinha — resultados trimestrais','acro':'POG','family':'Estatísticas trimestrais da produção pecuária','desc':'Pesquisa trimestral do IBGE sobre produção física de ovos e efetivo de poedeiras/matrizeiras em estabelecimentos especializados com capacidade de alojamento de pelo menos 10 mil aves elegíveis.','areas':'Agriculture | Livestock | Economic statistics | Territorial analysis','keywords':'ovos de galinha | poedeiras | matrizeiras | produção pecuária | granjas | IBGE','cov':'Brasil e Unidades da Federação nos resultados completos','support':'estabelecimento informante | Unidade da Federação | Brasil','spatial':'Unidade da Federação na divulgação completa','temp':'série iniciada com dados de 1983; edição corrente verificada 1º trimestre de 2026','tres':'trimestral com dados mensais dentro do trimestre','freq':'trimestral','version':'1º trimestre de 2026','url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9216-pesquisa-trimestral-da-producao-de-ovos-de-galinha.html','limits':'Representa produção especializada/comercial no painel elegível e não toda a produção municipal de ovos; a PPM inclui produção não comercial e estabelecimentos abaixo do corte. Primeiros resultados são provisórios.','subset':'mês | Unidade da Federação | Brasil','notes':'Resultados do 1º trimestre de 2026; painel e valores podem ser revistos conforme política da pesquisa.'},
          {'key':'leite','name':'Pesquisa Trimestral do Leite — resultados completos','acro':'Leite Trimestral','family':'Estatísticas trimestrais da produção pecuária','desc':'Pesquisa trimestral do IBGE sobre quantidades de leite cru, resfriado ou não, adquiridas e industrializadas pelos estabelecimentos investigados.','areas':'Agriculture | Livestock | Economic statistics | Territorial analysis','keywords':'leite cru | laticínios | aquisição | industrialização | preço ao produtor | IBGE','cov':'Brasil e Unidades da Federação nos resultados completos','support':'estabelecimento informante | Unidade da Federação | Brasil','spatial':'Unidade da Federação na divulgação completa','temp':'série trimestral; edição corrente verificada 1º trimestre de 2026','tres':'trimestral','freq':'trimestral','version':'1º trimestre de 2026','url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9209-pesquisa-trimestral-do-leite.html','limits':'Mede leite cru adquirido/industrializado pelos estabelecimentos cobertos e não equivale à produção total de leite na fazenda. O preço médio pago ao produtor, investigado desde 2019, é estatística experimental e deve permanecer separado das quantidades físicas.','subset':'Unidade da Federação | Brasil | variável','notes':'Resultados completos do 1º trimestre de 2026; quantidades físicas e preço médio têm estatutos metodológicos distintos.'},
          {'key':'couro','name':'Pesquisa Trimestral do Couro — resultados completos','acro':'Couro Trimestral','family':'Estatísticas trimestrais da produção pecuária','desc':'Pesquisa trimestral do IBGE sobre quantidade de couro cru bovino adquirida e curtida em estabelecimentos que adquirem e curtem pelo menos 5 mil unidades inteiras de couro cru bovino por ano.','areas':'Agriculture | Livestock | Economic statistics | Territorial analysis','keywords':'couro bovino | curtumes | couro cru | curtimento | produção pecuária | IBGE','cov':'Brasil e Unidades da Federação nos resultados completos','support':'estabelecimento informante | Unidade da Federação | Brasil','spatial':'Unidade da Federação na divulgação completa','temp':'série trimestral desde 1997; edição corrente verificada 1º trimestre de 2026','tres':'trimestral','freq':'trimestral','version':'1º trimestre de 2026','url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9214-pesquisa-trimestral-do-couro.html','limits':'A população-alvo usa corte de pelo menos 5 mil unidades anuais e não representa curtumes abaixo desse limite. Quantidades adquiridas, recebidas de terceiros e curtidas são conceitos distintos; Primeiros Resultados são nacionais e provisórios.','subset':'mês | Unidade da Federação | Brasil | variável','notes':'Resultados completos do 1º trimestre de 2026; publicação digital e SIDRA com política de revisão.'}]
          aliases={'pevs':'producao da extracao vegetal e da silvicultura','abate':'pesquisa trimestral do abate de animais','ovos':'producao de ovos de galinha','leite':'pesquisa trimestral do leite','couro':'pesquisa trimestral do couro'}
          added=[]
          for c in candidates:
              if any(aliases[c['key']] in norm(r['product_name']) for r in products): print('SKIP_EXISTING',c['key']); continue
              pid=f'DP{np:06d}'; np+=1
              pr={'product_id':pid,'resource_id':RID,'product_name':c['name'],'product_acronym':c['acro'],'product_family':c['family'],'product_kind':'dataset_series','product_description':c['desc'],'research_areas':c['areas'],'keywords':c['keywords'],'geographic_coverage':c['cov'],'covers_brazil':'sim','spatial_support':c['support'],'spatial_resolution':c['spatial'],'temporal_coverage':c['temp'],'temporal_resolution':c['tres'],'update_frequency':c['freq'],'product_status':'ativo','version_or_collection':c['version'],'enumeration_scope':'complete','product_page_url':c['url'],'methodology_url':c['url'],'primary_or_derived':'primário','limitations':c['limits'],'last_verified':TODAY}
              with P.open('a',encoding='utf-8',newline='') as f:f.write(rowtext(pf,pr))
              did=f'DD{nd:06d}'; nd+=1
              dr={'distribution_id':did,'product_id':pid,'distribution_name':c['name']+' — página, tabelas e SIDRA','access_url':c['url'],'format':'XLSX | SIDRA | publicação digital','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web | planilha | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública e downloads oficiais; observar revisões da edição','license':'licença específica do arquivo não inferida; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':c['subset'],'notes':c['notes'],'last_verified':TODAY}
              with D.open('a',encoding='utf-8',newline='') as f:f.write(rowtext(df,dr))
              products.append(pr); added.append((pid,did,c['key']))
          print('ADDED',added)
          sources,products,dists=rows(S),rows(P),rows(D); rids={r['resource_id'] for r in sources}; pids={r['product_id'] for r in products}; dids={r['distribution_id'] for r in dists}
          assert len(rids)==len(sources) and len(pids)==len(products) and len(dids)==len(dists)
          assert all(r['resource_id'] in rids for r in products) and all(r['product_id'] in pids for r in dists)
          assert 'DP000025' in pids and 'DP000050' not in pids and 'DD000033' not in dids
          print('READBACK_PREVALIDATION',len(sources),len(products),len(dists))
          PY
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          def n(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return len(list(csv.DictReader(f)))
          print('FINAL_READBACK',n('data/data_resources.csv'),n('data/data_products.csv'),n('data/product_distributions.csv'))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u data
          git add data
          git commit -m 'Audit MapBiomas duplicate and expand IBGE agro statistics'
          git push origin HEAD:agent/vitrine-agro-dedupe-20260816
