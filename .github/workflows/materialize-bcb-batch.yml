name: Materialize verified Banco Central batch

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materializar lote BCB
        run: python3 scripts/materialize_bcb_batch.py
      - name: Validar escopo e catálogo
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
      - name: Read-back consolidado
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          root=Path('.')
          def rows(p):
              with p.open(encoding='utf-8-sig',newline='') as f: return list(csv.DictReader(f))
          s=rows(root/'data/data_resources.csv'); p=rows(root/'data/data_products.csv'); d=rows(root/'data/product_distributions.csv')
          assert (len(s),len(p),len(d))==(126,762,793),(len(s),len(p),len(d))
          assert s[-1]['resource_id']=='DR0126'
          assert [x['product_id'] for x in p[-6:]]==[f'DP{i:06d}' for i in range(761,767)]
          assert [x['distribution_id'] for x in d[-6:]]==[f'DD{i:06d}' for i in range(792,798)]
          reg=json.loads((root/'data/brazil_scope_priorities.json').read_text(encoding='utf-8'))
          p0=next(x for x in reg['tiers'] if x['priority_tier']=='P0')
          assert 'DR0126' in p0['resource_ids']
          print('OK read-back 126/762/793')
          PY
      - name: Commitar somente estado materializado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_resources.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git diff --cached --check
          git commit -m "Expand verified Banco Central open-data catalog"
          git push origin HEAD:main
