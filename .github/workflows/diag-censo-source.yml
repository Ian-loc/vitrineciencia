name: Diagnose Censo source validation
on:
  push:
    branches: [audit/ibge-censo2022-geospatial-20260816]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-censo2022-geospatial-20260816
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce source and Brazil priority only
        run: |
          python - <<'PY'
          import csv,json
          from pathlib import Path
          p=Path('data/data_resources.csv')
          row=['DR0086','Censo Demográfico 2022 — IBGE','Censo 2022','Operação estatística Censo Demográfico 2022 do IBGE','Operação censitária nacional e família de disseminação que reúne resultados populacionais e domiciliares e produtos geoespaciais derivados da coleta, da Base Territorial e do Cadastro Nacional de Endereços para Fins Estatísticos.','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?t=resultados','Population geography | Spatial analysis | Urban studies | GIS','Censo 2022 | população | domicílios | setores censitários | endereços | grade estatística | trajetos | IBGE','dados agregados | microdados publicados conforme produto | arquivos geoespaciais | mapas | notas metodológicas','CSV | XLSX | SHP | GPKG | GeoJSON | KML | ZIP | PDF; varia conforme produto','tabelas | mapas | aplicações interativas','Brasil','sim','endereços | setores censitários | células de grade | municípios e outros recortes conforme produto','Censo Demográfico 2022; datas e períodos de referência variam conforme variável e produto','snapshot censitário e recortes específicos conforme produto','coleta censitária direta | CNEFE | Base Territorial | processamento estatístico e geoespacial do IBGE','sim','consulta e downloads públicos conforme produto','desconhecido','HTTPS web | HTTP/HTTPS download','não','https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/CD','licença específica deve ser verificada no produto ou arquivo; observar termos de uso do IBGE','público','IBGE','Demografia espacial, desigualdades socioespaciais, urbanização, planejamento territorial, geocodificação, desenho amostral e integração com dados ambientais.','Os produtos possuem unidades, revisões, níveis de agregação e restrições de confidencialidade próprios. O Censo é uma referência temporal específica; setores, endereços, grades e resultados agregados não devem ser tratados como objetos equivalentes nem como cadastro operacional em tempo real.','documentação técnica oficial','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html','A página oficial e as notas metodológicas documentam separadamente CNEFE, Grade Estatística, Agregados por Setores Censitários, Trajetos dos Recenseadores e demais produtos do Censo 2022.','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html','2026-08-16']
          with p.open('a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerow(row)
          q=Path('data/brazil_scope_priorities.json'); d=json.loads(q.read_text(encoding='utf-8')); next(t for t in d['tiers'] if t['priority_tier']=='P0')['resource_ids'].append('DR0086'); d['reviewed_at']='2026-08-16'; q.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/validate_brazil_scope.py