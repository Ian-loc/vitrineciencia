name: One-shot ONS catalog materializer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-ons-20260818.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified ONS products
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, pathlib
          p=pathlib.Path('data/data_products.csv'); d=pathlib.Path('data/product_distributions.csv')
          with p.open(encoding='utf-8', newline='') as f: pr=list(csv.DictReader(f))
          with d.open(encoding='utf-8', newline='') as f: dr=list(csv.DictReader(f))
          pids={r['product_id'] for r in pr}; dids={r['distribution_id'] for r in dr}; urls={r['product_page_url'] for r in pr}
          rows=[
          ['DP000617','DR0122','Linhas de Transmissão da Rede de Operação','Linhas de Transmissão ONS','Cadastro operacional de transmissão','dataset_series','Dados cadastrais das linhas de transmissão da Rede de Operação (Rede Básica + Rede Complementar) com tensão maior ou igual a 230 kV, incluindo subsistema, UF, agente proprietário, tensão e comprimento.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','linha de transmissão | Rede Básica | Rede Complementar | tensão | cadastro','Brasil — Rede de Operação do SIN', 'sim','linha de transmissão','unidade cadastral por linha','estado corrente; sem histórico no conjunto','estado corrente','diária','ativo','versão 1.1; conjunto corrente 2026','complete','https://dados.ons.org.br/dataset/linha-transmissao','https://dados.ons.org.br/dataset/linha-transmissao','primário','Cadastro corrente não é série histórica nem representa fluxo, carregamento, disponibilidade ou condição física da linha. O universo é a Rede de Operação definida pelo ONS.','2026-08-18'],
          ['DP000618','DR0122','Subestações da Rede de Operação','Subestações ONS','Cadastro operacional de transmissão','dataset_series','Dados cadastrais das subestações em operação da Rede de Operação (Rede Básica + Rede Complementar) com tensão base maior ou igual a 69 kV.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','subestação | Rede Básica | Rede Complementar | tensão | cadastro','Brasil — Rede de Operação do SIN','sim','subestação','unidade cadastral por subestação','estado corrente; sem histórico no conjunto','estado corrente','diária','ativo','conjunto corrente; atualização oficial em 2026','complete','https://dados.ons.org.br/dataset/subestacao','https://dados.ons.org.br/dataset/subestacao','primário','Cadastro corrente não mede carregamento, disponibilidade, falhas ou condição física; o conjunto não preserva histórico.','2026-08-18'],
          ['DP000619','DR0122','Demanda Máxima Diária por Subsistema','Demanda Máxima Diária','Carga e demanda do SIN','dataset_series','Apuração diária das demandas de carga instantâneas e integralizadas por subsistema.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','demanda máxima | carga | subsistema | SIN | pico','Brasil — subsistemas do SIN','sim','subsistema','agregação por subsistema','série histórica e arquivo 2026','diária','diária','ativo','recursos 2026 disponíveis','complete','https://dados.ons.org.br/dataset/demanda_maxima_di','https://dados.ons.org.br/dataset/demanda_maxima_di','derivado','Demanda máxima é uma estatística de carga e não consumo total de energia; valores fazem parte de processo de consistência recorrente e podem ser revisados.','2026-08-18'],
          ['DP000620','DR0122','Disponibilidade de Função Transmissão — Linhas e Transformadores','Disponibilidade FT TR/LT','Indicadores de disponibilidade da transmissão','indicator_family','Indicadores mensais DISP, INDISPPF e INDISPFF para funções transmissão de linhas e transformadores, agregados por função e nível de tensão.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','disponibilidade | transmissão | linha | transformador | indisponibilidade','Brasil — Rede Básica/SIN conforme indicador','sim','função transmissão e nível de tensão','agregação mensal','série histórica; recurso 2026','mensal','mensal','ativo','recursos 2026 disponíveis','complete','https://dados.ons.org.br/dataset/ind_disponibilidade_ft_trlt','https://dados.ons.org.br/dataset/ind_disponibilidade_ft_trlt','derivado','Indicadores agregados não equivalem ao estado instantâneo de cada equipamento; indisponibilidade programada e forçada são categorias distintas e dados podem ser revisados.','2026-08-18'],
          ['DP000621','DR0122','Disponibilidade de Função Transmissão — Controle de Reativos','Disponibilidade FT Reativo','Indicadores de disponibilidade da transmissão','indicator_family','Indicador mensal de disponibilidade de funções transmissão associadas a equipamentos de controle de reativo, agregado por função e nível de tensão.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','disponibilidade | reativo | transmissão | compensação | tensão','Brasil — Rede de Operação/SIN conforme indicador','sim','função transmissão e nível de tensão','agregação mensal','série histórica; recurso 2026','mensal','mensal','ativo','recursos 2026 disponíveis','complete','https://dados.ons.org.br/dataset/ind_disponibilidade_ft_reativo','https://dados.ons.org.br/dataset/ind_disponibilidade_ft_reativo','derivado','Disponibilidade agregada não mede potência reativa instantânea nem desempenho elétrico detalhado do equipamento; série sujeita a consistência.','2026-08-18'],
          ['DP000622','DR0122','Disponibilidade de Função Transmissão — Conversores','Disponibilidade FT Conversores','Indicadores de disponibilidade da transmissão','indicator_family','Indicador mensal DISPFTConv de disponibilidade de funções transmissão conversora, agregado por nível de tensão.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','disponibilidade | conversor | transmissão | HVDC | tensão','Brasil — funções conversoras do SIN conforme indicador','sim','função conversora e nível de tensão','agregação mensal','série histórica; recurso 2026','mensal','mensal','ativo','recursos 2026 disponíveis','complete','https://dados.ons.org.br/dataset/ind_disponibilidade_ft_conversor','https://dados.ons.org.br/dataset/ind_disponibilidade_ft_conversor','derivado','Indicador agregado não equivale a estado instantâneo ou capacidade de transferência efetiva; dados podem ser revisados após publicação.','2026-08-18'],
          ['DP000623','DR0122','Disponibilidade de Função Geração para o SIN — Base Mensal','Disponibilidade Geração SIN','Indicadores de disponibilidade da geração','indicator_family','Indicadores mensais DISPF, INDISPPF e INDISPFF das funções geração agregados para o SIN.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','disponibilidade | geração | indisponibilidade | SIN | usinas','Brasil — SIN','sim','SIN agregado','agregação mensal','série histórica; recurso 2026','mensal','mensal','ativo','recursos 2026 disponíveis','complete','https://dados.ons.org.br/dataset/ind-disponibilidade-geracao-sin','https://dados.ons.org.br/dataset/ind-disponibilidade-geracao-sin','derivado','Indicadores agregados de disponibilidade não equivalem a geração realizada, capacidade instalada ou disponibilidade de uma usina específica.','2026-08-18'],
          ['DP000624','DR0122','Confiabilidade da Rede Básica — Robustez RMAL, RMCS, RRB e RRBCS','Robustez Rede Básica','Indicadores de confiabilidade da transmissão','indicator_family','Indicadores de robustez da malha sistêmica e da Rede Básica, inclusive para contingências simples, em agregações territoriais e periodicidades mensal e anual.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','confiabilidade | robustez | Rede Básica | contingência | transmissão','Brasil — SIN, subsistema, região e UF conforme indicador','sim','SIN/subsistema/região/UF','agregações territorial e temporal','série histórica; atualização 2026','mensal | anual','periódica','ativo','atualização oficial julho de 2026','complete','https://dados.ons.org.br/dataset/ind_confiarb_robustez','https://dados.ons.org.br/dataset/ind_confiarb_robustez','derivado','Robustez é indicador de desempenho/confiabilidade definido pelos Procedimentos de Rede; não equivale a probabilidade direta de apagão ou risco físico local.','2026-08-18'],
          ['DP000625','DR0122','Confiabilidade da Rede Básica — DREQ e FREQ','DREQ/FREQ','Indicadores de confiabilidade da transmissão','indicator_family','Indicadores de duração equivalente e frequência equivalente de interrupção de carga, apresentados para SIN, subsistema, região geográfica e UF em bases mensal e anual.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','DREQ | FREQ | interrupção de carga | confiabilidade | Rede Básica','Brasil — SIN, subsistema, região e UF','sim','SIN/subsistema/região/UF','agregações territorial e temporal','série histórica; atualização 2026','mensal | anual','periódica','ativo','atualização oficial julho de 2026','complete','https://dados.ons.org.br/dataset/ind_confiarb_dreq_freq','https://dados.ons.org.br/dataset/ind_confiarb_dreq_freq','derivado','Indicadores equivalentes agregados não são contagem direta de consumidores interrompidos nem duração percebida por cada consumidor; série sujeita a consistência.','2026-08-18'],
          ['DP000626','DR0122','Balanço de Energia do DESSEM — Geral','DESSEM Geral','Programação eletroenergética','dataset_series','Informação simplificada da programação eletroenergética resultante do DESSEM, com demanda e geração por fontes previstas para um dia de referência em periodicidade semi-horária por subsistema.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','DESSEM | programação | demanda | geração | semi-horário','Brasil — subsistemas do SIN','sim','subsistema','semi-horária','série diária de resultados; recursos 2026','semi-horária','diária','ativo','recursos diários 2026 disponíveis','complete','https://dados.ons.org.br/dataset/balanco_dessem_geral','https://dados.ons.org.br/dataset/balanco_dessem_geral','derivado','Saída de programação/modelo ex ante: não equivale à geração ou carga verificada. Resultados podem ser revisados e dependem das entradas e restrições do DESSEM.','2026-08-18'],
          ['DP000627','DR0122','Balanço de Energia do DESSEM — Detalhado','DESSEM Detalhado','Programação eletroenergética','dataset_series','Informação detalhada da programação eletroenergética resultante do DESSEM, com demanda e geração por fontes previstas para um dia de referência em periodicidade semi-horária por subsistema.','Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','DESSEM | programação detalhada | demanda | geração | semi-horário','Brasil — subsistemas do SIN','sim','subsistema e detalhamento do balanço','semi-horária','série diária de resultados; recursos 2026','semi-horária','diária','ativo','recursos diários 2026 disponíveis','complete','https://dados.ons.org.br/dataset/balanco_dessem_detalhe','https://dados.ons.org.br/dataset/balanco_dessem_detalhe','derivado','Saída detalhada de programação/modelo ex ante: não equivale à operação realizada. Comparações com o produto geral devem preservar o nível de detalhamento e a mesma data de referência.','2026-08-18']]
          for r in rows:
              assert r[0] not in pids, r[0]; assert r[19] not in urls, r[19]
          with p.open('a',encoding='utf-8',newline='') as f:
              w=csv.writer(f,lineterminator='\n'); w.writerows(rows)
          drows=[]
          for i,r in enumerate(rows, start=642):
              did=f'DD{i:06d}'; assert did not in dids
              drows.append([did,r[0],r[2]+' — ONS Dados Abertos',r[19],'CSV | XLSX | PARQUET | JSON/PDF de dicionário conforme conjunto','HTTPS / CKAN','Portal ONS Dados Abertos; recursos e API CKAN','sim','não','Acesso aberto; observar aviso legal e termos CC BY do conjunto.','Creative Commons Atribuição (CC BY)','sim','por arquivo/recurso, período e agregação conforme conjunto','Distribuição oficial ONS. Usar o dicionário de dados e preservar definição, período, agregação, unidade, estado de consistência e eventuais revisões.','2026-08-18'])
          with d.open('a',encoding='utf-8',newline='') as f:
              csv.writer(f,lineterminator='\n').writerows(drows)
          print('appended',len(rows),'products and',len(drows),'distributions')
          PY
      - name: Validate and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          for fn,idf in [('data/data_products.csv','product_id'),('data/product_distributions.csv','distribution_id')]:
            with open(fn,encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
            ids=[r[idf] for r in rows]; assert len(ids)==len(set(ids)); print(fn,len(rows),ids[-1])
          PY
      - name: Commit canonical changes
        run: |
          git config user.name 'vitrine-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json
          git diff --cached --check
          git commit -m 'Expand verified ONS transmission and reliability catalog'
          git push origin HEAD:main
