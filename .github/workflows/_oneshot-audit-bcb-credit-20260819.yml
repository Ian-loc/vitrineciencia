name: One-shot audit BCB credit external 2026-08-19

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/_oneshot-audit-bcb-credit-20260819.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize audited BCB products
        run: python3 scripts/_oneshot_audit_bcb_external_credit_20260819.py
      - name: Validate Brazil scope and catalog
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
      - name: Rebuild derived catalog and audit link roles
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
      - name: Validate Vitrine and public artifact
        run: |
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
      - name: Read-back integrity
        run: |
          python3 - <<'PY'
          import csv
          def rows(p):
              with open(p, encoding='utf-8', newline='') as f: return list(csv.DictReader(f))
          rs=rows('data/data_resources.csv'); ps=rows('data/data_products.csv'); ds=rows('data/product_distributions.csv')
          rids={r['resource_id'] for r in rs}; pids={p['product_id'] for p in ps}
          assert len(rids)==len(rs)
          assert len(pids)==len(ps)
          assert len({d['distribution_id'] for d in ds})==len(ds)
          assert all(p['resource_id'] in rids for p in ps)
          assert all(d['product_id'] in pids for d in ds)
          urls={
            'https://dadosabertos.bcb.gov.br/dataset/22701-transacoes-correntes---mensal---saldo',
            'https://dadosabertos.bcb.gov.br/dataset/22707-balanca-comercial---balanco-de-pagamentos---mensal---saldo',
            'https://dadosabertos.bcb.gov.br/dataset/22885-investimentos-diretos-no-pais---idp---mensal---liquido',
            'https://dadosabertos.bcb.gov.br/dataset/22865-investimentos-diretos-no-exterior---ide---mensal---liquido',
            'https://dadosabertos.bcb.gov.br/dataset/20740-taxa-media-de-juros-das-operacoes-de-credito-com-recursos-livres---pessoas-fisicas---total',
            'https://dadosabertos.bcb.gov.br/dataset/20718-taxa-media-de-juros-das-operacoes-de-credito-com-recursos-livres---pessoas-juridicas---total',
            'https://dadosabertos.bcb.gov.br/dataset/28192-saldo-de-divida-externa-total',
            'https://dadosabertos.bcb.gov.br/dataset/28203-saldo-de-credito-ampliado-concedido-a-empresas-e-familias-total',
            'https://dadosabertos.bcb.gov.br/dataset/28846-saldo-de-credito-ampliado-concedido-a-empresas-total',
            'https://dadosabertos.bcb.gov.br/dataset/28858-saldo-de-credito-ampliado-concedido-a-familias-total',
          }
          selected=[p for p in ps if p['product_page_url'].rstrip('/') in {u.rstrip('/') for u in urls}]
          assert len(selected)==10, (len(selected), [p['product_id'] for p in selected])
          assert all(p['resource_id']=='DR0126' and p['last_verified']=='2026-08-19' for p in selected)
          print('READBACK', len(rs), len(ps), len(ds), [p['product_id'] for p in selected])
          PY
      - name: Remove one-shot artifacts and commit materialized state
        run: |
          git rm scripts/_oneshot_audit_bcb_external_credit_20260819.py .github/workflows/_oneshot-audit-bcb-credit-20260819.yml
          git config user.name "Vitrine Ciência audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/data_products.json data/product_distributions.csv data/link_role_audit.json
          git diff --cached --check
          git commit -m "Expand verified BCB external-sector and credit catalog"
          git push origin HEAD:main
