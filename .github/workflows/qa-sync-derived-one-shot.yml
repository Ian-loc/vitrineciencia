name: QA sync derived artifacts one-shot

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'qa/verify-derived-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Regenerar derivados canônicos
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py
          git diff --check

      - name: Persistir somente derivados versionados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.json data/data_products.json data/data_quality_report.json
          if git diff --cached --quiet; then
            echo "Nenhum derivado divergente."
            exit 0
          fi
          git commit -m "Synchronize generated catalog artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
