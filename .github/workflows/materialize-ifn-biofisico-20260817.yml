name: Materialize verified IFN biophysical batch 2026-08-17

on:
  push:
    paths:
      - '.github/workflows/materialize-ifn-biofisico-20260817.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified IFN biophysical datasets
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          ppath=Path('data/data_products.csv'); dpath=Path('data/product_distributions.csv')
          with ppath.open(encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f); pf=list(r.fieldnames or []); ep=list(r)
          with dpath.open(encoding='utf-8-sig',newline='') as f:
              r=csv.DictReader(f); df=list(r.fieldnames or []); ed=list(r)
          base=dict(resource_id='DR0107',product_family='Inventário Florestal Nacional — dados biofísicos',product_kind='dataset_series',research_areas='Forest ecology | Environmental science | Environmental management',geographic_coverage='Brasil — UFs com levantamento do IFN disponibilizado na versão set/2025',covers_brazil='sim',temporal_coverage='campanhas do IFN incorporadas à versão disp-set2025',temporal_resolution='campanha/unidade amostral',update_frequency='conforme novos ciclos e atualização dos conjuntos',product_status='ativo',version_or_collection='disp-set2025',enumeration_scope='complete',methodology_url='https://snif.florestal.gov.br/pt-br/temas-florestais/ifn',primary_or_derived='primário',last_verified='2026-08-17')
          specs=[
            ('DP000426','IFN — DAP ≥ 10 cm por UF — set/2025','IFN DAP10','ifn-dap-10-por-uf_disp-set2025','Árvores e indivíduos lenhosos registrados pelo IFN no estrato de medição com diâmetro à altura do peito (DAP) maior ou igual a 10 cm, disponibilizados por UF.','IFN | DAP 10 | trees | diameter | forest inventory','indivíduo medido e unidade amostral','por indivíduo/medição e UF','O limiar DAP ≥10 cm define um estrato de mensuração do protocolo; não representa toda a regeneração ou todos os indivíduos lenhosos. Preservar espécie, DAP, condição, unidade amostral e regras do protocolo.'),
            ('DP000427','IFN — DAP ≥ 5 cm por UF — set/2025','IFN DAP5','ifn-dap-5-por-uf_disp-set2025','Indivíduos lenhosos registrados no estrato do IFN com DAP maior ou igual a 5 cm segundo o protocolo aplicável, disponibilizados por UF.','IFN | DAP 5 | trees | diameter | forest inventory','indivíduo medido e unidade amostral','por indivíduo/medição e UF','O estrato DAP ≥5 cm possui regras de amostragem próprias e não deve ser somado ingenuamente ao estrato DAP ≥10 cm sem verificar sobreposição e desenho do protocolo.'),
            ('DP000428','IFN — Regeneração por UF — set/2025','IFN Regeneração','ifn-regeneracao-por-uf_disp-set2025','Dados sobre regeneração registrados nas unidades amostrais do Inventário Florestal Nacional, disponibilizados por UF com metadados.','IFN | regeneration | seedlings | saplings | forest inventory','indivíduo/classe de regeneração e unidade amostral','por registro de regeneração e UF','Regeneração é observada no desenho amostral e critérios dimensionais do IFN; ausência em uma unidade não significa ausência regional, e os registros não formam superfície contínua de recrutamento.'),
            ('DP000429','IFN — Uso da Terra por UF — set/2025','IFN Uso da Terra','ifn-uso-da-terra-por-uf_disp-set2025','Classes de uso da terra observadas em cada subparcela de cada subunidade das unidades amostrais do IFN, disponibilizadas por UF.','IFN | land use | subplots | forest inventory | field observation','subparcela/subunidade da unidade amostral','por subparcela e UF','É classificação de campo no desenho amostral do IFN, não mapa raster contínuo de uso/cobertura da terra. Comparações com produtos de sensoriamento remoto exigem harmonização de classe, data e suporte espacial.'),
            ('DP000430','IFN — Madeira Caída por UF — set/2025','IFN Madeira Caída','ifn-madeira-caida-por-uf_disp-set2025','Registros de madeira caída mensurada nas unidades amostrais do IFN, componente relacionado à necromassa lenhosa, disponibilizados por UF.','IFN | fallen wood | deadwood | necromass | forest inventory','observação de madeira caída e unidade amostral','por observação/intercepto ou unidade conforme protocolo e UF','Madeira caída é componente amostral de necromassa e não representa toda a madeira morta ou estoque contínuo da paisagem. Preservar método, dimensões, unidade e relação com outros componentes de necromassa.'),
            ('DP000431','IFN — Herbáceas por UF — set/2025','IFN Herbáceas','ifn-herbaceas-por-uf_disp-set2025','Dados de plantas herbáceas observadas nas unidades amostrais do IFN segundo o protocolo biofísico, disponibilizados por UF.','IFN | herbaceous vegetation | herbs | forest inventory','registro de herbácea e unidade amostral','por observação/unidade amostral e UF','O conjunto reflete observações herbáceas dentro do protocolo e esforço amostral do IFN; não constitui inventário florístico completo nem estimativa de biomassa herbácea sem processamento específico.'),
            ('DP000432','IFN — Bambus por UF — set/2025','IFN Bambus','ifn-bambus-por-uf_disp-set2025','Dados de bambus observados e mensurados nas unidades amostrais do IFN, disponibilizados por UF.','IFN | bamboo | forest inventory | vegetation structure','registro de bambu e unidade amostral','por observação/unidade amostral e UF','Registros dependem do protocolo e da distribuição das unidades amostrais; ausência de registro não prova ausência de bambu na paisagem e os dados não equivalem a mapeamento contínuo.'),
            ('DP000433','IFN — Antropismo e Vegetação Exótica por UF — set/2025','IFN Antropismo e Exóticas','ifn-antropismo-e-vegetacao-exotica-por-uf_disp-set2025','Observações de antropismo e presença de vegetação exótica nas unidades amostrais do IFN, disponibilizadas por UF.','IFN | anthropism | exotic vegetation | disturbance | forest inventory','unidade amostral e observação de antropismo/vegetação exótica','por observação/unidade amostral e UF','Observações são condicionadas pelo desenho amostral e categorias do IFN; presença observada não mede automaticamente intensidade de impacto, invasibilidade ou cobertura regional de espécies exóticas.'),
          ]
          products=[]; dists=[]
          for idx,s in enumerate(specs,449):
              pid,name,acr,slug,desc,kw,support,res,lim=s
              row=base.copy(); row.update(product_id=pid,product_name=name,product_acronym=acr,product_description=desc,keywords=kw,spatial_support=support,spatial_resolution=res,product_page_url=f'https://dados.florestal.gov.br/dataset/{slug}',limitations=lim)
              products.append(row)
              dists.append(dict(distribution_id=f'DD{idx:06d}',product_id=pid,distribution_name=f'{name} — dados por UF e metadados',access_url=f'https://dados.florestal.gov.br/dataset/{slug}',format='XLSX | PDF',access_protocol='HTTPS / CKAN',access_tool='navegador web | API CKAN',free_download='sim',authentication_required='não',access_conditions='acesso público',license='Creative Commons Attribution',provider_attribution_required='sim',subset_support='por UF e recurso publicado',notes='Distribuição oficial do IFN por UF, acompanhada de metadados; interpretar conforme desenho amostral e protocolo do componente.',last_verified='2026-08-17'))
          pids={x['product_id'] for x in ep}; dids={x['distribution_id'] for x in ed}; urls={x['product_page_url'].strip() for x in ep}
          for x in products:
              assert x['product_id'] not in pids and x['product_page_url'] not in urls
              assert set(x)==set(pf)
          for x in dists:
              assert x['distribution_id'] not in dids and set(x)==set(df)
          with ppath.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pf,lineterminator='\n'); w.writerows(products)
          with dpath.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=df,lineterminator='\n'); w.writerows(dists)
          print('appended',len(products),'IFN products and',len(dists),'distributions')
          PY
      - name: Validate rebuild and read back
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          def read(p):
            with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          r=read('data/data_resources.csv'); p=read('data/data_products.csv'); d=read('data/product_distributions.csv')
          assert (len(r),len(p),len(d))==(109,429,452),(len(r),len(p),len(d))
          pids={x['product_id'] for x in p}; dids={x['distribution_id'] for x in d}
          assert {f'DP{i:06d}' for i in range(426,434)} <= pids
          assert {f'DD{i:06d}' for i in range(449,457)} <= dids
          print('READBACK OK',len(r),len(p),len(d))
          PY
      - name: Commit clean materialization
        shell: bash
        run: |
          rm .github/workflows/materialize-ifn-biofisico-20260817.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data .github/workflows/materialize-ifn-biofisico-20260817.yml
          git diff --cached --check
          git commit -m "Expand verified IFN biophysical catalog"
          git push origin HEAD:main
