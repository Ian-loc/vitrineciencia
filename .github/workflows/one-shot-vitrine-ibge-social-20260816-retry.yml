name: One-shot Vitrine IBGE social expansion retry 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vitrine-ibge-social-20260816-retry.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run corrected materializer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p=Path('.github/workflows/one-shot-vitrine-ibge-social-20260816.yml')
          s=p.read_text(encoding='utf-8')
          start=s.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end=s.index("\n          PY\n", start)
          code=textwrap.dedent(s[start:end])
          replacements={
            'Demografia | Ciências Sociais | Saúde Pública | Educação | Trabalho e Renda | Políticas Públicas':'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados',
            'Demografia | Estatísticas Vitais | Saúde Pública | Ciências Sociais':'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados',
            'Economia | Mercado de Trabalho | Geografia Econômica | Desenvolvimento Regional':'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados',
          }
          for old,new in replacements.items():
              code=code.replace(old,new)
          ns={}
          exec(compile(code, '<corrected-materializer>', 'exec'), ns, ns)
          PY
      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          paths=['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']
          for p in paths:
              with open(p,encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
              print(p, len(rows))
          PY
      - name: Commit materialized catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No material changes to commit.'
            exit 0
          fi
          git commit -m 'Expand verified IBGE social and economic catalog'
          git push origin HEAD:main
