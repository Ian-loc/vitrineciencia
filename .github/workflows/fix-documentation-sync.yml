name: Finalize documentation synchronization

on:
  push:
    branches: ["agent/sync-current-documentation-2"]

permissions:
  contents: write

jobs:
  correct-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sync-current-documentation-2

      - name: Correct canonical counts and documentation contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path('.')]
          docs = [p for p in Path('.').rglob('*.md') if '.git' not in p.parts]
          replacements = {
              '125 fontes, 756 produtos e 787 distribuições': '125 fontes, 752 produtos e 783 distribuições',
              '125 fontes • 756 produtos • 787 distribuições': '125 fontes • 752 produtos • 783 distribuições',
              '125 fontes, 756 produtos, 787 distribuições': '125 fontes, 752 produtos, 783 distribuições',
              '125/756/787': '125/752/783',
          }
          for path in docs:
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements.items():
                  new = new.replace(old, replacement)
              if new != text:
                  path.write_text(new, encoding='utf-8')

          methodology = Path('METHODOLOGY.md')
          text = methodology.read_text(encoding='utf-8')
          anchor = 'Separar:\n\n- página da fonte;\n- página do produto;\n- acesso aos dados;'
          replacement = ('Separar:\n\n'
                         '- **Site oficial** — identidade institucional ou página oficial principal da fonte;\n'
                         '- **Acessar dados** — rota onde os dados podem ser pesquisados, visualizados, solicitados ou baixados;\n'
                         '- página do produto;\n- acesso aos dados;')
          if anchor in text:
              text = text.replace(anchor, replacement)
          elif 'Site oficial' not in text or 'Acessar dados' not in text:
              raise SystemExit('Could not restore required link-role labels in METHODOLOGY.md')
          methodology.write_text(text, encoding='utf-8')

          codebook = Path('CODEBOOK.md')
          text = codebook.read_text(encoding='utf-8')
          anchor = '## 7. Papéis dos links\n\n- `homepage_url` — identidade institucional/oficial;\n- `data_access_url` — descoberta/acesso aos dados;'
          replacement = ('## 7. Papéis dos links\n\n'
                         '- **Site oficial** (`homepage_url`) — identidade institucional ou página oficial principal da fonte;\n'
                         '- **Acessar dados** (`data_access_url`) — página onde os dados podem ser pesquisados, visualizados, solicitados ou baixados;')
          if anchor in text:
              text = text.replace(anchor, replacement)
          elif 'Site oficial' not in text or 'Acessar dados' not in text:
              raise SystemExit('Could not restore required link-role labels in CODEBOOK.md')
          codebook.write_text(text, encoding='utf-8')

          quality = Path('QUALITY_CORRECTION_WORKFLOW.md')
          text = quality.read_text(encoding='utf-8')
          text = text.replace('- 47 com resolução espacial desconhecida/variável;\n', '')
          text = text.replace('- 40 com cobertura temporal desconhecida/variável;\n', '')
          text = text.replace('- 33 com acesso programático desconhecido/variável.\n', '')
          text = text.replace('- 72 com alguma incerteza de acesso;\n\nEsses números', '- 72 com alguma incerteza de acesso.\n\nEsses números')
          quality.write_text(text, encoding='utf-8')
          PY

      - name: Validate Vitrine contracts
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          node --check assets/app.js
          node --check assets/products.js
          node --check assets/analytics.js

      - name: Commit validated documentation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-documentation-sync.yml
          git add ':(glob)**/*.md'
          git diff --cached --check
          git diff --cached --name-only | grep -Ev '\.(md)$' && { echo 'Unexpected non-documentation file staged'; exit 1; } || true
          git commit -m "Correct documentation counts and link-role contract"
          git push origin HEAD:agent/sync-current-documentation-2
