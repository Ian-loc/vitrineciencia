name: One-shot Vitrine IBGE social expansion 2026-08-16

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vitrine-ibge-social-20260816.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified IBGE sources, products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path

          ROOT = Path('.')
          RES = ROOT/'data/data_resources.csv'
          PROD = ROOT/'data/data_products.csv'
          DIST = ROOT/'data/product_distributions.csv'
          PRIOR = ROOT/'data/brazil_scope_priorities.json'
          VERIFIED = '2026-08-16'

          def read_csv(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  r = csv.DictReader(f)
                  return list(r.fieldnames or []), list(r)

          def append_rows(path, fields, rows):
              if not rows:
                  return
              with path.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  for row in rows:
                      w.writerow({k: row.get(k, '') for k in fields})

          def next_id(rows, field, prefix, width):
              vals=[]
              for r in rows:
                  m=re.fullmatch(re.escape(prefix)+r'(\d+)', r[field].strip())
                  if m: vals.append(int(m.group(1)))
              n=max(vals, default=0)+1
              def alloc():
                  nonlocal n
                  out=f'{prefix}{n:0{width}d}'
                  n+=1
                  return out
              return alloc

          res_fields, resources = read_csv(RES)
          prod_fields, products = read_csv(PROD)
          dist_fields, dists = read_csv(DIST)
          alloc_rid = next_id(resources, 'resource_id', 'DR', 4)
          alloc_pid = next_id(products, 'product_id', 'DP', 6)
          alloc_did = next_id(dists, 'distribution_id', 'DD', 6)

          source_specs = [
            ('social_syntheses', {
              'resource_name':'Sínteses e Indicadores Sociais — IBGE','acronym':'Indicadores Sociais IBGE','official_identity':'Família institucional de sistemas de indicadores e estudos-síntese sociais do IBGE','description':'Reúne sistemas de indicadores e estudos analíticos multitemáticos sobre condições de vida e desigualdades sociais, construídos a partir de pesquisas do IBGE e, conforme o produto, registros administrativos e outras fontes oficiais.','homepage_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html','data_access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html','research_areas':'Demografia | Ciências Sociais | Saúde Pública | Educação | Trabalho e Renda | Políticas Públicas','keywords':'indicadores sociais | desigualdade | condições de vida | gênero | cor ou raça | deficiência','data_product_types':'indicadores | tabelas | publicações | sínteses analíticas','data_formats':'XLS | ODS | PDF | HTML; SIDRA quando aplicável','visualization_types':'tabelas | gráficos | publicações digitais','geographic_coverage':'Brasil; desagregações variam por indicador e produto','covers_brazil':'sim','spatial_resolution':'varia por indicador: Brasil, Grandes Regiões, UFs, RMs, capitais e outros recortes quando sustentados','temporal_coverage':'varia por produto; séries e anos de referência próprios','temporal_resolution':'anual ou eventual conforme produto','data_sources':'PNAD Contínua | PNS | Censos | registros administrativos | outras fontes oficiais conforme produto','free_download':'sim','access_conditions':'aberto; observar notas metodológicas e regras de cada tabela/indicador','programmatic_access':'parcial','access_protocols':'HTTPS | SIDRA quando aplicável','authentication_required':'não','access_documentation_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html','license':'não localizada no nível da família; verificar produto e arquivo','institutional_status':'público','owner_or_manager':'IBGE','academic_uses':'Análise de desigualdades, bem-estar, condições de vida, saúde, educação, trabalho, gênero e grupos populacionais.','limitations':'Produtos combinam fontes, populações-alvo, denominadores, recortes e períodos distintos; não tratar indicadores de diferentes produtos como medidas diretamente intercambiáveis sem harmonização.','academic_evidence_type':'documentação oficial','academic_evidence_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html','academic_evidence_note':'Páginas oficiais do IBGE documentam fontes, conceitos, períodos e níveis de divulgação de cada estudo.','verification_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9221-sintese-de-indicadores-sociais.html','last_verified':VERIFIED}),
            ('registro_civil', {
              'resource_name':'Estatísticas do Registro Civil — IBGE','acronym':'Registro Civil','official_identity':'Operação estatística anual do IBGE baseada em registros administrativos de pessoas naturais e atos correlatos','description':'Produz estatísticas anuais de nascidos vivos, óbitos, óbitos fetais, casamentos e divórcios a partir de registros civis, judiciais e extrajudiciais informados ao IBGE.','homepage_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html','data_access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html','research_areas':'Demografia | Estatísticas Vitais | Saúde Pública | Ciências Sociais','keywords':'registro civil | nascidos vivos | óbitos | casamentos | divórcios | estatísticas vitais','data_product_types':'tabelas | séries estatísticas | publicação | SIDRA','data_formats':'XLS | XLSX | ODS | PDF | HTML | SIDRA','visualization_types':'tabelas | séries | publicação digital','geographic_coverage':'Brasil; resultados nacionais e subnacionais conforme variável','covers_brazil':'sim','spatial_resolution':'município e agregações superiores conforme tabela e evento','temporal_coverage':'série histórica anual; edição corrente auditada: 2024','temporal_resolution':'anual','data_sources':'Cartórios de Registro Civil de Pessoas Naturais | Varas e órgãos judiciais | Tabelionatos de Notas','free_download':'sim','access_conditions':'aberto; respeitar definições, cobertura e ano de ocorrência/registro','programmatic_access':'parcial','access_protocols':'HTTPS | SIDRA','authentication_required':'não','access_documentation_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html','license':'não localizada no nível da fonte; verificar produto e arquivo','institutional_status':'público','owner_or_manager':'IBGE','academic_uses':'Fecundidade, mortalidade, nupcialidade, divórcios, estatísticas vitais e análises demográficas territoriais.','limitations':'Registros administrativos dependem de cobertura e temporalidade do registro; ocorrência, registro e divulgação são referências distintas e devem ser preservadas.','academic_evidence_type':'documentação oficial','academic_evidence_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html','academic_evidence_note':'O IBGE documenta objetivo, natureza administrativa, periodicidade anual e tabelas por tipo de evento.','verification_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html','last_verified':VERIFIED}),
            ('cempre', {
              'resource_name':'Cadastro Central de Empresas — Estatísticas — IBGE','acronym':'CEMPRE','official_identity':'Sistema estatístico anual do IBGE sobre empresas e outras organizações formalmente constituídas e suas unidades locais','description':'Integra cadastros, pesquisas estruturais do IBGE e registros administrativos para produzir estatísticas sobre organizações formais, unidades locais, pessoal ocupado, salários e estrutura empresarial.','homepage_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9016-estatisticas-do-cadastro-central-de-empresas.html','data_access_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9016-estatisticas-do-cadastro-central-de-empresas.html','research_areas':'Economia | Mercado de Trabalho | Geografia Econômica | Desenvolvimento Regional','keywords':'empresas | organizações | unidades locais | pessoal ocupado | salários | CNAE | CEMPRE','data_product_types':'tabelas | séries históricas | publicação | SIDRA','data_formats':'ODS | XLSX | PDF | HTML | SIDRA','visualization_types':'tabelas | séries | publicação digital','geographic_coverage':'Brasil; Grandes Regiões, UFs, municípios e outros recortes conforme tabela','covers_brazil':'sim','spatial_resolution':'empresa/unidade local agregada por recortes geográficos; município disponível em tabulações SIDRA','temporal_coverage':'série anual; nova série metodológica a partir de 2022; edição corrente auditada: 2024','temporal_resolution':'anual','data_sources':'Pesquisas estruturais do IBGE | SIMCAD | CNPJ/Receita Federal | RAIS/CAGED/eSocial e outros registros administrativos documentados','free_download':'sim','access_conditions':'aberto; observar quebra de série e notas metodológicas','programmatic_access':'parcial','access_protocols':'HTTPS | SIDRA','authentication_required':'não','access_documentation_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9016-estatisticas-do-cadastro-central-de-empresas.html','license':'não localizada no nível da fonte; verificar produto e arquivo','institutional_status':'público','owner_or_manager':'IBGE','academic_uses':'Estrutura empresarial, emprego formal, salários, distribuição territorial de unidades locais e dinâmica econômica.','limitations':'Não representa toda atividade econômica informal; mudanças de fontes administrativas e a nova série a partir de 2022 impedem comparações ingênuas com séries anteriores.','academic_evidence_type':'documentação oficial','academic_evidence_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9016-estatisticas-do-cadastro-central-de-empresas.html','academic_evidence_note':'O IBGE documenta a integração de fontes e a mudança metodológica com nova série a partir de 2022.','verification_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9016-estatisticas-do-cadastro-central-de-empresas.html','last_verified':VERIFIED})
          ]

          by_name={r['resource_name'].strip():r['resource_id'].strip() for r in resources}
          new_resources=[]; source_ids={}
          for key, spec in source_specs:
              rid=by_name.get(spec['resource_name'])
              if not rid:
                  rid=alloc_rid(); spec=dict(spec); spec['resource_id']=rid; new_resources.append(spec)
              source_ids[key]=rid
          append_rows(RES, res_fields, new_resources)
          resources_all=resources+new_resources

          product_specs = [
            ('social_syntheses','Síntese de Indicadores Sociais — 2025','SIS 2025','Síntese de Indicadores Sociais','indicator_family','Sistema anual de indicadores sobre condições de vida e desigualdades sociais, organizado em 2025 nos eixos estrutura econômica e mercado de trabalho, padrão de vida e distribuição de rendimentos e educação.','Demography | Social inequalities | Labour | Income | Education | Public policy','condições de vida | desigualdade | trabalho | rendimento | pobreza | educação | indicadores sociais','Brasil, Grandes Regiões, UFs, Regiões Metropolitanas e Municípios das Capitais conforme indicador','pessoa | domicílio | agregações territoriais conforme indicador','varia por indicador; níveis de divulgação definidos por fonte e confiabilidade','2012–2024 na edição 2025, com períodos específicos por indicador','anual ou conforme indicador','anual','ativo','edição 2025','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/9221-sintese-de-indicadores-sociais.html','https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/XS','derivado','Sistema de indicadores multifuente: denominadores, populações-alvo, períodos e níveis geográficos variam. Não tratar o conjunto como uma única pesquisa nem comparar indicadores sem preservar suas fontes e conceitos.','XLS | ODS | PDF | HTML','Síntese de Indicadores Sociais 2025 — tabelas e publicação','por capítulo, tabela, indicador e recorte territorial'),
            ('social_syntheses','Estatísticas de Gênero — Indicadores sociais das mulheres no Brasil — 3ª edição 2024','Estatísticas de Gênero 2024','Indicadores sociais de gênero','indicator_family','Sistema de indicadores de gênero alinhado ao Conjunto Mínimo de Indicadores de Gênero da ONU, integrando pesquisas, censos, registros administrativos, projeções e fontes oficiais para analisar condições das mulheres no Brasil.','Gender studies | Demography | Labour | Health | Education | Public policy','gênero | mulheres | empoderamento | trabalho | educação | saúde | participação | direitos humanos','Brasil; desagregações variam por indicador e fonte','pessoa | domicílio | instituições e agregações territoriais conforme indicador','varia conforme indicador e fonte','referências variáveis; edição 2024','eventual; período próprio de cada indicador','eventual','ativo','3ª edição — 2024','complete','https://www.ibge.gov.br/estatisticas/multidominio/genero/20163-estatisticas-de-genero-indicadores-sociais-das-mulheres-no-brasil.html','https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/C9','derivado','Indicadores são multifuente e não compartilham necessariamente população, período ou denominador. Desagregações e comparabilidade internacional dependem da definição de cada indicador.','XLS | ODS | PDF | HTML','Estatísticas de Gênero 2024 — tabelas e publicação','por domínio, indicador e desagregação disponível'),
            ('social_syntheses','Desigualdades Sociais por Cor ou Raça no Brasil — 2ª edição 2022','Desigualdades por Cor ou Raça 2022','Desigualdades sociais por cor ou raça','indicator_family','Estudo-síntese sobre desigualdades sociais por cor ou raça em trabalho e renda, moradia, educação, violência, participação e gestão, usando principalmente PNAD Contínua e outras fontes oficiais.','Race and ethnicity | Social inequalities | Labour | Income | Education | Public policy','cor ou raça | desigualdade racial | pretos | pardos | brancos | trabalho | renda | educação','Brasil; Grandes Regiões e outros recortes quando a fonte sustenta','pessoa | domicílio | município/UF em componentes específicos','varia por fonte e indicador','principalmente referências em torno de 2018–2021; períodos próprios conforme indicador','eventual; período próprio por indicador','eventual','ativo','2ª edição — 2022','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/25844-desigualdades-sociais-por-cor-ou-raca.html','https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/DL','derivado','Grande parte das análises amostrais concentra-se em pessoas brancas, pretas e pardas devido à representação amostral. Indicadores usam fontes, anos e níveis geográficos distintos; não inferir causalidade ou equivalência entre dimensões.','XLS | ODS | PDF | HTML','Desigualdades Sociais por Cor ou Raça — tabelas e publicação','por tema, indicador e recorte suportado'),
            ('social_syntheses','Pessoas com Deficiência e as Desigualdades Sociais no Brasil — 2022','Pessoas com Deficiência 2022','Desigualdades sociais e deficiência','indicator_family','Estudo analítico sobre condições de vida das pessoas com deficiência nas dimensões trabalho, educação, saúde, participação e gestão, rendimento e moradia, tendo a PNS 2019 como principal fonte.','Disability studies | Public health | Social inequalities | Labour | Education | Public policy','deficiência | desigualdade | PNS 2019 | trabalho | educação | saúde | moradia','Brasil; recortes geográficos e sociodemográficos limitados pela precisão das estimativas','pessoa | domicílio | agregações territoriais conforme confiabilidade','varia por indicador; recortes definidos considerando coeficientes de variação','principalmente PNS 2019; fontes complementares possuem referências próprias','estudo pontual; referência própria por indicador','eventual','ativo','publicação 2022; principal fonte PNS 2019','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/34889-pessoas-com-deficiencia-e-as-desigualdades-sociais-no-brasil.html','https://www.ibge.gov.br/estatisticas/sociais/populacao/34889-pessoas-com-deficiencia-e-as-desigualdades-sociais-no-brasil.html','derivado','Estimativas derivadas principalmente da PNS 2019 e sujeitas ao desenho amostral e coeficientes de variação. Não são registros clínicos, administrativos ou prevalência atual automática; fontes complementares usam conceitos próprios.','XLS | ODS | PDF | HTML','Pessoas com Deficiência e Desigualdades 2022 — tabelas e publicação','por tema e recorte estatisticamente suportado'),
            ('registro_civil','Estatísticas do Registro Civil — 2024','Registro Civil 2024','Estatísticas vitais e eventos civis','dataset_series','Edição anual com estatísticas de nascidos vivos, óbitos, óbitos fetais, casamentos e divórcios registrados e informados ao IBGE por cartórios e órgãos judiciais/extrajudiciais.','Demography | Vital statistics | Public health | Population studies','nascidos vivos | óbitos | óbitos fetais | casamentos | divórcios | registro civil','Brasil; resultados nacionais, estaduais e municipais conforme tabela','evento de registro | município | agregações territoriais','municipal e agregações superiores conforme tabela','ano de referência 2024; série histórica disponível','anual','anual','ativo','edição 2024 — divulgada em 2025','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/9110-estatisticas-do-registro-civil.html','https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/RC','derivado','Estatísticas refletem eventos registrados/informados e podem diferir do ano de ocorrência conforme o evento e o fluxo administrativo. Cobertura, atraso de registro e conceitos devem ser preservados; não equivalem automaticamente a sistemas de saúde.','XLS | XLSX | ODS | PDF | SIDRA','Registro Civil 2024 — tabelas, SIDRA e publicação','por tipo de evento, ano, geografia e atributos disponíveis'),
            ('cempre','Estatísticas do Cadastro Central de Empresas — CEMPRE 2024','CEMPRE 2024','Estrutura empresarial e unidades locais','dataset_series','Estatísticas anuais sobre empresas e outras organizações formais ativas e suas unidades locais, incluindo pessoal ocupado, assalariados, salários e remunerações, atividade econômica, natureza jurídica, porte e distribuição geográfica.','Economics | Labour | Economic geography | Regional development','CEMPRE | empresas | unidades locais | pessoal ocupado | salários | CNAE | organizações formais','Brasil; Grandes Regiões, UFs, municípios e outros recortes conforme tabela/SIDRA','empresa | unidade local | agregações territoriais e setoriais','empresa/unidade local agregada; município em tabulações SIDRA','ano de referência 2024; nova série metodológica a partir de 2022','anual','anual','ativo','CEMPRE 2024 — publicado em 2026','complete','https://www.ibge.gov.br/estatisticas/economicas/comercio/9016-estatisticas-do-cadastro-central-de-empresas.html','https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/CL','misto','Abrange organizações formalmente constituídas e não representa toda atividade informal. A integração de pesquisas e registros administrativos e a mudança metodológica com nova série a partir de 2022 exigem cautela em comparações históricas.','ODS | XLSX | PDF | HTML | SIDRA','CEMPRE 2024 — tabelas, séries e SIDRA','por atividade CNAE, natureza jurídica, porte, variável e geografia')
          ]

          existing_names={r['product_name'].strip() for r in products}
          existing_urls={r['product_page_url'].strip() for r in products}
          new_products=[]; new_dists=[]
          for spec in product_specs:
              (source_key,name,acro,family,kind,desc,areas,keywords,geo,support,sres,tcover,tres,ufreq,status,version,scope,url,method,origin,limits,fmt,dname,subset)=spec
              if name in existing_names or url in existing_urls:
                  print('SKIP existing product:', name)
                  continue
              pid=alloc_pid(); did=alloc_did()
              new_products.append({
                'product_id':pid,'resource_id':source_ids[source_key],'product_name':name,'product_acronym':acro,'product_family':family,'product_kind':kind,'product_description':desc,'research_areas':areas,'keywords':keywords,'geographic_coverage':geo,'covers_brazil':'sim','spatial_support':support,'spatial_resolution':sres,'temporal_coverage':tcover,'temporal_resolution':tres,'update_frequency':ufreq,'product_status':status,'version_or_collection':version,'enumeration_scope':scope,'product_page_url':url,'methodology_url':method,'primary_or_derived':origin,'limitations':limits,'last_verified':VERIFIED})
              new_dists.append({
                'distribution_id':did,'product_id':pid,'distribution_name':dname,'access_url':url,'format':fmt,'access_protocol':'HTTPS | SIDRA quando disponível','access_tool':'navegador web | SIDRA quando disponível','free_download':'sim','authentication_required':'não','access_conditions':'acesso aberto; observar metadados, notas técnicas e eventuais regras do sistema de tabulação','license':'não determinada especificamente para os arquivos nesta auditoria','provider_attribution_required':'sim','subset_support':subset,'notes':'Distribuição oficial do IBGE. Formatos, recortes e tabelas variam por componente; não generalizar uma modalidade de acesso para todo o conteúdo do produto.','last_verified':VERIFIED})
              existing_names.add(name); existing_urls.add(url)

          append_rows(PROD, prod_fields, new_products)
          append_rows(DIST, dist_fields, new_dists)

          registry=json.loads(PRIOR.read_text(encoding='utf-8'))
          registry['reviewed_at']=VERIFIED
          p0=next(t for t in registry['tiers'] if t['priority_tier']=='P0')
          ids=p0['resource_ids']
          for r in new_resources:
              if r['resource_id'] not in ids: ids.append(r['resource_id'])
          PRIOR.write_text(json.dumps(registry, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')

          print(f'APPENDED sources={len(new_resources)} products={len(new_products)} distributions={len(new_dists)}')
          print('NEW SOURCE IDS', [r['resource_id'] for r in new_resources])
          print('NEW PRODUCT IDS', [r['product_id'] for r in new_products])
          print('NEW DISTRIBUTION IDS', [r['distribution_id'] for r in new_dists])
          PY

      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          for p in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(p,encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
              print(p, len(rows))
          PY

      - name: Commit materialized catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No material changes to commit.'
            exit 0
          fi
          git commit -m 'Expand verified IBGE social and economic catalog'
          git push origin HEAD:main
