name: Materializar lote ambiental IBGE

on:
  push:
    branches:
      - audit/ibge-environmental-stats-2026-08-15
    paths:
      - scripts/materialize_ibge_environmental_stats_batch.py
      - .github/workflows/materialize-ibge-environmental-stats.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-environmental-stats-2026-08-15
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize canonical rows
        run: python scripts/materialize_ibge_environmental_stats_batch.py

      - name: Validate Brazil priority registry
        run: python scripts/validate_brazil_scope.py

      - name: Validate product catalog
        run: python scripts/validate_product_catalog.py

      - name: Build catalog
        run: python scripts/build_catalog.py

      - name: Regenerate link-role audit
        run: python scripts/audit_link_roles.py --write

      - name: Read back link-role audit
        run: python scripts/audit_link_roles.py

      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py

      - name: Diff hygiene
        run: git diff --check

      - name: Verify canonical counts and new relations
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          d=Path('data')
          with (d/'data_resources.csv').open(encoding='utf-8', newline='') as f: r=list(csv.DictReader(f))
          with (d/'data_products.csv').open(encoding='utf-8', newline='') as f: p=list(csv.DictReader(f))
          with (d/'product_distributions.csv').open(encoding='utf-8', newline='') as f: x=list(csv.DictReader(f))
          assert len(r)==73, len(r)
          assert len(p)==107, len(p)
          assert len(x)==123, len(x)
          rs={z['resource_id'] for z in r}; ps={z['product_id'] for z in p}
          assert {'DR0072','DR0073'} <= rs
          assert {'DP000104','DP000105','DP000106','DP000107'} <= ps
          for z in p:
            assert z['resource_id'] in rs, z
          for z in x:
            assert z['product_id'] in ps, z
          assert len(rs)==len(r)
          assert len(ps)==len(p)
          assert len({z['distribution_id'] for z in x})==len(x)
          priority=json.loads((d/'brazil_scope_priorities.json').read_text(encoding='utf-8'))
          p0=next(t['resource_ids'] for t in priority['tiers'] if t['priority_tier']=='P0')
          assert {'DR0072','DR0073'} <= set(p0)
          print(f'COUNTS resources={len(r)} products={len(p)} distributions={len(x)} P0={len(p0)}')
          PY

      - name: Remove one-shot helpers
        run: git rm scripts/materialize_ibge_environmental_stats_batch.py .github/workflows/materialize-ibge-environmental-stats.yml

      - name: Commit materialized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json
          git diff --cached --check
          git commit -m "Expandir estatísticas e estudos ambientais do IBGE"
          git push origin HEAD:audit/ibge-environmental-stats-2026-08-15
