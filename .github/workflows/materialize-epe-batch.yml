          {'product_id':'DP000573','resource_id':'DR0121','product_name':'BiodivEPE — Biodiversidade no Planejamento de Projetos de Energia','product_acronym':'BiodivEPE','product_family':'Biodiversidade e planejamento energético','product_kind':'data_service','product_description':'Ferramenta SIG para análise de sobreposição e apoio à escolha locacional de projetos de energia, integrando camadas de áreas relevantes para biodiversidade e uma camada-síntese, com geração de relatórios.','research_areas':'Biodiversidade e Conservação | Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação','keywords':'biodiversidade | energia | áreas protegidas | Ramsar | KBA | IBA | sobreposição | planejamento locacional','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'polígonos de áreas sensíveis e geometria fornecida pelo usuário','spatial_resolution':'varia conforme a camada temática e fonte primária','temporal_coverage':'camadas atualizadas periodicamente; revisão técnica 04 em 2026','temporal_resolution':'não se aplica; atributos e versões conforme camada','update_frequency':'anual para atualização documentada da ferramenta','product_status':'ativo','version_or_collection':'Informativo Técnico Revisão 04 (2026); atualização anual divulgada em 22/05/2026','enumeration_scope':'complete','product_page_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/biodivepe-biodiversidade-no-planejamento-de-projetos-de-energia','methodology_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/biodivepe-biodiversidade-no-planejamento-de-projetos-de-energia','primary_or_derived':'serviço','limitations':'Sobreposição espacial indica potencial interação territorial, não impacto ambiental observado, licenciamento aprovado ou inviabilidade automática. Cada camada mantém fonte, data, escala, definição e licença próprias; a camada-síntese não elimina essas diferenças.','last_verified':verified},
