          {'distribution_id':'DD000594','product_id':'DP000569','distribution_name':'Anuário Elétrico 2026 — relatório online, workbook, painel e dados abertos','access_url':'https://www.epe.gov.br/pt/imprensa/noticias/epe-publica-o-anuario-estatistico-de-energia-eletrica-2026-ano-base-2025-','format':'XLSX | dados abertos | relatório web | painel interativo','access_protocol':'HTTPS download | aplicação web','access_tool':'navegador web | planilha','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; preservar indicador, recorte territorial/setorial, período e fonte','license':'Creative Commons Atribuição 4.0 Internacional (CC BY 4.0)','provider_attribution_required':'sim','subset_support':'por mercado, região, subsistema, classe e indicador conforme ferramenta','notes':'A edição 2026 disponibiliza relatório online, Workbook, Anuário Interativo, Painel de Monitoramento do Consumo e dados abertos.','last_verified':verified},
