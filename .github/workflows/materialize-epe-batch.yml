          {'product_id':'DP000571','resource_id':'DR0121','product_name':'WEBMAP EPE — sistema energético brasileiro','product_acronym':'WEBMAP EPE','product_family':'Geoinformação do planejamento energético','product_kind':'federated_catalog','product_description':'Aplicação SIG da EPE para consulta, visualização, medição, download e serviços WMS de camadas do sistema energético existente e planejado, combustíveis, petróleo e gás, biocombustíveis, meio ambiente e recursos energéticos.','research_areas':base_area,'keywords':'Webmap | energia | geoinformação | WMS | geração | transmissão | petróleo | gás | biocombustíveis','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'camadas vetoriais e raster; empreendimentos, linhas, áreas e recursos conforme tema','spatial_resolution':'varia por camada e fonte primária; consultar metadados','temporal_coverage':'corrente e histórica/planejada conforme camada','temporal_resolution':'varia por camada','update_frequency':'irregular conforme camada','product_status':'ativo','version_or_collection':'versão atualizada disponível em 2026','enumeration_scope':'external_index','product_page_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/webmap-epe','methodology_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/webmap-epe','primary_or_derived':'agregador','limitations':'O Webmap agrega camadas de múltiplas fontes e estados do sistema energético. Existente, planejado, potencial e recurso ambiental são categorias distintas; resolução, data, precisão, licença e provedor devem ser herdados dos metadados de cada camada.','last_verified':verified},
