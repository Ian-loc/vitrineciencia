            'academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos','academic_evidence_note':'A EPE documenta publicações, dados abertos, ferramentas interativas, séries históricas e estudos de planejamento energético, com produtos correntes em 2026.','verification_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos','last_verified':verified
          }
          assert set(source)==set(sh); append_row(source_path,sh,source)

          base_area='Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados'
          products=[
