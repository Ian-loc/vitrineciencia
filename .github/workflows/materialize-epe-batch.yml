name: Materialize verified EPE batch

on:
  push:
    branches: ["audit/epe-2026-batch"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/epe-2026-batch
          fetch-depth: 0
      - name: Append verified EPE source, products and distributions
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          ROOT=Path('.')
          source_path=ROOT/'data/data_resources.csv'
          product_path=ROOT/'data/data_products.csv'
          dist_path=ROOT/'data/product_distributions.csv'
          priority_path=ROOT/'data/brazil_scope_priorities.json'
          verified='2026-08-18'

          def read(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  r=csv.DictReader(f); return list(r.fieldnames), list(r)
          def append_row(path, fieldnames, row):
              with path.open('a', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n'); w.writerow(row)

          sh,srows=read(source_path); ph,prows=read(product_path); dh,drows=read(dist_path)
          assert len(srows)==120 and srows[-1]['resource_id']=='DR0120', (len(srows),srows[-1]['resource_id'])
          assert len(prows)==563 and prows[-1]['product_id']=='DP000567', (len(prows),prows[-1]['product_id'])
          assert len(drows)==588 and drows[-1]['distribution_id']=='DD000592', (len(drows),drows[-1]['distribution_id'])

          source={
            'resource_id':'DR0121','resource_name':'Empresa de Pesquisa Energética — dados, estudos e ferramentas de planejamento','acronym':'EPE','official_identity':'Empresa de Pesquisa Energética — EPE / Ministério de Minas e Energia',
            'description':'Fonte institucional brasileira de estatísticas, dados abertos, estudos, modelos e ferramentas geoespaciais para planejamento energético nacional, cobrindo energia elétrica, combustíveis, biocombustíveis, eficiência energética e dimensões socioambientais.',
            'homepage_url':'https://www.epe.gov.br/','data_access_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados',
            'keywords':'EPE | planejamento energético | BEN | energia elétrica | PDE | eficiência energética | geoinformação | biodiversidade','data_product_types':'estatísticas | séries históricas | modelos | painéis | dados geoespaciais | publicações técnicas','data_formats':'XLSX | CSV | PDF | dados vetoriais | raster | WMS | formatos de modelos; varia conforme produto','visualization_types':'painéis interativos | mapas | gráficos | relatórios dinâmicos',
            'geographic_coverage':'Brasil; alguns estudos incluem contexto internacional ou domínios do Sistema Interligado Nacional','covers_brazil':'sim','spatial_resolution':'nacional, regional, UF, empreendimento ou camada geoespacial conforme produto','temporal_coverage':'séries históricas desde 1970 em produtos energéticos; horizontes prospectivos decenais e produtos correntes conforme estudo','temporal_resolution':'anual | mensal | por cenário | por edição; varia conforme produto',
            'data_sources':'estatísticas setoriais | agentes e instituições do setor energético | pesquisas EPE | modelos de planejamento | bases geoespaciais públicas','free_download':'sim','access_conditions':'acesso público em produtos auditados; preservar edição, metodologia, fonte primária e condições específicas de cada arquivo/camada','programmatic_access':'parcial','access_protocols':'HTTPS download | WMS | aplicações web; varia conforme produto','authentication_required':'não','access_documentation_url':'https://www.epe.gov.br/pt/publicacoes-dados-abertos/ferramentas-interativas','license':'conteúdo do site EPE sob Creative Commons Atribuição 4.0 Internacional (CC BY 4.0); verificar licenças e fontes de camadas/dados de terceiros','institutional_status':'público','owner_or_manager':'Empresa de Pesquisa Energética — EPE / Ministério de Minas e Energia',
            'academic_uses':'Matriz energética e elétrica, transição energética, eficiência energética, modelagem e planejamento de expansão, infraestrutura energética, emissões, biodiversidade e análise territorial de projetos de energia.',
