          {'product_id':'DP000569','resource_id':'DR0121','product_name':'Anuário Estatístico de Energia Elétrica 2026 — ano-base 2025','product_acronym':'Anuário Elétrico 2026','product_family':'Estatísticas de energia elétrica','product_kind':'dataset_series','product_description':'Panorama estatístico anual do setor elétrico brasileiro, com séries consolidadas de consumo nos mercados cativo e livre, regiões, subsistemas e classes, além de demanda, carga, preços e tarifas.','research_areas':base_area,'keywords':'energia elétrica | consumo | carga | demanda | tarifas | mercado livre | mercado cativo','geographic_coverage':'Brasil; agregações por região, subsistema e classe conforme indicador','covers_brazil':'sim','spatial_support':'nacional e agregações territoriais/setoriais','spatial_resolution':'região, subsistema, classe e demais recortes conforme tabela','temporal_coverage':'séries históricas consolidadas até 2025; edição 2026 ano-base 2025','temporal_resolution':'anual e mensal em ferramentas associadas conforme indicador','update_frequency':'anual','product_status':'ativo','version_or_collection':'edição 2026; ano-base 2025','enumeration_scope':'complete','product_page_url':'https://www.epe.gov.br/pt/imprensa/noticias/epe-publica-o-anuario-estatistico-de-energia-eletrica-2026-ano-base-2025-','methodology_url':'https://www.epe.gov.br/pt/areas-de-atuacao/estatisticas','primary_or_derived':'derivado','limitations':'Indicadores de consumo, carga, demanda, preços e tarifas têm conceitos, fontes e denominadores próprios; não tratar o anuário como medição operacional em tempo real nem misturar mercados/recortes sem harmonização.','last_verified':verified},
