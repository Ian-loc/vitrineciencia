          assert 'DR0121' not in p0['resource_ids']; p0['resource_ids'].append('DR0121'); reg['reviewed_at']=verified
          priority_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

