name: One-shot INMET catalog materializer

on:
  pull_request:
    paths:
      - '.github/inmet-trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize verified INMET batch
        run: python scripts/one_shot_inmet_catalog.py
      - name: Normalize catalog scope and distribution IDs
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data/data_products.csv')
          with p.open(encoding='utf-8', newline='') as f:
              r=csv.DictReader(f); pf=r.fieldnames; prows=list(r)
          for row in prows:
              if row['product_id'] in {'DP000525','DP000526'}:
                  row['enumeration_scope']='external_index'
          with p.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=pf, lineterminator='\n'); w.writeheader(); w.writerows(prows)

          d=Path('data/product_distributions.csv')
          with d.open(encoding='utf-8', newline='') as f:
              r=csv.DictReader(f); df=r.fieldnames; drows=list(r)
          # DD000543–DD000546 are existing SINISA IDs. Drop only temporary INMET rows >=547, then append a collision-free block.
          drows=[row for row in drows if not (row['distribution_id'] in {'DD000547','DD000548'} and row['product_id'] in {'DP000526','DP000527'})]
          today=next(row['last_verified'] for row in prows if row['product_id']=='DP000522')
          new=[
            {'distribution_id':'DD000547','product_id':'DP000522','distribution_name':'INMET — Dados Históricos Anuais — downloads por ano','access_url':'https://portal.inmet.gov.br/dadoshistoricos','format':'ZIP/CSV conforme ano e pacote','access_protocol':'HTTPS download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'seleção por ano; preservar estação, unidades e cabeçalhos dos arquivos','license':'não localizada de forma inequívoca no nível do arquivo','provider_attribution_required':'sim','subset_support':'por ano e estação dentro dos pacotes','notes':'O portal lista anos 2000–2026 no estado auditado; 2026 aparece como parcial e deve ser tratado como tal.','last_verified':today},
            {'distribution_id':'DD000548','product_id':'DP000523','distribution_name':'INMET — Estações Automáticas — tabela operacional','access_url':'https://tempo.inmet.gov.br/','format':'tabela/consulta web','access_protocol':'HTTPS','access_tool':'navegador web','free_download':'parcial','authentication_required':'não','access_conditions':'consulta operacional; documentação informa atualização horária e janela recente','license':'não localizada de forma inequívoca','provider_attribution_required':'sim','subset_support':'por estação/local e período oferecido pela interface','notes':'Produto operacional; para séries longas utilizar a distribuição histórica e registrar UTC.','last_verified':today},
            {'distribution_id':'DD000549','product_id':'DP000524','distribution_name':'INMET — Normais Climatológicas 1991–2020 — tabelas e mapas','access_url':'https://portal.inmet.gov.br/normais','format':'tabelas/arquivos e mapas conforme variável','access_protocol':'HTTPS','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'seleção por período climatológico e variável','license':'não localizada de forma inequívoca no nível do arquivo','provider_attribution_required':'sim','subset_support':'por variável, estação/período e produto climatológico','notes':'Inclui temperatura, precipitação, umidade, vento, pressão, insolação, evaporação e outras estatísticas conforme disponibilidade.','last_verified':today},
            {'distribution_id':'DD000550','product_id':'DP000525','distribution_name':'INMET — Catálogo de Estações Automáticas — CSV','access_url':'https://portal.inmet.gov.br/paginas/catalogoaut','format':'CSV','access_protocol':'HTTPS download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público','license':'não localizada de forma inequívoca no nível do arquivo','provider_attribution_required':'sim','subset_support':'catálogo completo; filtrar localmente','notes':'Metadados cadastrais das estações automáticas; não contém a série meteorológica histórica.','last_verified':today},
            {'distribution_id':'DD000551','product_id':'DP000526','distribution_name':'INMET — Catálogo de Estações Convencionais — CSV','access_url':'https://portal.inmet.gov.br/paginas/catalogoman','format':'CSV','access_protocol':'HTTPS download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público','license':'não localizada de forma inequívoca no nível do arquivo','provider_attribution_required':'sim','subset_support':'catálogo completo; filtrar localmente','notes':'Metadados cadastrais das estações convencionais; não contém a série meteorológica histórica.','last_verified':today},
            {'distribution_id':'DD000552','product_id':'DP000527','distribution_name':'INMET — Avisos Meteorológicos — portal operacional','access_url':'https://alertas2.inmet.gov.br/','format':'visualização web e dados do aviso conforme interface','access_protocol':'HTTPS','access_tool':'navegador web','free_download':'parcial','authentication_required':'não','access_conditions':'consulta pública; avisos são dinâmicos e podem ser atualizados','license':'não localizada de forma inequívoca no nível do recurso','provider_attribution_required':'sim','subset_support':'por dia, fenômeno e área conforme interface','notes':'Desde 2026-06-09 a interface organiza avisos por dia e pode apresentar horizonte de até cinco dias.','last_verified':today},
          ]
          existing_ids={row['distribution_id'] for row in drows}
          assert not ({x['distribution_id'] for x in new} & existing_ids), 'new distribution ID collision'
          drows.extend(new)
          with d.open('w', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=df, lineterminator='\n'); w.writeheader(); w.writerows(drows)
          PY
      - name: Validate Brazil scope
        run: python scripts/validate_brazil_scope.py
      - name: Validate product catalog
        run: python scripts/validate_product_catalog.py
      - name: Rebuild catalog
        run: python scripts/build_catalog.py
      - name: Regenerate link-role audit
        run: python scripts/audit_link_roles.py --write
      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py
      - name: Build public artifact
        run: python scripts/build_site_artifact.py
      - name: Diff check
        run: git diff --check
      - name: Commit materialized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          if git diff --cached --quiet; then
            echo "No material changes to commit"
          else
            git commit -m "Expand verified INMET climate catalog"
            git push origin HEAD:main
          fi
