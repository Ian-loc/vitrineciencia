name: Auditar qualidade dos lotes recentes
on:
  push:
    branches: [audit/recent-batches-quality]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/recent-batches-quality
          fetch-depth: 0
      - name: Aplicar correções e validar
        run: |
          python3 scripts/audit_recent_batches.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Corrigir qualidade de lotes recentes" || exit 0
          git push origin HEAD:audit/recent-batches-quality
