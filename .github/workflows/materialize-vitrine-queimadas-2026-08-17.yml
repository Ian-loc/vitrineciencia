name: Materialize verified INPE Queimadas batch 2026-08-17

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/materialize-vitrine-queimadas-2026-08-17.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified canonical records
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, pathlib
          ROOT = pathlib.Path('.')
          TODAY = '2026-08-17'

          def append_rows(path, id_field, rows):
              path = ROOT / path
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  existing = list(reader)
              ids = {r[id_field] for r in existing}
              names = {r.get('product_name','') for r in existing}
              urls = {r.get('product_page_url','') for r in existing if r.get('product_page_url')}
              for row in rows:
                  if row[id_field] in ids:
                      raise SystemExit(f'ID already exists in {path}: {row[id_field]}')
                  if id_field == 'product_id' and row.get('product_name') in names:
                      raise SystemExit(f'Product name already exists: {row["product_name"]}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n', extrasaction='raise')
                  for row in rows:
                      w.writerow(row)

          resource = {
            'resource_id':'DR0103','resource_name':'Programa Queimadas — INPE','acronym':'Programa Queimadas INPE',
            'official_identity':'Programa nacional do INPE para monitoramento e modelagem de queimadas e incêndios florestais por sensoriamento remoto',
            'description':'Infraestrutura oficial do INPE que produz e distribui dados, produtos, processos e geosserviços para monitorar fogo ativo na vegetação, eventos de fogo, área queimada, risco meteorológico de fogo e informações ambientais associadas.',
            'homepage_url':'https://terrabrasilis.dpi.inpe.br/queimadas/portal/','data_access_url':'https://terrabrasilis.dpi.inpe.br/queimadas/portal/pages/secao_downloads/dados-abertos/index.html',
            'research_areas':'Ciências Ambientais e Ecologia | Clima e Ciências Atmosféricas | Sensoriamento Remoto e Geoinformação',
            'keywords':'queimadas | incêndios florestais | fogo ativo | área queimada | risco de fogo | sensoriamento remoto | INPE',
            'data_product_types':'dados de focos | eventos de fogo | área queimada | risco meteorológico | geosserviços | boletins',
            'data_formats':'CSV | KML | GeoTIFF | serviços OGC | PDF | formatos conforme produto','visualization_types':'mapa interativo | dashboard | séries | relatórios',
            'geographic_coverage':'Brasil e recortes territoriais; alguns produtos possuem cobertura regional/internacional conforme sistema','covers_brazil':'sim',
            'spatial_resolution':'varia por satélite, sensor e produto; AQ1km é produto de área queimada com grade nominal de 1 km','temporal_coverage':'acervo de focos desde 1998; demais séries conforme produto','temporal_resolution':'10 minutos a mensal/anual conforme produto',
            'data_sources':'satélites de observação da Terra | dados meteorológicos | limites oficiais | modelagem INPE',
            'free_download':'sim','access_conditions':'dados e produtos públicos sem custo; observar metodologia, satélite de referência, versão e limitações de cada produto',
            'programmatic_access':'sim','access_protocols':'HTTPS | CSV/KML download | OGC WMS/WFS','authentication_required':'não',
            'access_documentation_url':'https://terrabrasilis.dpi.inpe.br/queimadas/portal/pages/secao_downloads/dados-abertos/index.html',
            'license':'dados abertos para uso público; verificar termos e atribuição específicos do produto/arquivo','institutional_status':'público','owner_or_manager':'INPE / MCTI',
            'academic_uses':'Ecologia do fogo, monitoramento de incêndios, climatologia, conservação, saúde ambiental, análise espaço-temporal e gestão de riscos.',
            'limitations':'Foco de fogo ativo, evento de fogo, área queimada e risco de fogo são produtos distintos e não devem ser tratados como medidas equivalentes. Detecção orbital depende de sensor, passagem, nuvens, resolução e critérios algorítmicos; contagens de focos não equivalem diretamente a número de incêndios nem a área queimada.',
            'academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.gov.br/inpe/pt-br/acesso-a-informacao/perguntas-frequentes/principais-produtos-e-servicos-do-inpe/monitoramento-do-territorio-queimadas',
            'academic_evidence_note':'O INPE documenta monitoramento por satélite, risco de fogo, emissões e múltiplos produtos públicos; o portal Programa Queimadas discrimina sistemas, downloads e relatórios.',
            'verification_url':'https://terrabrasilis.dpi.inpe.br/queimadas/portal/','last_verified':TODAY
          }
          append_rows('data/data_resources.csv','resource_id',[resource])

