          import csv
          for path in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(path,encoding='utf-8',newline='') as f:
                  rows=list(csv.DictReader(f))
              print(path, len(rows))
          PY

      - name: Commit canonical batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-vitrine-queimadas-2026-08-17.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
