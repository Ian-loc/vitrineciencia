name: One-shot Vitrine IBGE regional and society batch

on:
  push:
    branches:
      - agent/vitrine-ibge-regional-society-batch

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-ibge-regional-society-batch
          fetch-depth: 0
      - name: Append verified IBGE products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          products_path = Path('data/data_products.csv')
          dists_path = Path('data/product_distributions.csv')
          resources_path = Path('data/data_resources.csv')

          with resources_path.open(encoding='utf-8', newline='') as f:
              resource_ids = {r['resource_id'] for r in csv.DictReader(f)}
          required_resources = {'DR0071','DR0082','DR0083'}
          missing = required_resources - resource_ids
          assert not missing, f'Missing required resources: {sorted(missing)}'

          products = [
            {
              'product_id':'DP000183','resource_id':'DR0071','product_name':'Regiões Rurais do Brasil — 2015','product_acronym':'Regiões Rurais 2015','product_family':'Divisão Regional — regionalizações rurais','product_kind':'dataset','product_description':'Regionalização do IBGE que divide o território nacional em 104 Regiões Rurais, articulando dinâmica da produção agroindustrial, contiguidade territorial, rede urbana, Terras Indígenas e Unidades de Conservação para apoiar divulgação e análise de estatísticas agropecuárias.','research_areas':'Regional science | Rural geography | Territorial planning | Socioeconomic geography','keywords':'regiões rurais | regionalização | agroindústria | produção agropecuária | rede urbana | terras indígenas | unidades de conservação | IBGE','geographic_coverage':'Brasil — 104 Regiões Rurais','covers_brazil':'sim','spatial_support':'polígonos regionais compostos por municípios | tabelas | mapas','spatial_resolution':'regional; agregação de municípios contíguos em 104 regiões','temporal_coverage':'edição 2015; insumos territoriais e estatísticos próprios do estudo','temporal_resolution':'regionalização de referência','update_frequency':'decenal após REGIC e Censo Agropecuário, sujeito a ajustes institucionais','product_status':'ativo','version_or_collection':'2015','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/divisao-regional/15780-regioes-rurais.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/divisao-regional/15780-regioes-rurais.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'Regionalização analítica, não divisão político-administrativa. As 104 regiões refletem critérios e insumos da edição 2015 e não devem ser tratadas como limites legais, permanentes ou como retrato automático da organização rural contemporânea.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000184','resource_id':'DR0071','product_name':'Divisão Regional do Brasil em Regiões Geográficas Imediatas e Intermediárias — 2017','product_acronym':'Divisão Regional 2017','product_family':'Divisão Regional — regiões geográficas','product_kind':'dataset','product_description':'Quadro regional vigente do IBGE que organiza municípios em Regiões Geográficas Imediatas e Intermediárias, substituindo as antigas Microrregiões e Mesorregiões para fins de divulgação estatística e análise territorial.','research_areas':'Regional science | Territorial planning | Human geography | Spatial statistics','keywords':'regiões geográficas imediatas | regiões geográficas intermediárias | regionalização | municípios | rede urbana | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'polígonos regionais | composição municipal | tabelas | mapas','spatial_resolution':'municípios agregados em Regiões Geográficas Imediatas e Intermediárias','temporal_coverage':'regionalização 2017; base corrigida em 11/09/2018','temporal_resolution':'regionalização de referência','update_frequency':'decenal, sujeito a ajustes institucionais','product_status':'ativo','version_or_collection':'2017 — base corrigida em 11/09/2018','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/divisao-regional/15778-divisoes-regionais-do-brasil.html','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/divisao-regional/15778-divisoes-regionais-do-brasil.html','primary_or_derived':'derivado','limitations':'Regionalização estatístico-geográfica, não divisão político-administrativa. A composição municipal deve usar a base corrigida de 11/09/2018; comparações com Mesorregiões/Microrregiões de 1990 exigem correspondência explícita e não equivalência nominal.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000185','resource_id':'DR0082','product_name':'Índice de Acessibilidade Geográfica dos Municípios — 2018','product_acronym':'Acessibilidade Geográfica 2018','product_family':'Tipologias do Território — acessibilidade geográfica','product_kind':'dataset','product_description':'Índice territorial do IBGE que classifica municípios segundo acessibilidade por estrada a centros com maior oferta de bens e serviços, distinguindo áreas acessíveis, muito acessíveis, remotas e muito remotas.','research_areas':'Regional science | Accessibility analysis | Territorial planning | Socioeconomic geography','keywords':'acessibilidade geográfica | municípios | remoteness | rede urbana | transporte rodoviário | bens e serviços | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'municípios | tabela de índice | mapa nacional','spatial_resolution':'municipal','temporal_coverage':'edição 2018','temporal_resolution':'índice de referência','update_frequency':'não inferida da página oficial','product_status':'arquivado','version_or_collection':'2018','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/tipologias-do-territorio/26253-acessibilidade-geografica.html','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/tipologias-do-territorio/26253-acessibilidade-geografica.html','primary_or_derived':'derivado','limitations':'O índice mede acessibilidade rodoviária aos centros de maior oferta de bens e serviços segundo a metodologia da edição 2018. Não equivale a tempo de viagem em tempo real, acessibilidade por todos os modos, qualidade de infraestrutura ou acesso efetivamente experimentado por indivíduos.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000186','resource_id':'DR0083','product_name':'Mapa das Indicações Geográficas do Brasil — 2019','product_acronym':'Indicações Geográficas 2019','product_family':'Sociedade e Economia — propriedade industrial e território','product_kind':'map_layer_collection','product_description':'Mapa nacional IBGE–INPI que localiza regiões de origem de produtos e serviços certificados por Indicação de Procedência ou Denominação de Origem; a versão 2019 registrou 62 Indicações Geográficas certificadas até maio de 2019.','research_areas':'Economic geography | Territorial analysis | Rural development | GIS','keywords':'indicações geográficas | denominação de origem | indicação de procedência | INPI | produtos territoriais | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'mapa temático nacional | regiões de origem certificadas','spatial_resolution':'escala cartográfica 1:5.000.000','temporal_coverage':'certificações até maio de 2019; arquivo corrigido em 19/09/2019','temporal_resolution':'edição cartográfica','update_frequency':'por edição; série 2015–2019 na página oficial','product_status':'arquivado','version_or_collection':'2019 — corrigida em 19/09/2019','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia/22920-indicacoes-geograficas.html','methodology_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia/22920-indicacoes-geograficas.html','primary_or_derived':'derivado','limitations':'Produto histórico de síntese das certificações vigentes até maio de 2019. Não representa o cadastro atual completo do INPI, não substitui os atos legais de reconhecimento e não deve ser usado para inferir qualidade, produção, área cultivada ou desempenho econômico.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000187','resource_id':'DR0083','product_name':'Distribuição Espacial da Soja nos Biomas Brasileiros — 2005','product_acronym':'Soja nos Biomas 2005','product_family':'Sociedade e Economia — mapas agropecuários','product_kind':'map_layer_collection','product_description':'Mapa temático nacional do IBGE que representa as principais áreas produtoras de soja segundo produção colhida em toneladas por município, tendo os biomas brasileiros como contexto; o encarte mostra a expansão espacial em 1975, 1980, 1990 e 1995.','research_areas':'Agricultural geography | Land use | Territorial analysis | GIS','keywords':'soja | produção agrícola | municípios | biomas | expansão agrícola | agricultura | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'municípios sintetizados em mapa temático nacional | encartes históricos','spatial_resolution':'escala cartográfica 1:5.000.000','temporal_coverage':'mapa 2005; encartes 1975, 1980, 1990 e 1995','temporal_resolution':'edições e snapshots históricos','update_frequency':'produto histórico; sem atualização corrente inferida','product_status':'arquivado','version_or_collection':'2005 — 1:5.000.000','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia/15964-distribuicao-espacial-da-soja-nos-biomas-brasileiros.html','methodology_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia/15964-distribuicao-espacial-da-soja-nos-biomas-brasileiros.html','primary_or_derived':'derivado','limitations':'Mapa histórico de pequena escala baseado em produção municipal. Não representa cobertura espacial contínua de lavouras, área plantada pixel a pixel, produção atual nem causalidade entre expansão da soja e mudanças ambientais; anos do mapa principal e dos encartes devem permanecer distintos.','last_verified':'2026-08-16'
            }
          ]

          distributions = [
            {'distribution_id':'DD000201','product_id':'DP000183','distribution_name':'Regiões Rurais 2015 — relatório, Shapefile e mapa','access_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/divisao-regional/15780-regioes-rurais.html?lang=pt-BR','format':'Shapefile | publicação | mapa','access_protocol':'HTTP web | download','access_tool':'navegador web | SIG | leitor de documentos','free_download':'sim','authentication_required':'não','access_conditions':'consulta e downloads públicos','license':'licença específica dos arquivos não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'por arquivo e região na base vetorial','notes':'A página oficial disponibiliza relatório técnico, Shapefile e mapa; preservar a edição 2015 e os critérios da regionalização.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000202','product_id':'DP000184','distribution_name':'Divisão Regional 2017 — tabelas, Shapefiles, mapas e PGI','access_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/divisao-regional/15778-divisoes-regionais-do-brasil.html','format':'XLS | XLSX | ODS | Shapefile | mapas | PGI','access_protocol':'HTTP web | download | aplicação web','access_tool':'navegador web | SIG | planilha | PGI','free_download':'sim','authentication_required':'não','access_conditions':'consulta e downloads públicos; usar a base corrigida indicada pelo IBGE','license':'licença específica dos arquivos não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'por tabela, camada e Unidade da Federação conforme material','notes':'A base de composição municipal foi corrigida em 11/09/2018; preservar essa revisão ao reproduzir a regionalização 2017.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000203','product_id':'DP000185','distribution_name':'Acessibilidade Geográfica 2018 — base, tabelas e mapa','access_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/tipologias-do-territorio/26253-acessibilidade-geografica.html','format':'ZIP | ODS | XLSX | PDF','access_protocol':'HTTP web | download','access_tool':'navegador web | planilha | SIG | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta e downloads públicos','license':'licença específica dos arquivos não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'por município nas tabelas/base','notes':'O acesso oficial separa base de dados, tabelas e mapa. O índice deve ser interpretado conforme a nota técnica da edição 2018.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000204','product_id':'DP000186','distribution_name':'Indicações Geográficas 2019 — mapa temático','access_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia/22920-indicacoes-geograficas.html','format':'mapa temático; formato do arquivo deve ser verificado no download oficial','access_protocol':'HTTP web | download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; usar a versão corrigida em 19/09/2019','license':'licença específica do arquivo não localizada nesta auditoria','provider_attribution_required':'sim','subset_support':'não; mapa nacional por edição','notes':'Versão 2019 elaborada com o INPI, com 62 IGs certificadas até maio de 2019; correção editorial publicada em 19/09/2019.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000205','product_id':'DP000187','distribution_name':'Distribuição Espacial da Soja nos Biomas Brasileiros 2005 — mapa','access_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia/15964-distribuicao-espacial-da-soja-nos-biomas-brasileiros.html','format':'PDF','access_protocol':'HTTP web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública','license':'licença específica do arquivo não localizada nesta auditoria','provider_attribution_required':'sim','subset_support':'não; mapa nacional com encartes históricos','notes':'Mapa 1:5.000.000; produção municipal de soja no mapa principal e encartes históricos de 1975, 1980, 1990 e 1995.','last_verified':'2026-08-16'}
          ]

          def append_dicts(path, rows, id_field):
              with path.open(encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  existing = list(reader)
              existing_ids = {r[id_field] for r in existing}
              new_ids = [r[id_field] for r in rows]
              assert len(new_ids) == len(set(new_ids)), f'Duplicate incoming IDs in {path}'
              collision = existing_ids.intersection(new_ids)
              assert not collision, f'ID collision in {path}: {sorted(collision)}'
              existing_urls = {r.get('product_page_url','').strip() for r in existing if r.get('product_page_url')}
              if id_field == 'product_id':
                  duplicate_urls = [r['product_page_url'] for r in rows if r['product_page_url'] in existing_urls]
                  assert not duplicate_urls, f'Existing product URLs would be duplicated: {duplicate_urls}'
              for row in rows:
                  unknown = set(row) - set(fieldnames)
                  missing_fields = set(fieldnames) - set(row)
                  assert not unknown, f'Unknown fields {unknown} in {row[id_field]}'
                  assert not missing_fields, f'Missing fields {missing_fields} in {row[id_field]}'
              with path.open('a', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n')
                  writer.writerows(rows)

          append_dicts(products_path, products, 'product_id')
          append_dicts(dists_path, distributions, 'distribution_id')

          with products_path.open(encoding='utf-8', newline='') as f:
              product_rows = list(csv.DictReader(f))
          with dists_path.open(encoding='utf-8', newline='') as f:
              dist_rows = list(csv.DictReader(f))
          product_ids = [r['product_id'] for r in product_rows]
          dist_ids = [r['distribution_id'] for r in dist_rows]
          assert len(product_ids) == len(set(product_ids))
          assert len(dist_ids) == len(set(dist_ids))
          assert all(r['resource_id'] in resource_ids for r in product_rows)
          assert all(r['product_id'] in set(product_ids) for r in dist_rows)
          assert all(any(r['product_id'] == p['product_id'] for r in dist_rows) for p in products)
          print(f'Read-back: products={len(product_rows)} distributions={len(dist_rows)}')
          PY
      - name: Validate catalog
        run: |
          python scripts/validate_product_catalog.py
          python scripts/validate_brazil_scope.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Commit materialized batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/product_catalog.csv data/quality_report.json data/link_role_audit.json site-artifact || true
          if git diff --cached --quiet; then
            echo 'No material changes to commit'
            exit 0
          fi
          git commit -m 'Expand verified IBGE regional and society catalog'
          git push origin HEAD:agent/vitrine-ibge-regional-society-batch
