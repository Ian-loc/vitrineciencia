name: Materializar lote IBGE OICS 2

on:
  push:
    branches:
      - data/ibge-oics-batch-2
    paths:
      - ".github/workflows/materialize-ibge-oics-batch2.yml"
      - "scripts/materialize_ibge_oics_batch2.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/ibge-oics-batch-2
          fetch-depth: 0
      - name: Materializar e validar lote
        run: |
          python3 scripts/materialize_ibge_oics_batch2.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/validate_vitrine.py
      - name: Registrar somente delta canônico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança material pendente."
            exit 0
          fi
          git commit -m "Materializar fontes e produtos IBGE OICS lote 2"
          git push origin HEAD:data/ibge-oics-batch-2
