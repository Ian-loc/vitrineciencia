name: Materialize verified IBGE population batch

on:
  push:
    branches:
      - curation/ibge-population-batch-20260816

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curation/ibge-population-batch-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified catalog rows
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          today = '2026-08-16'

          def append_rows(path, rows, id_field):
              p = Path(path)
              with p.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames
                  existing = {r[id_field] for r in reader}
              todo = [r for r in rows if r[id_field] not in existing]
              if not todo:
                  return
              with p.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  for r in todo:
                      w.writerow({k: r.get(k, '') for k in fields})

          resources = [{
            'resource_id':'DR0091',
            'resource_name':'Estatísticas de População e Demografia — IBGE',
            'acronym':'População IBGE',
            'official_identity':'Tema institucional de estatísticas de população e demografia do IBGE',
            'description':'Família de operações e produtos estatísticos do IBGE sobre população e dinâmica demográfica, incluindo estimativas anuais, projeções, tábuas de mortalidade e avaliação amostral da cobertura censitária.',
            'homepage_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html',
            'data_access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html',
            'research_areas':'Planejamento Territorial e Políticas Públicas',
            'keywords':'população | demografia | projeções | estimativas | mortalidade | cobertura censitária | IBGE',
            'data_product_types':'estimativas | projeções | indicadores | pesquisas amostrais | tabelas | publicações',
            'data_formats':'XLSX | XLS | ODS | PDF | formatos variáveis por produto',
            'visualization_types':'tabelas | publicações | páginas de resultados',
            'geographic_coverage':'Brasil; Unidades da Federação e Municípios conforme produto',
            'covers_brazil':'sim',
            'spatial_resolution':'Brasil, Unidade da Federação ou Município conforme produto',
            'temporal_coverage':'séries históricas, anos de referência e horizontes prospectivos conforme produto',
            'temporal_resolution':'anual, censitária ou por revisão conforme produto',
            'data_sources':'Censos Demográficos | registros administrativos | pesquisas domiciliares | métodos demográficos',
            'free_download':'sim',
            'access_conditions':'consulta e download públicos conforme produto',
            'programmatic_access':'desconhecido',
            'access_protocols':'HTTPS web | HTTP download',
            'authentication_required':'não',
            'access_documentation_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html',
            'license':'licença específica deve ser verificada por produto/arquivo; não inferida nesta auditoria',
            'institutional_status':'público',
            'owner_or_manager':'IBGE',
            'academic_uses':'Demografia, planejamento territorial, denominadores populacionais, epidemiologia, estudos socioecológicos, políticas públicas e avaliação de qualidade censitária.',
            'limitations':'Os produtos possuem unidades geográficas, anos, métodos e finalidades distintas. Estimativas, projeções, tábuas de mortalidade e resultados de pós-enumeração não são observações intercambiáveis e exigem preservação da edição e da metodologia.',
            'academic_evidence_type':'documentação oficial',
            'academic_evidence_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html',
            'academic_evidence_note':'A página temática oficial lista Estimativas da População, Projeções da População, Tábuas Completas de Mortalidade e Pesquisa de Pós-Enumeração do Censo 2022 como produtos distintos.',
            'verification_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao.html',
            'last_verified':today
          }]

          products = [
          {
            'product_id':'DP000224','resource_id':'DR0091','product_name':'Estimativas da População — edição 2025','product_acronym':'Estimativas 2025','product_family':'Estimativas anuais da população','product_kind':'dataset_series',
            'product_description':'Estimativas oficiais do total da população residente dos Municípios e das Unidades da Federação, com data de referência em 1º de julho de 2025; os arquivos enviados ao TCU foram atualizados em 13/01/2026 por decisões judiciais e atualização toponímica documentadas pelo IBGE.',
            'research_areas':'Population geography | Demography | Territorial planning | Public policy','keywords':'estimativas populacionais | municípios | unidades da federação | TCU | FPM | 2025 | IBGE','geographic_coverage':'Brasil — Municípios e Unidades da Federação','covers_brazil':'sim','spatial_support':'Município | Unidade da Federação | Brasil','spatial_resolution':'municipal para as estimativas municipais; UF para agregações estaduais','temporal_coverage':'01/07/2025; série anual disponível desde 1975 segundo o IBGE','temporal_resolution':'anual','update_frequency':'anual','product_status':'ativo','version_or_collection':'2025 — arquivos enviados ao TCU atualizados em 13/01/2026','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9103-estimativas-depopulacao.html','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9103-estimativas-depopulacao.html','primary_or_derived':'derivado','limitations':'Estimativas não equivalem a contagem censitária observada. A edição 2025 possui arquivos atualizados após a publicação no DOU por decisões judiciais e atualização toponímica; análises reproduzíveis devem registrar qual arquivo/estado da edição foi usado.','last_verified':today
          },
          {
            'product_id':'DP000225','resource_id':'DR0091','product_name':'Projeções da População do Brasil e Unidades da Federação — revisão 2024','product_acronym':'Projeções 2024','product_family':'Projeções demográficas oficiais','product_kind':'dataset_series',
            'product_description':'Revisão 2024 das projeções demográficas do IBGE para Brasil e Unidades da Federação, cobrindo 2000–2070 e incorporando resultados do Censo Demográfico 2022 e informações atualizadas de mortalidade, fecundidade e migração.',
            'research_areas':'Demography | Population geography | Public policy | Spatial statistics','keywords':'projeções populacionais | mortalidade | fecundidade | migração | Censo 2022 | 2000-2070 | IBGE','geographic_coverage':'Brasil — Brasil, Grandes Regiões e Unidades da Federação','covers_brazil':'sim','spatial_support':'Brasil | Grandes Regiões | Unidades da Federação','spatial_resolution':'Unidade da Federação como maior desagregação geográfica divulgada','temporal_coverage':'2000–2070','temporal_resolution':'anual; tabelas por sexo e idade','update_frequency':'revisões periódicas após censos ou mudanças demográficas/metodológicas','product_status':'ativo','version_or_collection':'revisão 2024; metodologia 3ª edição 2025','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9109-projecao-da-populacao.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9109-projecao-da-populacao.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'São estimativas e projeções modeladas, não observações futuras. Revisões substituem hipóteses e incorporam novas informações; comparar revisões exige registrar versão e metodologia. O produto não fornece projeções municipais diretas.','last_verified':today
          },
          {
            'product_id':'DP000226','resource_id':'DR0091','product_name':'Tábuas Completas de Mortalidade — Brasil 2024','product_acronym':'Tábuas de Mortalidade 2024','product_family':'Tábuas completas de mortalidade','product_kind':'dataset_series',
            'product_description':'Tábua completa de mortalidade para a população brasileira em 2024, divulgada por sexo e idade, com probabilidades de morte e expectativas de vida; deriva da estrutura demográfica e das projeções oficiais do IBGE.',
            'research_areas':'Demography | Public health | Population studies | Public policy','keywords':'mortalidade | expectativa de vida | mortalidade infantil | idade | sexo | Brasil | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'Brasil','spatial_resolution':'nacional; resultados por sexo e idade','temporal_coverage':'ano de referência 2024; série anual','temporal_resolution':'anual','update_frequency':'anual','product_status':'ativo','version_or_collection':'2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9126-tabuascompletas-de-mortalidade','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9126-tabuas-completas-de-mortalidade.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'É um modelo demográfico nacional e não uma contagem individual de óbitos nem uma estimativa por município/UF. A metodologia está vinculada às projeções e aos dados demográficos incorporados; comparações com anos pandêmicos exigem atenção às notas técnicas específicas.','last_verified':today
          },
          {
            'product_id':'DP000227','resource_id':'DR0091','product_name':'Pesquisa de Pós-Enumeração do Censo Demográfico 2022 — análise da cobertura','product_acronym':'PPE 2022','product_family':'Avaliação de cobertura censitária','product_kind':'dataset',
            'product_description':'Pesquisa amostral probabilística realizada após o Censo 2022 para avaliar níveis e padrões de cobertura da enumeração, incluindo taxas de erro bruto, erro líquido, omissão e inclusão indevida de pessoas.',
            'research_areas':'Population studies | Survey methodology | Spatial statistics | Public policy','keywords':'pós-enumeração | Censo 2022 | cobertura censitária | omissão | inclusão indevida | erro líquido | amostragem | IBGE','geographic_coverage':'Brasil — resultados para Brasil, Grandes Regiões, Unidades da Federação e classes de Municípios por tamanho populacional','covers_brazil':'sim','spatial_support':'setores censitários amostrados | domicílios | pessoas | Unidades da Federação | agregações nacionais','spatial_resolution':'amostra de setores censitários; divulgação agregada até Unidade da Federação e classes de municípios','temporal_coverage':'noite de referência 31/07/2022–01/08/2022; coleta 22/08/2022–31/08/2023','temporal_resolution':'operação censitária/decenal','update_frequency':'decenal associada aos censos','product_status':'ativo','version_or_collection':'Censo 2022 — resultados da análise da cobertura, publicação 2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/40418-pesquisa-de-pos-enumeracao-do-censo-demografico-2022.html','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/40418-pesquisa-de-pos-enumeracao-do-censo-demografico-2022.html','primary_or_derived':'primário','limitations':'A PPE é pesquisa amostral para avaliar cobertura e qualidade do Censo, não um segundo censo nem correção registro a registro da base censitária. A população-alvo exclui determinados setores especiais; taxas publicadas devem ser interpretadas com o plano amostral e níveis de divulgação.','last_verified':today
          }
          ]

          distributions = [
          {'distribution_id':'DD000245','product_id':'DP000224','distribution_name':'Estimativas da População 2025 — tabelas oficiais','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9103-estimativas-depopulacao.html','format':'PDF | ODS | XLS','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público; distinguir tabelas publicadas no DOU das atualizadas/enviadas ao TCU','license':'licença específica dos arquivos não inferida nesta auditoria','provider_attribution_required':'sim','subset_support':'por tabela; Municípios e UFs','notes':'Os arquivos enviados ao TCU foram atualizados em 13/01/2026; registrar a variante efetivamente utilizada.','last_verified':today},
          {'distribution_id':'DD000246','product_id':'DP000225','distribution_name':'Projeções da População — revisão 2024 — tabelas','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9109-projecao-da-populacao.html?lang=pt-BR','format':'XLSX | ODS','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público por conjunto de tabelas','license':'licença específica dos arquivos não inferida nesta auditoria','provider_attribution_required':'sim','subset_support':'por Brasil/Região/UF, sexo, idade e indicador conforme tabela','notes':'As tabelas cobrem 2000–2070 e pertencem à revisão 2024; não combinar com revisões anteriores sem harmonização.','last_verified':today},
          {'distribution_id':'DD000247','product_id':'DP000226','distribution_name':'Tábuas Completas de Mortalidade 2024 — tabelas','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9126-tabuascompletas-de-mortalidade','format':'XLSX | ODS','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público por sexo','license':'licença específica dos arquivos não inferida nesta auditoria','provider_attribution_required':'sim','subset_support':'ambos os sexos | homens | mulheres; por idade','notes':'Tabelas nacionais de modelo de mortalidade; não representam microdados de óbitos nem estimativas subnacionais.','last_verified':today},
          {'distribution_id':'DD000248','product_id':'DP000227','distribution_name':'PPE Censo 2022 — resultados e metodologia da análise de cobertura','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/40418-pesquisa-de-pos-enumeracao-do-censo-demografico-2022.html','format':'publicação digital | documentação web','access_protocol':'HTTPS web','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública','license':'licença específica da publicação não inferida nesta auditoria','provider_attribution_required':'sim','subset_support':'resultados agregados conforme nível de divulgação da publicação','notes':'A divulgação apresenta taxas de cobertura e metodologia; não pressupor disponibilidade de microdados identificáveis ou correção individual do Censo.','last_verified':today}
          ]

          append_rows('data/data_resources.csv', resources, 'resource_id')
          append_rows('data/data_products.csv', products, 'product_id')
          append_rows('data/product_distributions.csv', distributions, 'distribution_id')

          p = Path('data/brazil_scope_priorities.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          p0 = next(t for t in obj['tiers'] if t['priority_tier'] == 'P0')['resource_ids']
          if 'DR0091' not in p0:
              p0.append('DR0091')
          obj['reviewed_at'] = today
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate catalog
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back counts and relations
        run: |
          python - <<'PY'
          import csv
          for path in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(path, encoding='utf-8', newline='') as f:
                  rows=list(csv.DictReader(f))
              print(path, len(rows))
          with open('data/data_products.csv', encoding='utf-8', newline='') as f:
              p={r['product_id']:r for r in csv.DictReader(f)}
          with open('data/product_distributions.csv', encoding='utf-8', newline='') as f:
              d={r['distribution_id']:r for r in csv.DictReader(f)}
          assert all(x in p for x in ['DP000224','DP000225','DP000226','DP000227'])
          assert all(x in d for x in ['DD000245','DD000246','DD000247','DD000248'])
          assert all(p[x]['resource_id']=='DR0091' for x in ['DP000224','DP000225','DP000226','DP000227'])
          assert [d[x]['product_id'] for x in ['DD000245','DD000246','DD000247','DD000248']] == ['DP000224','DP000225','DP000226','DP000227']
          print('READBACK_OK')
          PY
      - name: Commit materialized batch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/vitrine_pop_batch_139.yml
          git add data
          git commit -m 'Expand verified IBGE population and demography catalog'
          git push origin HEAD:curation/ibge-population-batch-20260816
