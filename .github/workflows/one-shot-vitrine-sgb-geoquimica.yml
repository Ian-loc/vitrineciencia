name: One-shot Vitrine SGB geochemistry expansion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vitrine-sgb-geoquimica.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified products and distributions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          product_path = Path('data/data_products.csv')
          dist_path = Path('data/product_distributions.csv')
          reviewed = '2026-08-17'

          products = [
            {
              'product_id':'DP000363','resource_id':'DR0104','product_name':'Levantamento Geoquímico Ambiental de Baixa Densidade no Brasil — SGB','product_acronym':'Geoquímica Ambiental SGB','product_family':'Geoquímica Ambiental','product_kind':'dataset_series',
              'product_description':'Programa de levantamento geoquímico ambiental de baixa densidade do SGB baseado em amostras de sedimentos ativos de corrente, águas e solos, com resultados analíticos e sínteses por estados e bacias hidrográficas.',
              'research_areas':'Geology | Geospatial data | Environmental science','keywords':'environmental geochemistry | stream sediment | water | soil | low-density survey | SGB',
              'geographic_coverage':'Brasil — cobertura concluída ou parcial por estados e bacias conforme levantamento oficial','covers_brazil':'sim','spatial_support':'pontos de amostragem | bacias de captação | produtos cartográficos derivados',
              'spatial_resolution':'amostragem de baixa densidade; drenagens representam bacias de captação de aproximadamente 100–200 km² e solos cerca de uma amostra por folha 1:50.000 (~750 km²), conforme metodologia oficial',
              'temporal_coverage':'levantamentos executados em diferentes campanhas; síntese institucional documenta avanços de 2008–2022 e incorporações posteriores','temporal_resolution':'por campanha/amostra','update_frequency':'conforme novos levantamentos e análises',
              'product_status':'ativo','version_or_collection':'programa corrente de Geoquímica Ambiental; cobertura heterogênea por levantamento','enumeration_scope':'complete',
              'product_page_url':'https://www.sgb.gov.br/produtos-geoquimica-ambiental','methodology_url':'https://www.sgb.gov.br/geoquimica-ambiental-saiba-mais','primary_or_derived':'misto',
              'limitations':'Cobertura e densidade amostral não são uniformes no território. Água, solo e sedimento são matrizes distintas; valores pontuais e por bacia não devem ser tratados como superfícies contínuas sem modelagem. Métodos laboratoriais e campanhas precisam ser preservados para comparabilidade.','last_verified':reviewed
            },
            {
              'product_id':'DP000364','resource_id':'DR0104','product_name':'Cartas de Anomalias Geofísicas, Geoquímicas e Geológicas — SGB','product_acronym':'Cartas de Anomalias SGB','product_family':'Recursos Minerais — integração prospectiva','product_kind':'map_layer_collection',
              'product_description':'Coleção de cartas em escala 1:100.000 que integra informações geofísicas, geoquímicas e geológicas processadas para destacar padrões anômalos e apoiar pesquisa mineral e planejamento de novos levantamentos.',
              'research_areas':'Geology | Geospatial data | Environmental science','keywords':'anomaly maps | geophysics | geochemistry | geology | mineral prospecting | SGB',
              'geographic_coverage':'Brasil — áreas selecionadas conforme cartas publicadas','covers_brazil':'sim','spatial_support':'mapas temáticos | dados SIG conforme carta','spatial_resolution':'escala cartográfica 1:100.000',
              'temporal_coverage':'coleção corrente; cartas publicadas por projeto e área','temporal_resolution':'por edição/carta','update_frequency':'conforme novos projetos',
              'product_status':'ativo','version_or_collection':'coleção corrente de Cartas de Anomalias','enumeration_scope':'complete',
              'product_page_url':'https://www.sgb.gov.br/carta-de-anomalias1','methodology_url':'https://www.sgb.gov.br/carta-de-anomalias1','primary_or_derived':'derivado',
              'limitations':'Anomalia é resultado de processamento integrado e não equivale a ocorrência mineral comprovada, recurso, reserva ou viabilidade econômica. A cobertura é seletiva e os insumos, métodos e limiares dependem do projeto.','last_verified':reviewed
            },
            {
              'product_id':'DP000365','resource_id':'DR0104','product_name':'Série Atlas Geoquímicos — SGB','product_acronym':'Atlas Geoquímicos SGB','product_family':'Informes de Recursos Minerais — Atlas Geoquímicos','product_kind':'catalog',
              'product_description':'Série editorial do SGB que reúne atlas geoquímicos temáticos baseados em levantamentos e análises de materiais geológicos, com edições independentes por região e objeto de estudo.',
              'research_areas':'Geology | Geospatial data | Environmental science','keywords':'geochemical atlas | stream sediments | heavy minerals | mineral resources | SGB',
              'geographic_coverage':'Brasil — áreas específicas cobertas por cada atlas','covers_brazil':'sim','spatial_support':'atlas | mapas | tabelas e resultados analíticos conforme edição','spatial_resolution':'varia por atlas, levantamento e matriz',
              'temporal_coverage':'edições publicadas conforme série; inclui Atlas Geoquímico de Carajás 2023 e Atlas de Minerais Pesados do Quadrilátero Ferrífero 2025','temporal_resolution':'por edição','update_frequency':'irregular',
              'product_status':'ativo','version_or_collection':'Série Atlas Geoquímicos — coleção corrente','enumeration_scope':'external_index',
              'product_page_url':'https://www.sgb.gov.br/serie-atlas-geoquimicos','methodology_url':'https://www.sgb.gov.br/informes-tecnicos-it-e-informes-de-recursos-minerais-irm','primary_or_derived':'agregador',
              'limitations':'Os atlas são publicações independentes e não constituem um único dataset nacional homogêneo. Matriz, densidade de amostragem, métodos analíticos, escala e objetivo variam entre edições.','last_verified':reviewed
            },
            {
              'product_id':'DP000366','resource_id':'DR0104','product_name':'Produtos de Geologia Médica e Geoquímica Ambiental — SGB','product_acronym':'Geologia Médica SGB','product_family':'Geologia Médica e Saúde Ambiental','product_kind':'catalog',
              'product_description':'Catálogo institucional de estudos do SGB que relacionam geoquímica ambiental, elementos potencialmente tóxicos ou essenciais, água e materiais geológicos a questões de exposição e saúde ambiental em áreas selecionadas.',
              'research_areas':'Geology | Environmental science | Geospatial data','keywords':'medical geology | environmental health | geochemistry | water quality | heavy metals | SGB',
              'geographic_coverage':'Brasil — estudos locais e regionais selecionados em diferentes estados','covers_brazil':'sim','spatial_support':'publicações | pontos e áreas de estudo conforme projeto','spatial_resolution':'varia por estudo e desenho de amostragem',
              'temporal_coverage':'estudos e publicações de diferentes anos; coleção institucional corrente','temporal_resolution':'por estudo/campanha','update_frequency':'irregular',
              'product_status':'ativo','version_or_collection':'catálogo corrente de produtos de Geologia Médica','enumeration_scope':'external_index',
              'product_page_url':'https://www.sgb.gov.br/produtos-geoquimica-ambiental','methodology_url':'https://www.sgb.gov.br/geoquimica-ambiental-saiba-mais','primary_or_derived':'agregador',
              'limitations':'Catálogo heterogêneo de estudos locais e regionais. Concentrações ambientais não equivalem automaticamente a dose individual, exposição humana medida, causalidade clínica ou risco sanitário; cada estudo exige leitura de matriz, amostragem e metodologia.','last_verified':reviewed
            }
          ]

          distributions = [
            {'distribution_id':'DD000384','product_id':'DP000363','distribution_name':'Geoquímica Ambiental integrada — serviço cartográfico SGB','access_url':'https://geoportal.sgb.gov.br/server/rest/services/geoquimica/geoquimica_integrada/FeatureServer','format':'JSON | GeoJSON via ArcGIS REST; camadas de água, sedimento, solo, rocha e outras matrizes','access_protocol':'HTTPS | ArcGIS REST FeatureServer','access_tool':'navegador web | SIG | cliente REST','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública do serviço; respeitar limites e paginação do endpoint','license':'não determinada especificamente para todas as camadas; citar SGB e metadados do levantamento','provider_attribution_required':'sim','subset_support':'por camada, atributos, filtros e paginação','notes':'O serviço integra múltiplas matrizes geoquímicas; preservar matriz, projeto, laboratório, método e campanha nas análises.','last_verified':reviewed},
            {'distribution_id':'DD000385','product_id':'DP000364','distribution_name':'Cartas de Anomalias — visualização e dados SGB','access_url':'https://www.sgb.gov.br/carta-de-anomalias1','format':'mapas | PDF | dados SIG conforme carta/projeto','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF | SIG','free_download':'sim','authentication_required':'não','access_conditions':'acesso público via página oficial, RIgeo e GeoSGB conforme a carta','license':'não determinada uniformemente para toda a coleção; verificar item e citar SGB','provider_attribution_required':'sim','subset_support':'por carta, área e projeto','notes':'Produtos derivados em 1:100.000; anomalias não representam confirmação de depósito mineral.','last_verified':reviewed},
            {'distribution_id':'DD000386','product_id':'DP000365','distribution_name':'Série Atlas Geoquímicos — índice oficial SGB','access_url':'https://www.sgb.gov.br/serie-atlas-geoquimicos','format':'índice web | publicações PDF por edição','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; acessar cada atlas pelo item correspondente','license':'verificar licença do item/publicação; citar autores e SGB','provider_attribution_required':'sim','subset_support':'por edição/atlas','notes':'A série reúne atlas independentes; não usar o índice como se fosse uma base analítica única.','last_verified':reviewed},
            {'distribution_id':'DD000387','product_id':'DP000366','distribution_name':'Geologia Médica e Geoquímica Ambiental — catálogo de estudos SGB','access_url':'https://www.sgb.gov.br/produtos-geoquimica-ambiental','format':'índice web | publicações e relatórios por estudo','access_protocol':'HTTPS web | download conforme item','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública da página institucional e dos itens vinculados','license':'verificar licença/citação de cada publicação; atribuir SGB e autores','provider_attribution_required':'sim','subset_support':'por estudo, região e tema','notes':'Estudos heterogêneos de geologia médica; não generalizar resultados locais nem inferir causalidade em saúde sem o desenho específico.','last_verified':reviewed}
          ]

          def read_header(path):
              with path.open('r', encoding='utf-8', newline='') as f:
                  return next(csv.reader(f))

          pfields = read_header(product_path)
          dfields = read_header(dist_path)
          assert set(products[0]) == set(pfields), (set(pfields)-set(products[0]), set(products[0])-set(pfields))
          assert set(distributions[0]) == set(dfields), (set(dfields)-set(distributions[0]), set(distributions[0])-set(dfields))

          with product_path.open('r', encoding='utf-8', newline='') as f:
              existing = list(csv.DictReader(f))
          ids = {r['product_id'] for r in existing}
          urls = {r['product_page_url'] for r in existing}
          for row in products:
              if row['product_id'] in ids: raise SystemExit(f"duplicate product id {row['product_id']}")
              if row['product_page_url'] in urls:
                  # same institutional page is allowed only for intentionally different catalog objects
                  matches=[r['product_id'] for r in existing if r['product_page_url']==row['product_page_url']]
                  if row['product_id'] not in {'DP000366'}: raise SystemExit(f"existing product_page_url {row['product_page_url']} in {matches}")
          with dist_path.open('r', encoding='utf-8', newline='') as f:
              existing_d = list(csv.DictReader(f))
          dids = {r['distribution_id'] for r in existing_d}
          for row in distributions:
              if row['distribution_id'] in dids: raise SystemExit(f"duplicate distribution id {row['distribution_id']}")

          with product_path.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=pfields, lineterminator='\n')
              for row in products: w.writerow(row)
          with dist_path.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=dfields, lineterminator='\n')
              for row in distributions: w.writerow(row)

          # relational read-back
          with product_path.open('r',encoding='utf-8',newline='') as f: pp=list(csv.DictReader(f))
          with dist_path.open('r',encoding='utf-8',newline='') as f: dd=list(csv.DictReader(f))
          assert all(any(x['product_id']==r['product_id'] and x['resource_id']=='DR0104' for x in pp) for r in products)
          assert all(any(x['distribution_id']==r['distribution_id'] and x['product_id']==r['product_id'] for x in dd) for r in distributions)
          print('appended', len(products), 'products and', len(distributions), 'distributions')
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Consolidated read-back
        run: |
          python - <<'PY'
          import csv
          def rows(p):
              with open(p,encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          r=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len(r)==104, len(r)
          assert len(p)==362, len(p)
          assert len(d)==383, len(d)
          assert {f'DP{i:06d}' for i in range(363,367)} <= {x['product_id'] for x in p}
          assert {f'DD{i:06d}' for i in range(384,388)} <= {x['distribution_id'] for x in d}
          print({'resources':len(r),'products':len(p),'distributions':len(d)})
          PY
      - name: Commit materialized catalog and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-vitrine-sgb-geoquimica.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json data/data_quality_report.json .github/workflows/one-shot-vitrine-sgb-geoquimica.yml
          git commit -m 'Expand verified SGB environmental geochemistry catalog'
          git push origin main
