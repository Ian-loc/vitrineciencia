name: Materialize verified CEMADEN catalog

on:
  push:
    paths:
      - '.github/workflows/materialize-cemaden-catalog.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append verified CEMADEN source, products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          def read(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f:
                  r=csv.DictReader(f); return list(r.fieldnames or []), list(r)
          sh,s=read('data/data_resources.csv'); ph,p=read('data/data_products.csv'); dh,d=read('data/product_distributions.csv')
          assert (len(s),len(p),len(d))==(105,372,393),(len(s),len(p),len(d))
          assert s[-1]['resource_id']=='DR0105' and p[-1]['product_id']=='DP000376' and d[-1]['distribution_id']=='DD000397'
          assert not any('CEMADEN' in (r['resource_name']+r['acronym']).upper() for r in s)
          source={
          'resource_id':'DR0106','resource_name':'Rede Observacional e Monitoramento de Riscos — CEMADEN','acronym':'CEMADEN','official_identity':'Infraestrutura observacional e de monitoramento do Centro Nacional de Monitoramento e Alertas de Desastres Naturais','description':'Infraestrutura oficial do CEMADEN/MCTI para aquisição e disseminação de dados ambientais, monitoramento de secas e apoio à análise de riscos geo-hidrológicos, incluindo redes pluviométrica, hidrológica e geotécnica.','homepage_url':'https://www.gov.br/cemaden/pt-br/','data_access_url':'https://mapainterativo.cemaden.gov.br/','research_areas':'Ciências Ambientais e Ecologia | Clima e Ciências Atmosféricas | Planejamento Territorial e Políticas Públicas | Recursos Hídricos e Oceanografia','keywords':'desastres | chuva | hidrologia | umidade do solo | seca | monitoramento | risco | CEMADEN','data_product_types':'séries observacionais | dados de estações | indicadores de seca | boletins | mapas interativos','data_formats':'CSV | XLSX | downloads mensais | visualizações web | formatos conforme produto','visualization_types':'mapa interativo | gráficos de estações | mapas temáticos | boletins','geographic_coverage':'Brasil — cobertura condicionada à rede observacional, municípios monitorados e produto temático','covers_brazil':'sim','spatial_resolution':'estações pontuais e agregações municipais/territoriais conforme produto','temporal_coverage':'séries operacionais e produtos correntes; início varia por rede e indicador','temporal_resolution':'subdiária a mensal conforme produto','data_sources':'sensores automáticos | estações hidrológicas | PCDs geotécnicas | dados meteorológicos | indicadores e bases auxiliares','free_download':'parcial','access_conditions':'consulta pública e downloads conforme produto; alguns downloads de PCDs solicitam identificação/e-mail e confirmação de segurança','programmatic_access':'desconhecido','access_protocols':'HTTPS | download via mapa interativo','authentication_required':'parcial','access_documentation_url':'https://www.gov.br/cemaden/pt-br/rede-observacional','license':'não localizada no nível da família; verificar produto e arquivo específico','institutional_status':'público','owner_or_manager':'Centro Nacional de Monitoramento e Alertas de Desastres Naturais — CEMADEN / MCTI','academic_uses':'Hidrometeorologia, riscos de desastres, chuva extrema, hidrologia, estabilidade de encostas, seca, agricultura e planejamento territorial.','limitations':'Cobertura, disponibilidade, controle de qualidade, variáveis e frequência variam entre redes e produtos. Dados brutos de sensores, indicadores derivados, previsões e alertas não são medidas intercambiáveis.','academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.gov.br/cemaden/pt-br/rede-observacional','academic_evidence_note':'O CEMADEN mantém rede observacional e Mapa Interativo com downloads diferenciados para dados pluviométricos, hidrológicos e geotécnicos, além de produtos mensais de monitoramento de seca.','verification_url':'https://mapainterativo.cemaden.gov.br/','last_verified':'2026-08-17'}
          assert set(source)==set(sh)
          products=[
          {'product_id':'DP000377','resource_id':'DR0106','product_name':'Dados dos Pluviômetros Automáticos — CEMADEN','product_acronym':'Pluviômetros CEMADEN','product_family':'Rede observacional pluviométrica','product_kind':'dataset_series','product_description':'Série de observações dos pluviômetros automáticos da Rede de Monitoramento Ambiental do CEMADEN, disponibilizada no Mapa Interativo para visualização e download por estação e período.','research_areas':'Climate science | Hydrology | Environmental monitoring | Disaster risk','keywords':'rainfall | precipitation | automatic rain gauges | stations | CEMADEN | UTC','geographic_coverage':'Brasil — municípios e locais cobertos pela rede de pluviômetros automáticos do CEMADEN','covers_brazil':'sim','spatial_support':'estações pluviométricas automáticas pontuais','spatial_resolution':'pontual por estação; representatividade espacial depende da densidade da rede e do evento','temporal_coverage':'série histórica por equipamento; período varia por data de instalação e disponibilidade','temporal_resolution':'observações automáticas subdiárias; agregações e download por período','update_frequency':'operacional/contínua conforme transmissão da estação','product_status':'ativo','version_or_collection':'rede operacional corrente; expansão 2023–2026 em andamento','enumeration_scope':'complete','product_page_url':'https://www2.cemaden.gov.br/pluviometros-automatico/','methodology_url':'https://www.gov.br/cemaden/pt-br/rede-observacional','primary_or_derived':'primário','limitations':'O próprio CEMADEN informa que os dados disponibilizados no Mapa Interativo são brutos e podem conter inconsistências. Horários são registrados em UTC; falhas de sensor/transmissão e densidade desigual da rede devem ser controladas antes da análise.','last_verified':'2026-08-17'},
          {'product_id':'DP000378','resource_id':'DR0106','product_name':'Dados das PCDs Hidrológicas — CEMADEN','product_acronym':'PCD Hidrológica CEMADEN','product_family':'Rede observacional hidrológica','product_kind':'dataset_series','product_description':'Dados hidrológicos das estações/Plataformas de Coleta de Dados do CEMADEN disponibilizados pelo Mapa Interativo em arquivos mensais por UF e, opcionalmente, município.','research_areas':'Hydrology | Water resources | Environmental monitoring | Disaster risk','keywords':'hydrological stations | PCD | rivers | monitoring | CEMADEN | UTC','geographic_coverage':'Brasil — locais cobertos pelas PCDs hidrológicas do CEMADEN','covers_brazil':'sim','spatial_support':'estações hidrológicas pontuais e corpos hídricos associados','spatial_resolution':'pontual por estação; contexto hidrológico depende do local e sistema monitorado','temporal_coverage':'séries conforme instalação e disponibilidade de cada estação','temporal_resolution':'operacional/subdiária; download mensal por recorte selecionado','update_frequency':'operacional/contínua conforme transmissão da estação','product_status':'ativo','version_or_collection':'rede operacional corrente; Mapa Interativo auditado em 2026','enumeration_scope':'complete','product_page_url':'https://mapainterativo.cemaden.gov.br/','methodology_url':'https://www.gov.br/cemaden/pt-br/rede-observacional','primary_or_derived':'primário','limitations':'Variáveis, disponibilidade e qualidade dependem da estação. O download exige seleção de UF/município, mês e ano e identificação por nome/e-mail; horários são UTC. Dado de estação não deve ser extrapolado automaticamente para toda a bacia.','last_verified':'2026-08-17'},
          {'product_id':'DP000379','resource_id':'DR0106','product_name':'Dados das PCDs Geotécnicas — RedeGeo/CEMADEN','product_acronym':'PCD Geo CEMADEN','product_family':'Monitoramento geotécnico de encostas','product_kind':'dataset_series','product_description':'Séries das Plataformas de Coleta de Dados Geotécnicas do CEMADEN que combinam pluviometria e sensores de umidade volumétrica do solo em diferentes profundidades para apoio ao monitoramento de deslizamentos.','research_areas':'Geohazards | Soil science | Environmental monitoring | Disaster risk','keywords':'soil moisture | rainfall | landslides | geotechnical stations | RedeGeo | CEMADEN','geographic_coverage':'Brasil — áreas urbanas de risco e municípios com PCDs geotécnicas instaladas','covers_brazil':'sim','spatial_support':'estações geotécnicas pontuais em encostas monitoradas','spatial_resolution':'pontual; sensores de umidade em profundidades específicas do perfil do solo conforme instalação','temporal_coverage':'séries conforme instalação e operação de cada PCD','temporal_resolution':'operacional/subdiária; visualizações e downloads por período','update_frequency':'operacional/contínua conforme transmissão da estação','product_status':'ativo','version_or_collection':'RedeGeo/PCDs geotécnicas operacionais','enumeration_scope':'complete','product_page_url':'https://www.gov.br/cemaden/pt-br/assuntos/noticias-cemaden/redegeo-e-informacoes-sobre-umidade-de-solo-das-encostas-para-prevencao-de-deslizamentos-sao-apresentadas-pelo-cemaden','methodology_url':'https://www.gov.br/cemaden/pt-br/rede-observacional','primary_or_derived':'primário','limitations':'Umidade do solo e chuva são observações locais e não equivalem diretamente a probabilidade de deslizamento. Geologia, intervenções antrópicas e outros condicionantes também afetam a estabilidade; cobertura e profundidades instrumentadas variam entre estações.','last_verified':'2026-08-17'},
          {'product_id':'DP000380','resource_id':'DR0106','product_name':'Monitoramento de Secas e Impactos no Brasil — CEMADEN','product_acronym':'IIS CEMADEN','product_family':'Monitoramento mensal de seca','product_kind':'indicator_family','product_description':'Produto mensal do CEMADEN para monitoramento de seca e impactos no Brasil, incluindo Índice Integrado de Seca (IIS), mapas e dados por município e recortes específicos.','research_areas':'Climate science | Drought | Environmental monitoring | Disaster risk','keywords':'drought | IIS | municipality | impacts | monitoring | CEMADEN','geographic_coverage':'Brasil — indicadores municipais e recortes temáticos conforme edição','covers_brazil':'sim','spatial_support':'municípios | áreas indígenas | assentamentos e outros recortes conforme edição','spatial_resolution':'municipal e demais recortes temáticos; componentes do indicador possuem resoluções próprias','temporal_coverage':'série mensal; edição mais recente materialmente verificada: junho de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'junho de 2026, publicado em 14/07/2026','enumeration_scope':'complete','product_page_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/monitoramento-de-seca-para-o-brasil','methodology_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/monitoramento-de-seca-para-o-brasil','primary_or_derived':'derivado','limitations':'IIS é indicador composto e não equivale a uma única variável meteorológica, hidrológica ou agrícola. Categorias de seca e impactos dependem de método, período e recorte; não devem ser tratadas como previsão determinística ou medida direta de perdas.','last_verified':'2026-08-17'},
          {'product_id':'DP000381','resource_id':'DR0106','product_name':'RiSAF — Risco de Seca na Agricultura Familiar','product_acronym':'RiSAF','product_family':'Risco de seca na agricultura familiar','product_kind':'indicator_family','product_description':'Produto mensal do CEMADEN que avalia risco de seca para agricultura familiar, considerando cultivos não irrigados de feijão e/ou milho, exposição ao déficit hídrico, vulnerabilidades, capacidades adaptativas municipais e calendário agrícola.','research_areas':'Climate science | Agriculture | Drought | Vulnerability | Disaster risk','keywords':'RiSAF | drought risk | family farming | maize | beans | vulnerability | CEMADEN','geographic_coverage':'Brasil — municípios e estados com calendário de plantio vigente e dados aplicáveis na edição','covers_brazil':'sim','spatial_support':'municípios e cultivos/meses de plantio considerados','spatial_resolution':'municipal; componentes de exposição e vulnerabilidade possuem bases próprias','temporal_coverage':'série mensal; edição mais recente materialmente verificada: junho de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'junho de 2026, v.6 n.69','enumeration_scope':'complete','product_page_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar','methodology_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar','primary_or_derived':'derivado','limitations':'Risco integra exposição, vulnerabilidade e capacidade adaptativa e não é sinônimo de déficit hídrico, perda observada ou quebra de safra. Aplica-se aos cultivos e calendários definidos pelo método e depende das bases socioeconômicas e climáticas utilizadas.','last_verified':'2026-08-17'}]
          assert all(set(r)==set(ph) for r in products)
          existing={r['product_page_url'].strip() for r in p}
          assert not ({r['product_page_url'] for r in products} & existing)
          dists=[
          {'distribution_id':'DD000398','product_id':'DP000377','distribution_name':'Pluviômetros automáticos — Mapa Interativo e download de séries','access_url':'https://mapainterativo.cemaden.gov.br/','format':'dados tabulares por estação/período; formato de download conforme portal','access_protocol':'HTTPS download','access_tool':'Mapa Interativo | navegador web','free_download':'sim','authentication_required':'não','access_conditions':'selecionar estação/UF/município e período; confirmação de segurança pode ser solicitada no fluxo de download','license':'não determinada especificamente para os arquivos nesta auditoria','provider_attribution_required':'sim','subset_support':'por UF, município, estação, mês e ano conforme interface','notes':'Dados pluviométricos são registrados em UTC; documentação do CEMADEN alerta que os dados do Mapa Interativo são brutos e podem conter inconsistências.','last_verified':'2026-08-17'},
          {'distribution_id':'DD000399','product_id':'DP000378','distribution_name':'PCDs hidrológicas — download mensal no Mapa Interativo','access_url':'https://mapainterativo.cemaden.gov.br/','format':'arquivo tabular mensal conforme portal','access_protocol':'HTTPS download','access_tool':'Mapa Interativo | navegador web','free_download':'sim','authentication_required':'parcial','access_conditions':'seleção de UF/município, mês e ano; fluxo documentado solicita nome, e-mail e confirmação de segurança para envio do link','license':'não determinada especificamente para os arquivos nesta auditoria','provider_attribution_required':'sim','subset_support':'por UF, município, mês e ano','notes':'Dados são registrados em UTC. Variáveis e disponibilidade devem ser verificadas no arquivo e na estação selecionados.','last_verified':'2026-08-17'},
          {'distribution_id':'DD000400','product_id':'DP000379','distribution_name':'PCDs geotécnicas — Mapa Interativo e download','access_url':'https://mapainterativo.cemaden.gov.br/','format':'séries tabulares | gráficos web','access_protocol':'HTTPS download','access_tool':'Mapa Interativo | navegador web','free_download':'sim','authentication_required':'parcial','access_conditions':'seleção de UF/município e período; fluxo de download pode solicitar identificação, e-mail e confirmação de segurança','license':'não determinada especificamente para os arquivos nesta auditoria','provider_attribution_required':'sim','subset_support':'por estação, município e período','notes':'PCDs Geo combinam chuva e umidade volumétrica do solo em profundidades instrumentadas; observações permanecem locais e registradas em UTC.','last_verified':'2026-08-17'},
          {'distribution_id':'DD000401','product_id':'DP000380','distribution_name':'IIS — dados mensais do Monitoramento de Secas','access_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/monitoramento-de-seca-para-o-brasil','format':'XLSX | mapas | boletim web','access_protocol':'HTTPS download','access_tool':'navegador web | planilha | SIG após processamento','free_download':'sim','authentication_required':'não','access_conditions':'download público por edição; preservar mês de referência, método e recorte territorial','license':'não determinada especificamente para o arquivo de dados nesta auditoria','provider_attribution_required':'sim','subset_support':'por edição; arquivo IIS por município permite filtragem local','notes':'A edição junho/2026 foi publicada em 14/07/2026 e disponibiliza IIS_Brasil_2026_06.xlsx com IIS por município.','last_verified':'2026-08-17'},
          {'distribution_id':'DD000402','product_id':'DP000381','distribution_name':'RiSAF — boletim e dados mensais','access_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar','format':'boletim | dados para download conforme edição | mapas','access_protocol':'HTTPS download','access_tool':'navegador web | planilha | SIG após processamento','free_download':'sim','authentication_required':'não','access_conditions':'download público; preservar mês de plantio, cultura, edição e componentes do risco','license':'não determinada especificamente para os arquivos nesta auditoria','provider_attribution_required':'sim','subset_support':'por edição e filtragem dos dados disponibilizados','notes':'A edição junho/2026 (v.6 n.69) foi publicada em 03/07/2026 e oferece download de boletim e dados; risco não equivale a impacto agrícola observado.','last_verified':'2026-08-17'}]
          assert all(set(r)==set(dh) for r in dists)
          def append(path,header,rows):
              with Path(path).open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=header,lineterminator='\n'); w.writerows(rows)
          append('data/data_resources.csv',sh,[source]); append('data/data_products.csv',ph,products); append('data/product_distributions.csv',dh,dists)
          reg=json.loads(Path('data/brazil_scope_priorities.json').read_text(encoding='utf-8'))
          reg['reviewed_at']='2026-08-17'; p0=next(t for t in reg['tiers'] if t['priority_tier']=='P0')['resource_ids']; assert 'DR0106' not in p0; p0.append('DR0106')
          Path('data/brazil_scope_priorities.json').write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          def r(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          s=r('data/data_resources.csv');p=r('data/data_products.csv');d=r('data/product_distributions.csv')
          assert (len(s),len(p),len(d))==(106,377,398)
          assert s[-1]['resource_id']=='DR0106'
          assert [x['product_id'] for x in p[-5:]]==[f'DP{i:06d}' for i in range(377,382)]
          assert [x['distribution_id'] for x in d[-5:]]==[f'DD{i:06d}' for i in range(398,403)]
          si={x['resource_id'] for x in s};pi={x['product_id'] for x in p}
          assert len(si)==len(s) and len(pi)==len(p) and len({x['distribution_id'] for x in d})==len(d)
          assert all(x['resource_id'] in si for x in p) and all(x['product_id'] in pi for x in d)
          print('READBACK_OK',len(s),len(p),len(d))
          PY
      - name: Commit verified batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-cemaden-catalog.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git commit -m 'Expand verified CEMADEN monitoring catalog'
          git push
