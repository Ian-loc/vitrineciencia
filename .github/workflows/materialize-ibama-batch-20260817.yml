            dict(product_id='DP000412',resource_id='DR0106',product_name='Ato Declaratório Ambiental — ADA — Ibama',product_acronym='ADA',product_family='Ato Declaratório Ambiental',product_kind='dataset_series',product_description='Informações declaradas anualmente sobre áreas de interesse ambiental em propriedades rurais registradas no formulário do Ato Declaratório Ambiental.',research_areas='Environmental management | Environmental science | Geospatial data',keywords='ADA | rural property | environmental interest area | ITR | declaration | Ibama',geographic_coverage='Brasil — imóveis rurais com ADA declarado no sistema',covers_brazil='sim',spatial_support='imóvel rural e áreas declaradas de interesse ambiental',spatial_resolution='por declaração/imóvel; geometria e área conforme campos disponíveis',temporal_coverage='série anual conforme anos disponíveis no acervo',temporal_resolution='anual por declaração',update_frequency='mensal no portal oficial',product_status='ativo',version_or_collection='conjunto corrente; metadados atualizados em 08/07/2026',enumeration_scope='complete',product_page_url='https://dadosabertos.ibama.gov.br/dataset/ato-declaratorio-ambiental-ada',methodology_url='https://dadosabertos.ibama.gov.br/dataset/ato-declaratorio-ambiental-ada',primary_or_derived='primário',limitations='ADA é declaração administrativa de áreas de interesse ambiental e não substitui cadastro fundiário, CAR, levantamento de campo ou verificação independente da condição ecológica e da proteção efetiva da área.',last_verified='2026-08-17'),
