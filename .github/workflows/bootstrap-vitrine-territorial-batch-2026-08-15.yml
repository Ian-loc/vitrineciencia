name: One-shot Vitrine territorial audit batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-vitrine-territorial-batch-2026-08-15.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified IBGE territorial products
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          resource_path = Path('data/data_resources.csv')
          product_path = Path('data/data_products.csv')
          dist_path = Path('data/product_distributions.csv')
          priority_path = Path('data/brazil_scope_priorities.json')

          def rows(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          src, ps, ds = rows(resource_path), rows(product_path), rows(dist_path)
          assert (len(src), len(ps), len(ds)) == (79, 148, 166), (len(src), len(ps), len(ds))
          assert src[-1]['resource_id'] == 'DR0079'
          assert ps[-1]['product_id'] == 'DP000148'
          assert ds[-1]['distribution_id'] == 'DD000166'

          source = ['DR0080','Mapas Municipais e Estatísticos — IBGE','Mapas Municipais IBGE','Tema institucional de mapas municipais e mapas para fins estatísticos do IBGE','Família cartográfica voltada à representação municipal, intramunicipal e censitária, incluindo a Coleção de Mapas Municipais, atualizações anuais de municípios com alterações territoriais e mapas usados nas operações estatísticas do IBGE.','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais.html','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais.html','Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação','mapas municipais | mapas estatísticos | setores censitários | divisão político-administrativa | GeoPDF | IBGE','mapas municipais | mapas para fins estatísticos | coleções cartográficas','GeoPDF | PDF | formatos cartográficos conforme edição','mapas | documentos georreferenciados','Brasil; cobertura completa ou parcial conforme produto e edição','sim','escala cartográfica varia por município, produto e edição; não inferir precisão cadastral','edições censitárias e atualizações anuais conforme produto','por edição cartográfica','Malha Municipal Digital | Base Territorial do IBGE | estruturas territoriais legais | geosserviços e dados vetoriais do IBGE','sim','downloads públicos por Unidade da Federação ou edição','não','HTTPS web | HTTP download','não','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais.html','licença específica deve ser verificada por produto/arquivo; não inferida da página temática','público','IBGE — Diretoria de Geociências','Planejamento censitário, integração territorial de estatísticas, visualização de limites municipais e intramunicipais, ensino e análises territoriais.','Os mapas têm finalidade e cobertura próprias. Atualizações anuais atingem apenas municípios com alterações; mapas estatísticos e mapas municipais não substituem malhas vetoriais nem documentos legais de limites.','documentação técnica oficial','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais.html','A página oficial distingue Coleção de Mapas Municipais e Atualização dos Mapas Municipais e documenta sua relação com a divisão político-administrativa e as operações estatísticas.','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais.html','2026-08-15']

          products = [
            ['DP000149','DR0069','Malha de Setores Censitários — Censo 2022','Malha Censitária 2022','Malhas Territoriais — Setores Censitários','dataset','Malha vetorial definitiva dos Setores Censitários do Censo Demográfico 2022, com recortes associados de Municípios, Distritos, Subdistritos e Bairros e materiais de comparabilidade com 2010.','Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação','setor censitário | malha censitária | Censo 2022 | geocódigo | bairro | distrito | subdistrito | IBGE','Brasil','sim','polígonos vetoriais de setores e demais recortes intramunicipais','compatível com escalas entre 1:5.000 e 1:250.000 conforme critérios técnicos do produto; não equivale a precisão cadastral','situação territorial do Censo 2022; descrições de limites atualizadas posteriormente em arquivos auxiliares','recorte censitário/edição','divulgação anual desde 2019; versões censitárias podem ter estágio preliminar e definitivo','ativo','2022 — Malha Censitária definitiva','complete','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais/26565-malhas-de-setores-censitarios-divisoes-intramunicipais.html','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais/26565-malhas-de-setores-censitarios-divisoes-intramunicipais.html','derivado','Setores são unidades operacionais de coleta/divulgação e podem mudar entre censos e edições. A comparabilidade 2010–2022 exige usar o histórico de formação; não assumir persistência espacial ou equivalência direta entre setores de anos distintos.','2026-08-15'],
            ['DP000150','DR0080','Coleção de Mapas Municipais — edição 2022','Mapas Municipais 2022','Mapas Municipais — coleção nacional','map_layer_collection','Coleção nacional de mapas dos municípios brasileiros, do Distrito Federal e do Distrito Estadual de Fernando de Noronha, produzida a partir da Malha Municipal Digital e das estruturas territoriais vigentes em 2022.','Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação','mapa municipal | GeoPDF | limites municipais | distritos | subdistritos | Malha Municipal Digital | IBGE','Brasil — todos os municípios, Distrito Federal e Distrito Estadual de Fernando de Noronha na edição 2022','sim','mapa municipal georreferenciado por unidade territorial','escala varia conforme o município e o enquadramento cartográfico','situação da divisão político-administrativa incorporando atualizações comunicadas ao IBGE até 31/07/2022','por edição municipal','por edição; coleção-base complementada por atualizações anuais','ativo','2022','complete','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-estatisticos/31452-colecao-de-mapas-municipais.html?lang=pt-BR','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-estatisticos/31452-colecao-de-mapas-municipais.html?lang=pt-BR','derivado','Os mapas são produtos cartográficos derivados da Malha Municipal Digital e não constituem documentos legais de definição de limites. Escala e detalhe variam entre municípios; a edição 2022 deve ser distinguida das atualizações anuais posteriores.','2026-08-15'],
            ['DP000151','DR0080','Atualização dos Mapas Municipais — edição 2025','Mapas Municipais 2025','Mapas Municipais — atualizações anuais','map_layer_collection','Conjunto de mapas municipais atualizados em 2025 apenas para municípios cujos limites sofreram alterações incorporadas à Malha Municipal Digital 2025.','Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação','mapa municipal | atualização territorial | limites municipais | divisão político-administrativa | 2025 | IBGE','Brasil — somente municípios atualizados na edição 2025; 784 municípios distribuídos em 13 UFs','parcial','mapas municipais georreferenciados por município','escala varia conforme o município e o enquadramento cartográfico','alterações encaminhadas ao IBGE entre 01/05/2024 e 30/04/2025 e incorporadas à Malha Municipal Digital 2025','por edição anual','anual para municípios com alteração territorial','ativo','2025','complete','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais/27437-atualizacao-dos-mapas-municipais.html','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais/27437-atualizacao-dos-mapas-municipais.html','derivado','A edição 2025 não cobre todos os municípios: contempla apenas os que tiveram mapas atualizados. O próprio IBGE informa finalidade ligada a coleta e tabulação estatística; não usar como substituto de documentação legal de limites ou de uma coleção nacional homogênea.','2026-08-15'],
            ['DP000152','DR0080','Mapas para Fins Estatísticos — Censo 2022','Mapas Estatísticos 2022','Mapas para Fins Estatísticos','map_layer_collection','Mapas produzidos para apoiar coleta, apuração, tabulação, análise e divulgação das operações estatísticas do IBGE, representando limites de Setores Censitários e estruturas territoriais associadas; a edição consultada inclui Mapas Urbanos Estatísticos do Censo 2022.','Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação','mapas estatísticos | Censo 2022 | setores censitários | mapas urbanos | coleta censitária | IBGE','Brasil — cobertura conforme tipo de mapa e arquivos publicados por Unidade da Federação','sim','mapas cartográficos de apoio estatístico | representação de setores censitários','escala varia por mapa e área representada','Censo Demográfico 2022; estruturas territoriais vigentes usadas na operação','por edição/operação censitária','por operação ou edição; sem periodicidade uniforme inferida','ativo','Censo 2022 — Mapas Urbanos Estatísticos','family_level','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais/27440-mapas-municipais-para-fins-estatisticos.html','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais/27440-mapas-municipais-para-fins-estatisticos.html','derivado','São instrumentos cartográficos das operações estatísticas e não equivalem à Malha de Setores Censitários vetorial. Escala, cobertura e conteúdo variam por tipo de mapa; não utilizar como definição legal autônoma de limites.','2026-08-15']
          ]

          distributions = [
            ['DD000167','DP000149','Malha de Setores Censitários 2022 — arquivos vetoriais e documentação','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/malhas-territoriais/26565-malhas-de-setores-censitarios-divisoes-intramunicipais.html','SHP | GeoPackage | KML por UF; XLSX | ODS | PDF auxiliares','HTTPS download','navegador web','sim','não','downloads públicos; arquivos nacionais e por UF conforme recorte','licença específica dos arquivos deve ser verificada no download/metadados; não inferida da página temática','sim','Brasil e por UF; recortes de setor, distrito, subdistrito e bairro conforme formato','A página oficial também publica histórico de formação 2010–2022 e notas de comparabilidade; usar esses materiais quando houver análise longitudinal.','2026-08-15'],
            ['DD000168','DP000150','Coleção de Mapas Municipais 2022 — GeoPDF por UF','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-estatisticos/31452-colecao-de-mapas-municipais.html?lang=pt-BR','GeoPDF','HTTPS download','navegador web | software SIG compatível com GeoPDF','sim','não','downloads públicos organizados por Unidade da Federação','licença específica do arquivo deve ser verificada no download; não inferida da página do produto','sim','por UF e município','Os GeoPDFs são mapas derivados e georreferenciados; registrar a edição 2022 e o município utilizado.','2026-08-15'],
            ['DD000169','DP000151','Atualização dos Mapas Municipais 2025 — arquivos por UF','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais/27437-atualizacao-dos-mapas-municipais.html','mapas cartográficos; formato conforme arquivo oficial','HTTPS download','navegador web','sim','não','downloads públicos por Unidade da Federação; apenas municípios atualizados','licença específica do arquivo deve ser verificada no download; não inferida da página do produto','sim','por UF e município atualizado','A edição 2025 contém 784 municípios atualizados, não uma nova coleção completa de todos os municípios brasileiros.','2026-08-15'],
            ['DD000170','DP000152','Mapas para Fins Estatísticos — Censo 2022 por UF','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-municipais/27440-mapas-municipais-para-fins-estatisticos.html','mapas cartográficos; formatos conforme edição','HTTPS download','navegador web','sim','não','downloads públicos por Unidade da Federação conforme edição/tipo de mapa','licença específica do arquivo deve ser verificada no download; não inferida da página do produto','sim','por UF e mapa publicado','A edição consultada disponibiliza Mapas Urbanos Estatísticos 2022; conteúdo e escala devem ser verificados no mapa efetivamente usado.','2026-08-15']
          ]

          assert source[0] not in {r['resource_id'] for r in src}
          assert not ({r[0] for r in products} & {r['product_id'] for r in ps})
          assert not ({r[0] for r in distributions} & {r['distribution_id'] for r in ds})
          existing_names = {r['product_name'].casefold() for r in ps}
          assert all(r[2].casefold() not in existing_names for r in products)

          for path, batch in [(resource_path,[source]), (product_path,products), (dist_path,distributions)]:
              with path.open('a', encoding='utf-8', newline='') as f:
                  csv.writer(f, lineterminator='\n').writerows(batch)

          registry = json.loads(priority_path.read_text(encoding='utf-8'))
          p0 = next(t for t in registry['tiers'] if t['priority_tier'] == 'P0')
          assert 'DR0080' not in p0['resource_ids']
          p0['resource_ids'].append('DR0080')
          priority_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_product_catalog.py
          python scripts/validate_brazil_scope.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Consolidated read-back
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          def read(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          src=read('data/data_resources.csv'); ps=read('data/data_products.csv'); ds=read('data/product_distributions.csv')
          sids={r['resource_id'] for r in src}; pids={r['product_id'] for r in ps}; dids={r['distribution_id'] for r in ds}
          assert (len(src),len(ps),len(ds)) == (80,152,170)
          assert len(sids)==len(src) and len(pids)==len(ps) and len(dids)==len(ds)
          assert all(r['resource_id'] in sids for r in ps)
          assert all(r['product_id'] in pids for r in ds)
          for pid in ['DP000149','DP000150','DP000151','DP000152']:
              assert pid in pids and sum(d['product_id']==pid for d in ds) == 1
          p0=next(t for t in json.loads(Path('data/brazil_scope_priorities.json').read_text(encoding='utf-8'))['tiers'] if t['priority_tier']=='P0')
          assert 'DR0080' in p0['resource_ids']
          print('sources=80 products=152 distributions=170 P0='+str(len(p0['resource_ids'])))
          PY
      - name: Commit materialized data and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bootstrap-vitrine-territorial-batch-2026-08-15.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/bootstrap-vitrine-territorial-batch-2026-08-15.yml
          git diff --cached --check
          git commit -m 'Expand IBGE census and municipal cartography catalog'
          git push origin HEAD:main
