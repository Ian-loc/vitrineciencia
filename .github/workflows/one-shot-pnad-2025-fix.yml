name: Fix one-shot PNAD catalog materialization

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-pnad-2025-fix.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse validated PNAD materializer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-pnad-2025.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i,l in enumerate(src) if "python3 - <<'PY'" in l) + 1
          end = next(i for i in range(start, len(src)) if src[i].strip() == 'PY')
          code = '\n'.join((l[10:] if l.startswith('          ') else l) for l in src[start:end]) + '\n'
          Path('/tmp/materialize_pnad.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/materialize_pnad.py

      - name: Validate and rebuild
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Commit clean materialized state
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-pnad-2025.yml .github/workflows/one-shot-pnad-2025-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Expand verified PNAD Continua 2025 catalog"
          git push origin main
