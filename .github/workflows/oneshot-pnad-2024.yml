name: One-shot materialize PNAD 2024 thematic products

on:
  push:
    branches:
      - audit-pnad-2024-20260816

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          products_path = Path('data/data_products.csv')
          distributions_path = Path('data/product_distributions.csv')

          with products_path.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              product_fields = reader.fieldnames
              existing_products = list(reader)
          with distributions_path.open(encoding='utf-8-sig', newline='') as f:
              reader = csv.DictReader(f)
              distribution_fields = reader.fieldnames
              existing_distributions = list(reader)

          product_ids = {r['product_id'] for r in existing_products}
          product_names = {r['product_name'].casefold() for r in existing_products}
          distribution_ids = {r['distribution_id'] for r in existing_distributions}

