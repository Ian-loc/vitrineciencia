name: Retry corrected SGB geology batch

on:
  push:
    paths:
      - '.github/workflows/retry-sgb-geology-next.yml'

permissions:
  contents: write

jobs:
  correct-and-retrigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct controlled vocabulary and retrigger materializer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/materialize-sgb-geology-next.yml')
          s=p.read_text(encoding='utf-8')
          old="'authentication_required':'não para consulta pública'"
          new="'authentication_required':'não'"
          if old not in s:
              raise SystemExit('expected phrase not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/retry-sgb-geology-next.yml
          git add .github/workflows/materialize-sgb-geology-next.yml
          git commit -m 'Correct SGB batch authentication vocabulary'
          git push
