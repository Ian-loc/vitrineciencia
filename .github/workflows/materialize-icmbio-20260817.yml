name: Materialize verified ICMBio geospatial catalog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-icmbio-20260817.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified products and distributions without reserializing baseline
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, pathlib, re

          products_path = pathlib.Path('data/data_products.csv')
          distributions_path = pathlib.Path('data/product_distributions.csv')

          with products_path.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              product_fields = reader.fieldnames
              products = list(reader)
          with distributions_path.open(encoding='utf-8', newline='') as f:
              reader = csv.DictReader(f)
              distribution_fields = reader.fieldnames
              distributions = list(reader)

          assert product_fields == ['product_id','resource_id','product_name','product_acronym','product_family','product_kind','product_description','research_areas','keywords','geographic_coverage','covers_brazil','spatial_support','spatial_resolution','temporal_coverage','temporal_resolution','update_frequency','product_status','version_or_collection','enumeration_scope','product_page_url','methodology_url','primary_or_derived','limitations','last_verified']
          assert distribution_fields == ['distribution_id','product_id','distribution_name','access_url','format','access_protocol','access_tool','free_download','authentication_required','access_conditions','license','provider_attribution_required','subset_support','notes','last_verified']

          def max_numeric(rows, key, prefix):
              vals=[]
              for r in rows:
                  m=re.fullmatch(re.escape(prefix)+r'(\d+)', r[key])
                  if m: vals.append(int(m.group(1)))
              return max(vals) if vals else 0

          existing_names={r['product_name'].strip().casefold(): r['product_id'] for r in products}
          next_product=max_numeric(products,'product_id','DP')
          next_distribution=max_numeric(distributions,'distribution_id','DD')

          official_geo='https://www.gov.br/icmbio/pt-br/dados-icmbio/dados_geoespaciais/mapa-tematico-e-dados-geoestatisticos-das-unidades-de-conservacao-federais/mapa-tematico-e-dados-geoestatisticos-das-unidades-de-conservacao-federais'
          rppn_page='https://www.gov.br/icmbio/pt-br/assuntos/unidades-de-conservacao/rppn'
          simrppn='https://simrppn.sisicmbio.icmbio.gov.br'
          canie_page='https://www.gov.br/icmbio/pt-br/assuntos/centros-de-pesquisa/cavernas/cadastro-nacional-de-informacoes-espeleologicas/canie'

          candidates=[
            {
              'product_name':'Reservas Particulares do Patrimônio Natural (RPPNs) Federais — limites e localização',
              'product_acronym':'RPPNs Federais — SIMRPPN',
              'product_family':'Unidades de Conservação — dados geoespaciais',
              'product_kind':'map_layer_collection',
              'product_description':'Produto geoespacial do ICMBio/SIMRPPN para consulta e download da localização e dos limites disponíveis das Reservas Particulares do Patrimônio Natural reconhecidas em âmbito federal.',
              'research_areas':'Conservation | Biodiversity | Geospatial data | Environmental science',
              'keywords':'RPPN | protected areas | private reserves | SIMRPPN | boundaries | ICMBio',
              'geographic_coverage':'Brasil — RPPNs federais registradas no SIMRPPN',
              'covers_brazil':'sim',
              'spatial_support':'polígonos de RPPNs georreferenciadas | círculos de localização aproximada para registros antigos não georreferenciados',
              'spatial_resolution':'por RPPN; precisão depende do georreferenciamento e do ato cadastral',
              'temporal_coverage':'cadastro corrente com RPPNs reconhecidas em diferentes datas',
              'temporal_resolution':'por registro/atualização cadastral',
              'update_frequency':'contínua conforme atualização do SIMRPPN',
              'product_status':'ativo',
              'version_or_collection':'SIMRPPN corrente; página geoespacial do ICMBio atualizada em 24/07/2026',
              'enumeration_scope':'complete',
              'product_page_url':rppn_page,
              'methodology_url':official_geo,
              'primary_or_derived':'misto',
              'limitations':'RPPNs antigas sem georreferenciamento podem ser representadas por círculos sobre localização aproximada, não por fronteiras exatas. Apenas registros georreferenciados devem ser interpretados como limites da RPPN; o cadastro não substitui o ato legal e documentos fundiários.',
              'last_verified':'2026-08-17',
              'distribution':{
                'distribution_name':'RPPNs Federais — SIMRPPN consulta e download',
                'access_url':simrppn,
                'format':'Shapefile | KML | visualização web',
                'access_protocol':'HTTPS / web',
                'access_tool':'SIMRPPN | navegador web | SIG',
                'free_download':'sim','authentication_required':'não',
                'access_conditions':'consulta pública e download por camada/RPPN; autenticação é necessária para funções administrativas de cadastro, não para a consulta pública',
                'license':'licença específica do arquivo não determinada; citar ICMBio/SIMRPPN',
                'provider_attribution_required':'sim','subset_support':'por RPPN/camada',
                'notes':'Não interpretar os círculos de RPPNs antigas não georreferenciadas como limites exatos; o próprio ICMBio os identifica como referência aproximada de localização.'
              }
            },
            {
              'product_name':'Áreas Embargadas — ICMBio',
              'product_acronym':'Áreas Embargadas ICMBio',
              'product_family':'Fiscalização ambiental — dados geoespaciais',
              'product_kind':'dataset_series',
              'product_description':'Base temática oficial do ICMBio com registros e localização geoespacial de áreas embargadas, disponibilizada para download tabular/geográfico e por geosserviços da INDE.',
              'research_areas':'Conservation | Geospatial data | Environmental science | Environmental management',
              'keywords':'embargo | environmental enforcement | sanctions | ICMBio | WFS | WMS | geospatial',
              'geographic_coverage':'Brasil — áreas embargadas registradas pelo ICMBio',
              'covers_brazil':'sim','spatial_support':'registros administrativos e geometrias de áreas embargadas',
              'spatial_resolution':'por registro de embargo; precisão depende da geometria e do processo de origem',
              'temporal_coverage':'registros correntes e históricos conforme base administrativa; estado publicado atualizado em 04/08/2026',
              'temporal_resolution':'por auto/embargo e atualização administrativa','update_frequency':'irregular conforme atualização administrativa',
              'product_status':'ativo','version_or_collection':'atualização publicada em 04/08/2026','enumeration_scope':'complete',
              'product_page_url':official_geo,'methodology_url':official_geo,'primary_or_derived':'primário',
              'limitations':'Embargo é medida administrativa e sua presença/localização não equivale à magnitude de dano ambiental, cobertura do solo observada ou decisão judicial definitiva. Situação processual e geometria podem ser atualizadas; usar a versão e os atributos do registro.',
              'last_verified':'2026-08-17',
              'distribution':{
                'distribution_name':'Áreas Embargadas ICMBio — downloads e geosserviços',
                'access_url':official_geo,'format':'XLSX | KML | SHP | WFS/WMS','access_protocol':'HTTPS download | OGC WFS/WMS','access_tool':'navegador web | software SIG',
                'free_download':'sim','authentication_required':'não','access_conditions':'download direto pela página oficial ou consumo pelos geosserviços ICMBio/INDE',
                'license':'licença específica dos arquivos não determinada; atribuição ao ICMBio recomendada','provider_attribution_required':'sim','subset_support':'arquivo nacional; consulta por camada via WFS/WMS',
                'notes':'A página oficial marca a base como atualizada em 04/08/2026 e disponibiliza XLSX, KML e SHP; os geosserviços WFS/WMS expõem a camada para SIG.'
              }
            },
            {
              'product_name':'Autos de Infração — ICMBio',
              'product_acronym':'Autos de Infração ICMBio',
              'product_family':'Fiscalização ambiental — dados geoespaciais',
              'product_kind':'dataset_series',
              'product_description':'Base temática oficial do ICMBio com registros de autos de infração e sua representação geoespacial, disponibilizada para download tabular/geográfico e por geosserviços da INDE.',
              'research_areas':'Conservation | Geospatial data | Environmental science | Environmental management',
              'keywords':'environmental infractions | enforcement | administrative records | ICMBio | WFS | WMS | geospatial',
              'geographic_coverage':'Brasil — autos de infração registrados pelo ICMBio','covers_brazil':'sim',
              'spatial_support':'registros administrativos georreferenciados; geometria conforme registro','spatial_resolution':'por auto/registro; precisão depende da informação espacial de origem',
              'temporal_coverage':'registros correntes e históricos conforme base administrativa; estado publicado atualizado em 04/08/2026','temporal_resolution':'por auto e atualização administrativa','update_frequency':'irregular conforme atualização administrativa',
              'product_status':'ativo','version_or_collection':'atualização publicada em 04/08/2026','enumeration_scope':'complete',
              'product_page_url':official_geo,'methodology_url':official_geo,'primary_or_derived':'primário',
              'limitations':'Auto de infração é registro administrativo de fiscalização e não deve ser interpretado isoladamente como decisão final de responsabilidade, censo completo de infrações ambientais ou medida direta de impacto ecológico. Situação processual, atributos e localização podem ser atualizados.',
              'last_verified':'2026-08-17',
              'distribution':{
                'distribution_name':'Autos de Infração ICMBio — downloads e geosserviços','access_url':official_geo,'format':'XLSX | KML | SHP | WFS/WMS','access_protocol':'HTTPS download | OGC WFS/WMS','access_tool':'navegador web | software SIG',
                'free_download':'sim','authentication_required':'não','access_conditions':'download direto pela página oficial ou consumo pelos geosserviços ICMBio/INDE','license':'licença específica dos arquivos não determinada; atribuição ao ICMBio recomendada','provider_attribution_required':'sim','subset_support':'arquivo nacional; consulta por camada via WFS/WMS',
                'notes':'A página oficial marca a base como atualizada em 04/08/2026 e disponibiliza XLSX, KML e SHP; os geosserviços WFS/WMS expõem a camada para SIG.'
              }
            },
            {
              'product_name':'CANIE — Cadastro Nacional de Informações Espeleológicas',
              'product_acronym':'CANIE',
              'product_family':'Patrimônio espeleológico e cavidades naturais subterrâneas',
              'product_kind':'data_service',
              'product_description':'Sistema nacional do ICMBio/CECAV, integrante do SINIMA, que congrega informações geoespaciais e cadastrais conhecidas sobre o patrimônio espeleológico brasileiro provenientes de múltiplas fontes e processos de validação.',
              'research_areas':'Geology | Geospatial data | Environmental science | Conservation',
              'keywords':'caves | speleology | CANIE | CECAV | karst | geospatial | cave inventory',
              'geographic_coverage':'Brasil — cavidades naturais subterrâneas cadastradas no CANIE','covers_brazil':'sim',
              'spatial_support':'pontos de entrada/localização de cavidades e atributos cadastrais; mapas associados conforme registro','spatial_resolution':'pontual; precisão varia segundo os níveis de validação do CANIE',
              'temporal_coverage':'cadastro corrente formado por registros históricos e novas incorporações','temporal_resolution':'por registro e atualização cadastral','update_frequency':'contínua/periodicamente conforme inserção, correção e validação de registros',
              'product_status':'ativo','version_or_collection':'CANIE corrente; sistema nacional instituído pela Resolução CONAMA 347/2004','enumeration_scope':'complete',
              'product_page_url':canie_page,'methodology_url':canie_page,'primary_or_derived':'misto',
              'limitations':'O CANIE reúne somente cavidades conhecidas, prospectadas e cadastradas e não representa todo o universo de cavernas do Brasil. Registros podem ser inseridos, corrigidos ou excluídos; a precisão espacial varia entre três níveis de validação e o uso não substitui análise técnica do SISNAMA.',
              'last_verified':'2026-08-17',
              'distribution':{
                'distribution_name':'CANIE — sistema e dados geoespaciais','access_url':canie_page,'format':'sistema web | Shapefile | KMZ','access_protocol':'HTTPS / web download','access_tool':'CANIE | navegador web | software SIG',
                'free_download':'sim','authentication_required':'não','access_conditions':'consulta e downloads públicos; cadastro/autenticação aplicam-se a inserção e edição de informações','license':'reutilização indicada pela página com citação da fonte CANIE; licença padronizada específica não identificada','provider_attribution_required':'sim','subset_support':'consulta por registro; arquivos conforme disponibilização do CECAV',
                'notes':'A documentação explicita SIRGAS2000 para coordenadas validadas e três níveis de validação. Os arquivos estáticos citados na página têm data de incorporação própria e não devem ser confundidos com o estado corrente do sistema.'
              }
            }
          ]

          appended_products=[]
          product_id_by_name=dict(existing_names)
          for c in candidates:
              key=c['product_name'].strip().casefold()
              if key in product_id_by_name:
                  print('SKIP existing product:', c['product_name'], product_id_by_name[key])
                  continue
              next_product += 1
              pid=f'DP{next_product:06d}'
              row={k:'' for k in product_fields}
              row.update({k:v for k,v in c.items() if k in product_fields})
              row['product_id']=pid; row['resource_id']='DR0105'
              appended_products.append(row)
              product_id_by_name[key]=pid

          if appended_products:
              with products_path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=product_fields,lineterminator='\n')
                  for r in appended_products: w.writerow(r)

          existing_dist={(r['product_id'],r['distribution_name'].strip().casefold()) for r in distributions}
          appended_distributions=[]
          cand_by_name={c['product_name'].strip().casefold(): c for c in candidates}
          for name_key,pid in product_id_by_name.items():
              if name_key not in cand_by_name: continue
              d=cand_by_name[name_key]['distribution']
              dk=(pid,d['distribution_name'].strip().casefold())
              if dk in existing_dist:
                  print('SKIP existing distribution:', pid, d['distribution_name'])
                  continue
              next_distribution += 1
              row={k:'' for k in distribution_fields}
              row.update(d)
              row['distribution_id']=f'DD{next_distribution:06d}'; row['product_id']=pid; row['last_verified']='2026-08-17'
              appended_distributions.append(row)
              existing_dist.add(dk)

          if appended_distributions:
              with distributions_path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=distribution_fields,lineterminator='\n')
                  for r in appended_distributions: w.writerow(r)

          print('APPENDED_PRODUCTS', [(r['product_id'],r['product_name']) for r in appended_products])
          print('APPENDED_DISTRIBUTIONS', [(r['distribution_id'],r['product_id'],r['distribution_name']) for r in appended_distributions])
          if not appended_products and not appended_distributions:
              print('No material changes needed; all candidates already present.')
          PY
      - name: Validate canonical catalog and build derived artifacts
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity and counts
        shell: bash
        run: |
          python - <<'PY'
          import csv, re
          with open('data/data_resources.csv',encoding='utf-8',newline='') as f: resources=list(csv.DictReader(f))
          with open('data/data_products.csv',encoding='utf-8',newline='') as f: products=list(csv.DictReader(f))
          with open('data/product_distributions.csv',encoding='utf-8',newline='') as f: dists=list(csv.DictReader(f))
          rids=[r['resource_id'] for r in resources]; pids=[r['product_id'] for r in products]; dids=[r['distribution_id'] for r in dists]
          assert len(rids)==len(set(rids)); assert len(pids)==len(set(pids)); assert len(dids)==len(set(dids))
          rs=set(rids); ps=set(pids)
          assert all(p['resource_id'] in rs for p in products)
          assert all(d['product_id'] in ps for d in dists)
          names=[p['product_name'].strip().casefold() for p in products]
          targets=['reservas particulares do patrimônio natural (rppns) federais — limites e localização','áreas embargadas — icmbio','autos de infração — icmbio','canie — cadastro nacional de informações espeleológicas']
          for t in targets:
              assert names.count(t)==1, (t,names.count(t))
          target_ids={p['product_id'] for p in products if p['product_name'].strip().casefold() in targets}
          assert all(sum(1 for d in dists if d['product_id']==pid)>=1 for pid in target_ids)
          print(f'COUNTS resources={len(resources)} products={len(products)} distributions={len(dists)}')
          print('TARGET_IDS', sorted(target_ids))
          PY
      - name: Commit materialized data and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          git rm .github/workflows/materialize-icmbio-20260817.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "Expand verified ICMBio geospatial catalog"
          git push origin HEAD:main
