name: One-shot derived artifact refresh 2026-08-18

on:
  push:
    paths:
      - '.github/workflows/tmp-refresh-derived-20260818.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and validate canonical derivatives
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv, json
          with open('data/data_resources.csv',encoding='utf-8',newline='') as f: r=list(csv.DictReader(f))
          with open('data/data_products.csv',encoding='utf-8',newline='') as f: p=list(csv.DictReader(f))
          with open('data/product_distributions.csv',encoding='utf-8',newline='') as f: d=list(csv.DictReader(f))
          q=json.load(open('data/data_quality_report.json',encoding='utf-8'))
          b=json.load(open('data/build-meta.json',encoding='utf-8'))
          assert q['records']==len(r), (q['records'],len(r))
          assert b['records']==len(r) and b['products']==len(p) and b['distributions']==len(d), b
          print('COUNTS',len(r),len(p),len(d))
          PY
      - name: Commit regenerated derived artifacts
        shell: bash
        run: |
          git config user.name 'Vitrine Ciência Curator'
          git config user.email 'actions@users.noreply.github.com'
          git add data/data_resources.json data/data_products.json data/data_quality_report.json data/build-meta.json data/link_role_audit.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No derived changes required'
            exit 0
          fi
          git commit -m 'Refresh canonical derived catalog artifacts'
          git push origin HEAD:main
