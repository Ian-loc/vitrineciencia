          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          r,p,d=rows('data/data_resources.csv'),rows('data/data_products.csv'),rows('data/product_distributions.csv')
          assert (len(r),len(p),len(d))==(94,269,290), (len(r),len(p),len(d))
          rids={x['resource_id'] for x in r}; pids={x['product_id'] for x in p}
          assert all(x['resource_id'] in rids for x in p)
          assert all(x['product_id'] in pids for x in d)
          assert len(rids)==len(r) and len(pids)==len(p) and len({x['distribution_id'] for x in d})==len(d)
          print('READBACK_OK', len(r), len(p), len(d))
          PY
      - name: Commit materialized batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/curate-pof-batch.yml
          git add -A
          git status --short
          git commit -m 'Expand verified IBGE POF catalog'
          git push origin main
