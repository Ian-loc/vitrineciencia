name: Capturar QA visual da Vitrine publicada

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-ui-visual-qa.yml"
      - "index.html"
      - "products.html"
      - "sources.html"
      - "analytics.html"
      - "about.html"
      - "assets/**"
      - "data/**"
      - "schema/public-discovery-v0.1.json"
      - "scripts/build_catalog.py"
      - "scripts/build_public_discovery.py"
      - "scripts/build_site_artifact.py"
      - "scripts/validate_vitrine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Preparar versão candidata
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          python3 -m http.server 8000 --directory _site > /tmp/vitrine-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vitrine-http.log
          exit 1

      - name: Instalar navegador de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar navegação, descoberta, comparação e responsividade
        env:
          CANDIDATE_URL: http://127.0.0.1:8000/
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const base = process.env.CANDIDATE_URL;
          const pages = [
            ['home', ''], ['products', 'products.html'], ['sources', 'sources.html'],
            ['about', 'about.html'], ['catalog-overview', 'analytics.html'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1100 }],
            ['tablet', { width: 820, height: 1180 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failed = false;

            for (const [mode, viewport] of viewports) {
              const context = await browser.newContext({ viewport });
              for (const [name, path] of pages) {
                const page = await context.newPage();
                const url = base + path;
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
                if (!response || !response.ok()) { console.error(`HTTP inválido: ${url}`); failed = true; await page.close(); continue; }
                if (name === 'products') await page.waitForSelector('#product-list .product-card');
                if (name === 'sources') await page.waitForSelector('#list .card');
                await page.screenshot({ path: `visual-qa/${mode}-${name}.png`, fullPage: true });

                const metrics = await page.evaluate(() => ({
                  title: document.title, viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  h1: (document.querySelector('h1')?.textContent || '').trim(),
                  hasMain: Boolean(document.querySelector('main')),
                  navToggleVisible: Boolean(document.querySelector('.nav-toggle') && getComputedStyle(document.querySelector('.nav-toggle')).display !== 'none'),
                  fullCatalogCsvLinks: document.querySelectorAll('a[href*="data_resources.csv"],a[href*="data_products.csv"],a[href*="product_distributions.csv"]').length,
                }));
                report.push({mode, page:name, ...metrics});
                if (!metrics.hasMain || !metrics.h1) failed = true;
                if (metrics.documentWidth > metrics.viewportWidth + 2) { console.error(`Overflow horizontal: ${mode}/${name}`); failed = true; }
                if (metrics.fullCatalogCsvLinks !== 0) { console.error(`CSV integral exposto em ${mode}/${name}`); failed = true; }

                if (mode !== 'desktop') {
                  const toggle = page.locator('.nav-toggle');
                  if (!await toggle.isVisible()) { console.error(`Menu responsivo ausente em ${mode}/${name}`); failed = true; }
                  else {
                    await toggle.click();
                    const visibleLinks = await page.locator('#site-nav-links a:visible').count();
                    if (visibleLinks < 4) { console.error(`Navegação responsiva incompleta em ${mode}/${name}: ${visibleLinks}`); failed = true; }
                    await toggle.click();
                  }
                }

                if (name === 'home') {
                  const action = await page.locator('.home-search').getAttribute('action');
                  if (action !== 'products.html') { console.error(`Busca inicial não aponta para produtos: ${action}`); failed = true; }
                  const products = Number((await page.locator('#home-products').textContent()).trim());
                  const sources = Number((await page.locator('#home-sources').textContent()).trim());
                  if (!(products === 843 && products > sources && sources === 135)) { console.error(`Resumo inicial incoerente: produtos=${products}, fontes=${sources}`); failed = true; }
                  const areaCards = page.locator('#home-product-areas .product-area-card');
                  if (await areaCards.count() !== 6) { console.error(`Exploração temática deve ter 6 áreas de produtos`); failed = true; }
                  const areaTexts = await areaCards.locator('[data-area-count]').allTextContents();
                  if (areaTexts.some(text => !/\d+ produtos?/.test(text) || /^0\s/.test(text))) { console.error(`Contagens temáticas de produtos inválidas: ${areaTexts.join(' | ')}`); failed = true; }
                }

                if (name === 'products') {
                  const cards = page.locator('#product-list .product-card');
                  if (await cards.count() !== 18) { console.error(`Lote inicial deve exibir 18 produtos em ${mode}: ${await cards.count()}`); failed = true; }
                  const triage = page.locator('#product-list .triage-strip > div');
                  if (await triage.count() !== 72) { console.error(`Onde/Quando/Escala/Acesso incompleto em ${mode}: ${await triage.count()}`); failed = true; }
                  const requiredFilters = ['#product-theme','#product-coverage','#product-year-start','#product-year-end','#product-temporal','#product-support','#product-spatial','#product-access','#product-format','#product-free','#product-license'];
                  for (const selector of requiredFilters) if (!await page.locator(selector).count()) { console.error(`Filtro científico ausente: ${selector}`); failed = true; }

                  await page.locator('#product-q').fill('carbono solo Cerrado Brasil 2000 30 m');
                  await page.waitForTimeout(180);
                  if (!await page.locator('#interpreted-query').isVisible()) { console.error(`Interpretação leve da consulta não apareceu em ${mode}`); failed = true; }
                  const interpreted = await page.locator('#interpreted-query').textContent();
                  for (const token of ['Carbono','Solos','Cerrado','Brasil','2000','30 m']) if (!interpreted.includes(token)) { console.error(`Interpretação não reconheceu ${token}: ${interpreted}`); failed = true; }
                  await page.locator('#product-clear').click();
                  await page.waitForSelector('#product-list .product-card');

                  const compareInputs = page.locator('[data-compare]');
                  if (await compareInputs.count() < 3) { console.error(`Produtos insuficientes para comparar em ${mode}`); failed = true; }
                  else {
                    const selectedNames = [];
                    for (let i=0;i<3;i++) {
                      selectedNames.push((await cards.nth(i).locator('h3').textContent()).trim());
                      await compareInputs.nth(i).check();
                    }
                    if ((await page.locator('#compare-count').textContent()).trim() !== '3 produtos selecionados') { console.error(`Barra de comparação não reflete 3 seleções em ${mode}`); failed = true; }
                    await page.locator('#compare-open').click();
                    await page.locator('#compare-dialog[open]').waitFor({state:'visible'});
                    const headers = (await page.locator('#compare-content thead th').allTextContents()).slice(1).map(x => x.replace(/Remover/g,'').trim());
                    if (headers.length !== 3 || !selectedNames.every(name => headers.includes(name))) { console.error(`Comparação contém produtos diferentes da seleção em ${mode}: ${headers.join(' | ')}`); failed = true; }
                    if (await page.locator('#compare-content [data-remove-compare]').count() !== 3) { console.error(`Remoção interna ausente em ${mode}`); failed = true; }
                    if (!await page.locator('#compare-download-csv').isVisible()) { console.error(`CSV da comparação ausente em ${mode}`); failed = true; }

                    await page.locator('#compare-content [data-remove-compare]').first().click();
                    await page.waitForTimeout(80);
                    if (await page.locator('#compare-content [data-remove-compare]').count() !== 2) { console.error(`Remoção não atualizou comparação em ${mode}`); failed = true; }
                    if (await page.locator('[data-compare]:checked').count() !== 2) { console.error(`Checkboxes incoerentes após remoção em ${mode}`); failed = true; }

                    await page.locator('#compare-close').click();
                    await page.waitForTimeout(80);
                    if (await page.locator('[data-compare]:checked').count() !== 0 || await page.locator('#compare-bar').isVisible()) { console.error(`Seleção não reiniciou ao fechar em ${mode}`); failed = true; }
                  }

                  await page.locator('#product-show-more').click();
                  if (await page.locator('#product-list .product-card').count() !== 36) { console.error(`Segundo lote deve chegar a 36 produtos em ${mode}`); failed = true; }
                }

                if (name === 'sources') {
                  const sourceCards = await page.locator('#list .card').count();
                  if (sourceCards !== 12) { console.error(`Lote inicial de fontes inválido em ${mode}: ${sourceCards}`); failed = true; }
                }
                await page.close();
              }
              await context.close();
            }

            await browser.close();
            fs.writeFileSync('visual-qa/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failed) process.exit(1);
          })();
          NODE

      - name: Publicar evidência visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrine-public-ui-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 14
