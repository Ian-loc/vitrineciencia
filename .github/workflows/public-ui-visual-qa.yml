name: Capturar QA visual da Vitrine publicada

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-ui-visual-qa.yml"
      - "index.html"
      - "products.html"
      - "analytics.html"
      - "about.html"
      - "assets/**"
      - "data/**"
      - "schema/public-discovery-v0.1.json"
      - "scripts/build_catalog.py"
      - "scripts/build_public_discovery.py"
      - "scripts/build_site_artifact.py"
      - "scripts/validate_vitrine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Preparar versão candidata
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          python3 -m http.server 8000 --directory _site > /tmp/vitrine-http.log 2>&1 &
          echo $! > /tmp/vitrine-http.pid
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vitrine-http.log
          exit 1

      - name: Instalar navegador de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capturar publicada e candidata e validar layout
        env:
          LIVE_URL: https://ian-loc.github.io/vitrineciencia/
          CANDIDATE_URL: http://127.0.0.1:8000/
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          // A candidata é o objeto sob teste e deve bloquear o PR quando falhar.
          // A versão publicada é apenas evidência comparativa best-effort: indisponibilidade
          // externa do GitHub Pages não deve tornar um PR localmente correto impossível de validar.
          const targets = [
            ['live', process.env.LIVE_URL, false],
            ['candidate', process.env.CANDIDATE_URL, true],
          ];
          const pages = [
            ['home', ''],
            ['products', 'products.html'],
            ['catalog-overview', 'analytics.html'],
            ['method', 'about.html'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1100 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failed = false;

            for (const [target, base, strict] of targets) {
              for (const [mode, viewport] of viewports) {
                const context = await browser.newContext({ viewport });
                for (const [name, path] of pages) {
                  const page = await context.newPage();
                  const url = base + path;
                  let response;
                  try {
                    response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
                  } catch (error) {
                    console.error(`Falha de navegação: ${url}: ${error.message}`);
                    if (strict) failed = true;
                    report.push({target, mode, page: name, url, unavailable: true, error: error.message});
                    await page.close();
                    continue;
                  }
                  if (!response || !response.ok()) {
                    console.error(`HTTP inválido: ${url} -> ${response && response.status()}`);
                    if (strict) failed = true;
                    report.push({target, mode, page: name, url, unavailable: true, httpStatus: response && response.status()});
                    await page.close();
                    continue;
                  }

                  if (name === 'home') await page.waitForSelector('#list .card');
                  if (name === 'products') await page.waitForSelector('#product-list .card');
                  await page.screenshot({ path: `visual-qa/${target}-${mode}-${name}.png`, fullPage: true });
                  const metrics = await page.evaluate(() => {
                    const links = [...document.querySelectorAll('.nav-links a')];
                    const visibleNav = links.filter((el) => getComputedStyle(el).display !== 'none').map((el) => (el.textContent || '').trim());
                    const areaGrid = document.querySelector('#area-links');
                    const sourceShowMore = document.querySelector('#show-more');
                    const productShowMore = document.querySelector('#product-show-more');
                    const productArea = document.querySelector('#product-area');
                    return {
                      title: document.title,
                      viewportWidth: window.innerWidth,
                      documentWidth: document.documentElement.scrollWidth,
                      documentHeight: document.documentElement.scrollHeight,
                      visibleNav,
                      h1: (document.querySelector('h1')?.textContent || '').trim(),
                      hasMain: Boolean(document.querySelector('main')),
                      sourceCards: document.querySelectorAll('#list .card').length,
                      productCards: document.querySelectorAll('#product-list .card').length,
                      sourceShowMoreVisible: Boolean(sourceShowMore && !sourceShowMore.closest('[hidden]')),
                      productShowMoreVisible: Boolean(productShowMore && !productShowMore.closest('[hidden]')),
                      areaDisplay: areaGrid ? getComputedStyle(areaGrid).display : null,
                      areaClientWidth: areaGrid?.clientWidth || 0,
                      areaScrollWidth: areaGrid?.scrollWidth || 0,
                      areaCards: document.querySelectorAll('#area-links .area-card').length,
                      productAreaOptions: productArea ? Math.max(0, productArea.options.length - 1) : 0,
                      fullCatalogCsvLinks: document.querySelectorAll('a[href*="data_resources.csv"],a[href*="data_products.csv"],a[href*="product_distributions.csv"]').length,
                    };
                  });
                  Object.assign(metrics, {target, mode, page: name, url});
                  report.push(metrics);

                  if (strict && (!metrics.hasMain || !metrics.h1)) failed = true;
                  if (strict && metrics.documentWidth > metrics.viewportWidth + 2) {
                    console.error(`Overflow horizontal: ${target}/${mode}/${name}: ${metrics.documentWidth} > ${metrics.viewportWidth}`);
                    failed = true;
                  }
                  if (strict && mode === 'mobile' && metrics.visibleNav.length < 5) {
                    console.error(`Navegação mobile incompleta em ${target}/${name}: ${metrics.visibleNav.join(' | ')}`);
                    failed = true;
                  }

                  if (target === 'candidate' && metrics.fullCatalogCsvLinks !== 0) {
                    console.error(`Link de CSV integral exposto em ${mode}/${name}: ${metrics.fullCatalogCsvLinks}`);
                    failed = true;
                  }

                  if (target === 'candidate' && name === 'home') {
                    if (metrics.areaCards !== 6) {
                      console.error(`Taxonomia pública deve ter 6 áreas; encontradas ${metrics.areaCards} em ${mode}.`);
                      failed = true;
                    }
                    if (metrics.sourceCards !== 12 || !metrics.sourceShowMoreVisible) {
                      console.error(`Divulgação progressiva de fontes inválida: ${mode}: cards=${metrics.sourceCards}, showMore=${metrics.sourceShowMoreVisible}`);
                      failed = true;
                    }
                    if (mode === 'mobile' && (metrics.areaDisplay !== 'flex' || metrics.areaScrollWidth <= metrics.areaClientWidth)) {
                      console.error(`Faixa temática mobile inválida: display=${metrics.areaDisplay}, ${metrics.areaScrollWidth} <= ${metrics.areaClientWidth}`);
                      failed = true;
                    }

                    const sourceDownloads = page.locator('[data-download-source]');
                    const sourceSelectors = page.locator('[data-select-source]');
                    if (await sourceDownloads.count() !== metrics.sourceCards || await sourceSelectors.count() !== metrics.sourceCards) {
                      console.error(`Controles de seleção/exportação de fontes incompletos em ${mode}.`);
                      failed = true;
                    } else {
                      await sourceSelectors.nth(0).check();
                      if (!await page.locator('#source-export-bar').isVisible()) {
                        console.error(`Barra de seleção de fontes não apareceu em ${mode}.`);
                        failed = true;
                      }

                      const sourceCompare = page.locator('#source-compare-open');
                      await sourceCompare.waitFor({state: 'attached', timeout: 5000});
                      if (!await sourceCompare.isDisabled()) {
                        console.error(`Comparação de fontes deve exigir pelo menos duas seleções em ${mode}.`);
                        failed = true;
                      }

                      await sourceSelectors.nth(1).check();
                      if (!await sourceCompare.isEnabled()) {
                        console.error(`Comparação de fontes não foi habilitada com duas seleções em ${mode}.`);
                        failed = true;
                      } else {
                        await sourceCompare.click();
                        await page.locator('#source-compare-dialog[open]').waitFor({state: 'visible'});
                        const sourceLabels = await page.locator('#source-compare-content th[scope="row"]').allTextContents();
                        const requiredSourceLabels = ['Cobertura geográfica', 'Resolução espacial', 'Cobertura temporal', 'Resolução temporal', 'Limitações'];
                        if (!requiredSourceLabels.every((label) => sourceLabels.includes(label))) {
                          console.error(`Dimensões da comparação de fontes incompletas em ${mode}: ${sourceLabels.join(' | ')}`);
                          failed = true;
                        }
                        if (!await page.locator('#source-compare-download').isVisible()) {
                          console.error(`Download da comparação de fontes não está disponível em ${mode}.`);
                          failed = true;
                        }
                        await page.locator('#source-compare-close').click();
                      }
                      await page.locator('#source-export-clear').click();
                    }

                    await page.locator('#show-more').click();
                    const expanded = await page.locator('#list .card').count();
                    if (expanded !== 24) {
                      console.error(`Expansão de fontes inválida: ${mode}: ${expanded} cards após clique`);
                      failed = true;
                    }
                  }

                  if (target === 'candidate' && name === 'products') {
                    if (metrics.productAreaOptions !== 6) {
                      console.error(`Filtro de produtos deve ter 6 áreas amplas; encontradas ${metrics.productAreaOptions} em ${mode}.`);
                      failed = true;
                    }
                    if (metrics.productCards !== 6 || !metrics.productShowMoreVisible) {
                      console.error(`Divulgação progressiva de produtos inválida: ${mode}: cards=${metrics.productCards}, showMore=${metrics.productShowMoreVisible}`);
                      failed = true;
                    }

                    const compareInputs = page.locator('[data-compare]');
                    if (await compareInputs.count() >= 2) {
                      await compareInputs.nth(0).check();
                      await compareInputs.nth(1).check();
                      await page.locator('#compare-open').click();
                      await page.locator('#compare-dialog[open]').waitFor({state: 'visible'});
                      // products.js opens the dialog synchronously and export-selective.js
                      // enriches the table on the next task. Wait for the intended normalized
                      // comparison rows instead of racing the two handlers on fast runners.
                      await page.waitForFunction(() => {
                        const labels = [...document.querySelectorAll('#compare-content th[scope="row"]')]
                          .map((el) => (el.textContent || '').trim());
                        return ['Suporte espacial', 'Resolução espacial', 'Cobertura temporal', 'Resolução temporal']
                          .every((label) => labels.includes(label));
                      }, {timeout: 5000});
                      const labels = await page.locator('#compare-content th[scope="row"]').allTextContents();
                      if (!labels.includes('Suporte espacial') || !labels.includes('Resolução espacial') || !labels.includes('Cobertura temporal') || !labels.includes('Resolução temporal')) {
                        console.error(`Dimensões da comparação não estão separadas em ${mode}: ${labels.join(' | ')}`);
                        failed = true;
                      }
                      if (!await page.locator('#compare-download-csv').isVisible()) {
                        console.error(`Download da comparação não está disponível em ${mode}.`);
                        failed = true;
                      }
                      await page.locator('#compare-close').click();
                    } else {
                      console.error(`Produtos insuficientes para testar comparação em ${mode}.`);
                      failed = true;
                    }

                    await page.locator('#product-show-more').click();
                    const expanded = await page.locator('#product-list .card').count();
                    if (expanded <= metrics.productCards) {
                      console.error(`Expansão de produtos inválida: ${mode}: ${expanded} cards após clique; inicial=${metrics.productCards}`);
                      failed = true;
                    }
                  }

                  await page.close();
                }
                await context.close();
              }
            }

            await browser.close();
            fs.writeFileSync('visual-qa/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failed) process.exit(1);
          })();
          NODE

      - name: Publicar evidência visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrine-public-ui-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 14
