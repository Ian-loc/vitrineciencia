name: Capturar QA visual da Vitrine publicada

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-ui-visual-qa.yml"
      - "index.html"
      - "products.html"
      - "products-list.html"
      - "sources.html"
      - "analytics.html"
      - "about.html"
      - "assets/**"
      - "data/**"
      - "scripts/build_catalog.py"
      - "scripts/build_public_discovery.py"
      - "scripts/build_site_artifact.py"
      - "scripts/build_record_pages.py"
      - "scripts/build_public_records_v2.py"
      - "scripts/build_record_pages_v2.py"
      - "scripts/validate_record_pages.py"
      - "scripts/validate_public_records_v2.py"
      - "scripts/validate_vitrine.py"
      - "schema/public-record-v1.json"
      - "schema/public-record-v2.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-ui-visual-qa.yml"
      - "index.html"
      - "products.html"
      - "products-list.html"
      - "sources.html"
      - "analytics.html"
      - "about.html"
      - "assets/**"
      - "data/**"
      - "scripts/build_catalog.py"
      - "scripts/build_public_discovery.py"
      - "scripts/build_site_artifact.py"
      - "scripts/build_record_pages.py"
      - "scripts/validate_record_pages.py"
      - "scripts/validate_vitrine.py"
      - "schema/public-record-v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Preparar versão candidata
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          python3 scripts/validate_record_pages.py
          python3 scripts/validate_public_records_v2.py
          python3 -m http.server 8000 --directory _site > /tmp/vitrine-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vitrine-http.log
          exit 1

      - name: Instalar navegador de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar descoberta científica, ações públicas e responsividade
        env:
          CANDIDATE_URL: http://127.0.0.1:8000/
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = process.env.CANDIDATE_URL;
          const pages = [['home',''],['products','products.html'],['product-index','products-list.html'],['sources','sources.html'],['about','about.html'],['catalog-overview','analytics.html'],['record-mapbiomas','registros/dr0010/'],['record-terrabrasilis','registros/dr0011/'],['record-gee','registros/dr0019/'],['record-carbon-mapper','registros/dr0139/'],['record-planet-carbon','registros/dr0141/']];
          const viewports = [['desktop',{width:1440,height:1100}],['tablet',{width:820,height:1180}],['mobile',{width:390,height:844}]];
          const allowedActions = new Set(['Acessar site','Acessar dados']);
          const sourceActions = new Set(['Abrir visualização ou consulta', 'Abrir página de dados', 'Ver API ou serviço', 'Abrir site oficial', 'Arquivos para baixar', 'Baixar o arquivo de ecorregiões (ZIP)', 'Abrir o diretório de arquivos SoilGrids', 'Consultar o guia de dados climáticos', 'Consultar a documentação do Planet Forest Carbon']);
          const technicalHref = /(?:\/api(?:\/|$)|graphql|opendap|\bwms\b|\bwfs\b|\bwcs\b|wmts|stac|csw|swagger|openapi)/i;

          async function validatePublicActions(page, selector, label, labels = allowedActions) {
            await page.waitForTimeout(150);
            const actions = await page.locator(selector).evaluateAll(nodes => nodes.map(a => {
              const clone = a.cloneNode(true);
              clone.querySelectorAll('.sr-only').forEach(node => node.remove());
              return {text:(clone.textContent||'').replace(/↗/g,'').trim(), href:a.href};
            }));
            for (const action of actions) {
              if (!labels.has(action.text)) { console.error(`${label}: ação pública indevida: ${action.text}`); return false; }
              if (technicalHref.test(action.href)) { console.error(`${label}: endpoint técnico exposto: ${action.href}`); return false; }
            }
            return true;
          }

          (async () => {
            const browser = await chromium.launch({headless:true});
            const report = [];
            let failed = false;
            for (const [mode, viewport] of viewports) {
              const context = await browser.newContext({viewport});
              for (const [name, path] of pages) {
                const page = await context.newPage();
                const browserErrors = [];
                page.on('pageerror', error => browserErrors.push(`pageerror: ${error.message}`));
                page.on('console', message => { if (message.type() === 'error') browserErrors.push(`console: ${message.text()}`); });
                const url = base + path;
                const response = await page.goto(url,{waitUntil:'networkidle',timeout:60000});
                if (!response || !response.ok()) { console.error(`HTTP inválido: ${url}`); failed=true; await page.close(); continue; }
                if (name === 'products') {
                  await page.waitForFunction(() => document.querySelector('#product-list .product-card') || /Falha ao carregar os produtos/i.test(document.querySelector('#product-list')?.textContent || ''), null, {timeout:10000});
                  if (await page.locator('#product-list .product-card').count() === 0) {
                    const diagnostic = (await page.locator('#product-list').innerText()).trim();
                    throw new Error(`Dados detalhados não foram materializados. DOM: ${diagnostic || '(vazio)'}; navegador: ${browserErrors.join(' | ') || '(sem erro capturado)'}`);
                  }
                }
                if (name === 'product-index') await page.waitForSelector('#product-index-list .product-index-row');
                if (name === 'sources') await page.waitForSelector('#list .card');
                await page.screenshot({path:`visual-qa/${mode}-${name}.png`,fullPage:true});

                const metrics = await page.evaluate(() => ({title:document.title,viewportWidth:window.innerWidth,documentWidth:document.documentElement.scrollWidth,h1:(document.querySelector('h1')?.textContent||'').trim(),hasMain:Boolean(document.querySelector('main')),visibleFreeSearch:[...document.querySelectorAll('input[type="search"],input[type="text"]')].filter(el=>{const s=getComputedStyle(el); return s.display!=='none'&&s.visibility!=='hidden'&&el.getClientRects().length;}).length}));
                report.push({mode,page:name,...metrics,browserErrors});
                if (browserErrors.length) { console.error(`Erros de navegador em ${mode}/${name}: ${browserErrors.join(" | ")}`); failed=true; }
                if (!metrics.hasMain || !metrics.h1) failed=true;
                const publicText = await page.locator('body').innerText();
                if (/snapshot estático curado|atualizações futuras por API|sem inventar produtos|interface viva|ainda falta auditoria|revisar acesso/i.test(publicText)) { console.error(`Linguagem de desenvolvimento em ${mode}/${name}`); failed=true; }
                if (metrics.documentWidth > metrics.viewportWidth + 2) { console.error(`Overflow horizontal: ${mode}/${name}`); failed=true; }
                const expectedSearch = ['home', 'sources', 'products'].includes(name) ? 1 : 0;
                if (metrics.visibleFreeSearch !== expectedSearch) { console.error(`Quantidade inesperada de campos de busca em ${mode}/${name}`); failed=true; }

                if (mode !== 'desktop') {
                  const toggle = page.locator('.nav-toggle');
                  if (!await toggle.isVisible()) { console.error(`Menu responsivo ausente em ${mode}/${name}`); failed=true; }
                  else { await toggle.click(); if (await page.locator('#site-nav-links a:visible').count() < 4) { console.error(`Navegação responsiva incompleta em ${mode}/${name}`); failed=true; } await toggle.click(); }
                }

                if (name === 'home') {
                  await page.waitForFunction(() => document.querySelector('#home-products')?.textContent.trim() === '17' && document.querySelector('#home-sources')?.textContent.trim() === '58');
                  if (await page.locator('#home-all-sources').innerText() !== '58' || await page.locator('#home-access').innerText() !== '42' || await page.locator('#home-free').innerText() !== '9') { console.error('Contagens da inicial divergentes do catálogo completo'); failed=true; }
                  const theme = page.locator('#home-theme[name="q"]');
                  if (await theme.count() !== 1 || await theme.evaluate(el => el.tagName) !== 'SELECT') { console.error('Seleção controlada de fenômeno ausente'); failed=true; }
                  if (await page.locator('#home-product-areas .process-card').count() < 10) { console.error('Atalhos socioecológicos insuficientes'); failed=true; }
                  const action = await page.locator('.controlled-search-shell').getAttribute('action');
                  if (action !== 'sources.html') { console.error(`Home deve abrir exploração ampla: ${action}`); failed=true; }
                  if (await page.locator('#home-product-areas a[href^="sources.html?q="]').count() < 10) { console.error('Atalhos temáticos não apontam à exploração'); failed=true; }
                  if (/autoridade P1|gates P1|núcleo histórico|rota correta|papel A|papéis A|termos controlados|busca textual livre|API\s*\/\s*serviço/i.test(await page.locator('body').innerText())) { console.error('Linguagem interna exposta na Home'); failed=true; }
                }

                if (name === 'products') {
                  const cards = page.locator('#product-list .product-card');
                  if (await cards.count() !== 17) { console.error(`Visão detalhada deve exibir 17 itens: ${await cards.count()}`); failed=true; }
                  const count = page.locator('#product-count');
                  const clear = page.locator('#product-clear');
                  const moreFilters = page.locator('#product-advanced-filters');
                  if (!(await page.locator('#product-scope').innerText()).startsWith('17 itens de 7 fontes') || await count.innerText() !== '17 itens encontrados' || await clear.isVisible()) { console.error('Resumo, contagem ou estado inicial dos filtros incorretos'); failed=true; }
                  if (await page.locator('.stats, #product-result-insights').count()) { console.error('Indicadores e atalhos substituídos continuam presentes'); failed=true; }
                  for (const selector of ['#product-theme','#product-coverage','#product-kind','#product-access']) {
                    const control = page.locator(selector); if (!await control.count() || await control.evaluate(el => el.tagName) !== 'SELECT') { console.error(`Filtro controlado ausente: ${selector}`); failed=true; }
                  }
                  const theme = page.locator('#product-theme');
                  const options = theme.locator('option');
                  if (await options.count() > 1) {
                    const value = await options.nth(1).getAttribute('value');
                    await theme.selectOption(value);
                    await page.waitForTimeout(120);
                    const filtered = await cards.count();
                    if (!(filtered > 0 && filtered <= 17)) { console.error(`Filtro temático não funcionou: ${filtered}`); failed=true; }
                    await page.locator('#product-clear').click();
                    await page.waitForTimeout(120);
                  }
                  await moreFilters.locator('summary').first().click();
                  await page.locator('#product-free').selectOption('sim');
                  if (await cards.count() !== 9 || await count.innerText() !== '9 de 17 itens') { console.error('Download gratuito precisa retornar nove itens com dados para baixar'); failed=true; }
                  await page.reload();
                  await page.waitForSelector('#product-list .product-card');
                  if (await page.locator('#product-free').inputValue() !== 'sim' || !await page.locator('#product-free').isVisible() || await cards.count() !== 9) { console.error('Filtro de download gratuito perdeu o estado após recarregar'); failed=true; }
                  await clear.click();
                  await moreFilters.locator('summary').first().click();
                  await page.locator('#product-source').selectOption('TerraBrasilis');
                  await page.locator('#product-temporal').selectOption('anual');
                  if (await cards.count() !== 1 || !(await cards.first().innerText()).includes('PRODES')) { console.error('Resolução anual confundiu retrato pontual com série anual'); failed=true; }
                  await clear.click();
                  const search = page.locator('#product-q');
                  await search.fill('DETER Pantanal');
                  const downloadOption = page.locator('#product-access option[value="arquivo"]');
                  const seriesOption = page.locator('#product-kind option[value="dataset_series"]');
                  if (await seriesOption.evaluate(option => option.label) !== 'Série de conjuntos de dados (1)') { console.error('O rótulo visível de tipo de item não acompanhou a contagem'); failed=true; }
                  if (await downloadOption.textContent() !== 'Download de dados (1)') { console.error('Contagem do filtro de acesso não acompanhou a busca livre'); failed=true; }
                  await clear.click();
                  if (!await validatePublicActions(page, '#product-list .card-actions a:visible', 'Dados detalhados')) failed=true;
                  if (await page.locator('#product-list .entity-role-badge:visible, #product-list .distribution-semantic-role:visible').count()) { console.error('Rótulo estrutural interno visível nos dados detalhados'); failed=true; }
                  const limitation = page.locator('.product-limitation').first();
                  await limitation.locator('summary').click();
                  if (!(await limitation.locator('p').isVisible()) || !(await limitation.locator('p').innerText()).trim()) { console.error('Limitação não pode ser consultada no card'); failed=true; }
                  await limitation.locator('summary').click();
                  const compareInputs = page.locator('[data-compare]');
                  for (let i=0;i<3;i++) await compareInputs.nth(i).check();
                  await page.locator('#compare-open').click();
                  await page.locator('#compare-dialog[open]').waitFor({state:'visible'});
                  if (await page.locator('#compare-content [data-remove-compare]').count() !== 3) { console.error('Comparação não contém 3 itens'); failed=true; }
                  if (await page.locator('#compare-content .compare-table').count() !== 1) { console.error('Comparação não usa matriz tabular'); failed=true; }
                  if (await page.locator('#compare-content .comparison-diff').count() < 1) { console.error('Comparação não destaca diferenças'); failed=true; }
                  if (await page.locator('#product-list .card-details').count()) { console.error('Cards detalhados ainda carregam ficha expansível redundante'); failed=true; }
                  await page.locator('#compare-close').click();
                  await page.emulateMedia({media:'print'});
                  if (await page.locator('.site-nav').evaluate(el => getComputedStyle(el).display) !== 'none') { console.error('Navegação aparece na impressão de produtos'); failed=true; }
                  if (await page.locator('.product-filters').evaluate(el => getComputedStyle(el).display) !== 'none') { console.error('Filtros aparecem na impressão de produtos'); failed=true; }
                  await page.emulateMedia({media:'screen'});
                }

                if (name === 'product-index') {
                  const rows = page.locator('#product-index-list .product-index-row');
                  if (await rows.count() !== 17) { console.error(`Lista deve conter 17 itens: ${await rows.count()}`); failed=true; }
                  const inmet = rows.filter({hasText:'INMET — observações horárias'});
                  if (await inmet.locator('.index-actions a').getAttribute('href') !== 'https://portal.inmet.gov.br/dadoshistoricos') { console.error('Arquivo anual do INMET ausente na lista'); failed=true; }
                  if (!await validatePublicActions(page, '#product-index-list .index-actions a:visible', 'Lista de dados')) failed=true;
                }

                if (name.startsWith('record-')) {
                  if (await page.locator('.record-type').count() !== 1) { console.error(`Tipo público ausente em ${name}`); failed=true; }
                  if (await page.locator('body[data-public-record-schema="public-record-v2"]').count() !== 1) { console.error(`Renderer v2 ausente em ${name}`); failed=true; }
                  if (await page.locator('.record-nav a').count() !== 5) { console.error(`Navegação interna deve ter cinco blocos em ${name}`); failed=true; }
                  for (const selector of ['#visao-geral','#dados-produtos','#acesso','#interpretacao','#proveniencia-referencias','#curadoria']) {
                    if (await page.locator(selector).count() !== 1) { console.error(`Seção ausente ${selector} em ${name}`); failed=true; }
                  }
                  if (await page.locator('section.record-section').count() !== 5) { console.error(`Página deve ter cinco blocos públicos em ${name}`); failed=true; }
                  if (await page.locator('.record-primary-link').count()) { console.error(`Classe legada inesperada em ${name}`); failed=true; }
                  if (await page.locator('#acesso .access-panel').count() !== 1 || await page.locator('#acesso .route-card').count()) { console.error(`Acesso ainda não está compacto em ${name}`); failed=true; }
                  if (await page.locator('#curadoria .curation-summary').count() !== 1 || await page.locator('#curadoria .record-grid').count()) { console.error(`Curadoria ainda ocupa grade extensa em ${name}`); failed=true; }
                  const body = await page.locator('body').innerText();
                  if (/entity_type|source_origin|access_role|dataset_page|DIRECT_DATA|BROKEN_UNCERTAIN/i.test(body)) { console.error(`Vocabulário interno exposto em ${name}`); failed=true; }
                  if (name === 'record-terrabrasilis' && await page.locator('.record-product').count() !== 7) { console.error('TerraBrasilis deve exibir 7 produtos detalhados'); failed=true; }
                  if (name === 'record-gee' && await page.locator('.record-product').count() !== 4) { console.error('GEE deve exibir 4 produtos detalhados'); failed=true; }
                  if (name === 'record-mapbiomas' && await page.locator('.record-product').count() !== 0) { console.error('MapBiomas não deve inventar produtos detalhados'); failed=true; }
                  if (name === 'record-mapbiomas' && !await page.locator('.provenance-status').isVisible()) { console.error('Orientação para consultar o produtor do dado ausente na ficha MapBiomas'); failed=true; }
                  await page.emulateMedia({media:'print'});
                  if (await page.locator('.site-nav').evaluate(el => getComputedStyle(el).display) !== 'none') { console.error(`Navegação aparece na impressão de ${name}`); failed=true; }
                  if (await page.locator('.record-nav').evaluate(el => getComputedStyle(el).display) !== 'none') { console.error(`Índice sticky aparece na impressão de ${name}`); failed=true; }
                  if (!(await page.locator('#acesso .route-actions a').first().isVisible())) { console.error(`Link principal desaparece na impressão de ${name}`); failed=true; }
                  const primaryUrl = await page.locator('#acesso .route-actions a').first().getAttribute('href');
                  const printedUrl = await page.locator('#acesso .route-actions a').first().evaluate(el => getComputedStyle(el, '::after').content);
                  if (!printedUrl.includes(primaryUrl)) { console.error(`URL principal ausente na impressão de ${name}`); failed=true; }
                  if (!(await page.locator('.record-reference a').first().isVisible())) { console.error(`Referência desaparece na impressão de ${name}`); failed=true; }

                  await page.emulateMedia({media:'screen'});
                }

                if (name === 'sources') {
                  if (await page.locator('#list .card').count() !== 12) { console.error('Lote inicial deve conter 12 cards'); failed=true; }
                  const theme = page.locator('#source-theme-shortcut');
                  if (await theme.count() !== 1 || await theme.evaluate(el => el.tagName) !== 'SELECT') { console.error('Filtro temático ausente'); failed=true; }
                  for (const selector of ['#coverage','#information','#access-role']) {
                    if (await page.locator(selector).evaluate(el => el.tagName) !== 'SELECT') { console.error(`Filtro principal não controlado: ${selector}`); failed=true; }
                  }
                  if (await page.locator('#list .provenance-line').count() < 1) { console.error('Responsável visível ausente nos cards'); failed=true; }
                  if (await page.locator('#list .card-details, #list .detail-group, #list .status-grid').count()) { console.error('Ficha técnica redundante ainda presente nos cards'); failed=true; }
                  const recordActions = page.locator('#list .record-detail-actions .action-primary');
                  if (await recordActions.count() !== 12) { console.error(`Cada card inicial deve priorizar o registro completo: ${await recordActions.count()}`); failed=true; }
                  for (let i=0; i<await recordActions.count(); i++) {
                    const href = await recordActions.nth(i).getAttribute('href');
                    if (!/^registros\/dr\d+\/$/.test(href || '')) { console.error(`Link interno de registro inválido: ${href}`); failed=true; }
                  }
                  if (await page.locator('#list .semantic-role-line:visible, #list .semantic-scope-note:visible').count()) { console.error('Classificação estrutural interna visível nas fontes'); failed=true; }
                  if (!await validatePublicActions(page, '#list .card-actions a:visible', 'Explorar dados', sourceActions)) failed=true;
                  const sourceText = await page.locator('body').innerText();
                  if (/Os temas são aplicados aos campos científicos|correspondência sem distinção|listas são derivadas|recalculadas conforme|termos controlados|núcleo de 51 registros|busca textual livre|Detalhes científicos, técnicos|API\s*\/\s*serviço/i.test(sourceText)) { console.error('Explicação de implementação exposta na exploração'); failed=true; }
                  await page.locator('#coverage').selectOption('mg');
                  await page.waitForTimeout(150);
                  if (await page.locator('#list .card').count() !== 2) { console.error('Filtro Minas Gerais deve retornar 2 fontes'); failed=true; }
                  await page.locator('#information').selectOption('mapas');
                  await page.waitForTimeout(150);
                  const filteredUrl = page.url();
                  await page.reload();
                  await page.waitForTimeout(300);
                  if (await page.locator('#coverage').inputValue() !== 'mg' || await page.locator('#information').inputValue() !== 'mapas' || await page.locator('#list .card').count() !== 2) { console.error(`Filtros não sobrevivem à recarga: ${filteredUrl}`); failed=true; }
                  await page.locator('#clear').click();
                  await page.waitForTimeout(150);
                  if (await page.locator('#list .card').count() !== 12) { console.error('Limpar filtros não restaurou o catálogo'); failed=true; }
                  const access = page.locator('#access-role');
                  const mapbiomas = page.locator('#list [data-resource-id="DR0010"]');
                  await page.locator('#q').fill('MapBiomas');
                  await mapbiomas.waitFor({state:'visible'});
                  await access.selectOption('B');
                  await page.waitForFunction(() => new URLSearchParams(location.search).get('access') === 'B');
                  await mapbiomas.locator('.card-actions a[href="https://brasil.mapbiomas.org/downloads/"]').waitFor({state:'visible'});
                  await access.selectOption('C');
                  await page.waitForFunction(() => new URLSearchParams(location.search).get('access') === 'C');
                  await mapbiomas.locator('.card-actions a[href="registros/dr0010/#acesso-tecnico"]').waitFor({state:'visible'});
                  await access.selectOption('D');
                  await page.waitForFunction(() => new URLSearchParams(location.search).get('access') === 'D');
                  await mapbiomas.locator('.card-actions a[href="https://plataforma.brasil.mapbiomas.org/"]').waitFor({state:'visible'});
                  await page.locator('#clear').click();
                  await page.waitForTimeout(150);
                  const options = theme.locator('option');
                  if (await options.count() > 1) {
                    await theme.selectOption(await options.nth(1).getAttribute('value'));
                    await page.waitForTimeout(150);
                    if (!new URL(page.url()).searchParams.get('q')) { console.error('Tema controlado não persistiu na URL'); failed=true; }
                  }
                }
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if (failed) process.exit(1);
          })();
          NODE

      - name: Publicar evidência visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrine-public-ui-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 14
