name: Capturar QA visual da Vitrine publicada

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-ui-visual-qa.yml"
      - "index.html"
      - "products.html"
      - "sources.html"
      - "analytics.html"
      - "about.html"
      - "assets/**"
      - "data/**"
      - "schema/public-discovery-v0.1.json"
      - "scripts/build_catalog.py"
      - "scripts/build_public_discovery.py"
      - "scripts/build_site_artifact.py"
      - "scripts/validate_vitrine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Preparar versão candidata
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          python3 -m http.server 8000 --directory _site > /tmp/vitrine-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vitrine-http.log
          exit 1

      - name: Instalar navegador de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar navegação, busca, comparação e responsividade
        env:
          CANDIDATE_URL: http://127.0.0.1:8000/
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const base = process.env.CANDIDATE_URL;
          const pages = [
            ['home', ''],
            ['products', 'products.html'],
            ['sources', 'sources.html'],
            ['about', 'about.html'],
            ['catalog-overview', 'analytics.html'],
          ];
          const viewports = [
            ['desktop', { width: 1440, height: 1100 }],
            ['tablet', { width: 820, height: 1180 }],
            ['mobile', { width: 390, height: 844 }],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failed = false;

            for (const [mode, viewport] of viewports) {
              const context = await browser.newContext({ viewport });
              for (const [name, path] of pages) {
                const page = await context.newPage();
                const url = base + path;
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 60000 });
                if (!response || !response.ok()) {
                  console.error(`HTTP inválido: ${url}`);
                  failed = true;
                  await page.close();
                  continue;
                }

                if (name === 'products') await page.waitForSelector('#product-list .card');
                if (name === 'sources') await page.waitForSelector('#list .card');
                await page.screenshot({ path: `visual-qa/${mode}-${name}.png`, fullPage: true });

                const metrics = await page.evaluate(() => ({
                  title: document.title,
                  viewportWidth: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  h1: (document.querySelector('h1')?.textContent || '').trim(),
                  hasMain: Boolean(document.querySelector('main')),
                  navToggleVisible: Boolean(document.querySelector('.nav-toggle') && getComputedStyle(document.querySelector('.nav-toggle')).display !== 'none'),
                  fullCatalogCsvLinks: document.querySelectorAll('a[href*="data_resources.csv"],a[href*="data_products.csv"],a[href*="product_distributions.csv"]').length,
                }));
                report.push({mode, page:name, ...metrics});

                if (!metrics.hasMain || !metrics.h1) failed = true;
                if (metrics.documentWidth > metrics.viewportWidth + 2) {
                  console.error(`Overflow horizontal: ${mode}/${name}: ${metrics.documentWidth} > ${metrics.viewportWidth}`);
                  failed = true;
                }
                if (metrics.fullCatalogCsvLinks !== 0) {
                  console.error(`CSV integral exposto em ${mode}/${name}`);
                  failed = true;
                }

                if (mode !== 'desktop') {
                  const toggle = page.locator('.nav-toggle');
                  if (!await toggle.isVisible()) {
                    console.error(`Menu responsivo ausente em ${mode}/${name}`);
                    failed = true;
                  } else {
                    await toggle.click();
                    const visibleLinks = await page.locator('#site-nav-links a:visible').count();
                    if (visibleLinks < 4) {
                      console.error(`Navegação responsiva incompleta em ${mode}/${name}: ${visibleLinks} links`);
                      failed = true;
                    }
                    await toggle.click();
                  }
                }

                if (name === 'home') {
                  const action = await page.locator('.home-search').getAttribute('action');
                  if (action !== 'products.html') {
                    console.error(`Busca inicial não aponta para produtos: ${action}`);
                    failed = true;
                  }
                  const products = Number((await page.locator('#home-products').textContent()).trim());
                  const sources = Number((await page.locator('#home-sources').textContent()).trim());
                  if (!(products > sources && sources > 0)) {
                    console.error(`Resumo inicial incoerente: produtos=${products}, fontes=${sources}`);
                    failed = true;
                  }
                }

                if (name === 'products') {
                  const cards = page.locator('#product-list .product-card');
                  if (await cards.count() !== 6) {
                    console.error(`Divulgação inicial de produtos inválida em ${mode}: ${await cards.count()}`);
                    failed = true;
                  }
                  const triage = page.locator('#product-list .product-triage .triage-item');
                  if (await triage.count() < 24) {
                    console.error(`Resumo Onde/Quando/Escala/Acesso incompleto em ${mode}`);
                    failed = true;
                  }
                  const requiredFilters = ['#product-area','#product-coverage','#product-year-start','#product-year-end','#product-temporal','#product-spatial-support','#product-spatial-resolution','#product-access','#product-format','#product-free'];
                  for (const selector of requiredFilters) {
                    if (!await page.locator(selector).count()) {
                      console.error(`Filtro científico ausente: ${selector}`);
                      failed = true;
                    }
                  }

                  await page.locator('#product-q').fill('carbono');
                  await page.waitForTimeout(120);
                  if (!await page.locator('#query-interpretation').isVisible()) {
                    console.error(`Interpretação leve da consulta não apareceu em ${mode}`);
                    failed = true;
                  }
                  await page.locator('#product-clear').click();
                  await page.waitForSelector('#product-list .product-card');

                  const compareInputs = page.locator('[data-compare]');
                  if (await compareInputs.count() < 2) {
                    console.error(`Produtos insuficientes para testar comparação em ${mode}`);
                    failed = true;
                  } else {
                    await compareInputs.nth(0).check();
                    await compareInputs.nth(1).check();
                    await page.locator('#compare-open').click();
                    await page.locator('#compare-dialog[open]').waitFor({state:'visible'});
                    await page.waitForTimeout(120);

                    if (await page.locator('#compare-content [data-remove-compare]').count() !== 2) {
                      console.error(`Controles de remoção dentro da comparação ausentes em ${mode}`);
                      failed = true;
                    }
                    if (!await page.locator('#compare-download-csv').isVisible()) {
                      console.error(`Exportação CSV da comparação ausente em ${mode}`);
                      failed = true;
                    }

                    await page.locator('#compare-content [data-remove-compare]').first().click();
                    await page.waitForTimeout(80);
                    if (await page.locator('#compare-content [data-remove-compare]').count() !== 1) {
                      console.error(`Remoção dentro da comparação não atualizou a vista em ${mode}`);
                      failed = true;
                    }
                    const selectedDuring = await page.locator('[data-compare]:checked').count();
                    if (selectedDuring !== 1) {
                      console.error(`Seleção após remoção incoerente em ${mode}: ${selectedDuring}`);
                      failed = true;
                    }

                    await page.locator('#compare-close').click();
                    await page.waitForTimeout(80);
                    const selectedAfter = await page.locator('[data-compare]:checked').count();
                    if (selectedAfter !== 0 || await page.locator('#compare-bar').isVisible()) {
                      console.error(`Seleção não foi reiniciada ao fechar comparação em ${mode}`);
                      failed = true;
                    }
                  }
                }

                if (name === 'sources') {
                  const sourceCards = await page.locator('#list .card').count();
                  if (sourceCards !== 12) {
                    console.error(`Divulgação inicial de fontes inválida em ${mode}: ${sourceCards}`);
                    failed = true;
                  }
                }

                await page.close();
              }
              await context.close();
            }

            await browser.close();
            fs.writeFileSync('visual-qa/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failed) process.exit(1);
          })();
          NODE

      - name: Publicar evidência visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrine-public-ui-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 14
