name: Capturar QA visual da Vitrine publicada

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-ui-visual-qa.yml"
      - "index.html"
      - "products.html"
      - "products-list.html"
      - "sources.html"
      - "analytics.html"
      - "about.html"
      - "assets/**"
      - "data/**"
      - "scripts/build_catalog.py"
      - "scripts/build_public_discovery.py"
      - "scripts/build_site_artifact.py"
      - "scripts/validate_vitrine.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-public-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Preparar versão candidata
        run: |
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          python3 -m http.server 8000 --directory _site > /tmp/vitrine-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vitrine-http.log
          exit 1

      - name: Instalar navegador de QA
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validar navegação controlada, papéis e responsividade
        env:
          CANDIDATE_URL: http://127.0.0.1:8000/
        run: |
          mkdir -p visual-qa
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const base = process.env.CANDIDATE_URL;
          const pages = [['home',''],['products','products.html'],['product-index','products-list.html'],['sources','sources.html'],['about','about.html'],['catalog-overview','analytics.html']];
          const viewports = [['desktop',{width:1440,height:1100}],['tablet',{width:820,height:1180}],['mobile',{width:390,height:844}]];

          (async () => {
            const browser = await chromium.launch({headless:true});
            const report = [];
            let failed = false;
            for (const [mode, viewport] of viewports) {
              const context = await browser.newContext({viewport});
              for (const [name, path] of pages) {
                const page = await context.newPage();
                const url = base + path;
                const response = await page.goto(url,{waitUntil:'networkidle',timeout:60000});
                if (!response || !response.ok()) { console.error(`HTTP inválido: ${url}`); failed=true; await page.close(); continue; }
                if (name === 'products') await page.waitForSelector('#product-list .product-card');
                if (name === 'product-index') await page.waitForSelector('#product-index-list .product-index-row');
                if (name === 'sources') await page.waitForSelector('#list .card');
                await page.screenshot({path:`visual-qa/${mode}-${name}.png`,fullPage:true});

                const metrics = await page.evaluate(() => ({title:document.title,viewportWidth:window.innerWidth,documentWidth:document.documentElement.scrollWidth,h1:(document.querySelector('h1')?.textContent||'').trim(),hasMain:Boolean(document.querySelector('main')),visibleFreeSearch:[...document.querySelectorAll('input[type="search"]')].filter(el=>{const s=getComputedStyle(el); return s.display!=='none'&&s.visibility!=='hidden'&&el.getClientRects().length;}).length}));
                report.push({mode,page:name,...metrics});
                if (!metrics.hasMain || !metrics.h1) failed=true;
                if (metrics.documentWidth > metrics.viewportWidth + 2) { console.error(`Overflow horizontal: ${mode}/${name}`); failed=true; }
                if (metrics.visibleFreeSearch !== 0) { console.error(`Busca livre visível em ${mode}/${name}`); failed=true; }

                if (mode !== 'desktop') {
                  const toggle = page.locator('.nav-toggle');
                  if (!await toggle.isVisible()) { console.error(`Menu responsivo ausente em ${mode}/${name}`); failed=true; }
                  else { await toggle.click(); if (await page.locator('#site-nav-links a:visible').count() < 4) { console.error(`Navegação responsiva incompleta em ${mode}/${name}`); failed=true; } await toggle.click(); }
                }

                if (name === 'home') {
                  await page.waitForFunction(() => document.querySelector('#home-products')?.textContent.trim() === '11' && document.querySelector('#home-sources')?.textContent.trim() === '51');
                  if (await page.locator('select[name="theme"]').count() !== 1) { console.error('Seleção controlada de fenômeno ausente'); failed=true; }
                  if (await page.locator('#home-product-areas .process-card').count() < 10) { console.error('Atalhos socioecológicos insuficientes'); failed=true; }
                }

                if (name === 'products') {
                  const cards = page.locator('#product-list .product-card');
                  if (await cards.count() !== 11) { console.error(`Núcleo deve exibir 11 produtos: ${await cards.count()}`); failed=true; }
                  for (const selector of ['#product-theme','#product-coverage','#product-kind','#product-access']) {
                    const control = page.locator(selector); if (!await control.count() || await control.evaluate(el => el.tagName) !== 'SELECT') { console.error(`Filtro controlado ausente: ${selector}`); failed=true; }
                  }
                  const theme = page.locator('#product-theme');
                  const options = theme.locator('option');
                  if (await options.count() > 1) {
                    const value = await options.nth(1).getAttribute('value');
                    await theme.selectOption(value);
                    await page.waitForTimeout(120);
                    const filtered = await cards.count();
                    if (!(filtered > 0 && filtered <= 11)) { console.error(`Filtro temático não funcionou: ${filtered}`); failed=true; }
                    await page.locator('#product-clear').click();
                    await page.waitForTimeout(120);
                  }
                  await page.waitForFunction(() => document.querySelectorAll('#product-list .entity-role-badge').length >= 11);
                  if (await page.locator('#product-list .entity-role-badge').filter({hasText:'Serviço/catálogo'}).count() < 3) { console.error('Serviços/catálogos não estão diferenciados'); failed=true; }
                  const compareInputs = page.locator('[data-compare]');
                  for (let i=0;i<3;i++) await compareInputs.nth(i).check();
                  await page.locator('#compare-open').click();
                  await page.locator('#compare-dialog[open]').waitFor({state:'visible'});
                  if (await page.locator('#compare-content [data-remove-compare]').count() !== 3) { console.error('Comparação não contém 3 produtos'); failed=true; }
                  await page.locator('#compare-close').click();
                }

                if (name === 'product-index') {
                  const rows = page.locator('#product-index-list .product-index-row');
                  if (await rows.count() !== 11) { console.error(`Índice técnico deve conter 11 produtos: ${await rows.count()}`); failed=true; }
                  if ((await page.locator('#product-index-count').textContent()).trim() !== '11 produtos no núcleo') { console.error('Contagem do índice técnico incoerente'); failed=true; }
                }

                if (name === 'sources') {
                  if (await page.locator('#list .card').count() !== 12) { console.error('Lote inicial de fontes deve conter 12 cards'); failed=true; }
                  for (const selector of ['#area','#brazil','#scope','#download','#programmatic','#coverage','#format','#evidence']) {
                    if (await page.locator(selector).evaluate(el => el.tagName) !== 'SELECT') { console.error(`Filtro de fonte não controlado: ${selector}`); failed=true; }
                  }
                }
                await page.close();
              }
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));
            console.log(JSON.stringify(report,null,2));
            if (failed) process.exit(1);
          })();
          NODE

      - name: Publicar evidência visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrine-public-ui-visual-qa
          path: visual-qa/
          if-no-files-found: error
          retention-days: 14
