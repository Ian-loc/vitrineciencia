name: Materialize verified IBGE national accounts batch 2026-08-17

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/materialize-vitrine-national-accounts-2026-08-17.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified canonical records and validate
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, pathlib
          ROOT = pathlib.Path('.')
          TODAY = '2026-08-17'

          def read_csv(path):
              with open(path, encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))

          def append_rows(path, id_field, rows):
              path = ROOT / path
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  existing = list(reader)
              ids = {r[id_field] for r in existing}
              dup = [r[id_field] for r in rows if r[id_field] in ids]
              if dup:
                  raise SystemExit(f'IDs already exist in {path}: {dup}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n', extrasaction='raise')
                  for row in rows:
                      w.writerow(row)

          resources = [
            {
              'resource_id':'DR0101','resource_name':'Contas Nacionais — IBGE','acronym':'Contas Nacionais IBGE',
              'official_identity':'Família institucional de sistemas de contas nacionais, regionais e municipais do IBGE',
              'description':'Reúne sistemas estatísticos macroeconômicos do IBGE compatíveis com o System of National Accounts, incluindo contas nacionais anuais e trimestrais, contas regionais, PIB dos Municípios e matrizes de insumo-produto.',
