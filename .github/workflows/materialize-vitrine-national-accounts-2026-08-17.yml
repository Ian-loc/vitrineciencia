          collisions = [r['product_page_url'] for r in products if r['product_page_url'] in existing_urls]
          if collisions:
              raise SystemExit(f'Product page already cataloged: {collisions}')

          append_rows('data/data_resources.csv', 'resource_id', resources)
          append_rows('data/data_products.csv', 'product_id', products)
          append_rows('data/product_distributions.csv', 'distribution_id', distributions)

          p = ROOT / 'data/brazil_scope_priorities.json'
          registry = json.loads(p.read_text(encoding='utf-8'))
          registry['reviewed_at'] = TODAY
          p0 = next(t for t in registry['tiers'] if t['priority_tier'] == 'P0')
          for rid in ['DR0101','DR0102']:
              if rid not in p0['resource_ids']:
                  p0['resource_ids'].append(rid)
          p.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          rs, ps, ds = read_csv('data/data_resources.csv'), read_csv('data/data_products.csv'), read_csv('data/product_distributions.csv')
          rids, pids, dids = {r['resource_id'] for r in rs}, {r['product_id'] for r in ps}, {r['distribution_id'] for r in ds}
          assert len(rids) == len(rs) and len(pids) == len(ps) and len(dids) == len(ds)
          assert all(r['resource_id'] in rids for r in ps)
          assert all(r['product_id'] in pids for r in ds)
          assert all(x in pids for x in ['DP000319','DP000320','DP000321','DP000322','DP000323','DP000324'])
          assert all(x in dids for x in ['DD000340','DD000341','DD000342','DD000343','DD000344','DD000345'])
          assert len(rs) == 102, len(rs)
          assert len(ps) == 320, len(ps)
          assert len(ds) == 341, len(ds)
          print(f'Canonical read-back: {len(rs)} sources, {len(ps)} products, {len(ds)} distributions')
          PY

          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check

      - name: Commit materialized batch and self-remove workflow
        shell: bash
        run: |
          git config user.name "vitrine-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-vitrine-national-accounts-2026-08-17.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json data/brazil_scope_priorities.json
          git diff --cached --check
          git commit -m "Expand verified IBGE national accounts catalog"
          git push origin HEAD:main
