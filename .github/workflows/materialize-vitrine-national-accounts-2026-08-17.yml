            {'product_id':'DP000321','resource_id':'DR0101','product_name':'Sistema de Contas Regionais — Brasil 2023','product_acronym':'SCR 2023','product_family':'Contas Regionais','product_kind':'dataset_series','product_description':'Estimativas do PIB de cada Unidade da Federação pelas óticas da produção e da renda, coerentes entre si e compatíveis com o Sistema de Contas Nacionais.','research_areas':'Economics | Economic geography | Regional development | Public policy','keywords':'contas regionais | PIB estadual | valor adicionado | renda | UF | regiões','geographic_coverage':'Brasil; Grandes Regiões e 27 Unidades da Federação','covers_brazil':'sim','spatial_support':'Unidade da Federação','spatial_resolution':'UF; agregações por Grandes Regiões e Brasil','temporal_coverage':'série referência 2010 com resultados 2010–2023; tabelas também apresentam encadeamentos anteriores','temporal_resolution':'anual','update_frequency':'anual','product_status':'ativo','version_or_collection':'resultados 2023; referência 2010','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9054-contas-regionais-do-brasil.html','methodology_url':'https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais/9054-contas-regionais-do-brasil.html','primary_or_derived':'derivado','limitations':'Estimativas regionais são compatibilizadas ao SCN e sujeitas a revisões. PIB estadual não representa renda domiciliar, qualidade ambiental ou bem-estar e comparações históricas devem observar revisões de ano de referência.','last_verified':TODAY},
