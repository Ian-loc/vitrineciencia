name: One-shot ANA critical-events expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-ana-events.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Append verified ANA products
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          reviewed='2026-08-17'
          pp=Path('data/data_products.csv'); dd=Path('data/product_distributions.csv')
          products=[
          {'product_id':'DP000367','resource_id':'DR0017','product_name':'Sala de Situação — ANA','product_acronym':'Sala de Situação ANA','product_family':'Monitoramento e eventos hidrológicos críticos','product_kind':'data_service','product_description':'Serviço operacional da ANA para monitoramento e análise da evolução de chuvas, níveis e vazões de rios, reservatórios e bacias, com boletins e sistemas de acompanhamento para subsidiar decisões sobre secas, cheias e outros eventos hidrológicos críticos.','research_areas':'Recursos Hídricos e Oceanografia | Clima e Ciências Atmosféricas','keywords':'eventos críticos | seca | cheia | monitoramento hidrológico | chuva | nível | vazão | ANA','geographic_coverage':'Brasil — bacias, rios, reservatórios e sistemas hídricos acompanhados pela ANA','covers_brazil':'sim','spatial_support':'estações | rios | reservatórios | bacias e sistemas hídricos','spatial_resolution':'heterogênea; depende das redes e sistemas monitorados','temporal_coverage':'monitoramento operacional corrente; séries e boletins com períodos próprios','temporal_resolution':'subdiária a mensal conforme sistema e boletim','update_frequency':'contínua e periódica conforme produto operacional','product_status':'ativo','version_or_collection':'serviço corrente de monitoramento e eventos críticos','enumeration_scope':'complete','product_page_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos','methodology_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos','primary_or_derived':'misto','limitations':'Integra observações, análises, previsões e boletins de fontes e sistemas distintos. Previsão não é observação; cobertura e frequência variam por local e sistema, e ausência de alerta não implica ausência de risco.','last_verified':reviewed},
          {'product_id':'DP000368','resource_id':'DR0017','product_name':'Salas de Crise — ANA','product_acronym':'Salas de Crise ANA','product_family':'Gestão de eventos hidrológicos críticos','product_kind':'catalog','product_description':'Índice operacional da ANA das Salas de Crise instituídas para articulação e compartilhamento de informações em eventos hidrológicos críticos, com páginas por sistema ou região e registros de reuniões.','research_areas':'Recursos Hídricos e Oceanografia | Planejamento Territorial e Políticas Públicas','keywords':'salas de crise | seca | inundação | segurança hídrica | gestão de risco | ANA','geographic_coverage':'Brasil — áreas delimitadas e sistemas hídricos com salas de crise instituídas','covers_brazil':'sim','spatial_support':'região | bacia | sistema hídrico | reservatório conforme sala','spatial_resolution':'não se aplica; recorte operacional definido por sala','temporal_coverage':'salas ativas e histórico de salas desativadas desde uso institucional iniciado em 2013','temporal_resolution':'por reunião e período de ativação','update_frequency':'conforme ativação, reuniões e encerramento das salas','product_status':'ativo','version_or_collection':'estrutura institucionalizada pela Resolução ANA nº 155/2023','enumeration_scope':'external_index','product_page_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/salas-de-crise','methodology_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/salas-de-crise','primary_or_derived':'agregador','limitations':'As Salas de Crise são instrumentos consultivos e de articulação, não datasets observacionais homogêneos. Estados de ativação mudam no tempo; informações técnicas de cada reunião dependem das fontes apresentadas.','last_verified':reviewed},
          {'product_id':'DP000369','resource_id':'DR0017','product_name':'Salas de Acompanhamento — ANA','product_acronym':'Salas de Acompanhamento ANA','product_family':'Acompanhamento de sistemas hídricos prioritários','product_kind':'catalog','product_description':'Índice operacional das Salas de Acompanhamento da ANA para sistemas hídricos com condições de operação de reservatórios estabelecidas, reunindo páginas, reuniões e informações para acompanhamento da gestão.','research_areas':'Recursos Hídricos e Oceanografia | Planejamento Territorial e Políticas Públicas','keywords':'salas de acompanhamento | reservatórios | sistemas hídricos | operação | segurança hídrica | ANA','geographic_coverage':'Brasil — sistemas hídricos prioritários acompanhados pela ANA','covers_brazil':'sim','spatial_support':'bacia | sistema hídrico | reservatórios conforme sala','spatial_resolution':'não se aplica; recorte operacional definido por sistema','temporal_coverage':'salas correntes e registros de reuniões conforme cada sistema','temporal_resolution':'por reunião e período de acompanhamento','update_frequency':'conforme calendário e gestão de cada sistema','product_status':'ativo','version_or_collection':'estrutura institucionalizada pela Resolução ANA nº 155/2023','enumeration_scope':'external_index','product_page_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/salas-de-acompanhamento','methodology_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/salas-de-acompanhamento','primary_or_derived':'agregador','limitations':'Salas de Acompanhamento são ambientes de coordenação e informação, não séries hidrológicas primárias. Situação operacional e sistemas abrangidos mudam; usar os dados de origem para análise quantitativa.','last_verified':reviewed}
          ]
          dists=[
          {'distribution_id':'DD000388','product_id':'DP000367','distribution_name':'Sala de Situação ANA — eventos críticos, boletins e sistemas','access_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos','format':'páginas web | boletins | links para sistemas de monitoramento','access_protocol':'HTTPS web','access_tool':'navegador web | sistemas vinculados','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; condições específicas podem variar nos sistemas vinculados','license':'conteúdo do portal gov.br sob CC BY-ND 3.0; licenças dos dados vinculados devem ser verificadas separadamente','provider_attribution_required':'sim','subset_support':'por bacia, sistema, reservatório e tipo de boletim conforme recurso','notes':'Portal operacional agregador; distinguir observações, previsões, boletins e sistemas de origem.','last_verified':reviewed},
          {'distribution_id':'DD000389','product_id':'DP000368','distribution_name':'Salas de Crise ANA — índice público e registros','access_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/salas-de-crise','format':'páginas web | links para gravações e materiais por sala','access_protocol':'HTTPS web','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública','license':'conteúdo do portal gov.br sob CC BY-ND 3.0; materiais vinculados podem ter condições próprias','provider_attribution_required':'sim','subset_support':'por sala/região/sistema','notes':'Índice de salas ativas e desativadas; não tratar como série observacional única.','last_verified':reviewed},
          {'distribution_id':'DD000390','product_id':'DP000369','distribution_name':'Salas de Acompanhamento ANA — índice público e registros','access_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/salas-de-acompanhamento','format':'páginas web | links para materiais e reuniões por sistema','access_protocol':'HTTPS web','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública','license':'conteúdo do portal gov.br sob CC BY-ND 3.0; materiais vinculados podem ter condições próprias','provider_attribution_required':'sim','subset_support':'por sistema hídrico/sala','notes':'Acompanhamento operacional de sistemas hídricos prioritários; dados quantitativos devem ser rastreados aos sistemas/fontes apresentados.','last_verified':reviewed}
          ]
          def header(p):
            with p.open(encoding='utf-8',newline='') as f: return next(csv.reader(f))
          pf,df=header(pp),header(dd)
          with pp.open(encoding='utf-8',newline='') as f: oldp=list(csv.DictReader(f))
          with dd.open(encoding='utf-8',newline='') as f: oldd=list(csv.DictReader(f))
          pids={r['product_id'] for r in oldp}; purls={r['product_page_url'] for r in oldp}; dids={r['distribution_id'] for r in oldd}
          for r in products:
            assert set(r)==set(pf)
            if r['product_id'] in pids or r['product_page_url'] in purls: raise SystemExit('duplicate product: '+r['product_id'])
          for r in dists:
            assert set(r)==set(df)
            if r['distribution_id'] in dids: raise SystemExit('duplicate distribution: '+r['distribution_id'])
          with pp.open('a',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=pf,lineterminator='\n'); w.writerows(products)
          with dd.open('a',encoding='utf-8',newline='') as f:
            w=csv.DictWriter(f,fieldnames=df,lineterminator='\n'); w.writerows(dists)
          print('appended',len(products),len(dists))
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity
        run: |
          python - <<'PY'
          import csv
          def rows(p):
            with open(p,encoding='utf-8',newline='') as f: return list(csv.DictReader(f))
          rr=rows('data/data_resources.csv'); pp=rows('data/data_products.csv'); dd=rows('data/product_distributions.csv')
          rids={r['resource_id'] for r in rr}; pids={r['product_id'] for r in pp}; dids=[r['distribution_id'] for r in dd]
          assert len(rids)==len(rr); assert len(pids)==len(pp); assert len(dids)==len(set(dids))
          assert all(r['resource_id'] in rids for r in pp); assert all(r['product_id'] in pids for r in dd)
          for x in ['DP000367','DP000368','DP000369']: assert x in pids
          for x in ['DD000388','DD000389','DD000390']: assert x in dids
          print(len(rr),len(pp),len(dd))
          PY
      - name: Commit materialized batch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-ana-events.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json docs scripts || true
          git add -u
          git commit -m 'Expand verified ANA critical-events catalog'
          git push
