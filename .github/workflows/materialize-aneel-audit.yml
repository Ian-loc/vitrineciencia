          p0 = next(t for t in obj["tiers"] if t["priority_tier"] == "P0")
          if "DR0120" not in p0["resource_ids"]:
              p0["resource_ids"].append("DR0120")
          obj["reviewed_at"] = DATE
          prio.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate and rebuild catalog
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Consolidated read-back
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8', newline='') as f: return list(csv.DictReader(f))
          R=rows('data/data_resources.csv'); P=rows('data/data_products.csv'); D=rows('data/product_distributions.csv')
          assert len({r['resource_id'] for r in R}) == len(R)
          assert len({r['product_id'] for r in P}) == len(P)
          assert len({r['distribution_id'] for r in D}) == len(D)
          rids={r['resource_id'] for r in R}; pids={r['product_id'] for r in P}
          assert all(r['resource_id'] in rids for r in P)
          assert all(r['product_id'] in pids for r in D)
          assert {'DP000557','DP000558','DP000559','DP000560','DP000561','DP000562','DP000563','DP000564','DP000565','DP000566','DP000567'} <= pids
          assert {'DD000582','DD000583','DD000584','DD000585','DD000586','DD000587','DD000588','DD000589','DD000590','DD000591','DD000592'} <= {r['distribution_id'] for r in D}
          print(f'COUNTS resources={len(R)} products={len(P)} distributions={len(D)}')
          PY

      - name: Commit materialized batch
        run: |
          git config user.name "vitrine-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data reports docs 2>/dev/null || true
          git status --short
          git commit -m "Expand verified ANEEL energy catalog"
          git push origin HEAD:audit/aneel-2026-08-18
