name: Materialize ANEEL audit batch

on:
  push:
    branches: ["audit/aneel-2026-08-18"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/aneel-2026-08-18
          fetch-depth: 0

      - name: Append verified ANEEL source, products and distributions
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          DATE = "2026-08-18"

          def append_rows(path, rows, id_field):
              p = Path(path)
              with p.open("r", encoding="utf-8", newline="") as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames
                  existing = {r[id_field] for r in reader}
              dup = [r[id_field] for r in rows if r[id_field] in existing]
              if dup:
                  raise SystemExit(f"IDs already present in {path}: {dup}")
              with p.open("a", encoding="utf-8", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
                  for row in rows:
                      missing = set(fields) - set(row)
                      extra = set(row) - set(fields)
                      if missing or extra:
                          raise SystemExit(f"Schema mismatch {path} {row[id_field]} missing={missing} extra={extra}")
                      w.writerow(row)

          source = [{
            "resource_id":"DR0120",
            "resource_name":"Portal de Dados Abertos e Sistemas do Setor Elétrico — ANEEL",
            "acronym":"ANEEL Dados Abertos",
            "official_identity":"Portal oficial de dados abertos e sistemas regulatórios da Agência Nacional de Energia Elétrica — ANEEL",
            "description":"Fonte institucional para dados administrativos, regulatórios, geográficos e operacionais do setor elétrico brasileiro, incluindo geração centralizada e distribuída, transmissão, outorgas, segurança de barragens e compensação financeira pelo uso de recursos hídricos.",
            "homepage_url":"https://www.gov.br/aneel/pt-br",
            "data_access_url":"https://dadosabertos.aneel.gov.br/",
            "research_areas":"Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados",
            "keywords":"energia elétrica | geração | transmissão | MMGD | hidrelétricas | barragens | outorgas | ANEEL | dados abertos",
            "data_product_types":"datasets administrativos | séries | cadastros | indicadores | catálogos regulatórios | dados geoespaciais",
            "data_formats":"CSV | XML | ZIP | PARQUET | PDF; varia conforme o conjunto",
            "visualization_types":"catálogo CKAN | pré-visualização tabular | painéis conforme produto",
            "geographic_coverage":"Brasil",
            "covers_brazil":"sim",
            "spatial_resolution":"empreendimento, unidade geradora, município, UF, coordenadas ou ativo de transmissão conforme produto",
            "temporal_coverage":"séries históricas e registros correntes; varia por produto",
            "temporal_resolution":"diária | quinzenal | mensal | trimestral | anual conforme produto",
            "data_sources":"registros regulatórios da ANEEL | agentes do setor elétrico | sistemas de geração e transmissão | fiscalização | declarações administrativas",
            "free_download":"sim",
            "access_conditions":"acesso público; preservar dicionário, versão, data de atualização, natureza administrativa e regras específicas de cada conjunto",
            "programmatic_access":"sim",
            "access_protocols":"HTTPS download | CKAN API",
            "authentication_required":"não",
            "access_documentation_url":"https://dadosabertos.aneel.gov.br/",
            "license":"Open Data Commons Open Database License (ODbL) no portal auditado; verificar o conjunto/recurso específico",
            "institutional_status":"público",
            "owner_or_manager":"Agência Nacional de Energia Elétrica — ANEEL / Ministério de Minas e Energia — Brasil",
            "academic_uses":"Análises de matriz elétrica, infraestrutura energética, geração distribuída, expansão da transmissão, regulação, segurança de barragens, uso de recursos hídricos e planejamento territorial.",
            "limitations":"Os conjuntos são majoritariamente administrativos/regulatórios. Cadastro, outorga, liberação ou fiscalização não equivalem automaticamente a geração efetiva, operação contínua, impacto ambiental observado ou conformidade permanente. Cobertura, atualização e granularidade variam por sistema.",
            "academic_evidence_type":"documentação oficial",
            "academic_evidence_url":"https://dadosabertos.aneel.gov.br/",
            "academic_evidence_note":"O Portal de Dados Abertos da ANEEL documenta conjuntos, dicionários, formatos, frequências de atualização, cobertura e licença ODbL para dados do setor elétrico.",
            "verification_url":"https://dadosabertos.aneel.gov.br/",
            "last_verified":DATE
          }]

          common_ra = "Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados"
          products = [
