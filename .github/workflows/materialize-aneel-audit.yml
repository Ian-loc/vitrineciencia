            {"product_id":"DP000558","resource_id":"DR0120","product_name":"Relação de empreendimentos de Mini e Micro Geração Distribuída — MMGD","product_acronym":"MMGD","product_family":"geração distribuída","product_kind":"dataset_series","product_description":"Relação nacional de conexões de microgeração e minigeração distribuída por unidade consumidora, com distribuidora, titular, fonte, potência instalada, data de conexão, município e UF, além de informações técnicas por tecnologia.","research_areas":common_ra,"keywords":"MMGD | microgeração | minigeração | geração distribuída | solar | eólica | hidrelétrica | termelétrica","geographic_coverage":"Brasil","covers_brazil":"sim","spatial_support":"unidade consumidora/empreendimento conectado","spatial_resolution":"município e UF; registro por empreendimento","temporal_coverage":"desde dezembro de 2008","temporal_resolution":"diária","update_frequency":"diária","product_status":"ativo","version_or_collection":"v2.1; atualizado em julho de 2026","enumeration_scope":"complete","product_page_url":"https://dadosabertos.aneel.gov.br/dataset/relacao-de-empreendimentos-de-geracao-distribuida","methodology_url":"https://dadosabertos.aneel.gov.br/dataset/relacao-de-empreendimentos-de-geracao-distribuida","primary_or_derived":"primário","limitations":"Registra conexões/cadastros de MMGD e potência instalada; não mede geração efetiva, energia compensada em cada período, autoconsumo instantâneo ou desempenho técnico do sistema. Dados cadastrais podem ser revisados.","last_verified":DATE},
