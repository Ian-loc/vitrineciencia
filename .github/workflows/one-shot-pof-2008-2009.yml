name: One-shot POF 2008-2009 catalog batch

on:
  push:
    branches:
      - agent/pof-batch-2008-2009

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified POF products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          ppath = Path('data/data_products.csv')
          dpath = Path('data/product_distributions.csv')

          with ppath.open(encoding='utf-8', newline='') as f:
              products = list(csv.DictReader(f))
              pfields = list(products[0].keys())
          with dpath.open(encoding='utf-8', newline='') as f:
              dists = list(csv.DictReader(f))
              dfields = list(dists[0].keys())

          existing_p = {r['product_id'] for r in products}
          existing_d = {r['distribution_id'] for r in dists}

          new_products = [
            {
              'product_id':'DP000274','resource_id':'DR0094','product_name':'POF 2017-2018 — Perfil das despesas: alimentação, transporte, lazer e inclusão financeira','product_acronym':'POF Despesas Temáticas','product_family':'POF 2017-2018 — despesas e condições de vida','product_kind':'dataset','product_description':'Publicação temática complementar da POF 2017-2018 sobre acesso a serviços financeiros e padrão de vida, alimentação, transporte, lazer e viagens, com estimativas para famílias e pessoas nas áreas urbana e rural.','research_areas':'Economics | Social statistics | Public policy | Well-being studies','keywords':'POF | inclusão financeira | alimentação | transporte | lazer | viagens | despesas | 2017-2018 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; situações urbana e rural e demais estratos oficialmente divulgados','covers_brazil':'sim','spatial_support':'famílias e pessoas amostradas | estimativas agregadas | tabelas','spatial_resolution':'Brasil e Grandes Regiões; demais recortes conforme tabelas','temporal_coverage':'POF 2017-2018','temporal_resolution':'períodos de referência próprios por item de despesa e variável','update_frequency':'por edição/estudo temático','product_status':'ativo','version_or_collection':'POF 2017-2018; divulgação temática 19/08/2021','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/servicos/24786-pesquisa-de-orcamentos-familiares-2.html?edicao=31309','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/24786-pof-2017-2018.html','primary_or_derived':'derivado','limitations':'Complementa o perfil de despesas já divulgado em outro volume e não deve ser fundido com renda, consumo alimentar individual ou registros administrativos de transações. Estimativas dependem do desenho amostral e de períodos de referência específicos.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000275','resource_id':'DR0094','product_name':'POF 2008-2009 — Despesas, rendimentos e condições de vida','product_acronym':'POF 2008-2009 Despesas','product_family':'POF 2008-2009 — resultados gerais','product_kind':'dataset','product_description':'Resultados da POF 2008-2009 sobre despesas, rendimentos, variação patrimonial e avaliação subjetiva das condições de vida das famílias, com diferentes detalhamentos geográficos.','research_areas':'Economics | Social statistics | Public policy | Well-being studies','keywords':'POF | despesas | rendimento | orçamento familiar | condições de vida | 2008-2009 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; situações urbana e rural conforme divulgação','covers_brazil':'sim','spatial_support':'famílias, domicílios e pessoas amostrados | estimativas agregadas | tabelas | microdados','spatial_resolution':'Brasil, Grandes Regiões e UFs; demais níveis apenas quando disponibilizados','temporal_coverage':'2008-2009, com períodos de referência próprios por variável','temporal_resolution':'levantamento por edição com diferentes períodos de recordação','update_frequency':'por edição da POF','product_status':'ativo','version_or_collection':'POF 2008-2009','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/multidominio/ciencia-tecnologia-e-inovacao/9050-pesquisa-de-orcamentos-familiares.html?edicao=9061','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9050-pesquisa-de-orcamentos-familiares.html','primary_or_derived':'derivado','limitations':'Estimativas amostrais e históricas; despesas, rendimentos e avaliação subjetiva têm conceitos e períodos de referência próprios. Não equivalem a registros administrativos nem descrevem a situação econômica atual.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000276','resource_id':'DR0094','product_name':'POF 2008-2009 — Aquisição alimentar domiciliar per capita: Brasil e Grandes Regiões','product_acronym':'POF 2008-2009 Aquisição Alimentar','product_family':'POF 2008-2009 — alimentação e nutrição','product_kind':'dataset','product_description':'Resultados sobre quantidades de alimentos e bebidas adquiridas pelas famílias para consumo no domicílio, por recortes geográficos, classes de rendimento e formas de aquisição.','research_areas':'Nutrition | Public health | Social statistics | Food systems','keywords':'POF | aquisição alimentar | alimentos | bebidas | domicílios | per capita | 2008-2009 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; situações urbana e rural e classes de rendimento conforme tabelas','covers_brazil':'sim','spatial_support':'domicílios e famílias amostrados | aquisições agregadas | estimativas per capita','spatial_resolution':'Brasil e Grandes Regiões; demais recortes conforme tabelas','temporal_coverage':'POF 2008-2009','temporal_resolution':'períodos de aquisição definidos pela POF','update_frequency':'por edição/estudo temático','product_status':'ativo','version_or_collection':'POF 2008-2009','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/protecao-social/9050-pesquisa-de-orcamentos-familiares.html?edicao=9059','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9050-pesquisa-de-orcamentos-familiares.html','primary_or_derived':'derivado','limitations':'Aquisição para consumo domiciliar não equivale ao consumo alimentar individual efetivamente ingerido, à disponibilidade territorial de alimentos ou à produção agrícola.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000277','resource_id':'DR0094','product_name':'POF 2008-2009 — Avaliação nutricional da disponibilidade domiciliar de alimentos no Brasil','product_acronym':'POF 2008-2009 Disponibilidade Nutricional','product_family':'POF 2008-2009 — alimentação e nutrição','product_kind':'dataset','product_description':'Avaliação nutricional derivada da disponibilidade de alimentos para consumo nos domicílios, construída a partir das aquisições registradas na POF 2008-2009.','research_areas':'Nutrition | Public health | Social statistics | Food systems','keywords':'POF | disponibilidade alimentar | avaliação nutricional | domicílios | nutrientes | 2008-2009 | IBGE','geographic_coverage':'Brasil; Grandes Regiões e estratos oficialmente divulgados','covers_brazil':'sim','spatial_support':'domicílios e famílias amostrados | disponibilidade alimentar derivada | estimativas agregadas','spatial_resolution':'Brasil e Grandes Regiões; demais estratos conforme publicação','temporal_coverage':'POF 2008-2009','temporal_resolution':'por edição da POF','update_frequency':'por edição/estudo temático','product_status':'ativo','version_or_collection':'POF 2008-2009','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/2004-pesquisa-de-orcamentos-familiares/9050-pesquisa-de-orcamentos-familiares.html?edicao=9060','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9050-pesquisa-de-orcamentos-familiares.html','primary_or_derived':'derivado','limitations':'Disponibilidade nutricional domiciliar é inferida de aquisições e não equivale a ingestão individual, biomarcadores, diagnóstico nutricional ou oferta física territorial de alimentos.','last_verified':'2026-08-16'
            },
