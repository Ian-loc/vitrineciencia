            {'distribution_id':'DD000300','product_id':'DP000279','distribution_name':'POF 2008-2009 — antropometria e estado nutricional — tabelas, publicação e microdados','access_url':'https://www.ibge.gov.br/estatisticas/todos-os-produtos-estatisticas/9050-pesquisa-de-orcamentos-familiares.html?edicao=9058','format':'XLS | ZIP | PDF | microdados','access_protocol':'HTTPS web | HTTP/HTTPS download','access_tool':'navegador web | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'download público; interpretar medidas e índices segundo idade, sexo e padrão de referência','license':'licença específica do arquivo não localizada nesta auditoria; preservar atribuição IBGE','provider_attribution_required':'sim','subset_support':'por tabelas, publicação e microdados','notes':'Inclui coeficientes de variação para estimativas selecionadas; não usar como estado nutricional contemporâneo.','last_verified':'2026-08-16'}
          ]

          assert not (existing_p & {r['product_id'] for r in new_products}), 'product ID collision'
          assert not (existing_d & {r['distribution_id'] for r in new_dists}), 'distribution ID collision'

          products.extend(new_products)
          dists.extend(new_dists)
          with ppath.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=pfields, lineterminator='\n')
              w.writeheader(); w.writerows(products)
          with dpath.open('w', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=dfields, lineterminator='\n')
              w.writeheader(); w.writerows(dists)
          print('appended', len(new_products), 'products and', len(new_dists), 'distributions')
          PY
      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Commit materialized batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-pof-2008-2009.yml
          git add data/data_products.csv data/data_products.json data/product_distributions.csv
          git commit -m 'Expand verified POF historical catalog'
          git push origin HEAD:agent/pof-batch-2008-2009
