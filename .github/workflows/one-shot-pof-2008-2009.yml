            },
            {
              'product_id':'DP000279','resource_id':'DR0094','product_name':'POF 2008-2009 — Antropometria e estado nutricional de crianças, adolescentes e adultos no Brasil','product_acronym':'POF 2008-2009 Antropometria','product_family':'POF 2008-2009 — antropometria e nutrição','product_kind':'dataset','product_description':'Resultados de medidas antropométricas e avaliação do estado nutricional de crianças, adolescentes e adultos investigados na POF 2008-2009, com índices antropométricos e padrões de referência específicos.','research_areas':'Nutrition | Public health | Demography | Social statistics','keywords':'POF | antropometria | peso | altura | estado nutricional | crianças | adolescentes | adultos | 2008-2009 | IBGE','geographic_coverage':'Brasil; situações urbana e rural; Grandes Regiões e Unidades da Federação conforme divulgação','covers_brazil':'sim','spatial_support':'pessoas amostradas | medidas antropométricas | estimativas agregadas','spatial_resolution':'Brasil, Grandes Regiões e Unidades da Federação conforme tabela','temporal_coverage':'POF 2008-2009','temporal_resolution':'medidas coletadas durante a edição da pesquisa','update_frequency':'por edição/estudo temático','product_status':'ativo','version_or_collection':'POF 2008-2009','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/todos-os-produtos-estatisticas/9050-pesquisa-de-orcamentos-familiares.html?edicao=9058','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9050-pesquisa-de-orcamentos-familiares.html','primary_or_derived':'derivado','limitations':'É um retrato antropométrico histórico da POF 2008-2009. Classificações dependem de idade, sexo, índices e padrões de referência; não equivalem a diagnóstico clínico individual nem a estado nutricional atual da população.','last_verified':'2026-08-16'
            }
          ]

          new_dists = [
            {'distribution_id':'DD000295','product_id':'DP000274','distribution_name':'POF 2017-2018 — alimentação, transporte, lazer e inclusão financeira — tabelas e publicação','access_url':'https://www.ibge.gov.br/estatisticas/economicas/servicos/24786-pesquisa-de-orcamentos-familiares-2.html?edicao=31309','format':'XLSX | ODS | PDF','access_protocol':'HTTPS web | HTTP/HTTPS download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público; observar desenho amostral e conceitos por dimensão','license':'licença específica do arquivo não localizada nesta auditoria; preservar atribuição IBGE','provider_attribution_required':'sim','subset_support':'por tabelas e publicação','notes':'Publicação complementar sobre quatro dimensões adicionais do perfil de despesas; não fundir automaticamente com o volume anterior.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000296','product_id':'DP000275','distribution_name':'POF 2008-2009 — despesas, rendimentos e condições de vida — tabelas e microdados','access_url':'https://www.ibge.gov.br/estatisticas/multidominio/ciencia-tecnologia-e-inovacao/9050-pesquisa-de-orcamentos-familiares.html?edicao=9061','format':'XLS | ZIP | PDF | microdados e documentação','access_protocol':'HTTPS web | HTTP/HTTPS download','access_tool':'navegador web | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'download público; aplicar pesos, desenho amostral e períodos de referência','license':'licença específica do arquivo não localizada nesta auditoria; preservar atribuição IBGE','provider_attribution_required':'sim','subset_support':'por tabelas, publicação e microdados','notes':'Inclui tabelas de despesas, rendimentos, avaliação subjetiva e coeficientes de variação; produto histórico.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000297','product_id':'DP000276','distribution_name':'POF 2008-2009 — aquisição alimentar domiciliar per capita — tabelas e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/protecao-social/9050-pesquisa-de-orcamentos-familiares.html?edicao=9059','format':'XLS | ZIP | PDF','access_protocol':'HTTPS web | HTTP/HTTPS download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público; observar classificação dos alimentos, formas de aquisição e pesos','license':'licença específica do arquivo não localizada nesta auditoria; preservar atribuição IBGE','provider_attribution_required':'sim','subset_support':'por tabelas e publicação','notes':'Aquisição domiciliar não representa consumo individual efetivamente ingerido.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000298','product_id':'DP000277','distribution_name':'POF 2008-2009 — avaliação nutricional da disponibilidade domiciliar — tabelas e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/2004-pesquisa-de-orcamentos-familiares/9050-pesquisa-de-orcamentos-familiares.html?edicao=9060','format':'XLS | ZIP | PDF','access_protocol':'HTTPS web | HTTP/HTTPS download','access_tool':'navegador web','free_download':'sim','authentication_required':'não','access_conditions':'download público; preservar metodologia de conversão de aquisições em disponibilidade nutricional','license':'licença específica do arquivo não localizada nesta auditoria; preservar atribuição IBGE','provider_attribution_required':'sim','subset_support':'por tabelas e publicação','notes':'Indicadores são derivados de disponibilidade domiciliar e não de ingestão pessoal medida.','last_verified':'2026-08-16'},
