name: QA/QC materialize verified link roles on PR

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'qa/resolve-remaining-link-roles-20260819'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Registrar exceções IBGE verificadas
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/link_role_exceptions.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          items = payload.setdefault('reviewed_same_destination', [])
          by_id = {item['resource_id']: item for item in items}

          additions = [
            ('DR0072', 'A página temática Estatísticas e Indicadores Ambientais é o índice oficial da família no portal IBGE: nela o Instituto lista os principais produtos do tema, cujas fichas individuais concentram tabelas, Acesso ao produto e Downloads. Como a fonte representa a família temática e não um único dataset, a mesma landing page cumpre legitimamente apresentação e descoberta/acesso.', 'https://www.ibge.gov.br/geociencias/informacoes-ambientais/estatisticas-e-indicadores-ambientais.html'),
            ('DR0073', 'Estudos Ambientais é uma família temática do portal IBGE. A própria landing page lista PEERS, Grade Estatística de Dados Ambientais, Biomas, Contas Econômicas Ambientais, Bacias e Divisões Hidrográficas, População em Áreas de Risco, ZEE e outros produtos; cada ficha filha concentra seus acessos. No nível da fonte-família, manter a mesma URL para apresentação e acesso de descoberta é deliberado.', 'https://www.ibge.gov.br/geociencias/informacoes-ambientais/estudos-ambientais.html'),
            ('DR0074', 'Informações Ambientais — Mapas e Produtos Cartográficos é uma página temática que reúne e encaminha aos produtos cartográficos ambientais do IBGE, incluindo Biomas, Bacias e Divisões Hidrográficas, Monitoramento da Cobertura e Uso da Terra, Fauna Ameaçada, Relevo, Vegetação, Clima e Solos. A landing page é simultaneamente apresentação institucional e índice oficial de acesso aos produtos.', 'https://www.ibge.gov.br/geociencias/cartas-e-mapas/informacoes-ambientais.html'),
            ('DR0081', 'Redes e Fluxos Geográficos é uma família de estudos do IBGE. A própria página temática lista os produtos do tema, como Logística dos Transportes, Gestão do Território, Quadro Geográfico de Referência, Ligações Aéreas e REGIC; as fichas de produto oferecem Acesso ao produto/Downloads. Não existe um único arquivo representativo da família, por isso a mesma landing page é o ponto institucional e de descoberta/acesso.', 'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/redes-e-fluxos-geograficos/2282-np-regioes-de-influencia-das-cidades.html'),
            ('DR0082', 'Tipologias do Território é uma página temática de família no portal IBGE. Ela organiza tipologias e estudos territoriais distintos, cujos acessos ficam nas fichas individuais; no nível da fonte-família, usar a mesma landing page para homepage e acesso de descoberta evita escolher arbitrariamente um único produto como representante.', 'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/tipologias-do-territorio.html'),
            ('DR0083', 'Sociedade e Economia é uma família cartográfica do IBGE. A página temática lista explicitamente produtos como Mapa Índice Digital, Indicações Geográficas, Densidade Demográfica e mapas derivados de censos e estatísticas econômicas. Como índice oficial da família, a mesma URL funciona legitimamente como apresentação e descoberta/acesso aos produtos.', 'https://www.ibge.gov.br/geociencias/cartas-e-mapas/sociedade-e-economia.html'),
            ('DR0087', 'Estatísticas Agropecuárias representa uma família de operações do IBGE, não um dataset único. A estrutura temática encaminha a produtos como LSPA, PAM, PPM e demais pesquisas agropecuárias, cujas fichas fornecem tabelas, séries e Downloads. Manter a landing page temática como homepage e acesso de descoberta é consistente com a granularidade da fonte.', 'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html'),
            ('DR0091', 'A página temática População do IBGE funciona como portal de descoberta das operações demográficas, exibindo indicadores, calendário e produtos como Estimativas e Projeções da População, cujas fichas disponibilizam tabelas e Downloads. Como a fonte representa a família demográfica, a mesma landing page cumpre legitimamente apresentação e acesso de descoberta.', 'https://www.ibge.gov.br/estatisticas/sociais/populacao.html'),
            ('DR0092', 'Saúde é uma página temática de família do IBGE que lista explicitamente PeNSE, POF, PNS e outras operações relacionadas. Os dados e Downloads permanecem nas fichas individuais; no nível da fonte-família, a mesma URL é simultaneamente apresentação institucional e índice oficial para os acessos.', 'https://www.ibge.gov.br/estatisticas/sociais/saude.html'),
            ('DR0095', 'Sínteses e Indicadores Sociais é uma família de sínteses do eixo População. A ficha da Síntese de Indicadores Sociais reúne tabelas, publicações e Downloads; a landing page temática População organiza esse conjunto e outros indicadores sociais. No nível da fonte-família, manter a mesma URL para homepage e acesso de descoberta é deliberado.', 'https://www.ibge.gov.br/estatisticas/sociais/populacao.html'),
            ('DR0098', 'Pesquisas Estruturais por Empresas é uma família de operações econômicas anuais, incluindo PIA-Empresa, PIA-Produto, PAIC, PAC e PAS. O portal econômico e as páginas setoriais encaminham às fichas individuais com séries, tabelas, SIDRA e documentação. Não há um único dataset que represente toda a família, por isso a landing page econômica também funciona como acesso de descoberta.', 'https://www.ibge.gov.br/estatisticas/economicas.html'),
            ('DR0099', 'Indicadores Conjunturais de Atividade Econômica reúne operações mensais distintas, como PIM-PF, PMC e PMS. A página econômica do IBGE organiza essas operações e suas fichas individuais oferecem resultados, séries, SIDRA e Downloads. Como fonte-família, a mesma landing page é legitimamente homepage e ponto de descoberta/acesso.', 'https://www.ibge.gov.br/estatisticas/economicas.html'),
            ('DR0100', 'Preços e Custos é uma página temática que lista IPCA, INPC, SINAPI, IPP, IPCA-15, IPCA-E e outros produtos. As fichas individuais concentram resultados e Downloads; no nível da família, a mesma página temática é simultaneamente apresentação e índice oficial de acesso.', 'https://www.ibge.gov.br/estatisticas/economicas/precos-e-custos.html'),
            ('DR0101', 'Contas Nacionais é uma família temática do IBGE que reúne SCN, SCNT, Contas Regionais, PIB dos Municípios, Matriz de Insumo-Produto e contas satélite. O portal lista esses produtos e encaminha às respectivas fichas e Downloads; portanto, a mesma landing page cumpre legitimamente os papéis de apresentação e acesso de descoberta.', 'https://www.ibge.gov.br/estatisticas/economicas/contas-nacionais.html'),
            ('DR0102', 'Finanças Públicas é uma página temática do IBGE que apresenta o tema e lista como principal produto Estatísticas de Finanças Públicas e Conta Intermediária de Governo, cuja ficha contém tabelas e Downloads. No nível da fonte temática, a mesma landing page é legitimamente homepage e acesso de descoberta.', 'https://www.ibge.gov.br/estatisticas/economicas/financas-publicas.html'),
          ]

          for resource_id, rationale, evidence_url in additions:
              if resource_id in by_id:
                  raise SystemExit(f'Exceção já existe: {resource_id}')
              items.append({
                  'resource_id': resource_id,
                  'rationale': rationale,
                  'evidence_url': evidence_url,
                  'reviewed_at': '2026-08-19',
              })

          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'OK: {len(additions)} exceções adicionadas; total={len(items)}')
          PY

      - name: Regenerar auditoria e executar gates canônicos
        run: |
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_schema_identity.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          node --check assets/app.js
          node --check assets/ptbr.js
          node --check assets/products.js
          node --check assets/analytics.js
          node --check assets/export-selective.js
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Confirmar zero expansão e fechamento da fila
        run: |
          git diff --exit-code 72de30e3e8277dfe45993b3e5fcb04891b6fa131 -- data/data_resources.csv data/data_products.csv data/product_distributions.csv
          python3 - <<'PY'
          import json
          a=json.load(open('data/link_role_audit.json', encoding='utf-8'))
          c=a['counts']
          assert c == {
            'separate_destinations': 93,
            'same_destination_reviewed_exception': 41,
            'same_destination_pending_review': 0,
            'data_access_not_applicable': 1,
          }, c
          assert not a['records_requiring_review']
          print('OK:', c)
          PY

      - name: Persistir somente QA e remover materializador temporário
        run: |
          rm -f .github/workflows/qa-resolve-link-roles-once.yml .github/workflows/qa-link-role-pr-materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/link_role_exceptions.json data/link_role_audit.json
          git add -u .github/workflows
          git commit -m "Resolve remaining verified IBGE link-role exceptions"
          git push origin HEAD:${{ github.head_ref }}
