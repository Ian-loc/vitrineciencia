name: Materializar lote IBGE referência risco hidrografia
on:
  push:
    branches: [audit/ibge-reference-risk-hydro-batch-20260815]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-reference-risk-hydro-batch-20260815
          fetch-depth: 0
      - name: Materializar lote
        run: |
          python3 scripts/materialize_ibge_reference_risk_hydro_batch.py
          python3 scripts/normalize_ibge_batch_line_endings.py
      - name: Validar catálogo
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json
          git commit -m "Adicionar lote IBGE de referência, risco e hidrografia" || exit 0
          git push origin HEAD:audit/ibge-reference-risk-hydro-batch-20260815
