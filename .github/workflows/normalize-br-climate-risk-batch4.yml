name: Normalizar lote clima e risco 4
on:
  push:
    branches: [data/br-climate-risk-batch-4]
    paths:
      - scripts/normalize_batch4_delta.py
      - .github/workflows/normalize-br-climate-risk-batch4.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/br-climate-risk-batch-4
          fetch-depth: 0
      - name: Normalizar e validar
        run: |
          python3 scripts/normalize_batch4_delta.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar normalização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Normalizar delta do lote clima e risco 4"
          git push origin HEAD:data/br-climate-risk-batch-4
