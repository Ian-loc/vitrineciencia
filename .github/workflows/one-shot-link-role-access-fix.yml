name: One-shot link-role access fix

on:
  push:
    branches:
      - agent/link-role-access-fixes-20260818
    paths:
      - .github/workflows/one-shot-link-role-access-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/link-role-access-fixes-20260818
          fetch-depth: 0

      - name: Patch source access URLs conservatively
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io

          path = Path('data/data_resources.csv')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          header = next(csv.reader([lines[0]]))
          rid_i = header.index('resource_id')
          access_i = header.index('data_access_url')

          changes = {
              'DR0007': ('https://urbverde.iau.usp.br/', 'https://urbverde.iau.usp.br/mapa'),
              'DR0011': ('https://terrabrasilis.dpi.inpe.br/', 'https://terrabrasilis.dpi.inpe.br/downloads/'),
              'DR0019': ('https://developers.google.com/earth-engine/datasets', 'https://developers.google.com/earth-engine/datasets/catalog'),
          }

          seen = set()
          out = [lines[0]]
          for raw in lines[1:]:
              row = next(csv.reader([raw]))
              rid = row[rid_i]
              if rid in changes:
                  expected, replacement = changes[rid]
                  actual = row[access_i]
                  if actual != expected:
                      raise SystemExit(f'{rid}: expected data_access_url {expected!r}, found {actual!r}')
                  row[access_i] = replacement
                  buf = io.StringIO(newline='')
                  csv.writer(buf, lineterminator='\n').writerow(row)
                  out.append(buf.getvalue())
                  seen.add(rid)
              else:
                  out.append(raw)

          missing = set(changes) - seen
          if missing:
              raise SystemExit(f'missing resource rows: {sorted(missing)}')

          path.write_text(''.join(out), encoding='utf-8', newline='')
          print('patched', ', '.join(sorted(seen)))
          PY

      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check

      - name: Assert audit improvement
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('data/link_role_audit.json').read_text(encoding='utf-8'))
          counts = p['counts']
          if counts.get('same_destination_pending_review') != 43:
              raise SystemExit(f"expected 43 same-destination pending reviews, got {counts.get('same_destination_pending_review')}")
          pending = {r['resource_id'] for r in p.get('records_requiring_review', [])}
          bad = {'DR0007','DR0011','DR0019'} & pending
          if bad:
              raise SystemExit(f'still pending after patch: {sorted(bad)}')
          print('link-role audit:', counts)
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/one-shot-link-role-access-fix.yml
          allowed='^(data/data_resources\.csv|data/data_products\.json|data/data_quality_report\.json|data/link_role_audit\.json|\.github/workflows/one-shot-link-role-access-fix\.yml)$'
          unexpected=$(git status --porcelain | sed 's/^...//' | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changed paths:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_resources.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git add -u .github/workflows/one-shot-link-role-access-fix.yml
          git diff --cached --check
          git status --short
          git commit -m 'Resolve verified source access link roles'
          git push origin HEAD:agent/link-role-access-fixes-20260818
