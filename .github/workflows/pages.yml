name: Validar e publicar Vitrine

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Privilégio mínimo por padrão. O job de deploy eleva apenas as permissões
# necessárias para publicar no GitHub Pages.
permissions:
  contents: read

concurrency:
  group: vitrine-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validar dados estáticos da Vitrine
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_schema_identity.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py

      - name: Confirmar derivados versionados sincronizados
        run: |
          git diff --check
          git diff --exit-code -- \
            data/data_resources.json \
            data/data_products.json \
            data/data_quality_report.json \
            data/link_role_audit.json

      - name: Validar interface e fronteira da Vitrine
        run: |
          python3 scripts/validate_vitrine.py
          node --check assets/app.js
          node --check assets/ptbr.js
          node --check assets/products.js
          node --check assets/analytics.js
          node --check assets/export-selective.js
          node --check assets/quality-summary.js
          node --check assets/build-meta.js

      - name: Construir artefato público isolado
        run: |
          python3 -m py_compile scripts/build_site_artifact.py
          python3 scripts/build_site_artifact.py

      - name: Confirmar fronteira pública
        run: |
          test -s _site/index.html
          test -s _site/products.html
          test -s _site/analytics.html
          test -s _site/about.html
          test -s _site/assets/visual-refinement.css
          test -s _site/assets/export-selective.css
          test -s _site/assets/app.js
          test -s _site/assets/ptbr.js
          test -s _site/assets/products.js
          test -s _site/assets/analytics.js
          test -s _site/assets/export-selective.js
          test -s _site/data/data_resources.json
          test -s _site/data/data_products.json
          test -s _site/data/brazil_scope_priorities.json
          test ! -e _site/data/data_resources.csv
          test ! -e _site/data/data_products.csv
          test ! -e _site/data/product_distributions.csv
          test ! -e _site/explorer.html
          test ! -e _site/abordagens.html
          test ! -e _site/data/federated_layers.json
          test ! -e _site/data/build-meta.json
          test ! -e _site/assets/explorer.js
          test ! -e _site/assets/explorer.css
          test ! -e _site/assets/approaches.css
          test ! -e _site/assets/quality-summary.js
          test ! -e _site/assets/build-meta.js
          test ! -e _site/database
          test ! -e _site/scripts
          test ! -e _site/.github
          test ! -e _site/docs
          test ! -e _site/config
          ! grep -R -n -E 'Simbiotrama|Simbioscópio|Simbioscopio' _site/index.html _site/products.html _site/analytics.html _site/about.html
          ! grep -R -n -E 'data/data_resources\.csv|data/data_products\.csv|data/product_distributions\.csv' _site/index.html _site/products.html _site/analytics.html _site/about.html

      # O mesmo _site que passou por todas as validações acima é o artefato
      # entregue ao job de deploy. Isso elimina um segundo build independente.
      - name: Enviar artefato validado da Vitrine
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-vitrine
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publicar artefato previamente validado
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar endereço publicado
        run: echo "Vitrine publicada em ${{ steps.deployment.outputs.page_url }}"