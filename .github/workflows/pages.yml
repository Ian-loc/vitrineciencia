name: Validar e publicar Vitrine

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vitrine-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materializar lote PDET verificado
        if: github.event_name == 'push'
        run: python3 scripts/one_shot_pdet.py

      - name: Validar dados estáticos da Vitrine
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write

      - name: Validar interface e fronteira da Vitrine
        run: |
          python3 scripts/validate_vitrine.py
          node --check assets/app.js
          node --check assets/products.js
          node --check assets/analytics.js
          node --check assets/quality-summary.js
          node --check assets/build-meta.js

      - name: Construir artefato público isolado
        run: |
          python3 -m py_compile scripts/build_site_artifact.py
          python3 scripts/build_site_artifact.py

      - name: Confirmar fronteira pública
        run: |
          test -s _site/index.html
          test -s _site/products.html
          test -s _site/analytics.html
          test -s _site/about.html
          test -s _site/assets/visual-refinement.css
          test -s _site/assets/app.js
          test -s _site/assets/products.js
          test -s _site/assets/analytics.js
          test -s _site/data/data_resources.csv
          test -s _site/data/data_resources.json
          test -s _site/data/data_products.csv
          test -s _site/data/data_products.json
          test -s _site/data/product_distributions.csv
          test -s _site/data/brazil_scope_priorities.json
          test ! -e _site/explorer.html
          test ! -e _site/abordagens.html
          test ! -e _site/data/federated_layers.json
          test ! -e _site/data/build-meta.json
          test ! -e _site/assets/explorer.js
          test ! -e _site/assets/explorer.css
          test ! -e _site/assets/approaches.css
          test ! -e _site/assets/quality-summary.js
          test ! -e _site/assets/build-meta.js
          test ! -e _site/database
          test ! -e _site/scripts
          test ! -e _site/.github
          test ! -e _site/docs
          test ! -e _site/config
          ! grep -R -n -E 'Simbiotrama|Simbioscópio|Simbioscopio' _site/index.html _site/products.html _site/analytics.html _site/about.html

      - name: Read-back consolidado PDET
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def read(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          s=read('data/data_resources.csv'); p=read('data/data_products.csv'); d=read('data/product_distributions.csv')
          assert len(s)==127, len(s)
          assert len(p)==790, len(p)
          assert len(d)==823, len(d)
          assert any(x['resource_id']=='DR0127' for x in s)
          assert all(any(x['product_id']==f'DP{i:06d}' for x in p) for i in range(801,809))
          assert all(any(x['distribution_id']==f'DD{i:06d}' for x in d) for i in range(832,842))
          assert len({x['resource_id'] for x in s})==len(s)
          assert len({x['product_id'] for x in p})==len(p)
          assert len({x['distribution_id'] for x in d})==len(d)
          print('READBACK_OK', len(s), len(p), len(d))
          PY
          git diff --check

      - name: Persistir lote e restaurar pipeline permanente
        if: github.event_name == 'push'
        run: |
          git config user.name "Vitrine Science Bot"
          git config user.email "actions@users.noreply.github.com"
          git show HEAD^:.github/workflows/pages.yml > .github/workflows/pages.yml
          git rm -f scripts/one_shot_pdet.py .github/workflows/automation-pdet-batch-v2.yml
          git add .github/workflows/pages.yml data/data_resources.csv data/data_resources.json data/data_products.csv data/data_products.json data/product_distributions.csv data/brazil_scope_priorities.json data/data_quality_report.json data/link_role_audit.json
          git commit -m "Expand verified MTE labor-statistics catalog"
          git push origin HEAD:main

  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate-vitrine]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Gerar e validar Vitrine
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato da Vitrine
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar Vitrine no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar endereço publicado
        run: echo "Vitrine publicada em ${{ steps.deployment.outputs.page_url }}"
