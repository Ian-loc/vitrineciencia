name: Validar e publicar Vitrine

on:
  push:
    branches: ["main", "release/v1.0.0"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrine-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validar corpus vivo e gerar derivados
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_schema_identity.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_active_documentation.py
          python3 scripts/validate_doi_readiness.py
          git diff --check

      - name: Validar interface e fronteira da Vitrine
        run: |
          python3 scripts/validate_vitrine.py
          node --check assets/app.js
          node --check assets/ptbr.js
          node --check assets/products.js
          node --check assets/product-label-fix.js
          node --check assets/navigation.js
          node --check assets/home.js
          node --check assets/analytics.js
          node --check assets/analytics-products.js
          node --check assets/export-selective.js
          node --check assets/source-comparison.js
          node --check assets/quality-summary.js
          node --check assets/build-meta.js
          node --check assets/discovery-guardrails.js

      - name: Construir artefato público isolado
        run: |
          python3 -m py_compile scripts/build_site_artifact.py
          python3 scripts/build_site_artifact.py

      - name: Confirmar fronteira pública
        run: |
          test -s _site/index.html
          test -s _site/products.html
          test -s _site/sources.html
          test -s _site/analytics.html
          test -s _site/analytics-products.html
          test -s _site/about.html
          test -s _site/assets/discovery-guardrails.js
          test -s _site/assets/discovery-guardrails.css
          test -s _site/data/data_resources.json
          test -s _site/data/data_products.json
          test -s _site/data/brazil_scope_priorities.json
          test ! -e _site/data/data_resources.csv
          test ! -e _site/data/data_products.csv
          test ! -e _site/data/product_distributions.csv
          test ! -e _site/data/quarantine
          test ! -e _site/explorer.html
          test ! -e _site/abordagens.html
          test ! -e _site/database
          test ! -e _site/scripts
          test ! -e _site/.github
          test ! -e _site/docs
          ! grep -R -n -E 'Simbiotrama|Simbioscópio|Simbioscopio' _site/index.html _site/products.html _site/sources.html _site/analytics.html _site/analytics-products.html _site/about.html

      - name: Enviar artefato validado da Vitrine
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate-vitrine
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
      - name: Publicar artefato previamente validado
        id: deployment
        uses: actions/deploy-pages@v5
