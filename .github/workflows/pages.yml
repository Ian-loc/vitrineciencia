name: Validar e publicar Vitrine

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vitrine-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-vitrine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Materializar lote BIG somente no PR de auditoria
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'audit-big-mosaics-20260818'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/materialize-big-mosaics-20260818.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/append_big_mosaics.py').write_text(block + '\n')
          PY
          python3 /tmp/append_big_mosaics.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def read(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          r,p,d=read('data/data_resources.csv'),read('data/data_products.csv'),read('data/product_distributions.csv')
          wanted_p={f'DP{i:06d}' for i in range(701,713)}
          wanted_d={f'DD{i:06d}' for i in range(731,743)}
          assert wanted_p <= {x['product_id'] for x in p}
          assert wanted_d <= {x['distribution_id'] for x in d}
          assert all(x['resource_id']=='DR0123' for x in p if x['product_id'] in wanted_p)
          assert all(x['product_id'] in wanted_p for x in d if x['distribution_id'] in wanted_d)
          print('COUNTS',len(r),len(p),len(d))
          PY
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
            git commit -m 'Expand verified BIG mosaic catalog'
            git push origin HEAD:audit-big-mosaics-20260818
          fi

      - name: Validar dados estáticos da Vitrine
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py

      - name: Validar interface e fronteira da Vitrine
        run: |
          python3 scripts/validate_vitrine.py
          node --check assets/app.js
          node --check assets/products.js
          node --check assets/analytics.js
          node --check assets/quality-summary.js
          node --check assets/build-meta.js

      - name: Construir artefato público isolado
        run: |
          python3 -m py_compile scripts/build_site_artifact.py
          python3 scripts/build_site_artifact.py

      - name: Confirmar fronteira pública
        run: |
          test -s _site/index.html
          test -s _site/products.html
          test -s _site/analytics.html
          test -s _site/about.html
          test -s _site/assets/visual-refinement.css
          test -s _site/assets/app.js
          test -s _site/assets/products.js
          test -s _site/assets/analytics.js
          test -s _site/data/data_resources.csv
          test -s _site/data/data_resources.json
          test -s _site/data/data_products.csv
          test -s _site/data/data_products.json
          test -s _site/data/product_distributions.csv
          test -s _site/data/brazil_scope_priorities.json
          test ! -e _site/explorer.html
          test ! -e _site/abordagens.html
          test ! -e _site/data/federated_layers.json
          test ! -e _site/data/build-meta.json
          test ! -e _site/assets/explorer.js
          test ! -e _site/assets/explorer.css
          test ! -e _site/assets/approaches.css
          test ! -e _site/assets/quality-summary.js
          test ! -e _site/assets/build-meta.js
          test ! -e _site/database
          test ! -e _site/scripts
          test ! -e _site/.github
          test ! -e _site/docs
          test ! -e _site/config
          ! grep -R -n -E 'Simbiotrama|Simbioscópio|Simbioscopio' _site/index.html _site/products.html _site/analytics.html _site/about.html

  deploy:
    if: github.event_name != 'pull_request'
    needs: [validate-vitrine]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Gerar e validar Vitrine
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato da Vitrine
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar Vitrine no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Registrar endereço publicado
        run: echo "Vitrine publicada em ${{ steps.deployment.outputs.page_url }}"
