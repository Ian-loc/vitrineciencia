name: Materialize SINIMA audit batch

on:
  pull_request:
    types: [opened]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materializar lote SINIMA/MMA
        run: python3 scripts/materialize_sinima_mma_20260819.py
      - name: Commitar dados validados no branch do PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_resources.json data/data_products.csv data/data_products.json data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json data/data_quality_report.json
          git status --short
          git commit -m "Expand verified SINIMA environmental catalog"
          git push origin HEAD:${{ github.head_ref }}
