name: Materialize BIG mosaics via PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.big-mosaics-trigger'
      - '.github/workflows/materialize-big-mosaics-20260818.yml'
      - '.github/workflows/materialize-big-mosaics-pr.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit-big-mosaics-20260818'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-big-mosaics-20260818
          fetch-depth: 0

      - name: Execute reviewed append block
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/materialize-big-mosaics-20260818.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/append_big_mosaics.py').write_text(block + '\n')
          PY
          python3 /tmp/append_big_mosaics.py

      - name: Validate and rebuild
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read back exact batch
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          with Path('data/data_products.csv').open(encoding='utf-8-sig', newline='') as f:
              p=list(csv.DictReader(f))
          with Path('data/product_distributions.csv').open(encoding='utf-8-sig', newline='') as f:
              d=list(csv.DictReader(f))
          with Path('data/data_resources.csv').open(encoding='utf-8-sig', newline='') as f:
              r=list(csv.DictReader(f))
          wanted_p={f'DP{i:06d}' for i in range(701,713)}
          wanted_d={f'DD{i:06d}' for i in range(731,743)}
          assert wanted_p <= {x['product_id'] for x in p}
          assert wanted_d <= {x['distribution_id'] for x in d}
          assert all(x['resource_id']=='DR0123' for x in p if x['product_id'] in wanted_p)
          assert all(x['product_id'] in wanted_p for x in d if x['distribution_id'] in wanted_d)
          print('COUNTS', len(r), len(p), len(d))
          print('BATCH', len(wanted_p), len(wanted_d))
          PY

      - name: Commit materialized batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          git commit -m 'Expand verified BIG mosaic catalog'
          git push origin HEAD:audit-big-mosaics-20260818
