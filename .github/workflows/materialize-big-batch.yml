          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Consolidated read-back
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len(s)==123 and len(p)==660 and len(d)==690, (len(s),len(p),len(d))
          sids={r['resource_id'] for r in s}; pids={r['product_id'] for r in p}; dids={r['distribution_id'] for r in d}
          assert len(sids)==len(s) and len(pids)==len(p) and len(dids)==len(d)
          assert all(r['resource_id'] in sids for r in p)
          assert all(r['product_id'] in pids for r in d)
          for n in range(651,665): assert f'DP{n:06d}' in pids
          for n in range(676,695): assert f'DD{n:06d}' in dids
          q=json.loads(Path('data/data_quality_report.json').read_text())
          assert q['records']==123 and q['brazil_applicable_records']==120
          print('READBACK_OK 123 sources / 660 products / 690 distributions')
          PY

