name: Materialize verified BIG climate and ocean batch

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/materialize-big-batch.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified products and distributions
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path('.')
          product_path = root / 'data' / 'data_products.csv'
          dist_path = root / 'data' / 'product_distributions.csv'

          with product_path.open(encoding='utf-8-sig', newline='') as f:
              products = list(csv.DictReader(f))
          with dist_path.open(encoding='utf-8-sig', newline='') as f:
              dists = list(csv.DictReader(f))

          product_fields = list(products[0].keys())
          dist_fields = list(dists[0].keys())
          product_ids = {r['product_id'] for r in products}
          dist_ids = {r['distribution_id'] for r in dists}
          urls = {r['product_page_url'] for r in products}

          if 'DR0123' not in {r['resource_id'] for r in products}:
              raise SystemExit('DR0123 absent from product catalog')
          if max(int(x[2:]) for x in product_ids) != 650:
              raise SystemExit('Unexpected current max product id; refusing non-atomic append')
          if max(int(x[2:]) for x in dist_ids) != 675:
              raise SystemExit('Unexpected current max distribution id; refusing non-atomic append')

          P = [
          ['DP000651','DR0123','Projeções Climáticas Regionais Eta/CMIP5 — RCP4.5 e RCP8.5','Eta CMIP5','BIG — projeções climáticas regionais','dataset_series','Projeções climáticas regionais de alta resolução produzidas pelo INPE com downscaling dinâmico do modelo Eta para quatro modelos globais CMIP5 e cenários RCP4.5/RCP8.5.','Climate science | Atmospheric science | Environmental modeling','Eta | CMIP5 | RCP4.5 | RCP8.5 | climate projection | downscaling','América do Sul, América Central e Caribe a 20 km; Sudeste do Brasil a 5 km no Eta-HadGEM2-ES','sim','grade de modelo climático regional','20 km no domínio regional; 5 km no Sudeste do Brasil apenas para Eta-HadGEM2-ES','histórico 1961–2005; projeções 2006–2100','diária','por versão/experimento','ativo','Eta v1 / CMIP5 / RCP4.5 e RCP8.5','complete','https://data.inpe.br/dados/modelo-eta/','https://data.inpe.br/dados/modelo-eta/','derivado','Cenários climáticos não são previsões determinísticas. O downscaling herda vieses dos GCMs e do modelo regional; a grade de 5 km não existe para todos os GCMs/domínios e não implica precisão local de 5 km.','2026-08-18'],
          ['DP000652','DR0123','MODIS Terra MOD13Q1 v061 — NDVI/EVI 16 dias','MOD13Q1 v061','BIG — índices de vegetação MODIS','dataset_series','Produto MODIS/Terra Level-3 de índices de vegetação NDVI e EVI composto a cada 16 dias, acompanhado por bandas de qualidade, refletâncias e geometria de observação.','Remote sensing | Vegetation dynamics | Environmental monitoring','MODIS | Terra | MOD13Q1 | NDVI | EVI | vegetation index | quality','Brasil e área regional coberta pela coleção INPE','sim','tile raster MODIS | coleção STAC','250 m nominal; GSD documentado ~231,656 m','2000-02-18–2026-06-09 na coleção verificada','16 dias','16 dias conforme disponibilidade de novos compostos','ativo','Collection 6.1 / MOD13Q1 v061','complete','https://data.inpe.br/stac/browser/collections/mod13q1-6.1','https://data.inpe.br/stac/browser/collections/mod13q1-6.1','derivado','NDVI/EVI são índices compostos, não medições diretas de biomassa ou cobertura. A seleção do melhor pixel depende de nuvens, ângulo de visada e valor do índice; usar VI_Quality e pixel_reliability.','2026-08-18'],
          ['DP000653','DR0123','MODIS Aqua MYD13Q1 v061 — NDVI/EVI 16 dias','MYD13Q1 v061','BIG — índices de vegetação MODIS','dataset_series','Produto MODIS/Aqua Level-3 de índices de vegetação NDVI e EVI composto a cada 16 dias, acompanhado por bandas de qualidade, refletâncias e geometria de observação.','Remote sensing | Vegetation dynamics | Environmental monitoring','MODIS | Aqua | MYD13Q1 | NDVI | EVI | vegetation index | quality','Brasil e área regional coberta pela coleção INPE','sim','tile raster MODIS | coleção STAC','250 m nominal; GSD documentado ~231,656 m','2002-07-04–2026-06-01 na coleção verificada','16 dias','16 dias conforme disponibilidade de novos compostos','ativo','Collection 6.1 / MYD13Q1 v061','complete','https://data.inpe.br/stac/browser/collections/myd13q1-6.1','https://data.inpe.br/stac/browser/collections/myd13q1-6.1','derivado','NDVI/EVI são índices compostos e não medições diretas de biomassa. Terra e Aqua têm horários de passagem e séries distintas; não combinar MOD13Q1 e MYD13Q1 sem harmonização temporal e controle de qualidade.','2026-08-18'],
          ['DP000654','DR0123','MODIS Terra MOD11A2 v061 — Temperatura da Superfície e Emissividade','MOD11A2 v061','BIG — temperatura da superfície MODIS','dataset_series','Produto MODIS/Terra Level-3 com médias de 8 dias de temperatura da superfície terrestre diurna/noturna e emissividade, acompanhado por bandas de qualidade e geometria de observação.','Remote sensing | Climate science | Environmental monitoring','MODIS | Terra | MOD11A2 | land surface temperature | emissivity | LST','Brasil e área regional coberta pela coleção INPE','sim','tile raster MODIS | coleção STAC','1 km nominal; GSD documentado ~926,625 m','2000-02-18–2026-06-17 na coleção verificada','8 dias','8 dias conforme disponibilidade de novos compostos','ativo','Collection 6.1 / MOD11A2 v061','complete','https://data.inpe.br/stac/browser/collections/mod11a2-6.1','https://data.inpe.br/stac/browser/collections/mod11a2-6.1','derivado','Temperatura da superfície terrestre não equivale à temperatura do ar. O composto é média de pixels LST válidos do período de 8 dias; qualidade, horário local, cobertura de céu claro e emissividade devem ser preservados.','2026-08-18'],
          ['DP000655','DR0123','MODIS Aqua MYD11A2 v061 — Temperatura da Superfície e Emissividade','MYD11A2 v061','BIG — temperatura da superfície MODIS','dataset_series','Produto MODIS/Aqua Level-3 com médias de 8 dias de temperatura da superfície terrestre diurna/noturna e emissividade, acompanhado por bandas de qualidade e geometria de observação.','Remote sensing | Climate science | Environmental monitoring','MODIS | Aqua | MYD11A2 | land surface temperature | emissivity | LST','Brasil e área regional coberta pela coleção INPE','sim','tile raster MODIS | coleção STAC','1 km nominal; GSD documentado ~926,625 m','2002-07-04–2026-06-17 na coleção verificada','8 dias','8 dias conforme disponibilidade de novos compostos','ativo','Collection 6.1 / MYD11A2 v061','complete','https://data.inpe.br/stac/browser/collections/myd11a2-6.1','https://data.inpe.br/stac/browser/collections/myd11a2-6.1','derivado','LST não equivale à temperatura do ar. Terra e Aqua possuem horários de passagem diferentes; qualidade, céu claro e horário de observação condicionam comparações e séries combinadas.','2026-08-18'],
          ['DP000656','DR0123','MERGE — Precipitação Gradeada Diária sobre a América do Sul','MERGE Daily','BIG/CPTEC — precipitação gradeada','dataset_series','Precipitação diária gradeada produzida pela combinação de estimativas de precipitação por satélite com observações de superfície sobre a América do Sul.','Meteorology | Hydrology | Climate science','MERGE | precipitation | GPM | rain gauge | daily | South America','América do Sul e domínio regional da coleção; inclui todo o Brasil','sim','grade raster/cubo STAC','grade oficial da coleção; resolução espacial não inferida nesta rodada','2000-06-01–2026-07-07 na coleção verificada','diária','operacional','ativo','MERGE daily v1','complete','https://data.inpe.br/stac/browser/collections/prec_merge_daily-1','https://data.inpe.br/stac/browser/collections/prec_merge_daily-1','derivado','Produto funde estimativas de satélite e pluviômetros; não equivale a uma medição de pluviômetro em cada célula. Mudanças nos insumos GPM e disponibilidade de estações podem afetar a série.','2026-08-18'],
          ['DP000657','DR0123','MERGE — Precipitação Gradeada Horária sobre a América do Sul','MERGE Hourly','BIG/CPTEC — precipitação gradeada','dataset_series','Precipitação horária gradeada produzida pela combinação de estimativas de satélite com observações de superfície; nas primeiras horas usa GPM-Early.','Meteorology | Hydrology | Climate science','MERGE | precipitation | GPM-Early | rain gauge | hourly | South America','América do Sul e domínio regional da coleção; inclui o Brasil','sim','grade raster/cubo STAC','grade oficial da coleção; resolução espacial não inferida nesta rodada','2009-12-04–2026-06-30 na coleção verificada','horária','operacional','ativo','MERGE hourly v1','complete','https://data.inpe.br/stac/browser/collections/prec_merge_hourly-1','https://data.inpe.br/stac/browser/collections/prec_merge_hourly-1','derivado','Produto fundido não é observação pontual em cada célula. A disponibilidade de pluviômetros e a latência/produto de satélite condicionam a estimativa, especialmente nas horas mais recentes.','2026-08-18'],
          ['DP000658','DR0123','SAMeT — Mapeamento Diário de Temperatura da América do Sul','SAMeT Daily','BIG/CPTEC — temperatura gradeada','dataset_series','Campos diários de temperatura mínima, média e máxima produzidos pelo SAMeT mediante combinação de observações com reanálise ERA5 e correção por gradiente térmico vertical.','Meteorology | Climate science | Environmental monitoring','SAMeT | temperature | ERA5 | observations | daily | South America','América do Sul; domínio da coleção inclui o Brasil','sim','grade raster/cubo STAC','grade oficial da coleção; resolução espacial não inferida nesta rodada','2000-01-01–2026-07-20 na coleção verificada','diária','operacional','ativo','SAMeT daily v1','complete','https://data.inpe.br/stac/browser/collections/samet_daily-1','https://data.inpe.br/stac/browser/collections/samet_daily-1','derivado','Campo analisado combina observações e ERA5 e não equivale a medição de estação em cada célula. Topografia, densidade de observações e método de correção condicionam o resultado.','2026-08-18'],
          ['DP000659','DR0123','SAMeT — Mapeamento Horário de Temperatura da América do Sul','SAMeT Hourly','BIG/CPTEC — temperatura gradeada','dataset_series','Campos horários de temperatura produzidos pelo SAMeT mediante combinação de observações com reanálise ERA5 e correção por gradiente térmico vertical.','Meteorology | Climate science | Environmental monitoring','SAMeT | temperature | ERA5 | observations | hourly | South America','América do Sul; domínio operacional inclui o Brasil','sim','grade raster/cubo STAC','grade oficial da coleção; resolução espacial não inferida nesta rodada','2022-04-30–2026-06-24 na coleção verificada','horária','operacional','ativo','SAMeT hourly v1','complete','https://data.inpe.br/stac/browser/collections/samet_hourly-1','https://data.inpe.br/stac/browser/collections/samet_hourly-1','derivado','Campo analisado combina observações e ERA5; não é observação instrumental em cada célula. A série horária inicia depois da série diária e não deve ser retroprojetada para períodos anteriores.','2026-08-18'],
