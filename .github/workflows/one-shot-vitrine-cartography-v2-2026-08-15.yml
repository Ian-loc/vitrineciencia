name: Materializar lote IBGE cartografia de referência v2

on:
  push:
    branches:
      - agent/vitrine-ibge-cartography-2026-08-15

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-ibge-cartography-2026-08-15
          fetch-depth: 0

      - name: Reutilizar materializador com guard corrigido
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-vitrine-cartography-2026-08-15.yml').read_text(encoding='utf-8')
          start = src.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = src.index("\n          PY\n", start)
          code = src[start:end]
          lines = []
          for line in code.splitlines():
              if "assert len({r['product_name'].strip().casefold() for r in pp}) == len(pp)" in line:
                  continue
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/materialize.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 /tmp/materialize.py

      - name: Validar e construir
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read-back consolidado
        run: |
          python3 - <<'PY'
          import csv
          def read(path):
              with open(path, encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          r=read('data/data_resources.csv'); p=read('data/data_products.csv'); d=read('data/product_distributions.csv')
          assert (len(r),len(p),len(d)) == (79,148,166)
          rids={x['resource_id'] for x in r}; pids={x['product_id'] for x in p}
          assert len(rids)==79 and len(pids)==148 and len({x['distribution_id'] for x in d})==166
          assert all(x['resource_id'] in rids for x in p)
          assert all(x['product_id'] in pids for x in d)
          for pid in ('DP000145','DP000146','DP000147','DP000148'):
              assert pid in pids
          for did in ('DD000161','DD000162','DD000163','DD000164','DD000165','DD000166'):
              assert any(x['distribution_id']==did for x in d)
          print('READBACK OK: 79 fontes, 148 produtos, 166 distribuições')
          PY

      - name: Commitar lote validado e limpar one-shots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-vitrine-cartography-2026-08-15.yml
          git rm .github/workflows/one-shot-vitrine-cartography-v2-2026-08-15.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json
          git add docs _site 2>/dev/null || true
          git add -u
          git status --short
          git commit -m "Expandir IBGE cartografia de referência"
          git push origin HEAD:agent/vitrine-ibge-cartography-2026-08-15
