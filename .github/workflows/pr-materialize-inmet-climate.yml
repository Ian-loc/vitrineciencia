name: PR materialize INMET climate data

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/pr-materialize-inmet-climate.yml"
      - ".github/materializers/inmet_climate_batch.py"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Materialize once
        run: |
          if grep -q '^DP000536,' data/data_products.csv; then
            echo 'Batch already materialized; validating current branch.'
          else
            python3 .github/materializers/inmet_climate_batch.py
          fi
      - name: Validate and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
      - name: Commit materialized data if needed
        run: |
          git config user.name "vitrine-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/data_products.json data/product_distributions.csv data/link_role_audit.json data/quality_report.md data/quality_report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No materialized delta to commit.'
          else
            git commit -m "Expand verified INMET climate catalog"
            git push origin HEAD:${{ github.head_ref }}
          fi
