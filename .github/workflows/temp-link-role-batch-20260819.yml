name: Temporary verified link-role materializer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-link-role-batch-20260819.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source link-role corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('data/data_resources.csv')
          text = p.read_text(encoding='utf-8')
          changes = {
            'DR0015': (
              'https://bdiaweb.ibge.gov.br/,https://bdiaweb.ibge.gov.br/',
              'https://www.ibge.gov.br/geociencias/informacoes-ambientais/vegetacao/23382-banco-de-informacoes-ambientais.html?lang=pt-BR,https://bdiaweb.ibge.gov.br/'
            ),
            'DR0017': (
              'https://www.snirh.gov.br/hidroweb/,https://www.snirh.gov.br/hidroweb/',
              'https://www.gov.br/ana/pt-br/assuntos/gestao-das-aguas/politica-nacional-de-recursos-hidricos/sistema-de-informacoes-sobre-recursos-hidricos/sistema-nacional-de-informacoes-sobre-recursos-hidricos,https://www.snirh.gov.br/hidroweb/'
            ),
          }
          lines = text.splitlines(keepends=True)
          seen = set()
          out = []
          for line in lines:
              rid = line.split(',', 1)[0]
              if rid in changes:
                  old, new = changes[rid]
                  if old not in line:
                      raise SystemExit(f'Expected URL pair not found for {rid}')
                  line = line.replace(old, new, 1)
                  seen.add(rid)
              out.append(line)
          missing = set(changes) - seen
          if missing:
              raise SystemExit(f'Missing source rows: {sorted(missing)}')
          p.write_text(''.join(out), encoding='utf-8')
          PY
      - name: Regenerate and validate catalog
        run: |
          python scripts/audit_link_roles.py --write
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back assertions
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          rows = {r['resource_id']: r for r in csv.DictReader(Path('data/data_resources.csv').open(encoding='utf-8-sig', newline=''))}
          assert rows['DR0015']['homepage_url'].startswith('https://www.ibge.gov.br/geociencias/')
          assert rows['DR0015']['data_access_url'] == 'https://bdiaweb.ibge.gov.br/'
          assert rows['DR0017']['homepage_url'].startswith('https://www.gov.br/ana/')
          assert rows['DR0017']['data_access_url'] == 'https://www.snirh.gov.br/hidroweb/'
          report = json.loads(Path('data/link_role_audit.json').read_text(encoding='utf-8'))
          pending = {r['resource_id'] for r in report['records_requiring_review']}
          assert 'DR0015' not in pending and 'DR0017' not in pending
          assert report['counts']['same_destination_pending_review'] == 41
          assert report['counts']['separate_destinations'] == 83
          print(report['counts'])
          PY
      - name: Commit materialized corrections
        run: |
          git config user.name 'vitrine-catalog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/data_resources.csv data/link_role_audit.json
          if git diff --cached --quiet; then
            echo 'No material change'
            exit 0
          fi
          git commit -m 'Resolve verified BDiA and SNIRH link roles'
          git push origin HEAD:main
