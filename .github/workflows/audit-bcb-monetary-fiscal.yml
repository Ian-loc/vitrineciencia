name: Audit BCB monetary and fiscal batch

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/audit-bcb-monetary-fiscal.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified BCB products
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          ppath=Path('data/data_products.csv')
          dpath=Path('data/product_distributions.csv')
          with ppath.open(encoding='utf-8', newline='') as f:
              pr=list(csv.DictReader(f)); pfields=list(pr[0])
          with dpath.open(encoding='utf-8', newline='') as f:
              dr=list(csv.DictReader(f)); dfields=list(dr[0])
          assert len(pr)==777, len(pr)
          assert len(dr)==808, len(dr)
          assert max(int(r['product_id'][2:]) for r in pr)==781
          assert max(int(r['distribution_id'][2:]) for r in dr)==812
          urls={r['product_page_url'] for r in pr}

          common={
            'resource_id':'DR0126','research_areas':'Economics | Finance | Public policy | Data infrastructure',
            'geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'série temporal nacional',
            'spatial_resolution':'não espacial','temporal_resolution':'mensal','update_frequency':'mensal',
            'product_status':'ativo','enumeration_scope':'complete','primary_or_derived':'derivado','last_verified':'2026-08-19'
          }
          rows=[
          dict(common,product_id='DP000782',product_name='Meios de pagamento — M1 — saldo em final de período',product_acronym='M1',product_family='Agregados monetários',product_kind='dataset_series',product_description='Série mensal do agregado monetário M1, composto pelo papel-moeda em poder do público e pelos depósitos à vista, segundo a metodologia corrente do Banco Central.',keywords='M1 | meios de pagamento | moeda | depósitos à vista | agregados monetários | SGS',temporal_coverage='dezembro de 2001–presente na série metodologicamente revisada',version_or_collection='SGS código 27791 — metodologia revista em 2018',product_page_url='https://dadosabertos.bcb.gov.br/dataset/27791-sgs',methodology_url='https://dadosabertos.bcb.gov.br/dataset/27791-sgs',limitations='M1 mede passivos de liquidez imediata; não equivale à base monetária nem aos agregados M2–M4. A revisão metodológica publicada em 2018 deve ser considerada em comparações históricas.'),
          dict(common,product_id='DP000783',product_name='Meios de pagamento amplos — M2 — saldo em final de período',product_acronym='M2',product_family='Agregados monetários',product_kind='dataset_series',product_description='Série mensal do agregado monetário M2, que adiciona ao M1 depósitos de poupança e títulos privados emitidos por instituições depositárias segundo a definição do BCB.',keywords='M2 | liquidez | poupança | títulos privados | agregados monetários | SGS',temporal_coverage='julho de 2001–presente',version_or_collection='SGS código 27810 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/27810-sgs',methodology_url='https://dadosabertos.bcb.gov.br/dataset/27810-sgs',limitations='M2 é agregado monetário amplo e não deve ser confundido com M1, M3 ou M4. Componentes e universo institucional refletem a revisão metodológica das estatísticas monetárias.'),
          dict(common,product_id='DP000784',product_name='Meios de pagamento amplos — M3 — saldo em final de período',product_acronym='M3',product_family='Agregados monetários',product_kind='dataset_series',product_description='Série mensal do agregado M3, que amplia o M2 com quotas de fundos monetários e operações compromissadas consideradas na metodologia do BCB.',keywords='M3 | liquidez | fundos monetários | operações compromissadas | agregados monetários | SGS',temporal_coverage='dezembro de 2001–presente conforme série revista',version_or_collection='SGS código 27813 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/27813-sgs',methodology_url='https://dadosabertos.bcb.gov.br/dataset/27813-sgs',limitations='M3 incorpora instrumentos adicionais de alta liquidez e não é intercambiável com M1/M2/M4. Preservar composição metodológica e revisões.'),
          dict(common,product_id='DP000785',product_name='Meios de pagamento amplos — M4 — saldo em final de período',product_acronym='M4',product_family='Agregados monetários',product_kind='dataset_series',product_description='Série mensal do agregado monetário M4, que engloba o M3 e títulos públicos federais considerados na metodologia de meios de pagamento amplos do BCB.',keywords='M4 | liquidez | títulos públicos | agregados monetários | SGS',temporal_coverage='dezembro de 2001–presente conforme série revista',version_or_collection='SGS código 27815 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/27815-sgs',methodology_url='https://dadosabertos.bcb.gov.br/dataset/27815-sgs',limitations='M4 é o agregado monetário amplo da família e não deve ser confundido com dívida pública ou base monetária. Preservar a definição específica dos instrumentos incluídos.'),
          dict(common,product_id='DP000786',product_name='Base monetária restrita — saldo em final de período',product_acronym='BM',product_family='Base monetária',product_kind='dataset_series',product_description='Série mensal da base monetária restrita, correspondente ao passivo monetário do Banco Central formado por moeda em circulação e reservas bancárias.',keywords='base monetária | emissão primária | reservas bancárias | moeda em circulação | SGS',temporal_coverage='janeiro de 1946–presente',version_or_collection='SGS código 1788 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/1788-sgs',methodology_url='https://dadosabertos.bcb.gov.br/dataset/1788-sgs',limitations='Base monetária é passivo monetário do Banco Central e não equivale a M1 ou aos agregados monetários amplos. Mudanças institucionais e monetárias ao longo da longa série exigem cautela histórica.'),
          dict(common,product_id='DP000787',product_name='Dívida Líquida do Setor Público — total — % do PIB',product_acronym='DLSP',product_family='Estatísticas fiscais',product_kind='dataset_series',product_description='Série mensal da Dívida Líquida do Setor Público consolidado em percentual do PIB, definida como o balanceamento entre dívidas e créditos do setor público não financeiro e do Banco Central.',keywords='DLSP | dívida líquida | setor público | finanças públicas | PIB | SGS',temporal_coverage='dezembro de 2001–presente',version_or_collection='SGS código 4513 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/4513-divida-liquida-do-setor-publico--pib---total---setor-publico-consolidado',methodology_url='https://dadosabertos.bcb.gov.br/dataset/4513-divida-liquida-do-setor-publico--pib---total---setor-publico-consolidado',limitations='DLSP é conceito líquido e tem abrangência institucional específica; não equivale à dívida bruta do governo geral. Alterações históricas de abrangência, inclusive exclusões de empresas, devem ser preservadas.'),
          dict(common,product_id='DP000788',product_name='Dívida Bruta do Governo Geral — % do PIB — metodologia vigente desde 2008',product_acronym='DBGG',product_family='Estatísticas fiscais',product_kind='dataset_series',product_description='Série mensal da Dívida Bruta do Governo Geral em percentual do PIB segundo a metodologia adotada pelo BCB a partir de 2008.',keywords='DBGG | dívida bruta | governo geral | finanças públicas | PIB | SGS',temporal_coverage='dezembro de 2006–presente conforme metadados da série',version_or_collection='SGS código 13762 — metodologia utilizada a partir de 2008',product_page_url='https://dadosabertos.bcb.gov.br/dataset/13762-divida-bruta-do-governo-geral--pib---metodologia-utilizada-a-partir-de-2008',methodology_url='https://dadosabertos.bcb.gov.br/dataset/13762-divida-bruta-do-governo-geral--pib---metodologia-utilizada-a-partir-de-2008',limitations='DBGG é conceito bruto do Governo Geral, com escopo e metodologia próprios; não deve ser substituída por DLSP ou dívida líquida do governo geral. Comparações históricas devem respeitar a metodologia vigente.'),
          dict(common,product_id='DP000789',product_name='NFSP — resultado primário — setor público consolidado — acumulado em 12 meses — % do PIB',product_acronym='NFSP primário',product_family='Estatísticas fiscais',product_kind='dataset_series',product_description='Série mensal do resultado primário das Necessidades de Financiamento do Setor Público consolidado, acumulado em doze meses e expresso como percentual do PIB.',keywords='NFSP | resultado primário | setor público | finanças públicas | PIB | SGS',temporal_coverage='série mensal; período conforme metadados oficiais',version_or_collection='SGS código 5793 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/5793-nfsp-sem-desvalorizacao-cambial--pib---fluxo-acumulado-em-12-meses---resultado-primario---total',methodology_url='https://dadosabertos.bcb.gov.br/dataset/5793-nfsp-sem-desvalorizacao-cambial--pib---fluxo-acumulado-em-12-meses---resultado-primario---total',limitations='Resultado primário exclui juros nominais e segue a abrangência institucional das estatísticas fiscais do BCB; não equivale ao resultado nominal nem ao resultado do Governo Central apurado por outras metodologias.'),
          dict(common,product_id='DP000790',product_name='NFSP — resultado nominal — setor público consolidado — acumulado em 12 meses — % do PIB',product_acronym='NFSP nominal',product_family='Estatísticas fiscais',product_kind='dataset_series',product_description='Série mensal do resultado nominal das Necessidades de Financiamento do Setor Público consolidado, acumulado em doze meses e expresso como percentual do PIB.',keywords='NFSP | resultado nominal | setor público | juros | finanças públicas | PIB | SGS',temporal_coverage='série mensal; período conforme metadados oficiais',version_or_collection='SGS código 5727 — série corrente',product_page_url='https://dadosabertos.bcb.gov.br/dataset/5727-nfsp-sem-desvalorizacao-cambial--pib---fluxo-acumulado-em-12-meses---resultado-nominal---total',methodology_url='https://dadosabertos.bcb.gov.br/dataset/5727-nfsp-sem-desvalorizacao-cambial--pib---fluxo-acumulado-em-12-meses---resultado-nominal---total',limitations='Resultado nominal incorpora o efeito dos juros nominais e não deve ser confundido com resultado primário. Abrangência institucional, sinal e convenções das NFSP precisam ser preservados.'),
          ]
          assert not any(r['product_page_url'] in urls for r in rows)
          for r in rows: assert set(r)==set(pfields), (r['product_id'], set(pfields)-set(r), set(r)-set(pfields))
          with ppath.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=pfields,lineterminator='\n'); w.writerows(rows)

          dcommon={'format':'JSON | CSV | HTML | WSDL','access_protocol':'HTTPS | BCData/SGS REST | SOAP','access_tool':'navegador web | script | cliente HTTP','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; consultas programáticas sujeitas aos parâmetros e limites documentados pelo BCB','license':'Open Data Commons Open Database License (ODbL)','provider_attribution_required':'sim','subset_support':'por código da série e intervalo temporal conforme serviço','last_verified':'2026-08-19'}
          drows=[]
          for i,r in enumerate(rows, start=813):
              d=dict(dcommon,distribution_id=f'DD{i:06d}',product_id=r['product_id'],distribution_name=f"{r['product_name']} — dados e API SGS",access_url=r['product_page_url'],notes='O portal fornece metadados e recursos JSON/CSV/HTML e WSDL/SGS. Preservar código, unidade, periodicidade, revisão metodológica e definição conceitual da série.')
              assert set(d)==set(dfields), (d['distribution_id'], set(dfields)-set(d), set(d)-set(dfields))
              drows.append(d)
          with dpath.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=dfields,lineterminator='\n'); w.writerows(drows)
          print('APPENDED',len(rows),len(drows))
          PY
      - name: Validate and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          p=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')))
          d=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')))
          ids={r['product_id'] for r in p}; dids={r['distribution_id'] for r in d}
          assert len(p)==786 and len(d)==817, (len(p),len(d))
          assert all(f'DP{i:06d}' in ids for i in range(782,791))
          assert all(f'DD{i:06d}' in dids for i in range(813,822))
          assert all(r['product_id'] in ids for r in d)
          print('READBACK',len(p),len(d))
          PY
      - name: Commit materialized batch
        run: |
          git config user.name "Vitrine Ciência audit bot"
          git config user.email "actions@users.noreply.github.com"
          git add -u data
          git commit -m "Expand verified BCB monetary and fiscal catalog"
          git push origin HEAD:main
