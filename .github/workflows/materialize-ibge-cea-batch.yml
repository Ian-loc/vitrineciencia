name: Materializar lote IBGE CEA
on:
  push:
    branches: [data/ibge-cea-batch-20260815]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/ibge-cea-batch-20260815
          fetch-depth: 0
      - name: Materializar e validar lote
        run: |
          python3 scripts/materialize_ibge_cea_batch.py
          python3 - <<'PY'
          from pathlib import Path
          import csv, io, json

          # Corrigir somente as novas linhas para o vocabulário controlado do contrato.
          p = Path('data/data_products.csv')
          lines = p.read_text(encoding='utf-8').splitlines()
          header = next(csv.reader([lines[0]]))
          idx = {name: i for i, name in enumerate(header)}
          targets = {'DP000091','DP000092','DP000093','DP000094'}
          for i, line in enumerate(lines[1:], start=1):
              row = next(csv.reader([line]))
              if row and row[idx['product_id']] in targets:
                  row[idx['product_status']] = 'ativo'
                  buf = io.StringIO()
                  csv.writer(buf, lineterminator='').writerow(row)
                  lines[i] = buf.getvalue()
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Toda nova fonte brasileira deve integrar explicitamente o registro P0.
          p = Path('data/brazil_scope_priorities.json')
          obj = json.loads(p.read_text(encoding='utf-8'))
          p0 = next(x for x in obj['tiers'] if x['priority_tier'] == 'P0')
          if 'DR0065' not in p0['resource_ids']:
              p0['resource_ids'].append('DR0065')
          obj['reviewed_at'] = '2026-08-15'
          p.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json
          git commit -m "Adicionar lote IBGE de Contas Econômicas Ambientais" || exit 0
          git push origin HEAD:data/ibge-cea-batch-20260815
