name: One-shot IBGE territorial recortes

on:
  push:
    branches: ["automation/ibge-territorial-recortes-20260815"]

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/ibge-territorial-recortes-20260815
          fetch-depth: 0

      - name: Append verified IBGE territorial products
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          p = Path('data/data_products.csv')
          d = Path('data/product_distributions.csv')

          with p.open(encoding='utf-8-sig', newline='') as f:
              products = list(csv.DictReader(f))
          with d.open(encoding='utf-8-sig', newline='') as f:
              distributions = list(csv.DictReader(f))

          assert len(products) == 159, len(products)
          assert len(distributions) == 177, len(distributions)
          existing_pids = {r['product_id'] for r in products}
          existing_dids = {r['distribution_id'] for r in distributions}
          existing_names = {r['product_name'].strip().casefold() for r in products}
          for pid in ['DP000163','DP000164','DP000165','DP000166']:
              assert pid not in existing_pids
          for did in ['DD000181','DD000182','DD000183','DD000184']:
              assert did not in existing_dids

          new_products = [
            {
              'product_id':'DP000163','resource_id':'DR0070','product_name':'Semiárido Brasileiro — edição 2025','product_acronym':'Semiárido 2025','product_family':'Estrutura Territorial — recortes legais e institucionais','product_kind':'dataset','product_description':'Recorte territorial do Semiárido brasileiro divulgado pelo IBGE para referência estatística e geográfica, composto por 1.477 municípios conforme a situação normativa mantida em 2025 e as orientações da SUDENE.','research_areas':'Regional science | Territorial planning | Environmental policy | Socioeconomic geography','keywords':'Semiárido | SUDENE | recorte territorial | municípios | seca | política regional | IBGE','geographic_coverage':'1.477 municípios em Maranhão, Piauí, Ceará, Rio Grande do Norte, Paraíba, Pernambuco, Alagoas, Sergipe, Bahia, Minas Gerais e Espírito Santo','covers_brazil':'sim','spatial_support':'municípios | recorte legal/institucional','spatial_resolution':'municipal; não é superfície climática contínua','temporal_coverage':'situação divulgada para 2025; critérios e atos normativos possuem datas próprias','temporal_resolution':'edição territorial','update_frequency':'conforme alteração normativa; IBGE informa que deixará de divulgar este recorte a partir do próximo ano','product_status':'ativo','version_or_collection':'2025','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-regionais/15974-semiarido-brasileiro.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-regionais/15974-semiarido-brasileiro.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'O IBGE não delimita o Semiárido; a competência é da SUDENE. O recorte de 2025 manteve 50 municípios cuja situação definitiva permanecia pendente segundo a página oficial. Não interpretar o polígono como mapa de aridez, precipitação ou risco de seca contemporâneo.','last_verified':'2026-08-15'
            },
            {
              'product_id':'DP000164','resource_id':'DR0070','product_name':'Municípios da Faixa de Fronteira e Cidades Gêmeas — edição 2024','product_acronym':'Faixa de Fronteira 2024','product_family':'Estrutura Territorial — recortes legais e institucionais','product_kind':'dataset','product_description':'Recorte geográfico da faixa interna de até 150 km ao longo das fronteiras terrestres, com municípios total ou parcialmente inseridos, sedes e identificação de cidades gêmeas conforme atos legais aplicáveis.','research_areas':'Regional science | Territorial planning | Political geography | Socioeconomic geography','keywords':'faixa de fronteira | cidades gêmeas | municípios | fronteira terrestre | recorte legal | IBGE','geographic_coverage':'Faixa de Fronteira do Brasil em 11 estados; 588 municípios mais Lagoa dos Patos e Lagoa Mirim nas representações territoriais da edição 2024','covers_brazil':'sim','spatial_support':'faixa territorial | municípios | sedes municipais | estados','spatial_resolution':'derivada da Malha Municipal Digital 2024; compatibilidade e generalização herdadas da base territorial','temporal_coverage':'2024; mapa PDF corrigido em 31/07/2025','temporal_resolution':'edição territorial','update_frequency':'conforme atualização territorial e normativa','product_status':'ativo','version_or_collection':'2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/24073-municipios-da-faixa-de-fronteira.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/24073-municipios-da-faixa-de-fronteira.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'O produto é um recorte legal/territorial, não uma medida de integração transfronteiriça, segurança ou dinâmica socioeconômica. Herda características da Malha Municipal 2024 e inclui lagoas operacionais nas contagens geoespaciais; distinguir municípios, polígonos e cidades gêmeas.','last_verified':'2026-08-15'
            },
            {
              'product_id':'DP000165','resource_id':'DR0070','product_name':'Municípios Defrontantes com o Mar — edição 2024','product_acronym':'Defrontantes com o Mar 2024','product_family':'Estrutura Territorial — recortes legais e institucionais','product_kind':'dataset','product_description':'Recorte territorial dos municípios que atendem ao critério de defrontação com o mar do Decreto nº 5.300/2004, derivado da Malha Municipal Digital 2024 e acompanhado por sedes, tabelas e mapa.','research_areas':'Coastal science | Regional science | Territorial planning | Political geography','keywords':'municípios defrontantes com o mar | litoral | zona costeira | municípios | recorte legal | IBGE','geographic_coverage':'279 municípios em 17 estados mais a Lagoa dos Patos na representação territorial da edição 2024','covers_brazil':'sim','spatial_support':'municípios | sedes municipais | recorte costeiro institucional','spatial_resolution':'derivada da Malha Municipal Digital 2024; não representa linha média das marés','temporal_coverage':'2024; mapa PDF substituído em 31/07/2025 por correção de layout','temporal_resolution':'edição territorial','update_frequency':'conforme atualização territorial e normativa','product_status':'ativo','version_or_collection':'2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/24072-municipios-defrontantes-com-o-mar.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/24072-municipios-defrontantes-com-o-mar.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'O IBGE explicita que o produto não caracteriza oficialmente a linha média das marés, não substitui estudos de dinâmica costeira e não deve ser usado para análises de royalties do petróleo. Municípios defrontantes com o mar não são sinônimo de todos os municípios costeiros.','last_verified':'2026-08-15'
            },
            {
              'product_id':'DP000166','resource_id':'DR0070','product_name':'Municípios Costeiros — edição 2025','product_acronym':'Municípios Costeiros 2025','product_family':'Estrutura Territorial — recortes legais e institucionais','product_kind':'dataset','product_description':'Recorte territorial da parte terrestre da Zona Costeira brasileira disponibilizado pelo IBGE para integração e divulgação estatística, segundo delimitação de responsabilidade do Ministério do Meio Ambiente e atualização territorial do IBGE.','research_areas':'Coastal science | Regional science | Territorial planning | Environmental policy','keywords':'municípios costeiros | zona costeira | MMA | recorte legal | municípios | IBGE','geographic_coverage':'Brasil — municípios integrantes do recorte terrestre da Zona Costeira conforme edição 2025','covers_brazil':'sim','spatial_support':'municípios | agregado territorial costeiro','spatial_resolution':'municipal/agregado; recorte legal e institucional','temporal_coverage':'edição 2025; enquadramento normativo e atualizações territoriais possuem vigências próprias','temporal_resolution':'edição territorial','update_frequency':'conforme legislação e atualizações da Divisão Territorial do Brasil','product_status':'ativo','version_or_collection':'2025','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34330-municipios-costeiros.html','methodology_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34330-municipios-costeiros.html','primary_or_derived':'derivado','limitations':'A delimitação dos Municípios Costeiros é de responsabilidade do Ministério do Meio Ambiente; o IBGE a disponibiliza como recorte geográfico. Não confundir Municípios Costeiros com Municípios Defrontantes com o Mar, que constituem critério distinto e são subconjunto do recorte costeiro.','last_verified':'2026-08-15'
            }
          ]
          for row in new_products:
              assert row['product_name'].casefold() not in existing_names, row['product_name']

          product_fields = list(products[0].keys())
          with p.open('a', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=product_fields, lineterminator='\n')
              for row in new_products:
                  w.writerow(row)

          new_distributions = [
            ['DD000181','DP000163','Semiárido Brasileiro 2025 — página oficial e downloads','https://www.ibge.gov.br/geociencias/cartas-e-mapas/mapas-regionais/15974-semiarido-brasileiro.html?lang=pt-BR','formatos de download conforme página oficial','HTTP download','navegador web','sim','não','consulta e download público conforme arquivos publicados','licença específica não inferida no nível do arquivo','sim','por edição/arquivo','Recorte divulgado pelo IBGE, mas delimitado pela SUDENE; preservar a edição e os atos normativos utilizados.','2026-08-15'],
            ['DD000182','DP000164','Faixa de Fronteira e Cidades Gêmeas 2024 — bases e tabelas','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/24073-municipios-da-faixa-de-fronteira.html?lang=pt-BR','SHP | XLS | ODS | PDF','HTTP download','navegador web','sim','não','downloads públicos na página oficial','licença específica não inferida no nível do arquivo','sim','por componente/arquivo','A edição 2024 oferece faixa, municípios, sedes e tabelas como objetos distintos; o mapa PDF foi corrigido em 31/07/2025.','2026-08-15'],
            ['DD000183','DP000165','Municípios Defrontantes com o Mar 2024 — bases e tabelas','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/24072-municipios-defrontantes-com-o-mar.html?lang=pt-BR','SHP | XLS | ODS | PDF','HTTP download','navegador web','sim','não','downloads públicos na página oficial','licença específica não inferida no nível do arquivo','sim','por componente/arquivo','A edição 2024 inclui polígonos municipais, sedes, tabelas e mapa; o PDF foi substituído em 31/07/2025 por ajuste de layout.','2026-08-15'],
            ['DD000184','DP000166','Municípios Costeiros 2025 — consulta e geosserviços','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34330-municipios-costeiros.html','tabelas e geosserviços conforme página/Quadro Geográfico','HTTP | geosserviço','navegador web | Plataforma Geográfica Interativa','sim','não','consulta pública; mecanismos variam conforme componente','licença específica não inferida no nível do arquivo','sim','por lista/agregado/edição','Recorte legal disponibilizado pelo IBGE; responsabilidade de delimitação é do MMA. Não confundir com defrontantes com o mar.','2026-08-15']
          ]
          dist_fields = list(distributions[0].keys())
          with d.open('a', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              for row in new_distributions:
                  assert len(row) == len(dist_fields), (len(row), len(dist_fields))
                  w.writerow(row)

          with p.open(encoding='utf-8-sig', newline='') as f:
              p2 = list(csv.DictReader(f))
          with d.open(encoding='utf-8-sig', newline='') as f:
              d2 = list(csv.DictReader(f))
          assert len(p2) == 163
          assert len(d2) == 181
          assert len({r['product_id'] for r in p2}) == len(p2)
          assert len({r['distribution_id'] for r in d2}) == len(d2)
          product_ids = {r['product_id'] for r in p2}
          assert all(r['product_id'] in product_ids for r in d2)
          print('append ok', len(p2), len(d2))
          PY

      - name: Rebuild and validate catalog
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read back batch
        run: |
          python3 - <<'PY'
          import csv
          for path, key, ids in [
            ('data/data_products.csv','product_id',{'DP000163','DP000164','DP000165','DP000166'}),
            ('data/product_distributions.csv','distribution_id',{'DD000181','DD000182','DD000183','DD000184'}),
          ]:
              with open(path, encoding='utf-8-sig', newline='') as f:
                  rows=list(csv.DictReader(f))
              got={r[key] for r in rows}
              assert ids <= got, ids-got
              print(path, len(rows), sorted(ids))
          PY

      - name: Commit materialized batch and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-ibge-territorial-recortes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets .github/workflows/one-shot-ibge-territorial-recortes.yml
          git commit -m "Expand IBGE legal territorial recortes"
          git push origin HEAD:automation/ibge-territorial-recortes-20260815
