name: Materialize verified IBGE health surveys batch

on:
  push:
    branches:
      - curation/ibge-health-surveys-20260816

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curation/ibge-health-surveys-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified catalog rows
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          today='2026-08-16'
          def append_rows(path, rows, id_field):
              p=Path(path)
              with p.open('r',encoding='utf-8',newline='') as f:
                  rd=csv.DictReader(f); fields=rd.fieldnames; ids={r[id_field] for r in rd}
              with p.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n')
                  for r in rows:
                      if r[id_field] not in ids: w.writerow({k:r.get(k,'') for k in fields})
          resources=[{
            'resource_id':'DR0092','resource_name':'Pesquisas Nacionais de Saúde — IBGE','acronym':'Saúde IBGE','official_identity':'Família institucional de pesquisas amostrais nacionais de saúde do IBGE','description':'Família de pesquisas amostrais do IBGE sobre condições de saúde, fatores de risco e proteção, acesso e uso de serviços e saúde de populações específicas, incluindo PNS e PeNSE.','homepage_url':'https://www.ibge.gov.br/estatisticas/sociais/saude.html','data_access_url':'https://www.ibge.gov.br/estatisticas/sociais/saude.html','research_areas':'Planejamento Territorial e Políticas Públicas','keywords':'saúde | PNS | PeNSE | fatores de risco | serviços de saúde | escolares | amostragem | IBGE','data_product_types':'pesquisas amostrais | microdados | tabelas | publicações','data_formats':'XLSX | ODS | microdados | documentação | PDF | formatos variáveis por produto','visualization_types':'tabelas | publicações | resultados web','geographic_coverage':'Brasil; Grandes Regiões, Unidades da Federação e Capitais conforme produto','covers_brazil':'sim','spatial_resolution':'domicílio, pessoa, escola ou agregações territoriais conforme produto','temporal_coverage':'edições periódicas ou eventuais conforme pesquisa','temporal_resolution':'por edição/levantamento','data_sources':'amostragem probabilística | cadastros de domicílios | cadastros de escolas | entrevistas e questionários','free_download':'sim','access_conditions':'consulta pública; microdados e documentação conforme produto','programmatic_access':'desconhecido','access_protocols':'HTTPS web | HTTP download','authentication_required':'não','access_documentation_url':'https://www.ibge.gov.br/estatisticas/sociais/saude.html','license':'licença específica deve ser verificada por produto/arquivo; não inferida nesta auditoria','institutional_status':'público','owner_or_manager':'IBGE','academic_uses':'Saúde pública, epidemiologia, determinantes sociais, nutrição, comportamento, políticas públicas e desigualdades territoriais.','limitations':'PNS e PeNSE possuem populações-alvo, desenhos amostrais, questionários, níveis de divulgação e períodos distintos; não devem ser combinadas como uma única série homogênea.','academic_evidence_type':'documentação oficial','academic_evidence_url':'https://www.ibge.gov.br/estatisticas/sociais/saude.html','academic_evidence_note':'As páginas oficiais documentam separadamente PNS e PeNSE, seus desenhos amostrais, microdados, publicações e níveis de divulgação.','verification_url':'https://www.ibge.gov.br/estatisticas/sociais/saude.html','last_verified':today
          }]
          products=[
          {'product_id':'DP000228','resource_id':'DR0092','product_name':'Pesquisa Nacional de Saúde — PNS 2019','product_acronym':'PNS 2019','product_family':'Pesquisa Nacional de Saúde','product_kind':'dataset_series','product_description':'Segunda edição da Pesquisa Nacional de Saúde, pesquisa domiciliar por amostragem do IBGE em convênio com o Ministério da Saúde, com módulos sobre condições de saúde, doenças crônicas, fatores de risco, acesso e uso de serviços, atenção primária, antropometria, violências e outros temas.','research_areas':'Public health | Epidemiology | Population studies | Public policy','keywords':'PNS 2019 | saúde | serviços de saúde | doenças crônicas | fatores de risco | antropometria | violência | microdados | IBGE','geographic_coverage':'Brasil; níveis de divulgação variam entre Brasil, Grandes Regiões e Unidades da Federação conforme o conjunto de resultados','covers_brazil':'sim','spatial_support':'domicílios particulares permanentes | pessoas | agregações territoriais','spatial_resolution':'amostra domiciliar; divulgação agregada conforme plano amostral e tema','temporal_coverage':'2019; publicações temáticas divulgadas entre 2020 e 2022; microdados atualizados até 2022 na página oficial','temporal_resolution':'edição de pesquisa','update_frequency':'eventual','product_status':'ativo','version_or_collection':'PNS 2019; microdados/documentação atualizados em 2022','enumeration_scope':'family_level','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9160-pesquisa-nacional-de-saude.html','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9160-pesquisa-nacional-de-saude.html','primary_or_derived':'primário','limitations':'Pesquisa amostral domiciliar, não censo nem registro clínico. Módulos e publicações têm universos, filtros e níveis de divulgação próprios; estimativas exigem pesos e desenho amostral. Resultados de 2019 não representam automaticamente condições atuais.','last_verified':today},
          {'product_id':'DP000229','resource_id':'DR0092','product_name':'Pesquisa Nacional de Saúde do Escolar — PeNSE 2024','product_acronym':'PeNSE 2024','product_family':'Pesquisa Nacional de Saúde do Escolar','product_kind':'dataset','product_description':'Quinta edição da PeNSE, pesquisa probabilística com escolares de 13 a 17 anos matriculados do 7º ano do ensino fundamental à 3ª série do ensino médio em escolas públicas e privadas, cobrindo fatores de risco e proteção à saúde.','research_areas':'Public health | Adolescent health | Epidemiology | Education | Public policy','keywords':'PeNSE 2024 | escolares | adolescentes | alimentação | atividade física | saúde mental | violência | álcool | tabaco | microdados | IBGE','geographic_coverage':'Brasil — Brasil, Grandes Regiões, Unidades da Federação e Municípios das Capitais','covers_brazil':'sim','spatial_support':'escolas | estudantes | agregações territoriais','spatial_resolution':'amostra probabilística de estudantes e escolas; divulgação até Municípios das Capitais','temporal_coverage':'coleta 01/04/2024–01/10/2024; edição publicada em 2026','temporal_resolution':'edição de pesquisa','update_frequency':'eventual','product_status':'ativo','version_or_collection':'2024 — 5ª edição; publicação corrigida/substituída em 02/06/2026','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9134-pesquisa-nacional-de-saude-do-escolar.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9134-pesquisa-nacional-de-saude-do-escolar.html?lang=pt-BR','primary_or_derived':'primário','limitations':'Pesquisa amostral escolar, não representa adolescentes fora da população-alvo escolar. Estimativas exigem desenho amostral e pesos. A publicação 2024 teve correção oficial em 02/06/2026; usar a versão corrigida e observar notas técnicas de variância e confidencialidade dos microdados.','last_verified':today}
          ]
          distributions=[
          {'distribution_id':'DD000249','product_id':'DP000228','distribution_name':'PNS 2019 — microdados e documentação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/9160-pesquisa-nacional-de-saude.html','format':'microdados compactados | documentação | tabelas | publicações','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'download público; análise deve aplicar desenho amostral e documentação da edição','license':'licença específica dos arquivos não inferida nesta auditoria','provider_attribution_required':'sim','subset_support':'por módulos/variáveis e recortes divulgados; microdados conforme arquivo','notes':'Microdados PNS 2019 foram atualizados em 25/05/2022 e documentação em 30/05/2022; preservar versão/dicionário utilizado.','last_verified':today},
          {'distribution_id':'DD000250','product_id':'DP000229','distribution_name':'PeNSE 2024 — tabelas, microdados e documentação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/9134-pesquisa-nacional-de-saude-do-escolar.html?lang=pt-BR','format':'XLSX | ODS | microdados | publicação digital | documentação','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'download público; observar controle estatístico de confidencialidade e plano amostral','license':'licença específica dos arquivos não inferida nesta auditoria','provider_attribution_required':'sim','subset_support':'temas tabulares | microdados | níveis geográficos de divulgação','notes':'Microdados incluídos em 04/05/2026; tabelas receberam atualizações em maio de 2026 e a publicação foi substituída/corrigida em 02/06/2026.','last_verified':today}
          ]
          append_rows('data/data_resources.csv',resources,'resource_id')
          append_rows('data/data_products.csv',products,'product_id')
          append_rows('data/product_distributions.csv',distributions,'distribution_id')
          p=Path('data/brazil_scope_priorities.json'); obj=json.loads(p.read_text(encoding='utf-8'))
          p0=next(t for t in obj['tiers'] if t['priority_tier']=='P0')['resource_ids']
          if 'DR0092' not in p0: p0.append('DR0092')
          obj['reviewed_at']=today
          p.write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate catalog
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back
        run: |
          python - <<'PY'
          import csv
          paths=['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']
          for path in paths:
              with open(path,encoding='utf-8',newline='') as f: print(path,len(list(csv.DictReader(f))))
          with open(paths[1],encoding='utf-8',newline='') as f: p={r['product_id']:r for r in csv.DictReader(f)}
          with open(paths[2],encoding='utf-8',newline='') as f: d={r['distribution_id']:r for r in csv.DictReader(f)}
          assert p['DP000228']['resource_id']=='DR0092' and p['DP000229']['resource_id']=='DR0092'
          assert d['DD000249']['product_id']=='DP000228' and d['DD000250']['product_id']=='DP000229'
          print('READBACK_OK')
          PY
      - name: Commit materialized batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/vitrine_health_batch_140.yml
          git add data
          git commit -m 'Expand verified IBGE health survey catalog'
          git push origin HEAD:curation/ibge-health-surveys-20260816
