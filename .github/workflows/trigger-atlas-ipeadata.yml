name: Trigger Atlas IpeaData materializer

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trigger existing materializer
        run: |
          printf '\n# scheduled-trigger %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .github/workflows/materialize-atlas-ipeadata.yml
          git config user.name 'Ian-loc'
          git config user.email 'lara.clemente@ufla.br'
          git add .github/workflows/materialize-atlas-ipeadata.yml
          git commit -m 'Trigger Atlas/IpeaData materializer'
          git push origin HEAD:main
