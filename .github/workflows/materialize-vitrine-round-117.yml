name: Materializar Vitrine Round 117

on:
  push:
    branches: ["agent/vitrine-audit-117"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-audit-117
          fetch-depth: 0

      - name: Materializar lote
        run: python3 scripts/materialize_vitrine_round_117.py

      - name: Validar catálogo
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Limpar helpers temporários e materializar resultado
        run: |
          rm -f scripts/materialize_vitrine_round_117.py
          rm -f .github/workflows/materialize-vitrine-round-117.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/*.json scripts/materialize_vitrine_round_117.py .github/workflows/materialize-vitrine-round-117.yml
          if git diff --cached --quiet; then
            echo "No material changes"; exit 0
          fi
          git commit -m "expandir catálogo IBGE com lote ambiental"
          git push origin HEAD:agent/vitrine-audit-117
