          def read_rows(path):
              with path.open(encoding='utf-8', newline='') as f: return list(csv.DictReader(f))
          def append_rows(path,new_rows,id_field,guards=()):
              old=read_rows(path); ids={r[id_field] for r in old}
              for nr in new_rows:
                  if nr[id_field] in ids: raise SystemExit(f'duplicate id {nr[id_field]}')
              for field in guards:
                  existing={r.get(field,'').strip() for r in old if r.get(field,'').strip()}
                  for nr in new_rows:
                      v=nr.get(field,'').strip()
                      if v and v in existing: raise SystemExit(f'duplicate {field}: {v}')
              with path.open('a',encoding='utf-8',newline='') as f:
                  writer=csv.DictWriter(f,fieldnames=list(old[0].keys()),lineterminator='\n')
                  for nr in new_rows:
                      if set(nr)!=set(old[0]): raise SystemExit(f'field mismatch {path}')
                      writer.writerow(nr)
          append_rows(rpath,resources,'resource_id',guards=('resource_name','homepage_url'))
          append_rows(ppath,products,'product_id',guards=('product_name','product_page_url'))
          append_rows(dpath,distributions,'distribution_id')
          rr=read_rows(rpath); pp=read_rows(ppath); dd=read_rows(dpath); rids={r['resource_id'] for r in rr}; pids={p['product_id'] for p in pp}
