            },
            {
              'product_id':'DP000237','resource_id':'DR0086','product_name':'Fecundidade e Migração — Censo Demográfico 2022 — resultados preliminares da amostra','product_acronym':'Fecundidade e Migração Censo 2022','product_family':'Censo 2022 — dinâmica demográfica','product_kind':'dataset',
              'product_description':'Resultados preliminares da amostra do Censo 2022 sobre fecundidade, parturição e migração, incluindo filhos nascidos vivos, idade da mãe, imigração internacional, local de nascimento, residência anterior e tempo de residência no município.',
              'research_areas':'Demography | Population geography | Social statistics | Territorial analysis','keywords':'fecundidade | parturição | migração | imigração | residência anterior | filhos nascidos vivos | Censo 2022 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; Municípios e recortes compostos a partir de Municípios','covers_brazil':'sim','spatial_support':'pessoas e mulheres agregadas por variáveis demográficas e recortes territoriais | tabelas SIDRA | visualizações','spatial_resolution':'Município e demais domínios de divulgação publicados','temporal_coverage':'Censo Demográfico 2022; algumas variáveis migratórias usam períodos retrospectivos próprios','temporal_resolution':'snapshot censitário com referências retrospectivas específicas; resultados preliminares da amostra','update_frequency':'por edição censitária','product_status':'ativo','version_or_collection':'divulgação de 27/06/2025 — resultados preliminares da amostra','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/Estatisticas/Sociais/Populacao/22827-censo-demografico-2022.html?edicao=43821','methodology_url':'https://www.ibge.gov.br/Estatisticas/Sociais/Populacao/22827-censo-demografico-2022.html?edicao=43821','primary_or_derived':'derivado','limitations':'Resultados preliminares da amostra. Fecundidade e migração têm universos, filtros e períodos de referência distintos; migração retrospectiva não é fluxo contínuo observado e fecundidade censitária não é registro vital. Usar pesos, domínios e notas metodológicas.','last_verified':verified
