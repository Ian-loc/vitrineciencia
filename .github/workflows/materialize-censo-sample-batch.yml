          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          for p, exp in [('data/data_resources.csv',92),('data/data_products.csv',235),('data/product_distributions.csv',256)]:
              with open(p, encoding='utf-8', newline='') as f:
                  n=sum(1 for _ in csv.DictReader(f))
              print(p,n)
              if n != exp: raise SystemExit(f'{p}: expected {exp}, got {n}')
          PY
      - name: Commit materialized batch and remove one-shot workflow
