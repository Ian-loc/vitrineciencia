          rm .github/workflows/materialize-censo-sample-batch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Expand verified Censo 2022 sample catalog"
          git push origin HEAD:audit/censo-sample-batch-20260816-b
