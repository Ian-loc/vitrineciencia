            },
            {
              'product_id':'DP000239','resource_id':'DR0086','product_name':'Características dos domicílios — Censo Demográfico 2022 — resultados preliminares da amostra','product_acronym':'Domicílios Censo 2022','product_family':'Censo 2022 — características dos domicílios','product_kind':'dataset',
