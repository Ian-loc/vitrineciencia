            }
          ]

          for r in products:
              if r['product_id'] in ids:
                  raise SystemExit(f"product id collision: {r['product_id']}")
              if r['product_name'].casefold() in names:
                  raise SystemExit(f"duplicate product name: {r['product_name']}")
              if set(r) != set(pfields):
                  raise SystemExit(f"product field mismatch for {r['product_id']}: {set(r)^set(pfields)}")

          with ppath.open('a', encoding='utf-8', newline='') as f:
              w = csv.DictWriter(f, fieldnames=pfields, lineterminator='\n')
              for r in products:
                  w.writerow(r)

          with dpath.open(encoding='utf-8', newline='') as f:
              de = list(csv.DictReader(f))
              dfields = list(de[0].keys())
          dids = {r['distribution_id'] for r in de}

