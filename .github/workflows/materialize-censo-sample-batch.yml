name: Materialize Censo sample batch

on:
  push:
    branches: [audit/censo-sample-batch-20260816-b]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified products and distributions
        shell: python
        run: |
          import csv
          from pathlib import Path

          verified = '2026-08-16'
          ppath = Path('data/data_products.csv')
          dpath = Path('data/product_distributions.csv')

          with ppath.open(encoding='utf-8', newline='') as f:
              existing = list(csv.DictReader(f))
              pfields = list(existing[0].keys())
          ids = {r['product_id'] for r in existing}
          names = {r['product_name'].casefold() for r in existing}

          products = [
            {
              'product_id':'DP000235','resource_id':'DR0086','product_name':'Religiões — Censo Demográfico 2022 — resultados preliminares da amostra','product_acronym':'Religiões Censo 2022','product_family':'Censo 2022 — religiões','product_kind':'dataset',
              'product_description':'Resultados preliminares da amostra do Censo Demográfico 2022 sobre religiões ou cultos declarados por pessoas de 10 anos ou mais, com perfis sociodemográficos, educacionais e domiciliares e divulgação por múltiplos recortes territoriais.',
