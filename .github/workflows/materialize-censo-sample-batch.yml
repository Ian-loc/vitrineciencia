            {'distribution_id':'DD000259','product_id':'DP000238','distribution_name':'Nupcialidade e Família Censo 2022 — 2ª edição corrigida — SIDRA e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=44940&t=sobre','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; utilizar a 2ª edição corrigida e tabelas substituídas','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, estado conjugal, natureza da união, composição familiar e domínio geográfico disponível','notes':'A publicação e as tabelas foram substituídas em 12/11/2025 após falha no algoritmo de identificação de famílias.','last_verified':verified},
            {'distribution_id':'DD000260','product_id':'DP000239','distribution_name':'Características dos domicílios Censo 2022 — SIDRA e publicação','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=42157&t=resultados','format':'SIDRA | XLSX | ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA','access_tool':'navegador web | SIDRA | Panorama Censo 2022','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; análises devem respeitar desenho amostral, pesos, denominadores e revisões','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, característica domiciliar e domínio geográfico disponível','notes':'Resultados preliminares da amostra; não confundir atributos declarados do domicílio com medições técnicas ambientais ou habitacionais.','last_verified':verified}
