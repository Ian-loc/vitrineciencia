name: Validar baseline auditado de fontes

on:
  pull_request:
    paths:
      - "data/data_resources.csv"
      - "docs/audits/VITRINE_SOURCE_CORRECTION_QUEUE_DR*_2026-08-10.csv"
      - "scripts/validate_source_correction_queues.py"
      - "config/source_correction_overrides_2026-08-10.json"
      - ".github/workflows/validate-source-corrections.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validar filas e gerar proposta fora do catálogo canônico
        run: |
          python3 -m py_compile scripts/validate_source_correction_queues.py
          python3 scripts/validate_source_correction_queues.py \
            --output /tmp/data_resources.corrected.csv \
            --summary-json /tmp/source-correction-summary.json
          cat /tmp/source-correction-summary.json

      - name: Validar proposta em cópia temporária completa
        run: |
          mkdir -p /tmp/vitrine-proposed
          tar --exclude=.git -cf - . | (cd /tmp/vitrine-proposed && tar -xf -)
          cp /tmp/data_resources.corrected.csv /tmp/vitrine-proposed/data/data_resources.csv
          cd /tmp/vitrine-proposed
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py

      - name: Provar fronteiras do delta proposto
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          original = Path("data/data_resources.csv")
          proposed = Path("/tmp/data_resources.corrected.csv")
          with original.open(encoding="utf-8-sig", newline="") as f:
              a = list(csv.DictReader(f))
          with proposed.open(encoding="utf-8-sig", newline="") as f:
              b = list(csv.DictReader(f))
          assert len(a) == len(b) >= 51
          assert [r["resource_id"] for r in a] == [r["resource_id"] for r in b]
          assert a and b and len(a[0]) == len(b[0]) == 34
          assert [r["resource_id"] for r in a[:51]] == [f"DR{i:04d}" for i in range(1, 52)]
          print(f"OK: proposta preserva {len(a)} fontes, baseline DR0001–DR0051, IDs, ordem e 34 colunas")
          PY
          cmp data/data_products.csv /tmp/vitrine-proposed/data/data_products.csv
          cmp data/product_distributions.csv /tmp/vitrine-proposed/data/product_distributions.csv
          test -s /tmp/vitrine-proposed/_site/data/data_resources.csv
          test -s /tmp/vitrine-proposed/_site/data/data_products.csv
          test -s /tmp/vitrine-proposed/_site/data/product_distributions.csv

      - name: Guardar proposta e sumário para revisão
        uses: actions/upload-artifact@v4
        with:
          name: vitrine-source-corrections-baseline-51
          path: |
            /tmp/data_resources.corrected.csv
            /tmp/source-correction-summary.json
          retention-days: 14
