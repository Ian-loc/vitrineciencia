name: Materialize verified Ibama open-data catalog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-ibama-20260817.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified Ibama source products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib, re

          source_path=pathlib.Path('data/data_resources.csv')
          product_path=pathlib.Path('data/data_products.csv')
          dist_path=pathlib.Path('data/product_distributions.csv')
          priority_path=pathlib.Path('data/brazil_scope_priorities.json')

          def read(path):
              with path.open(encoding='utf-8',newline='') as f:
                  r=csv.DictReader(f); return r.fieldnames,list(r)
          sf,sources=read(source_path); pf,products=read(product_path); df,dists=read(dist_path)
          def maxid(rows,key,prefix):
              out=[]
              for r in rows:
                  m=re.fullmatch(re.escape(prefix)+r'(\d+)',r[key])
                  if m: out.append(int(m.group(1)))
              return max(out) if out else 0

          source_name='Dados Abertos e Sistemas Ambientais — Ibama'
          source_key=source_name.casefold()
          source_by_name={r['resource_name'].strip().casefold():r['resource_id'] for r in sources}
          if source_key in source_by_name:
              rid=source_by_name[source_key]
          else:
              rid=f'DR{maxid(sources,"resource_id","DR")+1:04d}'
              row={k:'' for k in sf}
              row.update({
                'resource_id':rid,'resource_name':source_name,'acronym':'Ibama Dados Abertos',
                'official_identity':'Portal oficial de dados abertos e sistemas administrativos do Instituto Brasileiro do Meio Ambiente e dos Recursos Naturais Renováveis',
                'description':'Fonte institucional do Ibama para conjuntos de dados administrativos, geoespaciais e operacionais sobre fiscalização ambiental, fogo, uso de recursos florestais, comércio de fauna e flora e outros temas ambientais.',
                'homepage_url':'https://www.gov.br/ibama/pt-br','data_access_url':'https://dadosabertos.ibama.gov.br/',
                'research_areas':'Ciências Ambientais e Ecologia | Biodiversidade e Conservação | Agricultura, Florestas e Uso da Terra | Planejamento Territorial e Políticas Públicas',
                'keywords':'Ibama | fiscalização ambiental | fogo | Sinaflor | Siscites | dados abertos',
                'data_product_types':'registros administrativos | dados geoespaciais | séries | API',
                'data_formats':'CSV | XML | JSON | SHP | HTML','visualization_types':'busca tabular | pré-visualização de dados | painéis',
                'geographic_coverage':'nacional — Brasil','covers_brazil':'sim','spatial_resolution':'registros pontuais e polígonos; varia conforme o conjunto',
                'temporal_coverage':'histórica e corrente; varia conforme o sistema','temporal_resolution':'evento/registro a atualização diária ou semanal; varia conforme o conjunto',
                'data_sources':'sistemas administrativos do Ibama | fiscalização | Prevfogo | Sinaflor | Siscites',
                'free_download':'sim','access_conditions':'aberto; condições e estrutura variam por conjunto','programmatic_access':'sim',
                'access_protocols':'CKAN API | HTTP download','authentication_required':'não','access_documentation_url':'https://dadosabertos.ibama.gov.br/',
                'license':'varia conforme o conjunto; o catálogo CKAN identifica licenças abertas no nível do dataset',
                'institutional_status':'público','owner_or_manager':'Ibama / Governo Federal do Brasil',
                'academic_uses':'Analisar fiscalização ambiental, incêndios verificados em campo, autorizações florestais e comércio autorizado de fauna e flora, preservando a natureza administrativa e o desenho de cada sistema.',
                'limitations':'Os conjuntos são produzidos por sistemas administrativos e operacionais distintos. Cobertura, atualização, geometria, universo de registros e licença variam por dataset; ausência de registro não implica ausência do fenômeno ambiental.',
                'academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.gov.br/ibama/pt-br/acesso-a-informacao/dados-abertos',
                'academic_evidence_note':'O portal oficial e os metadados CKAN documentam os conjuntos, formatos, mantenedores, frequências e condições de acesso; a adequação analítica depende do sistema de origem.',
                'verification_url':'https://dadosabertos.ibama.gov.br/','last_verified':'2026-08-17'
              })
              with source_path.open('a',encoding='utf-8',newline='') as f:
                  csv.DictWriter(f,fieldnames=sf,lineterminator='\n').writerow(row)
              sources.append(row)

          priority=json.loads(priority_path.read_text(encoding='utf-8'))
          p0=next(t for t in priority['tiers'] if t['priority_tier']=='P0')
          if rid not in p0['resource_ids']:
              p0['resource_ids'].append(rid)
          priority['reviewed_at']='2026-08-17'
          priority_path.write_text(json.dumps(priority,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          auto='https://dadosabertos.ibama.gov.br/dataset/fiscalizacao-auto-de-infracao'
          embargo='https://dadosabertos.ibama.gov.br/dataset/fiscalizacao-termo-de-embargo'
          embargo_geo='https://dadosabertos.ibama.gov.br/pt_BR/dataset/termos-de-embargo'
          sisfogo='https://dadosabertos.ibama.gov.br/dataset/sisfogo-roi'
          sinaflor='https://dadosabertos.ibama.gov.br/dataset/sinaflor-poa-outros-biomas'
          siscites='https://dadosabertos.ibama.gov.br/dataset/siscites-licencas-de-fauna-e-flora-emitidas'

          candidates=[
            dict(product_name='Fiscalização — Autos de Infração Ambiental — Ibama',product_acronym='Autos de Infração Ibama',product_family='Fiscalização ambiental — registros administrativos',product_kind='dataset_series',product_description='Conjunto oficial de autos de infração ambiental registrados no sistema de fiscalização do Ibama, com atributos do auto e tabelas relacionadas de enquadramento, coordenadas, biomas, espécimes e anexos.',research_areas='Conservation | Environmental management | Geospatial data | Environmental science',keywords='Ibama | environmental enforcement | infraction notices | coordinates | biomes | administrative records',geographic_coverage='Brasil — território nacional',covers_brazil='sim',spatial_support='auto de infração | pares de coordenadas de referência | atributos e tabelas relacionadas',spatial_resolution='pontual nas coordenadas de referência quando disponíveis; atributos por auto',temporal_coverage='desde 1980; em funcionamento conforme metadados oficiais',temporal_resolution='data e hora da lavratura do auto',update_frequency='diária conforme a atualização do relatório operacional',product_status='ativo',version_or_collection='dataset corrente; metadados CKAN atualizados em 27/05/2026',enumeration_scope='complete',product_page_url=auto,methodology_url=auto,primary_or_derived='primário',limitations='Auto de infração é ato administrativo de fiscalização e não equivale, isoladamente, a decisão final de responsabilidade, censo de todos os ilícitos ambientais ou medida direta de impacto ecológico. Registros em papel podem ter sido cadastrados posteriormente e coordenadas são referências do local.',last_verified='2026-08-17',distributions=[dict(distribution_name='Autos de Infração Ibama — dados estruturados',access_url=auto,format='CSV | XML | JSON | HTML',access_protocol='HTTPS download | CKAN API',access_tool='CKAN | navegador web | script/API',free_download='sim',authentication_required='não',access_conditions='download e consulta pública por recurso/formato',license='Outra (Aberta), conforme catálogo CKAN do dataset',provider_attribution_required='sim',subset_support='por tabela/recurso; filtros após download ou conforme recursos CKAN',notes='Preservar as chaves entre auto principal e tabelas relacionadas; data de atualização de metadados não deve ser interpretada como data do último auto.')]),
            dict(product_name='Fiscalização — Termos de Embargo — Ibama',product_acronym='Termos de Embargo Ibama',product_family='Fiscalização ambiental — embargos',product_kind='dataset_series',product_description='Conjunto oficial de termos de embargo registrados no sistema de fiscalização do Ibama, incluindo atributos principais, itens, coordenadas, decisões judiciais, enquadramentos e histórico, complementado por camada geoespacial de áreas embargadas.',research_areas='Conservation | Environmental management | Geospatial data | Environmental science',keywords='Ibama | embargo | environmental enforcement | polygons | administrative records | sanctions',geographic_coverage='Brasil — território nacional',covers_brazil='sim',spatial_support='termos administrativos | pontos de referência | polígonos de áreas embargadas quando disponíveis',spatial_resolution='por termo; delimitação vetorial ou coordenadas conforme registro',temporal_coverage='todos os termos registrados no sistema de fiscalização; série corrente',temporal_resolution='data e hora da lavratura e histórico de alterações',update_frequency='diária para o conjunto administrativo; recursos geoespaciais possuem atualização própria',product_status='ativo',version_or_collection='versão 2.0 do conjunto administrativo; camada geoespacial publicada separadamente',enumeration_scope='complete',product_page_url=embargo,methodology_url=embargo,primary_or_derived='primário',limitations='Embargo formaliza medida administrativa para paralisar obra ou atividade e resguardar o processo; não equivale automaticamente a decisão judicial definitiva, magnitude do dano ambiental ou condição atual da cobertura do solo. Situação, decisões e geometrias podem mudar.',last_verified='2026-08-17',distributions=[dict(distribution_name='Termos de Embargo Ibama — registros administrativos',access_url=embargo,format='CSV | XML | JSON',access_protocol='HTTPS download | CKAN API',access_tool='CKAN | navegador web | script/API',free_download='sim',authentication_required='não',access_conditions='download e consulta pública por tabela/recurso',license='Outra (Aberta), conforme catálogo CKAN do dataset administrativo',provider_attribution_required='sim',subset_support='por tabela/recurso; atributos e histórico separados',notes='O conjunto inclui tabelas próprias para itens, coordenadas, decisões judiciais, enquadramentos e histórico; preservar essas relações.'),dict(distribution_name='Termos de Embargo Ibama — polígonos de áreas embargadas',access_url=embargo_geo,format='SHP-ZIP',access_protocol='HTTPS download',access_tool='navegador web | software SIG',free_download='sim',authentication_required='não',access_conditions='download público do recurso geoespacial',license='Open Data Commons Open Database License (ODbL)',provider_attribution_required='sim',subset_support='arquivo geoespacial; subset após download',notes='Recurso geoespacial possui ciclo de atualização próprio e não deve ser presumido sincrônico com todas as tabelas administrativas do sistema de fiscalização.')]),
            dict(product_name='Sisfogo — Registros de Ocorrências de Incêndio (ROI) — Ibama/Prevfogo',product_acronym='Sisfogo ROI',product_family='Incêndios florestais — registros operacionais',product_kind='dataset_series',product_description='Registros de Ocorrências de Incêndio verificados pelas brigadas do Prevfogo e publicados pelo Ibama em formatos estruturados.',research_areas='Fire ecology | Environmental management | Geospatial data | Environmental science',keywords='Sisfogo | ROI | wildfire | fire occurrence | Prevfogo | Ibama',geographic_coverage='Brasil — ocorrências verificadas pelas brigadas Prevfogo e registradas no Sisfogo',covers_brazil='sim',spatial_support='registro de ocorrência de incêndio; localização conforme ficha operacional',spatial_resolution='por ocorrência registrada; precisão depende do registro de campo',temporal_coverage='registros operacionais disponíveis no Sisfogo; período varia conforme acervo',temporal_resolution='por ocorrência',update_frequency='conforme registros operacionais e publicação do conjunto',product_status='ativo',version_or_collection='conjunto Sisfogo ROI corrente; metadados CKAN atualizados em 13/11/2025',enumeration_scope='complete',product_page_url=sisfogo,methodology_url=sisfogo,primary_or_derived='primário',limitations='ROI representa ocorrências verificadas e registradas por brigadas Prevfogo e não um censo de todos os incêndios do Brasil. Não é equivalente a foco de calor por satélite, área queimada mapeada ou evento de fogo derivado por sensoriamento remoto.',last_verified='2026-08-17',distributions=[dict(distribution_name='Sisfogo ROI — dados abertos',access_url=sisfogo,format='HTML | CSV | XML | JSON',access_protocol='HTTPS download | CKAN API',access_tool='CKAN | navegador web | script/API',free_download='sim',authentication_required='não',access_conditions='consulta e download públicos',license='Creative Commons Atribuição, conforme catálogo CKAN',provider_attribution_required='sim',subset_support='por recurso/formato; filtragem após download',notes='Manter ROI distinto de focos de calor, área queimada e demais produtos de fogo; cobertura depende das ocorrências verificadas pelas brigadas Prevfogo.')]),
            dict(product_name='Sinaflor — POA Outros Biomas — Ibama',product_acronym='Sinaflor POA Outros Biomas',product_family='Autorizações e manejo florestal — registros administrativos',product_kind='dataset_series',product_description='Dados de solicitações e autorizações de licenciamento de exploração do tipo Plano Operacional Anual cadastradas no Sinaflor e situadas fora da Amazônia Legal.',research_areas='Forest ecology | Land use and land cover | Environmental management | Environmental science',keywords='Sinaflor | POA | forest management | authorization | logging | other biomes | Ibama',geographic_coverage='Brasil fora da Amazônia Legal — registros de POA cadastrados no Sinaflor',covers_brazil='sim',spatial_support='solicitação/autorização administrativa e atributos associados',spatial_resolution='por processo/POA; geometria e localização conforme registro',temporal_coverage='registros cadastrados no Sinaflor; período conforme acervo',temporal_resolution='por solicitação/autorização',update_frequency='semanal conforme metadados oficiais',product_status='ativo',version_or_collection='conjunto corrente; metadados CKAN atualizados em 11/11/2025',enumeration_scope='complete',product_page_url=sinaflor,methodology_url=sinaflor,primary_or_derived='primário',limitations='Solicitação ou autorização de exploração não equivale a corte efetivamente realizado, volume removido observado ou desmatamento detectado. O produto cobre POA fora da Amazônia Legal e deve ser combinado com outros módulos do Sinaflor para análises nacionais completas.',last_verified='2026-08-17',distributions=[dict(distribution_name='Sinaflor POA Outros Biomas — dados abertos',access_url=sinaflor,format='CSV | XML | JSON | metadados CSV',access_protocol='HTTPS download | CKAN API',access_tool='CKAN | navegador web | script/API',free_download='sim',authentication_required='não',access_conditions='consulta e download públicos',license='Outra (Aberta), conforme catálogo CKAN',provider_attribution_required='sim',subset_support='por recurso/formato; filtragem após download',notes='Distinguir solicitações de autorizações e não inferir execução material da exploração a partir do registro administrativo.')]),
            dict(product_name='Siscites — Licenças de Fauna e Flora Emitidas — Ibama',product_acronym='Siscites',product_family='Comércio internacional de fauna e flora — licenças',product_kind='dataset_series',product_description='Dados oficiais de licenças emitidas pelo Ibama para importação, exportação e reexportação de espécimes, produtos e subprodutos da fauna e flora silvestre brasileira e exótica, abrangidos ou não pela CITES.',research_areas='Biodiversity | Conservation | Environmental management | Environmental science',keywords='Siscites | CITES | wildlife trade | flora | fauna | import | export | permits | Ibama',geographic_coverage='Brasil — licenças emitidas pelo Ibama para operações de importação, exportação e reexportação',covers_brazil='sim',spatial_support='licença/registro administrativo e partes envolvidas conforme base',spatial_resolution='por licença/operação; não é camada espacial contínua',temporal_coverage='licenças emitidas registradas no Siscites; série corrente',temporal_resolution='por licença',update_frequency='diária conforme metadados oficiais',product_status='ativo',version_or_collection='conjunto corrente; metadados CKAN atualizados em 26/05/2026',enumeration_scope='complete',product_page_url=siscites,methodology_url=siscites,primary_or_derived='primário',limitations='Licenças emitidas representam operações autorizadas administrativamente e não equivalem ao volume efetivamente transacionado, comércio ilegal, ocorrência natural das espécies ou impacto populacional. Comparações devem preservar espécie/táxon, tipo de operação, produto e regime CITES aplicável.',last_verified='2026-08-17',distributions=[dict(distribution_name='Siscites — licenças emitidas',access_url=siscites,format='HTML | CSV | XML | JSON',access_protocol='HTTPS download | CKAN API',access_tool='CKAN | navegador web | script/API',free_download='sim',authentication_required='não',access_conditions='consulta e download públicos',license='Creative Commons Atribuição, conforme catálogo CKAN',provider_attribution_required='sim',subset_support='por recurso/formato; filtragem após download',notes='Não interpretar licença emitida como confirmação de comércio realizado nem como registro de ocorrência da espécie.')])
          ]

          existing={p['product_name'].strip().casefold():p['product_id'] for p in products}
          pnext=maxid(products,'product_id','DP'); dnext=maxid(dists,'distribution_id','DD')
          added=[]; added_d=[]
          existing_dist={(d['product_id'],d['distribution_name'].strip().casefold()) for d in dists}
          for c in candidates:
              key=c['product_name'].casefold()
              if key in existing:
                  pid=existing[key]; print('SKIP product',pid,c['product_name'])
              else:
                  pnext+=1; pid=f'DP{pnext:06d}'
                  row={k:'' for k in pf}; row.update({k:v for k,v in c.items() if k in pf}); row['product_id']=pid; row['resource_id']=rid
                  added.append(row); existing[key]=pid
              for d in c['distributions']:
                  dk=(pid,d['distribution_name'].casefold())
                  if dk in existing_dist: continue
                  dnext+=1; row={k:'' for k in df}; row.update(d); row['distribution_id']=f'DD{dnext:06d}'; row['product_id']=pid; row['last_verified']='2026-08-17'; added_d.append(row); existing_dist.add(dk)
          if added:
              with product_path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=pf,lineterminator='\n'); [w.writerow(r) for r in added]
          if added_d:
              with dist_path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=df,lineterminator='\n'); [w.writerow(r) for r in added_d]
          print('SOURCE',rid,'ADDED_PRODUCTS',[(r['product_id'],r['product_name']) for r in added])
          print('ADDED_DISTRIBUTIONS',[(r['distribution_id'],r['product_id']) for r in added_d])
          PY
      - name: Validate rebuild and read back
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv,json
          def rows(p):
            with open(p,encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len({x['resource_id'] for x in s})==len(s)
          assert len({x['product_id'] for x in p})==len(p)
          assert len({x['distribution_id'] for x in d})==len(d)
          rs={x['resource_id'] for x in s}; ps={x['product_id'] for x in p}
          assert all(x['resource_id'] in rs for x in p); assert all(x['product_id'] in ps for x in d)
          ib=[x for x in s if x['resource_name']=='Dados Abertos e Sistemas Ambientais — Ibama']; assert len(ib)==1
          rid=ib[0]['resource_id']; targets=[x for x in p if x['resource_id']==rid]
          expected={'Fiscalização — Autos de Infração Ambiental — Ibama','Fiscalização — Termos de Embargo — Ibama','Sisfogo — Registros de Ocorrências de Incêndio (ROI) — Ibama/Prevfogo','Sinaflor — POA Outros Biomas — Ibama','Siscites — Licenças de Fauna e Flora Emitidas — Ibama'}
          assert expected.issubset({x['product_name'] for x in targets})
          for x in targets:
            if x['product_name'] in expected: assert any(y['product_id']==x['product_id'] for y in d)
          pr=json.load(open('data/brazil_scope_priorities.json',encoding='utf-8')); p0=next(t for t in pr['tiers'] if t['priority_tier']=='P0'); assert rid in p0['resource_ids']
          print(f'COUNTS resources={len(s)} products={len(p)} distributions={len(d)} IBAMA={rid}')
          PY
      - name: Commit materialized catalog and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_resources.json data/data_products.json data/data_quality_report.json data/build-meta.json data/link_role_audit.json
          git rm .github/workflows/materialize-ibama-20260817.yml
          git commit -m "Expand verified Ibama environmental catalog"
          git push origin HEAD:main
