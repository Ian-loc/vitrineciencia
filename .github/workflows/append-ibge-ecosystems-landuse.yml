name: Append IBGE ecosystems and land-use batch
on:
  push:
    branches: [audit/ibge-batch-ecosystems-landuse]
permissions:
  contents: write
jobs:
  append-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-batch-ecosystems-landuse
          fetch-depth: 0
      - name: Append canonical batch and validate
        run: |
          python3 scripts/append_ibge_ecosystems_landuse.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commit canonical delta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Expandir lote IBGE ecossistemas e uso da terra" || exit 0
          git push origin HEAD:audit/ibge-batch-ecosystems-landuse
