name: QA normalization materializer

on:
  push:
    branches: ["qa/normalization-residues-20260820"]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[normalization-derived]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: qa/normalization-residues-20260820

      - name: Rebuild and validate QA batch
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_schema_identity.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/validate_normalization_residues.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Confirm no canonical catalog expansion
        run: |
          git diff --exit-code HEAD -- data/data_resources.csv data/data_products.csv data/product_distributions.csv

      - name: Persist synchronized derived artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          if git diff --cached --quiet; then
            echo "No derived changes to persist"
            exit 0
          fi
          git commit -m "QA/QC: materialize normalization fixes [normalization-derived]"
          git push origin HEAD:qa/normalization-residues-20260820

