name: One-shot SICAR reference bases

on:
  push:
    paths:
      - '.github/workflows/one-shot-sicar-reference-bases-20260817.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified SICAR reference products
        shell: bash
        run: |
          python - <<'PY'
          import csv, pathlib
          ppath=pathlib.Path('data/data_products.csv'); dpath=pathlib.Path('data/product_distributions.csv')
          with ppath.open(encoding='utf-8', newline='') as f: ps=list(csv.DictReader(f))
          with dpath.open(encoding='utf-8', newline='') as f: ds=list(csv.DictReader(f))
          pids={r['product_id'] for r in ps}; dids={r['distribution_id'] for r in ds}; urls={r['product_page_url'] for r in ps if r['product_page_url']}
          P=[
          ['DP000442','DR0109','Regularização Ambiental — Base de Referência de Hidrografia por Estado — SICAR/SFB','SICAR Ref. Hidrografia','SICAR — bases de referência para regularização ambiental','dataset_series','Bases estaduais de referência de hidrografia disponibilizadas pelo SFB para apoiar análises de regularização ambiental no SICAR, acompanhadas de metadados e recursos por estado.','Environmental management | Environmental science | Geospatial data','SICAR | CAR | regularização ambiental | hidrografia | APP | reference data','Brasil — estados com bases de hidrografia disponibilizadas no conjunto; cobertura e versão variam por UF','sim','feições hidrográficas/base de referência estadual','varia por UF e base de origem; consultar metadados estaduais','bases correntes por UF; conjunto criado em 2025 e atualizado no portal em 01/07/2026','por versão/base estadual','conforme atualização das bases de referência','ativo','conjunto corrente; portal atualizado em 01/07/2026','complete','https://dados.florestal.gov.br/dataset/base-de-referencia-car-hidrografia','https://dados.florestal.gov.br/dataset/base-de-referencia-car-hidrografia','derivado','Base de referência operacional para análise de regularização ambiental. Fontes, escala, data e completude podem variar entre UFs; não tratar como hidrografia nacional homogênea nem como delimitação jurídica automática de APP sem aplicar as regras e procedimentos pertinentes.','2026-08-17'],
          ['DP000443','DR0109','Regularização Ambiental — Base de Referência de Relevo, APP e Uso Restrito por Estado — SICAR/SFB','SICAR Ref. Relevo','SICAR — bases de referência para regularização ambiental','dataset_series','Bases estaduais de referência de relevo usadas nas análises de regularização ambiental, incluindo elementos relacionados a Áreas de Preservação Permanente e áreas de Uso Restrito conforme os recursos publicados.','Environmental management | Environmental science | Geospatial data','SICAR | CAR | regularização ambiental | relevo | APP | uso restrito | reference data','Brasil — estados com bases de relevo disponibilizadas no conjunto; cobertura e versão variam por UF','sim','base estadual de relevo e feições derivadas para análise','varia por UF, insumo e processamento; consultar metadados','bases correntes por UF; conjunto criado em 2025 e atualizado no portal em 01/07/2026','por versão/base estadual','conforme atualização das bases de referência','ativo','conjunto corrente; portal atualizado em 01/07/2026','complete','https://dados.florestal.gov.br/dataset/base-de-referencia-car-relevo','https://dados.florestal.gov.br/dataset/base-de-referencia-car-relevo','derivado','As bases são insumos de referência para análise do CAR/PRA. Escala, método e fonte variam entre UFs; feições derivadas de relevo não constituem por si só decisão jurídica definitiva sobre APP, Uso Restrito ou conformidade de um imóvel.','2026-08-17'],
          ['DP000444','DR0109','Regularização Ambiental — Base de Referência de Uso e Cobertura do Solo por Estado — SICAR/SFB','SICAR Ref. Uso do Solo','SICAR — bases de referência para regularização ambiental','dataset_series','Bases estaduais de referência de uso e cobertura do solo disponibilizadas pelo SFB para apoiar análises de regularização ambiental no SICAR.','Environmental management | Environmental science | Geospatial data','SICAR | CAR | regularização ambiental | land use | land cover | reference data','Brasil — estados com bases de uso e cobertura do solo disponibilizadas; cobertura, data e versão variam por UF','sim','classe/feição de uso e cobertura do solo em base estadual','varia por UF, produto de origem e processamento; consultar metadados','bases correntes por UF; conjunto criado em 2025 e atualizado no portal em 01/07/2026','por versão/base estadual','conforme atualização das bases de referência','ativo','conjunto corrente; portal atualizado em 01/07/2026','complete','https://dados.florestal.gov.br/dataset/base-de-referencia-car-uso-do-solo','https://dados.florestal.gov.br/dataset/base-de-referencia-car-uso-do-solo','derivado','Não é uma série nacional homogênea de cobertura e uso da terra. Origem, data, legenda, resolução e método podem variar por UF; a base apoia análise administrativa e não substitui validação de campo nem prova automaticamente conformidade ambiental.','2026-08-17'],
          ['DP000445','DR0109','Regularização Ambiental — Base de Referência de Servidão Administrativa por Estado — SICAR/SFB','SICAR Ref. Servidão','SICAR — bases de referência para regularização ambiental','dataset_series','Bases estaduais de referência de servidão administrativa disponibilizadas pelo SFB para apoiar as análises da regularização ambiental de imóveis inscritos no SICAR.','Environmental management | Environmental science | Geospatial data','SICAR | CAR | regularização ambiental | servidão administrativa | infrastructure | reference data','Brasil — estados com bases de servidão administrativa disponibilizadas; cobertura e versão variam por UF','sim','feição de servidão administrativa/base estadual','varia por UF e dado de origem; consultar metadados','bases correntes por UF; conjunto criado em 2025 e atualizado no portal em 08/12/2025','por versão/base estadual','conforme atualização das bases de referência','ativo','conjunto corrente; portal atualizado em 08/12/2025','complete','https://dados.florestal.gov.br/dataset/base-de-referencia-car-servidao-administrativa','https://dados.florestal.gov.br/dataset/base-de-referencia-car-servidao-administrativa','derivado','A base apoia análises do SICAR e depende das fontes administrativas incorporadas em cada UF. Ausência de feição não prova inexistência jurídica de servidão, e presença na base não substitui documentação ou decisão administrativa aplicável ao imóvel.','2026-08-17']]
          D=[
          ['DD000465','DP000442','SICAR — Hidrografia — bases estaduais e metadados','https://dados.florestal.gov.br/dataset/base-de-referencia-car-hidrografia','link | PDF','HTTPS / CKAN','navegador web | API CKAN','sim','não','acesso público','Creative Commons Attribution','sim','por UF/recurso publicado','O CKAN organiza metadados e links das bases estaduais; formato e fonte efetiva devem ser conferidos no recurso de cada UF.','2026-08-17'],
          ['DD000466','DP000443','SICAR — Relevo, APP e Uso Restrito — bases estaduais e metadados','https://dados.florestal.gov.br/dataset/base-de-referencia-car-relevo','link | PDF','HTTPS / CKAN','navegador web | API CKAN','sim','não','acesso público','Creative Commons Attribution','sim','por UF/recurso publicado','O conjunto disponibiliza recursos por UF; escala, processamento e formato do dado efetivo variam e devem ser lidos nos metadados.','2026-08-17'],
          ['DD000467','DP000444','SICAR — Uso e Cobertura do Solo — bases estaduais e metadados','https://dados.florestal.gov.br/dataset/base-de-referencia-car-uso-do-solo','link | PDF','HTTPS / CKAN','navegador web | API CKAN','sim','não','acesso público','Creative Commons Attribution','sim','por UF/recurso publicado','Recursos são organizados por UF; não generalizar legenda, resolução, ano ou formato entre estados sem verificar a base de origem.','2026-08-17'],
          ['DD000468','DP000445','SICAR — Servidão Administrativa — bases estaduais e metadados','https://dados.florestal.gov.br/dataset/base-de-referencia-car-servidao-administrativa','link | PDF','HTTPS / CKAN','navegador web | API CKAN','sim','não','acesso público','Creative Commons Attribution','sim','por UF/recurso publicado','Recursos estaduais funcionam como bases de referência administrativas; cobertura e formato variam conforme UF e fonte de origem.','2026-08-17']]
          for r in P:
              assert r[0] not in pids and r[19] not in urls, r[0]
          for r in D: assert r[0] not in dids, r[0]
          with ppath.open('a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(P)
          with dpath.open('a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(D)
          print('APPENDED',len(P),len(D))
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity
        run: |
          python - <<'PY'
          import csv
          def R(p):
              with open(p,encoding='utf-8',newline='') as f:return list(csv.DictReader(f))
          rs=R('data/data_resources.csv'); ps=R('data/data_products.csv'); ds=R('data/product_distributions.csv')
          rids={x['resource_id'] for x in rs}; pids={x['product_id'] for x in ps}; dids={x['distribution_id'] for x in ds}
          assert len(rs)==len(rids)==109
          assert len(ps)==len(pids)==441
          assert len(ds)==len(dids)==464
          assert all(p['resource_id'] in rids for p in ps)
          assert all(d['product_id'] in pids for d in ds)
          for i in range(442,446): assert f'DP{i:06d}' in pids
          for i in range(465,469): assert f'DD{i:06d}' in dids
          print('READBACK_OK',len(rs),len(ps),len(ds))
          PY
      - name: Commit materialized batch and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-sicar-reference-bases-20260817.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git add -u .github/workflows/one-shot-sicar-reference-bases-20260817.yml
          git diff --cached --check
          git commit -m 'Expand verified SICAR reference-base catalog'
          git push origin HEAD:main
