name: Run corrected SGB analytical batch

on:
  push:
    paths:
      - '.github/workflows/run-corrected-sgb-batch.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute corrected embedded batch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/materialize-sgb-geology-next.yml').read_text(encoding='utf-8')
          src=src.replace("'authentication_required':'não para consulta pública'", "'authentication_required':'não'", 1)
          lines=src.splitlines()
          start=next(i for i,l in enumerate(lines) if l.strip()=="python - <<'PY'") + 1
          end=next(i for i in range(start,len(lines)) if lines[i].strip()=='PY')
          code=textwrap.dedent('\n'.join(lines[start:end]))
          exec(compile(code,'embedded_sgb_batch.py','exec'),{})
          PY
      - name: Validate and rebuild catalog
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back relational integrity
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def read(p):
              with Path(p).open(encoding='utf-8', newline='') as f: return list(csv.DictReader(f))
          resources=read('data/data_resources.csv'); products=read('data/data_products.csv'); dists=read('data/product_distributions.csv')
          rids={r['resource_id'] for r in resources}; pids={p['product_id'] for p in products}; dids={d['distribution_id'] for d in dists}
          assert len(rids)==len(resources) and len(pids)==len(products) and len(dids)==len(dists)
          assert all(p['resource_id'] in rids for p in products)
          assert all(d['product_id'] in pids for d in dists)
          assert all(f'DP000{i}' in pids for i in range(356,363))
          assert all(f'DD000{i}' in dids for i in range(377,384))
          assert len(resources)==104 and len(products)==358 and len(dists)==379
          print('counts',len(resources),len(products),len(dists))
          PY
      - name: Commit canonical data only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json docs/vitrine-ciencia/data_products.json docs/vitrine-ciencia/link_role_audit.json 2>/dev/null || true
          git add -u data docs
          git commit -m 'Expand verified SGB analytical and geoheritage catalog'
          git push
