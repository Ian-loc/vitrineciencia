name: Materialize verified ANA atlas batch

on:
  push:
    paths:
      - '.github/workflows/materialize-ana-atlas-batch.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified ANA products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, io
          from pathlib import Path

          products_path = Path('data/data_products.csv')
          dists_path = Path('data/product_distributions.csv')
          resources_path = Path('data/data_resources.csv')

          with resources_path.open(encoding='utf-8-sig', newline='') as f:
              resources = list(csv.DictReader(f))
          assert any(r['resource_id'] == 'DR0017' for r in resources), 'DR0017 ausente'

          with products_path.open(encoding='utf-8-sig', newline='') as f:
              pr = csv.DictReader(f); pfields = list(pr.fieldnames or []); old_products = list(pr)
          with dists_path.open(encoding='utf-8-sig', newline='') as f:
              dr = csv.DictReader(f); dfields = list(dr.fieldnames or []); old_dists = list(dr)

          new_products = [
            {
              'product_id':'DP000287','resource_id':'DR0017','product_name':'Atlas Irrigação — Uso da Água na Agricultura Irrigada, 2ª edição 2021','product_acronym':'Atlas Irrigação 2021','product_family':'Planejamento e uso da água na agricultura irrigada','product_kind':'indicator_family','product_description':'Síntese nacional da ANA sobre agricultura irrigada que integra retrospectiva, áreas irrigadas, potencial de expansão, uso da água e polos de agricultura irrigada para apoiar planejamento e gestão de recursos hídricos.','research_areas':'Water resources | Hydrology | Agriculture | Environmental planning','keywords':'irrigação | agricultura irrigada | uso da água | demanda hídrica | potencial de expansão | ANA','geographic_coverage':'Brasil; recortes territoriais e polos conforme tema e base do Atlas','covers_brazil':'sim','spatial_support':'áreas irrigadas | municípios | polos | bacias e agregações territoriais conforme tema','spatial_resolution':'varia conforme camada, indicador e fonte integrada','temporal_coverage':'2ª edição publicada em 2021; retrospectivas e projeções variam conforme capítulo/indicador','temporal_resolution':'varia conforme indicador e série de origem','update_frequency':'por edição/revisão do Atlas','product_status':'ativo','version_or_collection':'2ª edição, 2021','enumeration_scope':'complete','product_page_url':'https://www.ana.gov.br/atlasirrigacao/','methodology_url':'https://www.ana.gov.br/atlasirrigacao/','primary_or_derived':'derivado','limitations':'Síntese multifuente e parcialmente modelada: áreas irrigadas, demandas, potenciais e projeções possuem métodos e anos de referência próprios. Não equivale a medição em tempo real da área irrigada nem a captação observada em cada empreendimento.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000288','resource_id':'DR0017','product_name':'Atlas Águas — Segurança Hídrica do Abastecimento Urbano 2021','product_acronym':'Atlas Águas 2021','product_family':'Segurança hídrica e abastecimento urbano','product_kind':'indicator_family','product_description':'Diagnóstico e planejamento nacional da ANA sobre mananciais e sistemas de abastecimento urbano, incorporando índice de segurança hídrica urbano, alternativas técnicas e necessidades de investimento e gestão.','research_areas':'Water security | Water resources | Urban systems | Environmental planning','keywords':'abastecimento urbano | segurança hídrica | mananciais | sistemas de abastecimento | investimentos | ANA','geographic_coverage':'Brasil — 5.570 municípios avaliados na edição 2021','covers_brazil':'sim','spatial_support':'município | sede urbana | manancial | sistema de produção | intervenções planejadas','spatial_resolution':'municipal/sistema/manancial conforme componente','temporal_coverage':'edição 2021 com horizonte de planejamento até 2035','temporal_resolution':'diagnóstico por edição; horizontes futuros conforme componente','update_frequency':'por edição/revisão do Atlas','product_status':'ativo','version_or_collection':'Atlas Águas 2021','enumeration_scope':'complete','product_page_url':'https://www.ana.gov.br/atlasaguas/','methodology_url':'https://www.ana.gov.br/atlasaguas/','primary_or_derived':'derivado','limitations':'Produto de diagnóstico e planejamento, não monitoramento operacional em tempo real. Índices e propostas de intervenção dependem das bases e hipóteses da edição 2021; não garantem condição atual do serviço nem execução das obras propostas.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000289','resource_id':'DR0017','product_name':'Atlas Esgotos — Despoluição de Bacias Hidrográficas 2017','product_acronym':'Atlas Esgotos 2017','product_family':'Esgotamento sanitário e impactos nos recursos hídricos','product_kind':'indicator_family','product_description':'Diagnóstico nacional ANA/SNSA sobre coleta e tratamento de esgotos urbanos, cargas orgânicas, capacidade de diluição dos corpos receptores, impactos associados e soluções de tratamento e investimento.','research_areas':'Water quality | Water resources | Urban systems | Environmental planning','keywords':'esgotamento sanitário | DBO | carga orgânica | tratamento de esgotos | corpos receptores | ANA','geographic_coverage':'Brasil — 5.570 cidades brasileiras na edição 2017','covers_brazil':'sim','spatial_support':'município | sistema de esgotamento | corpo receptor | trechos de rios e agregações','spatial_resolution':'municipal e rede hidrográfica/modelagem conforme componente','temporal_coverage':'edição 2017; horizonte de planejamento até 2035; bases auxiliares podem ter atualizações posteriores','temporal_resolution':'diagnóstico por edição e cenário de planejamento','update_frequency':'por edição/atualização temática','product_status':'ativo','version_or_collection':'Atlas Esgotos 2017','enumeration_scope':'complete','product_page_url':'https://www.ana.gov.br/atlasesgotos/','methodology_url':'https://www.ana.gov.br/atlasesgotos/','primary_or_derived':'derivado','limitations':'Os impactos sobre corpos hídricos incluem modelagem de carga/DBO e não equivalem a uma rede nacional de medições in situ de qualidade da água. É um diagnóstico de referência da edição 2017; cobertura de serviços e infraestrutura podem ter mudado desde então.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000290','resource_id':'DR0017','product_name':'Massas d’Água — ANA/SNIRH','product_acronym':'Massas d’Água','product_family':'Base Hidrográfica Ottocodificada — massas d’água','product_kind':'dataset','product_description':'Base vetorial nacional da ANA com polígonos de massas d’água naturais e artificiais, classificadas também segundo o domínio das águas, disponibilizada pelo Catálogo de Metadados do SNIRH.','research_areas':'Hydrology | Water resources | Geospatial information science | Environmental monitoring','keywords':'massas d’água | espelho d’água | reservatórios | lagos | lagoas | hidrografia | SNIRH | ANA','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'polígono de massa d’água','spatial_resolution':'escala de referência 1:100.000 conforme metadado oficial','temporal_coverage':'base associada a referência 2019 no catálogo; metadado publicado em 2020 e marcado como contínuo','temporal_resolution':'não se aplica; inventário cartográfico com atualização contínua conforme catálogo','update_frequency':'contínua conforme metadado oficial','product_status':'ativo','version_or_collection':'GEOFT_BHO_MASSA_DAGUA — catálogo oficial verificado em 2026','enumeration_scope':'complete','product_page_url':'https://metadados.snirh.gov.br/geonetwork/srv/search?keyword=GEOFT_BHO_MASSA_DAGUA','methodology_url':'https://metadados.snirh.gov.br/geonetwork/srv/search?keyword=GEOFT_BHO_MASSA_DAGUA','primary_or_derived':'derivado','limitations':'Representação cartográfica de massas d’água em escala 1:100.000; não é cadastro de precisão local, série de volume armazenado, vazão ou qualidade da água. Contagens e atributos podem mudar com atualizações contínuas, portanto registrar a versão/data de extração usada.','last_verified':'2026-08-16'
            }
          ]

          new_dists = [
            {'distribution_id':'DD000308','product_id':'DP000287','distribution_name':'Atlas Irrigação — hotsite, publicação e dados associados','access_url':'https://www.ana.gov.br/atlasirrigacao/','format':'aplicação web | publicação PDF | dados e mapas associados conforme portal/SNIRH','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF | software tabular/geoespacial conforme arquivo','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; verificar condições específicas de arquivos associados','license':'dados abertos da ANA são disponibilizados para livre utilização; verificar licença/termos específicos no arquivo utilizado','provider_attribution_required':'sim','subset_support':'por tema, território, indicador e arquivo conforme hotsite/SNIRH','notes':'A segunda edição em português foi publicada em 2021; traduções posteriores não constituem nova edição metodológica do produto.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000309','product_id':'DP000288','distribution_name':'Atlas Águas — hotsite, publicação e metadados','access_url':'https://www.ana.gov.br/atlasaguas/','format':'aplicação web | publicação PDF | mapas, indicadores e metadados','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública','license':'dados abertos da ANA são disponibilizados para livre utilização; verificar licença/termos específicos no arquivo utilizado','provider_attribution_required':'sim','subset_support':'por município, sistema/manancial e componentes disponíveis na aplicação','notes':'A edição 2021 avalia o abastecimento urbano nacional e apresenta diagnóstico, índice de segurança hídrica e planejamento de intervenções até 2035.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000310','product_id':'DP000289','distribution_name':'Atlas Esgotos — hotsite, publicação e dados por município','access_url':'https://www.ana.gov.br/atlasesgotos/','format':'aplicação web | publicação PDF | tabelas/mapas e dados por município conforme interface','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública','license':'dados abertos da ANA são disponibilizados para livre utilização; verificar licença/termos específicos no arquivo utilizado','provider_attribution_required':'sim','subset_support':'por município e componentes/indicadores conforme interface','notes':'O produto combina diagnóstico sanitário e modelagem do impacto de cargas orgânicas nos corpos hídricos; não confundir modelagem de DBO com observações in situ.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000311','product_id':'DP000290','distribution_name':'Massas d’Água — Catálogo de Metadados ANA/SNIRH','access_url':'https://metadados.snirh.gov.br/geonetwork/srv/search?keyword=GEOFT_BHO_MASSA_DAGUA','format':'vetor | metadados geoespaciais | download/visualização conforme catálogo','access_protocol':'HTTPS web | serviços/download conforme GeoNetwork','access_tool':'navegador web | software GIS conforme arquivo/serviço','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos conforme catálogo','license':'dados abertos da ANA são disponibilizados para livre utilização; verificar licença/termos específicos no arquivo ou serviço utilizado','provider_attribution_required':'sim','subset_support':'por camada/download; filtros e serviços conforme catálogo','notes':'O metadado oficial identifica recurso vetorial, escala 1:100.000, referência 2019, ano de metadado 2020 e frequência/status contínuos.','last_verified':'2026-08-16'}
          ]

          existing_pids = {r['product_id'] for r in old_products}
          existing_dids = {r['distribution_id'] for r in old_dists}
          existing_names = {r['product_name'].strip().casefold() for r in old_products}
          existing_urls = {r['product_page_url'].strip() for r in old_products}
          for r in new_products:
              assert r['product_id'] not in existing_pids, r['product_id']
              assert r['product_name'].strip().casefold() not in existing_names, r['product_name']
              assert r['product_page_url'] not in existing_urls, ('URL de produto já usada', r['product_page_url'])
          for r in new_dists:
              assert r['distribution_id'] not in existing_dids, r['distribution_id']

          def append_rows(path, fields, rows):
              raw = path.read_bytes()
              assert raw.endswith(b'\n'), f'{path} não termina com LF'
              buf = io.StringIO(newline='')
              w = csv.DictWriter(buf, fieldnames=fields, lineterminator='\n')
              for row in rows:
                  assert set(row) == set(fields), (path, set(fields)-set(row), set(row)-set(fields))
                  w.writerow(row)
              with path.open('a', encoding='utf-8', newline='') as f:
                  f.write(buf.getvalue())

          append_rows(products_path, pfields, new_products)
          append_rows(dists_path, dfields, new_dists)
          print('APPENDED', len(new_products), 'products and', len(new_dists), 'distributions')
          PY

      - name: Validate consolidated catalog
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len({r['resource_id'] for r in s}) == len(s)
          assert len({r['product_id'] for r in p}) == len(p)
          assert len({r['distribution_id'] for r in d}) == len(d)
          sids={r['resource_id'] for r in s}; pids={r['product_id'] for r in p}
          assert all(r['resource_id'] in sids for r in p)
          assert all(r['product_id'] in pids for r in d)
          for pid in ['DP000287','DP000288','DP000289','DP000290']:
              assert sum(r['product_id']==pid for r in p)==1
              assert sum(r['product_id']==pid for r in d)>=1
          print(f'READBACK sources={len(s)} products={len(p)} distributions={len(d)}')
          PY

      - name: Commit materialized canonical state and self-clean workflow
        shell: bash
        run: |
          git config user.name 'vitrine-catalog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/materialize-ana-atlas-batch.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json || true
          git diff --cached --check
          git status --short
          git commit -m 'Expand verified ANA atlas and water-body catalog'
          git push origin HEAD:main
