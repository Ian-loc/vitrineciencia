name: Materializar MapBiomas módulos lote 6
on:
  push:
    branches: [data/mapbiomas-modules-batch-6]
    paths:
      - 'scripts/materialize_mapbiomas_modules_batch6.py'
      - '.github/workflows/materialize-mapbiomas-modules-batch6.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/mapbiomas-modules-batch-6
      - name: Materializar e validar
        run: |
          python scripts/materialize_mapbiomas_modules_batch6.py
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Materializar módulos MapBiomas Água Urbano e Degradação'
            git push origin HEAD:data/mapbiomas-modules-batch-6
          fi
