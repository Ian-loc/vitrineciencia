name: Append lote IBGE 20260814
on:
  push:
    branches: [audit/ibge-batch-areas-macro]
permissions:
  contents: write
jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-batch-areas-macro
          fetch-depth: 0
      - name: Aplicar e validar
        run: |
          python3 scripts/append_ibge_batch_20260814.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar dados canônicos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Adicionar lote IBGE áreas urbanizadas e macrocaracterização" || exit 0
          git push origin HEAD:audit/ibge-batch-areas-macro
