name: PR diagnose legacy BDMEP

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Inspect legacy and canonical BDMEP representations
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          ps=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')))
          ds=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')))
          legacy=[p for p in ps if p['resource_id']=='DR0018']
          canon=[p for p in ps if p['resource_id']=='DR0118' and ('BDMEP' in p['product_name'] or 'Banco de Dados Meteorológicos' in p['product_name'])]
          print('LEGACY_PRODUCTS',[(p['product_id'],p['product_name'],p['product_page_url'],p['methodology_url']) for p in legacy])
          print('CANON_PRODUCTS',[(p['product_id'],p['product_name'],p['product_page_url'],p['methodology_url']) for p in canon])
          lids={p['product_id'] for p in legacy}
          print('LEGACY_DISTRIBUTIONS',[(d['distribution_id'],d['product_id'],d['distribution_name'],d['access_url']) for d in ds if d['product_id'] in lids])
          assert False, 'diagnostic-only run'
          PY
