name: One-shot INPE BIG materializer 2026-08-18

on:
  push:
    paths:
      - '.github/workflows/tmp-inpe-big-materialize-20260818.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified INPE BIG products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, re
          from pathlib import Path

          products_path = Path('data/data_products.csv')
          dists_path = Path('data/product_distributions.csv')

          with products_path.open(encoding='utf-8', newline='') as f:
              existing_products = list(csv.DictReader(f))
          with dists_path.open(encoding='utf-8', newline='') as f:
              existing_dists = list(csv.DictReader(f))

          existing_names = {r['product_name'] for r in existing_products}
          max_pid = max(int(re.search(r'(\d+)$', r['product_id']).group(1)) for r in existing_products)
          max_did = max(int(re.search(r'(\d+)$', r['distribution_id']).group(1)) for r in existing_dists)

          product_specs = [
            {
              'product_name':'CBERS-2B — produtos históricos de imagens do INPE','product_acronym':'CBERS-2B','product_family':'BIG — acervo histórico CBERS','product_kind':'dataset_series',
              'product_description':'Acervo histórico de imagens CBERS-2B distribuído pelo INPE para os sensores CCD, WFI e HRC em produtos Level-2-DN, preservando resoluções, faixas de imageamento e períodos próprios de cada câmera.',
              'research_areas':'Remote sensing | Land use and land cover | Environmental monitoring','keywords':'CBERS-2B | CCD | WFI | HRC | Level-2-DN | historical imagery','geographic_coverage':'Brasil e demais áreas imageadas/disponíveis no acervo','covers_brazil':'sim','spatial_support':'cena raster | coleção STAC','spatial_resolution':'CCD 20 m | WFI 260 m | HRC 2,7 m','temporal_coverage':'missão CBERS-2B: 2007-09-19 a 2010-04-16; disponibilidade por coleção','temporal_resolution':'por cena; revisita varia por câmera','update_frequency':'acervo histórico; sem novas aquisições','product_status':'arquivado','version_or_collection':'CBERS-2B CCD/WFI/HRC Level-2-DN; acervo revalidado em 2026-08-18','enumeration_scope':'family_level','product_page_url':'https://data.inpe.br/dados/cbers-2b/','methodology_url':'https://data.inpe.br/dados/cbers-2b/','primary_or_derived':'misto','limitations':'Missão encerrada. CCD, WFI e HRC têm resoluções, bandas, faixas e revisitas diferentes; Level-2-DN não equivale a reflectância de superfície e não deve ser combinado entre sensores sem harmonização.','dist_name':'CBERS-2B — acesso BIG/STAC','dist_url':'https://data.inpe.br/dados/cbers-2b/','format':'produtos de imagem Level-2-DN | metadados STAC; formato de asset conforme coleção','protocol':'HTTPS | STAC','tool':'portal BIG | STAC Browser | cliente STAC','license':'consultar metadados da coleção e termos do produto/missão','subset':'por sensor, cena, bbox, tempo e asset conforme serviço','dist_notes':'Acervo histórico com CCD, WFI e HRC; preservar sensor, nível de processamento, resolução e data da cena.'
            },
            {
              'product_name':'CBERS-2 — produtos históricos de imagens do INPE','product_acronym':'CBERS-2','product_family':'BIG — acervo histórico CBERS','product_kind':'dataset_series',
              'product_description':'Acervo histórico de imagens CBERS-2 do INPE, com produtos dos sensores CCD, WFI e IRMSS e suas características espectrais e espaciais próprias.',
              'research_areas':'Remote sensing | Land use and land cover | Environmental monitoring','keywords':'CBERS-2 | CCD | WFI | IRMSS | thermal infrared | historical imagery','geographic_coverage':'Brasil e demais áreas imageadas/disponíveis no acervo','covers_brazil':'sim','spatial_support':'cena raster | coleção','spatial_resolution':'CCD 20 m | WFI 260 m | IRMSS 80 m SWIR e 160 m termal conforme documentação','temporal_coverage':'missão CBERS-2: 2003-10-21 a 2009-01-15; disponibilidade por coleção','temporal_resolution':'por cena; varia por sensor','update_frequency':'acervo histórico; sem novas aquisições','product_status':'arquivado','version_or_collection':'acervo CBERS-2 corrente na BIG; revalidado em 2026-08-18','enumeration_scope':'family_level','product_page_url':'https://data.inpe.br/dados/cbers-2/','methodology_url':'https://data.inpe.br/dados/cbers-2/','primary_or_derived':'misto','limitations':'Missão encerrada. Sensores CCD, WFI e IRMSS não são intercambiáveis; bandas térmicas/SWIR e resoluções diferem, e os níveis de processamento devem ser preservados por cena.','dist_name':'CBERS-2 — acesso BIG','dist_url':'https://data.inpe.br/dados/cbers-2/','format':'produtos de imagem e metadados; varia por sensor/coleção','protocol':'HTTPS | serviços BIG conforme coleção','tool':'portal BIG | ferramentas de catálogo','license':'consultar metadados da coleção e termos do produto/missão','subset':'por sensor, coleção e cena conforme disponibilidade','dist_notes':'Acervo histórico; verificar sensor, nível, resolução e formato de cada coleção antes do uso.'
            },
            {
              'product_name':'Sentinel-3/OLCI — Level-1 Full Resolution distribuído pelo INPE','product_acronym':'Sentinel-3 OLCI L1','product_family':'BIG — acervo Sentinel-3','product_kind':'dataset_series',
