              'research_areas':'Remote sensing | Aquatic ecology | Environmental monitoring','keywords':'Sentinel-3 | OLCI | Level-1B | radiance | water colour | Copernicus','geographic_coverage':'território brasileiro','covers_brazil':'sim','spatial_support':'cena raster | bundle | coleção STAC','spatial_resolution':'300 m Full Resolution','temporal_coverage':'desde 2017-01-02; cenas correntes em 2026','temporal_resolution':'por cena; revisita combinada inferior a 2 dias nominalmente','update_frequency':'diária','product_status':'ativo','version_or_collection':'sentinel-3-olci-l1-bundle-1 / OL_1_EFR; verificado em 2026-08-18','enumeration_scope':'complete','product_page_url':'https://data.inpe.br/dados/sentinel-3/','methodology_url':'https://data.inpe.br/dados/sentinel-3/','primary_or_derived':'primário','limitations':'Level-1B representa radiância TOA acompanhada de parâmetros de calibração, não reflectância de superfície ou concentração de constituintes da água. Qualidade e máscaras devem ser preservadas por cena.','dist_name':'Sentinel-3/OLCI Level-1 — acesso BIG/STAC','dist_url':'https://data.inpe.br/dados/sentinel-3/','format':'ZIP bundle | metadados STAC','protocol':'HTTPS | STAC','tool':'portal BIG | STAC Browser | cliente STAC','license':'Copernicus Sentinel Data Legal Notice; INPE atua como hospedagem','subset':'por cena, bbox, tempo e asset conforme STAC','dist_notes':'Novas cenas são disponibilizadas diariamente; bundle inclui bandas e metadados originais do produto Copernicus.'
            },
            {
              'product_name':'Sentinel-3/OLCI — produtos aquáticos derivados (Rrs e ficocianina)','product_acronym':'Sentinel-3 Aquatic','product_family':'BIG — produtos aquáticos Sentinel-3','product_kind':'dataset_series',
              'product_description':'Família de produtos derivados do OLCI para ambientes aquáticos selecionados no Brasil, incluindo reflectância de sensoriamento remoto Rrs após correção atmosférica ACOLITE e estimativas bio-ópticas como ficocianina nos reservatórios da Cascata do Tietê.',
