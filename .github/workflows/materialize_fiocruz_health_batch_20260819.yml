          src_ids = read_ids(src_path, 'resource_id')
          prod_ids = read_ids(prod_path, 'product_id')
          dist_ids = read_ids(dist_path, 'distribution_id')
          for r in source_rows:
              assert r['resource_id'] not in src_ids, f"source id exists: {r['resource_id']}"
          for r in product_rows:
              assert r['product_id'] not in prod_ids, f"product id exists: {r['product_id']}"
          for r in dist_rows:
              assert r['distribution_id'] not in dist_ids, f"distribution id exists: {r['distribution_id']}"

          with src_path.open(encoding='utf-8', newline='') as f:
              src_fields = csv.DictReader(f).fieldnames
          with prod_path.open(encoding='utf-8', newline='') as f:
              prod_fields = csv.DictReader(f).fieldnames
          with dist_path.open(encoding='utf-8', newline='') as f:
              dist_fields = csv.DictReader(f).fieldnames

          for row in source_rows:
              assert set(row) == set(src_fields), (set(src_fields)-set(row), set(row)-set(src_fields))
          for row in product_rows:
              assert set(row) == set(prod_fields), (set(prod_fields)-set(row), set(row)-set(prod_fields))
          for row in dist_rows:
              assert set(row) == set(dist_fields), (set(dist_fields)-set(row), set(row)-set(dist_fields))

          with src_path.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f,fieldnames=src_fields,lineterminator='\n'); w.writerows(source_rows)
          with prod_path.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f,fieldnames=prod_fields,lineterminator='\n'); w.writerows(product_rows)
          with dist_path.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f,fieldnames=dist_fields,lineterminator='\n'); w.writerows(dist_rows)

          reg=json.loads(prio_path.read_text(encoding='utf-8'))
          p0=next(t for t in reg['tiers'] if t['priority_tier']=='P0')
          for rid in ['DR0134','DR0135']:
              if rid not in p0['resource_ids']: p0['resource_ids'].append(rid)
          reg['reviewed_at']=reviewed
          prio_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # consolidated relational read-back before repository validators
          with src_path.open(encoding='utf-8',newline='') as f: sources=list(csv.DictReader(f))
          with prod_path.open(encoding='utf-8',newline='') as f: products=list(csv.DictReader(f))
          with dist_path.open(encoding='utf-8',newline='') as f: dists=list(csv.DictReader(f))
          sids={r['resource_id'] for r in sources}; pids={r['product_id'] for r in products}; dids={r['distribution_id'] for r in dists}
          assert len(sids)==len(sources) and len(pids)==len(products) and len(dids)==len(dists)
          assert all(r['resource_id'] in sids for r in products)
          assert all(r['product_id'] in pids for r in dists)
          assert all(x in sids for x in ['DR0134','DR0135'])
          assert all(f'DP{i:06d}' in pids for i in range(852,862))
          assert all(f'DD{i:06d}' in dids for i in range(885,895))
          print('READBACK', len(sources), len(products), len(dists))
          PY

