name: One-shot Vitrine audit retry 2 2026-08-16

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-shot-vitrine-audit-retry2-20260816.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize staged verified batch with canonical vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          payload=json.loads(Path('data/_vitrine_batch_20260816.json').read_text(encoding='utf-8'))
          payload['resource'][7]='Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados'
          r=Path('data/data_resources.csv'); p=Path('data/data_products.csv'); d=Path('data/product_distributions.csv'); b=Path('data/brazil_scope_priorities.json')
          with r.open(encoding='utf-8',newline='') as f: rr=list(csv.DictReader(f))
          with p.open(encoding='utf-8',newline='') as f: pp=list(csv.DictReader(f))
          with d.open(encoding='utf-8',newline='') as f: dd=list(csv.DictReader(f))
          assert (len(rr),len(pp),len(dd))==(97,300,321),(len(rr),len(pp),len(dd))
          assert not any(x['resource_id']=='DR0098' for x in rr)
          assert not any(x['product_id'] in {'DP000305','DP000306','DP000307'} for x in pp)
          assert not any(x['distribution_id'] in {'DD000326','DD000327','DD000328'} for x in dd)
          def append(path,rows):
              with path.open('a',encoding='utf-8',newline='') as f: csv.writer(f,lineterminator='\n').writerows(rows)
          append(r,[payload['resource']]); append(p,payload['products']); append(d,payload['distributions'])
          reg=json.loads(b.read_text(encoding='utf-8')); p0=next(t for t in reg['tiers'] if t['priority_tier']=='P0')
          assert 'DR0098' not in p0['resource_ids']; p0['resource_ids'].append('DR0098'); reg['reviewed_at']='2026-08-16'
          b.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate, rebuild and read back
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          with open('data/data_resources.csv',encoding='utf-8',newline='') as f:r=list(csv.DictReader(f))
          with open('data/data_products.csv',encoding='utf-8',newline='') as f:p=list(csv.DictReader(f))
          with open('data/product_distributions.csv',encoding='utf-8',newline='') as f:d=list(csv.DictReader(f))
          assert (len(r),len(p),len(d))==(98,303,324),(len(r),len(p),len(d))
          assert {x['product_id'] for x in p if x['product_id'] in {'DP000305','DP000306','DP000307'}}=={'DP000305','DP000306','DP000307'}
          assert {x['distribution_id'] for x in d if x['distribution_id'] in {'DD000326','DD000327','DD000328'}}=={'DD000326','DD000327','DD000328'}
          assert all(x['resource_id']=='DR0098' for x in p if x['product_id'] in {'DP000305','DP000306','DP000307'})
          print('READBACK_OK',len(r),len(p),len(d))
          PY
      - name: Commit materialized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm data/_vitrine_batch_20260816.json
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/link_role_audit.json
          git commit -m "Expand verified IBGE structural-enterprise catalog"
          git push origin HEAD:main
