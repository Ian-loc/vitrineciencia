name: Materializar lote brasileiro 3

on:
  push:
    branches:
      - data/br-products-batch-3
    paths:
      - ".github/workflows/materialize-br-products-batch3.yml"
      - "scripts/materialize_br_products_batch3.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/br-products-batch-3
          fetch-depth: 0
      - name: Materializar e validar
        run: |
          python3 scripts/materialize_br_products_batch3.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/validate_vitrine.py
      - name: Commitar delta canônico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv
          git commit -m "Materializar produtos brasileiros prioritários lote 3"
          git push origin HEAD:data/br-products-batch-3
