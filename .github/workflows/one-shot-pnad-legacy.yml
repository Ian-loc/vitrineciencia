name: One-shot curate PNAD thematic modules

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/one-shot-pnad-legacy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append verified PNAD products and distributions
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          products = [
            {
              'product_id':'DP000262','resource_id':'DR0093','product_name':'PNAD Contínua — Outras formas de trabalho 2022','product_acronym':'PNADC Outras Formas 2022','product_family':'PNAD Contínua — módulo temático anual','product_kind':'dataset','product_description':'Resultados amostrais de 2022 sobre afazeres domésticos, cuidado de pessoas, produção para o próprio consumo e trabalho voluntário entre pessoas de 14 anos ou mais, segundo os conceitos da PNAD Contínua.','research_areas':'Demography | Social statistics | Labour economics | Public policy','keywords':'PNAD Contínua | outras formas de trabalho | afazeres domésticos | cuidados | trabalho voluntário | autoconsumo | 2022 | IBGE','geographic_coverage':'Brasil e domínios geográficos oficialmente divulgados pela PNAD Contínua','covers_brazil':'sim','spatial_support':'pessoas e domicílios amostrados | estimativas agregadas | SIDRA | microdados','spatial_resolution':'conforme domínio de divulgação; não inferir Município fora das tabelas oficiais','temporal_coverage':'2022','temporal_resolution':'anual temático baseado na quinta visita','update_frequency':'irregular','product_status':'ativo','version_or_collection':'2022; microdados atualizados em 11/08/2023','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/2511-np-pnadcontinua/17270-pnad-continua.html?edicao=37526','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/2511-np-pnadcontinua/17270-pnad-continua.html?edicao=37526','primary_or_derived':'derivado','limitations':'Pesquisa amostral. Afazeres domésticos, cuidado, produção para autoconsumo e trabalho voluntário são formas de trabalho não classificadas como ocupação pela pesquisa e não devem ser somadas ao emprego remunerado sem preservar os conceitos e universos. Estimativas exigem pesos e desenho amostral.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000263','resource_id':'DR0093','product_name':'PNAD Contínua — Pessoas com deficiência 2022','product_acronym':'PNADC Deficiência 2022','product_family':'PNAD Contínua — módulo temático','product_kind':'dataset','product_description':'Resultados amostrais de 2022 sobre pessoas com deficiência segundo dificuldades funcionais investigadas pela PNAD Contínua e características sociodemográficas associadas.','research_areas':'Demography | Social statistics | Public health | Public policy','keywords':'PNAD Contínua | deficiência | dificuldades funcionais | população | saúde | 2022 | IBGE','geographic_coverage':'Brasil e domínios geográficos oficialmente divulgados pelo módulo','covers_brazil':'sim','spatial_support':'pessoas amostradas | estimativas agregadas | SIDRA | microdados','spatial_resolution':'conforme domínio de divulgação e tabela oficial','temporal_coverage':'2022','temporal_resolution':'módulo temático','update_frequency':'irregular','product_status':'ativo','version_or_collection':'2022; microdados atualizados em 07/07/2023','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','primary_or_derived':'derivado','limitations':'Indicadores seguem quesitos funcionais e definições estatísticas da pesquisa; não equivalem a diagnóstico clínico, registro administrativo ou vigilância epidemiológica. Inferência requer pesos, desenho amostral e preservação do universo investigado.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000264','resource_id':'DR0093','product_name':'PNAD Contínua — Teletrabalho e trabalho por meio de plataformas digitais 2022 — Estatísticas Experimentais','product_acronym':'PNADC Teletrabalho e Plataformas 2022','product_family':'PNAD Contínua — módulo temático experimental','product_kind':'dataset','product_description':'Estatísticas experimentais de 2022 sobre teletrabalho e trabalho por meio de plataformas digitais, com características ocupacionais e sociodemográficas da população investigada.','research_areas':'Labour economics | Social statistics | Demography | Public policy','keywords':'PNAD Contínua | teletrabalho | plataformas digitais | trabalho remoto | economia de plataformas | 2022 | IBGE','geographic_coverage':'Brasil e recortes geográficos oficialmente divulgados pelo módulo','covers_brazil':'sim','spatial_support':'pessoas ocupadas amostradas | estimativas agregadas | SIDRA | microdados','spatial_resolution':'conforme domínio de divulgação e tabela oficial','temporal_coverage':'2022','temporal_resolution':'módulo temático','update_frequency':'irregular','product_status':'experimental','version_or_collection':'2022; nota técnica 02/2023 atualizada em 28/02/2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/9171-pesquisa-nacional-por-amostra-de-domicilios-continua-mensal.html/17270-pnad-continua.html?edicao=37838','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/9173-pesquisa-nacional-por-amostra-de-domicilios-continua-trimestral.html','primary_or_derived':'derivado','limitations':'Estatísticas experimentais. Teletrabalho e trabalho via plataformas seguem critérios do questionário e não equivalem a registros administrativos de empresas ou plataformas, logs digitais ou mensuração em tempo real. A lista técnica de ocupações aptas ao teletrabalho foi corrigida em 28/02/2024.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000265','resource_id':'DR0093','product_name':'PNAD Contínua — Atenção Primária à Saúde 2022','product_acronym':'PNADC APS 2022','product_family':'PNAD Contínua — módulo temático de saúde','product_kind':'dataset','product_description':'Resultados amostrais do módulo de Atenção Primária à Saúde de 2022, incluindo avaliação de atributos da atenção e componentes específicos investigados para a população-alvo do módulo.','research_areas':'Public health | Demography | Social statistics | Public policy','keywords':'PNAD Contínua | atenção primária à saúde | APS | serviços de saúde | crianças | 2022 | IBGE','geographic_coverage':'Brasil e domínios geográficos oficialmente divulgados pelo módulo','covers_brazil':'sim','spatial_support':'pessoas e domicílios amostrados | estimativas agregadas | SIDRA | microdados','spatial_resolution':'conforme domínio de divulgação do módulo','temporal_coverage':'2022','temporal_resolution':'módulo temático','update_frequency':'irregular','product_status':'ativo','version_or_collection':'2022; microdados atualizados em 21/12/2022 e novamente no conjunto PNAD em 10/04/2023','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/9173-pesquisa-nacional-por-amostra-de-domicilios-continua-trimestral.html','primary_or_derived':'derivado','limitations':'Pesquisa domiciliar amostral sobre uso e avaliação da atenção primária; não equivale a prontuários, produção administrativa do SUS, cobertura física de estabelecimentos ou medida clínica individual. Preservar população-alvo, questionário, pesos e desenho amostral.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000266','resource_id':'DR0093','product_name':'PNAD Contínua — Vitimização: sensação de segurança, furtos e roubos 2021','product_acronym':'PNADC Vitimização 2021','product_family':'PNAD Contínua — módulo temático de vitimização','product_kind':'dataset','product_description':'Resultados amostrais de 2021 sobre sensação de segurança e experiências declaradas de furtos e roubos, com características das pessoas e dos eventos investigados pela PNAD Contínua.','research_areas':'Social statistics | Criminology | Demography | Public policy','keywords':'PNAD Contínua | vitimização | sensação de segurança | furto | roubo | criminalidade | 2021 | IBGE','geographic_coverage':'Brasil e domínios geográficos oficialmente divulgados pelo módulo','covers_brazil':'sim','spatial_support':'pessoas e domicílios amostrados | eventos declarados | estimativas agregadas | SIDRA | microdados','spatial_resolution':'conforme domínio de divulgação e tabela oficial','temporal_coverage':'2021; períodos retrospectivos próprios conforme quesito','temporal_resolution':'módulo temático com referência retrospectiva','update_frequency':'irregular','product_status':'ativo','version_or_collection':'2021; microdados de sensação de segurança e furtos/roubos atualizados em 07/12/2022','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/9173-pesquisa-nacional-por-amostra-de-domicilios-continua-trimestral.html','primary_or_derived':'derivado','limitations':'Vitimização e sensação de segurança são informações declaradas em pesquisa amostral e não equivalem a registros policiais, incidência criminal observada integralmente ou geolocalização de ocorrências. Períodos de recordação e subnotificação devem ser considerados.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000267','resource_id':'DR0093','product_name':'PNAD Contínua — COVID-19 2023','product_acronym':'PNADC COVID-19 2023','product_family':'PNAD Contínua — módulo temático de saúde','product_kind':'dataset','product_description':'Resultados amostrais de 2023 sobre ocorrência declarada ou percebida de COVID-19, vacinação e características sociodemográficas, produzidos como módulo temático da PNAD Contínua.','research_areas':'Public health | Epidemiology | Demography | Social statistics','keywords':'PNAD Contínua | COVID-19 | vacinação | saúde | pandemia | 2023 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação; regiões metropolitanas selecionadas; Municípios das Capitais e RIDE Grande Teresina conforme divulgação','covers_brazil':'sim','spatial_support':'pessoas e domicílios amostrados | estimativas agregadas | SIDRA | microdados','spatial_resolution':'até Município da Capital e demais domínios oficialmente publicados; não inferir município geral','temporal_coverage':'01/01/2023–31/12/2023','temporal_resolution':'módulo anual temático','update_frequency':'irregular','product_status':'ativo','version_or_collection':'2023; microdados atualizados em 24/05/2024','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/2511-np-pnadcontinua/17270-pnad-continua.html?edicao=39911','methodology_url':'https://www.ibge.gov.br/estatisticas/sociais/trabalho/2511-np-pnadcontinua/17270-pnad-continua.html?edicao=39911','primary_or_derived':'derivado','limitations':'Módulo amostral com respostas declaradas sobre ter ou considerar ter tido COVID-19 e vacinação; não equivale a diagnóstico laboratorial, sistema de notificação epidemiológica, registro nominal de vacinação ou incidência clínica observada. Inferência exige desenho e pesos amostrais.','last_verified':'2026-08-16'
            },
          ]

          dists = [
            ('DD000283','DP000262','PNAD Contínua — Outras formas de trabalho 2022 — SIDRA, publicação e microdados','https://www.ibge.gov.br/estatisticas/sociais/trabalho/2511-np-pnadcontinua/17270-pnad-continua.html?edicao=37526','SIDRA | microdados | XLSX/ODS | PDF | visualização web','por forma de trabalho, características da pessoa e domínio publicado','Microdados atualizados em 11/08/2023; aplicar pesos e desenho amostral.'),
            ('DD000284','DP000263','PNAD Contínua — Pessoas com deficiência 2022 — SIDRA, publicação e microdados','https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','SIDRA | microdados | XLSX/ODS | PDF | visualização web','por dificuldade funcional, características sociodemográficas e domínio publicado','Microdados atualizados em 07/07/2023; indicadores não equivalem a diagnóstico clínico.'),
            ('DD000285','DP000264','PNAD Contínua — Teletrabalho e plataformas digitais 2022 — SIDRA, publicação e microdados','https://www.ibge.gov.br/estatisticas/sociais/trabalho/9171-pesquisa-nacional-por-amostra-de-domicilios-continua-mensal.html/17270-pnad-continua.html?edicao=37838','SIDRA | microdados | XLSX/ODS | PDF | visualização web','por condição de teletrabalho/plataforma, ocupação e domínio publicado','Estatísticas experimentais; nota técnica 02/2023 atualizada em 28/02/2024.'),
            ('DD000286','DP000265','PNAD Contínua — Atenção Primária à Saúde 2022 — SIDRA, publicação e microdados','https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','SIDRA | microdados | XLSX/ODS | PDF | visualização web','por indicador de APS, população-alvo e domínio publicado','Usar os microdados/documentação vigentes; não confundir respostas domiciliares com registros administrativos de saúde.'),
            ('DD000287','DP000266','PNAD Contínua — Vitimização 2021 — SIDRA, publicação e microdados','https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html','SIDRA | microdados | XLSX/ODS | PDF | visualização web','por sensação de segurança, tipo de vitimização, características e domínio publicado','Microdados de sensação de segurança e furtos/roubos atualizados em 07/12/2022; não equivalem a registros policiais.'),
            ('DD000288','DP000267','PNAD Contínua — COVID-19 2023 — SIDRA, publicação e microdados','https://www.ibge.gov.br/estatisticas/sociais/trabalho/2511-np-pnadcontinua/17270-pnad-continua.html?edicao=39911','SIDRA | microdados | XLSX/ODS | PDF | visualização web','por condição declarada de COVID-19, vacinação, características e domínio publicado','Microdados atualizados em 24/05/2024; não equivalem a diagnóstico laboratorial ou registros nominais de vacinação.'),
          ]

          pfile=Path('data/data_products.csv')
          with pfile.open(encoding='utf-8', newline='') as f:
              existing=list(csv.DictReader(f))
              fields=list(existing[0].keys())
          ids={r['product_id'] for r in existing}
          names={r['product_name'] for r in existing}
          for row in products:
              assert row['product_id'] not in ids, row['product_id']
              assert row['product_name'] not in names, row['product_name']
              assert set(row)==set(fields), (row['product_id'], set(fields)-set(row), set(row)-set(fields))
          with pfile.open('a',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n')
              for row in products: w.writerow(row)

          dfile=Path('data/product_distributions.csv')
          with dfile.open(encoding='utf-8',newline='') as f:
              dexisting=list(csv.DictReader(f)); dfields=list(dexisting[0].keys())
          dids={r['distribution_id'] for r in dexisting}
          for did,pid,name,url,fmt,subset,notes in dists:
              assert did not in dids, did
              row={
                'distribution_id':did,'product_id':pid,'distribution_name':name,'access_url':url,'format':fmt,
                'access_protocol':'HTTPS web | SIDRA | HTTP/HTTPS download','access_tool':'navegador web | SIDRA | software estatístico',
                'free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos; microdados anonimizados; aplicar pesos e desenho amostral',
                'license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim',
                'subset_support':subset,'notes':notes,'last_verified':'2026-08-16'
              }
              assert set(row)==set(dfields), (did,set(dfields)-set(row),set(row)-set(dfields))
              with dfile.open('a',encoding='utf-8',newline='') as f:
                  csv.DictWriter(f,fieldnames=dfields,lineterminator='\n').writerow(row)
          PY

      - name: Validate and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          for path in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(path,encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
              print(path,len(rows))
          PY

      - name: Commit materialized batch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-pnad-legacy.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          git status --short
          git commit -m "Expand verified PNAD thematic catalog"
          git push origin HEAD:main
