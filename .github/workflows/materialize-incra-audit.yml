          def append(path, record_list):
              with path.open('a', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=record_list[0].keys())
                  for rec in record_list: w.writerow(rec)

          # enforce exact headers/order
          with rpath.open(encoding='utf-8', newline='') as f: rfields=next(csv.reader(f))
          with ppath.open(encoding='utf-8', newline='') as f: pfields=next(csv.reader(f))
          with dpath.open(encoding='utf-8', newline='') as f: dfields=next(csv.reader(f))
          if list(resource.keys()) != rfields: raise SystemExit(f'resource fields mismatch: {list(resource.keys())} != {rfields}')
          if list(products[0].keys()) != pfields: raise SystemExit('product fields mismatch')
          if list(distributions[0].keys()) != dfields: raise SystemExit('distribution fields mismatch')

          append(rpath,[resource]); append(ppath,products); append(dpath,distributions)

          reg=json.loads(bpath.read_text(encoding='utf-8'))
          p0=next(t for t in reg['tiers'] if t['priority_tier']=='P0')
          if 'DR0124' not in p0['resource_ids']: p0['resource_ids'].append('DR0124')
          reg['reviewed_at']=verified
          bpath.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # relational read-back before validators
          R2,P2,D2=rows(rpath),rows(ppath),rows(dpath)
          assert len(R2)==124 and len(P2)==734 and len(D2)==765, (len(R2),len(P2),len(D2))
          rids={x['resource_id'] for x in R2}; pids={x['product_id'] for x in P2}; dids={x['distribution_id'] for x in D2}
          assert len(rids)==len(R2) and len(pids)==len(P2) and len(dids)==len(D2)
          assert all(x['resource_id'] in rids for x in P2)
          assert all(x['product_id'] in pids for x in D2)
          print('APPEND_OK',len(R2),len(P2),len(D2))
          PY
      - name: Validate Brazil scope
        run: python scripts/validate_brazil_scope.py
      - name: Validate product catalog
        run: python scripts/validate_product_catalog.py
      - name: Rebuild catalog derivatives
        run: python scripts/build_catalog.py
      - name: Regenerate link-role audit
        run: python scripts/audit_link_roles.py --write
      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py
      - name: Build public artifact
        run: python scripts/build_site_artifact.py
      - name: Check whitespace and read-back
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import csv, json
          def n(p):
              with open(p,encoding='utf-8',newline='') as f:return sum(1 for _ in csv.DictReader(f))
          assert (n('data/data_resources.csv'),n('data/data_products.csv'),n('data/product_distributions.csv'))==(124,734,765)
          with open('data/data_products.csv',encoding='utf-8',newline='') as f: P=list(csv.DictReader(f))
          with open('data/product_distributions.csv',encoding='utf-8',newline='') as f: D=list(csv.DictReader(f))
          assert {x['product_id'] for x in P if x['resource_id']=='DR0124'}=={f'DP{i:06d}' for i in range(728,735)}
          assert {x['distribution_id'] for x in D if x['product_id'] in {f'DP{i:06d}' for i in range(728,735)}}=={f'DD{i:06d}' for i in range(758,766)}
          print('READBACK_OK')
          PY
      - name: Commit materialized data
        shell: bash
        run: |
          git config user.name "vitrine-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git commit -m "Expand verified INCRA land-governance catalog"
          git push origin HEAD:main
