name: Materialize verified INCRA catalog

on:
  push:
    paths:
      - '.incra-audit-trigger'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified INCRA source, products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib, sys
          from datetime import date

          root = pathlib.Path('.')
          rpath = root/'data/data_resources.csv'
          ppath = root/'data/data_products.csv'
          dpath = root/'data/product_distributions.csv'
          bpath = root/'data/brazil_scope_priorities.json'
          verified = '2026-08-18'

          def rows(path):
              with path.open(encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))
          R, P, D = rows(rpath), rows(ppath), rows(dpath)
          if any(x['resource_id']=='DR0124' for x in R):
              raise SystemExit('DR0124 already exists; abort safely')
          if any(x['product_id'] in {f'DP{i:06d}' for i in range(728,735)} for x in P):
              raise SystemExit('planned product IDs already exist; abort safely')
          if any(x['distribution_id'] in {f'DD{i:06d}' for i in range(758,766)} for x in D):
              raise SystemExit('planned distribution IDs already exist; abort safely')

          existing_product_urls={x['product_page_url'].strip() for x in P if x['product_page_url'].strip()}
          planned_urls={
            'https://acervofundiario.incra.gov.br/',
            'https://www.gov.br/pt-br/servicos/obter-coordenadas-e-baixar-os-arquivos-dos-imoveis-ruras-certificados',
            'https://www.gov.br/incra/pt-br/assuntos/reforma-agraria/assentamentos-relacao-de-projetos',
            'https://www.gov.br/incra/pt-br/assuntos/governanca-fundiaria/quilombolas',
            'https://acervofundiario.incra.gov.br/acervo/dados_acervo_3.php',
            'https://sncr2.serpro.gov.br/sncr-web/consultaPublica.jsf',
            'https://www.gov.br/incra/pt-br/assuntos/governanca-fundiaria/estrutura-fundiaria',
          }
