name: Vitrine audit 120 fix
on:
  push:
    branches: [agent/vitrine-audit-120]
permissions:
  contents: write
jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized-120]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-audit-120
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize verified IBGE geodetic batch
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          today='2026-08-15'
          def append(path,row):
              p=Path(path)
              with p.open(encoding='utf-8-sig',newline='') as f:
                  r=csv.DictReader(f); fields=r.fieldnames; rows=list(r)
              if any(x[fields[0]]==row[fields[0]] for x in rows): raise SystemExit('duplicate '+row[fields[0]])
              if set(fields)!=set(row): raise SystemExit(f'column mismatch {path}: {set(fields)-set(row)} {set(row)-set(fields)}')
              with p.open('a',encoding='utf-8',newline='') as f: csv.DictWriter(f,fieldnames=fields,lineterminator='\n').writerow(row)
          append('data/data_resources.csv',{
          'resource_id':'DR0075','resource_name':'Redes Geodésicas — IBGE','acronym':'Redes Geodésicas IBGE','official_identity':'Tema institucional de Redes Geodésicas do Sistema Geodésico Brasileiro — IBGE','description':'Conjunto institucional de redes e serviços geodésicos mantidos pelo IBGE para posicionamento, referência altimétrica e monitoramento contínuo, incluindo RBMC e RMPG.','homepage_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','data_access_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','research_areas':'Geociências, Solos e Geografia Física | Recursos Hídricos e Oceanografia | Sensoriamento Remoto e Geoinformação','keywords':'geodésia | GNSS | RBMC | RMPG | nível do mar | SIRGAS2000 | IBGE','data_product_types':'séries de observações GNSS | séries maregráficas | serviços de correção em tempo real | metadados de estações','data_formats':'RINEX 2 | RINEX 3 | RTCM | arquivos de nível do mar e meteorologia | formatos variáveis por produto','visualization_types':'mapa de estações | séries temporais | situação operacional | downloads','geographic_coverage':'Brasil; estações e séries conforme rede','covers_brazil':'sim','spatial_resolution':'estações geodésicas pontuais; densidade e cobertura variam por rede','temporal_coverage':'RBMC desde 1995 nos arquivos públicos; RMPG com séries conforme estação; operação corrente','temporal_resolution':'1 s ou 15 s em produtos RBMC; intervalos próprios por variável/estação na RMPG','data_sources':'receptores GNSS de alta precisão | sensores maregráficos | sensores meteorológicos associados','free_download':'parcial','access_conditions':'downloads e consulta pública conforme produto; RBMC-IP exige cadastro e configuração NTRIP','programmatic_access':'parcial','access_protocols':'HTTPS download | NTRIP/RTCM | serviços web conforme produto','authentication_required':'parcial','access_documentation_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','license':'licença e condições devem ser verificadas por produto; RMPG solicita citação do IBGE e orienta download direto pelo portal','institutional_status':'público','owner_or_manager':'IBGE — Diretoria de Geociências / Coordenação de Geodésia','academic_uses':'Posicionamento geodésico, deformação e referência espacial, monitoramento do nível do mar, geodinâmica, calibração e validação de dados geoespaciais.','limitations':'Redes têm estações, sensores, disponibilidade operacional, intervalos e convenções próprias; lacunas por falha de transmissão ou energia e mudanças instrumentais precisam ser consideradas por série.','academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','academic_evidence_note':'A página oficial distingue RBMC, RMPG e demais redes geodésicas como produtos próprios do Sistema Geodésico Brasileiro.','verification_url':'https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica.html','last_verified':today})
          P=[
          ['DP000130','RBMC — Rede Brasileira de Monitoramento Contínuo dos Sistemas GNSS','RBMC','Redes Geodésicas — observações GNSS','dataset_series','Rede contínua de estações GNSS de alto desempenho do IBGE que disponibiliza observações para determinação de coordenadas, com arquivos diários e dados em diferentes intervalos e versões RINEX.','Geodesy | GNSS | Geodynamics | Geospatial information science','RBMC | GNSS | RINEX | SIRGAS2000 | posicionamento | geodésia | IBGE','Brasil — estações distribuídas no território nacional','sim','estações geodésicas pontuais | séries de observações GNSS','pontual por estação; densidade espacial varia conforme a rede ativa','arquivos públicos desde 1995; operação corrente','1 s em estações elegíveis RINEX 3; 15 s em produtos RINEX 2/3','diária e contínua conforme produto/estação','ativo','RINEX 2 e RINEX 3; dados de 1 s disponibilizados gradualmente desde 2020','family_level','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/16258-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-rbmc.html?lang=pt-BR','primário','Disponibilidade, constelações rastreadas, receptor, intervalo e formato variam por estação e época. Falhas operacionais geram lacunas; registrar estação, data, intervalo e versão RINEX usados.'],
          ['DP000131','RBMC-IP — posicionamento GNSS em tempo real','RBMC-IP','Redes Geodésicas — serviços GNSS em tempo real','data_service','Serviço do IBGE para posicionamento RTK/DGPS em tempo real a partir de estações da RBMC, transmitindo correções GNSS pela Internet via NTRIP em formato RTCM.','Geodesy | GNSS | Surveying | Geospatial information science','RBMC-IP | NTRIP | RTCM | RTK | DGPS | GNSS | tempo real | IBGE','Brasil — cobertura efetiva depende das estações e conectividade','sim','serviço de correções GNSS baseado em rede de estações','não se aplica como resolução raster; desempenho depende da geometria/rede e técnica de posicionamento','serviço operacional corrente','tempo real','contínua enquanto o serviço e as estações estão operacionais','ativo','serviço NTRIP/RTCM corrente','complete','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/servicos-para-posicionamento-geodesico/16332-rbmc-ip-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-em-tempo-real.html','serviço','É serviço de posicionamento/correção, não dataset histórico equivalente aos arquivos RINEX. A qualidade depende de estação, conectividade, equipamento, técnica, distância e condições GNSS; não inferir precisão fixa.'],
          ['DP000132','RMPG — Rede Maregráfica Permanente para Geodésia','RMPG','Redes Geodésicas — nível do mar e meteorologia','dataset_series','Rede de estações maregráficas do IBGE para monitorar a relação entre o Datum Vertical Brasileiro e níveis maregráficos e apoiar estudos de modernização altimétrica e variação do nível do mar; algumas estações também fornecem dados meteorológicos.','Sea-level science | Geodesy | Oceanography | Climate science','RMPG | nível do mar | marégrafo | datum vertical | meteorologia | séries temporais | IBGE','costa brasileira — estações RMPG conforme situação operacional','parcial','estações maregráficas pontuais | séries temporais','pontual por estação; não representa campo contínuo de nível do mar','séries históricas conforme estação; monitoramento corrente; meteorologia incorporada desde 2022 em estações equipadas','varia por arquivo/variável; meteorologia documentada em intervalos de 5 minutos nas estações equipadas','contínua/diária conforme estação e canal de disseminação','ativo','rede operacional corrente; dados meteorológicos adicionados a partir de 2022','family_level','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/10842-rmpcg-rede-maregrafica-permanente-para-geodesia.html','primário','As séries são pontuais e podem conter lacunas por transmissão ou energia, mudanças de sensor e diferenças entre estações. Variação local do nível do mar não deve ser extrapolada diretamente para toda a costa sem análise apropriada.']]
          for x in P:
              url=x[18]
              append('data/data_products.csv',dict(zip(['product_id','resource_id','product_name','product_acronym','product_family','product_kind','product_description','research_areas','keywords','geographic_coverage','covers_brazil','spatial_support','spatial_resolution','temporal_coverage','temporal_resolution','update_frequency','product_status','version_or_collection','enumeration_scope','product_page_url','methodology_url','primary_or_derived','limitations','last_verified'],[x[0],'DR0075',*x[1:19],url,*x[19:],today])))
          D=[
          ['DD000146','DP000130','RBMC — arquivos de observação GNSS','https://geoftp.ibge.gov.br/informacoes_sobre_posicionamento_geodesico/rbmc/','RINEX 2 | RINEX 3 | Hatanaka/compactação conforme coleção','HTTPS download','navegador web | cliente HTTP | software GNSS','sim','não','arquivos públicos organizados por ano, dia e coleção; selecionar estação, intervalo e formato','licença específica não inferida; observar termos e documentação do IBGE','sim','por ano, dia, estação e coleção conforme diretório','O acervo público inclui dados desde 1995 e coleções RINEX 3/1 s específicas. Formato e disponibilidade variam por estação e período.'],
          ['DD000147','DP000131','RBMC-IP — serviço NTRIP/RTCM','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/servicos-para-posicionamento-geodesico/16332-rbmc-ip-rede-brasileira-de-monitoramento-continuo-dos-sistemas-gnss-em-tempo-real.html','RTCM','NTRIP sobre Internet','receptor/controladora GNSS | cliente NTRIP','não se aplica','sim','uso do serviço requer cadastro/configuração e conectividade; consultar instruções oficiais','condições de uso do serviço conforme documentação do IBGE','desconhecido','por mountpoint/estação e correção disponibilizada pelo caster','Distribuição operacional em tempo real; não confundir com download dos arquivos históricos RINEX da RBMC.'],
          ['DD000148','DP000132','RMPG — dados maregráficos e meteorológicos','https://www.ibge.gov.br/geociencias/informacoes-sobre-posicionamento-geodesico/rede-geodesica/10842-rmpcg-rede-maregrafica-permanente-para-geodesia.html','arquivos de nível do mar | meteorologia | séries temporais | ZIP conforme estação/ano','HTTPS web | download','navegador web | software de análise de séries temporais','sim','não','seleção pública por estação e ano; disponibilidade depende da série e situação operacional','IBGE solicita citação da fonte e orienta que terceiros façam o download diretamente pelo portal; verificar condições específicas no produto','sim','por estação, ano e variável conforme interface','A página informa que dados meteorológicos passaram a ser incluídos desde 01/04/2022 nas estações com sensores, em arquivo adicional com intervalo de 5 minutos.']]
          for x in D: append('data/product_distributions.csv',dict(zip(['distribution_id','product_id','distribution_name','access_url','format','access_protocol','access_tool','free_download','authentication_required','access_conditions','license','provider_attribution_required','subset_support','notes','last_verified'],[*x,today])))
          p=Path('data/brazil_scope_priorities.json'); o=json.loads(p.read_text(encoding='utf-8')); p0=next(t for t in o['tiers'] if t['priority_tier']=='P0')['resource_ids']; p0.append('DR0075') if 'DR0075' not in p0 else None; o['reviewed_at']=today; p.write_text(json.dumps(o,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate all gates
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Commit verified state
        run: |
          rm .github/workflows/vitrine-audit-120-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Expandir IBGE: RBMC, RBMC-IP e RMPG [materialized-120]'
          git push origin HEAD:agent/vitrine-audit-120
