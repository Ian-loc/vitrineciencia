name: Retry verified IBGE enterprise batch 2026-08-16 UTC

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/materialize-vitrine-retry-2026-08-16.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute curated batch with runner-safe audit date
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, textwrap
          wf = pathlib.Path('.github/workflows/materialize-vitrine-2026-08-17.yml').read_text(encoding='utf-8').splitlines(True)
          start = next(i for i,l in enumerate(wf) if "python3 - <<'PY'" in l) + 1
          end = next(i for i in range(start, len(wf)) if wf[i].strip() == 'PY')
          src = textwrap.dedent(''.join(wf[start:end]))
          src = src.replace("TODAY = '2026-08-17'", "TODAY = '2026-08-16'")
          exec(compile(src, '<curated-batch>', 'exec'), {})
          PY

          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Commit canonical batch and remove one-shot workflows
        shell: bash
        run: |
          git config user.name "vitrine-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-vitrine-2026-08-17.yml .github/workflows/materialize-vitrine-retry-2026-08-16.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json data/brazil_scope_priorities.json
          git diff --cached --check
          git commit -m "Expand verified IBGE enterprise indicators catalog"
          git push origin HEAD:main
