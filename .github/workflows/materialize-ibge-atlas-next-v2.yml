name: Materialize next verified IBGE atlas batch v2

on:
  push:
    branches: ["audit/ibge-atlas-next-20260816"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-atlas-next-20260816
          fetch-depth: 0
      - name: Append verified batch
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          P=Path('data/data_products.csv'); D=Path('data/product_distributions.csv')
          products=[
          {'product_id':'DP000196','resource_id':'DR0085','product_name':'Atlas Geográfico Escolar — 9ª edição','product_acronym':'Atlas Geográfico Escolar 9ª ed.','product_family':'Atlas nacionais — educação geográfica','product_kind':'catalog','product_description':'Nona edição do Atlas Geográfico Escolar do IBGE, reunindo mapas, gráficos, textos e conteúdos geográficos, estatísticos e cartográficos sobre o Brasil e o mundo para apoio ao ensino e à compreensão territorial.','research_areas':'Geography | Environmental education | Territorial analysis | Cartography','keywords':'atlas escolar | cartografia | território | meio ambiente | população | economia | educação geográfica | IBGE','geographic_coverage':'Brasil e aproximadamente 200 países, conforme tema','covers_brazil':'sim','spatial_support':'mapas físicos, político-administrativos e temáticos | gráficos | textos','spatial_resolution':'heterogênea conforme mapa, tema e fonte','temporal_coverage':'edição 2023/2024; referências temporais variam entre mapas e indicadores','temporal_resolution':'heterogênea por componente','update_frequency':'por edição','product_status':'ativo','version_or_collection':'9ª edição; página oficial identifica edição 2023, publicação em 2024; correções incorporadas em 28/06/2024','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/nacional/16633-atlas-geografico-escolar.html','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/nacional/16633-atlas-geografico-escolar.html','primary_or_derived':'derivado','limitations':'Produto educacional e de síntese, não dataset observacional homogêneo. Mapas e indicadores usam fontes, escalas, anos e metodologias distintos; a errata/correções da 9ª edição devem ser preservadas e cada componente quantitativo requer consulta à sua fonte original.','last_verified':'2026-08-16'},
          {'product_id':'DP000197','resource_id':'DR0085','product_name':'Atlas Nacional de Comércio e Serviços — 2013','product_acronym':'Atlas Comércio e Serviços 2013','product_family':'Atlas temáticos — economia e serviços','product_kind':'catalog','product_description':'Atlas nacional de 2013 voltado à estrutura, diferenciação interna e padrões espaciais dos setores de comércio, serviços e serviços logísticos no Brasil, produzido em parceria institucional liderada pelo então MDIC com participação do IBGE e outras organizações.','research_areas':'Economic geography | Regional science | Territorial analysis | Services economy','keywords':'comércio | serviços | logística | setor terciário | economia regional | território | atlas | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'mapas temáticos | textos analíticos | indicadores econômicos e territoriais','spatial_resolution':'heterogênea conforme indicador, mapa e fonte','temporal_coverage':'edição 2013; anos de referência variam conforme estatística e capítulo','temporal_resolution':'heterogênea por componente','update_frequency':'por edição; sem atualização corrente inferida','product_status':'arquivado','version_or_collection':'2013','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16363-atlas-nacional-de-comercio-e-servico.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16363-atlas-nacional-de-comercio-e-servico.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'Atlas de síntese econômica e territorial de 2013, não base contemporânea do setor terciário. Indicadores e camadas possuem fontes e anos próprios; camadas citadas na INDE não tornam o Atlas um dataset único nem garantem disponibilidade atual ou comparabilidade automática.','last_verified':'2026-08-16'},
          {'product_id':'DP000198','resource_id':'DR0085','product_name':'Atlas das Representações Literárias de Regiões Brasileiras — coleção 2006–2021','product_acronym':'Atlas Representações Literárias','product_family':'Atlas temáticos — geografia cultural','product_kind':'catalog','product_description':'Coleção do IBGE que articula Geografia e Literatura para identificar e representar regiões brasileiras marcantes em obras literárias, utilizando mapas em diferentes escalas, fotografias, imagens de satélite, textos geográficos e análise cultural.','research_areas':'Cultural geography | Human geography | Regional studies | Territorial analysis','keywords':'geografia cultural | literatura | regiões brasileiras | identidade territorial | regionalização | atlas | IBGE','geographic_coverage':'Brasil — recortes regionais selecionados nos volumes publicados','covers_brazil':'sim','spatial_support':'mapas em múltiplas escalas | fotografias | imagens de satélite | textos e recortes regionais','spatial_resolution':'heterogênea conforme volume, mapa e recorte regional','temporal_coverage':'coleção iniciada em 2006; quatro volumes publicados até Costa Brasileira em 2021','temporal_resolution':'não se aplica; síntese histórica e cultural','update_frequency':'por volume','product_status':'ativo','version_or_collection':'coleção 2006–2021; volumes Brasil Meridional, Sertões Brasileiros I e II e Costa Brasileira publicados','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16364-atlas-das-representacoes-literarias-de-regioes-brasileiras-brasil-meridional.html','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16364-atlas-das-representacoes-literarias-de-regioes-brasileiras-brasil-meridional.html','primary_or_derived':'derivado','limitations':'Regionalizações culturais e literárias não são limites político-administrativos, ecológicos ou estatísticos oficiais. Os contornos refletem interpretação histórico-cultural e fontes diversas; mapas de volumes distintos não devem ser tratados como uma cobertura territorial contínua e homogênea.','last_verified':'2026-08-16'}]
          distributions=[
          {'distribution_id':'DD000217','product_id':'DP000196','distribution_name':'Atlas Geográfico Escolar — 9ª edição — site e publicação','access_url':'https://www.ibge.gov.br/geociencias/atlas/nacional/16633-atlas-geografico-escolar.html','format':'site interativo | PDF / publicação digital','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'site e download público indicados na página oficial','license':'licença específica dos conteúdos/arquivos não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'interativo por tema no site; publicação integral para download','notes':'A página oficial registra correções incorporadas em 28/06/2024; conteúdos quantitativos permanecem dependentes das fontes, anos e escalas de cada mapa ou indicador.','last_verified':'2026-08-16'},
          {'distribution_id':'DD000218','product_id':'DP000197','distribution_name':'Atlas Nacional de Comércio e Serviços 2013 — publicação','access_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16363-atlas-nacional-de-comercio-e-servico.html?lang=pt-BR','format':'PDF / publicação digital; camadas temáticas históricas citadas na INDE','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública pela página oficial; disponibilidade corrente de camadas INDE deve ser verificada separadamente','license':'licença específica das camadas/arquivo não localizada nesta auditoria; observar termos de uso das instituições provedoras','provider_attribution_required':'sim','subset_support':'não para a publicação; eventual subset depende dos serviços/camadas INDE ainda disponíveis','notes':'Produto de 2013 e multifuente; não inferir atualidade econômica nem continuidade operacional das camadas citadas na INDE.','last_verified':'2026-08-16'},
          {'distribution_id':'DD000219','product_id':'DP000198','distribution_name':'Atlas das Representações Literárias — coleção de publicações','access_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16364-atlas-das-representacoes-literarias-de-regioes-brasileiras-brasil-meridional.html','format':'PDF / livros digitais | mapas e imagens incorporados às publicações','access_protocol':'HTTPS web | download','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'publicações e referências de acesso disponibilizadas pelo IBGE','license':'licença específica dos arquivos não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'por volume/publicação; não se trata de serviço geoespacial homogêneo','notes':'A coleção usa mapas, fotografias, imagens de satélite e recortes culturais em diferentes escalas; os volumes não formam uma camada nacional contínua.','last_verified':'2026-08-16'}]
          def append(path, rows, idf, dup):
              with path.open(encoding='utf-8', newline='') as f:
                  rd=csv.DictReader(f); old=list(rd); fields=rd.fieldnames
              ids={r[idf] for r in old}
              for r in rows:
                  assert r[idf] not in ids, r[idf]
                  assert not any(x.get(dup)==r.get(dup) for x in old), r.get(dup)
                  assert set(r)==set(fields), (r[idf], set(fields)-set(r), set(r)-set(fields))
              with path.open('a', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=fields, lineterminator='\n'); w.writerows(rows)
          append(P,products,'product_id','product_name'); append(D,distributions,'distribution_id','distribution_name')
          PY
      - name: Validate rebuild and read back
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          for p in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(p,encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
              print(p,len(rows))
          PY
      - name: Commit clean materialized batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-ibge-atlas-next.yml .github/workflows/materialize-ibge-atlas-next-v2.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          git commit -m "Expand verified IBGE atlas catalog batch"
          git push origin HEAD:audit/ibge-atlas-next-20260816
