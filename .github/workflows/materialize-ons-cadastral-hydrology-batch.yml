name: Materialize ONS cadastral hydrology batch

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified ONS products and distributions
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          ppath=Path('data/data_products.csv')
          dpath=Path('data/product_distributions.csv')
          with ppath.open(encoding='utf-8-sig', newline='') as f:
              products=list(csv.DictReader(f)); pfields=list(products[0].keys())
          with dpath.open(encoding='utf-8-sig', newline='') as f:
              dists=list(csv.DictReader(f)); dfields=list(dists[0].keys())
          pids={r['product_id'] for r in products}; dids={r['distribution_id'] for r in dists}
          urls={r['product_page_url'].strip() for r in products}

          rows=[
          {'product_id':'DP000609','resource_id':'DR0122','product_name':'Reservatórios — cadastro ONS','product_acronym':'Reservatórios ONS','product_family':'Cadastro operacional do SIN','product_kind':'dataset_series','product_description':'Dados cadastrais dos reservatórios representados pelo ONS, lidos das fontes operacionais e atualizados diariamente, sem série histórica no conjunto corrente.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'reservatório | cadastro | hidrelétrica | SIN | volume útil','geographic_coverage':'Brasil — Sistema Interligado Nacional, conforme reservatórios representados pelo ONS','covers_brazil':'sim','spatial_support':'reservatório','spatial_resolution':'unidade cadastral por reservatório','temporal_coverage':'estado cadastral corrente; sem histórico no conjunto','temporal_resolution':'estado corrente','update_frequency':'diária','product_status':'ativo','version_or_collection':'conjunto corrente; página atualizada em julho de 2026','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/reservatorio','methodology_url':'https://dados.ons.org.br/dataset/reservatorio','primary_or_derived':'primário','limitations':'Cadastro operacional, não série hidrológica. Ausência ou atributo cadastral não deve ser interpretado como medição corrente de nível, vazão, volume ou segurança da barragem.','last_verified':'2026-08-18'},
          {'product_id':'DP000610','resource_id':'DR0122','product_name':'Dados de Grandezas Fluviométricas','product_acronym':'Grandezas Fluviométricas','product_family':'Hidrologia observacional do SIN','product_kind':'dataset_series','product_description':'Medidas de grandezas obtidas em postos fluviométricos e consolidadas pelo ONS em periodicidade diária, com arquivos históricos e corrente 2026.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'fluviometria | estação fluviométrica | vazão | nível | hidrologia','geographic_coverage':'Brasil — postos fluviométricos associados ao universo operacional do ONS','covers_brazil':'sim','spatial_support':'posto/estação fluviométrica','spatial_resolution':'pontual por estação','temporal_coverage':'2015–presente nos recursos auditados; arquivo 2026 disponível','temporal_resolution':'diária','update_frequency':'diária','product_status':'ativo','version_or_collection':'arquivos anuais até 2026','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/grandezas_fluviometricas','methodology_url':'https://dados.ons.org.br/dataset/grandezas_fluviometricas','primary_or_derived':'primário','limitations':'Os dados passam por processo recorrente de consistência e podem ser alterados após publicação. Observações pontuais do universo ONS não constituem superfície hidrológica contínua nem inventário de toda a rede nacional.','last_verified':'2026-08-18'},
          {'product_id':'DP000611','resource_id':'DR0122','product_name':'Dados Hidrológicos — Volume de Espera Recomendado','product_acronym':'Volume de Espera','product_family':'Programação hidráulica e controle de cheias','product_kind':'dataset_series','product_description':'Valores de volume de espera usados na programação hidráulica, expressos como nível máximo recomendado em percentual do volume útil para reservar capacidade de amortecimento de cheias.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'volume de espera | reservatório | cheias | programação hidráulica | volume útil','geographic_coverage':'Brasil — reservatórios do SIN com programação de controle de cheias','covers_brazil':'sim','spatial_support':'reservatório','spatial_resolution':'por reservatório e data','temporal_coverage':'2023–presente nos recursos auditados; arquivo 2026 disponível','temporal_resolution':'diária dentro dos arquivos anuais','update_frequency':'operacional/periódica conforme programação','product_status':'ativo','version_or_collection':'arquivos anuais até 2026','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/res_volumeespera','methodology_url':'https://dados.ons.org.br/dataset/res_volumeespera','primary_or_derived':'derivado','limitations':'Volume de espera é parâmetro/recomendação de programação para controle de cheias, não volume observado do reservatório, previsão determinística de inundação ou garantia de ausência de dano a jusante. Valores podem ser revisados no processo de consistência.','last_verified':'2026-08-18'},
          {'product_id':'DP000612','resource_id':'DR0122','product_name':'Modalidade de Operação de Usinas','product_acronym':'Modalidade de Operação','product_family':'Cadastro operacional de geração','product_kind':'dataset_series','product_description':'Classificação corrente das usinas nas modalidades de operação Tipo I, II-A, II-B, II-C e III segundo as diretrizes dos Procedimentos de Rede e análises do ONS.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'usina | modalidade de operação | Tipo I | Tipo II | Tipo III | ONS','geographic_coverage':'Brasil — usinas consideradas pelo ONS no SIN','covers_brazil':'sim','spatial_support':'usina','spatial_resolution':'unidade cadastral por usina','temporal_coverage':'estado corrente; conjunto sem histórico','temporal_resolution':'estado corrente','update_frequency':'diária','product_status':'ativo','version_or_collection':'conjunto corrente; atualização diária','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/modalidade-usina','methodology_url':'https://dados.ons.org.br/dataset/modalidade-usina','primary_or_derived':'derivado','limitations':'Modalidade é classificação operacional segundo regras do ONS e informações dos agentes; não representa tecnologia, propriedade, situação ambiental, disponibilidade física ou geração efetivamente realizada. O conjunto corrente não preserva histórico.','last_verified':'2026-08-18'},
          {'product_id':'DP000613','resource_id':'DR0122','product_name':'Capacidade Instalada de Geração — ONS','product_acronym':'Capacidade de Geração','product_family':'Cadastro operacional de geração','product_kind':'dataset_series','product_description':'Potência nominal das unidades geradoras de usinas despachadas pelo ONS nas modalidades Tipo I, II-A, II-B e II-C.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'capacidade instalada | potência nominal | unidade geradora | usina | SIN','geographic_coverage':'Brasil — usinas despachadas pelo ONS no SIN','covers_brazil':'sim','spatial_support':'unidade geradora/usina','spatial_resolution':'unidade cadastral','temporal_coverage':'estado corrente; sem histórico no conjunto','temporal_resolution':'estado corrente','update_frequency':'diária','product_status':'ativo','version_or_collection':'versão 1.1; atualização diária','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/capacidade-geracao','methodology_url':'https://dados.ons.org.br/dataset/capacidade-geracao','primary_or_derived':'primário','limitations':'Potência nominal instalada no universo despachado pelo ONS não equivale a disponibilidade, geração realizada, fator de capacidade nem capacidade total de geração existente fora do universo coberto.','last_verified':'2026-08-18'},
          {'product_id':'DP000614','resource_id':'DR0122','product_name':'Relacionamento entre Grupos de Pequenas Usinas e Usinas','product_acronym':'Usina–PQU','product_family':'Cadastro operacional de geração','product_kind':'dataset_series','product_description':'Relação corrente das usinas Tipo III que compõem os Grupos de Pequenas Usinas utilizados na representação operacional do ONS.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'pequenas usinas | Tipo III | grupo | relacionamento | geração','geographic_coverage':'Brasil — grupos e usinas do SIN representados pelo ONS','covers_brazil':'sim','spatial_support':'usina e grupo operacional','spatial_resolution':'relação cadastral','temporal_coverage':'estado corrente; sem histórico','temporal_resolution':'estado corrente','update_frequency':'diária','product_status':'ativo','version_or_collection':'conjunto corrente; atualização diária','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/usina_pqu','methodology_url':'https://dados.ons.org.br/dataset/usina_pqu','primary_or_derived':'primário','limitations':'A relação representa agrupamento operacional de usinas Tipo III e não deve ser interpretada como identidade societária, proximidade geográfica, unidade ambiental ou série histórica de composição.','last_verified':'2026-08-18'},
          {'product_id':'DP000615','resource_id':'DR0122','product_name':'Relacionamento entre Conjuntos e Usinas','product_acronym':'Usina–Conjunto','product_family':'Cadastro operacional de geração','product_kind':'dataset_series','product_description':'Relação corrente das usinas Tipo II-C que compõem Conjuntos de Usina na representação operacional do ONS.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'conjunto de usinas | Tipo II-C | usina | relacionamento | geração','geographic_coverage':'Brasil — conjuntos e usinas do SIN representados pelo ONS','covers_brazil':'sim','spatial_support':'usina e conjunto operacional','spatial_resolution':'relação cadastral','temporal_coverage':'estado corrente; página declara ausência de histórico no conjunto','temporal_resolution':'estado corrente','update_frequency':'diária','product_status':'ativo','version_or_collection':'conjunto corrente; atualização diária','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/usina_conjunto','methodology_url':'https://dados.ons.org.br/dataset/usina_conjunto','primary_or_derived':'primário','limitations':'Conjunto de Usina é agrupamento operacional; não corresponde automaticamente a empreendimento único, proprietário, sítio geográfico ou unidade ambiental. Não inferir histórico a partir do estado corrente.','last_verified':'2026-08-18'},
          {'product_id':'DP000616','resource_id':'DR0122','product_name':'Ofertas de Preço para Importação de Energia','product_acronym':'Ofertas de Importação','product_family':'Operação e intercâmbio de energia','product_kind':'dataset_series','product_description':'Preços declarados semanalmente por agentes comercializadores para ofertas de importação de energia da Argentina e do Uruguai ao Sistema Interligado Nacional.','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados','keywords':'importação de energia | oferta de preço | Argentina | Uruguai | SIN','geographic_coverage':'Brasil — interface de importação do SIN com Argentina e Uruguai','covers_brazil':'sim','spatial_support':'oferta/agente e interface de importação','spatial_resolution':'registro de oferta','temporal_coverage':'série conforme arquivos publicados pelo ONS','temporal_resolution':'semanal','update_frequency':'semanal','product_status':'ativo','version_or_collection':'série corrente auditada em 2026','enumeration_scope':'complete','product_page_url':'https://dados.ons.org.br/dataset/ofertas-de-preco-para-importacao','methodology_url':'https://dados.ons.org.br/dataset/ofertas-de-preco-para-importacao','primary_or_derived':'primário','limitations':'Preço ofertado é declaração comercial usada no processo operativo e não equivale a preço realizado, energia efetivamente importada, intercâmbio físico ou custo marginal de operação.','last_verified':'2026-08-18'}]

          drows=[]
          for i,r in enumerate(rows, start=634):
              url=r['product_page_url']
              drows.append({'distribution_id':f'DD{i:06d}','product_id':r['product_id'],'distribution_name':r['product_name']+' — ONS Dados Abertos','access_url':url,'format':'CSV | XLSX | PARQUET | JSON/PDF de dicionário conforme conjunto','access_protocol':'HTTPS / CKAN','access_tool':'Portal ONS Dados Abertos; recursos e API CKAN','free_download':'sim','authentication_required':'não','access_conditions':'Acesso aberto; observar o aviso legal e os termos CC BY do conjunto.','license':'CC BY','provider_attribution_required':'sim','subset_support':'por arquivo/recurso e período quando disponibilizado pelo conjunto','notes':'Distribuição oficial ONS. Interpretar campos, cobertura e revisões conforme dicionário e metadados do conjunto; formatos podem variar entre recursos.','last_verified':'2026-08-18'})

          for r in rows:
              assert r['product_id'] not in pids, r['product_id']
              assert r['product_page_url'] not in urls, r['product_page_url']
              assert set(r)==set(pfields), (r['product_id'],set(pfields)-set(r),set(r)-set(pfields))
          for r in drows:
              assert r['distribution_id'] not in dids, r['distribution_id']
              assert set(r)==set(dfields), (r['distribution_id'],set(dfields)-set(r),set(r)-set(dfields))

          with ppath.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=pfields, lineterminator='\n'); w.writerows(rows)
          with dpath.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=dfields, lineterminator='\n'); w.writerows(drows)
          print('APPENDED', len(rows), len(drows))
          PY

      - name: Validate consolidated catalog
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          for path in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(path,encoding='utf-8-sig',newline='') as f: print(path, sum(1 for _ in csv.DictReader(f)))
          with open('data/data_products.csv',encoding='utf-8-sig',newline='') as f:
              p=list(csv.DictReader(f)); assert [r['product_id'] for r in p[-8:]]==[f'DP{i:06d}' for i in range(609,617)]
          with open('data/product_distributions.csv',encoding='utf-8-sig',newline='') as f:
              d=list(csv.DictReader(f)); assert [r['distribution_id'] for r in d[-8:]]==[f'DD{i:06d}' for i in range(634,642)]
          print('READBACK_OK')
          PY

      - name: Commit materialized batch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json
          git status --short
          git commit -m 'Expand verified ONS cadastral and hydrology catalog'
          git push origin HEAD:main
