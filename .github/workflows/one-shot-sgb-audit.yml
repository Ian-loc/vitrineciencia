name: One-shot SGB catalog materializer

on:
  push:
    branches:
      - audit/sgb-2026-08-17

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified SGB batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json
          from pathlib import Path

          today = "2026-08-17"
          src_path = Path("data/data_resources.csv")
          prod_path = Path("data/data_products.csv")
          dist_path = Path("data/product_distributions.csv")
          pri_path = Path("data/brazil_scope_priorities.json")

          def read(path):
              with path.open(encoding="utf-8-sig", newline="") as f:
                  r = csv.DictReader(f)
                  return list(r.fieldnames or []), list(r)

          def append_row(path, row):
              header, _ = read(path)
              missing = [k for k in header if k not in row]
              extra = [k for k in row if k not in header]
              if missing or extra:
                  raise SystemExit(f"row/header mismatch {path}: missing={missing} extra={extra}")
              buf = io.StringIO(newline="")
              w = csv.DictWriter(buf, fieldnames=header, lineterminator="\n")
              w.writerow(row)
              with path.open("a", encoding="utf-8", newline="") as f:
                  f.write(buf.getvalue())

          sh, sources = read(src_path)
          ph, products = read(prod_path)
          dh, dists = read(dist_path)
          assert len(sources) == 103, len(sources)
          assert len(products) == 331, len(products)
          assert len(dists) == 352, len(dists)
          assert sources[-1]["resource_id"] == "DR0103"
          assert max(p["product_id"] for p in products) == "DP000335"
          assert max(d["distribution_id"] for d in dists) == "DD000356"

          source_urls = {r["homepage_url"].strip() for r in sources}
          source_names = {r["resource_name"].strip().casefold() for r in sources}
          if "https://geosgb.sgb.gov.br/geosgb/" in source_urls or "serviço geológico do brasil — dados e sistemas geocientíficos" in source_names:
              raise SystemExit("SGB source already catalogued")

          new_source = {
            "resource_id":"DR0104",
            "resource_name":"Serviço Geológico do Brasil — dados e sistemas geocientíficos",
            "acronym":"SGB/CPRM",
            "official_identity":"Infraestrutura institucional de dados geocientíficos do Serviço Geológico do Brasil",
            "description":"Ecossistema oficial do Serviço Geológico do Brasil para descoberta, consulta e disseminação de dados geológicos, geodiversidade, hidrogeologia e monitoramento de águas subterrâneas, incluindo GeoSGB e sistemas temáticos associados.",
            "homepage_url":"https://www.sgb.gov.br/",
            "data_access_url":"https://geosgb.sgb.gov.br/geosgb/",
            "research_areas":"Ciências Ambientais e Ecologia | Geociências, Solos e Geografia Física | Sensoriamento Remoto e Geoinformação | Recursos Hídricos e Oceanografia",
            "keywords":"geologia | geodiversidade | hidrogeologia | águas subterrâneas | cartografia geológica | GeoSGB | SGB | CPRM",
            "data_product_types":"catálogo geocientífico | mapas | dados vetoriais | serviços web | séries de monitoramento | relatórios",
            "data_formats":"mapas e SIG | PDF | vetores geoespaciais | JSON via serviços REST | formatos variáveis por produto",
            "visualization_types":"mapas interativos | serviços de mapa | catálogos | séries e consultas temáticas",
            "geographic_coverage":"Brasil; produtos regionais, estaduais, municipais e pontuais conforme levantamento ou rede",
            "covers_brazil":"sim",
            "spatial_resolution":"heterogênea; escalas cartográficas e suportes variam por produto e levantamento",
            "temporal_coverage":"acervos históricos e produtos correntes; varia por produto",
            "temporal_resolution":"varia por produto; monitoramento contínuo em redes específicas",
            "data_sources":"levantamentos geológicos e hidrogeológicos | mapeamento de campo | sensoriamento remoto | redes de monitoramento | bases institucionais",
            "free_download":"parcial",
            "access_conditions":"consulta pública e downloads/serviços conforme produto; verificar condições específicas de cada sistema ou arquivo",
            "programmatic_access":"parcial",
            "access_protocols":"HTTPS | ArcGIS REST | WMS | downloads conforme produto",
            "authentication_required":"desconhecido",
            "access_documentation_url":"https://geosgb.sgb.gov.br/geosgb/",
            "license":"portal GeoSGB sob CC BY-NC 4.0; verificar licença e atribuição no produto ou arquivo específico",
            "institutional_status":"público",
            "owner_or_manager":"Serviço Geológico do Brasil — SGB / Ministério de Minas e Energia",
            "academic_uses":"Geologia, geodiversidade, hidrogeologia, águas subterrâneas, planejamento territorial, riscos geológicos, cartografia e integração de dados geocientíficos.",
            "limitations":"A fonte agrega produtos de épocas, escalas, métodos e maturidades distintos; camada de visualização, mapa cartográfico, dado vetorial e série de monitoramento não são objetos intercambiáveis. Preservar escala, versão, levantamento e metadados do produto utilizado.",
            "academic_evidence_type":"documentação técnica oficial",
            "academic_evidence_url":"https://geosgb.sgb.gov.br/geosgb/sobre_geosgb.html",
            "academic_evidence_note":"O SGB identifica o GeoSGB como seu sistema de geociências e mantém serviços e produtos temáticos próprios; as propriedades científicas devem ser verificadas no nível do produto.",
            "verification_url":"https://geosgb.sgb.gov.br/geosgb/sobre_geosgb.html",
            "last_verified":today,
          }
          append_row(src_path, new_source)

          new_products = [
            {
              "product_id":"DP000336","resource_id":"DR0104","product_name":"GeoSGB — Sistema de Geociências do Serviço Geológico do Brasil","product_acronym":"GeoSGB","product_family":"Infraestrutura de dados geocientíficos","product_kind":"catalog","product_description":"Sistema institucional de descoberta e acesso ao acervo geocientífico do SGB, reunindo bases de geologia, afloramentos, geofísica, sensoriamento remoto, hidrologia, downloads, RIgeo e serviços de mapas.","research_areas":"Geology | Geospatial data | Hydrogeology | Environmental science","keywords":"GeoSGB | geology | geoscience | maps | WMS | ArcGIS REST | SGB | CPRM","geographic_coverage":"Brasil; cobertura varia conforme base e levantamento","covers_brazil":"sim","spatial_support":"pontos | linhas | polígonos | rasters | tabelas conforme base","spatial_resolution":"heterogênea; preservar escala e metadados por camada","temporal_coverage":"acervo histórico e atual; varia conforme base","temporal_resolution":"varia conforme base e produto","update_frequency":"contínua ou por projeto; não inferir frequência uniforme","product_status":"ativo","version_or_collection":"GeoSGB corrente; sucessor do Geobank","enumeration_scope":"external_index","product_page_url":"https://geosgb.sgb.gov.br/geosgb/","methodology_url":"https://geosgb.sgb.gov.br/geosgb/sobre_geosgb.html","primary_or_derived":"agregador","limitations":"GeoSGB é catálogo/sistema agregador, não um dataset homogêneo. Escala, data, método, formato, licença e qualidade devem ser preservados para cada base ou camada utilizada.","last_verified":today
            },
            {
              "product_id":"DP000337","resource_id":"DR0104","product_name":"Mapas de Geodiversidade do Brasil — levantamentos nacionais","product_acronym":"Geodiversidade Brasil","product_family":"Levantamento da Geodiversidade","product_kind":"map_layer_collection","product_description":"Mapas nacionais de geodiversidade produzidos pelo SGB para sintetizar unidades geológico-ambientais, limitações e potencialidades do meio físico, incluindo produtos nacionais em escalas de trabalho 1:5.000.000 e 1:2.500.000.","research_areas":"Geodiversity | Geology | Environmental planning | Physical geography","keywords":"geodiversity | geodiversidade | geology | geoenvironmental units | planning | SGB","geographic_coverage":"Brasil","covers_brazil":"sim","spatial_support":"unidades geológico-ambientais em mapas e SIG conforme edição","spatial_resolution":"escalas de trabalho nacionais 1:5.000.000 e 1:2.500.000","temporal_coverage":"sínteses cartográficas por edição; datas devem ser preservadas no arquivo específico","temporal_resolution":"não se aplica; produto cartográfico por edição","update_frequency":"eventual","product_status":"ativo","version_or_collection":"levantamentos nacionais disponibilizados pelo SGB; escalas 1:5.000.000 e 1:2.500.000","enumeration_scope":"complete","product_page_url":"https://www.sgb.gov.br/produtos-para-download-do-levantamento-da-geodiversidade","methodology_url":"https://www.sgb.gov.br/produtos-para-download-do-levantamento-da-geodiversidade","primary_or_derived":"derivado","limitations":"Geodiversidade é síntese geológico-ambiental para planejamento e não medida direta de condição ecológica, risco, aptidão econômica ou precisão cadastral. As duas escalas nacionais não devem ser tratadas como geometrias equivalentes sem verificar edição e método.","last_verified":today
            },
            {
              "product_id":"DP000338","resource_id":"DR0104","product_name":"Mapas de Geodiversidade Estaduais — SGB","product_acronym":"Geodiversidade Estados","product_family":"Levantamento da Geodiversidade","product_kind":"map_layer_collection","product_description":"Coleção oficial de mapas estaduais de geodiversidade com mapas, livros e arquivos SIG conforme a unidade federativa, produzida para apoiar leitura integrada do meio físico e planejamento territorial.","research_areas":"Geodiversity | Geology | Environmental planning | Physical geography","keywords":"geodiversity | states | geology | geoenvironmental units | SIG | SGB","geographic_coverage":"Unidades da Federação do Brasil; produtos listados por estado e Goiás/Distrito Federal","covers_brazil":"sim","spatial_support":"unidades geológico-ambientais vetoriais e produtos cartográficos estaduais","spatial_resolution":"escalas de trabalho entre 1:750.000 e 1:1.000.000 conforme estado","temporal_coverage":"edições próprias por estado; não constitui snapshot nacional único","temporal_resolution":"por levantamento/edição estadual","update_frequency":"eventual","product_status":"ativo","version_or_collection":"coleção estadual disponibilizada pelo SGB","enumeration_scope":"complete","product_page_url":"https://www.sgb.gov.br/mapas-de-geodiversidade-estaduais","methodology_url":"https://www.sgb.gov.br/produtos-para-download-do-levantamento-da-geodiversidade","primary_or_derived":"derivado","limitations":"Estados possuem edições, escalas, conteúdos e pacotes diferentes; a coleção não deve ser mosaificada como uma cobertura nacional temporal ou metodologicamente homogênea sem harmonização.","last_verified":today
            },
            {
              "product_id":"DP000339","resource_id":"DR0104","product_name":"Rede Integrada de Monitoramento das Águas Subterrâneas — RIMAS","product_acronym":"RIMAS","product_family":"Monitoramento de águas subterrâneas","product_kind":"dataset_series","product_description":"Rede do SGB para monitoramento de águas subterrâneas em poços, com consulta de cadastro e dados associados às estações monitoradas; o portal RimasWeb informava 507 poços cadastrados e 269 municípios atendidos em julho de 2026.","research_areas":"Hydrogeology | Groundwater | Water resources | Environmental monitoring","keywords":"RIMAS | groundwater | wells | monitoring | hydrogeology | SGB","geographic_coverage":"Brasil; rede pontual com cobertura nos municípios e aquíferos monitorados","covers_brazil":"sim","spatial_support":"poços de monitoramento pontuais e séries associadas","spatial_resolution":"ponto de poço; densidade espacial heterogênea","temporal_coverage":"séries variáveis por poço; portal atualizado em julho de 2026","temporal_resolution":"varia por poço, parâmetro e período monitorado","update_frequency":"operacional; atualização do portal observada em julho de 2026","product_status":"ativo","version_or_collection":"RimasWeb; 507 poços e 269 municípios informados em julho de 2026","enumeration_scope":"complete","product_page_url":"https://rimasweb.sgb.gov.br/layout/","methodology_url":"https://rimasweb.sgb.gov.br/layout/","primary_or_derived":"primário","limitations":"Cobertura é uma rede de pontos e não uma superfície contínua de água subterrânea. Quantidade de poços, disponibilidade de séries, parâmetros, lacunas e representatividade hidrogeológica variam espacial e temporalmente; verificar metadados de cada poço antes da análise.","last_verified":today
            },
          ]

          existing_product_urls = {p["product_page_url"].strip() for p in products}
          existing_product_names = {p["product_name"].strip().casefold() for p in products}
          for p in new_products:
              if p["product_page_url"] in existing_product_urls or p["product_name"].casefold() in existing_product_names:
                  raise SystemExit(f"duplicate product candidate: {p['product_id']} {p['product_name']}")
              append_row(prod_path, p)

          new_dists = [
            {"distribution_id":"DD000357","product_id":"DP000336","distribution_name":"GeoSGB — portal, serviços de mapa e ArcGIS REST","access_url":"https://geoportal.sgb.gov.br/server/rest/services","format":"ArcGIS REST/JSON | WMS | downloads em formatos variados conforme serviço","access_protocol":"HTTPS | ArcGIS REST | OGC WMS","access_tool":"navegador web | SIG | cliente HTTP","free_download":"sim","authentication_required":"não","access_conditions":"consulta pública aos serviços listados; condições específicas podem variar por produto","license":"portal GeoSGB sob CC BY-NC 4.0; verificar termos/metadados do produto específico","provider_attribution_required":"sim","subset_support":"por serviço | camada | atributos e operações expostas pelo endpoint","notes":"O diretório REST expõe múltiplas pastas e serviços. Esta distribuição é mecanismo de acesso ao catálogo, não transforma todas as camadas em um único dataset.","last_verified":today},
            {"distribution_id":"DD000358","product_id":"DP000337","distribution_name":"Levantamento da Geodiversidade — mapas nacionais para download","access_url":"https://www.sgb.gov.br/produtos-para-download-do-levantamento-da-geodiversidade","format":"mapa | SIG; formato específico deve ser conferido no item","access_protocol":"HTTPS download | web","access_tool":"navegador web | SIG","free_download":"sim","authentication_required":"não","access_conditions":"downloads públicos listados pelo SGB","license":"verificar licença e atribuição do arquivo; portal institucional do SGB","provider_attribution_required":"sim","subset_support":"por mapa e escala nacional","notes":"A página oficial lista separadamente os mapas nacionais 1:5.000.000 e 1:2.500.000 e outros levantamentos regionais.","last_verified":today},
            {"distribution_id":"DD000359","product_id":"DP000338","distribution_name":"Mapas de Geodiversidade Estaduais — mapa, livro e SIG por UF","access_url":"https://www.sgb.gov.br/mapas-de-geodiversidade-estaduais","format":"Mapa | Livro | SIG | Conteúdo SIG conforme estado","access_protocol":"HTTPS web/download","access_tool":"navegador web | SIG","free_download":"sim","authentication_required":"não","access_conditions":"seleção por unidade federativa e tipo de produto disponível","license":"verificar licença e atribuição do arquivo específico; portal institucional do SGB","provider_attribution_required":"sim","subset_support":"por estado e tipo de produto","notes":"A disponibilidade de Livro, SIG e Conteúdo SIG varia entre estados; não inferir formato uniforme para toda a coleção.","last_verified":today},
            {"distribution_id":"DD000360","product_id":"DP000339","distribution_name":"RimasWeb — consulta da rede de monitoramento de águas subterrâneas","access_url":"https://rimasweb.sgb.gov.br/layout/","format":"consulta web | dados e relatórios conforme poço/recurso disponível","access_protocol":"HTTPS web","access_tool":"navegador web","free_download":"parcial","authentication_required":"desconhecido","access_conditions":"consulta pública; disponibilidade de dados detalhados deve ser verificada por poço e recurso","license":"licença específica dos dados não determinada nesta auditoria; atribuir SGB e verificar metadados","provider_attribution_required":"sim","subset_support":"por poço, município e filtros disponíveis no sistema","notes":"RimasWeb informava 507 poços cadastrados e 269 municípios atendidos em julho de 2026; cobertura da rede não equivale a cobertura espacial contínua de aquíferos.","last_verified":today},
          ]
          for d in new_dists:
              append_row(dist_path, d)

          registry = json.loads(pri_path.read_text(encoding="utf-8"))
          p0 = next(x for x in registry["tiers"] if x["priority_tier"] == "P0")
          if "DR0104" in p0["resource_ids"]:
              raise SystemExit("DR0104 already in P0")
          p0["resource_ids"].append("DR0104")
          registry["reviewed_at"] = today
          pri_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          _, s2 = read(src_path); _, p2 = read(prod_path); _, d2 = read(dist_path)
          assert len(s2) == 104
          assert len(p2) == 335
          assert len(d2) == 356
          assert s2[-1]["resource_id"] == "DR0104"
          assert [x["product_id"] for x in p2[-4:]] == ["DP000336","DP000337","DP000338","DP000339"]
          assert [x["distribution_id"] for x in d2[-4:]] == ["DD000357","DD000358","DD000359","DD000360"]
          print("MATERIALIZED: 104 sources, 335 products, 356 distributions")
          PY

          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check

          python - <<'PY'
          import csv
          for path in ["data/data_resources.csv","data/data_products.csv","data/product_distributions.csv"]:
              with open(path, encoding="utf-8-sig", newline="") as f:
                  rows=list(csv.DictReader(f))
              print(path, len(rows), rows[-1])
          PY

          rm -f .github/workflows/one-shot-sgb-audit.yml
          git config user.name "Vitrine Science Auditor"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/one-shot-sgb-audit.yml || true
          if git diff --cached --quiet; then
            echo "No material changes to commit"
            exit 1
          fi
          git commit -m "Expand verified SGB geoscience catalog"
          git push origin HEAD
