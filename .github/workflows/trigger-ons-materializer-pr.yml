name: Trigger ONS materializer via PR
on:
  pull_request:
    types: [opened]
permissions:
  contents: write
jobs:
  run:
    if: github.event.pull_request.title == 'RUN VITRINE ONS 2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Execute embedded materializer
        run: |
          awk '/python3 - <<'\''PY'\''/{flag=1;next} flag && /^          PY$/{exit} flag{sub(/^          /,""); print}' .github/workflows/one-shot-ons-20260818.yml > /tmp/materialize.py
          python3 /tmp/materialize.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          git config user.name 'vitrine-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          git diff --cached --check
          git commit -m 'Expand verified ONS transmission and reliability catalog'
          git push origin HEAD:main
