          git rm .github/workflows/auto_suas_batch.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_resources.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git status --short
          git commit -m 'Expand verified SUAS social-assistance catalog' -m 'Add MDS/SUAS as a P0 Brazilian source with Censo SUAS, Observatório, RMA, CadSUAS, Tab Social and CNEAS; preserve administrative-record, respondent-universe and service-quality limitations.'
          git push origin HEAD:main
