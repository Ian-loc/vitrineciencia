name: Materializar lote verificado SUAS

on:
  push:
    paths:
      - '.github/workflows/auto_suas_batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Acrescentar fonte, produtos e distribuições SUAS
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json
          from pathlib import Path

          ROOT = Path('.')
          S = ROOT/'data/data_resources.csv'
          P = ROOT/'data/data_products.csv'
          D = ROOT/'data/product_distributions.csv'
          B = ROOT/'data/brazil_scope_priorities.json'
          TODAY = '2026-08-19'

          def read_rows(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  r = csv.DictReader(f)
                  return list(r.fieldnames or []), list(r)

          def append_rows(path, fieldnames, rows):
              buf = io.StringIO(newline='')
              w = csv.DictWriter(buf, fieldnames=fieldnames, lineterminator='\n', quoting=csv.QUOTE_MINIMAL)
              for row in rows:
                  missing = set(fieldnames) - set(row)
                  extra = set(row) - set(fieldnames)
                  if missing or extra:
                      raise SystemExit(f'{path}: row schema mismatch missing={missing} extra={extra}')
                  w.writerow(row)
              with path.open('a', encoding='utf-8', newline='') as f:
                  f.write(buf.getvalue())

          s_fields, sources = read_rows(S)
          p_fields, products = read_rows(P)
          d_fields, dists = read_rows(D)

          # Guardas contra colisão ou duplicação semântica.
          source_names = {r['resource_name'].casefold() for r in sources}
          if any('sistema único de assistência social' in n or 'vigilância socioassistencial' in n for n in source_names):
              raise SystemExit('Fonte SUAS/Vigilância já aparenta existir; revisar antes de duplicar.')
          target_names = [
              'Censo SUAS — bases anuais e resultados',
              'Observatório do Censo SUAS 2024',
              'Registro Mensal de Atendimentos — RMA',
              'CadSUAS — dados abertos agregados do cadastro do SUAS',
              'Tab Social — tabulador do Censo SUAS',
              'Cadastro Nacional de Entidades de Assistência Social — CNEAS',
          ]
          existing_product_names = {r['product_name'].casefold() for r in products}
          dup = [n for n in target_names if n.casefold() in existing_product_names]
          if dup:
              raise SystemExit(f'Produtos já existentes: {dup}')

          max_r = max(int(r['resource_id'][2:]) for r in sources)
          rid = f'DR{max_r+1:04d}'
          max_p = max(int(r['product_id'][2:]) for r in products)
          pids = [f'DP{max_p+i:06d}' for i in range(1,7)]
          max_d = max(int(r['distribution_id'][2:]) for r in dists)
          dids = [f'DD{max_d+i:06d}' for i in range(1,7)]

