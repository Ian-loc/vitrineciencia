              'format': 'consulta web | registros cadastrais', 'access_protocol': 'HTTPS', 'access_tool': 'navegador web',
              'free_download': 'parcial', 'authentication_required': 'não', 'access_conditions': 'consulta pública gratuita sem login; download em massa não demonstrado nesta auditoria',
              'license': 'conteúdo institucional MDS/gov.br sob CC BY-ND 3.0; licença específica do conteúdo exportado não determinada', 'provider_attribution_required': 'sim',
              'subset_support': 'filtros por UF, município, CNPJ, nome da entidade e outros campos disponíveis',
              'notes': 'Serviço gov.br informa acesso público imediato a nome, endereço, tipo de unidade, serviços ofertados e situação cadastral.', 'last_verified': TODAY,
            },
          ]

          append_rows(S, s_fields, [source])
          append_rows(P, p_fields, products_new)
          append_rows(D, d_fields, distributions_new)

          registry = json.loads(B.read_text(encoding='utf-8'))
          p0 = next(t for t in registry['tiers'] if t['priority_tier'] == 'P0')
          if rid in p0['resource_ids']:
              raise SystemExit('Novo resource_id já estava em P0')
          p0['resource_ids'].append(rid)
          registry['reviewed_at'] = TODAY
          B.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('APPENDED', rid, pids[0], pids[-1], dids[0], dids[-1])
          PY

      - name: Validar e reconstruir derivados
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read-back consolidado
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len(s)==129, len(s)
          assert len(p)==800, len(p)
          assert len(d)==833, len(d)
          assert s[-1]['resource_name']=='Dados, Cadastros e Vigilância Socioassistencial do SUAS — MDS'
          newp=p[-6:]
          assert all(x['resource_id']==s[-1]['resource_id'] for x in newp)
          pids={x['product_id'] for x in newp}
          assert len(pids)==6
          assert all(any(y['product_id']==pid for y in d) for pid in pids)
          q=json.loads(Path('data/data_quality_report.json').read_text(encoding='utf-8'))
          assert q['records']==129, q['records']
          print('READBACK OK', len(s), len(p), len(d), s[-1]['resource_id'], sorted(pids))
          PY

