          python - <<'PY'
          import csv, io, json
          from pathlib import Path

          VERIFIED='2026-08-15'

          def csv_line(header, row):
              sio=io.StringIO()
              w=csv.DictWriter(sio, fieldnames=header, lineterminator='\n')
              w.writerow({k: row.get(k,'') for k in header})
              return sio.getvalue().rstrip('\n')

          def mutate_csv(path, replacements, appends):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              lines=text.splitlines()
              header=next(csv.reader([lines[0]]))
              first=header[0]
              out=[lines[0]]
              seen=set()
              for line in lines[1:]:
                  rid=next(csv.reader([line]))[0]
                  if rid in replacements:
                      out.append(csv_line(header,replacements[rid])); seen.add(rid)
                  else:
                      out.append(line)
              missing=set(replacements)-seen
              if missing: raise SystemExit(f'missing replacement ids in {path}: {sorted(missing)}')
              existing={next(csv.reader([x]))[0] for x in out[1:]}
              for row in appends:
                  rid=row[first]
                  if rid in existing: raise SystemExit(f'duplicate append id {rid} in {path}')
                  out.append(csv_line(header,row)); existing.add(rid)
              p.write_text('\n'.join(out)+'\n',encoding='utf-8')

