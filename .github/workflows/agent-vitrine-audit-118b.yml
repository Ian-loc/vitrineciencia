name: Agent Vitrine Audit 118b

on:
  push:
    branches: ["agent/vitrine-audit-118"]

permissions:
  contents: write

jobs:
  materialize-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-audit-118
          fetch-depth: 0
      - name: Materialize second audited batch
        run: python3 scripts/agent_materialize_vitrine_118b.py
      - name: Validate
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          def rows(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert (len(s),len(p),len(d))==(74,126,142),(len(s),len(p),len(d))
          pids={r['product_id'] for r in p}; assert {'DP000125','DP000126'}<=pids
          assert all(r['resource_id'] in {x['resource_id'] for x in s} for r in p)
          assert all(r['product_id'] in pids for r in d)
          print('OK',len(s),len(p),len(d))
          PY
      - name: Commit and self-clean
        run: |
          rm -f scripts/agent_materialize_vitrine_118b.py .github/workflows/agent-vitrine-audit-118b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json scripts/agent_materialize_vitrine_118b.py .github/workflows/agent-vitrine-audit-118b.yml
          git commit -m "Add Amazônia Legal and Indigenous territories map products"
          git push origin HEAD:agent/vitrine-audit-118
