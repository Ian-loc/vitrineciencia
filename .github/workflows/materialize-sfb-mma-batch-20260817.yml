            dict(distribution_id='DD000447',product_id='DP000424',distribution_name='SICAR — Consulta Pública, downloads e geosserviços',access_url='https://consulta.car.gov.br/geoservices',format='dados geoespaciais e tabulares | geosserviços',access_protocol='HTTPS | geosserviços',access_tool='navegador web | software SIG',free_download='sim',authentication_required='não',access_conditions='dados públicos; filtros e disponibilidade variam por UF/município',license='não determinada especificamente para os arquivos',provider_attribution_required='sim',subset_support='por região, UF, município, CAR e filtros disponibilizados',notes='Consulta Pública informa atualização mensal, download estruturado e geosserviços; geometrias são declaradas no CAR e podem estar em diferentes estágios de análise.',last_verified='2026-08-17'),
            dict(distribution_id='DD000448',product_id='DP000425',distribution_name='Painel da Regularização Ambiental Rural — painel e dicionário',access_url='https://dados.florestal.gov.br/dataset/painel-da-regularizacao-ambiental-rural',format='Power BI | PDF | exportações tabulares conforme painel',access_protocol='HTTPS',access_tool='painel web | navegador',free_download='parcial',authentication_required='não',access_conditions='consulta pública; exportação conforme funcionalidade do painel',license='Creative Commons Attribution',provider_attribution_required='sim',subset_support='filtros municipais/territoriais e temáticos; tabelas customizadas conforme painel',notes='Indicadores consolidados do SICAR sobre análise, PRA, APP e Reserva Legal; não equivalem a verificação ecológica independente.',last_verified='2026-08-17'),
          ]

          existing_rids = {r['resource_id'] for r in existing_resources}
          existing_pids = {r['product_id'] for r in existing_products}
          existing_dids = {r['distribution_id'] for r in existing_distributions}
          existing_urls = {r['product_page_url'].strip() for r in existing_products if r.get('product_page_url')}
          existing_resource_names = {r['resource_name'].strip().casefold() for r in existing_resources}

          for r in new_resources:
              if r['resource_id'] in existing_rids: raise SystemExit(f"resource_id already exists: {r['resource_id']}")
              if r['resource_name'].strip().casefold() in existing_resource_names: raise SystemExit(f"resource_name already exists: {r['resource_name']}")
              if set(r) != set(rfields): raise SystemExit(f"source schema mismatch for {r['resource_id']}: {set(rfields)-set(r)} / {set(r)-set(rfields)}")
          for r in new_products:
              if r['product_id'] in existing_pids: raise SystemExit(f"product_id already exists: {r['product_id']}")
              if r['product_page_url'].strip() in existing_urls: raise SystemExit(f"product_page_url already catalogued: {r['product_page_url']}")
              if set(r) != set(pfields): raise SystemExit(f"product schema mismatch for {r['product_id']}")
          for r in new_distributions:
              if r['distribution_id'] in existing_dids: raise SystemExit(f"distribution_id already exists: {r['distribution_id']}")
              if set(r) != set(dfields): raise SystemExit(f"distribution schema mismatch for {r['distribution_id']}")

          def append_rows(path, fields, rows):
              with path.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  for row in rows: w.writerow(row)

          append_rows(rpath, rfields, new_resources)
          append_rows(ppath, pfields, new_products)
          append_rows(dpath, dfields, new_distributions)

          reg = json.loads(bpath.read_text(encoding='utf-8'))
          p0 = next(t for t in reg['tiers'] if t['priority_tier'] == 'P0')
          for rid in ['DR0107','DR0108','DR0109']:
              if rid not in p0['resource_ids']: p0['resource_ids'].append(rid)
          reg['reviewed_at'] = '2026-08-17'
          bpath.write_text(json.dumps(reg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('appended', len(new_resources), 'sources', len(new_products), 'products', len(new_distributions), 'distributions')
          PY

      - name: Validate and rebuild catalog
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Consolidated read-back
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          rs, ps, ds = rows('data/data_resources.csv'), rows('data/data_products.csv'), rows('data/product_distributions.csv')
          assert len(rs) == 109, len(rs)
          assert len(ps) == 421, len(ps)
          assert len(ds) == 444, len(ds)
          rids={x['resource_id'] for x in rs}; pids={x['product_id'] for x in ps}; dids={x['distribution_id'] for x in ds}
          assert {'DR0107','DR0108','DR0109'} <= rids
          assert {f'DP{i:06d}' for i in range(419,426)} <= pids
          assert {f'DD{i:06d}' for i in range(441,449)} <= dids
          assert len(rids)==len(rs) and len(pids)==len(ps) and len(dids)==len(ds)
          assert all(x['resource_id'] in rids for x in ps)
          assert all(x['product_id'] in pids for x in ds)
          print(f'READBACK OK: {len(rs)} sources, {len(ps)} products, {len(ds)} distributions')
          PY

