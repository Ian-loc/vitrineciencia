name: One-shot ANA hydrology catalog audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ana-audit-20260816.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified ANA products and distributions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          ppath = Path('data/data_products.csv')
          dpath = Path('data/product_distributions.csv')

          with ppath.open(encoding='utf-8', newline='') as f:
              products = list(csv.DictReader(f))
              pfields = list(products[0].keys())
          with dpath.open(encoding='utf-8', newline='') as f:
              dists = list(csv.DictReader(f))
              dfields = list(dists[0].keys())

          existing_names = {r['product_name'] for r in products}
          candidates = [
              {
                  'product_name': 'Conjuntura dos Recursos Hídricos no Brasil 2025 — Relatório Pleno digital',
                  'product_acronym': 'Conjuntura 2025',
                  'product_family': 'Conjuntura dos Recursos Hídricos no Brasil',
                  'product_kind': 'indicator_family',
                  'product_description': 'Relatório pleno digital da ANA que integra dados, séries históricas, estatísticas e indicadores sobre disponibilidade, usos, qualidade e quantidade da água, gestão, clima, segurança hídrica e desafios dos recursos hídricos no Brasil.',
                  'research_areas': 'Hydrology | Water resources | Climate impacts | Environmental policy | Environmental monitoring',
                  'keywords': 'Conjuntura | recursos hídricos | disponibilidade hídrica | usos da água | qualidade da água | segurança hídrica | ANA',
                  'geographic_coverage': 'Brasil',
                  'covers_brazil': 'sim',
                  'spatial_support': 'indicadores nacionais e territoriais | séries e mapas conforme tema',
                  'spatial_resolution': 'varia conforme indicador e fonte integrada',
                  'temporal_coverage': 'edição 2025 com atualização do panorama e retrospectiva recente; séries históricas variam por indicador',
                  'temporal_resolution': 'anual e outras frequências conforme indicador de origem',
                  'update_frequency': 'anual',
                  'product_status': 'ativo',
                  'version_or_collection': 'Relatório Pleno 2025; ciclo 2025–2028',
                  'enumeration_scope': 'complete',
                  'product_page_url': 'https://www.gov.br/ana/pt-br/centrais-de-conteudos/publicacoes/conjuntura-dos-recursos-hidricos/conjuntura-dos-recursos-hidricos',
                  'methodology_url': 'https://www.gov.br/ana/pt-br/centrais-de-conteudos/publicacoes/conjuntura-dos-recursos-hidricos/conjuntura-dos-recursos-hidricos',
                  'primary_or_derived': 'derivado',
                  'limitations': 'Síntese multifuente: indicadores possuem fontes, escalas, períodos, métodos e revisões próprios. O relatório não deve ser tratado como um único dataset observacional homogêneo; para análise quantitativa, preservar a fonte e a definição de cada indicador.',
                  'last_verified': '2026-08-16',
                  'dist_name': 'Conjuntura 2025 — relatório digital e publicações associadas',
                  'dist_url': 'https://www.gov.br/ana/pt-br/centrais-de-conteudos/publicacoes/conjuntura-dos-recursos-hidricos/conjuntura-dos-recursos-hidricos',
                  'format': 'site interativo | publicação digital | PDF conforme item',
                  'protocol': 'HTTPS web | HTTP/HTTPS download',
                  'tool': 'navegador web | leitor PDF',
                  'subset': 'por tema, indicador e publicação conforme interface',
                  'notes': 'A edição 2025 inaugurou novo ciclo 2025–2028 e reúne informações atualizadas e séries históricas de múltiplas instituições; registrar a fonte de cada indicador usado.'
              },
              {
                  'product_name': 'Sistema de Acompanhamento de Reservatórios — SAR',
                  'product_acronym': 'SAR',
                  'product_family': 'Monitoramento operacional de reservatórios',
                  'product_kind': 'data_service',
                  'product_description': 'Plataforma operacional da ANA para acompanhamento de dados de operação dos principais reservatórios do Brasil, organizada em módulos do Sistema Interligado Nacional, Nordeste e Semiárido e outros sistemas hídricos.',
                  'research_areas': 'Hydrology | Water resources | Reservoir operations | Environmental monitoring',
                  'keywords': 'SAR | reservatórios | volume armazenado | vazão afluente | vazão defluente | SIN | Semiárido | ANA',
                  'geographic_coverage': 'Brasil — principais reservatórios acompanhados pela ANA; cobertura varia por módulo',
                  'covers_brazil': 'sim',
                  'spatial_support': 'reservatório | sistema hídrico | bacia',
                  'spatial_resolution': 'infraestrutura/reservatório monitorado',
                  'temporal_coverage': 'séries operacionais e históricas conforme reservatório e módulo; sistema criado em 2013 e lançado em 2014',
                  'temporal_resolution': 'operacional; frequência varia conforme variável e reservatório',
                  'update_frequency': 'operacional',
                  'product_status': 'ativo',
                  'version_or_collection': 'SAR corrente verificado em 2026',
                  'enumeration_scope': 'family_level',
                  'product_page_url': 'https://www.ana.gov.br/sar/',
                  'methodology_url': 'https://www.ana.gov.br/sar/descricao-sar',
                  'primary_or_derived': 'serviço',
                  'limitations': 'Não representa todos os reservatórios do país. Cobertura, variáveis e frequência variam entre módulos e infraestruturas. Dados operacionais de reservatórios não equivalem a disponibilidade hídrica natural de bacias nem a inventário de segurança de barragens.',
                  'last_verified': '2026-08-16',
                  'dist_name': 'SAR — consulta web e dados históricos por módulo',
                  'dist_url': 'https://www.ana.gov.br/sar/',
                  'format': 'aplicação web | tabelas e séries históricas conforme módulo',
                  'protocol': 'HTTPS web',
                  'tool': 'navegador web',
                  'subset': 'reservatório | bacia | módulo | período conforme interface',
                  'notes': 'O SAR possui módulos SIN, Nordeste e Semiárido e Outros Sistemas Hídricos; o módulo Nordeste e Semiárido reúne mais de 500 reservatórios, enquanto o SIN possui conjunto próprio de infraestruturas.'
              },
              {
                  'product_name': 'Monitor de Secas — mapa mensal de severidade e impactos',
                  'product_acronym': 'Monitor de Secas',
                  'product_family': 'Monitoramento nacional de secas',
                  'product_kind': 'dataset_series',
                  'product_description': 'Produto mensal coordenado pela ANA que integra indicadores climáticos, hidrológicos e agrícolas, informações de impacto e validação institucional para classificar a severidade relativa da seca em cinco categorias no território brasileiro.',
                  'research_areas': 'Drought monitoring | Climatology | Hydrology | Agriculture | Climate impacts',
                  'keywords': 'seca | severidade | impactos | indicadores climáticos | indicadores hidrológicos | agricultura | mapa mensal | ANA',
                  'geographic_coverage': 'Brasil — cobertura nacional desde janeiro de 2024',
                  'covers_brazil': 'sim',
                  'spatial_support': 'áreas classificadas no mapa mensal | agregações territoriais',
                  'spatial_resolution': 'regional; polígonos/classes resultantes da síntese de evidências',
                  'temporal_coverage': 'série iniciada em 2014 no Nordeste; expansão posterior; cobertura nacional desde janeiro de 2024',
                  'temporal_resolution': 'mensal',
                  'update_frequency': 'mensal',
                  'product_status': 'ativo',
                  'version_or_collection': 'Programa Monitor de Secas — série mensal corrente',
                  'enumeration_scope': 'family_level',
                  'product_page_url': 'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/monitor-de-secas',
                  'methodology_url': 'https://www.gov.br/ana/pt-br/legislacao/resolucoes/resolucoes-regulatorias/2020/31',
                  'primary_or_derived': 'derivado',
                  'limitations': 'Mapa de seca relativa obtido por convergência de múltiplos indicadores e evidências validadas; não equivale a precipitação observada, um índice meteorológico isolado, impacto econômico medido diretamente ou previsão de seca futura.',
                  'last_verified': '2026-08-16',
                  'dist_name': 'Monitor de Secas — mapas mensais e sínteses de severidade',
                  'dist_url': 'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/eventos-criticos/monitor-de-secas',
                  'format': 'mapa web | imagens e publicações mensais conforme divulgação',
                  'protocol': 'HTTPS web',
                  'tool': 'navegador web',
                  'subset': 'mês | Unidade da Federação | região e Brasil conforme divulgação',
                  'notes': 'A metodologia classifica seca relativa em cinco graus e combina conhecimento técnico-científico e validação institucional. Em 2024 o produto passou a cobrir todas as UFs e o Distrito Federal.'
              },
          ]

          maxp = max(int(r['product_id'][2:]) for r in products)
          maxd = max(int(r['distribution_id'][2:]) for r in dists)
          new_products = []
          new_dists = []
          for c in candidates:
              if c['product_name'] in existing_names:
                  continue
              maxp += 1
              maxd += 1
              pid = f'DP{maxp:06d}'
              did = f'DD{maxd:06d}'
              new_products.append({
                  'product_id': pid, 'resource_id': 'DR0017', 'product_name': c['product_name'],
                  'product_acronym': c['product_acronym'], 'product_family': c['product_family'], 'product_kind': c['product_kind'],
                  'product_description': c['product_description'], 'research_areas': c['research_areas'], 'keywords': c['keywords'],
                  'geographic_coverage': c['geographic_coverage'], 'covers_brazil': c['covers_brazil'], 'spatial_support': c['spatial_support'],
                  'spatial_resolution': c['spatial_resolution'], 'temporal_coverage': c['temporal_coverage'], 'temporal_resolution': c['temporal_resolution'],
                  'update_frequency': c['update_frequency'], 'product_status': c['product_status'], 'version_or_collection': c['version_or_collection'],
                  'enumeration_scope': c['enumeration_scope'], 'product_page_url': c['product_page_url'], 'methodology_url': c['methodology_url'],
                  'primary_or_derived': c['primary_or_derived'], 'limitations': c['limitations'], 'last_verified': c['last_verified']
              })
              new_dists.append({
                  'distribution_id': did, 'product_id': pid, 'distribution_name': c['dist_name'], 'access_url': c['dist_url'],
                  'format': c['format'], 'access_protocol': c['protocol'], 'access_tool': c['tool'], 'free_download': 'sim',
                  'authentication_required': 'não', 'access_conditions': 'consulta pública; verificar condições específicas de arquivos e módulos quando aplicável',
                  'license': 'licença específica dos dados/arquivos não inferida nesta auditoria; conteúdo gov.br pode ter licença editorial própria',
                  'provider_attribution_required': 'sim', 'subset_support': c['subset'], 'notes': c['notes'], 'last_verified': '2026-08-16'
              })

          if not new_products:
              print('No new records; all candidate products already exist.')
          else:
              with ppath.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=pfields, lineterminator='\n')
                  for r in new_products: w.writerow(r)
              with dpath.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=dfields, lineterminator='\n')
                  for r in new_dists: w.writerow(r)
              print('Added products:', [r['product_id'] for r in new_products])
              print('Added distributions:', [r['distribution_id'] for r in new_dists])
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          for p in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(p, encoding='utf-8', newline='') as f:
                  n=sum(1 for _ in csv.DictReader(f))
              print(p, n)
          PY
      - name: Commit canonical delta and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-ana-audit-20260816.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json 2>/dev/null || true
          git status --short
          if git diff --cached --quiet; then
            echo 'No material changes to commit.'
            exit 0
          fi
          git commit -m 'Expand verified ANA water-monitoring catalog'
          git push origin HEAD:main
