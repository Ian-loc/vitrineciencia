name: Materializar lote biodiversidade e observações 5
on:
  push:
    branches: [data/br-biodiv-observations-batch-5]
    paths:
      - 'scripts/materialize_br_biodiv_observations_batch5.py'
      - '.github/workflows/materialize-br-biodiv-observations-batch5.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/br-biodiv-observations-batch-5
      - name: Materializar e validar
        run: |
          python scripts/materialize_br_biodiv_observations_batch5.py
          python - <<'PY'
          import csv, io
          from pathlib import Path
          p=Path('data/data_products.csv')
          lines=p.read_text(encoding='utf-8').splitlines(True)
          fields=next(csv.reader([lines[0].rstrip('\n')]))
          idx_status=fields.index('product_status')
          idx_origin=fields.index('primary_or_derived')
          fixes={
              'DP000052': {'product_status':'experimental','primary_or_derived':'derivado'},
              'DP000056': {'product_status':'experimental'},
          }
          hits={k:0 for k in fixes}
          for i,line in enumerate(lines[1:], start=1):
              pid=line.split(',',1)[0]
              if pid in fixes:
                  row=next(csv.reader([line.rstrip('\n')]))
                  for field,value in fixes[pid].items():
                      row[fields.index(field)]=value
                  buf=io.StringIO(); csv.writer(buf,lineterminator='\n').writerow(row)
                  lines[i]=buf.getvalue(); hits[pid]+=1
          assert all(v==1 for v in hits.values()), hits
          p.write_text(''.join(lines), encoding='utf-8')
          PY
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/link_role_audit.json data/brazil_scope_priorities.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Materializar lote 5 biodiversidade e séries observacionais'
            git push origin HEAD:data/br-biodiv-observations-batch-5
          fi
