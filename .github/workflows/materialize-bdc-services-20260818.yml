name: Materialize BDC services 2026-08-18

on:
  push:
    branches:
      - agent/bdc-services-20260818

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: agent/bdc-services-20260818
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize verified BDC service products
        run: python scripts/materialize_bdc_services_20260818.py

      - name: Validate Brazil scope
        run: python scripts/validate_brazil_scope.py

      - name: Validate source-product-distribution contract
        run: python scripts/validate_product_catalog.py

      - name: Rebuild catalog derivatives
        run: python scripts/build_catalog.py

      - name: Regenerate and read back link roles
        run: python scripts/audit_link_roles.py --write

      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py

      - name: Build public artifact
        run: python scripts/build_site_artifact.py

      - name: Diff check
        run: git diff --check

      - name: Relational read-back
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path('.')
          def rows(path):
              with open(path, encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))
          sources = rows('data/data_resources.csv')
          products = rows('data/data_products.csv')
          dists = rows('data/product_distributions.csv')
          sids = {r['resource_id'] for r in sources}
          pids = {r['product_id'] for r in products}
          assert all(r['resource_id'] in sids for r in products)
          assert all(r['product_id'] in pids for r in dists)
          for pid in [f'DP{i:06d}' for i in range(721, 728)]:
              assert pid in pids, pid
              assert any(d['product_id'] == pid for d in dists), pid
          for did in [f'DD{i:06d}' for i in range(751, 758)]:
              assert any(d['distribution_id'] == did for d in dists), did
          assert len(sources) == 123
          assert len(products) == 723
          assert len(dists) == 753
          print(f'READBACK {len(sources)} sources / {len(products)} products / {len(dists)} distributions')
          PY

      - name: Commit materialized canonical delta
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          if git diff --cached --quiet; then
            echo 'No material delta to commit'
            exit 1
          fi
          git commit -m 'Expand verified BDC services catalog'
          git push origin HEAD:agent/bdc-services-20260818
