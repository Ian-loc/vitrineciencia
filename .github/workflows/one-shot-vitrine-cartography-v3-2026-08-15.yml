name: Preservar baseline CSV no lote IBGE

on:
  push:
    branches:
      - agent/vitrine-ibge-cartography-2026-08-15

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-ibge-cartography-2026-08-15
          fetch-depth: 0

      - name: Reconstruir CSVs preservando baseline byte a byte
        run: |
          git show origin/main:data/data_resources.csv > /tmp/resources.base
          git show origin/main:data/data_products.csv > /tmp/products.base
          git show origin/main:data/product_distributions.csv > /tmp/distributions.base
          cp data/data_resources.csv /tmp/resources.cur
          cp data/data_products.csv /tmp/products.cur
          cp data/product_distributions.csv /tmp/distributions.cur
          python3 - <<'PY'
          from pathlib import Path

          def lines(path):
              return Path(path).read_bytes().splitlines()

          def write_with_eol(path, out_lines, base_bytes):
              eol = b'\r\n' if b'\r\n' in base_bytes[:4096] else b'\n'
              Path(path).write_bytes(eol.join(out_lines) + eol)

          # Resources: preserve every main row except factual DR0066 replacement; append DR0078–79.
          base_b = Path('/tmp/resources.base').read_bytes(); base = base_b.splitlines()
          cur = lines('/tmp/resources.cur')
          wanted = {x.split(b',',1)[0]: x for x in cur if x.startswith((b'DR0066,',b'DR0078,',b'DR0079,'))}
          assert set(wanted) == {b'DR0066',b'DR0078',b'DR0079'}
          out=[]
          for x in base:
              if x.startswith(b'DR0066,'):
                  out.append(wanted[b'DR0066'])
              else:
                  out.append(x)
          out += [wanted[b'DR0078'], wanted[b'DR0079']]
          write_with_eol('data/data_resources.csv', out, base_b)

          # Products: baseline byte-identical + four new rows.
          base_b = Path('/tmp/products.base').read_bytes(); base = base_b.splitlines(); cur=lines('/tmp/products.cur')
          add=[]
          for pid in (b'DP000145',b'DP000146',b'DP000147',b'DP000148'):
              m=[x for x in cur if x.startswith(pid+b',')]
              assert len(m)==1, (pid,len(m)); add.append(m[0])
          write_with_eol('data/data_products.csv', base+add, base_b)

          # Distributions: baseline byte-identical + six new rows.
          base_b = Path('/tmp/distributions.base').read_bytes(); base=base_b.splitlines(); cur=lines('/tmp/distributions.cur')
          add=[]
          for n in range(161,167):
              did=f'DD{n:06d}'.encode()
              m=[x for x in cur if x.startswith(did+b',')]
              assert len(m)==1, (did,len(m)); add.append(m[0])
          write_with_eol('data/product_distributions.csv', base+add, base_b)
          PY

      - name: Validar e reconstruir derivados
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          def read(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          r,p,d=read('data/data_resources.csv'),read('data/data_products.csv'),read('data/product_distributions.csv')
          assert (len(r),len(p),len(d))==(79,148,166)
          rids={x['resource_id'] for x in r}; pids={x['product_id'] for x in p}; dids={x['distribution_id'] for x in d}
          assert len(rids)==79 and len(pids)==148 and len(dids)==166
          assert all(x['resource_id'] in rids for x in p)
          assert all(x['product_id'] in pids for x in d)
          print('READBACK OK: 79 fontes, 148 produtos, 166 distribuições')
          PY
          # Prove old product/distribution rows are byte-identical to main.
          python3 - <<'PY'
          from pathlib import Path
          for cur,base,marker in [('data/data_products.csv','/tmp/products.base',b'DP000145,'),('data/product_distributions.csv','/tmp/distributions.base',b'DD000161,')]:
              cb=Path(cur).read_bytes(); bb=Path(base).read_bytes()
              prefix=cb.split(marker,1)[0]
              # Normalize only final EOL comparison; all baseline content before append must match exactly.
              assert prefix.rstrip(b'\r\n') == bb.rstrip(b'\r\n')
          print('BASELINE BYTE PRESERVATION OK')
          PY

      - name: Commitar normalização e remover one-shot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-vitrine-cartography-v3-2026-08-15.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/link_role_audit.json data/data_products.json data/data_quality_report.json
          git add -u
          git status --short
          git commit -m "Preservar baseline do lote IBGE cartografia"
          git push origin HEAD:agent/vitrine-ibge-cartography-2026-08-15
