          ]

          def read_ids(path, field):
              with path.open(newline='', encoding='utf-8') as f:
                  return {r[field] for r in csv.DictReader(f)}

          existing_p = read_ids(products_path, 'product_id')
          existing_d = read_ids(dists_path, 'distribution_id')
          assert not (existing_p & {r['product_id'] for r in product_rows}), 'product id collision'
          assert not (existing_d & {r['distribution_id'] for r in dist_rows}), 'distribution id collision'

          with products_path.open(newline='', encoding='utf-8') as f:
              reader = csv.DictReader(f)
              pfields = reader.fieldnames
              existing_urls = {r['product_page_url'] for r in reader if r.get('product_page_url')}
          proposed_urls = [r['product_page_url'] for r in product_rows]
          duplicates = sorted(set(proposed_urls) & existing_urls)
          assert not duplicates, f'product URL already cataloged: {duplicates}'

          with products_path.open('a', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=pfields, lineterminator='\n')
              for row in product_rows:
                  assert set(row) == set(pfields), (row['product_id'], set(pfields)-set(row), set(row)-set(pfields))
                  w.writerow(row)

          with dists_path.open(newline='', encoding='utf-8') as f:
              dfields = csv.DictReader(f).fieldnames
          with dists_path.open('a', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=dfields, lineterminator='\n')
              for row in dist_rows:
                  assert set(row) == set(dfields), (row['distribution_id'], set(dfields)-set(row), set(row)-set(dfields))
                  w.writerow(row)

          with products_path.open(newline='', encoding='utf-8') as f:
              products = list(csv.DictReader(f))
          with dists_path.open(newline='', encoding='utf-8') as f:
              dists = list(csv.DictReader(f))
          pids = {r['product_id'] for r in products}
          assert all(r['product_id'] in pids for r in dist_rows)
          assert len(products) == 833, len(products)
          assert len(dists) == 866, len(dists)
          print('APPEND_OK', len(product_rows), len(dist_rows), len(products), len(dists))
          PY

      - name: Run canonical validators and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read back new relations
        run: |
          python3 - <<'PY'
          import csv
          products=list(csv.DictReader(open('data/data_products.csv', encoding='utf-8')))
          dists=list(csv.DictReader(open('data/product_distributions.csv', encoding='utf-8')))
          ids={f'DP{i:06d}' for i in range(842,852)}
          dids={f'DD{i:06d}' for i in range(875,885)}
          got={r['product_id'] for r in products if r['product_id'] in ids}
          gdd={r['distribution_id'] for r in dists if r['distribution_id'] in dids}
          assert got == ids, (ids-got)
          assert gdd == dids, (dids-gdd)
          for r in dists:
              if r['distribution_id'] in dids:
                  assert r['product_id'] in ids
          print('READBACK_OK', len(products), len(dists), sorted(got), sorted(gdd))
          PY

