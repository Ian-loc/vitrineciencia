name: One-shot Embrapa soils catalog expansion

on:
  push:
    paths:
      - '.github/workflows/one-shot-embrapa-soils-20260817.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified Embrapa sources, products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          ROOT=Path('.')
          SP=ROOT/'data/data_resources.csv'
          PP=ROOT/'data/data_products.csv'
          DP=ROOT/'data/product_distributions.csv'
          BP=ROOT/'data/brazil_scope_priorities.json'
          TODAY='2026-08-17'

          def read(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  r=csv.DictReader(f); return list(r.fieldnames or []), list(r)
          sh,sources=read(SP); ph,products=read(PP); dh,dists=read(DP)
          assert len(sources)==109, f'expected 109 sources, got {len(sources)}'
          assert len(products)==441, f'expected 441 products, got {len(products)}'
          assert len(dists)==464, f'expected 464 distributions, got {len(dists)}'
          sids={r['resource_id'] for r in sources}; pids={r['product_id'] for r in products}; dids={r['distribution_id'] for r in dists}
          assert 'DR0110' not in sids and 'DR0111' not in sids
          assert all(f'DP{i:06d}' not in pids for i in range(446,454))
          assert all(f'DD{i:06d}' not in dids for i in range(469,477))
