            dict(name='RAPP — Resíduos Sólidos — Armazenador — Ibama', acronym='RAPP Resíduos Armazenador', family='RAPP — resíduos sólidos', kind='dataset_series', desc='Relação de armazenadores de resíduos declarados no RAPP por Município/UF, incluindo vínculos declarados com empresas geradoras e responsáveis pela destinação final.', areas='Environmental management | Environmental science', keywords='RAPP | solid waste | storage | hazardous waste | CTF/APP | Ibama', geo='Brasil — pessoas jurídicas no universo do CTF/APP sujeito ao formulário', support='pessoa jurídica | município/UF | vínculos gerador-destinador', resolution='por declaração/armazenador e vínculos informados', temporal='conforme declarações do RAPP no acervo', tres='anual por declaração RAPP', freq='conforme atualização do portal e ciclo declaratório', status='ativo', version='conjunto corrente; metadados CKAN de 18/09/2021', url='https://dadosabertos.ibama.gov.br/dataset/residuos-solidos-armazenador', primary='primário', limits='Registra relações declaradas no RAPP; não comprova capacidade física, estoque instantâneo, conformidade operacional ou universo completo de armazenadores fora do CTF/APP e do formulário aplicável.', fmt='HTML | CSV | XML | JSON', subset='por registros e campos disponíveis no recurso'),
            dict(name='RAPP — Resíduos Sólidos — Transportador — Ibama', acronym='RAPP Resíduos Transportador', family='RAPP — resíduos sólidos', kind='dataset_series', desc='Relação de transportadores de resíduos perigosos declarados e confirmados no RAPP, por Município/UF, com empresas geradoras e ano de prestação do serviço.', areas='Environmental management | Environmental science', keywords='RAPP | hazardous waste | transporter | solid waste | CTF/APP | Ibama', geo='Brasil — pessoas jurídicas no universo do CTF/APP sujeito ao formulário', support='pessoa jurídica | município/UF | gerador | ano', resolution='por transportador/serviço declarado e confirmado', temporal='conforme declarações do RAPP no acervo', tres='anual por declaração RAPP', freq='conforme atualização do portal e ciclo declaratório', status='ativo', version='conjunto corrente; metadados CKAN de 18/09/2021', url='https://dadosabertos.ibama.gov.br/dataset/residuos-solidos-transportador', primary='primário', limits='A lista deriva de transportadores declarados pelos geradores e confirmados pelo transportador; não é rastreamento integral de cargas nem censo de todo transporte de resíduos perigosos no país.', fmt='HTML | CSV | XML | JSON', subset='por registros e campos disponíveis no recurso'),
            dict(name='RAPP — Resíduos Sólidos — Destinador — Ibama', acronym='RAPP Resíduos Destinador', family='RAPP — resíduos sólidos', kind='dataset_series', desc='Relação de destinadores de resíduos no RAPP por Município/UF, com atividade, descrição e quantidade de resíduos destinados, ano, tipo de destinação e empresas geradoras.', areas='Environmental management | Environmental science', keywords='RAPP | solid waste | destination | treatment | hazardous waste | CTF/APP | Ibama', geo='Brasil — pessoas jurídicas no universo do CTF/APP sujeito ao formulário', support='pessoa jurídica | município/UF | resíduo | destinação | ano', resolution='por destinador/resíduo/destinação declarada', temporal='conforme declarações do RAPP no acervo', tres='anual por declaração RAPP', freq='conforme atualização do portal e ciclo declaratório', status='ativo', version='conjunto corrente; metadados CKAN de 18/09/2021', url='https://dadosabertos.ibama.gov.br/dataset/residuos-solidos-destinador', primary='primário', limits='O conjunto cobre resíduos cuja destinação/armazenamento por terceiros foi informada pelo gerador e efetivamente destinada conforme a lógica do RAPP; não representa toda destinação nacional nem auditoria independente da quantidade ou tratamento.', fmt='HTML | CSV | XML | JSON', subset='por registros e campos disponíveis no recurso'),
            dict(name='RAPP — Emissões de Poluentes Atmosféricos — Ibama', acronym='RAPP Emissões Atmosféricas', family='RAPP — emissões atmosféricas', kind='dataset_series', desc='Relação de pessoas jurídicas sujeitas ao formulário de Emissões de Poluentes Atmosféricos no RAPP, com Município/UF, atividade, poluente, quantidade declarada e metodologia usada para obtenção do dado.', areas='Environmental management | Environmental science | Climate and atmospheric sciences', keywords='RAPP | atmospheric emissions | pollutant | CTF/APP | methodology | Ibama', geo='Brasil — pessoas jurídicas no universo do CTF/APP sujeito ao formulário', support='pessoa jurídica | município/UF | atividade | poluente | ano', resolution='por declaração, estabelecimento/atividade e poluente', temporal='conforme declarações do RAPP no acervo', tres='anual por declaração RAPP', freq='conforme atualização do portal e ciclo declaratório', status='ativo', version='conjunto corrente; metadados CKAN de 18/09/2021', url='https://dadosabertos.ibama.gov.br/dataset/emissoes-de-poluentes-atmosfericos', primary='primário', limits='Quantidades podem resultar de metodologias declaradas diferentes e não são necessariamente medições instrumentais. O universo é o de pessoas jurídicas obrigadas ao RAPP, não inventário nacional completo de todas as emissões atmosféricas.', fmt='HTML | CSV', subset='por registros e campos disponíveis no recurso'),
            dict(name='RAPP — Unidade Poluidora — Ibama', acronym='RAPP Unidade Poluidora', family='RAPP — emissões atmosféricas', kind='dataset_series', desc='Série administrativa do RAPP para unidades/fontes poluidoras associadas a formulários de emissões atmosféricas, com atividade, tipo de fonte, capacidade nominal, tempo de funcionamento, controle e chaminé.', areas='Environmental management | Environmental science | Climate and atmospheric sciences', keywords='RAPP | pollution source | atmospheric emissions | control equipment | CTF/APP | Ibama', geo='Brasil — pessoas jurídicas no universo do CTF/APP sujeito aos formulários históricos de emissões', support='pessoa jurídica | município/UF | atividade | fonte poluidora', resolution='por unidade/fonte declarada', temporal='declarações anteriores a 2013 conforme descrição oficial do conjunto', tres='anual por declaração histórica', freq='descontinuada; acervo histórico', status='arquivado', version='formulários de emissões anteriores a 2013; metadados CKAN de 18/09/2021', url='https://dadosabertos.ibama.gov.br/dataset/unidade-poluidora', primary='primário', limits='É cadastro declaratório de fontes e características operacionais históricas, não série de concentração ou emissão medida. Não deve ser confundido com o conjunto de Emissões de Poluentes Atmosféricos nem extrapolado para situação atual.', fmt='HTML | CSV | XML | JSON', subset='por registros e campos disponíveis no recurso'),
            dict(name='RAPP — Exploração Econômica da Madeira ou Lenha e Subprodutos Florestais — Ibama', acronym='RAPP Exploração Madeira/Lenha', family='RAPP — produtos florestais', kind='dataset_series', desc='Relação de pessoas jurídicas que entregaram o formulário RAPP sobre movimentação de produtos florestais oriundos da exploração de madeira, lenha e subprodutos quando utilizado sistema de controle distinto do DOF.', areas='Environmental management | Forest ecology | Environmental science', keywords='RAPP | timber | firewood | forest products | non-DOF control | CTF/APP | Ibama', geo='Brasil — pessoas jurídicas obrigadas ao formulário no CTF/APP', support='pessoa jurídica | produto florestal | movimentação declarada', resolution='por declaração e movimentação registrada', temporal='conforme declarações do RAPP no acervo', tres='anual por declaração RAPP', freq='conforme atualização do portal e ciclo declaratório', status='ativo', version='conjunto corrente; metadados CKAN de 18/09/2021', url='https://dadosabertos.ibama.gov.br/dataset/exploracao-economica-da-madeira-ou-lenha-e-subprodutos-florestais', primary='primário', limits='Cobre movimentações declaradas no RAPP quando utilizado outro sistema de controle que não o DOF; portanto não deve ser somado ao DOF sem resolução de sobreposição/escopo e não comprova exploração física ou volume efetivamente removido.', fmt='HTML | CSV | XML | JSON', subset='por registros e campos disponíveis no recurso'),
          ]

          with pp.open(encoding='utf-8-sig', newline='') as f:
              reader=csv.DictReader(f); pfields=reader.fieldnames; prows=list(reader)
          with dp.open(encoding='utf-8-sig', newline='') as f:
              reader=csv.DictReader(f); dfields=reader.fieldnames; drows=list(reader)
          if resource not in {r['resource_id'] for r in csv.DictReader(open('data/data_resources.csv', encoding='utf-8-sig', newline=''))}:
              raise SystemExit(f'missing source {resource}')
          existing_urls={r['product_page_url'].strip().rstrip('/') for r in prows}
          pmax=max(int(re.search(r'\d+', r['product_id']).group()) for r in prows)
          dmax=max(int(re.search(r'\d+', r['distribution_id']).group()) for r in drows)
          newp=[]; newd=[]
          for c in candidates:
              key=c['url'].rstrip('/')
              if key in existing_urls:
                  print('SKIP existing URL', c['url']); continue
              pmax+=1; dmax+=1
              pid=f'DP{pmax:06d}'; did=f'DD{dmax:06d}'
              pr={
                'product_id':pid,'resource_id':resource,'product_name':c['name'],'product_acronym':c['acronym'],'product_family':c['family'],'product_kind':c['kind'],'product_description':c['desc'],'research_areas':c['areas'],'keywords':c['keywords'],'geographic_coverage':c['geo'],'covers_brazil':'sim','spatial_support':c['support'],'spatial_resolution':c['resolution'],'temporal_coverage':c['temporal'],'temporal_resolution':c['tres'],'update_frequency':c['freq'],'product_status':c['status'],'version_or_collection':c['version'],'enumeration_scope':'complete','product_page_url':c['url'],'methodology_url':c['url'],'primary_or_derived':c['primary'],'limitations':c['limits'],'last_verified':verified}
              dr={
                'distribution_id':did,'product_id':pid,'distribution_name':c['name']+' — dados abertos','access_url':c['url'],'format':c['fmt'],'access_protocol':'HTTPS / CKAN','access_tool':'navegador web | API CKAN','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; observar descrição e restrições legais de divulgação do conjunto','license':'Outra (Domínio Público)','provider_attribution_required':'sim','subset_support':c['subset'],'notes':'Distribuição oficial no Portal de Dados Abertos do Ibama. Preservar escopo administrativo/declaratório e metadados do recurso na análise.','last_verified':verified}
              newp.append(pr); newd.append(dr); existing_urls.add(key)
          if not newp:
              raise SystemExit('no new candidates after duplicate guard')
          with pp.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=pfields, lineterminator='\n'); w.writerows(newp)
          with dp.open('a', encoding='utf-8', newline='') as f:
              w=csv.DictWriter(f, fieldnames=dfields, lineterminator='\n'); w.writerows(newd)
          print('APPENDED', len(newp), 'products', newp[0]['product_id'], newp[-1]['product_id'])
          print('APPENDED', len(newd), 'distributions', newd[0]['distribution_id'], newd[-1]['distribution_id'])
          PY
      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Consolidated read-back and commit
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
              with open(p, encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          sids={x['resource_id'] for x in s}; pids={x['product_id'] for x in p}; dids={x['distribution_id'] for x in d}
          assert len(sids)==len(s) and len(pids)==len(p) and len(dids)==len(d)
          assert all(x['resource_id'] in sids for x in p)
          assert all(x['product_id'] in pids for x in d)
          assert all(any(y['product_id']==x['product_id'] for y in d) for x in p)
          new=[x for x in p if x['resource_id']=='DR0106' and x['last_verified']=='2026-08-17']
          print('READBACK',len(s),len(p),len(d),'DR0106 verified rows',len(new),'max',max(x['product_id'] for x in p))
          PY
          rm -f data/.trigger-ibama-rapp-dof
          git rm -f .github/workflows/tmp-materialize-ibama-rapp-dof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git add -u
          git commit -m 'Expand verified Ibama DOF CTF and RAPP catalog'
          git push origin HEAD:audit/ibama-rapp-dof-2026-08-17
