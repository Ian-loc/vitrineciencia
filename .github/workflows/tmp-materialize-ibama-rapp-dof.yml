            dict(name='DOF — Transportes de Produtos Florestais — Ibama', acronym='DOF Transportes', family='Documento de Origem Florestal — transportes', kind='dataset_series', desc='Relação de transportes acompanhados por Documento de Origem Florestal, com movimentações de produtos florestais controladas pelo sistema DOF.', areas='Environmental management | Forest ecology | Environmental science', keywords='DOF | forest products | transport | timber | charcoal | Ibama', geo='Brasil — transportes cobertos pelo sistema DOF, segmentados por UF de origem', support='documento de transporte | movimentação | produto | UF', resolution='por DOF/movimentação e UF de origem; não é fluxo físico observado fora do sistema', temporal='2007–presente conforme acervo; DOFs emitidos disponíveis desde janeiro de 2007, com lacunas de integração estadual documentadas', tres='por documento/ano de emissão', freq='semanal', status='ativo', version='conjunto corrente; metadados CKAN atualizados em 16/03/2026', url='https://dadosabertos.ibama.gov.br/dataset/dof-transportes-de-produtos-florestais', primary='primário', limits='Registra transportes acompanhados pelo DOF, não toda movimentação florestal do país. Dados internos de BA até nov/2007, CE/MA até 2009, RO até mai/2011 e MT/MG/PA em todo o período têm lacunas por não uso ou falta de integração de sistemas estaduais; documentos interestaduais descritos pelo Ibama permanecem contemplados.', fmt='CSV | XML | JSON', subset='por ano de emissão e UF de origem'),
            dict(name='Pessoas jurídicas inscritas no CTF/APP — Ibama', acronym='CTF/APP PJ', family='Cadastro Técnico Federal — atividades potencialmente poluidoras', kind='dataset_series', desc='Cadastro aberto de pessoas jurídicas inscritas no CTF/APP, extraído periodicamente das bases corporativas do Ibama e distribuído por Unidade da Federação.', areas='Environmental management | Environmental science', keywords='CTF/APP | potentially polluting activities | legal entities | administrative register | Ibama', geo='Brasil — 26 UFs e Distrito Federal', support='pessoa jurídica | situação cadastral | UF', resolution='por pessoa jurídica/registro cadastral; arquivos segmentados por UF', temporal='cadastro corrente; extrações periódicas', tres='por registro cadastral', freq='periódica conforme extração do Ibama', status='ativo', version='conjunto corrente; metadados CKAN atualizados em 24/06/2026', url='https://dadosabertos.ibama.gov.br/dataset/pessoas-juridicas-inscritas-no-ctf-app', primary='primário', limits='Inscrição no CTF/APP é condição cadastral/administrativa e não mede emissão, impacto, conformidade ambiental ou atividade efetivamente exercida em cada período. O conjunto inclui diferentes situações cadastrais e está sujeito às restrições legais de divulgação.', fmt='ZIP com 27 arquivos em CSV | XML | JSON', subset='por UF/DF'),
            dict(name='Pessoas jurídicas inscritas no CTF/AIDA — Ibama', acronym='CTF/AIDA PJ', family='Cadastro Técnico Federal — atividades e instrumentos de defesa ambiental', kind='dataset_series', desc='Cadastro aberto de pessoas jurídicas inscritas no CTF/AIDA, destinado ao registro de atividades e instrumentos de defesa ambiental e extraído periodicamente das bases corporativas do Ibama.', areas='Environmental management | Environmental science', keywords='CTF/AIDA | environmental defense | legal entities | administrative register | Ibama', geo='Brasil — 26 UFs e Distrito Federal', support='pessoa jurídica | atividade/instrumento | UF', resolution='por pessoa jurídica/registro cadastral; arquivos segmentados por UF', temporal='cadastro corrente; extrações periódicas', tres='por registro cadastral', freq='periódica conforme extração do Ibama', status='ativo', version='conjunto corrente; metadados CKAN atualizados em 24/06/2026', url='https://dadosabertos.ibama.gov.br/dataset/pessoas-juridicas-inscritas-no-ctf-aida', primary='primário', limits='Inscrição no CTF/AIDA não equivale a certificação de capacidade, desempenho ambiental, prestação efetiva de serviço ou regularidade profissional fora do escopo e data do cadastro.', fmt='ZIP com 27 arquivos em CSV | XML | JSON', subset='por UF/DF'),
            dict(name='RAPP — Resíduos Sólidos — Gerador (a partir de 2012) — Ibama', acronym='RAPP Resíduos Gerador', family='RAPP — resíduos sólidos', kind='dataset_series', desc='Relação declarada no RAPP de geradores de resíduos sólidos por Município/UF e atividade, com descrição, quantidade, ano de geração e classificação de periculosidade.', areas='Environmental management | Environmental science', keywords='RAPP | solid waste | generator | hazardous waste | CTF/APP | Ibama', geo='Brasil — pessoas jurídicas no universo do CTF/APP obrigadas ao formulário correspondente', support='pessoa jurídica | município/UF | atividade | resíduo | ano', resolution='por declaração/gerador, resíduo e ano', temporal='a partir de 2012 conforme declarações disponibilizadas', tres='anual por declaração RAPP', freq='conforme atualização do portal e ciclo declaratório', status='ativo', version='série pós-2012; página CKAN revisada em 17/08/2026', url='https://dadosabertos.ibama.gov.br/dataset/residuos-solidos-gerador-a-partir-de-2012', primary='primário', limits='Dados administrativos/declaratórios do universo obrigado ao RAPP; não constituem inventário censitário de todos os resíduos gerados no Brasil, nem medição independente de massa, destinação ou periculosidade.', fmt='HTML | CSV | XML | JSON', subset='por registros e campos disponíveis no recurso'),
