name: Finalize verified CEMADEN audit

on:
  push:
    paths:
      - '.github/workflows/materialize-cemaden-final.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update existing CEMADEN IIS and append distinct RiSAF product
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          from pathlib import Path

          def read(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f:
                  r=csv.DictReader(f); return list(r.fieldnames or []), list(r)
          def write(path, header, rows):
              with Path(path).open('w', encoding='utf-8', newline='') as f:
                  w=csv.DictWriter(f, fieldnames=header, lineterminator='\n'); w.writeheader(); w.writerows(rows)

          ph,p=read('data/data_products.csv'); dh,d=read('data/product_distributions.csv'); sh,s=read('data/data_resources.csv')
          assert (len(s),len(p),len(d))==(105,372,393),(len(s),len(p),len(d))
          assert any(r['resource_id']=='DR0005' and r['acronym']=='CEMADEN' for r in s)
          assert not any(r['product_id']=='DP000377' for r in p)
          assert not any(r['distribution_id']=='DD000398' for r in d)

          iis=next(r for r in p if r['product_id']=='DP000045')
          assert iis['resource_id']=='DR0005'
          iis['version_or_collection']='junho de 2026, publicado em 14/07/2026; série mensal corrente'
          iis['temporal_coverage']='série mensal; edição mais recente materialmente verificada: junho de 2026'
          iis['last_verified']='2026-08-17'
          iis['limitations']='O IIS e demais classificações são indicadores derivados e compostos; interpretar classes segundo metodologia e mês de referência, sem converter categorias diretamente em perdas econômicas, agrícolas ou ecológicas. A edição junho/2026 disponibiliza IIS por município.'

          newp={'product_id':'DP000377','resource_id':'DR0005','product_name':'RiSAF — Risco de Seca na Agricultura Familiar','product_acronym':'RiSAF','product_family':'Risco de seca na agricultura familiar','product_kind':'indicator_family','product_description':'Produto mensal do CEMADEN que avalia risco de seca para agricultura familiar, considerando cultivos não irrigados de feijão e/ou milho, exposição ao déficit hídrico, vulnerabilidades, capacidades adaptativas municipais e calendário agrícola.','research_areas':'Climate science | Agriculture | Drought | Vulnerability | Disaster risk','keywords':'RiSAF | drought risk | family farming | maize | beans | vulnerability | CEMADEN','geographic_coverage':'Brasil — municípios e estados com calendário de plantio vigente e dados aplicáveis na edição','covers_brazil':'sim','spatial_support':'municípios e cultivos/meses de plantio considerados','spatial_resolution':'municipal; componentes de exposição e vulnerabilidade possuem bases próprias','temporal_coverage':'série mensal; edição mais recente materialmente verificada: junho de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'junho de 2026, v.6 n.69, publicado em 03/07/2026','enumeration_scope':'complete','product_page_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar','methodology_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar','primary_or_derived':'derivado','limitations':'Risco integra exposição, vulnerabilidade e capacidade adaptativa e não é sinônimo de déficit hídrico, perda observada ou quebra de safra. Aplica-se aos cultivos e calendários definidos pelo método e depende das bases socioeconômicas e climáticas utilizadas.','last_verified':'2026-08-17'}
          assert set(newp)==set(ph)
          assert newp['product_page_url'] not in {r['product_page_url'] for r in p}
          p.append(newp)
          write('data/data_products.csv',ph,p)

          newd={'distribution_id':'DD000398','product_id':'DP000377','distribution_name':'RiSAF — boletim e dados mensais','access_url':'https://www.gov.br/cemaden/pt-br/assuntos/monitoramento/impactos-seca/RiSAF-Risco-da-seca-na-agricultura-familiar','format':'boletim | dados para download conforme edição | mapas','access_protocol':'HTTPS download','access_tool':'navegador web | planilha | SIG após processamento','free_download':'sim','authentication_required':'não','access_conditions':'download público; preservar mês de plantio, cultura, edição e componentes do risco','license':'não determinada especificamente para os arquivos nesta auditoria','provider_attribution_required':'sim','subset_support':'por edição e filtragem dos dados disponibilizados','notes':'A edição junho/2026 (v.6 n.69) foi publicada em 03/07/2026 e oferece download de boletim e dados; risco não equivale a impacto agrícola observado.','last_verified':'2026-08-17'}
          assert set(newd)==set(dh)
          d.append(newd); write('data/product_distributions.csv',dh,d)
          PY
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          def r(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          s=r('data/data_resources.csv');p=r('data/data_products.csv');d=r('data/product_distributions.csv')
          assert (len(s),len(p),len(d))==(105,373,394)
          assert sum(x['resource_id']=='DR0005' for x in s)==1
          assert next(x for x in p if x['product_id']=='DP000045')['version_or_collection'].startswith('junho de 2026')
          assert p[-1]['product_id']=='DP000377' and p[-1]['resource_id']=='DR0005'
          assert d[-1]['distribution_id']=='DD000398' and d[-1]['product_id']=='DP000377'
          si={x['resource_id'] for x in s};pi={x['product_id'] for x in p}
          assert all(x['resource_id'] in si for x in p) and all(x['product_id'] in pi for x in d)
          print('READBACK_OK',len(s),len(p),len(d))
          PY
      - name: Commit final CEMADEN audit and remove temporary workflows
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/materialize-cemaden-catalog.yml .github/workflows/materialize-cemaden-retry.yml .github/workflows/materialize-cemaden-retry2.yml .github/workflows/diagnose-cemaden.yml .github/workflows/materialize-cemaden-final.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git commit -m 'Refine verified CEMADEN drought catalog'
          git push
