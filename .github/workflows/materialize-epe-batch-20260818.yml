      - name: Consolidated read-back
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('data')
          with (p/'data_resources.csv').open(encoding='utf-8-sig', newline='') as f: resources=list(csv.DictReader(f))
          with (p/'data_products.csv').open(encoding='utf-8-sig', newline='') as f: products=list(csv.DictReader(f))
          with (p/'product_distributions.csv').open(encoding='utf-8-sig', newline='') as f: distributions=list(csv.DictReader(f))
          assert len(resources)==121
          assert len(products)==578
          assert len(distributions)==603
          ids={r['product_id'] for r in products}
          dids={r['distribution_id'] for r in distributions}
          for n in range(575,583): assert f'DP{n:06d}' in ids
          for n in range(600,608): assert f'DD{n:06d}' in dids
          assert len(ids)==len(products)
          assert len(dids)==len(distributions)
          source_ids={r['resource_id'] for r in resources}
          assert all(r['resource_id'] in source_ids for r in products)
          assert all(r['product_id'] in ids for r in distributions)
          print(f'READBACK_OK {len(resources)} {len(products)} {len(distributions)}')
          PY

      - name: Commit materialized batch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git add data/data_products.csv data/product_distributions.csv data/data_products.json || true
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 1
          fi
          git commit -m 'Expand verified EPE market and planning catalog'
          git push origin HEAD:audit/epe-batch-20260818
