name: Normalizar lote IBGE append-only
on:
  push:
    branches: [audit/ibge-experimental-ecosystem-batch]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-experimental-ecosystem-batch
          fetch-depth: 0
      - name: Restaurar baseline e preservar somente novas linhas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          specs = {
              'data/data_products.csv': tuple(f'DP{i:06d}' for i in range(82,87)),
              'data/product_distributions.csv': tuple(f'DD{i:06d}' for i in range(98,103)),
          }
          for path, ids in specs.items():
              current = Path(path).read_text(encoding='utf-8').splitlines()
              added = [line for line in current if line.startswith(ids)]
              if len(added) != len(ids):
                  raise SystemExit(f'{path}: expected {len(ids)} added rows, got {len(added)}')
              baseline = subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
              Path(path).write_text(baseline.rstrip('\n') + '\n' + '\n'.join(added) + '\n', encoding='utf-8')
          PY
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar normalização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Preservar baseline e manter lote IBGE append-only" || exit 0
          git push origin HEAD:audit/ibge-experimental-ecosystem-batch
