name: One-shot Vitrine safe retry 2026-08-17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vitrine-20260817-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute original materializer with runner-safe audit date
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-vitrine-20260818.yml').read_text(encoding='utf-8')
          a = src.index('      - name: Materialize verified catalog batch')
          b = src.index('      - name: Read-back and commit materialized batch')
          block = src[a:b]
          run = block.split('        run: |\n', 1)[1]
          lines=[]
          for line in run.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(lines).replace('2026-08-18','2026-08-17')+'\n'
          Path('/tmp/materialize.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/materialize.sh
      - name: Commit validated data only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          for path, key in [('data/data_resources.csv','resource_id'),('data/data_products.csv','product_id'),('data/product_distributions.csv','distribution_id')]:
              with open(path, encoding='utf-8', newline='') as f:
                  rows=list(csv.DictReader(f))
              print(path, len(rows), rows[-1][key])
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git diff --cached --check
          git status --short
          git commit -m 'Expand verified FUNAI ANM and SINISA catalog'
          git push origin HEAD:main
