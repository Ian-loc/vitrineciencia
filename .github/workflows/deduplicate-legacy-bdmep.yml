name: Deduplicate legacy BDMEP source

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/deduplicate-legacy-bdmep.yml"]

permissions:
  contents: write

jobs:
  deduplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove redundant legacy BDMEP source
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json
          from pathlib import Path

          rpath=Path('data/data_resources.csv')
          ppath=Path('data/data_products.csv')
          dpath=Path('data/product_distributions.csv')
          bpath=Path('data/brazil_scope_priorities.json')

          with rpath.open(encoding='utf-8', newline='') as f:
              resources=list(csv.DictReader(f)); rfields=list(resources[0])
          with ppath.open(encoding='utf-8', newline='') as f:
              products=list(csv.DictReader(f))
          with dpath.open(encoding='utf-8', newline='') as f:
              distributions=list(csv.DictReader(f))

          assert len(resources)==126, len(resources)
          assert len(products)==796, len(products)
          assert len(distributions)==827, len(distributions)
          legacy=[r for r in resources if r['resource_id']=='DR0018']
          parent=[r for r in resources if r['resource_id']=='DR0118']
          assert len(legacy)==1 and len(parent)==1
          assert legacy[0]['acronym']=='BDMEP'
          assert not any(p['resource_id']=='DR0018' for p in products), 'DR0018 still has product FKs'
          bdmep=[p for p in products if p['product_id']=='DP000529']
          assert len(bdmep)==1 and bdmep[0]['resource_id']=='DR0118'
          assert 'BDMEP' in bdmep[0]['product_name']
          assert bdmep[0]['product_page_url']=='https://portal.inmet.gov.br/servicos/bdmep-dados-historicos'
          assert bdmep[0]['methodology_url']=='https://bdmep.inmet.gov.br/'

          # DR0018 is a legacy source-level representation of an object now
          # represented at the correct granularity as DP000529 under DR0118.
          resources=[r for r in resources if r['resource_id']!='DR0018']
          assert len(resources)==125
          with rpath.open('w',encoding='utf-8',newline='') as f:
              w=csv.DictWriter(f,fieldnames=rfields,lineterminator='\n')
              w.writeheader(); w.writerows(resources)

          reg=json.loads(bpath.read_text(encoding='utf-8'))
          hits=0
          for tier in reg['tiers']:
              if 'DR0018' in tier['resource_ids']:
                  tier['resource_ids']=[x for x in tier['resource_ids'] if x!='DR0018']
                  hits+=1
          assert hits==1
          reg['reviewed_at']='2026-08-19'
          bpath.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('Removed redundant source DR0018; canonical BDMEP remains DP000529 under DR0118')
          PY

      - name: Validate and rebuild canonical artifacts
        shell: bash
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv, json
          with open('data/data_resources.csv',encoding='utf-8',newline='') as f: r=list(csv.DictReader(f))
          with open('data/data_products.csv',encoding='utf-8',newline='') as f: p=list(csv.DictReader(f))
          with open('data/product_distributions.csv',encoding='utf-8',newline='') as f: d=list(csv.DictReader(f))
          assert len(r)==125 and len(p)==796 and len(d)==827, (len(r),len(p),len(d))
          assert not any(x['resource_id']=='DR0018' for x in r)
          assert any(x['product_id']=='DP000529' and x['resource_id']=='DR0118' for x in p)
          audit=json.load(open('data/link_role_audit.json',encoding='utf-8'))
          assert audit['records']==125
          assert not any(x.get('resource_id')=='DR0018' for x in audit['records_requiring_review'])
          print('READBACK',len(r),len(p),len(d),audit['counts'])
          PY

      - name: Commit verified correction and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/deduplicate-legacy-bdmep.yml
          git config user.name "Ian-loc"
          git config user.email "lara.clemente@ufla.br"
          git add data .github/workflows/deduplicate-legacy-bdmep.yml || true
          git diff --cached --check
          git commit -m "Deduplicate legacy BDMEP source representation"
          git push origin HEAD:main
