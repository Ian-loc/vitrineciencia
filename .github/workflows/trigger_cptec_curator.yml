name: Trigger CPTEC curator
on:
  push:
    paths:
      - '.github/workflows/trigger_cptec_curator.yml'
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch curator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run curate_cptec_batch_20260818.yml --repo ${{ github.repository }}
