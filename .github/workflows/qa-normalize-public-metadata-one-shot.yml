name: QA normalize public metadata one-shot

on:
  push:
    branches:
      - qa/normalize-public-metadata-20260820

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Regenerate and validate public normalization
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_schema_identity.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          git diff --exit-code -- data/data_resources.json data/data_quality_report.json data/link_role_audit.json
      - name: Commit synchronized derived product catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_products.json
          if git diff --cached --quiet; then
            echo "No derived product changes to commit."
            exit 0
          fi
          git commit -m "Synchronize public metadata normalization"
          git push origin HEAD:qa/normalize-public-metadata-20260820
