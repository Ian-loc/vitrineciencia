name: One-shot PNAD Continua 2025 catalog audit

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/one-shot-pnad-2025.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append verified PNAD Continua source, products and distributions
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json
          from pathlib import Path

          ROOT = Path('.')
          resources_path = ROOT / 'data/data_resources.csv'
          products_path = ROOT / 'data/data_products.csv'
          dist_path = ROOT / 'data/product_distributions.csv'
          priority_path = ROOT / 'data/brazil_scope_priorities.json'

          def read_rows(path):
              with path.open('r', encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))

          def append_rows(path, rows):
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
              for row in rows:
                  if set(row) != set(fieldnames):
                      raise SystemExit(f'field mismatch for {path}: {set(fieldnames)-set(row)} / {set(row)-set(fieldnames)}')
              buf = io.StringIO(newline='')
              w = csv.DictWriter(buf, fieldnames=fieldnames, lineterminator='\n')
              for row in rows:
                  w.writerow(row)
              raw = path.read_bytes()
              prefix = b'' if raw.endswith(b'\n') else b'\n'
              with path.open('ab') as f:
                  f.write(prefix + buf.getvalue().encode('utf-8'))

          resources = read_rows(resources_path)
          products = read_rows(products_path)
          dists = read_rows(dist_path)
          if (len(resources), len(products), len(dists)) != (92, 248, 269):
              raise SystemExit(f'unexpected baseline counts: {(len(resources), len(products), len(dists))}')
          if any(r['resource_id'] == 'DR0093' or 'PNAD Contínua' in r['resource_name'] for r in resources):
              raise SystemExit('PNAD Continua source already exists; aborting duplicate append')
          candidate_names = {
              'PNAD Contínua — Características gerais dos domicílios e dos moradores 2025',
              'PNAD Contínua — Educação 2025',
              'PNAD Contínua — Rendimento de Todas as Fontes 2025',
              'PNAD Contínua — Acesso à Internet, televisão e telefone móvel 2025',
          }
          if any(p['product_name'] in candidate_names for p in products):
              raise SystemExit('candidate PNAD product already exists; aborting duplicate append')

          resource = {
            'resource_id':'DR0093',
            'resource_name':'Pesquisa Nacional por Amostra de Domicílios Contínua — IBGE',
