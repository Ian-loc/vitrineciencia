            'limitations':'Pesquisa amostral: estimativas exigem pesos, estratos e conglomerados apropriados. Módulos, visitas de coleta, períodos de referência, níveis geográficos e revisões variam. Em 2025 iniciou-se transição gradual da Amostra Mestra para incorporar o Censo 2022, com conclusão prevista em 2026; comparações devem considerar notas técnicas e reponderações.',
            'academic_evidence_type':'documentação oficial',
            'academic_evidence_url':'https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/B5',
            'academic_evidence_note':'Os metadados e a página oficial documentam a PNAD Contínua como pesquisa domiciliar integrada por amostragem probabilística, com divulgações mensais, trimestrais e anuais e módulos temáticos distintos.',
            'verification_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html',
            'last_verified':'2026-08-16'
          }

          common_page = 'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html'
          methodology = 'https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/B5'
          prows = [
