            'covers_brazil':'sim',
            'spatial_resolution':'domicílio e pessoa nos microdados; agregações nacionais, regionais e estaduais conforme produto',
            'temporal_coverage':'série iniciada em 2012; períodos de referência mensais, trimestrais e anuais conforme produto',
            'temporal_resolution':'mensal | trimestral | anual conforme divulgação',
            'data_sources':'amostra probabilística de domicílios | entrevistas domiciliares | Amostra Mestra do Sistema Integrado de Pesquisas Domiciliares',
            'free_download':'sim',
            'access_conditions':'consulta pública; microdados anonimizados e documentação disponíveis conforme divulgação; observar desenho amostral e revisões',
