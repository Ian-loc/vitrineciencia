          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          from pathlib import Path
          for p in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(p, encoding='utf-8', newline='') as f:
                  rows=list(csv.DictReader(f))
              ids=[next(iter(r.values())) for r in rows]
              assert len(ids)==len(set(ids)), (p,'duplicate ids')
              print(p, len(rows))
          PY

      - name: Commit materialized batch and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-pnad-2025.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/data_products.json data/product_distributions.csv data/brazil_scope_priorities.json docs/reports/link_role_audit.json .github/workflows/one-shot-pnad-2025.yml || true
          git status --short
          git commit -m "Expand verified PNAD Continua 2025 catalog"
          git push origin main
