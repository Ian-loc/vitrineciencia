            },
            {
              'product_id':'DP000255','resource_id':'DR0093','product_name':'PNAD Contínua — Rendimento de Todas as Fontes 2025','product_acronym':'PNADC Rendimentos 2025','product_family':'PNAD Contínua — divulgação anual','product_kind':'dataset','product_description':'Resultados anuais de 2025 sobre rendimentos do trabalho e de outras fontes, incluindo medidas de rendimento domiciliar e pessoal derivadas da PNAD Contínua.','research_areas':'Demography | Social statistics | Public policy','keywords':'PNAD Contínua | rendimento | renda | trabalho | desigualdade | domicílios | 2025 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação conforme indicador','covers_brazil':'sim','spatial_support':'pessoas e domicílios amostrados | estimativas agregadas | SIDRA','spatial_resolution':'Brasil, Grande Região e Unidade da Federação conforme indicador','temporal_coverage':'2025; séries anuais conforme indicador e revisão','temporal_resolution':'anual','update_frequency':'anual','product_status':'ativo','version_or_collection':'Rendimento de Todas as Fontes 2025; microdados atualizados em 08/05/2026','enumeration_scope':'complete','product_page_url':common_page,'methodology_url':methodology,'primary_or_derived':'derivado','limitations':'Rendimentos do trabalho e de outras fontes possuem conceitos e visitas de coleta próprios. Valores reais dependem dos deflatores e procedimentos oficiais. Estimativas requerem desenho amostral e não devem ser tratadas como registros administrativos individuais.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000256','resource_id':'DR0093','product_name':'PNAD Contínua — Acesso à Internet, televisão e telefone móvel 2025','product_acronym':'PNADC TIC 2025','product_family':'PNAD Contínua — divulgação anual temática','product_kind':'dataset','product_description':'Resultados anuais de 2025 do módulo de Tecnologia da Informação e Comunicação da PNAD Contínua sobre acesso domiciliar à Internet e televisão e posse de telefone móvel celular para uso pessoal.','research_areas':'Demography | Social statistics | Public policy','keywords':'PNAD Contínua | internet | televisão | telefone móvel | TIC | inclusão digital | 2025 | IBGE','geographic_coverage':'Brasil; Grandes Regiões; Unidades da Federação','covers_brazil':'sim','spatial_support':'domicílios e pessoas amostrados | estimativas agregadas | SIDRA','spatial_resolution':'Brasil, Grande Região e Unidade da Federação conforme tabela','temporal_coverage':'2025; módulo referente ao quarto trimestre de 2025','temporal_resolution':'anual temático','update_frequency':'anual','product_status':'ativo','version_or_collection':'TIC 2025; microdados atualizados em 02/07/2026','enumeration_scope':'complete','product_page_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/17270-pnad-continua.html','methodology_url':methodology,'primary_or_derived':'derivado','limitations':'O módulo TIC de 2025 acumula dados correspondentes ao quarto trimestre e produz estimativas amostrais; não representa tráfego de rede, cobertura física de infraestrutura ou registros de operadoras. Comparações exigem preservar questionário, população-alvo, pesos e revisões.','last_verified':'2026-08-16'
            }
          ]

          drows = [
            {'distribution_id':'DD000274','product_id':'DP000253','distribution_name':'PNAD Contínua — Domicílios e moradores 2025 — SIDRA, publicação e microdados','access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html?edicao=46417','format':'SIDRA | microdados | XLSX/ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA | HTTP/HTTPS download','access_tool':'navegador web | SIDRA | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos; microdados anonimizados; aplicar pesos e desenho amostral','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por tabela, indicador e recorte territorial; microdados para análise amostral','notes':'Microdados do tema 2025 atualizados em 17/04/2026. Não há estatísticas anuais de características dos domicílios para 2020 e 2021 nessa série temática.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000275','product_id':'DP000254','distribution_name':'PNAD Contínua — Educação 2025 — SIDRA, publicação e microdados','access_url':common_page,'format':'SIDRA | microdados | XLSX/ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA | HTTP/HTTPS download','access_tool':'navegador web | SIDRA | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos; microdados anonimizados; aplicar pesos e desenho amostral','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por indicador educacional, população e recorte territorial; microdados para análise amostral','notes':'Microdados de Educação 2025 atualizados em 19/06/2026; preservar definições e revisões do módulo.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000276','product_id':'DP000255','distribution_name':'PNAD Contínua — Rendimento de Todas as Fontes 2025 — SIDRA, publicação e microdados','access_url':common_page,'format':'SIDRA | microdados | XLSX/ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA | HTTP/HTTPS download','access_tool':'navegador web | SIDRA | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos; usar pesos, desenho amostral e deflatores oficiais quando aplicável','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por componente de rendimento, característica populacional e recorte territorial; microdados para análise amostral','notes':'Microdados de Rendimento de Todas as Fontes 2025 atualizados em 08/05/2026; conceitos de rendimento efetivo, habitual e outras fontes não são intercambiáveis.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000277','product_id':'DP000256','distribution_name':'PNAD Contínua — TIC 2025 — SIDRA, publicação e microdados','access_url':'https://www.ibge.gov.br/estatisticas/sociais/saude/17270-pnad-continua.html','format':'SIDRA | microdados | XLSX/ODS | PDF | visualização web','access_protocol':'HTTPS web | SIDRA | HTTP/HTTPS download','access_tool':'navegador web | SIDRA | software estatístico','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos; microdados anonimizados; aplicar pesos e desenho amostral','license':'licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','provider_attribution_required':'sim','subset_support':'por indicador TIC, característica e recorte territorial; microdados para análise amostral','notes':'O módulo refere-se ao quarto trimestre de 2025; microdados atualizados em 02/07/2026. Não interpretar os indicadores como medição direta de cobertura física ou qualidade de rede.','last_verified':'2026-08-16'}
          ]

          append_rows(resources_path, [resource])
          append_rows(products_path, prows)
          append_rows(dist_path, drows)

          priority = json.loads(priority_path.read_text(encoding='utf-8'))
          p0 = next(t for t in priority['tiers'] if t['priority_tier'] == 'P0')
          if 'DR0093' not in p0['resource_ids']:
              p0['resource_ids'].append('DR0093')
          priority['reviewed_at'] = '2026-08-16'
          priority_path.write_text(json.dumps(priority, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          print('materialized', len(read_rows(resources_path)), len(read_rows(products_path)), len(read_rows(dist_path)))
