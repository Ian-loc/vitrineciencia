            'description':'Pesquisa domiciliar por amostragem probabilística que produz indicadores contínuos sobre força de trabalho e resultados anuais sobre características demográficas, educação, rendimento, habitação e temas suplementares.',
            'homepage_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html',
            'data_access_url':'https://www.ibge.gov.br/estatisticas/sociais/populacao/17270-pnad-continua.html?t=microdados',
