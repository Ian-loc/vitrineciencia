name: Materialize verified IBGE prices batch 2026-08-17

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/materialize-vitrine-prices-2026-08-17.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified canonical records and validate
