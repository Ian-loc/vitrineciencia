          ROOT = pathlib.Path('.')
          TODAY = '2026-08-17'

          def read_csv(path):
              with open(path, encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))

          def append_dict_rows(path, id_field, rows):
              path = ROOT / path
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  existing = list(reader)
              existing_ids = {r[id_field] for r in existing}
              dup_ids = [r[id_field] for r in rows if r[id_field] in existing_ids]
              if dup_ids:
                  raise SystemExit(f'IDs already exist in {path}: {dup_ids}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n', extrasaction='raise')
                  for row in rows:
                      writer.writerow(row)

