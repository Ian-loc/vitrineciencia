              'temporal_coverage':'série histórica mensal; edição mais recente materialmente verificada: junho de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'série corrente; junho de 2026 materialmente verificado','enumeration_scope':'complete',
              'product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/precos-e-custos/9270-sistema-nacional-de-pesquisa-de-custos-e-indices-da-construcao-civil.html','methodology_url':'https://www.ibge.gov.br/estatisticas/economicas/precos-e-custos/9270-sistema-nacional-de-pesquisa-de-custos-e-indices-da-construcao-civil.html','primary_or_derived':'derivado',
