          source_ids={r['resource_id'] for r in s}; product_ids={r['product_id'] for r in p}
          assert all(r['resource_id'] in source_ids for r in p)
          assert all(r['product_id'] in product_ids for r in d)
          assert len(source_ids)==len(s) and len(product_ids)==len(p) and len({r['distribution_id'] for r in d})==len(d)
          reg=json.loads(Path('data/brazil_scope_priorities.json').read_text(encoding='utf-8'))
          assert 'DR0105' in next(t for t in reg['tiers'] if t['priority_tier']=='P0')['resource_ids']
