name: Materialize verified ICMBio catalog

on:
  push:
    paths:
      - '.github/workflows/materialize-icmbio-catalog.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
