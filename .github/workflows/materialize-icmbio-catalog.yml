          reg = json.loads(pri_path.read_text(encoding='utf-8'))
          reg['reviewed_at'] = '2026-08-17'
          p0 = next(t for t in reg['tiers'] if t['priority_tier']=='P0')['resource_ids']
          assert 'DR0105' not in p0
          p0.append('DR0105')
          pri_path.write_text(json.dumps(reg, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY

          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check

          python - <<'PY'
