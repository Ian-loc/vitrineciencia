name: One-shot Vitrine agro audit

on:
  push:
    branches:
      - agent/vitrine-agro-dedupe-20260816

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-agro-dedupe-20260816
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Curate, validate, read back and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, re, unicodedata
          from pathlib import Path

          TODAY='2026-08-16'
          S=Path('data/data_resources.csv'); P=Path('data/data_products.csv'); D=Path('data/product_distributions.csv')
          B=Path('data/brazil_scope_priorities.json')

          def norm(s):
              s=unicodedata.normalize('NFKD',s).encode('ascii','ignore').decode().lower()
              return re.sub(r'[^a-z0-9]+',' ',s).strip()
          def rows(path):
              with path.open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          def one_csv_row(fieldnames,row):
              buf=io.StringIO(); w=csv.DictWriter(buf,fieldnames=fieldnames,lineterminator='\n'); w.writerow(row); return buf.getvalue()
          def remove_or_rewrite(path, remove_ids, id_col, rewrite=None):
              rewrite=rewrite or {}
              lines=path.read_text(encoding='utf-8-sig').splitlines(keepends=True)
              out=[lines[0]]
              for line in lines[1:]:
                  vals=next(csv.reader([line]))
                  header=next(csv.reader([lines[0]]))
                  row=dict(zip(header,vals)); rid=row[id_col]
                  if rid in remove_ids: continue
                  if rid in rewrite:
                      row.update(rewrite[rid]); line=one_csv_row(header,row)
                  out.append(line)
              path.write_text(''.join(out),encoding='utf-8')

          sources=rows(S); products=rows(P); dists=rows(D)
          print('START',len(sources),len(products),len(dists))

          # Proven semantic duplicate: same producer, collection, page and methodology.
          bypid={r['product_id']:r for r in products}
          a,b=bypid['DP000025'],bypid['DP000050']
          assert a['resource_id']==b['resource_id']=='DR0010'
          assert a['version_or_collection']==b['version_or_collection']=='Coleção 10.1'
          assert a['product_page_url']==b['product_page_url']=='https://brasil.mapbiomas.org/colecoes-mapbiomas/'
          assert a['methodology_url']==b['methodology_url']=='https://brasil.mapbiomas.org/metodo_cobertura_e_uso/'
          remove_or_rewrite(P,{'DP000050'},'product_id')
          remove_or_rewrite(D,{'DD000033'},'distribution_id',{'DD000061':{'product_id':'DP000025'},'DD000062':{'product_id':'DP000025'}})

          sources=rows(S); products=rows(P); dists=rows(D)
          assert 'DP000050' not in {r['product_id'] for r in products}
          assert 'DD000033' not in {r['distribution_id'] for r in dists}
          assert {r['distribution_id'] for r in dists if r['product_id']=='DP000025'} >= {'DD000061','DD000062'}

          # The catalog had agricultural products only indirectly referenced, not a dedicated source family.
          # Create the official IBGE thematic family once and attach the complete missing batch to it.
          src_names={norm(r['resource_name']):r for r in sources}
          found=[r for r in sources if norm(r['resource_name']) in {'estatisticas agropecuarias ibge','agricultura pecuaria e outros ibge'}]
          if found:
              RID=found[0]['resource_id']
          else:
              next_r=max(int(r['resource_id'][2:]) for r in sources)+1; RID=f'DR{next_r:04d}'
              assert RID=='DR0087', f'unexpected next resource id {RID}'
              sf=list(sources[0].keys())
              sr={
                'resource_id':RID,'resource_name':'Estatísticas Agropecuárias — IBGE','acronym':'Estatísticas Agropecuárias IBGE',
                'official_identity':'Tema institucional Agricultura, pecuária e outros do IBGE',
                'description':'Família institucional de operações estatísticas do IBGE sobre agricultura, pecuária, produção florestal, pesca e aquicultura, reunindo levantamentos estruturais e conjunturais com periodicidades e unidades de análise próprias.',
                'homepage_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html',
                'data_access_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html',
                'research_areas':'Agricultura, Florestas e Uso da Terra | Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados',
                'keywords':'agricultura | pecuária | produção florestal | pesca | aquicultura | estatísticas oficiais | IBGE',
                'data_product_types':'pesquisas anuais | pesquisas trimestrais | levantamentos mensais | censos | séries estatísticas',
                'data_formats':'SIDRA | XLS | XLSX | ODS | publicações digitais; varia conforme produto','visualization_types':'tabelas | séries históricas | gráficos | publicações',
                'geographic_coverage':'Brasil; desagregação varia de nacional a municipal conforme operação','covers_brazil':'sim',
                'spatial_resolution':'município, Unidade da Federação, região ou Brasil conforme pesquisa','temporal_coverage':'séries históricas e edições correntes conforme operação','temporal_resolution':'mensal | trimestral | semestral | anual | censitária conforme produto',
                'data_sources':'levantamentos e censos do IBGE | estabelecimentos e informantes | registros administrativos complementares conforme pesquisa',
                'free_download':'sim','access_conditions':'consulta pública e downloads conforme produto; resultados também podem ser disseminados no SIDRA',
                'programmatic_access':'parcial','access_protocols':'HTTP/HTTPS download | SIDRA | Serviço de Dados do IBGE conforme produto','authentication_required':'não',
                'access_documentation_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html',
                'license':'licença específica deve ser verificada no produto ou arquivo; não inferida da página temática','institutional_status':'público','owner_or_manager':'IBGE',
                'academic_uses':'Analisar produção agrícola, pecuária e florestal, estrutura produtiva, conjuntura agropecuária e relações territoriais com ambiente, uso da terra e economia.',
                'limitations':'O tema agrega operações com populações-alvo, cortes de inclusão, periodicidades, revisões e níveis geográficos diferentes; não tratar pesquisas municipais, trimestrais e censitárias como uma única série homogênea.',
                'academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html',
                'academic_evidence_note':'A página temática oficial enumera como produtos distintos LSPA, Leite, POG, Couro, Abate, Estoques, PEVS, PPM, PAM e Censo Agropecuário.',
                'verification_url':'https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/2071-np-estatistica-da-producao-agricola.html','last_verified':TODAY,
              }
              with S.open('a',encoding='utf-8',newline='') as f:f.write(one_csv_row(sf,sr))
              priorities=json.loads(B.read_text(encoding='utf-8'))
              p0=next(t for t in priorities['tiers'] if t['priority_tier']=='P0')
              if RID not in p0['resource_ids']: p0['resource_ids'].append(RID)
              priorities['reviewed_at']=TODAY
              B.write_text(json.dumps(priorities,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('ADDED_SOURCE',RID)

          products=rows(P); dists=rows(D)
          pf=list(products[0].keys()); df=list(dists[0].keys())
          next_pid=max(int(r['product_id'][2:]) for r in products)+1
          next_did=max(int(r['distribution_id'][2:]) for r in dists)+1

          candidates=[
            ('pevs','Produção da Extração Vegetal e da Silvicultura — edição 2024','PEVS 2024','Estatísticas agropecuárias — produção florestal','Pesquisa anual do IBGE sobre quantidade e valor da produção obtida pela extração de recursos vegetais nativos e pela silvicultura, incluindo área total existente e área colhida de cultivos florestais.','Agriculture | Forestry | Environmental statistics | Territorial analysis','PEVS | extrativismo vegetal | silvicultura | produção florestal | florestas plantadas | municípios | IBGE','Brasil — Grandes Regiões, Unidades da Federação e municípios produtores','município | Unidade da Federação | Grande Região | Brasil','municipal nos resultados detalhados; agregações regionais e nacionais disponíveis','série histórica; edição corrente verificada 2024','anual','anual','2024','https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9105-producao-da-extracao-vegetal-e-da-silvicultura.html','A pesquisa mede produção de produtos florestais, não cobertura florestal, biomassa ou estoque de carbono. Extrativismo nativo e silvicultura plantada são componentes distintos; revisões e notas técnicas da edição usada precisam ser preservadas.','produto | município | Unidade da Federação | Grande Região','Edição 2024; disseminação oficial por publicação digital, tabelas e SIDRA.'),
            ('abate','Pesquisa Trimestral do Abate de Animais — resultados completos','Abate Trimestral','Estatísticas trimestrais da produção pecuária','Pesquisa conjuntural do IBGE sobre número de animais abatidos e peso total das carcaças por espécie em estabelecimentos sob fiscalização sanitária federal, estadual ou municipal.','Agriculture | Livestock | Economic statistics | Territorial analysis','abate | bovinos | suínos | frangos | carcaças | produção pecuária | IBGE','Brasil e Unidades da Federação nos resultados completos','estabelecimento informante | Unidade da Federação | Brasil','Unidade da Federação na divulgação completa','série trimestral; edição corrente verificada 1º trimestre de 2026','trimestral; tabelas discriminam meses dentro do trimestre','trimestral','1º trimestre de 2026','https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9203-pesquisas-trimestrais-do-abate-de-animais.html','Investiga abate sob fiscalização sanitária e não representa automaticamente todo abate informal ou não inspecionado. Distinguir Primeiros Resultados nacionais dos Resultados Completos por Unidade da Federação e considerar revisões programadas.','espécie | mês | Unidade da Federação | Brasil','Resultados completos do 1º trimestre de 2026 divulgados em 16/06/2026; dados sujeitos à política de revisão do IBGE.'),
            ('ovos','Produção de Ovos de Galinha — resultados trimestrais','POG','Estatísticas trimestrais da produção pecuária','Pesquisa trimestral do IBGE sobre produção física de ovos e efetivo de poedeiras/matrizeiras em estabelecimentos especializados com capacidade de alojamento de pelo menos 10 mil aves elegíveis.','Agriculture | Livestock | Economic statistics | Territorial analysis','ovos de galinha | poedeiras | matrizeiras | produção pecuária | granjas | IBGE','Brasil e Unidades da Federação nos resultados completos','estabelecimento informante | Unidade da Federação | Brasil','Unidade da Federação na divulgação completa','série iniciada com dados de 1983; edição corrente verificada 1º trimestre de 2026','trimestral com dados mensais dentro do trimestre','trimestral','1º trimestre de 2026','https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9216-pesquisa-trimestral-da-producao-de-ovos-de-galinha.html','Representa produção especializada/comercial no painel elegível e não toda a produção municipal de ovos; a PPM inclui produção não comercial e estabelecimentos abaixo do corte. Primeiros resultados são provisórios.','mês | Unidade da Federação | Brasil','Resultados do 1º trimestre de 2026; painel e valores podem ser revistos conforme política da pesquisa.'),
            ('leite','Pesquisa Trimestral do Leite — resultados completos','Leite Trimestral','Estatísticas trimestrais da produção pecuária','Pesquisa trimestral do IBGE sobre quantidades de leite cru, resfriado ou não, adquiridas e industrializadas pelos estabelecimentos investigados.','Agriculture | Livestock | Economic statistics | Territorial analysis','leite cru | laticínios | aquisição | industrialização | preço ao produtor | IBGE','Brasil e Unidades da Federação nos resultados completos','estabelecimento informante | Unidade da Federação | Brasil','Unidade da Federação na divulgação completa','série trimestral; edição corrente verificada 1º trimestre de 2026','trimestral','trimestral','1º trimestre de 2026','https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9209-pesquisa-trimestral-do-leite.html','Mede leite cru adquirido/industrializado pelos estabelecimentos cobertos e não equivale à produção total de leite na fazenda. O preço médio pago ao produtor, investigado desde 2019, é estatística experimental e deve permanecer separado das quantidades físicas.','Unidade da Federação | Brasil | variável','Resultados completos do 1º trimestre de 2026; quantidades físicas e preço médio têm estatutos metodológicos distintos.'),
            ('couro','Pesquisa Trimestral do Couro — resultados completos','Couro Trimestral','Estatísticas trimestrais da produção pecuária','Pesquisa trimestral do IBGE sobre quantidade de couro cru bovino adquirida e curtida em estabelecimentos que adquirem e curtem pelo menos 5 mil unidades inteiras de couro cru bovino por ano.','Agriculture | Livestock | Economic statistics | Territorial analysis','couro bovino | curtumes | couro cru | curtimento | produção pecuária | IBGE','Brasil e Unidades da Federação nos resultados completos','estabelecimento informante | Unidade da Federação | Brasil','Unidade da Federação na divulgação completa','série trimestral desde 1997; edição corrente verificada 1º trimestre de 2026','trimestral','trimestral','1º trimestre de 2026','https://www.ibge.gov.br/estatisticas/economicas/agricultura-e-pecuaria/9214-pesquisa-trimestral-do-couro.html','A população-alvo usa corte de pelo menos 5 mil unidades anuais e não representa curtumes abaixo desse limite. Quantidades adquiridas, recebidas de terceiros e curtidas são conceitos distintos; Primeiros Resultados são nacionais e provisórios.','mês | Unidade da Federação | Brasil | variável','Resultados completos do 1º trimestre de 2026; publicação digital e SIDRA com política de revisão.'),
          ]
          aliases={'pevs':['producao da extracao vegetal e da silvicultura'],'abate':['pesquisa trimestral do abate de animais'],'ovos':['producao de ovos de galinha'],'leite':['pesquisa trimestral do leite'],'couro':['pesquisa trimestral do couro']}
          added=[]
          for c in candidates:
              key,name,acro,family,desc,areas,keywords,cov,support,spatial,temp,tres,freq,version,url,limits,subset,notes=c
              if any(any(a in norm(r['product_name']) for a in aliases[key]) for r in products):
                  print('SKIP_EXISTING',key); continue
              pid=f'DP{next_pid:06d}'; next_pid+=1
              pr={'product_id':pid,'resource_id':RID,'product_name':name,'product_acronym':acro,'product_family':family,'product_kind':'dataset_series','product_description':desc,'research_areas':areas,'keywords':keywords,'geographic_coverage':cov,'covers_brazil':'sim','spatial_support':support,'spatial_resolution':spatial,'temporal_coverage':temp,'temporal_resolution':tres,'update_frequency':freq,'product_status':'ativo','version_or_collection':version,'enumeration_scope':'complete','product_page_url':url,'methodology_url':url,'primary_or_derived':'primário','limitations':limits,'last_verified':TODAY}
              with P.open('a',encoding='utf-8',newline='') as f:f.write(one_csv_row(pf,pr))
              did=f'DD{next_did:06d}'; next_did+=1
              dr={'distribution_id':did,'product_id':pid,'distribution_name':name+' — página, tabelas e SIDRA','access_url':url,'format':'XLSX | SIDRA | publicação digital','access_protocol':'HTTPS web | HTTP download','access_tool':'navegador web | planilha | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública e downloads oficiais; observar revisões da edição','license':'licença específica do arquivo não inferida; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':subset,'notes':notes,'last_verified':TODAY}
              with D.open('a',encoding='utf-8',newline='') as f:f.write(one_csv_row(df,dr))
              products.append(pr); dists.append(dr); added.append((pid,did,key))
          print('ADDED',added)

          # Consolidated relational/semantic read-back before project validators.
          sources=rows(S); products=rows(P); dists=rows(D)
          rids=[r['resource_id'] for r in sources]; pids=[r['product_id'] for r in products]; dids=[r['distribution_id'] for r in dists]
          assert len(rids)==len(set(rids)); assert len(pids)==len(set(pids)); assert len(dids)==len(set(dids))
          assert all(r['resource_id'] in set(rids) for r in products); assert all(r['product_id'] in set(pids) for r in dists)
          assert sum('mapbiomas cobertura e uso da terra' in norm(r['product_name']) and '10 1' in norm(r['version_or_collection']) for r in products)==1
          print('READBACK_PREVALIDATION',len(sources),len(products),len(dists))
          PY

          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check

          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
              with Path(p).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          s=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len({x['resource_id'] for x in s})==len(s); assert len({x['product_id'] for x in p})==len(p); assert len({x['distribution_id'] for x in d})==len(d)
          print('FINAL_READBACK',len(s),len(p),len(d))
          for x in p:
              if x['last_verified']=='2026-08-16' and int(x['product_id'][2:])>=204: print('NEW_PRODUCT',x['product_id'],x['resource_id'],x['product_name'])
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add data
          git commit -m 'Audit MapBiomas duplicate and expand IBGE agro statistics'
          git rm .github/workflows/one-shot-vitrine-agro.yml
          git commit -m 'Remove one-shot audit workflow'
          git push origin HEAD:agent/vitrine-agro-dedupe-20260816
