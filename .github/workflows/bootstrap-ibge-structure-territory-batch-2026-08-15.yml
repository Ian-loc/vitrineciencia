name: One-shot IBGE structure territory batch

on:
  push:
    branches: [curation/ibge-structure-territory-batch-2026-08-15]
    paths:
      - '.github/workflows/bootstrap-ibge-structure-territory-batch-2026-08-15.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: curation/ibge-structure-territory-batch-2026-08-15
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified IBGE structure-territory products
        shell: bash
        run: |
          python - <<'PY'
          import csv, io
          from pathlib import Path

          product_path = Path('data/data_products.csv')
          dist_path = Path('data/product_distributions.csv')
          resource_path = Path('data/data_resources.csv')

          def read(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          src, ps, ds = read(resource_path), read(product_path), read(dist_path)
          assert (len(src), len(ps), len(ds)) == (82, 166, 184), (len(src), len(ps), len(ds))
          assert ps[-1]['product_id'] == 'DP000169', ps[-1]['product_id']
          assert ds[-1]['distribution_id'] == 'DD000187', ds[-1]['distribution_id']
          assert 'DR0070' in {r['resource_id'] for r in src}

          products = [
            ['DP000170','DR0070','Área de Atuação da SUFRAMA — edição 2025','SUFRAMA 2025','Estrutura Territorial — recortes legais e institucionais','dataset','Recorte territorial divulgado pelo IBGE para a área de atuação da Superintendência da Zona Franca de Manaus, incluindo a Zona Franca de Manaus e Áreas de Livre Comércio legalmente instituídas na Amazônia Ocidental e no Amapá.','Regional science | Territorial planning | Political geography | Socioeconomic geography','SUFRAMA | Zona Franca de Manaus | Áreas de Livre Comércio | Amazônia Ocidental | recorte legal | municípios | IBGE','Amazônia Ocidental e municípios do Amapá abrangidos pelas áreas legalmente administradas pela SUFRAMA, conforme edição 2025','sim','municípios | recorte legal/institucional','municipal; não é superfície econômica ou ambiental contínua','situação normativa representada na edição 2025; inclui alteração legal de 2025 relativa a Pacaraima (RR)','edição territorial','conforme alterações legais e territoriais','ativo','2025','complete','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/37409-suframa.html','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/37409-suframa.html','derivado','O IBGE disponibiliza o recorte, mas a delimitação decorre de legislação federal e da área administrativa da SUFRAMA. Não interpretar o produto como medida de atividade econômica, intensidade de incentivos fiscais ou cobertura ambiental. A edição 2025 incorpora a inclusão de Pacaraima (RR) na Área de Livre Comércio de Boa Vista pela Lei nº 15.273/2025.','2026-08-15'],
            ['DP000171','DR0070','Alterações Toponímicas Municipais — edição 2025','Toponímias Municipais 2025','Estrutura Territorial — nomenclatura municipal','dataset_series','Série de tabelas do IBGE que registra municípios com alterações legais de nome ou de grafia, mantendo a denominação municipal conforme legislação estadual ou municipal aceita nos termos dos procedimentos institucionais.','Regional science | Territorial planning | Political geography | Socioeconomic geography','toponímia | nomes municipais | grafia | municípios | legislação territorial | IBGE','Brasil','sim','municípios | registros tabulares de alteração de nome ou grafia','municipal; informação nominal/tabular, não geométrica','edições históricas disponíveis desde pelo menos 2016; edição corrente 2025','por alteração registrada e edição anual','anual nas edições recentes','ativo','2025','complete','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/27336-alteracoes-toponimicas-municipais.html','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/27336-alteracoes-toponimicas-municipais.html','derivado','Alteração de nome e alteração de grafia são categorias distintas. O IBGE não altera arbitrariamente topônimos: a atualização segue legislação estadual, delegação legal aos municípios ou correção de inconsistência após avaliação oficial. Não usar a série como genealogia completa de criação, extinção ou mudança de limites municipais.','2026-08-15'],
            ['DP000172','DR0070','MATOPIBA — recorte territorial de referência','MATOPIBA','Estrutura Territorial — recortes legais e institucionais','dataset','Recorte territorial de municípios de Maranhão, Tocantins, Piauí e Bahia associado ao Plano de Desenvolvimento Agropecuário e Agroindustrial do MATOPIBA e mantido pelo IBGE para divulgação estatística e planejamento.','Regional science | Territorial planning | Political geography | Socioeconomic geography','MATOPIBA | Maranhão | Tocantins | Piauí | Bahia | agricultura | recorte territorial | IBGE','municípios abrangidos pelo recorte MATOPIBA nos estados do Maranhão, Tocantins, Piauí e Bahia','sim','municípios | recorte legal/institucional','municipal; não é uma região natural ou bioma','delimitação original definida em 2015; contexto normativo alterado em 2020 e 2023','edição territorial','atualização quando houver mudança normativa e ajuste territorial anual do IBGE','ativo','recorte original de 2015 mantido operacionalmente até nova delimitação','complete','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34329-matopiba.html','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34329-matopiba.html','derivado','O IBGE não é responsável pela delimitação do MATOPIBA. O recorte original foi definido pela Portaria nº 244/2015; o plano foi revogado em 2020 e recriado em 2023 sem nova delimitação territorial, razão pela qual o IBGE mantém operacionalmente a área original até definição posterior. Não confundir com bioma, fronteira agrícola observada ou região homogênea.','2026-08-15'],
            ['DP000173','DR0070','Localidades do Brasil — Censo Demográfico 2022','Localidades do Brasil 2022','Estrutura Territorial — localidades e assentamentos','dataset','Mapeamento nacional das localidades identificadas pelo IBGE no Censo Demográfico 2022, com localização, denominação, categorização e subordinação político-administrativa em classes urbanas, rurais, indígenas, quilombolas e outras.','Urban geography | Regional science | Territorial planning | Socioeconomic geography','localidades | cidades | vilas | povoados | lugarejos | localidades indígenas | localidades quilombolas | Censo 2022 | IBGE','Brasil','sim','pontos/localizações e arquivos vetoriais de localidades | consulta nominal','localidade individual; representação vetorial e coordenadas conforme arquivo','Censo Demográfico 2022, com análise de transformações em relação a 2010','edição censitária','por ciclo censitário/edição','ativo','Censo Demográfico 2022 — publicação 2025','complete','https://www.ibge.gov.br/estatisticas/multidominio/ciencia-tecnologia-e-inovacao/27385-localidades.html?lang=pt-BR','https://www.ibge.gov.br/estatisticas/multidominio/ciencia-tecnologia-e-inovacao/27385-localidades.html?lang=pt-BR','primário','Localidade é categoria operacional/conceitual do IBGE e não equivale automaticamente a município, área urbana legal ou assentamento formal. Categorias e regras metodológicas devem ser preservadas; comparações 2010–2022 exigem considerar mudanças de classificação e mapeamento.','2026-08-15'],
            ['DP000174','DR0070','Evolução da Divisão Territorial do Brasil — 1872–2010','EDTB 1872–2010','Estrutura Territorial — evolução histórica político-administrativa','dataset_series','Estudo histórico do IBGE sobre a evolução da divisão político-administrativa brasileira de 1872 a 2010, com mapas, malhas estaduais e municipais, genealogia municipal, alterações de toponímia/grafia e valores populacionais por anos censitários.','Regional science | Territorial planning | Political geography | Socioeconomic geography','divisão territorial | municípios | estados | genealogia municipal | limites históricos | censos | 1872-2010 | IBGE','Brasil','sim','malhas históricas estaduais e municipais | pontos | tabelas genealógicas','escala e precisão histórica variáveis; malhas reconstruídas não possuem precisão cartográfica cadastral','1872–2010','por ano censitário/recorte histórico','produto histórico, sem periodicidade corrente inferida','arquivado','1872–2010 — publicação 2011','complete','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/15771-evolucao-da-divisao-territorial-do-brasil.html','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/15771-evolucao-da-divisao-territorial-do-brasil.html','derivado','As malhas históricas foram produzidas para reconstrução da evolução territorial e o próprio IBGE informa que não possuem precisão cartográfica. Não usar como limites cadastrais nem pressupor comparabilidade geométrica direta entre anos sem considerar a metodologia de reconstrução, emancipações, desmembramentos e mudanças de nomenclatura.','2026-08-15']
          ]

          distributions = [
            ['DD000188','DP000170','Área de Atuação da SUFRAMA 2025 — tabelas e geosserviços','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/37409-suframa.html','ODS | XLS | geosserviços conforme página/Quadro Geográfico','HTTP download | geosserviço','navegador web | Plataforma Geográfica Interativa','sim','não','consulta e downloads públicos conforme componente','licença específica não inferida no nível do arquivo','sim','por lista/agregado/edição','Recorte legal e administrativo; registrar a edição e a base normativa usada. A edição 2025 incorpora alteração legislativa relativa a Pacaraima (RR).','2026-08-15'],
            ['DD000189','DP000171','Alterações Toponímicas Municipais 2025 — planilhas','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/27336-alteracoes-toponimicas-municipais.html','XLS | ODS','HTTP download','navegador web | planilha','sim','não','downloads públicos na página oficial','licença específica não inferida no nível do arquivo','sim','por edição/planilha','A partir da edição 2025 o IBGE disponibiliza XLS e ODS; edições anteriores eram publicadas apenas em XLS. Distinguir alteração de nome de correção de grafia.','2026-08-15'],
            ['DD000190','DP000172','MATOPIBA — tabelas e geosserviços','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/34329-matopiba.html','ODS | XLS | geosserviços','HTTP download | geosserviço','navegador web | Plataforma Geográfica Interativa','sim','não','consulta e downloads públicos','licença específica não inferida no nível do arquivo','sim','por tabela/geosserviço','O recorte territorial disponível mantém a delimitação original até que nova área seja formalmente definida; verificar legislação antes de análises normativas.','2026-08-15'],
            ['DD000191','DP000173','Localidades do Brasil 2022 — vetores e busca','https://www.ibge.gov.br/estatisticas/multidominio/ciencia-tecnologia-e-inovacao/27385-localidades.html?lang=pt-BR','SHP | GPKG | KML | consulta web','HTTP download | aplicação web','navegador web | SIG','sim','não','arquivos nacionais e por UF em SHP/GPKG; KML por município; busca pública de localidades','licença específica não inferida no nível do arquivo','sim','Brasil | UF | município conforme formato','Os arquivos vetoriais e a ferramenta de busca representam localidades e seus atributos; preservar categoria e subordinação político-administrativa da edição 2022.','2026-08-15'],
            ['DD000192','DP000174','Evolução da Divisão Territorial do Brasil 1872–2010 — malhas, tabelas e publicação','https://www.ibge.gov.br/geociencias/organizacao-do-territorio/estrutura-territorial/15771-evolucao-da-divisao-territorial-do-brasil.html','SHP | planilha eletrônica | publicação digital','HTTP download','navegador web | SIG | planilha','sim','não','downloads públicos conforme componente do estudo','licença específica não inferida no nível do arquivo','sim','por ano histórico/componente','As malhas históricas não possuem precisão cartográfica; usar a metodologia e a genealogia municipal para interpretar mudanças entre anos.','2026-08-15']
          ]

          existing_pids = {r['product_id'] for r in ps}
          existing_dids = {r['distribution_id'] for r in ds}
          existing_urls = {r['product_page_url'] for r in ps}
          assert not ({r[0] for r in products} & existing_pids)
          assert not ({r[0] for r in distributions} & existing_dids)
          assert all(r[19] not in existing_urls for r in products)

          def append_rows(path, batch):
              out = io.StringIO(newline='')
              w = csv.writer(out, lineterminator='\n')
              w.writerows(batch)
              with path.open('a', encoding='utf-8', newline='') as f:
                  f.write(out.getvalue())

          append_rows(product_path, products)
          append_rows(dist_path, distributions)
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_product_catalog.py
          python scripts/validate_brazil_scope.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Consolidated read-back
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          def read(p):
              with Path(p).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          src=read('data/data_resources.csv'); ps=read('data/data_products.csv'); ds=read('data/product_distributions.csv')
          sids={r['resource_id'] for r in src}; pids={r['product_id'] for r in ps}; dids={r['distribution_id'] for r in ds}
          assert (len(src),len(ps),len(ds)) == (82,171,189), (len(src),len(ps),len(ds))
          assert len(sids)==len(src) and len(pids)==len(ps) and len(dids)==len(ds)
          assert all(r['resource_id'] in sids for r in ps)
          assert all(r['product_id'] in pids for r in ds)
          for pid in ['DP000170','DP000171','DP000172','DP000173','DP000174']:
              assert pid in pids and sum(d['product_id']==pid for d in ds) == 1
          assert all(next(r for r in ps if r['product_id']==pid)['resource_id']=='DR0070' for pid in ['DP000170','DP000171','DP000172','DP000173','DP000174'])
          print('sources=82 products=171 distributions=189')
          PY
      - name: Commit materialized data and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bootstrap-ibge-structure-territory-batch-2026-08-15.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/bootstrap-ibge-structure-territory-batch-2026-08-15.yml
          git diff --cached --check
          git commit -m 'Expand IBGE structure territory catalog'
          git push origin HEAD:curation/ibge-structure-territory-batch-2026-08-15
