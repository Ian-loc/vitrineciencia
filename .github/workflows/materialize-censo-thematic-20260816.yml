name: Materialize verified Censo 2022 thematic batch

on:
  push:
    branches: ["audit/ibge-censo-thematic-20260816"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-censo-thematic-20260816
          fetch-depth: 0

      - name: Append verified products and distributions
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          products_path = Path('data/data_products.csv')
          dist_path = Path('data/product_distributions.csv')

          products = [
            ['DP000230','DR0086','Alfabetização — Censo Demográfico 2022 — resultados do universo','Alfabetização Censo 2022','Censo 2022 — alfabetização','dataset','Resultados do universo do Censo Demográfico 2022 sobre alfabetização da população, com divulgação para Brasil, Grandes Regiões, Unidades da Federação e Municípios e desagregações por idade, cor ou raça e sexo para pessoas de 15 anos ou mais.','Population geography | Education | Social statistics | Territorial analysis','alfabetização | analfabetismo | educação | idade | cor ou raça | sexo | municípios | Censo 2022 | IBGE','Brasil; Grandes Regiões; Unidades da Federação; Municípios','sim','pessoa agregada por recortes territoriais e demográficos | tabelas SIDRA | mapas/visualizações','município na divulgação territorial; agregações nacionais e regionais disponíveis','Censo Demográfico 2022','snapshot censitário; resultados do universo','por edição censitária','ativo','divulgação de 17/05/2024','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=39980&t=resultados','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=39980&t=resultados','derivado','Resultado censitário agregado, não medida longitudinal de aprendizagem. A comparação com PNAD Contínua exige atenção às diferenças metodológicas explicitadas pelo IBGE; a divulgação inicial focaliza pessoas de 15 anos ou mais e não substitui resultados educacionais da amostra.','2026-08-16'],
            ['DP000231','DR0086','Quilombolas e Indígenas por sexo e idade — Censo Demográfico 2022 — resultados do universo','Quilombolas e Indígenas 2022','Censo 2022 — populações indígena e quilombola','dataset','Resultados do universo do Censo Demográfico 2022 sobre distribuição por sexo e idade das populações indígena e quilombola, segundo recortes territoriais específicos e domicílios com moradores pertencentes a esses grupos.','Population geography | Indigenous studies | Social statistics | Territorial analysis','indígenas | quilombolas | sexo | idade | territórios | domicílios | Censo 2022 | IBGE','Brasil; recortes territoriais específicos para populações indígena e quilombola','sim','pessoa e domicílio agregados por recortes territoriais específicos | tabelas | publicação','recortes censitários e territoriais específicos; não inferir uma única granularidade para todas as tabelas','Censo Demográfico 2022','snapshot censitário; resultados do universo','por edição censitária','ativo','divulgação de 03/05/2024','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=39859&t=resultados','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=39859&t=resultados','derivado','Produto estatístico de 2022 para populações etnicamente diferenciadas. Identidade indígena e quilombola, Terras Indígenas, Territórios Quilombolas e situação do domicílio são dimensões distintas; não transformar recortes estatísticos em limites jurídicos nem extrapolar para dinâmica populacional atual.','2026-08-16'],
            ['DP000232','DR0086','Educação — Censo Demográfico 2022 — resultados preliminares da amostra','Educação Censo 2022','Censo 2022 — educação','dataset','Resultados preliminares expandidos da amostra do Censo Demográfico 2022 sobre frequência escolar, nível de instrução, anos de estudo e outros atributos educacionais investigados no Questionário da Amostra.','Population geography | Education | Social statistics | Territorial analysis','educação | frequência escolar | nível de instrução | anos de estudo | amostra | Censo 2022 | IBGE','Brasil; Grandes Regiões; Unidades da Federação; Municípios e outros recortes conforme tabela','sim','pessoa em domicílio amostral expandida para domínios de divulgação | tabelas e publicação','domínios de divulgação da amostra; não equivale a registro individual ou setor censitário do universo','Censo Demográfico 2022','snapshot censitário amostral com expansão','por edição censitária e revisões da amostra','ativo','resultados preliminares da amostra; Nota metodológica n. 01/2025 de 26/02/2025','complete','https://www.ibge.gov.br/estatisticas/sociais/educacao/22827-censo-demografico-2022.html?edicao=40692','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html','derivado','Resultados baseados no Questionário da Amostra e em fatores de expansão; não devem ser tratados como contagens integrais do universo nem comparados a pesquisas domiciliares sem considerar desenho, conceitos, domínios e revisões.','2026-08-16'],
            ['DP000233','DR0086','Trabalho e Rendimento — Censo Demográfico 2022 — resultados preliminares da amostra','Trabalho e Rendimento Censo 2022','Censo 2022 — trabalho e rendimento','dataset','Resultados preliminares da amostra do Censo Demográfico 2022 sobre ocupação, posição na ocupação, atividade econômica, horas de trabalho, procura de trabalho e rendimentos de diferentes fontes, com desagregações sociodemográficas.','Population geography | Labour economics | Social statistics | Territorial analysis','trabalho | rendimento | ocupação | atividade econômica | desigualdade | amostra | Censo 2022 | IBGE','Brasil; Grandes Regiões; Unidades da Federação; Municípios e outros recortes compostos por municípios','sim','pessoa e domicílio em amostra expandida | tabelas SIDRA | Panorama Censo | publicação','domínios de divulgação da amostra; município em tabelas selecionadas','julho de 2022 e demais períodos de referência definidos pelos quesitos censitários','snapshot censitário amostral com expansão','por edição censitária e revisões da amostra','ativo','resultados preliminares da amostra divulgados em 09/10/2025','complete','https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=44663','https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=44663','derivado','Resultados da amostra requerem fatores de expansão e desenho amostral. O IBGE documenta limitações para comparação com a PNAD Contínua; resultados de 2022 não representam mercado de trabalho corrente nem séries mensais.','2026-08-16'],
            ['DP000234','DR0086','Etnias e Línguas Indígenas — Censo Demográfico 2022 — resultados do universo — 2ª edição','Etnias e Línguas Indígenas 2022','Censo 2022 — etnias e línguas indígenas','dataset','Resultados do universo do Censo Demográfico 2022 sobre diversidade étnica e linguística indígena e características sociodemográficas associadas, incluindo tabelas por etnia, língua, município, Unidade da Federação e Terras Indígenas.','Population geography | Indigenous studies | Linguistic diversity | Social statistics','etnias indígenas | línguas indígenas | povos indígenas | Terras Indígenas | saneamento | alfabetização | Censo 2022 | IBGE','Brasil; Unidades da Federação; Municípios; Terras Indígenas e recortes associados','sim','pessoa e domicílio agregados por etnia, língua e recortes territoriais | tabelas SIDRA | cartogramas | publicação','heterogênea conforme tabela; inclui município, UF e Terra Indígena','Censo Demográfico 2022; tabelas comparativas selecionadas 2010/2022','snapshot censitário; algumas comparações intercensitárias','por edição censitária e correções/reedições','ativo','2ª edição divulgada em 18/06/2026; atualiza a publicação de 24/10/2025','complete','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico.html?edicao=29183&t=resultados','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico.html?edicao=29183&t=resultados','derivado','Preservar a 2ª edição de 2026 e as correções oficiais. Etnia, povo ou grupo, língua falada/utilizada no domicílio, localização e Terra Indígena são dimensões diferentes; tabelas não equivalem a limites jurídicos nem a inventários linguísticos independentes do desenho censitário.','2026-08-16'],
          ]

          distributions = [
            ['DD000251','DP000230','Alfabetização Censo 2022 — SIDRA, tabelas, Panorama e publicação','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=39980&t=resultados','SIDRA | XLSX | ODS | PDF | visualização web','HTTPS web | SIDRA','navegador web | SIDRA | Panorama Censo 2022','sim','não','consulta pública; observar notas metodológicas e revisões do produto','licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','sim','por tabela, variável, recorte territorial e desagregação disponível','Resultados agregados do universo; não confundir indicador de alfabetização censitária com desempenho escolar ou medida longitudinal individual.','2026-08-16'],
            ['DD000252','DP000231','Quilombolas e Indígenas por sexo e idade — tabelas e publicação','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico-2022.html?edicao=39859&t=resultados','SIDRA | XLSX | ODS | PDF | visualização web','HTTPS web | SIDRA','navegador web | SIDRA | Panorama Censo 2022','sim','não','consulta pública; preservar definições censitárias e recortes específicos','licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','sim','por tabela, população, sexo, idade e recorte territorial disponível','Os recortes indígenas e quilombolas possuem definições e bases territoriais próprias; não convertê-los em equivalência jurídica ou espacial automática.','2026-08-16'],
            ['DD000253','DP000232','Educação Censo 2022 — resultados preliminares da amostra','https://www.ibge.gov.br/estatisticas/sociais/educacao/22827-censo-demografico-2022.html?edicao=40692','SIDRA | XLSX | ODS | PDF | visualização web','HTTPS web | SIDRA','navegador web | SIDRA | Panorama Censo 2022','sim','não','consulta pública; análises devem respeitar expansão e desenho amostral','licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','sim','por tabela, variável e domínio de divulgação da amostra','Resultados preliminares da amostra; não tratar como contagem integral do universo e não ignorar pesos, domínios e revisões.','2026-08-16'],
            ['DD000254','DP000233','Trabalho e Rendimento Censo 2022 — SIDRA, Panorama e publicação','https://www.ibge.gov.br/estatisticas/Sociais/populacao/22827-censo-demografico-2022.html?edicao=44663','SIDRA | XLSX | ODS | PDF | visualização web','HTTPS web | SIDRA','navegador web | SIDRA | Panorama Censo 2022','sim','não','consulta pública; análises devem respeitar expansão e desenho amostral','licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','sim','por tabela, variável, grupo sociodemográfico e domínio geográfico disponível','Os resultados são preliminares da amostra e o IBGE publica nota específica sobre limitações de comparação com a PNAD Contínua.','2026-08-16'],
            ['DD000255','DP000234','Etnias e Línguas Indígenas Censo 2022 — 2ª edição — tabelas e publicação','https://www.ibge.gov.br/estatisticas/sociais/populacao/22827-censo-demografico.html?edicao=29183&t=resultados','SIDRA | XLSX | ODS | PDF | JPG | visualização web','HTTPS web | SIDRA','navegador web | SIDRA | Panorama Censo 2022 | PGI','sim','não','consulta pública; usar a 2ª edição e observar correções/erratas oficiais','licença específica dos arquivos não localizada; preservar atribuição IBGE e termos do portal','sim','por tabela, etnia, língua, município, UF, Terra Indígena e outros recortes disponíveis','Segunda edição materialmente divulgada em 18/06/2026; preservar reedição e erratas e não tratar categorias censitárias como inventário linguístico independente.','2026-08-16'],
          ]

          with products_path.open(encoding='utf-8', newline='') as f:
              existing_products = list(csv.DictReader(f))
          pids = {r['product_id'] for r in existing_products}
          pnames = {r['product_name'].casefold() for r in existing_products}
          for r in products:
              assert r[0] not in pids, f'duplicate product id {r[0]}'
              assert r[2].casefold() not in pnames, f'duplicate product name {r[2]}'
              assert r[1] == 'DR0086'
              assert len(r) == 24, (r[0], len(r))

          with dist_path.open(encoding='utf-8', newline='') as f:
              existing_dists = list(csv.DictReader(f))
          dids = {r['distribution_id'] for r in existing_dists}
          for r in distributions:
              assert r[0] not in dids, f'duplicate distribution id {r[0]}'
              assert r[1] in {x[0] for x in products}
              assert len(r) == 15, (r[0], len(r))

          with products_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerows(products)
          with dist_path.open('a', encoding='utf-8', newline='') as f:
              w = csv.writer(f, lineterminator='\n')
              w.writerows(distributions)
          PY

      - name: Validate and rebuild derived artifacts
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          for path in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(path, encoding='utf-8', newline='') as f:
                  rows=list(csv.DictReader(f))
              print(path, len(rows), rows[-1][next(iter(rows[-1]))])
          PY

      - name: Commit materialized batch and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/materialize-censo-thematic-20260816.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          git commit -m "Expand verified Censo 2022 thematic catalog"
          git push origin HEAD:audit/ibge-censo-thematic-20260816
