name: Materializar lote 7 PANORAMA UrbVerde OICS
on:
  push:
    branches: [data/panorama-urbverde-oics-batch-7]
    paths:
      - 'scripts/materialize_batch7.py'
      - '.github/workflows/materialize-batch7.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data/panorama-urbverde-oics-batch-7
      - name: Materializar e validar
        run: |
          python scripts/materialize_batch7.py
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py
          python scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Expandir PANORAMA UrbVerde e OICS — lote 7'
            git push origin HEAD:data/panorama-urbverde-oics-batch-7
          fi
