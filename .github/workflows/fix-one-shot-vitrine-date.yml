name: Fix one-shot Vitrine audit verification date

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fix-one-shot-vitrine-date.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align verification date with runner UTC and retrigger audit
        run: |
          sed -i 's/2026-08-17/2026-08-16/g' .github/workflows/one-shot-vitrine-audit-20260817.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-one-shot-vitrine-date.yml
          git add .github/workflows/one-shot-vitrine-audit-20260817.yml
          git commit -m "Align Vitrine audit verification date"
          git push origin HEAD:main
