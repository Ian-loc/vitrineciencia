name: Recover CPTEC batch 2026-08-18
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: write
jobs:
  recover:
    if: startsWith(github.head_ref, 'tmp/cptec-dispatch-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run verified append block
        run: |
          python - <<'PY'
          from pathlib import Path
          lines=Path('.github/workflows/curate_cptec_batch_20260818.yml').read_text(encoding='utf-8').splitlines()
          start=next(i for i,l in enumerate(lines) if '- name: Append verified CPTEC products and distributions' in l)
          run_i=next(i for i in range(start+1,len(lines)) if lines[i].strip()=='run: |')
          body=[]
          for l in lines[run_i+1:]:
              if l.startswith('      - name:'):
                  break
              body.append(l[10:] if l.startswith('          ') else l)
          Path('/tmp/append_cptec.sh').write_text('\n'.join(body)+'\n',encoding='utf-8')
          PY
          bash /tmp/append_cptec.sh
      - name: Validate and read back
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          R=list(csv.DictReader(open('data/data_resources.csv',encoding='utf-8')))
          P=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8')))
          D=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')))
          assert len({p['product_id'] for p in P})==len(P)
          assert len({d['distribution_id'] for d in D})==len(D)
          assert set(f'DP{i:06d}' for i in range(551,557)) <= {p['product_id'] for p in P}
          assert set(f'DD{i:06d}' for i in range(576,582)) <= {d['distribution_id'] for d in D}
          rs={r['resource_id'] for r in R}; ps={p['product_id'] for p in P}
          assert all(p['resource_id'] in rs for p in P)
          assert all(d['product_id'] in ps for d in D)
          print(f'counts: {len(R)} sources, {len(P)} products, {len(D)} distributions')
          PY
      - name: Commit canonical changes
        run: |
          git config user.name 'vitrine-ciencia-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json
          git diff --cached --quiet && exit 0
          git commit -m 'Expand verified CPTEC monitoring catalog'
          git push origin HEAD:main
