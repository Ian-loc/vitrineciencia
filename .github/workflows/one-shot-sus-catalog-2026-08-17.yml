name: One-shot verified SUS catalog expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-shot-sus-catalog-2026-08-17.yml']
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified SUS source products and distributions
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, pathlib
          root=pathlib.Path('.')
          rpath=root/'data/data_resources.csv'; ppath=root/'data/data_products.csv'; dpath=root/'data/product_distributions.csv'; bpath=root/'data/brazil_scope_priorities.json'
          def ids(path,key):
              with path.open(encoding='utf-8',newline='') as f: return {r[key] for r in csv.DictReader(f)}
          rid='DR0113'
          if rid in ids(rpath,'resource_id'): raise SystemExit('DR0113 already exists')
          pids=[f'DP{i:06d}' for i in range(462,477)]
          dids=[f'DD{i:06d}' for i in range(487,502)]
          if set(pids)&ids(ppath,'product_id'): raise SystemExit('product ID collision')
          if set(dids)&ids(dpath,'distribution_id'): raise SystemExit('distribution ID collision')
          def append_dicts(path, rows):
              with path.open(encoding='utf-8',newline='') as f: fields=next(csv.reader(f))
              with path.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,extrasaction='raise',lineterminator='\n')
                  for row in rows: w.writerow({k:row.get(k,'') for k in fields})
          source={
            'resource_id':rid,'resource_name':'Portal de Dados Abertos do SUS — Ministério da Saúde','acronym':'Dados Abertos SUS','official_identity':'Portal oficial de dados abertos do Sistema Único de Saúde e do Ministério da Saúde',
            'description':'Catálogo oficial de conjuntos e recursos de saúde pública, vigilância epidemiológica, assistência e saúde ambiental, com downloads estruturados, dicionários e APIs quando disponíveis.',
            'homepage_url':'https://dadosabertos.saude.gov.br/','data_access_url':'https://dadosabertos.saude.gov.br/dataset/',
            'research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados',
            'keywords':'SUS | saúde pública | vigilância epidemiológica | SIM | SINASC | SINAN | CNES | SISAGUA | dados abertos',
            'data_product_types':'datasets | séries administrativas | vigilância | cadastros | APIs | dicionários de dados','data_formats':'CSV | JSON | XML | API | PDF | ODT','visualization_types':'catálogo web | documentação de API',
            'geographic_coverage':'Brasil; detalhamento territorial depende do sistema e do conjunto','covers_brazil':'sim','spatial_resolution':'registro individual anonimizado, estabelecimento, sistema de abastecimento ou agregação territorial conforme produto',
            'temporal_coverage':'varia por sistema; inclui séries históricas e atualizações correntes','temporal_resolution':'evento | mensal | anual conforme produto','data_sources':'sistemas nacionais de informação em saúde | registros administrativos | notificações | vigilância | gestores locais',
            'free_download':'sim','access_conditions':'acesso público aos recursos de disseminação; observar anonimização, LGPD, dicionários, versões e limitações de cada sistema','programmatic_access':'sim','access_protocols':'HTTPS | API | download HTTP/HTTPS','authentication_required':'não',
            'access_documentation_url':'https://dadosabertos.saude.gov.br/','license':'conteúdo do portal sob CC Atribuição-SemDerivações 3.0; verificar termos no nível do conjunto e do arquivo','institutional_status':'público','owner_or_manager':'Ministério da Saúde — Brasil',
            'academic_uses':'Epidemiologia, saúde ambiental, demografia, mortalidade, natalidade, vigilância de agravos, infraestrutura de saúde, água para consumo humano e políticas públicas.',
            'limitations':'Cobertura, completude, atraso, definições, versões, população sob vigilância e granularidade variam por sistema. Registros administrativos e notificações não equivalem a censos epidemiológicos perfeitos; análises devem preservar dicionários, competência, versão e regras de sigilo.',
            'academic_evidence_type':'documentação oficial','academic_evidence_url':'https://dadosabertos.saude.gov.br/','academic_evidence_note':'O portal oficial documenta conjuntos, recursos, formatos, atualização, dicionários e APIs de sistemas nacionais de saúde e vigilância.','verification_url':'https://dadosabertos.saude.gov.br/dataset/','last_verified':'2026-08-17'}
          append_dicts(rpath,[source])
          A='Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados'
          E='Ciências Ambientais e Ecologia | Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados'
          products=[
            ('DP000462','Sistema de Informação sobre Mortalidade — SIM','SIM','Mortalidade — Ministério da Saúde','dataset_series','Bancos de disseminação de óbitos do SIM, com causas, características socioeconômicas e local de residência/ocorrência.','mortalidade | óbitos | causas de morte | SIM','Brasil','registro de óbito de disseminação','1979 em diante; anos recentes podem ter prévias antes da consolidação','anual; atualizações de prévias/finais conforme publicação','ativo','portal atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/sim','https://dadosabertos.saude.gov.br/dataset/sim','primário','Registro administrativo de mortalidade; cobertura e oportunidade variam no espaço e no tempo. Preservar ano, condição de prévia/final, causa e regras de disseminação.'),
            ('DP000463','Sistema de Informação sobre Nascidos Vivos — Sinasc','SINASC','Nascidos vivos — Ministério da Saúde','dataset_series','Registros de nascidos vivos com características maternas, gestação, parto, recém-nascido e residência/ocorrência.','nascidos vivos | natalidade | parto | pré-natal | SINASC','Brasil','registro de nascido vivo de disseminação','desde 1990, com implantação gradual; anos recentes podem ter prévias','anual; atualizações conforme publicação','ativo','portal atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/sistema-de-informacao-sobre-nascidos-vivos-sinasc','https://dadosabertos.saude.gov.br/dataset/sistema-de-informacao-sobre-nascidos-vivos-sinasc','primário','Registro administrativo; implantação e cobertura variaram historicamente. Não confundir com Estatísticas do Registro Civil/IBGE nem ignorar status preliminar de anos recentes.'),
            ('DP000464','Cadastro Nacional de Estabelecimentos de Saúde — CNES','CNES','Infraestrutura e estabelecimentos de saúde','data_service','Relação nacional de estabelecimentos de saúde cadastrados no CNES, com recursos estruturados e API.','CNES | estabelecimentos de saúde | infraestrutura | serviços de saúde','Brasil','estabelecimento de saúde cadastrado','cadastro corrente; recursos atualizados em junho/2026','diária conforme página oficial','ativo','portal atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/cnes-cadastro-nacional-de-estabelecimentos-de-saude','https://dadosabertos.saude.gov.br/dataset/cnes-cadastro-nacional-de-estabelecimentos-de-saude','primário','Cadastro administrativo: presença no CNES não garante funcionamento, capacidade efetiva ou qualidade assistencial em qualquer data. Preservar competência/extração.'),
            ('DP000465','Hospitais e Leitos — CNES','Hospitais e Leitos','Infraestrutura hospitalar e leitos','dataset_series','Dados de estabelecimentos hospitalares, leitos gerais e complementares e informações de contato, por competências mensais e anuais.','hospitais | leitos | CNES | infraestrutura de saúde','Brasil','estabelecimento hospitalar e leito cadastrado','série por competência; recursos 2026 disponíveis','mensal','ativo','atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/hospitais-e-leitos','https://dadosabertos.saude.gov.br/dataset/hospitais-e-leitos','primário','Dados enviados por gestores locais e sujeitos a limitações de captura. Leito cadastrado não equivale automaticamente a leito operacional/disponível no instante de análise.'),
            ('DP000466','Sinan — Dengue','SINAN Dengue','Vigilância epidemiológica — arboviroses','dataset_series','Notificações e investigações de dengue disseminadas pelo Sinan Online.','SINAN | dengue | arboviroses | notificação compulsória','Brasil','notificação/investigação epidemiológica','série por ano; atualização corrente até 2026 conforme portal','mensal conforme recursos','ativo','atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/arboviroses-dengue','https://portalsinan.saude.gov.br/','primário','Notificação não equivale a incidência verdadeira: há subnotificação, duplicidades/correções, mudanças de definição e atrasos. Preservar classificação e data de atualização.'),
            ('DP000467','Sinan — Febre de Chikungunya','SINAN Chikungunya','Vigilância epidemiológica — arboviroses','dataset_series','Notificações e investigações de febre de chikungunya disseminadas pelo Sinan Online.','SINAN | chikungunya | arboviroses | notificação compulsória','Brasil','notificação/investigação epidemiológica','série por ano; atualização corrente até 2026 conforme portal','mensal conforme recursos','ativo','atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/arboviroses-febre-de-chikungunya','https://portalsinan.saude.gov.br/','primário','Notificação não equivale a incidência verdadeira; cobertura, investigação, oportunidade e classificação podem mudar. Não combinar automaticamente com dengue ou zika.'),
            ('DP000468','Sinan — Vírus Zika','SINAN Zika','Vigilância epidemiológica — arboviroses','dataset_series','Notificações e investigações de vírus Zika, disseminadas no portal como série própria.','SINAN | zika | arboviroses | notificação compulsória','Brasil','notificação/investigação epidemiológica','2016–2026 na série corrente documentada','mensal conforme recursos','ativo','atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/arboviroses-zika-virus','https://portalsinan.saude.gov.br/zika','primário','Série de notificações; não é medida direta de circulação viral populacional. Alterações de vigilância, diagnóstico e completude afetam comparações temporais.'),
            ('DP000469','e-SUS Sinan — Mpox','e-SUS Sinan Mpox','Vigilância epidemiológica — e-SUS Sinan','dataset_series','Notificações de mpox no e-SUS Sinan, sistema em modernização destinado a substituir progressivamente versões anteriores do Sinan.','e-SUS Sinan | mpox | monkeypox | vigilância epidemiológica','Brasil','notificação/investigação epidemiológica','2022–2026 nos recursos atuais','mensal','ativo','atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/mpox','https://dadosabertos.saude.gov.br/dataset/mpox','primário','Sistema em transição tecnológica; notificações não equivalem a casos confirmados sem observar classificação e dicionário. Comparações com sistemas legados exigem cautela.'),
            ('DP000470','SISAGUA — Pontos de captação','SISAGUA Captação','SISAGUA — cadastro de abastecimento','dataset','Pontos de captação de água para consumo humano registrados em sistemas e soluções alternativas cadastrados no Sisagua.','SISAGUA | captação de água | abastecimento | água potável','Brasil','ponto de captação cadastrado','cadastro corrente; atualizado em junho/2026','conforme atualização cadastral; portal atualizado mensalmente','ativo','atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-pontos-de-captacao','https://dadosabertos.saude.gov.br/dataset/sisagua-pontos-de-captacao','primário','Cadastro administrativo; ponto registrado não é inventário hidrográfico nem garante captação ativa, vazão ou qualidade da água. Cobertura depende do cadastro no Sisagua.'),
            ('DP000471','SISAGUA — Tratamento de água','SISAGUA Tratamento','SISAGUA — cadastro de abastecimento','dataset','Informações anuais declaradas sobre tratamento de água em sistemas e soluções alternativas coletivas de abastecimento.','SISAGUA | tratamento de água | abastecimento | potabilidade','Brasil','sistema ou solução de abastecimento cadastrada','cadastro corrente; recursos atualizados em maio/2026','anual por registro; portal atualizado mensalmente','ativo','atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-tratamento-de-agua','https://dadosabertos.saude.gov.br/dataset/sisagua-tratamento-de-agua','primário','Informação declarada pelo prestador; existência de tratamento não comprova conformidade contínua com padrões de potabilidade nem qualidade em todos os pontos da rede.'),
            ('DP000472','SISAGUA — População abastecida','SISAGUA População','SISAGUA — cadastro de abastecimento','dataset','Dados anuais sobre população atendida por SAA, SAC e SAI cadastrados no Sisagua.','SISAGUA | população abastecida | SAA | SAC | SAI | abastecimento','Brasil','forma de abastecimento e população informada','cadastro anual; recurso atualizado em maio/2026','anual','ativo','atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-populacao-abastecida','https://dadosabertos.saude.gov.br/dataset/sisagua-populacao-abastecida','primário','População informada no cadastro não é automaticamente população censitária nem cobertura universal; evitar soma sem verificar sobreposição entre formas de abastecimento.'),
            ('DP000473','SISAGUA — Controle mensal — Parâmetros básicos','SISAGUA Controle Básico','SISAGUA — controle da qualidade da água','dataset_series','Análises rotineiras de baixa complexidade realizadas pelos responsáveis por SAA e SAC e informadas mensalmente ao Sisagua.','SISAGUA | qualidade da água | controle | coliformes | cloro | turbidez','Brasil','análise/amostra informada pelo prestador','série anual disponível por arquivos; 2026 corrente','mensal','ativo','atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-parametros-basicos','https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-parametros-basicos','primário','Dados de controle produzidos pelo responsável pelo abastecimento; não são a mesma coisa que vigilância independente do setor saúde. Cobertura depende do plano e do envio de resultados.'),
            ('DP000474','SISAGUA — Vigilância — Parâmetros básicos','SISAGUA Vigilância Básica','SISAGUA — vigilância da qualidade da água','dataset_series','Análises de parâmetros básicos de qualidade da água realizadas rotineiramente pelo setor saúde.','SISAGUA | qualidade da água | vigilância | E. coli | cloro | turbidez','Brasil','análise/amostra de vigilância','2014 em diante nos recursos atuais; atualização em 2026','conforme rotina de vigilância; arquivos anuais','ativo','atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-parametros-basicos','https://dadosabertos.saude.gov.br/dataset/sisagua-vigilancia-parametros-basicos','primário','Amostragem de vigilância não é censo de todos os pontos de abastecimento. Frequência, cobertura e desenho podem variar territorialmente; preservar parâmetro, data e local.'),
            ('DP000475','SISAGUA — Controle semestral','SISAGUA Controle Semestral','SISAGUA — controle da qualidade da água','dataset_series','Análises de maior complexidade realizadas pelos responsáveis por SAA e SAC em frequência superior à mensal e informadas ao Sisagua.','SISAGUA | qualidade da água | controle semestral | parâmetros químicos','Brasil','análise/amostra informada pelo prestador','série histórica por ano; 2026 corrente','semestral ou frequência superior à mensal conforme parâmetro','ativo','atualizado em maio/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-controle-semestral','https://dadosabertos.saude.gov.br/dataset/sisagua-controle-semestral','primário','Resultados dependem do cumprimento de planos de amostragem e do envio pelos prestadores. Não inferir qualidade em períodos/locais não amostrados.'),
            ('DP000476','SISAGUA — Controle mensal — Demais parâmetros','SISAGUA Controle Demais','SISAGUA — controle da qualidade da água','dataset','Análises mensais ou de frequência inferior de média/alta complexidade informadas pelos responsáveis por SAA e SAC.','SISAGUA | qualidade da água | controle | parâmetros químicos | potabilidade','Brasil','análise/amostra informada pelo prestador','cadastro corrente; atualizado em junho/2026','mensal ou inferior conforme parâmetro','ativo','atualizado em junho/2026','https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-demais-parametros','https://dadosabertos.saude.gov.br/dataset/sisagua-controle-mensal-demais-parametros','primário','Conjunto de controle do prestador e não vigilância independente. Parâmetros, frequência e cobertura variam; não transformar ausência de registro em conformidade.'),
          ]
          rows=[]
          for p in products:
              pid,name,acr,fam,kind,desc,kw,cov,support,tcover,tres,status,ver,url,murl,pd,lim=p
              rows.append({'product_id':pid,'resource_id':rid,'product_name':name,'product_acronym':acr,'product_family':fam,'product_kind':kind,'product_description':desc,'research_areas':E if ('SISAGUA' in name) else A,'keywords':kw,'geographic_coverage':cov,'covers_brazil':'sim','spatial_support':support,'spatial_resolution':'registro/ponto ou agregação conforme variável e recurso','temporal_coverage':tcover,'temporal_resolution':tres,'update_frequency':tres,'product_status':status,'version_or_collection':ver,'enumeration_scope':'complete','product_page_url':url,'methodology_url':murl,'primary_or_derived':pd,'limitations':lim,'last_verified':'2026-08-17'})
          append_dicts(ppath,rows)
          dist=[]
          for i,row in enumerate(rows,487):
              fmt='CSV | JSON | XML | API'
              if row['product_id'] in {'DP000466','DP000467','DP000468'}: fmt='CSV | JSON | XML'
              dist.append({'distribution_id':f'DD{i:06d}','product_id':row['product_id'],'distribution_name':row['product_acronym']+' — portal oficial e recursos estruturados','access_url':row['product_page_url'],'format':fmt,'access_protocol':'HTTPS | API/download conforme recurso','access_tool':'Portal de Dados Abertos do SUS','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; preservar dicionário, versão, competência e regras de anonimização/sigilo do conjunto','license':'conteúdo do portal CC BY-ND 3.0; verificar termos específicos do arquivo/recurso','provider_attribution_required':'sim','subset_support':'API quando documentada; arquivos por ano/competência conforme conjunto','notes':'Distribuição aponta ao conjunto oficial para preservar a enumeração atual de arquivos, APIs, dicionários e versões; não inferir que todos os formatos estejam disponíveis em todos os anos.','last_verified':'2026-08-17'})
          append_dicts(dpath,dist)
          data=json.loads(bpath.read_text(encoding='utf-8'))
          p0=next(t for t in data['tiers'] if t['priority_tier']=='P0')['resource_ids']
          if rid not in p0: p0.append(rid)
          data['reviewed_at']='2026-08-17'
          bpath.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('appended',len(rows),'products',len(dist),'distributions')
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          from pathlib import Path
          def rows(p):
            with Path(p).open(encoding='utf-8',newline='') as f: return list(csv.DictReader(f))
          r=rows('data/data_resources.csv'); p=rows('data/data_products.csv'); d=rows('data/product_distributions.csv')
          assert len({x['resource_id'] for x in r})==len(r)
          assert len({x['product_id'] for x in p})==len(p)
          assert len({x['distribution_id'] for x in d})==len(d)
          R={x['resource_id'] for x in r}; P={x['product_id'] for x in p}
          assert all(x['resource_id'] in R for x in p)
          assert all(x['product_id'] in P for x in d)
          assert all(any(y['product_id']==x for y in d) for x in [f'DP{i:06d}' for i in range(462,477)])
          print('readback',len(r),len(p),len(d))
          PY
      - name: Commit materialized catalog and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-sus-catalog-2026-08-17.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json data/data_quality_report.json data/link_role_audit.json .github/workflows/one-shot-sus-catalog-2026-08-17.yml
          git commit -m 'Expand verified SUS health and water-quality catalog'
          git push origin HEAD:main
