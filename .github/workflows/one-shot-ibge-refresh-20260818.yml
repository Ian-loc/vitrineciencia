name: one-shot IBGE refresh 2026-08-18

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ibge-refresh-20260818.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh verified IBGE references
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit_line(path, row_id, replacements):
              p = Path(path)
              lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
              found = False
              for i, line in enumerate(lines):
                  if line.startswith(row_id + ','):
                      found = True
                      new = line
                      for old, newv in replacements:
                          if old not in new:
                              raise SystemExit(f'{row_id}: missing expected text: {old}')
                          new = new.replace(old, newv)
                      lines[i] = new
                      break
              if not found:
                  raise SystemExit(f'{row_id}: row not found')
              p.write_text(''.join(lines), encoding='utf-8', newline='')

          P='data/data_products.csv'
          D='data/product_distributions.csv'

          edit_line(P,'DP000213',[
            ('Levantamento Sistemático da Produção Agrícola — LSPA — junho de 2026','Levantamento Sistemático da Produção Agrícola — LSPA — julho de 2026'),
            ('LSPA 06/2026','LSPA 07/2026'),
            ('edição materialmente verificada junho de 2026; série mensal','edição materialmente verificada julho de 2026; série mensal'),
            ('junho de 2026 — última edição materialmente confirmada na página oficial consultada','julho de 2026 — divulgação oficial em 13/08/2026'),
            ('Em 16/08/2026, o calendário oficial indicava 13/08/2026 para julho/2026, mas a página de resultados ainda materializava junho/2026; por isso julho não foi promovido sem evidência de publicação efetiva.','O calendário oficial conjuntural do IBGE registra a divulgação de julho/2026 em 13/08/2026. As estimativas seguem sujeitas a revisão mensal e não equivalem à PAM consolidada.'),
            ('2026-08-16\n','2026-08-18\n')
          ])
          edit_line(D,'DD000234',[
            ('LSPA — edição junho de 2026 e série oficial','LSPA — edição julho de 2026 e série oficial'),
            ('Em 16/08/2026 a página oficial consultada ainda mostrava junho/2026 como edição materializada; o calendário isolado não foi usado para inferir julho/2026 como disponível.','O calendário oficial conjuntural do IBGE registra julho/2026 como divulgado em 13/08/2026; preservar a natureza revisável das estimativas mensais.'),
            ('2026-08-16\n','2026-08-18\n')
          ])

          for pid, oldm, newm in [
            ('DP000311','maio de 2026','junho de 2026'),
            ('DP000312','maio de 2026','junho de 2026'),
            ('DP000313','junho de 2026','julho de 2026'),
            ('DP000314','junho de 2026','julho de 2026'),
            ('DP000315','junho de 2026','julho de 2026'),
            ('DP000317','maio de 2026','junho de 2026'),
            ('DP000318','junho de 2026','julho de 2026'),
          ]:
              edit_line(P,pid,[(oldm,newm),('2026-08-16\n','2026-08-18\n') if pid in ('DP000311','DP000312') else ('2026-08-17\n','2026-08-18\n')])

          edit_line(P,'DP000311',[
            ('A divulgação de junho/2026 aparecia apenas como prevista na página auditada.','O calendário oficial conjuntural do IBGE registra junho/2026 como divulgado em 12/08/2026.')
          ])
          edit_line(P,'DP000312',[
            ('edição materialmente verificada: junho de 2026','edição materialmente verificada: junho de 2026'),
          ])

          dist_updates={
            'DD000332':[('maio/2026','junho/2026'),('junho/2026 constava como próxima divulgação e não foi promovido sem evidência material na página.','junho/2026 consta no calendário oficial como divulgado em 12/08/2026.'),('2026-08-16\n','2026-08-18\n')],
            'DD000333':[('maio/2026','junho/2026'),('2026-08-16\n','2026-08-18\n')],
            'DD000334':[('Junho de 2026','Julho de 2026'),('2026-08-17\n','2026-08-18\n')],
            'DD000335':[('Junho de 2026','Julho de 2026'),('2026-08-17\n','2026-08-18\n')],
            'DD000336':[('junho de 2026','julho de 2026'),('2026-08-17\n','2026-08-18\n')],
            'DD000338':[('Maio de 2026','Junho de 2026'),('2026-08-17\n','2026-08-18\n')],
            'DD000339':[('Junho de 2026','Julho de 2026'),('2026-08-17\n','2026-08-18\n')],
          }
          for did,repls in dist_updates.items(): edit_line(D,did,repls)
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Read-back targeted rows
        run: |
          grep -E '^DP000213,|^DP000311,|^DP000312,|^DP000313,|^DP000314,|^DP000315,|^DP000317,|^DP000318,' data/data_products.csv
          grep -E '^DD000234,|^DD000332,|^DD000333,|^DD000334,|^DD000335,|^DD000336,|^DD000338,|^DD000339,' data/product_distributions.csv
      - name: Commit validated refresh and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-ibge-refresh-20260818.yml
          git add data/data_products.csv data/data_products.json data/product_distributions.csv data/link_role_audit.json data/data_quality_report.json 2>/dev/null || true
          git add -u
          git commit -m 'Refresh verified IBGE conjunctural references'
          git push origin HEAD:main
