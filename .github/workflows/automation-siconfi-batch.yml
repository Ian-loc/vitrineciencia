name: Automation materialize verified Siconfi batch

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/automation-siconfi-batch.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified Siconfi source, products and distributions
        run: |
          python3 - <<'PY'
          import csv, json, re
          from pathlib import Path

          verified = "2026-08-19"
          root = Path('.')
          source_path = root/'data/data_resources.csv'
          product_path = root/'data/data_products.csv'
          dist_path = root/'data/product_distributions.csv'
          priority_path = root/'data/brazil_scope_priorities.json'

          def rows(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          sources = rows(source_path)
          products_old = rows(product_path)
          dists_old = rows(dist_path)
          if any('SICONFI' in (r['resource_name']+' '+r['acronym']).upper() for r in sources):
              raise SystemExit('Siconfi source already catalogued; aborting to avoid duplicate')

          def next_id(existing, field, prefix, width):
              nums=[int(re.sub(r'\D','',r[field])) for r in existing]
              return max(nums)+1

          rid = f"DR{next_id(sources,'resource_id','DR',4):04d}"
          p0 = next_id(products_old,'product_id','DP',6)
          d0 = next_id(dists_old,'distribution_id','DD',6)

          source = [
            rid,
            "Sistema de Informações Contábeis e Fiscais do Setor Público Brasileiro — Siconfi / Tesouro Nacional",
            "Siconfi",
            "Secretaria do Tesouro Nacional — Sistema de Informações Contábeis e Fiscais do Setor Público Brasileiro",
            "Fonte institucional brasileira para dados contábeis e fiscais da União, estados, Distrito Federal e municípios, incluindo declarações fiscais, contas anuais e a Matriz de Saldos Contábeis, com consultas públicas e API de dados abertos.",
            "https://siconfi.tesouro.gov.br/siconfi/index.jsf",
            "https://www.tesourotransparente.gov.br/consultas/consultas-siconfi",
            "Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados",
            "finanças públicas | contabilidade pública | Siconfi | estados | municípios | LRF | RGF | RREO | DCA | MSC",
            "dados contábeis e fiscais | séries | demonstrativos | API | painéis | consultas",
            "JSON | API | PDF | XBRL | consulta web; varia conforme produto",
            "tabelas | consultas | painéis | mapas temáticos",
            "Brasil — União, estados, Distrito Federal e municípios conforme declaração e produto",
            "sim",
            "ente federativo | poder/órgão | conta contábil | demonstrativo; varia conforme produto",
            "séries históricas e dados correntes; início varia por demonstrativo e ente",
            "mensal | bimestral | quadrimestral | semestral | anual conforme produto",
            "declarações homologadas/retificadas pelos entes | PCASP | LRF | sistemas contábeis e fiscais dos entes",
            "sim",
            "acesso público; API sem identificação do usuário, sujeita às orientações de uso e paginação; preservar homologações, retificações e cobertura por ente/período",
            "sim",
            "HTTPS | REST API | JSON | XBRL | consulta web",
            "não",
            "https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-api-de-dados-abertos",
            "Open Data Commons Open Database License (ODbL) nos conjuntos CKAN auditados; verificar o recurso específico",
            "público",
            "Secretaria do Tesouro Nacional — Ministério da Fazenda / Governo Federal do Brasil",
            "Federalismo fiscal, orçamento público, receitas e despesas, endividamento, capacidade fiscal, transparência, políticas públicas, desigualdades territoriais e pesquisa municipal/estadual.",
            "Os dados são majoritariamente administrativos e declarados pelos entes. Ausência ou atraso de declaração não equivale a valor zero; homologações e retificações podem alterar séries. Conceitos dependem do PCASP, MDF, LRF e exercício, exigindo preservação de ente, período, anexo e versão metodológica.",
            "documentação técnica oficial",
            "https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-api-de-dados-abertos",
            "O Tesouro Nacional documenta o Siconfi como sistema de recepção e disseminação de informações contábeis e fiscais dos entes e oferece API aberta sem autenticação para dados brutos, incluindo MSC e demonstrativos fiscais.",
            "https://www.tesourotransparente.gov.br/consultas/consultas-siconfi",
            verified,
          ]
          with source_path.open('a', encoding='utf-8', newline='') as f:
              csv.writer(f, lineterminator='\n').writerow(source)

          urls_existing={r['product_page_url'].strip() for r in products_old}
          specs=[
            ("Siconfi — API de Dados Abertos","Siconfi API","API e disseminação programática","data_service","Serviço REST de dados abertos do Siconfi para obtenção automatizada, em JSON, de informações contábeis e fiscais submetidas pelos entes, incluindo consultas de grande volume e MSC.","Brasil — União, estados, DF e municípios","ente federativo | declaração | conta/anexo conforme endpoint","não se aplica; serviço tabular/programático","dados disponíveis conforme endpoint e série","conforme endpoint; MSC tipicamente mensal","contínua conforme ingestão/homologação no Siconfi","ativo","API corrente; documentação consultada em 2026","external_index","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-api-de-dados-abertos","https://apidatalake.tesouro.gov.br/docs/siconfi/","serviço","A API expõe informações declaradas e homologadas/retificadas no Siconfi; cobertura e atualização dependem do endpoint, ente e período. Paginação padrão e orientações de uso devem ser respeitadas."),
            ("MSC — Informações Patrimoniais dos Entes da Federação","MSC Patrimonial","Matriz de Saldos Contábeis","dataset_series","Balancetes mensais das contas patrimoniais das classes 1, 2, 3 e 4 do PCASP, detalhados por informações complementares como poder/órgão, atributo financeiro/permanente, fonte/destinação de recursos e dívida consolidada.","Brasil — União, estados, DF e municípios declarantes","ente federativo × período × conta contábil × informação complementar","contábil; não espacial","série mensal conforme entregas da MSC","mensal","mensal","ativo","estrutura vigente com documentação por exercício; consulta 2026","complete","https://www.tesourotransparente.gov.br/ckan/dataset/api-msc-patrimonial-entes","https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=12503","primário","Os valores dependem da entrega e consistência contábil dos entes e do PCASP/taxonomia do exercício. Não interpretar ausência de registro como ausência de ativo, passivo, variação patrimonial ou fato contábil."),
            ("MSC — Informações Orçamentárias dos Entes da Federação","MSC Orçamentária","Matriz de Saldos Contábeis","dataset_series","Balancetes mensais das contas orçamentárias das classes 5 e 6 do PCASP, com informações complementares de poder/órgão, fonte de recursos, função, subfunção, natureza da despesa/receita e outros atributos.","Brasil — União, estados, DF e municípios declarantes","ente federativo × período × conta contábil × informação complementar","contábil; não espacial","série mensal conforme entregas da MSC","mensal","mensal","ativo","estrutura vigente com documentação por exercício; consulta 2026","complete","https://www.tesourotransparente.gov.br/ckan/dataset/api-msc-orcamentaria-entes","https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=12503","primário","A classificação orçamentária e os atributos seguem o PCASP e regras do exercício. Comparações temporais exigem verificar mudanças de taxonomia, mapeamento, retificações e cobertura dos entes."),
            ("MSC — Informações de Controle dos Entes da Federação","MSC Controle","Matriz de Saldos Contábeis","dataset_series","Balancetes mensais das contas de controle das classes 7 e 8 do PCASP, detalhados por atributos como poder/órgão, fonte de recursos, função, subfunção, natureza da despesa e ano de inscrição de restos a pagar.","Brasil — União, estados, DF e municípios declarantes","ente federativo × período × conta contábil × informação complementar","contábil; não espacial","série mensal conforme entregas da MSC","mensal","mensal","ativo","estrutura vigente com documentação por exercício; consulta 2026","complete","https://www.tesourotransparente.gov.br/ckan/dataset/api-msc-controle-entes","https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=12503","primário","Contas de controle não devem ser tratadas como caixa, despesa paga ou estoque patrimonial sem considerar sua natureza contábil. Cobertura, validação e taxonomia dependem do exercício e da entrega do ente."),
            ("FINBRA / DCA — Demonstrativos de Contas Anuais","DCA / FINBRA","contas anuais dos entes","dataset_series","Dados das Declarações de Contas Anuais enviadas ao Siconfi pelos entes da Federação, permitindo consulta das contas anuais por período e ente.","Brasil — estados, DF e municípios e demais entes abrangidos conforme exercício","ente federativo × exercício × demonstrativo/conta","administrativo; não espacial","contas anuais; exercícios conforme disponibilidade do Siconfi","anual","anual","ativo","exercício 2026 documenta DCA referente às contas anuais de 2025","complete","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-finbra-demonstrativos-de-contas-anuais","https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=42","primário","Inclui somente informações efetivamente enviadas e aceitas no Siconfi. Retificações podem alterar valores. Comparações exigem preservar exercício, ente, demonstrativo, regras de validação e mudanças de classificação."),
            ("FINBRA / RGF — Relatório de Gestão Fiscal","RGF / FINBRA","Lei de Responsabilidade Fiscal","dataset_series","Dados dos Relatórios de Gestão Fiscal enviados ao Siconfi, incluindo demonstrativos de limites fiscais relacionados a despesa com pessoal, dívida, garantias e operações de crédito conforme a LRF e o ente/poder.","Brasil — União, estados, DF e municípios/órgãos conforme obrigação de reporte","ente federativo ou órgão/poder × período × anexo do RGF","administrativo; não espacial","série de relatórios por exercício e período","quadrimestral ou semestral conforme ente/regime e exercício","periódica conforme LRF","ativo","instruções RGF exercício 2026 publicadas em 03/03/2026","complete","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-finbra-rgf","https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=42","primário","Os demonstrativos dependem das regras da LRF/MDF, do poder/órgão e do regime de periodicidade. Valor publicado não deve ser interpretado sem o denominador, limite legal, período e eventual retificação correspondentes."),
            ("FINBRA / RREO — Relatório Resumido da Execução Orçamentária","RREO / FINBRA","Lei de Responsabilidade Fiscal","dataset_series","Dados dos Relatórios Resumidos da Execução Orçamentária enviados ao Siconfi, com execução orçamentária, receita corrente líquida, resultados fiscal/previdenciário, restos a pagar e outros anexos definidos pela LRF/MDF.","Brasil — União, estados, DF e municípios conforme obrigação de reporte","ente federativo × bimestre × anexo do RREO","administrativo; não espacial","série de relatórios por exercício e bimestre","bimestral","bimestral","ativo","instruções RREO exercício 2026 publicadas em 03/03/2026","complete","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-finbra-rreo","https://siconfi.tesouro.gov.br/siconfi/pages/public/conteudo/conteudo.jsf?id=42","primário","Os anexos possuem conceitos e bases próprias. Não somar ou comparar indicadores entre anexos sem verificar definição, período, ente e versão do MDF. Declarações podem ser retificadas."),
            ("Siconfi.IA e Painel Contas Públicas do Brasil","Siconfi.IA","acesso analítico às contas públicas","data_service","Serviço lançado pelo Tesouro Nacional em 22/06/2026 para facilitar consulta e interpretação de informações fiscais e contábeis do Siconfi, acompanhado do painel Contas Públicas do Brasil com indicadores, comparações, mapas e visualizações.","Brasil — estados, DF e municípios; recortes por ente e indicador","ente federativo × indicador/demonstrativo","agregado por ente; mapas temáticos conforme indicador","dados do Siconfi e indicadores correntes/históricos conforme painel","varia conforme indicador e demonstrativo","conforme atualização das bases subjacentes","ativo","primeira versão lançada em 22/06/2026","external_index","https://www.gov.br/tesouronacional/pt-br/noticias/tesouro-lanca-siconfi-ia-para-facilitar-acesso-aos-dados-contabeis-e-fiscais-da-federacao","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi","derivado","É camada de acesso e análise derivada de RGF, RREO, DCA e outras fontes, incluindo dados do IBGE e indicadores como CAPAG/ranking. Visualizações e respostas não substituem os demonstrativos, metadados e dados brutos de origem."),
            ("Siconfi — Tabela dos Entes da Federação","Tabela dos Entes","referência de entes do Siconfi","dataset","Tabela de referência com informações dos entes da Federação contidas no Siconfi, utilizada para identificar e relacionar unidades governamentais nas consultas e na API.","Brasil — União, estados, DF e municípios","ente federativo","administrativo; não espacial","cadastro corrente; histórico depende do campo/serviço","cadastral","conforme manutenção do Siconfi","ativo","conjunto CKAN/API corrente","complete","https://www.tesourotransparente.gov.br/ckan/dataset?tags=Matriz+de+Saldos+Cont%C3%A1beis","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-api-de-dados-abertos","primário","É tabela de referência administrativa do Siconfi, não uma divisão territorial geoespacial nem fonte independente de população, área ou indicadores socioeconômicos."),
            ("Siconfi — Extrato de Entregas dos Entes da Federação","Extrato de Entregas","cobertura e submissões do Siconfi","dataset_series","Extrato de relatórios homologados e retificados e de matrizes entregues ao Siconfi, útil para avaliar cobertura de submissões por ente, período e tipo de declaração.","Brasil — entes da Federação abrangidos pelo Siconfi","ente federativo × período × tipo de entrega","administrativo; não espacial","histórico de entregas e retificações conforme Siconfi","evento administrativo","conforme entregas","ativo","conjunto CKAN/API corrente","complete","https://www.tesourotransparente.gov.br/ckan/dataset?license_id=odc-odbl&tags=Estados+e+Munic%C3%ADpios&tags=RGF&tags=Siconfi&tags=Uni%C3%A3o","https://www.tesourotransparente.gov.br/consultas/consultas-siconfi/siconfi-api-de-dados-abertos","primário","Registra entrega/homologação/retificação, não qualidade substantiva dos valores nem cumprimento fiscal. Ausência de entrega deve ser tratada como falta de informação, não como valor fiscal zero."),
          ]

          product_header = next(csv.reader(product_path.open(encoding='utf-8-sig')))
          dist_header = next(csv.reader(dist_path.open(encoding='utf-8-sig')))
          new_products=[]; new_dists=[]
          for i,s in enumerate(specs):
              pid=f"DP{p0+i:06d}"
              name,acr,family,kind,desc,geo,sp_support,sp_res,temp_cov,temp_res,upd,status,version,scope,page,method,porig,lim=s
              if page in urls_existing:
                  raise SystemExit(f'product URL already catalogued: {page}')
              row=[pid,rid,name,acr,family,kind,desc,
                   "Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados",
                   "finanças públicas | contabilidade pública | Siconfi | federalismo fiscal | orçamento | estados | municípios",
                   geo,"sim",sp_support,sp_res,temp_cov,temp_res,upd,status,version,scope,page,method,porig,lim,verified]
              new_products.append(row)
              did=f"DD{d0+i:06d}"
              if kind=='data_service' and 'API de Dados Abertos' in name:
                  access='https://apidatalake.tesouro.gov.br/docs/siconfi/'
                  fmt='JSON | REST API'
                  tool='cliente HTTP | navegador | software estatístico'
                  subset='por endpoint, ente, período, anexo/conta e parâmetros suportados'
              elif 'MSC — Informações Patrimoniais' in name:
                  access='https://www.tesourotransparente.gov.br/ckan/dataset/api-msc-patrimonial-entes'; fmt='API | JSON | PDF de metadados'; tool='API Siconfi | navegador'
                  subset='por ente, período, conta e informações complementares conforme API'
              elif 'MSC — Informações Orçamentárias' in name:
                  access='https://www.tesourotransparente.gov.br/ckan/dataset/api-msc-orcamentaria-entes'; fmt='API | JSON | PDF de metadados'; tool='API Siconfi | navegador'; subset='por ente, período, conta e informações complementares conforme API'
              elif 'MSC — Informações de Controle' in name:
                  access='https://www.tesourotransparente.gov.br/ckan/dataset/api-msc-controle-entes'; fmt='API | JSON | PDF de metadados'; tool='API Siconfi | navegador'; subset='por ente, período, conta e informações complementares conforme API'
              else:
                  access=page; fmt='consulta web | API/JSON quando disponibilizado pelo Siconfi'; tool='navegador | API Siconfi'; subset='por ente, período e demonstrativo/indicador conforme produto'
              license_text='Open Data Commons Open Database License (ODbL) nos conjuntos CKAN auditados; verificar termos do recurso/consulta específica'
              notes='Dados administrativos do Siconfi; preservar ente, período, versão metodológica e estado de homologação/retificação. Não interpretar ausência de declaração como valor zero.'
              new_dists.append([did,pid,f"{name} — acesso oficial",access,fmt,"HTTPS | REST API quando aplicável",tool,"sim","não","acesso público; API sujeita às orientações de uso e paginação quando aplicável",license_text,"sim",subset,notes,verified])

          with product_path.open('a',encoding='utf-8',newline='') as f:
              w=csv.writer(f,lineterminator='\n'); w.writerows(new_products)
          with dist_path.open('a',encoding='utf-8',newline='') as f:
              w=csv.writer(f,lineterminator='\n'); w.writerows(new_dists)

          reg=json.loads(priority_path.read_text(encoding='utf-8'))
          reg['reviewed_at']=verified
          p0tier=next(t for t in reg['tiers'] if t['priority_tier']=='P0')
          if rid not in p0tier['resource_ids']:
              p0tier['resource_ids'].append(rid)
          priority_path.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          print('APPENDED',rid,new_products[0][0],new_products[-1][0],new_dists[0][0],new_dists[-1][0])
          PY

      - name: Validate and rebuild
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Read back relational integrity
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          def rr(p):
              with Path(p).open(encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          s=rr('data/data_resources.csv'); p=rr('data/data_products.csv'); d=rr('data/product_distributions.csv')
          assert len(s)==130, len(s)
          assert len(p)==810, len(p)
          assert len(d)==843, len(d)
          assert s[-1]['resource_name'].startswith('Sistema de Informações Contábeis')
          rid=s[-1]['resource_id']; pp=[x for x in p if x['resource_id']==rid]
          assert len(pp)==10
          pids={x['product_id'] for x in pp}
          assert len([x for x in d if x['product_id'] in pids])==10
          print('READBACK',len(s),len(p),len(d),rid,sorted(pids)[0],sorted(pids)[-1])
          PY

      - name: Commit materialized batch
        run: |
          git config user.name "vitrine-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_resources.json data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git commit -m "Expand verified Siconfi public-finance catalog"
          git push origin HEAD:main
