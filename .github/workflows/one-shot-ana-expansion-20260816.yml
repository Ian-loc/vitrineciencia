name: One-shot ANA expansion audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-ana-expansion-20260816.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append verified ANA products and distributions
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          ppath = Path('data/data_products.csv')
          dpath = Path('data/product_distributions.csv')
          with ppath.open(encoding='utf-8', newline='') as f:
              products = list(csv.DictReader(f)); pfields = list(products[0].keys())
          with dpath.open(encoding='utf-8', newline='') as f:
              dists = list(csv.DictReader(f)); dfields = list(dists[0].keys())

          candidates = [
            {
              'product_name':'Portal da Qualidade da Água — ANA 2026','product_acronym':'Portal Qualidade da Água','product_family':'Qualidade das águas superficiais','product_kind':'data_service',
              'product_description':'Plataforma interativa lançada pela ANA em 2026 para explorar análises e dados de monitoramento de qualidade das águas produzidos pelas Unidades da Federação integrantes da RNQA.',
              'research_areas':'Water quality | Hydrology | Environmental monitoring | Public health','keywords':'qualidade da água | RNQA | monitoramento | rios | indicadores | ANA',
              'geographic_coverage':'Brasil; cobertura conforme estações e dados disponibilizados pelas Unidades da Federação participantes', 'covers_brazil':'sim',
              'spatial_support':'estações/pontos de monitoramento | corpos hídricos | agregações territoriais conforme interface','spatial_resolution':'pontual na origem; agregações e análises variam conforme visualização',
              'temporal_coverage':'séries históricas conforme estação, UF, parâmetro e disponibilidade','temporal_resolution':'varia por programa, estação e parâmetro','update_frequency':'operacional/irregular conforme incorporação de dados estaduais',
              'product_status':'ativo','version_or_collection':'Portal lançado em 01/04/2026','enumeration_scope':'family_level','product_page_url':'https://qualidadedaagua.ana.gov.br/','methodology_url':'https://www.gov.br/ana/pt-br/assuntos/monitoramento-e-eventos-criticos/qualidade-da-agua',
              'primary_or_derived':'serviço','limitations':'Integra dados produzidos por órgãos estaduais e análises da ANA; cobertura, parâmetros, frequência, consistência e períodos variam entre redes e estações. Indicadores derivados não devem ser confundidos com medições brutas nem generalizados para corpos hídricos não monitorados.',
              'dist_name':'Portal da Qualidade da Água — aplicação interativa','dist_url':'https://qualidadedaagua.ana.gov.br/','format':'aplicação web | mapas | gráficos | dados conforme interface','protocol':'HTTPS web','tool':'navegador web','subset':'por estação, território, período, parâmetro e indicador conforme interface','notes':'Lançado pela ANA em 01/04/2026 com análises baseadas em dados das UFs integrantes da RNQA.'
            },
            {
              'product_name':'Base Nacional de Referência de Usos Consuntivos da Água — 2ª edição 2024','product_acronym':'BD-Usos 2024','product_family':'Usos consuntivos da água','product_kind':'dataset_series',
              'product_description':'Base nacional consolidada pela ANA para estimativas históricas e projeções de demandas hídricas por usos consuntivos, atualizada na segunda edição do Manual de Usos Consuntivos da Água no Brasil.',
              'research_areas':'Water resources | Hydrology | Agriculture | Urban systems | Environmental planning','keywords':'usos consuntivos | demanda hídrica | retirada | consumo | municípios | projeções | ANA',
              'geographic_coverage':'Brasil; municípios e demais recortes conforme base e publicação','covers_brazil':'sim','spatial_support':'município | setores usuários | agregações territoriais','spatial_resolution':'municipal na base de referência; agregações conforme aplicação',
              'temporal_coverage':'1931–2040 na 2ª edição, combinando reconstruções históricas e projeções','temporal_resolution':'anual conforme série/base','update_frequency':'por edição/revisão metodológica',
              'product_status':'ativo','version_or_collection':'2ª edição 2024; horizonte 1931–2040','enumeration_scope':'complete','product_page_url':'https://www.gov.br/ana/pt-br/centrais-de-conteudos/publicacoes','methodology_url':'https://www.gov.br/ana/pt-br/centrais-de-conteudos/publicacoes',
              'primary_or_derived':'derivado','limitations':'Valores são estimativas modeladas/reconstruídas por setor e território e incluem projeções futuras; não equivalem a medições diretas de captação ou consumo. Comparações entre versões devem preservar métodos, bases auxiliares e revisões.',
              'dist_name':'Manual de Usos Consuntivos 2ª edição e base associada','dist_url':'https://www.gov.br/ana/pt-br/centrais-de-conteudos/publicacoes','format':'publicação PDF | base de dados e produtos associados conforme SNIRH','protocol':'HTTPS web | download','tool':'navegador web | leitor PDF | software tabular/geoespacial conforme arquivo','subset':'por município, setor usuário, ano e variável conforme base','notes':'A 2ª edição de 2024 atualiza o diagnóstico/prognóstico para 1931–2040 e consolida nova versão da BD-Usos.'
            },
            {
              'product_name':'Cadastro Nacional de Usuários de Recursos Hídricos — CNARH','product_acronym':'CNARH','product_family':'Regulação dos usos de recursos hídricos','product_kind':'data_service',
              'product_description':'Cadastro nacional mantido pela ANA para registrar usuários, usos e interferências regularizados em recursos hídricos de domínio da União e, conforme integração, dos estados, com componentes de gestão e dados abertos.',
              'research_areas':'Water resources | Environmental regulation | Environmental policy | Infrastructure','keywords':'CNARH | usuários de água | outorga | captação | lançamento | interferências | regulação | ANA',
              'geographic_coverage':'Brasil; cobertura depende da integração dos órgãos gestores e do domínio dos corpos hídricos','covers_brazil':'sim','spatial_support':'ponto de interferência | empreendimento | usuário | corpo hídrico','spatial_resolution':'registro administrativo georreferenciado conforme cadastro','temporal_coverage':'cadastro corrente; histórico conforme registros e atos integrados','temporal_resolution':'evento/registro administrativo','update_frequency':'contínua conforme regularização e integração institucional',
              'product_status':'ativo','version_or_collection':'CNARH corrente; CNARH 40 e integrações vigentes','enumeration_scope':'family_level','product_page_url':'https://www.gov.br/ana/pt-br/assuntos/regulacao-e-fiscalizacao/cadastro-nacional-de-usuarios-recursos-hidricos-cnarh','methodology_url':'https://www.gov.br/ana/pt-br/assuntos/regulacao-e-fiscalizacao/cadastro-nacional-de-usuarios-recursos-hidricos-cnarh',
              'primary_or_derived':'primário','limitations':'Cadastro administrativo, não censo físico de todos os usos da água. Cobertura depende da regularização, inserção pelos órgãos gestores, domínio do corpo hídrico e integração de sistemas; ausência de registro não implica ausência de uso.',
              'dist_name':'CNARH — consulta institucional e dados abertos de usos regularizados','dist_url':'https://www.gov.br/ana/pt-br/assuntos/regulacao-e-fiscalizacao/cadastro-nacional-de-usuarios-recursos-hidricos-cnarh','format':'aplicação web | dados abertos | formatos variam por conjunto','protocol':'HTTPS web | download/API conforme portal de dados abertos','tool':'navegador web | ferramentas de dados abertos','subset':'por domínio, tipo de uso/interferência e território conforme conjunto disponibilizado','notes':'A ANA diferencia módulos de gestão restritos e dados abertos públicos; registros estaduais dependem da integração dos respectivos órgãos gestores.'
            },
            {
              'product_name':'Plano Nacional de Segurança Hídrica — PNSH 2019','product_acronym':'PNSH','product_family':'Planejamento nacional de segurança hídrica','product_kind':'indicator_family',
              'product_description':'Plano estratégico nacional que integra diagnóstico de segurança hídrica, critérios de priorização e carteira de intervenções de infraestrutura hídrica de relevância regional.',
              'research_areas':'Water security | Water resources | Environmental planning | Infrastructure | Public policy','keywords':'PNSH | segurança hídrica | infraestrutura hídrica | planejamento | índice de segurança hídrica | ANA',
              'geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'territórios, sistemas hídricos, unidades de análise e intervenções conforme componente do plano','spatial_resolution':'varia por indicador, estudo e intervenção','temporal_coverage':'plano publicado em 2019; horizontes de planejamento e boletins posteriores conforme componente','temporal_resolution':'plano estratégico com atualizações/boletins','update_frequency':'irregular conforme revisão e monitoramento',
              'product_status':'ativo','version_or_collection':'PNSH 2019 e boletins de acompanhamento','enumeration_scope':'family_level','product_page_url':'https://www.gov.br/ana/pt-br/assuntos/seguranca-hidrica/plano-nacional-de-seguranca-hidrica','methodology_url':'https://www.gov.br/ana/pt-br/assuntos/seguranca-hidrica/plano-nacional-de-seguranca-hidrica',
              'primary_or_derived':'derivado','limitations':'Produto de planejamento e síntese multifuente; indicadores, cenários e carteira de intervenções não equivalem a observações hidrológicas atuais nem garantem execução das obras. Preservar versão, componente e hipótese de planejamento.',
              'dist_name':'PNSH — plano, estudos e boletins de acompanhamento','dist_url':'https://www.gov.br/ana/pt-br/assuntos/seguranca-hidrica/plano-nacional-de-seguranca-hidrica','format':'publicações | mapas | relatórios/boletins conforme componente','protocol':'HTTPS web | download','tool':'navegador web | leitor PDF','subset':'por componente, território e intervenção conforme documentos','notes':'O PNSH complementa o planejamento de recursos hídricos com foco estratégico em segurança hídrica e infraestrutura de relevância regional.'
            }
          ]

          existing_names = {r['product_name'] for r in products}
          existing_urls = {r['product_page_url'] for r in products if r.get('product_page_url')}
          maxp = max(int(r['product_id'][2:]) for r in products)
          maxd = max(int(r['distribution_id'][2:]) for r in dists)
          added_p=[]; added_d=[]
          for c in candidates:
              if c['product_name'] in existing_names or c['product_page_url'] in existing_urls:
                  print('SKIP duplicate:', c['product_name']); continue
              maxp += 1; maxd += 1
              pid=f'DP{maxp:06d}'; did=f'DD{maxd:06d}'
              added_p.append({
                'product_id':pid,'resource_id':'DR0017','product_name':c['product_name'],'product_acronym':c['product_acronym'],'product_family':c['product_family'],'product_kind':c['product_kind'],'product_description':c['product_description'],'research_areas':c['research_areas'],'keywords':c['keywords'],'geographic_coverage':c['geographic_coverage'],'covers_brazil':c['covers_brazil'],'spatial_support':c['spatial_support'],'spatial_resolution':c['spatial_resolution'],'temporal_coverage':c['temporal_coverage'],'temporal_resolution':c['temporal_resolution'],'update_frequency':c['update_frequency'],'product_status':c['product_status'],'version_or_collection':c['version_or_collection'],'enumeration_scope':c['enumeration_scope'],'product_page_url':c['product_page_url'],'methodology_url':c['methodology_url'],'primary_or_derived':c['primary_or_derived'],'limitations':c['limitations'],'last_verified':'2026-08-16'})
              added_d.append({'distribution_id':did,'product_id':pid,'distribution_name':c['dist_name'],'access_url':c['dist_url'],'format':c['format'],'access_protocol':c['protocol'],'access_tool':c['tool'],'free_download':'sim','authentication_required':'não','access_conditions':'consulta pública; componentes administrativos restritos quando explicitamente indicado','license':'dados abertos da ANA são disponibilizados para livre utilização; verificar licença/termos específicos no arquivo ou sistema utilizado','provider_attribution_required':'sim','subset_support':c['subset'],'notes':c['notes'],'last_verified':'2026-08-16'})
          if added_p:
              with ppath.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=pfields,lineterminator='\n'); [w.writerow(r) for r in added_p]
              with dpath.open('a',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=dfields,lineterminator='\n'); [w.writerow(r) for r in added_d]
          print('Added products:', [r['product_id'] for r in added_p])
          print('Added distributions:', [r['distribution_id'] for r in added_d])
          PY
      - name: Validate and rebuild
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
          python - <<'PY'
          import csv
          for p in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with open(p,encoding='utf-8',newline='') as f: print(p, sum(1 for _ in csv.DictReader(f)))
          PY
      - name: Commit canonical delta and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-ana-expansion-20260816.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json 2>/dev/null || true
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m 'Expand verified ANA water-resource catalog'
            git push origin HEAD:main
          fi
