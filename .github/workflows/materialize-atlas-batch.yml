name: Materialize verified IBGE atlas batch

on:
  push:
    branches: ["audit/ibge-atlas-20260816"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-atlas-20260816
          fetch-depth: 0

      - name: Append verified atlas products and distributions
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          root = Path('.')
          products_path = root / 'data' / 'data_products.csv'
          dist_path = root / 'data' / 'product_distributions.csv'

          products = [
            {
              'product_id':'DP000192','resource_id':'DR0085','product_name':'Atlas de Saneamento — 3ª edição 2021','product_acronym':'Atlas de Saneamento 2021','product_family':'Atlas temáticos — saneamento','product_kind':'catalog','product_description':'Terceira edição do Atlas de Saneamento do IBGE, estruturada como síntese geográfica dos resultados da PNSB 2017 e de outras informações relacionadas a serviços de saneamento, saúde pública e meio ambiente no Brasil.','research_areas':'Environmental science | Public health | Territorial analysis | Sanitation','keywords':'saneamento | abastecimento de água | esgotamento sanitário | PNSB 2017 | saúde ambiental | regiões hidrográficas | IBGE','geographic_coverage':'Brasil; análises nacionais e recortes territoriais conforme tema','covers_brazil':'sim','spatial_support':'mapas | indicadores | recortes municipais e hidrográficos | textos analíticos','spatial_resolution':'heterogênea conforme indicador, mapa e fonte','temporal_coverage':'PNSB 2017; indicadores de saúde 2007–2019; outros anos conforme capítulo','temporal_resolution':'heterogênea por fonte e indicador','update_frequency':'por edição do Atlas/PNSB','product_status':'ativo','version_or_collection':'2021 — 3ª edição','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16365-atlas-de-saneamento.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16365-atlas-de-saneamento.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'Atlas integrador e multifuente; indicadores de cobertura, qualidade, saúde e meio ambiente possuem unidades, anos e métodos próprios. Não tratar a publicação como base observacional homogênea nem assumir referência temporal única.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000193','resource_id':'DR0085','product_name':'Atlas do Censo Demográfico 2010','product_acronym':'Atlas do Censo 2010','product_family':'Atlas temáticos — população e território','product_kind':'catalog','product_description':'Atlas do IBGE que sintetiza geograficamente resultados do Censo Demográfico 2010 sobre perfil e dinâmica da população, distribuição espacial, urbanização, fluxos, habitação, condições socioeconômicas e diversidade cultural.','research_areas':'Population geography | Territorial analysis | Urban studies | Socioeconomic geography','keywords':'Censo 2010 | população | urbanização | fluxos | habitação | desigualdade socioespacial | atlas | IBGE','geographic_coverage':'Brasil; diferenças regionais e locais conforme tema','covers_brazil':'sim','spatial_support':'mapas | gráficos | textos analíticos | recortes territoriais diversos','spatial_resolution':'heterogênea conforme variável, mapa e recorte censitário','temporal_coverage':'Censo Demográfico 2010; referências históricas adicionais conforme tema','temporal_resolution':'snapshot censitário e séries/contextos conforme capítulo','update_frequency':'por edição censitária','product_status':'arquivado','version_or_collection':'Censo Demográfico 2010; publicação divulgada em 2013','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16361-atlas-do-censo-demografico.html','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16361-atlas-do-censo-demografico.html','primary_or_derived':'derivado','limitations':'Síntese do Censo 2010, não retrato demográfico atual. Mapas e análises usam diferentes recortes e variáveis; mudanças territoriais e metodológicas precisam ser consideradas antes de comparações com censos posteriores.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000194','resource_id':'DR0085','product_name':'Atlas Digital Brasil 1 por 1 — Censo 2010','product_acronym':'Brasil 1 por 1 2010','product_family':'Atlas digitais — grade estatística censitária','product_kind':'catalog','product_description':'Atlas digital do IBGE que espacializa variáveis do Censo Demográfico 2010 por meio de Grade Estatística, permitindo explorar população, domicílios e características socioeconômicas e do entorno em células independentes dos limites político-administrativos.','research_areas':'Population geography | Spatial analysis | Urban studies | GIS','keywords':'Censo 2010 | grade estatística | 200 m | 1 km | população | domicílios | entorno | atlas digital | IBGE','geographic_coverage':'Brasil','covers_brazil':'sim','spatial_support':'Grade Estatística; células urbanas de 200 × 200 m e rurais de 1 × 1 km | mapas temáticos','spatial_resolution':'200 m em áreas urbanas; 1 km em áreas rurais, conforme Grade Estatística do produto','temporal_coverage':'Censo Demográfico 2010','temporal_resolution':'snapshot censitário','update_frequency':'por edição do produto/censo','product_status':'arquivado','version_or_collection':'2010','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/24684-atlas-digital-brasil-1-por-1.html','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/24684-atlas-digital-brasil-1-por-1.html','primary_or_derived':'derivado','limitations':'Os valores são derivados do Censo 2010 e agregados à Grade Estatística; não representam condições atuais. A grade reduz dependência de limites administrativos, mas não elimina sigilo, efeitos de agregação, diferenças urbano-rurais de resolução ou limitações das variáveis censitárias.','last_verified':'2026-08-16'
            },
            {
              'product_id':'DP000195','resource_id':'DR0085','product_name':'Atlas Geográfico das Zonas Costeiras e Oceânicas do Brasil — 2011','product_acronym':'Atlas Costeiro e Oceânico 2011','product_family':'Atlas temáticos — zonas costeiras e oceânicas','product_kind':'catalog','product_description':'Atlas elaborado pelo IBGE em conjunto com instituições da Comissão Interministerial para os Recursos do Mar, reunindo sínteses sobre dimensões naturais, históricas, demográficas, econômicas, sociais e culturais do litoral e das zonas costeiras e oceânicas brasileiras.','research_areas':'Coastal science | Oceanography | Environmental science | Territorial analysis','keywords':'zona costeira | oceano | litoral | biodiversidade | recursos do mar | população costeira | atlas | CIRM | IBGE','geographic_coverage':'zonas costeiras e oceânicas do Brasil','covers_brazil':'sim','spatial_support':'mapas | textos | sínteses temáticas | recortes costeiros e oceânicos','spatial_resolution':'heterogênea conforme tema, mapa e fonte','temporal_coverage':'edição 2011; anos de referência variam entre componentes','temporal_resolution':'heterogênea por componente','update_frequency':'por edição','product_status':'arquivado','version_or_collection':'2011','enumeration_scope':'external_index','product_page_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16366-atlas-geografico-das-zonas-costeiras-e-oceanicas-do-brasil.html?lang=pt-BR','methodology_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16366-atlas-geografico-das-zonas-costeiras-e-oceanicas-do-brasil.html?lang=pt-BR','primary_or_derived':'derivado','limitations':'Síntese temática histórica e multifuente. Componentes geológicos, oceanográficos, biológicos e socioeconômicos possuem escalas e referências temporais distintas; não usar como camada ambiental homogênea nem como estado atual da costa.','last_verified':'2026-08-16'
            },
          ]

          distributions = [
            {'distribution_id':'DD000213','product_id':'DP000192','distribution_name':'Atlas de Saneamento 2021 — publicação e acesso interativo','access_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16365-atlas-de-saneamento.html?lang=pt-BR','format':'PDF / publicação digital | aplicação web / PGI','access_protocol':'HTTPS web | download | aplicação web','access_tool':'navegador web | leitor PDF | PGI','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos conforme recurso indicado na página oficial','license':'licença específica dos arquivos/camadas não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'interativo na PGI; capacidades variam por mapa/indicador','notes':'A 3ª edição usa PNSB 2017 e integra também saúde pública e meio ambiente; preservar anos e unidades de cada indicador.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000214','product_id':'DP000193','distribution_name':'Atlas do Censo Demográfico 2010 — publicação e aplicativos','access_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16361-atlas-do-censo-demografico.html','format':'PDF / publicação digital | aplicações web','access_protocol':'HTTPS web | download | aplicação web','access_tool':'navegador web | leitor PDF | PGI / Portal de Mapas','free_download':'sim','authentication_required':'não','access_conditions':'consulta pública pela página oficial e aplicativos associados','license':'licença específica dos arquivos/camadas não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'interativo conforme aplicação; publicação integral para download','notes':'Produto baseado no Censo 2010; não assumir atualidade demográfica nem equivalência espacial automática com recortes de censos posteriores.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000215','product_id':'DP000194','distribution_name':'Atlas Digital Brasil 1 por 1 — aplicação e downloads','access_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/24684-atlas-digital-brasil-1-por-1.html','format':'atlas digital | mapas | arquivos disponíveis na seção de downloads; verificar formato por recurso','access_protocol':'HTTPS web | download','access_tool':'navegador web | SIG conforme arquivo','free_download':'sim','authentication_required':'não','access_conditions':'consulta e downloads públicos conforme recursos da página oficial','license':'licença específica dos arquivos não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'por variável e célula na lógica do Atlas; capacidades de exportação dependem do recurso','notes':'A Grade Estatística usa células de 200 × 200 m em áreas urbanas e 1 × 1 km em áreas rurais; as variáveis referem-se ao Censo 2010.','last_verified':'2026-08-16'},
            {'distribution_id':'DD000216','product_id':'DP000195','distribution_name':'Atlas das Zonas Costeiras e Oceânicas 2011 — publicação e aplicativo','access_url':'https://www.ibge.gov.br/geociencias/atlas/tematicos/16366-atlas-geografico-das-zonas-costeiras-e-oceanicas-do-brasil.html?lang=pt-BR','format':'PDF / publicação digital | aplicação web','access_protocol':'HTTPS web | download | aplicação web','access_tool':'navegador web | leitor PDF','free_download':'sim','authentication_required':'não','access_conditions':'consulta e download públicos conforme recursos indicados na página oficial','license':'licença específica dos arquivos/camadas não localizada nesta auditoria; observar termos de uso do IBGE','provider_attribution_required':'sim','subset_support':'interativo conforme aplicativo; publicação integral para download','notes':'Atlas multitemático produzido com a CIRM; escalas, anos e instituições de origem devem ser verificados por componente.','last_verified':'2026-08-16'},
          ]

          def read_rows(path):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  return list(csv.DictReader(f))

          current_products = read_rows(products_path)
          current_dists = read_rows(dist_path)
          p_ids = {r['product_id'] for r in current_products}
          d_ids = {r['distribution_id'] for r in current_dists}
          names = {r['product_name'].strip().casefold() for r in current_products}
          urls = {r['product_page_url'].strip() for r in current_products}

          for row in products:
              assert row['product_id'] not in p_ids, row['product_id']
              assert row['product_name'].strip().casefold() not in names, row['product_name']
              assert row['product_page_url'] not in urls, row['product_page_url']
          for row in distributions:
              assert row['distribution_id'] not in d_ids, row['distribution_id']
              assert row['product_id'] in {r['product_id'] for r in products}, row['product_id']

          with products_path.open('a', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=list(products[0]), lineterminator='\n')
              writer.writerows(products)
          with dist_path.open('a', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=list(distributions[0]), lineterminator='\n')
              writer.writerows(distributions)
          PY

      - name: Rebuild and validate consolidated batch
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p=list(csv.DictReader(Path('data/data_products.csv').open(encoding='utf-8-sig')))
          d=list(csv.DictReader(Path('data/product_distributions.csv').open(encoding='utf-8-sig')))
          assert len({r['product_id'] for r in p}) == len(p)
          assert len({r['distribution_id'] for r in d}) == len(d)
          pids={r['product_id'] for r in p}
          assert all(r['product_id'] in pids for r in d)
          for pid in ['DP000192','DP000193','DP000194','DP000195']:
              assert sum(r['product_id']==pid for r in p)==1
              assert sum(r['product_id']==pid for r in d)>=1
          print(f'OK read-back: {len(p)} products; {len(d)} distributions')
          PY

      - name: Commit validated batch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-atlas-batch.yml
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json data/build-meta.json assets/build-meta.js
          git add -u
          git commit -m "Expand verified IBGE atlas catalog"
          git push origin HEAD:audit/ibge-atlas-20260816
