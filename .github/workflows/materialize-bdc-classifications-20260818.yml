name: Materialize BDC classifications 2026-08-18

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize verified batch
        run: python scripts/materialize_bdc_classifications_20260818.py
      - name: Validate Brazil scope
        run: python scripts/validate_brazil_scope.py
      - name: Validate product catalog
        run: python scripts/validate_product_catalog.py
      - name: Rebuild catalog
        run: python scripts/build_catalog.py
      - name: Regenerate link-role audit
        run: python scripts/audit_link_roles.py --write
      - name: Validate Vitrine
        run: python scripts/validate_vitrine.py
      - name: Build public artifact
        run: python scripts/build_site_artifact.py
      - name: Diff check
        run: git diff --check
      - name: Read-back relational integrity
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ['data/data_resources.csv','data/data_products.csv','data/product_distributions.csv']:
              with Path(name).open(encoding='utf-8-sig', newline='') as f:
                  rows=list(csv.DictReader(f))
              print(name, len(rows))
          with Path('data/data_products.csv').open(encoding='utf-8-sig', newline='') as f: p=list(csv.DictReader(f))
          with Path('data/product_distributions.csv').open(encoding='utf-8-sig', newline='') as f: d=list(csv.DictReader(f))
          pids={r['product_id'] for r in p}
          assert all(f'DP{i:06d}' in pids for i in range(713,721))
          dids={r['distribution_id'] for r in d}
          assert all(f'DD{i:06d}' in dids for i in range(743,751))
          assert {r['product_id'] for r in d}.issubset(pids)
          PY
      - name: Commit materialized data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/link_role_audit.json
          if git diff --cached --quiet; then
            echo 'No material changes to commit.'
            exit 0
          fi
          git commit -m 'Expand verified BDC classification catalog'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
