name: Materializar lote PEERS e Grade Ambiental
on:
  push:
    branches: [audit/ibge-peers-grade-batch]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-peers-grade-batch
          fetch-depth: 0
      - name: Materializar e validar
        run: |
          python3 scripts/materialize_ibge_peers_grade.py
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          git diff --check
      - name: Commitar delta canônico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/link_role_audit.json
          git commit -m "Materializar PEERS e Grade Estatística Ambiental" || exit 0
          git push origin HEAD:audit/ibge-peers-grade-batch
