name: PR materialize BDC service dedup

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Consolidate three verified BDC service duplicates
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          pp=Path('data/data_products.csv'); dp=Path('data/product_distributions.csv')
          with pp.open(encoding='utf-8',newline='') as f: ps=list(csv.DictReader(f)); pf=list(ps[0])
          with dp.open(encoding='utf-8',newline='') as f: ds=list(csv.DictReader(f)); df=list(ds[0])
          assert (len(ps),len(ds))==(785,816), (len(ps),len(ds))
          pairs=[('DP000629','DP000722','DD000654','DD000752'),('DP000641','DP000723','DD000666','DD000753'),('DP000642','DP000721','DD000667','DD000751')]
          byp={p['product_id']:p for p in ps}; byd={d['distribution_id']:d for d in ds}
          for oldp,newp,oldd,newd in pairs:
              assert oldp in byp and newp in byp and oldd in byd and newd in byd
              assert byp[oldp]['resource_id']==byp[newp]['resource_id']=='DR0123'
              assert byd[oldd]['product_id']==oldp and byd[newd]['product_id']==newp
          assert 'STAC' in byp['DP000629']['product_name'] and 'STAC' in byp['DP000722']['product_name']
          assert 'SAMPLE' in byp['DP000641']['product_acronym'].upper() and 'SAMPLE' in byp['DP000723']['product_acronym'].upper()
          assert 'Explorer' in byp['DP000642']['product_name'] and 'Explorer' in byp['DP000721']['product_name']
          delete_p=set(); delete_d=set(); repl_p={}; repl_d={}
          for oldp,newp,oldd,newd in pairs:
              q=dict(byp[newp]); q['product_id']=oldp; repl_p[oldp]=q; delete_p.add(newp)
              z=dict(byd[newd]); z['distribution_id']=oldd; z['product_id']=oldp; repl_d[oldd]=z; delete_d.add(newd)
          ps=[repl_p.get(p['product_id'],p) for p in ps if p['product_id'] not in delete_p]
          ds=[repl_d.get(d['distribution_id'],d) for d in ds if d['distribution_id'] not in delete_d]
          with pp.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=pf,lineterminator='\n'); w.writeheader(); w.writerows(ps)
          with dp.open('w',encoding='utf-8',newline='') as f: w=csv.DictWriter(f,fieldnames=df,lineterminator='\n'); w.writeheader(); w.writerows(ds)
          print('CONSOLIDATED 3 BDC SERVICE PAIRS',len(ps),len(ds))
          PY
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check
          python3 - <<'PY'
          import csv,json
          r=list(csv.DictReader(open('data/data_resources.csv',encoding='utf-8'))); p=list(csv.DictReader(open('data/data_products.csv',encoding='utf-8'))); d=list(csv.DictReader(open('data/product_distributions.csv',encoding='utf-8')))
          a=json.load(open('data/link_role_audit.json',encoding='utf-8'))
          assert (len(r),len(p),len(d))==(126,782,813), (len(r),len(p),len(d))
          assert a['records']==126
          assert not any(x['product_id'] in {'DP000721','DP000722','DP000723'} for x in p)
          assert not any(x['distribution_id'] in {'DD000751','DD000752','DD000753'} for x in d)
          for pid in ('DP000629','DP000641','DP000642'):
              q=[x for x in p if x['product_id']==pid]; assert len(q)==1 and q[0]['resource_id']=='DR0123' and q[0]['last_verified']=='2026-08-18'
          print('READBACK',len(r),len(p),len(d),a['counts'])
          PY
      - name: Commit candidate and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr-bdc-service-dedup.yml
          git config user.name "Ian-loc"
          git config user.email "lara.clemente@ufla.br"
          git add data .github/workflows
          git diff --cached --check
          git commit -m "Deduplicate overlapping BDC service representations"
          git push origin HEAD:${{ github.head_ref }}
