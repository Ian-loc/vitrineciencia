name: One-shot Vitrine audit-date retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-vitrine-20260818-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align audit date with runner UTC and retrigger materializer
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/2026-08-18/2026-08-17/g' .github/workflows/one-shot-vitrine-20260818.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-vitrine-20260818-retry.yml
          git add .github/workflows/one-shot-vitrine-20260818.yml
          git diff --check
          git commit -m 'Align one-shot Vitrine audit date with runner UTC'
          git push origin HEAD:main
