name: One-shot IBGE atlas territorial append-safe

on:
  push:
    branches: ["audit/ibge-atlas-territorial-20260816"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-atlas-territorial-20260816
          fetch-depth: 0

      - name: Execute materializer and patch only appended product rows
        shell: python
        run: |
          from pathlib import Path
          import csv, io, subprocess
          src = Path('.github/workflows/one-shot-ibge-atlas-territorial.yml').read_text(encoding='utf-8')
          start = src.index('      - name: Append verified IBGE records')
          run_start = src.index('        run: |\n', start) + len('        run: |\n')
          end = src.index('      - name: Validate and rebuild', run_start)
          block = src[run_start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          code = code.replace("data['reviewed_at'] = verified", "data['reviewed_at'] = '2026-08-15'")
          code = code.replace("Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação | Geografia Econômica", "Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação")
          exec(compile(code, '<corrected-materializer>', 'exec'), {})

          path = Path('data/data_products.csv')
          base = subprocess.check_output(['git','show','origin/main:data/data_products.csv'])
          cur = path.read_bytes()
          assert cur.startswith(base), 'materializer changed pre-existing product bytes before patch'
          tail = cur[len(base):].decode('utf-8')
          header = base.splitlines()[0].decode('utf-8')
          reader = csv.DictReader(io.StringIO(header+'\n'+tail))
          fields = reader.fieldnames
          rows = list(reader)
          targets={'DP000188','DP000189','DP000190','DP000191'}
          assert {r['product_id'] for r in rows} == targets
          for row in rows: row['enumeration_scope']='external_index'
          out = io.StringIO(newline='')
          writer = csv.DictWriter(out, fieldnames=fields, lineterminator='\n')
          for row in rows: writer.writerow(row)
          path.write_bytes(base + out.getvalue().encode('utf-8'))

      - name: Validate, rebuild and audit
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Consolidated relational and append-only read-back
        shell: python
        run: |
          import csv, subprocess
          from pathlib import Path
          def read(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as f: return list(csv.DictReader(f))
          r=read('data/data_resources.csv'); p=read('data/data_products.csv'); d=read('data/product_distributions.csv')
          assert len({x['resource_id'] for x in r})==len(r)
          assert len({x['product_id'] for x in p})==len(p)
          assert len({x['distribution_id'] for x in d})==len(d)
          rids={x['resource_id'] for x in r}; pids={x['product_id'] for x in p}; dids={x['distribution_id'] for x in d}
          assert all(x['resource_id'] in rids for x in p)
          assert all(x['product_id'] in pids for x in d)
          for rid in ('DR0084','DR0085'): assert rid in rids
          for pid in ('DP000188','DP000189','DP000190','DP000191'): assert pid in pids
          for did in ('DD000206','DD000207','DD000208','DD000209','DD000210','DD000211','DD000212'): assert did in dids
          for path,ids in {
            'data/data_resources.csv':(b'DR0084',b'DR0085'),
            'data/data_products.csv':(b'DP000188',b'DP000189',b'DP000190',b'DP000191'),
            'data/product_distributions.csv':(b'DD000206',b'DD000207',b'DD000208',b'DD000209',b'DD000210',b'DD000211',b'DD000212')}.items():
              base=subprocess.check_output(['git','show',f'origin/main:{path}']); cur=Path(path).read_bytes()
              assert cur.startswith(base), f'baseline bytes changed in {path}'
              tail=cur[len(base):]
              for i in ids: assert i in tail
          print(f'READBACK resources={len(r)} products={len(p)} distributions={len(d)}')

      - name: Remove one-shot workflows and commit materialized batch
        run: |
          rm -f .github/workflows/one-shot-ibge-atlas-territorial.yml
          rm -f .github/workflows/one-shot-ibge-atlas-territorial-retry.yml
          rm -f .github/workflows/one-shot-ibge-atlas-territorial-final.yml
          rm -f .github/workflows/one-shot-ibge-atlas-territorial-append-safe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Expand verified IBGE territorial analyses and atlases"
          git push origin HEAD:audit/ibge-atlas-territorial-20260816
