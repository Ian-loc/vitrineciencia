name: QA/QC link roles once

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'qaqc-link-roles-20260819-2' || github.ref_name == 'qaqc-link-roles-20260819-2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qaqc-link-roles-20260819-2
          fetch-depth: 0

      - name: Materializar exceções verificadas
        run: python3 scripts/qaqc_add_link_exceptions.py

      - name: Validar catálogo e artefato
        run: |
          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_schema_identity.py
          python3 scripts/audit_descriptive_fields.py
          python3 scripts/build_catalog.py
          python3 scripts/build_public_discovery.py
          python3 scripts/report_normalization_coverage.py
          python3 scripts/audit_link_roles.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Confirmar escopo sem expansão
        run: |
          git diff -- data/data_resources.csv data/data_products.csv data/product_distributions.csv
          test -z "$(git status --short data/data_resources.csv data/data_products.csv data/product_distributions.csv)"

      - name: Remover artefatos one-shot e persistir QA
        run: |
          git rm scripts/qaqc_add_link_exceptions.py .github/workflows/qaqc-link-roles-once.yml
          git add data/link_role_exceptions.json data/link_role_audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Resolve verified SIRENE and IpeaData link roles"
          git push origin HEAD:qaqc-link-roles-20260819-2
