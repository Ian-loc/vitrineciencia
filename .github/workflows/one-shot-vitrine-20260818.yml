          DIST = ROOT/'data/product_distributions.csv'
          PRI = ROOT/'data/brazil_scope_priorities.json'
          VERIFIED = '2026-08-18'

          def read_rows(path):
              with path.open('r', encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))

          def append_dicts(path, rows):
              if not rows: return
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames
              missing = sorted(set().union(*(set(r) for r in rows)) - set(fields))
              if missing:
                  raise SystemExit(f'Unexpected fields for {path}: {missing}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  for row in rows:
                      w.writerow({k: row.get(k, '') for k in fields})

