name: One-shot ONS catalog materializer
on:
  push:
    paths:
      - '.github/workflows/oneshot-ons-catalog.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize ONS source, products and distributions
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          root=Path('.')
          def read_csv(path):
              with open(path,encoding='utf-8',newline='') as f:
                  r=csv.DictReader(f); return r.fieldnames,list(r)
          def write_csv(path,fields,rows):
              with open(path,'w',encoding='utf-8',newline='') as f:
                  w=csv.DictWriter(f,fieldnames=fields,lineterminator='\n'); w.writeheader(); w.writerows(rows)

          rf, resources=read_csv('data/data_resources.csv')
          pf, products=read_csv('data/data_products.csv')
          df, dists=read_csv('data/product_distributions.csv')
          assert 'DR0122' not in {r['resource_id'] for r in resources}
          existing_urls={r['product_page_url'] for r in products}

          resource={
            'resource_id':'DR0122','resource_name':'Portal de Dados Abertos do Operador Nacional do Sistema Elétrico — ONS','acronym':'ONS Dados Abertos',
            'official_identity':'Portal oficial de dados abertos do Operador Nacional do Sistema Elétrico — ONS',
            'description':'Fonte institucional para dados históricos e correntes da operação do Sistema Interligado Nacional, incluindo carga, geração, hidrologia energética, intercâmbios, restrições operativas e indicadores consolidados.',
            'homepage_url':'https://www.ons.org.br/','data_access_url':'https://dados.ons.org.br/',
            'research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados',
            'keywords':'ONS | Sistema Interligado Nacional | carga | geração | hidrologia | reservatórios | intercâmbio | constrained-off | operação elétrica',
            'data_product_types':'séries operacionais | dados históricos | indicadores | cadastros | dados hidrológicos | APIs',
            'data_formats':'CSV | XLSX | PARQUET | JSON | PDF | API; varia conforme conjunto',
            'visualization_types':'pré-visualização CKAN | tabelas | gráficos conforme produto','geographic_coverage':'Brasil — Sistema Interligado Nacional; subsistemas, bacias, reservatórios, usinas e áreas de carga conforme produto','covers_brazil':'sim',
            'spatial_resolution':'usina, reservatório, bacia hidroenergética, subsistema, área de carga ou intercâmbio conforme produto',
            'temporal_coverage':'séries históricas e dados correntes; início varia por conjunto e vários produtos incluem arquivos de 2026','temporal_resolution':'semi-horária | horária | diária | mensal conforme produto',
            'data_sources':'telemetria e sistemas de supervisão do ONS | agentes de geração | medições e dados CCEE | modelos e processos operativos do ONS','free_download':'sim',
            'access_conditions':'acesso público; dados sujeitos a consistência e revisão recorrentes; preservar dicionário, período, unidade, modalidade operativa e versão','programmatic_access':'sim',
            'access_protocols':'HTTPS download | CKAN API | API em conjuntos selecionados','authentication_required':'não','access_documentation_url':'https://dados.ons.org.br/',
            'license':'Creative Commons Atribuição (CC BY) no Portal de Dados Abertos do ONS','institutional_status':'público','owner_or_manager':'Operador Nacional do Sistema Elétrico — ONS',
            'academic_uses':'Operação do SIN, hidrologia energética, integração de renováveis, curtailment, segurança energética, séries de carga e geração, planejamento e validação de modelos energéticos.',
            'limitations':'Dados operacionais e históricos podem ser revisados após publicação. Observações verificadas, dados não consistidos, previsões, programação, estimativas e indicadores derivados são objetos distintos; a cobertura representa o universo monitorado/coordenado pelo ONS e não toda instalação elétrica existente no Brasil.',
            'academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://dados.ons.org.br/about','academic_evidence_note':'O portal oficial documenta acesso aberto, reuso, formatos estruturados e conjuntos históricos da operação do Sistema Interligado Nacional.',
            'verification_url':'https://dados.ons.org.br/organization/ons','last_verified':'2026-08-18'
          }
          assert set(resource)==set(rf), (set(rf)-set(resource),set(resource)-set(rf))
          resources.append(resource)

          common={
            'resource_id':'DR0122','research_areas':'Planejamento Territorial e Políticas Públicas | Ciências Ambientais e Ecologia | Infraestruturas e Ciência de Dados',
            'geographic_coverage':'Brasil — Sistema Interligado Nacional, com recorte conforme produto','covers_brazil':'sim','update_frequency':'operacional/periódica conforme conjunto','product_status':'ativo','enumeration_scope':'complete','last_verified':'2026-08-18'
          }
          specs=[
          ('DP000587','Carga de Energia Verificada','Carga verificada','Carga e demanda elétrica','dataset_series','Carga verificada em periodicidade semi-horária por área de carga, incluindo componentes supervisionadas pelo ONS, medição de diferentes modalidades de geração/intercâmbio, parcela de geração Tipo III, MMGD, redução de demanda e consistências usadas em previsão.','carga | demanda | MMGD | medição | área de carga | SIN','área de carga e componentes','semi-horária','série operacional; conjunto atualizado no portal até 2025/2026 conforme recurso','semi-horária','série corrente','https://dados.ons.org.br/dataset/carga-energia-verificada','https://dados.ons.org.br/dataset/carga-energia-verificada','misto','Carga verificada combina componentes de origens distintas e pode sofrer consistência/revisão. Não equivale automaticamente a consumo faturado ou demanda de todos os consumidores.'),
          ('DP000588','Carga de Energia Diária por Subsistema','Carga diária ONS','Carga e demanda elétrica','dataset_series','Série diária de carga de energia por subsistema em MWmed, cuja metodologia incorporou progressivamente previsão de usinas não despachadas e, desde 29/04/2023, estimativa de MMGD.','carga | subsistema | MWmed | MMGD | série diária','subsistema','diária','série histórica com mudança metodológica documentada em 2021 e 2023','diária','série corrente 2026','https://dados.ons.org.br/dataset/carga-energia','https://dados.ons.org.br/dataset/carga-energia','misto','Há quebras metodológicas: até fev/2021, mar/2021–abr/2023 e desde 29/04/2023 usam componentes diferentes. MMGD é estimada; não concatenar períodos como série homogênea sem ajuste.'),
          ('DP000589','Geração por Usina em Base Horária','Geração por Usina','Geração elétrica observada e estimada','dataset_series','Geração verificada de usinas e conjuntos de usinas e geração prevista para grupos de pequenas usinas, em base horária, com arquivos históricos desde 2000.','geração | usina | conjuntos | pequenas usinas | horário','usina, conjunto ou grupo de pequenas usinas','horária','2000–presente; arquivos mensais a partir de 2022','horária','arquivos até julho de 2026 auditados','https://dados.ons.org.br/dataset/geracao-usina-2','https://dados.ons.org.br/dataset/geracao-usina-2','misto','A série mistura geração verificada para usinas/conjuntos monitorados e previsão para grupos de pequenas usinas Tipo III; esses componentes não devem ser tratados como equivalentes.'),
          ('DP000590','Dados Hidráulicos por Reservatório — Base diária','Hidráulicos diários','Hidrologia energética de reservatórios','dataset_series','Dados hidráulicos verificados e consolidados pelo ONS por reservatório em periodicidade diária, com múltiplas atualizações intradiárias do portal.','reservatório | hidrologia | nível | vazão | volume | diário','reservatório','diária','série histórica e dados correntes','diária','arquivos 2026 disponíveis','https://dados.ons.org.br/dataset/dados-hidrologicos-res','https://dados.ons.org.br/dataset/dados-hidrologicos-res','primário','São dados consolidados no contexto operacional do ONS e sujeitos a consistência recorrente. Variáveis hidráulicas e unidades devem ser interpretadas pelo dicionário; não equivalem diretamente a disponibilidade hídrica natural da bacia.'),
          ('DP000591','Dados Hidráulicos por Reservatório — Base horária','Hidráulicos horários','Hidrologia energética de reservatórios','dataset_series','Dados hidráulicos horários recebidos dos agentes de geração, publicados como réplica não consistida e atualizados aproximadamente a cada 15 minutos.','reservatório | hidrologia | horário | agentes de geração | telemetria','reservatório','horária','série corrente e histórica conforme arquivos','horária','arquivos 2026 disponíveis','https://dados.ons.org.br/dataset/dados_hidrologicos_ho','https://dados.ons.org.br/dataset/dados_hidrologicos_ho','primário','Produto explicitamente não consistido: pode conter lacunas e alterações posteriores. Não substituir a base diária verificada nem tratar valores horários como consolidados.'),
          ('DP000592','ENA Diário por Bacia Hidroenergética','ENA por Bacia','Energia Natural Afluente','dataset_series','Energia Natural Afluente bruta e armazenável em base diária agregada por bacias hidroenergéticas, calculada a partir de vazões naturais e produtividades das usinas.','ENA | energia natural afluente | vazão natural | bacia hidroenergética','bacia hidroenergética','diária','série histórica e corrente','diária','arquivos 2026 disponíveis','https://dados.ons.org.br/dataset/ena-diario-por-bacia','https://dados.ons.org.br/dataset/ena-diario-por-bacia','derivado','ENA é uma grandeza energética derivada de vazões naturais e produtividades, não vazão observada nem disponibilidade hídrica em volume. A ENA armazenável desconta vertimentos e depende da representação do sistema.'),
          ('DP000593','EAR Diário por Subsistema','EAR por Subsistema','Energia Armazenada','dataset_series','Energia Armazenada diária por subsistema, associada ao volume de água disponível nos reservatórios e ao potencial de conversão em energia ao longo das cascatas.','EAR | energia armazenada | reservatórios | subsistema | hidrelétrica','subsistema','diária','série histórica e corrente','diária','arquivos 2026 disponíveis','https://dados.ons.org.br/dataset/ear-diario-por-subsistema','https://dados.ons.org.br/dataset/ear-diario-por-subsistema','derivado','EAR é grandeza energética derivada do armazenamento e da produtividade ao longo da cascata; não equivale a volume físico total de água nem a armazenamento ambiental da bacia.'),
          ('DP000594','Dados de Intercâmbio de Energia por Modalidade','Intercâmbio por Modalidade','Intercâmbio de energia','dataset_series','Histórico horário de intercâmbio de energia por modalidade, conversora e montante em MWh entre sistemas/mercados representados pelo ONS.','intercâmbio | energia | conversora | MWh | SIN','conversora/modalidade de intercâmbio','horária','série histórica e arquivos 2026','horária','arquivos 2026 disponíveis','https://dados.ons.org.br/dataset/intercambio_modalidade','https://dados.ons.org.br/dataset/intercambio_modalidade','primário','Intercâmbio físico/contabilizado por modalidade não deve ser confundido com geração, carga local ou fluxo em toda linha de transmissão. Dados podem ser revisados após publicação.'),
          ('DP000595','Restrição de Operação por Constrained-off de Usinas Eólicas','Constrained-off Eólico','Restrições operativas de renováveis','dataset_series','Informações de apuração das restrições de operação por constrained-off em usinas eólicas classificadas nas modalidades operativas Tipo I, II-B e II-C.','constrained-off | eólica | curtailment | restrição operativa | usina','usina/modalidade operativa','mensal com registros operacionais internos ao período','série histórica; arquivos mensais 2026','mensal/registro','arquivos até julho de 2026 auditados','https://dados.ons.org.br/dataset/restricao_coff_eolica_usi','https://dados.ons.org.br/dataset/restricao_coff_eolica_usi','derivado','Constrained-off é apuração de restrição operacional no universo de usinas/modalidades coberto pelo ONS; não equivale automaticamente a potencial eólico perdido, dano econômico ou restrição ambiental.'),
          ('DP000596','Restrição de Operação por Constrained-off de Usinas Fotovoltaicas','Constrained-off Solar','Restrições operativas de renováveis','dataset_series','Informações de apuração das restrições de operação por constrained-off em usinas fotovoltaicas classificadas nas modalidades operativas Tipo I, II-B e II-C.','constrained-off | solar | fotovoltaica | curtailment | restrição operativa','usina/modalidade operativa','mensal com registros operacionais internos ao período','série histórica; arquivos mensais 2026','mensal/registro','arquivos até julho de 2026 auditados','https://dados.ons.org.br/dataset/restricao_coff_fotovoltaica','https://dados.ons.org.br/dataset/restricao_coff_fotovoltaica','derivado','Constrained-off é apuração operacional para o universo coberto pelo ONS; não equivale a irradiância perdida, potencial solar ou impacto econômico/ambiental sem análise adicional.'),
          ('DP000597','Fator de Capacidade de Geração Eólica e Solar','Fator de Capacidade Eólico/Solar','Desempenho de geração renovável','indicator_family','Fator de capacidade horário de usinas e conjuntos eólicos e solares despachados pelo ONS, calculado como relação entre geração e capacidade instalada.','fator de capacidade | eólica | solar | geração | capacidade instalada','usina ou conjunto de usinas','horária','2009–presente; arquivos mensais a partir de 2022','horária','arquivos até julho de 2026 auditados','https://dados.ons.org.br/dataset/fator-capacidade-2','https://dados.ons.org.br/dataset/fator-capacidade-2','derivado','Fator de capacidade é razão entre geração e capacidade instalada; não é fator de disponibilidade, recurso meteorológico bruto ou eficiência física do equipamento. Universo restrito às usinas/conjuntos cobertos.'),
          ('DP000598','Energia Vertida Turbinável','Energia Vertida Turbinável','Vertimento e hidrologia energética','dataset_series','Energia vertida turbinável consolidada pelo ONS por reservatório em periodicidade horária, com arquivos mensais individualizados a partir de 2024.','vertimento | reservatório | energia vertida | hidrelétrica | horário','reservatório','horária','série histórica; arquivos mensais desde 2024 e recursos 2026','horária','arquivos até julho de 2026 auditados','https://dados.ons.org.br/dataset/energia-vertida-turbinavel','https://dados.ons.org.br/dataset/energia-vertida-turbinavel','derivado','Energia vertida turbinável é uma grandeza energética consolidada; não equivale diretamente ao volume vertido, vazão natural, dano ambiental ou energia que necessariamente poderia ter sido gerada sob qualquer condição operacional.')]
          for vals in specs:
              keys=['product_id','product_name','product_acronym','product_family','product_kind','product_description','keywords','spatial_support','spatial_resolution','temporal_coverage','temporal_resolution','version_or_collection','product_page_url','methodology_url','primary_or_derived','limitations']
              r=common.copy(); r.update(dict(zip(keys,vals)))
              assert r['product_page_url'] not in existing_urls, r['product_page_url']
              assert set(r)==set(pf), (r['product_id'], set(pf)-set(r),set(r)-set(pf))
              products.append(r); existing_urls.add(r['product_page_url'])

          urls={p['product_id']:p['product_page_url'] for p in products if p['product_id'].startswith('DP0005')}
          newp=[p for p in products if int(p['product_id'][2:])>=587]
          for i,p in enumerate(newp, start=612):
              d={
                'distribution_id':f'DD{i:06d}','product_id':p['product_id'],'distribution_name':p['product_name']+' — portal e arquivos oficiais',
                'access_url':p['product_page_url'],'format':'CSV | XLSX | PARQUET | JSON | PDF; API quando indicada no conjunto','access_protocol':'HTTPS download | CKAN','access_tool':'navegador web | CKAN/API conforme conjunto',
                'free_download':'sim','authentication_required':'não','access_conditions':'acesso público; dados sujeitos a consistência e revisão conforme aviso do conjunto','license':'Creative Commons Atribuição (CC BY)','provider_attribution_required':'sim','subset_support':'por período e recorte conforme recursos do conjunto','notes':'Usar o dicionário de dados e preservar período, unidade, agregação, modalidade operacional e eventuais revisões do ONS.','last_verified':'2026-08-18'}
              assert set(d)==set(df), (d['distribution_id'],set(df)-set(d),set(d)-set(df))
              dists.append(d)

          write_csv('data/data_resources.csv',rf,resources)
          write_csv('data/data_products.csv',pf,products)
          write_csv('data/product_distributions.csv',df,dists)

          pp=Path('data/brazil_scope_priorities.json')
          reg=json.loads(pp.read_text(encoding='utf-8'))
          p0=next(t for t in reg['tiers'] if t['priority_tier']=='P0')['resource_ids']
          if 'DR0122' not in p0: p0.append('DR0122')
          reg['reviewed_at']='2026-08-18'
          pp.write_text(json.dumps(reg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # hard relational read-back
          _,rr=read_csv('data/data_resources.csv'); _,pr=read_csv('data/data_products.csv'); _,dd=read_csv('data/product_distributions.csv')
          rids={r['resource_id'] for r in rr}; pids={p['product_id'] for p in pr}
          assert len(rids)==len(rr) and len(pids)==len(pr) and len({d['distribution_id'] for d in dd})==len(dd)
          assert all(p['resource_id'] in rids for p in pr)
          assert all(d['product_id'] in pids for d in dd)
          assert all(x in pids for x in [f'DP{i:06d}' for i in range(587,599)])
          assert all(x in {d['distribution_id'] for d in dd} for x in [f'DD{i:06d}' for i in range(612,624)])
          print('COUNTS',len(rr),len(pr),len(dd))
          PY
      - name: Validate catalog and Vitrine
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check
      - name: Commit materialized batch
        run: |
          git config user.name 'vitrine-catalog-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/brazil_scope_priorities.json data/data_products.json
          git status --short
          git commit -m 'Expand verified ONS operational catalog'
          git push origin HEAD:main
