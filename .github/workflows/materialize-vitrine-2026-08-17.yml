              'product_id':'DP000308','resource_id':'DR0098','product_name':'Pesquisa Anual de Comércio — 2023','product_acronym':'PAC 2023','product_family':'Estrutura do comércio','product_kind':'dataset_series',
              'product_description':'Pesquisa estrutural anual por empresas comerciais formalmente constituídas, com informações sobre pessoal ocupado, salários, receitas, custos e despesas, margem de comercialização, estoques, unidades locais e valor adicionado.',
              'research_areas':'Economics | Labour | Economic geography | Regional development','keywords':'comércio | empresas | receita | emprego | salários | margem de comercialização | CNAE | PAC',
              'geographic_coverage':'Brasil; Grandes Regiões e Unidades da Federação conforme tabela','covers_brazil':'sim','spatial_support':'empresa | unidade local | agregações setoriais e territoriais','spatial_resolution':'empresa/unidade local agregada; UF e atividade conforme tabela',
              'temporal_coverage':'ano de referência 2023; série histórica anual','temporal_resolution':'anual','update_frequency':'anual','product_status':'ativo','version_or_collection':'edição 2023 — última edição materialmente verificada nesta auditoria','enumeration_scope':'complete',
              'product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9075-pesquisa-anual-de-comercio.html','methodology_url':'https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/PB','primary_or_derived':'primário',
              'limitations':'Pesquisa amostral de empresas comerciais formalmente constituídas; não representa comércio informal. A edição 2024 constava do calendário de 2026, mas não foi promovida porque a página oficial auditada ainda materializa 2023. Comparações exigem observar CNAE, plano tabular e política de revisão.','last_verified':TODAY
            },
            {
              'product_id':'DP000309','resource_id':'DR0098','product_name':'Pesquisa Anual de Serviços — 2023','product_acronym':'PAS 2023','product_family':'Estrutura dos serviços não financeiros','product_kind':'dataset_series',
              'product_description':'Pesquisa estrutural anual sobre empresas prestadoras de serviços não financeiros, com pessoal ocupado, salários, receitas, despesas, valor adicionado e estrutura regional/setorial segundo a CNAE 2.0.',
              'research_areas':'Economics | Labour | Economic geography | Regional development','keywords':'serviços | empresas | receita | emprego | salários | valor adicionado | CNAE | PAS',
              'geographic_coverage':'Brasil; Grandes Regiões e Unidades da Federação conforme tabela','covers_brazil':'sim','spatial_support':'empresa | unidade local | agregações setoriais e territoriais','spatial_resolution':'empresa/unidade local agregada; UF e atividade conforme tabela',
              'temporal_coverage':'ano de referência 2023; série histórica anual','temporal_resolution':'anual','update_frequency':'anual','product_status':'ativo','version_or_collection':'edição 2023 — última edição materialmente verificada nesta auditoria','enumeration_scope':'complete',
              'product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/servicos/9028-pesquisa-anual-de-servicos.html','methodology_url':'https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/PY','primary_or_derived':'primário',
              'limitations':'Abrange serviços não financeiros e exclui Saúde e Educação conforme o escopo da pesquisa; não representa serviços informais. A edição 2024 estava prevista para agosto de 2026, mas a página oficial auditada ainda materializa 2023; não houve promoção antecipada.','last_verified':TODAY
            },
            {
              'product_id':'DP000310','resource_id':'DR0099','product_name':'Pesquisa Mensal de Comércio — série conjuntural','product_acronym':'PMC','product_family':'Indicadores mensais do comércio varejista','product_kind':'dataset_series',
              'product_description':'Pesquisa mensal por amostragem probabilística que produz índices de volume de vendas e receita nominal para acompanhar o comportamento conjuntural do comércio varejista no Brasil e nas Unidades da Federação.',
              'research_areas':'Economics | Retail studies | Economic geography | Regional development','keywords':'comércio varejista | vendas | receita nominal | volume | índice | ajuste sazonal | PMC',
