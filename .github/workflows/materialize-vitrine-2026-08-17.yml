name: Materialize verified IBGE enterprise batch 2026-08-17

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/materialize-vitrine-2026-08-17.yml"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Append verified canonical records and validate
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, json, pathlib

          ROOT = pathlib.Path('.')
          TODAY = '2026-08-17'

          def append_dict_rows(path, id_field, rows):
              path = ROOT / path
              with path.open('r', encoding='utf-8', newline='') as f:
                  reader = csv.DictReader(f)
                  fieldnames = reader.fieldnames
                  existing = {r[id_field] for r in reader}
              missing = [r for r in rows if r[id_field] not in existing]
              duplicates = [r[id_field] for r in rows if r[id_field] in existing]
              if duplicates:
                  raise SystemExit(f'IDs already exist in {path}: {duplicates}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fieldnames, lineterminator='\n', extrasaction='raise')
                  for row in missing:
                      writer.writerow(row)

          resource = {
            'resource_id':'DR0099',
            'resource_name':'Indicadores Conjunturais de Atividade Econômica — IBGE',
            'acronym':'Indicadores Conjunturais IBGE',
            'official_identity':'Família institucional de pesquisas mensais conjunturais sobre indústria, comércio e serviços do IBGE',
