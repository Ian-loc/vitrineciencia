              'temporal_coverage':'série nacional desde 2000; edição mais recente materialmente verificada: maio de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'série corrente; metodologia 6ª ed. 2023; maio de 2026 materialmente verificado','enumeration_scope':'complete',
              'product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9227-pesquisa-mensal-de-comercio.html','methodology_url':'https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/MC','primary_or_derived':'derivado',
              'limitations':'População-alvo inclui empresas varejistas formalmente constituídas com 20 ou mais pessoas ocupadas segundo os critérios da pesquisa. Os resultados são índices, não níveis absolutos de vendas; ajuste sazonal e revisões devem ser preservados. A divulgação de junho/2026 aparecia apenas como prevista na página auditada, por isso maio/2026 é a última edição materialmente verificada.','last_verified':TODAY
            },
            {
              'product_id':'DP000311','resource_id':'DR0099','product_name':'Pesquisa Mensal de Serviços — série conjuntural','product_acronym':'PMS','product_family':'Indicadores mensais de serviços','product_kind':'dataset_series',
              'product_description':'Pesquisa mensal que acompanha o comportamento conjuntural dos serviços não financeiros por meio de índices nominais e de volume, com resultados para Brasil, UFs e grupos de atividades conforme o plano de divulgação.',
              'research_areas':'Economics | Service studies | Economic geography | Regional development','keywords':'serviços | volume | receita | índice | transporte | informação | ajuste sazonal | PMS',
              'geographic_coverage':'Brasil e 27 Unidades da Federação; detalhamento por atividade varia territorialmente','covers_brazil':'sim','spatial_support':'empresa | UF | agregações por atividade','spatial_resolution':'UF; grupos/subgrupos de atividades para Brasil e subconjunto de UFs conforme metodologia',
              'temporal_coverage':'indicadores a partir de janeiro de 2012; edição mais recente materialmente verificada: maio de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'série corrente; maio de 2026 materialmente verificado','enumeration_scope':'complete',
              'product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/servicos/9229-pesquisa-mensal-de-servicos.html','methodology_url':'https://metadados.ibge.gov.br/consulta/estatisticos/operacoes-estatisticas/SC','primary_or_derived':'derivado',
              'limitations':'Investiga empresas formalmente constituídas com 20 ou mais pessoas ocupadas e atividade principal em serviços não financeiros, excluindo Saúde e Educação. Índices de volume/receita, ajustes sazonais e revisões não equivalem a níveis absolutos ou ao conjunto de serviços informais. A divulgação de junho/2026 aparecia apenas como prevista na página auditada.','last_verified':TODAY
            },
            {
              'product_id':'DP000312','resource_id':'DR0099','product_name':'Pesquisa Industrial Mensal — Produção Física','product_acronym':'PIM-PF','product_family':'Índices mensais da produção industrial','product_kind':'dataset_series',
              'product_description':'Pesquisa mensal de unidades locais industriais que levanta quantidades produzidas de produtos selecionados e gera índices de curto prazo da produção física das indústrias extrativas e de transformação, em componentes Brasil e Regional.',
              'research_areas':'Economics | Industrial ecology | Economic geography | Regional development','keywords':'produção industrial | indústria extrativa | transformação | índice | produção física | PIM-PF',
              'geographic_coverage':'Brasil; Região Nordeste e Unidades da Federação selecionadas na PIM-PF Regional','covers_brazil':'sim','spatial_support':'unidade local industrial | Brasil | região/UF | agregações por atividade','spatial_resolution':'Brasil e UFs/região elegíveis conforme participação industrial e desenho vigente',
              'temporal_coverage':'séries históricas encadeadas; série reformulada em 2023 desde janeiro de 2022; edição materialmente verificada: maio de 2026','temporal_resolution':'mensal','update_frequency':'mensal','product_status':'ativo','version_or_collection':'série reformulada em 2023; maio de 2026 materialmente verificado','enumeration_scope':'complete',
              'product_page_url':'https://www.ibge.gov.br/estatisticas/economicas/industria/9294-pesquisa-industrial-mensal-producao-fisica.html','methodology_url':'https://www.ibge.gov.br/estatisticas/economicas/industria/9294-pesquisa-industrial-mensal-producao-fisica.html','primary_or_derived':'derivado',
              'limitations':'A amostra vigente é não probabilística e cobre unidades locais formalmente constituídas das seções B e C da CNAE 2.0. O índice aproxima a evolução de curto prazo do valor adicionado industrial, não mede diretamente valor adicionado ou produção física exaustiva. Reformulações e encadeamentos de série devem ser preservados.','last_verified':TODAY
            }
          ]

          distributions = [
            {'distribution_id':'DD000329','product_id':'DP000308','distribution_name':'PAC 2023 — SIDRA, tabelas e publicação digital','access_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9075-pesquisa-anual-de-comercio.html','format':'SIDRA | XLSX | ODS | PDF | HTML','access_protocol':'HTTPS / SIDRA','access_tool':'navegador web | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; observar notas técnicas e política de revisão','license':'licença específica dos arquivos não determinada nesta auditoria','provider_attribution_required':'sim','subset_support':'por atividade, porte e recorte territorial conforme tabela','notes':'Página oficial materializa a edição 2023 e oferece plano tabular por atividade, Grandes Regiões e UFs; 2024 não foi inferida do calendário.','last_verified':TODAY},
            {'distribution_id':'DD000330','product_id':'DP000309','distribution_name':'PAS 2023 — SIDRA, tabelas e publicação digital','access_url':'https://www.ibge.gov.br/estatisticas/economicas/servicos/9028-pesquisa-anual-de-servicos.html','format':'SIDRA | XLSX | ODS | PDF | HTML','access_protocol':'HTTPS / SIDRA','access_tool':'navegador web | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; observar notas técnicas e política de revisão','license':'licença específica dos arquivos não determinada nesta auditoria','provider_attribution_required':'sim','subset_support':'por segmento/atividade e recorte territorial conforme tabela','notes':'Página oficial materializa a edição 2023; serviços não financeiros, excluindo Saúde e Educação. A edição 2024 não foi inferida do calendário.','last_verified':TODAY},
            {'distribution_id':'DD000331','product_id':'DP000310','distribution_name':'PMC — SIDRA, séries, downloads e publicação mensal','access_url':'https://www.ibge.gov.br/estatisticas/economicas/comercio/9227-pesquisa-mensal-de-comercio.html','format':'SIDRA | XLSX | ODS | PDF | HTML','access_protocol':'HTTPS / SIDRA','access_tool':'navegador web | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; resultados sujeitos à política de revisão','license':'licença específica dos arquivos não determinada nesta auditoria','provider_attribution_required':'sim','subset_support':'por período, índice, atividade e UF conforme divulgação','notes':'A página auditada materializa maio/2026; junho/2026 constava como próxima divulgação e não foi promovido sem evidência material na página.','last_verified':TODAY},
            {'distribution_id':'DD000332','product_id':'DP000311','distribution_name':'PMS — SIDRA, séries, downloads e publicação mensal','access_url':'https://www.ibge.gov.br/estatisticas/economicas/servicos/9229-pesquisa-mensal-de-servicos.html','format':'SIDRA | XLSX | ODS | PDF | HTML','access_protocol':'HTTPS / SIDRA','access_tool':'navegador web | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; resultados sujeitos à política de revisão','license':'licença específica dos arquivos não determinada nesta auditoria','provider_attribution_required':'sim','subset_support':'por período, índice, grupo de atividade e UF conforme divulgação','notes':'A página auditada materializa maio/2026; junho/2026 constava como próxima divulgação e não foi promovido sem evidência material na página.','last_verified':TODAY},
            {'distribution_id':'DD000333','product_id':'DP000312','distribution_name':'PIM-PF — SIDRA, séries Brasil/Regional e publicações mensais','access_url':'https://www.ibge.gov.br/estatisticas/economicas/industria/9294-pesquisa-industrial-mensal-producao-fisica.html','format':'SIDRA | XLSX | PDF | HTML','access_protocol':'HTTPS / SIDRA','access_tool':'navegador web | SIDRA','free_download':'sim','authentication_required':'não','access_conditions':'acesso público; observar reformulações, encadeamentos e política de revisão','license':'licença específica dos arquivos não determinada nesta auditoria','provider_attribution_required':'sim','subset_support':'por período, atividade/categoria e recorte Brasil/Regional conforme série','notes':'A página auditada materializa maio/2026 e documenta a série reformulada em 2023; componentes Brasil e Regional possuem coberturas próprias.','last_verified':TODAY}
