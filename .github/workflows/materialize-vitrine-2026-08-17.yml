            'free_download':'sim',
            'access_conditions':'aberto; observar desenho amostral, população-alvo, revisões e ajuste sazonal de cada pesquisa',
            'programmatic_access':'parcial',
            'access_protocols':'HTTPS | SIDRA',
            'authentication_required':'não',
            'access_documentation_url':'https://www.ibge.gov.br/estatisticas/economicas.html',
            'license':'não localizada no nível da família; verificar produto e arquivo',
            'institutional_status':'público',
            'owner_or_manager':'IBGE',
            'academic_uses':'Análise conjuntural de atividade econômica, ciclos setoriais, produção industrial, comércio, serviços e diferenças territoriais.',
