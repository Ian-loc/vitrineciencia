          p = ROOT / 'data/brazil_scope_priorities.json'
          registry = json.loads(p.read_text(encoding='utf-8'))
          registry['reviewed_at'] = TODAY
          p0 = next(t for t in registry['tiers'] if t['priority_tier'] == 'P0')
          if 'DR0099' not in p0['resource_ids']:
              p0['resource_ids'].append('DR0099')
          p.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Deterministic relational read-back before the project validators.
          def read_csv(path):
              with open(path, encoding='utf-8', newline='') as f:
                  return list(csv.DictReader(f))
          rs, ps, ds = read_csv('data/data_resources.csv'), read_csv('data/data_products.csv'), read_csv('data/product_distributions.csv')
          rids, pids, dids = {r['resource_id'] for r in rs}, {r['product_id'] for r in ps}, {r['distribution_id'] for r in ds}
          assert len(rids) == len(rs) and len(pids) == len(ps) and len(dids) == len(ds)
          assert all(r['resource_id'] in rids for r in ps)
          assert all(r['product_id'] in pids for r in ds)
          assert all(x in pids for x in ['DP000308','DP000309','DP000310','DP000311','DP000312'])
          assert all(x in dids for x in ['DD000329','DD000330','DD000331','DD000332','DD000333'])
          print(f'READBACK resources={len(rs)} products={len(ps)} distributions={len(ds)}')
          PY

          python3 scripts/validate_brazil_scope.py
          python3 scripts/validate_product_catalog.py
          python3 scripts/build_catalog.py
          python3 scripts/audit_link_roles.py --write
          python3 scripts/validate_product_catalog.py
          python3 scripts/validate_vitrine.py
          python3 scripts/build_site_artifact.py
          git diff --check

      - name: Commit canonical batch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "vitrine-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/materialize-vitrine-2026-08-17.yml
          git add data/data_resources.csv data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json data/brazil_scope_priorities.json
          git diff --cached --check
          git commit -m "Expand verified IBGE enterprise indicators catalog"
          git push origin HEAD:main
