            'homepage_url':'https://www.ibge.gov.br/estatisticas/economicas.html',
            'data_access_url':'https://www.ibge.gov.br/estatisticas/economicas.html',
            'research_areas':'Planejamento Territorial e Políticas Públicas | Infraestruturas e Ciência de Dados',
            'keywords':'conjuntura | indústria | comércio | serviços | índices mensais | produção | vendas | receita',
            'data_product_types':'indicadores | séries mensais | SIDRA | publicações',
            'data_formats':'SIDRA | XLSX | ODS | PDF | HTML; varia por pesquisa',
            'visualization_types':'tabelas | séries | gráficos | publicações digitais',
            'geographic_coverage':'Brasil; Unidades da Federação e atividades selecionadas conforme pesquisa',
            'covers_brazil':'sim',
            'spatial_resolution':'empresa/unidade local e agregações setoriais/territoriais conforme pesquisa',
