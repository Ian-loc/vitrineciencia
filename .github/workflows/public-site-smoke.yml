name: Verificar Vitrine publicada

on:
  workflow_run:
    workflows: ["Validar e publicar Vitrine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Só a publicação mais recente é relevante. Sem concorrência global, um smoke
# antigo pode começar depois de um deploy mais novo e comparar o site atual
# com o SHA anterior, gerando falso negativo. Um novo run cancela o anterior.
concurrency:
  group: vitrine-public-site-smoke
  cancel-in-progress: true

jobs:
  public-site-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # Em workflow_run, valide exatamente o commit que acabou de ser publicado.
          # Isso evita falso negativo quando a main avança antes do smoke iniciar.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Verificar endpoints públicos após deploy
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$url" -o "$output"
          }

          fetch "$SITE/" "$tmp/index.html"
          fetch "$SITE/products.html" "$tmp/products.html"
          fetch "$SITE/analytics.html" "$tmp/analytics.html"
          fetch "$SITE/about.html" "$tmp/about.html"
          fetch "$SITE/assets/visual-refinement.css" "$tmp/visual-refinement.css"
          fetch "$SITE/assets/app.js" "$tmp/app.js"
          fetch "$SITE/assets/products.js" "$tmp/products.js"
          fetch "$SITE/assets/analytics.js" "$tmp/analytics.js"
          fetch "$SITE/data/data_resources.json" "$tmp/resources.json"
          fetch "$SITE/data/data_products.json" "$tmp/products.json"

          grep -q 'Vitrine Ciência' "$tmp/index.html"
          grep -q 'id="filters"' "$tmp/index.html"
          grep -q 'assets/visual-refinement.css' "$tmp/index.html"
          grep -q 'assets/visual-refinement.css' "$tmp/products.html"
          grep -q 'assets/visual-refinement.css' "$tmp/analytics.html"
          grep -q 'assets/visual-refinement.css' "$tmp/about.html"
          grep -q -- '--vr-forest' "$tmp/visual-refinement.css"
          grep -q 'id="product-filters"' "$tmp/products.html"
          grep -q 'id="summary"' "$tmp/analytics.html"
          grep -q 'assets/analytics.js' "$tmp/analytics.html"
          grep -q 'id="sobre"' "$tmp/about.html"
          grep -q 'data/data_resources.json' "$tmp/app.js"
          grep -q 'data/data_products.json' "$tmp/products.js"
          grep -q 'data/data_resources.json' "$tmp/analytics.js"

          # A identidade pública precisa apontar para a URL canônica atual em
          # todas as páginas, inclusive após o deploy no Pages.
          grep -Fq '<link rel="canonical" href="https://ian-loc.github.io/vitrineciencia/">' "$tmp/index.html"
          grep -Fq '<meta property="og:url" content="https://ian-loc.github.io/vitrineciencia/">' "$tmp/index.html"
          for page in products analytics about; do
            grep -Fq "<link rel=\"canonical\" href=\"$SITE/$page.html\">" "$tmp/$page.html"
            grep -Fq "<meta property=\"og:url\" content=\"$SITE/$page.html\">" "$tmp/$page.html"
          done
          grep -Fq '"@type":"DataCatalog"' "$tmp/index.html"
          grep -Fq 'https://orcid.org/0000-0003-1164-9318' "$tmp/index.html"

          python3 - "$tmp/resources.json" "$tmp/products.json" <<'PY'
          import csv, json, sys

          public_resources = json.load(open(sys.argv[1], encoding='utf-8'))
          public_products = json.load(open(sys.argv[2], encoding='utf-8'))
          expected_resources_json = json.load(open('data/data_resources.json', encoding='utf-8'))
          expected_products_json = json.load(open('data/data_products.json', encoding='utf-8'))

          with open('data/data_resources.csv', encoding='utf-8', newline='') as f:
              expected_resources = list(csv.DictReader(f))
          with open('data/data_products.csv', encoding='utf-8', newline='') as f:
              expected_products = list(csv.DictReader(f))
          with open('data/product_distributions.csv', encoding='utf-8', newline='') as f:
              expected_distributions = list(csv.DictReader(f))

          def ids(rows, field):
              values = [item[field] for item in rows]
              assert len(values) == len(set(values)), f'duplicate {field}'
              return set(values)

          assert isinstance(public_resources, list)
          assert isinstance(public_products, list)
          assert ids(public_resources, 'resource_id') == ids(expected_resources, 'resource_id')
          assert ids(public_products, 'product_id') == ids(expected_products, 'product_id')

          assert public_resources == expected_resources_json, (
              'data_resources.json público diverge integralmente do derivado versionado do commit publicado'
          )
          assert public_products == expected_products_json, (
              'data_products.json público diverge integralmente do derivado versionado do commit publicado'
          )

          expected_by_product = {}
          for row in expected_distributions:
              expected_by_product.setdefault(row['product_id'], set()).add(row['distribution_id'])

          published_distributions = []
          published_by_product = {}
          for product in public_products:
              distributions = product.get('distributions')
              assert isinstance(distributions, list) and distributions, (
                  f"{product['product_id']}: distributions ausentes/vazias no JSON público"
              )
              for distribution in distributions:
                  assert distribution.get('product_id') == product['product_id'], (
                      f"{distribution.get('distribution_id')}: product_id divergente no JSON público"
                  )
                  published_distributions.append(distribution)
                  published_by_product.setdefault(product['product_id'], set()).add(
                      distribution['distribution_id']
                  )

          assert ids(published_distributions, 'distribution_id') == ids(
              expected_distributions, 'distribution_id'
          )
          assert published_by_product == expected_by_product, (
              'mapeamento produto→distribuição publicado diverge do CSV canônico'
          )

          print(
              'OK: Vitrine publicada corresponde integralmente ao commit canônico publicado — '
              f'{len(public_resources)} fontes, {len(public_products)} produtos, '
              f'{len(published_distributions)} distribuições'
          )
          PY

      - name: Confirmar fronteira pública
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
        run: |
          set -euo pipefail
          for path in \
            explorer.html \
            abordagens.html \
            data/federated_layers.json \
            data/data_resources.csv \
            data/data_products.csv \
            data/product_distributions.csv; do
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' "$SITE/$path")"
            test "$code" = "404"
          done
