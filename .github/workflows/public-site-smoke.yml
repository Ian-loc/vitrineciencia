name: Verificar Vitrine publicada

on:
  workflow_run:
    workflows: ["Validar e publicar Vitrine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-site-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Verificar endpoints públicos após deploy
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$url" -o "$output"
          }

          fetch "$SITE/" "$tmp/index.html"
          fetch "$SITE/products.html" "$tmp/products.html"
          fetch "$SITE/analytics.html" "$tmp/analytics.html"
          fetch "$SITE/about.html" "$tmp/about.html"
          fetch "$SITE/assets/visual-refinement.css" "$tmp/visual-refinement.css"
          fetch "$SITE/assets/app.js" "$tmp/app.js"
          fetch "$SITE/assets/products.js" "$tmp/products.js"
          fetch "$SITE/assets/analytics.js" "$tmp/analytics.js"
          fetch "$SITE/data/data_resources.json" "$tmp/resources.json"
          fetch "$SITE/data/data_products.json" "$tmp/products.json"

          grep -q 'Vitrine Ciência' "$tmp/index.html"
          grep -q 'id="filters"' "$tmp/index.html"
          grep -q 'assets/visual-refinement.css' "$tmp/index.html"
          grep -q 'assets/visual-refinement.css' "$tmp/products.html"
          grep -q 'assets/visual-refinement.css' "$tmp/analytics.html"
          grep -q 'assets/visual-refinement.css' "$tmp/about.html"
          grep -q -- '--vr-forest' "$tmp/visual-refinement.css"
          grep -q 'id="product-filters"' "$tmp/products.html"
          grep -q 'id="summary"' "$tmp/analytics.html"
          grep -q 'assets/analytics.js' "$tmp/analytics.html"
          grep -q 'id="sobre"' "$tmp/about.html"
          grep -q 'data/data_resources.json' "$tmp/app.js"
          grep -q 'data/data_products.json' "$tmp/products.js"
          grep -q 'data/data_resources.json' "$tmp/analytics.js"

          python3 - "$tmp/resources.json" "$tmp/products.json" <<'PY'
          import csv, json, sys

          public_resources = json.load(open(sys.argv[1], encoding='utf-8'))
          public_products = json.load(open(sys.argv[2], encoding='utf-8'))

          with open('data/data_resources.csv', encoding='utf-8', newline='') as f:
              expected_resources = list(csv.DictReader(f))
          with open('data/data_products.csv', encoding='utf-8', newline='') as f:
              expected_products = list(csv.DictReader(f))

          def ids(rows, field):
              values = [item[field] for item in rows]
              assert len(values) == len(set(values)), f'duplicate {field}'
              return set(values)

          assert isinstance(public_resources, list)
          assert isinstance(public_products, list)
          assert ids(public_resources, 'resource_id') == ids(expected_resources, 'resource_id')
          assert ids(public_products, 'product_id') == ids(expected_products, 'product_id')

          print(
              'OK: Vitrine publicada corresponde ao catálogo público canônico — '
              f'{len(public_resources)} fontes, {len(public_products)} produtos'
          )
          PY

      - name: Confirmar fronteira pública
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
        run: |
          set -euo pipefail
          for path in \
            explorer.html \
            abordagens.html \
            data/federated_layers.json \
            data/data_resources.csv \
            data/data_products.csv \
            data/product_distributions.csv; do
            code="$(curl --silent --location --output /dev/null --write-out '%{http_code}' "$SITE/$path")"
            test "$code" = "404"
          done
