name: Verificar Vitrine publicada

on:
  workflow_run:
    workflows: ["Validar e publicar Vitrine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrine-public-site-smoke
  cancel-in-progress: true

jobs:
  public-site-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Verificar endpoints públicos após deploy
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
          TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$url" -o "$output"
          }

          ready=0
          for attempt in {1..20}; do
            if fetch "$SITE/?v=$TARGET_SHA-$attempt" "$tmp/index.html" && grep -q 'Compare cobertura, responsável e acesso' "$tmp/index.html"; then
              ready=1
              break
            fi
            sleep 3
          done
          if [ "$ready" -ne 1 ]; then
            echo "ERRO: publicação ainda não expõe a versão esperada da interface"
            exit 1
          fi

          fetch "$SITE/sources.html?v=$TARGET_SHA" "$tmp/sources.html"
          fetch "$SITE/products.html?v=$TARGET_SHA" "$tmp/products.html"
          fetch "$SITE/about.html?v=$TARGET_SHA" "$tmp/about.html"
          fetch "$SITE/assets/discovery-guardrails.js?v=$TARGET_SHA" "$tmp/discovery-guardrails.js"
          fetch "$SITE/assets/public-interface-guardrails.js?v=$TARGET_SHA" "$tmp/public-interface-guardrails.js"
          fetch "$SITE/assets/static-catalog-51.js?v=$TARGET_SHA" "$tmp/static-catalog-51.js"
          fetch "$SITE/assets/source-discovery-v2.js?v=$TARGET_SHA" "$tmp/source-discovery-v2.js"
          fetch "$SITE/assets/product-filter-ux.js?v=$TARGET_SHA" "$tmp/product-filter-ux.js"
          fetch "$SITE/assets/home.js?v=$TARGET_SHA" "$tmp/home.js"
          fetch "$SITE/data/data_resources.json?v=$TARGET_SHA" "$tmp/resources.json"
          fetch "$SITE/data/data_products.json?v=$TARGET_SHA" "$tmp/products.json"
          fetch "$SITE/data/applied_priority_gate.json?v=$TARGET_SHA" "$tmp/applied-priority.json"

          grep -q 'Que fenômeno ou processo você quer investigar?' "$tmp/index.html"
          grep -q 'action="sources.html"' "$tmp/index.html"
          grep -q '51 registros para descoberta' "$tmp/index.html"
          grep -q 'Da pergunta ao dado em três decisões' "$tmp/index.html"
          grep -q 'fontes com dados/download localizados' "$tmp/index.html"
          grep -q 'applied_priority_gate.json' "$tmp/home.js"

          grep -q 'Encontre o dado certo a partir da sua pergunta' "$tmp/sources.html"
          grep -q 'id="source-theme-shortcut"' "$tmp/sources.html"
          grep -q 'id="coverage"' "$tmp/sources.html"
          grep -q 'id="information"' "$tmp/sources.html"
          grep -q 'id="access-role"' "$tmp/sources.html"
          grep -q 'Tipo de informação' "$tmp/sources.html"
          grep -q 'Forma de acesso' "$tmp/sources.html"
          grep -q 'quando o acesso foi verificado' "$tmp/sources.html"
          grep -q 'verification-line' "$tmp/public-interface-guardrails.js"
          grep -q 'PUBLIC_ACTIONS' "$tmp/public-interface-guardrails.js"
          grep -q 'static_core_51_access_audit.json' "$tmp/source-discovery-v2.js"
          grep -q 'normalize("NFD")' "$tmp/source-discovery-v2.js"

          grep -q 'Subconjunto de 11 itens descritos em detalhe' "$tmp/products.html"
          grep -q '19 rotas associadas' "$tmp/products.html"
          grep -q 'id="product-theme"' "$tmp/products.html"
          grep -q 'id="product-coverage"' "$tmp/products.html"
          grep -q 'id="product-kind"' "$tmp/products.html"
          grep -q 'id="product-access"' "$tmp/products.html"
          grep -q 'disabled = unavailable' "$tmp/product-filter-ux.js"
          grep -q 'hidden = unavailable' "$tmp/product-filter-ux.js"

          ! grep -E -q 'arquitetura científica interna|Fonte → Produto → Distribuição|snapshot candidato|Decisão arquitetural|Direção experimental|termos controlados|busca textual livre' \
            "$tmp/index.html" "$tmp/products.html" "$tmp/sources.html" "$tmp/about.html"
          ! grep -E -q 'data/quarantine|v1.0.0-expanded' \
            "$tmp/index.html" "$tmp/products.html" "$tmp/sources.html" "$tmp/about.html"

          python3 - "$tmp/resources.json" "$tmp/products.json" "$tmp/applied-priority.json" <<'PY'
          import json, sys
          resources = json.load(open(sys.argv[1], encoding='utf-8'))
          products = json.load(open(sys.argv[2], encoding='utf-8'))
          priority = json.load(open(sys.argv[3], encoding='utf-8'))

          assert len(resources) == 51, len(resources)
          assert len(products) == 11, len(products)
          assert len({p['resource_id'] for p in products}) <= len(resources)
          distributions = sum(len(p.get('distributions', [])) for p in products)
          assert distributions == 19, distributions

          items = priority.get('items') or []
          gates = [str(item.get('gate') or '') for item in items]
          assert set(gates) == {'P1', 'P2', 'P3', 'P4', 'P5', 'P6'}, gates
          assert gates.count('P5') >= 2, gates
          assert all(item.get('access_role') in {'A', 'B', 'C', 'D', 'E'} for item in items)
          assert all(str(item.get('access_url') or '').startswith('https://') for item in items)

          print('OK: Vitrine pública 51 registros / 11 itens detalhados / 19 rotas; descoberta orientada à pergunta e curadoria preservadas')
          PY
