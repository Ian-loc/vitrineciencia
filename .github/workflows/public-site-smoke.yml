name: Verificar Vitrine publicada

on:
  workflow_run:
    workflows: ["Validar e publicar Vitrine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrine-public-site-smoke
  cancel-in-progress: true

jobs:
  public-site-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Verificar endpoints públicos após deploy
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$url" -o "$output"
          }

          fetch "$SITE/" "$tmp/index.html"
          fetch "$SITE/products.html" "$tmp/products.html"
          fetch "$SITE/sources.html" "$tmp/sources.html"
          fetch "$SITE/about.html" "$tmp/about.html"
          fetch "$SITE/analytics.html" "$tmp/analytics.html"
          fetch "$SITE/sitemap.xml" "$tmp/sitemap.xml"
          fetch "$SITE/assets/ux-v2.css" "$tmp/ux-v2.css"
          fetch "$SITE/assets/products.js" "$tmp/products.js"
          fetch "$SITE/assets/navigation.js" "$tmp/navigation.js"
          fetch "$SITE/assets/home.js" "$tmp/home.js"
          fetch "$SITE/data/data_resources.json" "$tmp/resources.json"
          fetch "$SITE/data/data_products.json" "$tmp/products.json"

          grep -q 'Encontre e compare dados científicos sobre o Brasil' "$tmp/index.html"
          grep -q 'action="products.html"' "$tmp/index.html"
          grep -q 'Explore produtos por área de pesquisa' "$tmp/index.html"
          grep -q 'id="product-filters"' "$tmp/products.html"
          grep -q 'id="product-theme"' "$tmp/products.html"
          grep -q 'id="product-coverage"' "$tmp/products.html"
          grep -q 'id="product-year-start"' "$tmp/products.html"
          grep -q 'id="product-support"' "$tmp/products.html"
          grep -q 'id="product-spatial"' "$tmp/products.html"
          grep -q 'id="product-license"' "$tmp/products.html"
          grep -q 'id="filters"' "$tmp/sources.html"
          grep -q 'Fonte → Produto → Distribuição' "$tmp/about.html"
          grep -q '<h1>Sobre o acervo</h1>' "$tmp/analytics.html"
          grep -q 'const PAGE_SIZE = 18' "$tmp/products.js"
          grep -q 'data-remove-compare' "$tmp/products.js"
          grep -q 'documentationScore(b) - documentationScore(a)' "$tmp/products.js"
          grep -q 'sourceOriginScore(b) - sourceOriginScore(a)' "$tmp/products.js"
          grep -q 'nav-toggle' "$tmp/ux-v2.css"
          grep -q 'compact-product-cards' "$tmp/ux-v2.css"
          grep -q 'products.html' "$tmp/sitemap.xml"
          grep -q 'sources.html' "$tmp/sitemap.xml"

          python3 - "$tmp/resources.json" "$tmp/products.json" <<'PY'
          import json, sys
          resources = json.load(open(sys.argv[1], encoding='utf-8'))
          products = json.load(open(sys.argv[2], encoding='utf-8'))
          assert len(resources) == 135, len(resources)
          assert len(products) == 843, len(products)
          assert len({p['resource_id'] for p in products}) <= len(resources)
          assert sum(len(p.get('distributions', [])) for p in products) == 876
          print('OK: contagens públicas 135 fontes / 843 produtos / 876 acessos')
          PY
