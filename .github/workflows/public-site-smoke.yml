name: Verificar Vitrine publicada

on:
  workflow_run:
    workflows: ["Validar e publicar Vitrine"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitrine-public-site-smoke
  cancel-in-progress: true

jobs:
  public-site-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Verificar endpoints públicos após deploy
        env:
          SITE: https://ian-loc.github.io/vitrineciencia
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local url="$1" output="$2"
            curl --fail --silent --show-error --location \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$url" -o "$output"
          }

          fetch "$SITE/" "$tmp/index.html"
          fetch "$SITE/sources.html" "$tmp/sources.html"
          fetch "$SITE/products.html" "$tmp/products.html"
          fetch "$SITE/about.html" "$tmp/about.html"
          fetch "$SITE/assets/discovery-guardrails.js" "$tmp/discovery-guardrails.js"
          fetch "$SITE/assets/static-catalog-51.js" "$tmp/static-catalog-51.js"
          fetch "$SITE/data/data_resources.json" "$tmp/resources.json"
          fetch "$SITE/data/data_products.json" "$tmp/products.json"

          grep -q 'Que fenômeno ou processo você quer investigar?' "$tmp/index.html"
          grep -q 'action="sources.html"' "$tmp/index.html"
          grep -q 'núcleo de 51 registros' "$tmp/index.html"
          grep -q 'Da pergunta ao dado em três decisões' "$tmp/index.html"

          grep -q 'id="source-theme-shortcut"' "$tmp/sources.html"
          grep -q 'id="coverage"' "$tmp/sources.html"
          grep -q 'id="information"' "$tmp/sources.html"
          grep -q 'id="access-role"' "$tmp/sources.html"
          grep -q 'Dado/produto' "$tmp/sources.html"
          grep -q 'distribuição' "$tmp/sources.html"
          grep -q 'proveniência' "$tmp/sources.html"

          grep -q 'Subconjunto detalhado' "$tmp/products.html"
          grep -q '11 itens com 19 rotas de acesso detalhadas' "$tmp/products.html"
          grep -q 'id="product-theme"' "$tmp/products.html"
          grep -q 'id="product-coverage"' "$tmp/products.html"
          grep -q 'id="product-kind"' "$tmp/products.html"
          grep -q 'id="product-access"' "$tmp/products.html"

          ! grep -E -q 'arquitetura científica interna|Fonte → Produto → Distribuição|snapshot candidato|Decisão arquitetural|Direção experimental' \
            "$tmp/index.html" "$tmp/products.html" "$tmp/sources.html" "$tmp/about.html"
          ! grep -E -q 'data/quarantine|v1.0.0-expanded' \
            "$tmp/index.html" "$tmp/products.html" "$tmp/sources.html" "$tmp/about.html"

          python3 - "$tmp/resources.json" "$tmp/products.json" <<'PY'
          import json, sys
          resources = json.load(open(sys.argv[1], encoding='utf-8'))
          products = json.load(open(sys.argv[2], encoding='utf-8'))
          assert len(resources) == 51, len(resources)
          assert len(products) == 11, len(products)
          assert len({p['resource_id'] for p in products}) <= len(resources)
          distributions = sum(len(p.get('distributions', [])) for p in products)
          assert distributions == 19, distributions
          print('OK: Vitrine pública 51 registros / 11 itens detalhados / 19 rotas de acesso')
          PY
