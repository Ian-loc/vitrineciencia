name: One-shot IBGE atlas territorial batch

on:
  push:
    branches: ["audit/ibge-atlas-territorial-20260816"]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ibge-atlas-territorial-20260816
          fetch-depth: 0

      - name: Append verified IBGE records
        shell: python
        run: |
          import csv, json
          from pathlib import Path

          root = Path('.')
          verified = '2026-08-16'

          def append_dicts(path, rows, key):
              with path.open(encoding='utf-8-sig', newline='') as f:
                  reader = csv.DictReader(f)
                  fields = reader.fieldnames
                  existing = list(reader)
              existing_ids = {r[key] for r in existing}
              collisions = existing_ids.intersection(r[key] for r in rows)
              if collisions:
                  raise SystemExit(f'ID collision in {path}: {sorted(collisions)}')
              with path.open('a', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields, lineterminator='\n')
                  for row in rows:
                      missing = set(fields) - set(row)
                      extra = set(row) - set(fields)
                      if missing or extra:
                          raise SystemExit(f'Field mismatch {path}: missing={missing}, extra={extra}')
                      writer.writerow(row)

          resources = [
            {
              'resource_id':'DR0084','resource_name':'Análises do Território — IBGE','acronym':'Análises do Território IBGE','official_identity':'Tema institucional de Análises do Território da Diretoria de Geociências do IBGE','description':'Família de estudos geográficos integrados que combinam estatísticas, cartografia, pesquisa de campo e análise territorial para interpretar processos de organização e transformação do território brasileiro.','homepage_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/analises-do-territorio/18939-a-geografia-da-cana-de-acucar.html','data_access_url':'https://www.ibge.gov.br/geociencias/todos-os-produtos-geociencias.html','research_areas':'Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação | Geografia Econômica','keywords':'análises do território | dinâmica territorial | produção agropecuária | café | cana-de-açúcar | IBGE','data_product_types':'estudos territoriais | publicações | mapas interativos | aplicações PGI','data_formats':'PDF | aplicação web | formatos variáveis por produto','visualization_types':'mapas | Plataforma Geográfica Interativa | gráficos | textos analíticos','geographic_coverage':'Brasil; recortes subnacionais conforme produto','covers_brazil':'sim','spatial_resolution':'varia conforme produto, fonte estatística e cartografia utilizada','temporal_coverage':'varia conforme estudo; séries históricas e snapshots temáticos','temporal_resolution':'varia conforme produto','data_sources':'PAM | Censo Agropecuário | CEMPRE | Pesquisa de Estoques | outras estatísticas oficiais | pesquisa de campo e bibliográfica','free_download':'sim','access_conditions':'consulta e downloads públicos conforme produto','programmatic_access':'desconhecido','access_protocols':'HTTPS web | aplicações web | downloads','authentication_required':'não','access_documentation_url':'https://www.ibge.gov.br/geociencias/todos-os-produtos-geociencias.html','license':'licença específica deve ser verificada por produto/distribuição; não inferida nesta auditoria','institutional_status':'público','owner_or_manager':'IBGE — Diretoria de Geociências','academic_uses':'Análise da dinâmica territorial da agropecuária, cadeias produtivas, reestruturação do espaço rural, desenvolvimento regional e relações campo-cidade.','limitations':'A família reúne estudos de síntese com fontes, períodos, escalas e métodos diferentes; não deve ser tratada como série estatística homogênea nem como mapeamento direto de cobertura da terra.','academic_evidence_type':'documentação técnica oficial','academic_evidence_url':'https://www.ibge.gov.br/geociencias/organizacao-do-territorio/analises-do-territorio/18939-a-geografia-da-cana-de-acucar.html','academic_evidence_note':'A navegação oficial do IBGE mantém Análises do Território como tema da Organização do Território; os produtos Café e Cana documentam combinação de análise estatística espacial, fontes oficiais, campo e bibliografia.','verification_url':'https://www.ibge.gov.br/geociencias/todos-os-produtos-geociencias.html','last_verified':verified
            },
            {
              'resource_id':'DR0085','resource_name':'Atlas — IBGE','acronym':'Atlas IBGE','official_identity':'Família institucional de atlas nacionais e temáticos da Diretoria de Geociências do IBGE','description':'Família de atlas geográficos do IBGE que integra mapas, estatísticas, gráficos, textos e análises para sínteses nacionais ou temáticas, com produtos digitais, publicações e aplicações interativas.','homepage_url':'https://www.ibge.gov.br/geociencias/atlas/nacional/16360-atlas-nacional-do-brasil.html','data_access_url':'https://geoftp.ibge.gov.br/atlas/','research_areas':'Planejamento Territorial e Políticas Públicas | Sensoriamento Remoto e Geoinformação | Ciências Ambientais e Ecologia','keywords':'atlas | geografia | território | espaço rural | mapas | PGI | IBGE','data_product_types':'atlas | publicações | mapas | aplicações interativas | sínteses geográficas','data_formats':'PDF | aplicação web | arquivos cartográficos e tabulares conforme produto','visualization_types':'atlas digital | mapas | gráficos | Plataforma Geográfica Interativa','geographic_coverage':'Brasil; recortes temáticos e subnacionais conforme produto','covers_brazil':'sim','spatial_resolution':'heterogênea; depende de cada mapa, camada e edição','temporal_coverage':'edições históricas e contemporâneas conforme atlas','temporal_resolution':'por edição e por camada','data_sources':'IBGE | outras instituições públicas | Censos | pesquisas agropecuárias | bases geocientíficas e territoriais','free_download':'sim','access_conditions':'consulta e downloads públicos conforme produto','programmatic_access':'desconhecido','access_protocols':'HTTPS web | HTTP download | aplicações web','authentication_required':'não','access_documentation_url':'https://www.ibge.gov.br/geociencias/atlas/nacional/16360-atlas-nacional-do-brasil.html','license':'licença específica deve ser verificada por produto/distribuição; não inferida nesta auditoria','institutional_status':'público','owner_or_manager':'IBG