name: Vitrine audit 119 normalize
on:
  push:
    branches: [agent/vitrine-audit-119]
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[normalized-119]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/vitrine-audit-119
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: git fetch origin main
      - name: Normalize and validate
        run: python scripts/normalize_vitrine_audit_119.py
      - name: Remove one-shot helpers and commit
        run: |
          rm -f scripts/normalize_vitrine_audit_119.py .github/workflows/vitrine-audit-119-normalize.yml
          git add -u
          git status --short
          if git diff --cached --quiet; then echo 'No material changes'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve canonical CSV baseline [normalized-119]'
          git push origin HEAD:agent/vitrine-audit-119
