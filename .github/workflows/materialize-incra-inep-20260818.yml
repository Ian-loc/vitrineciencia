          with distributions_path.open(encoding="utf-8-sig", newline="") as f:
              existing_distributions = list(csv.DictReader(f))

          existing_pids = {r["product_id"] for r in existing_products}
          existing_urls = {r["product_page_url"].strip().rstrip("/") for r in existing_products}
          existing_dids = {r["distribution_id"] for r in existing_distributions}

          for row in product_rows:
              if row[0] in existing_pids:
                  raise SystemExit(f"duplicate product id: {row[0]}")
              if row[19].strip().rstrip("/") in existing_urls:
                  raise SystemExit(f"duplicate canonical product URL: {row[19]}")
          for row in distribution_rows:
              if row[0] in existing_dids:
                  raise SystemExit(f"duplicate distribution id: {row[0]}")

          with products_path.open("a", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator="\n").writerows(product_rows)
          with distributions_path.open("a", encoding="utf-8", newline="") as f:
              csv.writer(f, lineterminator="\n").writerows(distribution_rows)

          print("APPENDED", len(product_rows), len(distribution_rows))
          PY

      - name: Validate and rebuild
        shell: bash
        run: |
          python scripts/validate_brazil_scope.py
          python scripts/validate_product_catalog.py
          python scripts/build_catalog.py
          python scripts/audit_link_roles.py --write
          python scripts/validate_vitrine.py
          python scripts/build_site_artifact.py
          git diff --check

      - name: Read-back relational integrity
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = list(csv.DictReader(Path("data/data_products.csv").open(encoding="utf-8-sig", newline="")))
          d = list(csv.DictReader(Path("data/product_distributions.csv").open(encoding="utf-8-sig", newline="")))
          s = list(csv.DictReader(Path("data/data_resources.csv").open(encoding="utf-8-sig", newline="")))
          pids = {r["product_id"] for r in p}
          rids = {r["resource_id"] for r in s}
          dids = [r["distribution_id"] for r in d]
          assert len(pids) == len(p)
          assert len(set(dids)) == len(dids)
          assert all(r["resource_id"] in rids for r in p)
          assert all(r["product_id"] in pids for r in d)
          expected_p = {f"DP{i:06d}" for i in range(745, 757)}
          expected_d = {f"DD{i:06d}" for i in range(776, 788)}
          assert expected_p <= pids
          assert expected_d <= set(dids)
          print("READBACK", len(s), len(p), len(d))
          PY

      - name: Remove one-shot workflow and commit validated batch
        shell: bash
        run: |
          rm -f .github/workflows/materialize-incra-inep-20260818.yml
          git config user.name "Vitrine Science Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data_products.csv data/product_distributions.csv data/data_products.json data/data_quality_report.json data/link_role_audit.json
          git add -u .github/workflows/materialize-incra-inep-20260818.yml
          git status --short
          git commit -m "Expand verified INCRA and INEP indicator catalog"
          git push origin HEAD:agent/vitrine-incra-inep-indicators-20260818
