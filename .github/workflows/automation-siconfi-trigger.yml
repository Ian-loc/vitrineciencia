name: Automation trigger Siconfi materializer

on:
  push:
    branches: ["main"]
    paths: [".siconfi-materialize-trigger"]

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch Siconfi materializer workflow
        run: |
          printf '\n# triggered %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .github/workflows/automation-siconfi-batch.yml
          git config user.name "vitrine-automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/automation-siconfi-batch.yml
          git commit -m "Trigger verified Siconfi materialization"
          git push origin HEAD:main
